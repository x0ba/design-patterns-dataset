# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "gantt-timeline". Edit between batches only — see README "Rules".
id: gantt-timeline
name: Gantt timeline
level: pattern
parent: schedule
aliases:
  - Gantt chart
  - project timeline
  - roadmap timeline
  - bar schedule
definition: Tasks or phases as bars on a horizontal time axis, often with dependencies, progress and
  a hierarchical work breakdown beside the bars.
data: time
platforms:
  - web
  - desktop
domains:
  - productivity
  - enterprise
  - software
  - design
anatomy:
  - name: Time axis
    role: Days, weeks or months along the top
  - name: Task rows
    role: The work-breakdown list
  - name: Bars
    role: Duration and placement of each task
  - name: Dependencies
    role: Links between bars
  - name: Today marker
    role: The current date on the axis
roles:
  - task-name
  - start
  - end
  - progress
  - assignee
  - dependency
dimensions:
  - name: Bar and row content
    family: content
    question: What does each bar and row say about the work?
    subdimensions:
      - id: barAttrs
        name: Bar attributes
        select: many
        values:
          - id: title-on-bar
            name: Title on bar
            example: Asana Timeline
          - id: progress-fill
            name: Progress fill
            example: Microsoft Project
          - id: assignee-colour-or-avatar
            name: Assignee colour or avatar
            example: Jira Timeline
          - id: milestone-diamond
            name: Milestone diamond
            example: Roadmunk
          - id: baseline-vs-actual
            name: Baseline vs actual
            description: Planned bar under actual
            example: MS Project baseline
          - id: health-or-status-colour
            name: Health or status colour
            example: Smartsheet
      - id: rowHierarchy
        name: Row hierarchy
        select: one
        values:
          - id: flat-list
            name: Flat list
            example: Simple roadmaps
          - id: collapsible-wbs
            name: Collapsible WBS
            description: Parents summarise children
            example: MS Project
          - id: swimlanes-by-person-or-team
            name: Swimlanes by person or team
            example: Jira Timeline by assignee
          - id: grouped-by-project
            name: Grouped by project
            example: Notion timeline group by
  - name: Dependencies and constraints
    family: composition
    question: How are tasks linked, and what may move freely?
    subdimensions:
      - id: linking
        name: Linking
        select: many
        values:
          - id: no-links
            name: No links
            description: Independent bars
            example: Lightweight roadmaps
          - id: finish-to-start-arrows
            name: Finish-to-start arrows
            example: MS Project
          - id: multiple-dependency-types
            name: Multiple dependency types
            description: FS, SS, FF, SF
            example: Primavera P6
          - id: parent-roll-up
            name: Parent roll-up
            description: Parent spans children
            example: Jira Advanced Roadmaps
          - id: critical-path-highlight
            name: Critical path highlight
            example: MS Project critical path
  - name: Timeline layout
    family: layout
    question: How are axis scale and panes arranged?
    subdimensions:
      - id: chrome
        name: Chrome
        select: one
        values:
          - id: list-plus-timeline
            name: List plus timeline
            description: Split pane WBS | bars
            example: MS Project
          - id: timeline-only
            name: Timeline only
            example: Product roadmap slides
          - id: multi-tier-time-header
            name: Multi-tier time header
            description: Year / quarter / month
            example: Smartsheet
          - id: compact-mobile-strip
            name: Compact mobile strip
            description: Limited desktop parity
            example: Asana mobile timeline
      - id: ganttScale
        name: Scale
        select: one
        values:
          - id: day
            name: Day
            example: Short sprints
          - id: week
            name: Week
            example: Asana
          - id: month-quarter
            name: Month / quarter
            example: Product roadmaps
          - id: zoom-slider
            name: Zoom slider
            description: Continuous scale
            example: Jira Timeline zoom
  - name: Editing bars
    family: invocation
    question: How are start, end and links changed?
    subdimensions:
      - id: editGestures
        name: Edit gestures
        select: many
        values:
          - id: drag-bar-to-move
            name: Drag bar to move
            example: Asana Timeline
          - id: drag-ends-to-resize
            name: Drag ends to resize
            example: MS Project
          - id: draw-dependency
            name: Draw dependency
            description: Drag from handle to successor
            example: Jira
          - id: edit-in-row-fields
            name: Edit in row fields
            description: Type dates in the grid
            example: Smartsheet
          - id: bulk-shift
            name: Bulk shift
            description: Move many bars together
            example: Project plans
  - name: Planning vs tracking
    family: feedback
    question: How does the timeline show plan quality and slippage?
    subdimensions:
      - id: statusFeedback
        name: Status feedback
        select: many
        values:
          - id: today-line
            name: Today line
            example: Almost all Gantts
          - id: late-bars-flagged
            name: Late bars flagged
            example: Asana overdue
          - id: baseline-variance
            name: Baseline variance
            example: MS Project
          - id: percent-complete
            name: Percent complete
            example: Smartsheet
          - id: load-or-capacity-hints
            name: Load or capacity hints
            description: Overallocation marks
            example: Resource views in Project
  - name: Whose plan
    family: collaboration
    question: Who can edit, and how are parallel plans reconciled?
    subdimensions:
      - id: sharing
        name: Sharing
        select: one
        values:
          - id: single-editor
            name: Single editor
            example: Desktop MSP files
          - id: co-editing-live
            name: Co-editing live
            example: Smartsheet
          - id: publish-read-only-roadmap
            name: Publish read-only roadmap
            example: Productboard / Aha!
          - id: suggest-dates-for-approval
            name: Suggest dates for approval
            example: Agency client reviews
wild:
  score: 2
  note: Zoom, grouping and which fields appear on bars are often configurable in PM tools; dependency
    semantics rarely are.
  examples:
    - name: Jira Timeline
      note: Zoom and field display
    - name: Asana Timeline
      note: Sort, colour and dependency toggles
    - name: Notion
      note: Timeline view properties and group by
techniques:
  - name: Fluid bar fields
    dimension: Bar and row content
    how: Surface any task attribute onto bars (risk, estimate, team) and use it for colour or label;
      hide the rest per viewer.
    ai: false
  - name: Dependency preview
    dimension: Dependencies and constraints
    how: While dragging, show which successors will move and by how much before release.
    ai: false
  - name: Replan from a goal date
    dimension: Planning vs tracking
    how: “Hit launch by June 1” proposes date shifts and flags impossible dependencies with inspectable
      rationale.
    ai: true
signature: Fluid bar fields
sample: Microsoft Project, Smartsheet, Jira Timeline / Advanced Roadmaps, Asana Timeline, Linear
  initiatives, Notion timeline, Primavera.
unit: One timeline view over one project or portfolio.
relations:
  uses:
    - split-pane
    - drag-reorder
    - filter-controls
    - progress-indicator
    - property-inspector
  specializes:
    - schedule
  neighbors:
    - kanban-board
    - calendar
    - task-list
    - timeline-editor
