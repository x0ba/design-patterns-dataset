  raterNotes:
    fable:
      - "chrome is pick-one but List plus timeline and Multi-tier time header co-occur in nearly
        every tool; I followed the Smartsheet exemplar once and coded the WBS pane otherwise.
        ganttScale: coded Zoom slider whenever a zoom control exists, the default preset only when
        there is none."
      - ganttScale mixes a control (Zoom slider) with default grains (Day, Week, Month); nearly
        every product has preset zoom levels, so the gloss should say to code the default grain and
        reserve Zoom slider for a continuous control. Health or status colour and Critical path
        highlight overlap when critical bars are red.
    opus:
      - "ganttScale forced a single answer out of products whose timescale is a configurable
        dropdown (Smartsheet, monday, ClickUp, Airtable): I coded the default the product opens at,
        reserving Zoom slider for continuous controls, so that column is the least reliable here.
        rowHierarchy's Grouped by project and Swimlanes by person or team are the same mechanism
        (group-by) pointed at different fields, which made several cells a coin flip decided by the
        view's default grouping."
      - "ganttScale is the entry's fault line: Zoom slider is glossed 'continuous', so a
        Day/Week/Month/Quarter toggle has to be coded as its default scale instead, and one rater
        coding every zoom control as Zoom slider accounts for most of this entry's disagreement. It
        needs a 'preset zoom steps' value. barAttrs' Title on bar is the second: in
        list-plus-timeline schedulers the name is in the table, not on the bar."
    sonnet:
      - ganttScale for one product (Notion timeline) got '?' since I couldn't confidently recall
        whether its zoom is continuous or a set of discrete view steps.
      - "The biggest codebook problem in this entry is 'ganttScale': Day, Week and Month / quarter
        name the axis grain while Zoom slider names an interaction, so almost every product is both
        and raters split on whether to code what the axis shows or how it is changed — it should be
        two sub-dimensions (current grain; scale control: presets vs continuous). 'chrome' has the
        same fault: List plus timeline and Timeline only describe pane arrangement, Multi-tier time
        header describes the header, and Compact mobile strip describes a platform, so Smartsheet
        and GitHub are two of them at once and the pick-one forces a false choice. Third, 'linking'
        has an explicit 'No links' variation, which makes an empty array ambiguous — the protocol
        should say that products with no dependencies take ['No links'], not []. Fourth,
        'rowHierarchy: Grouped by project' is really 'grouped by any field' and does not cover
        Asana's grouping by section within one project. Finally, my own round-1 pick-any codes
        across barAttrs, editGestures and statusFeedback were systematically too thin — I recorded
        the most salient attribute rather than every one that applies."
