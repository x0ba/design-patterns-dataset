# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "object-viewer-3d". Edit between batches only — see README "Rules".
id: object-viewer-3d
name: 3D object viewer
level: pattern
parent: explore-space
aliases:
  - model viewer
  - 3D viewer
  - orbit viewer
  - product 3D
definition: A three-dimensional model presented for inspection — orbit, pan, zoom and sometimes
  explode or cross-section — to understand form, fit or configuration.
data: object
platforms:
  - web
  - mobile
  - desktop
  - xr
domains:
  - commerce
  - design
  - science
  - education
  - entertainment
  - enterprise
anatomy:
  - name: Viewport
    role: The 3D camera view
  - name: Model
    role: Meshes, materials and hierarchy
  - name: Camera controls
    role: Orbit, pan, zoom, presets
  - name: Hotspots or BOM
    role: Selectable parts and labels
  - name: Display modes
    role: Shading, section, explode
roles:
  - part
  - material
  - dimension
  - hotspot
  - camera
dimensions:
  - name: What the model shows
    family: content
    question: How much of the object’s structure and metadata is exposed?
    subdimensions:
      - id: modelContent
        name: Model content
        select: many
        values:
          - id: single-mesh-beauty-shot
            name: Single mesh beauty shot
            example: Shopify 3D product viewers
          - id: part-hierarchy-bom
            name: Part hierarchy / BOM
            description: Selectable assemblies
            example: Autodesk Viewer
          - id: measurements-and-pmi
            name: Measurements and PMI
            description: Dimensions on the model
            example: CAD web viewers
          - id: hotspot-callouts
            name: Hotspot callouts
            description: Anchored labels
            example: Sketchfab annotations
          - id: configured-variants
            name: Configured variants
            description: Materials and options
            example: Nike By You 3D
          - id: scientific-overlays
            name: Scientific overlays
            description: Scalars on the surface
            example: Medical / CFD viewers
      - id: appearanceModes
        name: Appearance modes
        select: many
        values:
          - id: realistic-materials
            name: Realistic materials
            example: Sketchfab
          - id: wireframe-x-ray
            name: Wireframe / x-ray
            example: Many CAD viewers
          - id: exploded-view
            name: Exploded view
            example: Technical illustration modes
          - id: section-plane
            name: Section plane
            example: Autodesk section analysis
          - id: ar-in-the-room
            name: AR in the room
            description: Place model via camera
            example: Apple AR Quick Look, Shopify AR
          - id: abstract-representation
            name: Abstract representation
            description: Domain-specific renderings that are neither photoreal nor wireframe — molecular
              ribbons, sticks and surfaces, schematic shading — where the representation is a
              scientific convention rather than a material
            example: NCBI iCn3D — Protein structure viewer
  - name: Camera control
    family: invocation
    question: How does the person change viewpoint?
    subdimensions:
      - id: cameraControls
        name: Controls
        select: many
        values:
          - id: orbit-drag
            name: Orbit drag
            example: Sketchfab
          - id: turntable-auto-spin
            name: Turntable auto-spin
            example: Product pages
          - id: zoom-to-cursor-pinch
            name: Zoom to cursor / pinch
            example: model-viewer
          - id: pan
            name: Pan
            example: CAD viewers
          - id: preset-cameras
            name: Preset cameras
            description: Front / iso / named views
            example: Autodesk Viewer
          - id: walkthrough-first-person
            name: Walkthrough / first person
            example: Matterport-style spaces
          - id: xr-grab-and-scale
            name: XR grab and scale
            example: Vision Pro / Quest viewers
          - id: move-the-device
            name: Move the device
            description: In phone AR the viewpoint is the device camera; the person changes view by moving the
              phone, while gestures move the object
            example: IKEA — View in your room
  - name: Part selection and detail
    family: composition
    question: How does selecting geometry open information?
    subdimensions:
      - id: partSelection
        name: Selection
        select: one
        values:
          - id: whole-object-only
            name: Whole-object only
            description: No part picking
            example: Simple product spin
          - id: click-part-for-properties
            name: Click part for properties
            example: Autodesk Viewer
          - id: hotspot-anchors-only
            name: Hotspot anchors only
            description: Predefined points
            example: Sketchfab annotations
          - id: linked-bom-table
            name: Linked BOM table
            description: List and model synchronized
            example: Engineering viewers
          - id: configure-then-refresh
            name: Configure then refresh
            description: Options rebuild the mesh
            example: Car configurators
  - name: Viewer chrome
    family: layout
    question: How is the 3D view arranged with controls and metadata?
    subdimensions:
      - id: viewerChrome
        name: Chrome
        select: one
        values:
          - id: full-bleed-with-floating-tools
            name: Full-bleed with floating tools
            example: Sketchfab embed
          - id: side-bom-plus-view
            name: Side BOM + view
            example: CAD web apps
          - id: thumbnail-strip-of-cameras
            name: Thumbnail strip of cameras
            example: Some real-estate 3D tours
          - id: inline-in-a-product-gallery
            name: Inline in a product gallery
            description: One slot among photos
            example: Amazon 3D / AR modules
          - id: immersive-fullscreen-xr
            name: Immersive fullscreen / XR
            example: Quick Look
  - name: Loading and fidelity
    family: lifecycle
    question: How does the model arrive and refine?
    subdimensions:
      - id: modelLoading
        name: Loading
        select: one
        values:
          - id: single-download-then-view
            name: Single download then view
            example: Small glTF embeds
          - id: progressive-lod
            name: Progressive LOD
            description: Coarse then detailed
            example: Google model-viewer / CDN LODs
          - id: streamed-tiles
            name: Streamed tiles
            description: Large environments
            example: Cesium, Photogrammetry clouds
          - id: placeholder-then-enhance
            name: Placeholder then enhance
            description: Static image until 3D ready
            example: Commerce sites
  - name: Guidance
    family: initiative
    question: Who directs attention in the scene?
    subdimensions:
      - id: sceneGuidance
        name: Guidance
        select: one
        values:
          - id: free-explore
            name: Free explore
            example: Sketchfab
          - id: guided-tour-of-hotspots
            name: Guided tour of hotspots
            description: Auto camera path
            example: Product story tours
          - id: assisted-find-a-part
            name: Assisted find a part
            description: Search highlights geometry
            example: CAD search
          - id: ai-explain-this-view
            name: AI explain this view
            description: Caption the current camera
            example: Research / support demos
wild:
  score: 1
  note: Display mode toggles appear in CAD; consumer product viewers rarely let shoppers change
    encodings.
  examples:
    - name: Autodesk Viewer
      note: Display modes and settings
    - name: Sketchfab
      note: Annotation and VR toggles
techniques:
  - name: BOM as Fluid Attributes
    dimension: What the model shows
    how: Any part property in the inspector can be surfaced as colour, label or filter on the model —
      collection Fluid Attributes applied to assemblies.
    ai: false
  - name: Named cameras as links
    dimension: Camera control
    how: Saved camera + display mode pairs become shareable URLs for support and design review.
    ai: false
  - name: Show me the issue
    dimension: Guidance
    how: “Highlight the hinge that fails the drop test” moves the camera, sections the mesh and cites
      the source note.
    ai: true
signature: BOM as Fluid Attributes
sample: Sketchfab, Google model-viewer embeds, Shopify 3D/AR, Autodesk Viewer, Matterport, car and
  furniture configurators, NCBI / scientific 3D viewers.
unit: One model in one viewer session (including AR placement if offered).
relations:
  uses:
    - property-inspector
    - tooltip
    - progress-indicator
    - carousel
  specializes:
    - explore-space
  neighbors:
    - zoomable-canvas
    - map-explorer
scores:
  ubiquity: 3
  potential: 4
  spec: 3
evidence: agent-coded
usage:
  - Shoppers orbit for material and scale; engineers section and explode
  - AR placement answers size questions photos cannot
questions:
  - When is 3D worth the load cost over a spiral gallery?
  - How should part-level accessibility labels work for screen-reader users of spatial viewers?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.7500053847278833
  agreementFirstPass: 0.848
  kappaFinal: 0.8647145407889893
  agreementFinal: 0.9145833333333333
  pass: true
