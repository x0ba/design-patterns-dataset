  unresolved: []
  proposals:
    raised: 3
    adopted:
      - sub: cameraControls
        name: Move the device
        raters:
          - fable
          - sonnet
      - sub: appearanceModes
        name: Abstract representation
        raters:
          - opus
          - sonnet
    recorded:
      - place: sub:appearanceModes
        sub: appearanceModes
        dim: null
        name: Representation styles
        gloss: Scientific viewers switch among ribbon, stick, ball-and-stick and surface representations
          rather than materials or wireframe
        raters:
          - fable
        instances:
          - 12
          - 13
        status: raised
  raterNotes:
    fable:
      - modelLoading is largely unobservable from product knowledge; I inferred it from viewer
        technology (poster images on commerce sites, streaming in CAD and Matterport) and it should
        be treated as low confidence.
    opus:
      - viewerChrome has no value for a configurator's options rail, so Tesla, Porsche and Nike went
        under Side BOM + view with a note; it is the cell I would expect to split. modelLoading is
        also largely invisible from product knowledge — I inferred Progressive LOD and Streamed
        tiles from what the products must do with large assemblies and scans rather than from
        something the interface says.
    sonnet:
      - sceneGuidance was 'Free explore' for nearly every instance except the two tools that
        explicitly name guided or curated tours (Sketchfab-adjacent Smithsonian Voyager); most
        product/commerce/CAD viewers don't describe any directed attention mechanism.
      - "Three real problems. (1) appearanceModes has no term between Realistic materials and
        Wireframe: molecular ribbons and plain grey CAD shading both get coded as 'realistic' for
        want of anywhere else — two raters independently proposed a variation for it (opus's
        Abstract representation, fable's Representation styles), so it is variation-worthy. (2)
        cameraControls has no term for phone AR, where the device is the camera; two raters proposed
        one here too, and the same gap shows up in the archetype entry under a third name (Move your
        body), so the codebook should settle on one. (3) 'Single download then view' and
        'Placeholder then enhance' overlap badly — nearly every web viewer shows a poster while the
        asset downloads, which is why this sub split four ways across the commerce instances.
        sceneGuidance is also pick-one but conflates the default mode with an available capability,
        which split every CAD and science viewer between Free explore and Assisted find a part."
