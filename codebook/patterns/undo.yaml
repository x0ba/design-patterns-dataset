  raterNotes:
    fable:
      - "window: coded 'Version history' only where the product's version history is part of the
        sample's description (Docs, Figma, Canva, VS Code), 'Session' for other editors even when
        they also keep versions (Word/OneDrive). preview: toasts that name the action ('Task
        completed - Undo') were read as Named action."
      - window's Version history exemplar (Docs) is a recovery mechanism apart from the undo stack,
        so raters cannot tell whether the sub codes the stack or any recovery. preview is pick one
        but a product's shortcut and its toast differ. Seconds has no room for a two-minute recall.
    opus:
      - "window's three values do not fit cleanly: iMessage's two minutes is neither seconds nor
        version history, and several editors (VS Code, Vim, Canva) have a session stack and a
        separate long-term recovery store at once, so I coded the undo stack and noted the other.
        unit's Per-object history never fired — the codebook names Figma for it, but Figma's Cmd+Z
        is an ordinary per-user linear stack, which is worth checking before round two."
      - window (and with it unit and preview) assumes one undo mechanism per product, but Docs,
        Figma, VS Code and Canva each have a session stack and a version history with different
        answers, so a rater has to decide which mechanism the entry is about before coding anything
        — that choice, not the products, is what split us. preview does not distinguish naming the
        action beforehand from reporting it afterwards, which is what Vim exposes. Single-user stack
        is glossed 'Desktop apps' but reads as 'there is no stack shared with anyone', so
        collaborative products with a private stack can be coded either way. access has no value for
        a menu item — Finder's Edit menu, Explorer's context menu, iMessage's long-press menu are
        all coded as toolbar buttons or as proposals.
    sonnet:
      - Several tools (VS Code, Canva) blur session-scoped undo with a separate, longer-lived
        version-history feature; coded the more persistent/distinguishing value (Version history)
        where the sample named it explicitly.
      - "Two codebook problems and one of my own recurring errors. (1) unit's Many levels and Jump
        to a past state collapse together whenever a tool combines an everyday step-back stack with
        a separate way to jump straight to a named/timestamped point (Google Docs' version history,
        Word's undo dropdown) — both genuinely apply at once, and the tie-break (take the
        first-listed value) mechanically favors Many levels, which is worth a codebook note rather
        than treating each case as a fresh disagreement. (2) Two pairs of raters proposed
        near-identical new access variations under different names for the same mechanic (touch
        gestures: fable's 'Multi-finger gesture' / opus's 'Touch gesture' / my own 'Multi-finger tap
        gesture'; context-menu recall: fable's 'Context menu on the item' / opus's 'Context menu on
        the object' / my own 'Long-press context menu') — a real coordination gap where the finding
        was right three times over but the naming never converged, which cost real signal in the
        kappa calculation. (3) My own recurring error, not a codebook gap: for window and multiUser
        I had judged case by case whether a tool's separate version-history feature or
        shared-editing context was 'central enough' to count, and did so inconsistently across
        genuinely similar products (Figma vs VS Code vs Canva) — on reconciliation I applied one
        consistent rule (the undo command's own stack is session-bound; a separate snapshot/history
        feature doesn't change that; a shared/collaborative editing context makes multiUser Only my
        own changes) across all three instead of judging each on a vibe."
