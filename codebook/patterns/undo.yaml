# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "undo". Edit between batches only — see README "Rules".
id: undo
name: Undo
level: component
parent: transact
aliases:
  - undo and redo
  - history
  - revert
definition: Reversing recent actions.
data: sequence
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - design
  - software
  - communication
anatomy:
  - name: History
    role: Actions that can be reversed
  - name: Trigger
    role: How to reverse
  - name: Label
    role: What will be reversed
roles: []
dimensions:
  - name: Unit
    family: scope
    question: What can be undone?
    subdimensions:
      - id: unit
        name: Unit
        select: one
        values:
          - id: last-action-only
            name: Last action only
            example: Simple apps
          - id: many-levels
            name: Many levels
            example: Most editors
          - id: per-object-history
            name: Per-object history
            example: Figma layer history
          - id: jump-to-a-past-state
            name: Jump to a past state
            example: Photoshop History panel
  - name: Access
    family: invocation
    question: How is it triggered?
    subdimensions:
      - id: access
        name: Access
        select: many
        values:
          - id: keyboard-shortcut
            name: Keyboard shortcut
            example: Cmd+Z
          - id: toolbar-button
            name: Toolbar button
            example: Google Docs
          - id: undo-in-a-toast
            name: Undo in a toast
            example: Gmail
          - id: shake
            name: Shake
            example: iOS shake to undo
          - id: history-panel
            name: History panel
            example: Photoshop
          - id: multi-finger-gesture
            name: Multi-finger gesture
            description: A touch gesture such as a two-finger tap or three-finger swipe triggers undo, distinct
              from shaking the device
            example: Apple Notes — Shake to undo on iPhone
          - id: context-menu-on-the-item
            name: Context menu on the item
            description: Undo is offered in the long-press or right-click menu of the thing just acted on, not
              globally
            example: iMessage — Undo Send
          - id: touch-gesture
            name: Touch gesture
            description: A multi-finger tap or swipe on the canvas or page undoes, with no button, shortcut or
              toast involved (Procreate's two-finger tap, iOS three-finger swipe)
            example: Apple Notes — Shake to undo on iPhone
          - id: context-menu-on-the-object
            name: Context menu on the object
            description: Undo is reached by long-pressing or right-clicking the affected object itself — the
              sent message, the moved file — rather than from any global undo control
            example: iMessage — Undo Send
  - name: Window
    family: lifecycle
    question: How long is undo possible?
    subdimensions:
      - id: window
        name: Window
        select: one
        values:
          - id: session
            name: Session
            example: Most editors
          - id: seconds
            name: Seconds
            example: Gmail undo send
          - id: version-history
            name: Version history
            example: Google Docs
  - name: Multiple people
    family: collaboration
    question: Whose actions are undone?
    subdimensions:
      - id: multiUser
        name: Multi-user
        select: one
        values:
          - id: single-user-stack
            name: Single-user stack
            example: Desktop apps
          - id: only-my-own-changes
            name: Only my own changes
            example: Google Docs
          - id: everyone-s
            name: Everyone’s
            example: Shared whiteboards without per-user undo
  - name: Preview
    family: feedback
    question: Does it say what will be undone?
    subdimensions:
      - id: preview
        name: Preview
        select: one
        values:
          - id: no
            name: No
            example: Web apps
          - id: named-action
            name: Named action
            example: Undo Typing in macOS Edit menu
          - id: visual-preview
            name: Visual preview
            example: History state thumbnails
