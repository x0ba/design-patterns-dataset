# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "spreadsheet". Edit between batches only — see README "Rules".
id: spreadsheet
name: Spreadsheet
level: pattern
parent: enter-data
aliases:
  - worksheet
  - grid of cells
definition: A grid of cells holding values and formulas, where the person defines both the structure
  and the computation.
data: schema
platforms:
  - desktop
  - web
  - mobile
domains:
  - finance
  - enterprise
  - science
  - productivity
  - education
anatomy:
  - name: Grid
    role: Rows and columns
  - name: Cell
    role: A value or formula
  - name: Formula bar
    role: The source of the selected cell
  - name: Sheets
    role: Tabs of grids
roles: []
dimensions:
  - name: Cell content
    family: content
    question: What can a cell hold?
    subdimensions:
      - id: cells
        name: Cell content
        select: many
        values:
          - id: values
            name: Values
            example: All spreadsheets
          - id: formulas
            name: Formulas
            example: All spreadsheets
          - id: rich-data-types
            name: Rich data types
            example: Excel Stocks and Geography types
          - id: smart-chips
            name: Smart chips
            example: Google Sheets people and file chips
          - id: checkboxes-and-dropdowns
            name: Checkboxes and dropdowns
            example: Google Sheets
          - id: model-powered-functions
            name: Model-powered functions
            example: Google Sheets AI function
          - id: action-buttons
            name: Action buttons
            description: A cell holds a button that runs an action (add a row, call an automation) rather than a
              value
            example: Coda — Table inside a doc
  - name: Structure
    family: composition
    question: How much structure is imposed on the grid?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: free-grid
            name: Free grid
            example: Classic spreadsheets
          - id: tables-inside-the-grid
            name: Tables inside the grid
            example: Excel tables
          - id: linked-sheets
            name: Linked sheets
            example: Cross-sheet references
          - id: typed-records
            name: Typed records
            example: Airtable
          - id: tables-on-a-canvas
            name: Tables on a canvas
            description: "There is no underlying grid at all: each table is a separate object placed on a free
              canvas beside charts and text (Apple Numbers)"
            example: Apple Numbers — A sheet with tables on a canvas
          - id: tables-in-a-canvas-or-document
            name: Tables in a canvas or document
            description: "There is no endless grid: tables are objects placed on a page, canvas or inside prose,
              and the document rather than the sheet is the container"
            example: Apple Numbers — A sheet with tables on a canvas
  - name: Visual encoding
    family: encoding
    question: How are values made visible?
    subdimensions:
      - id: encoding
        name: Encoding
        select: many
        values:
          - id: plain-values
            name: Plain values
            example: Default
          - id: conditional-formatting
            name: Conditional formatting
            example: Excel
          - id: in-cell-bars-and-sparklines
            name: In-cell bars and sparklines
            example: Excel data bars, SPARKLINE in Google Sheets
          - id: floating-charts
            name: Floating charts
            example: Charts over the grid
  - name: Views
    family: layout
    question: How can the same grid be looked at?
    subdimensions:
      - id: views
        name: Views
        select: many
        values:
          - id: plain-grid
            name: Plain grid
            example: Default
          - id: frozen-panes
            name: Frozen panes
            example: Freeze rows and columns
          - id: personal-filter-views
            name: Personal filter views
            example: Google Sheets filter views
          - id: grouped-rows
            name: Grouped rows
            example: Excel outlines
          - id: non-grid-views
            name: Non-grid views
            description: The same rows can be looked at as a board, calendar, timeline or gallery — every
              variation of views as written assumes the grid stays a grid
            example: Airtable — Grid view of a base
  - name: Concurrency
    family: collaboration
    question: How do several people work on it?
    subdimensions:
      - id: concurrency
        name: Concurrency
        select: one
        values:
          - id: single-user-file
            name: Single-user file
            example: Classic Excel files
          - id: real-time-co-editing
            name: Real-time co-editing
            example: Google Sheets
          - id: comments-and-assignments
            name: Comments and assignments
            example: Google Sheets comments
  - name: Assistance
    family: initiative
    question: What does the software fill in for you?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Plain entry
          - id: autofill-series
            name: Autofill series
            example: Fill handle
          - id: fill-by-example
            name: Fill by example
            example: Excel Flash Fill
          - id: formulas-from-natural-language
            name: Formulas from natural language
            example: Copilot in Excel
          - id: cleanup-suggestions
            name: Cleanup suggestions
            description: The software proposes corrections to values already entered — inconsistent spellings,
              bad types — instead of filling new ones in
            example: Zoho Sheet — A shared spreadsheet
wild:
  score: 3
  note: "The person defines nearly everything: structure, computation, encoding and views."
  examples:
    - name: Excel
      note: Everything is authored by the user
    - name: Google Sheets
      note: Personal filter views over a shared sheet
techniques:
  - name: Views without copies
    dimension: Views
    how: Personal filter views, sorts and hidden columns over one shared grid, so nobody forks the data
      to see it their way.
    ai: false
  - name: Promote to app
    dimension: Structure
    how: Turn a range into a form, a board or a table view without leaving the sheet.
    ai: false
  - name: Formula by example
    dimension: Assistance
    how: Type the outcome in a few cells and a formula is proposed and explained.
    ai: true
