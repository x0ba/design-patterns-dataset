  raterNotes:
    fable:
      - Assistance and cells depend on tier and licence (Copilot, AI fields); I coded what the
        product offers a paying user in 2026 rather than what one budget file uses, since the file
        is imaginary. Numbers' canvas is neither a free grid nor tables in one.
      - "The entry does not say whether a sub is coded by what the sampled sheet shows or by what
        the product can do: cells, views and assistance ask what a cell or grid can hold or do,
        encoding asks how values are made visible, and I coded encoding by capability in round 1,
        which is most of my disagreement; structure conflates the container (canvas or document)
        with the structure imposed on the grid (typed records), so Coda truthfully holds two
        values."
    opus:
      - cells and encoding I coded from what that sheet shows; structure, views, concurrency and
        assistance from what the product affords on that surface, since no rater can know whether
        one particular budget froze its header row. Value-bound colour (a status or select option
        that is always green) I did not count as Conditional formatting, which I kept for rules a
        person writes — this is the cell most likely to split the three of us. concurrency is
        pick-one but real-time co-editing and comments coexist nearly everywhere; I took the
        stronger.
      - "Nearly every disagreement here is one unstated rule: whether a cell answers for the sheet
        on screen or for what the product affords. The glosses actually settle it — cells asks what
        a cell CAN hold and views how the grid CAN be looked at (affordance), while encoding asks
        how values ARE made visible (this sheet) — and saying so would remove most of these cells.
        Two further gaps: encoding does not distinguish rules a person writes from colour that comes
        bound to a chosen option (every status column), and assistance cannot describe a model that
        fills cells as a column type rather than as a fill command."
    sonnet:
      - Concurrency is pick-one but several tools show both real-time cursors and comment threads at
        once (Sheets, Smartsheet); I coded the more architecturally defining mode (real-time
        co-editing) and named the secondary comments layer in the note rather than picking
        arbitrarily. For screens with no collaborator cues I fell back to product-family defaults
        (cloud-native tools = real-time co-editing, classic desktop-file tools = single-user file)
        rather than treating a quiet note as evidence of a solo file.
      - I was systematically under-listing pick-any sub-dimensions (cells, encoding, views,
        assistance) in round 1 — defaulting to the minimal set I could personally verify rather than
        the fuller feature sets these products actually ship, which is most of the disagreement here
        rather than genuine conflict. Separately, 'structure' doesn't have a place for a table's
        container (embedded in a document/canvas vs. a dedicated sheet file) — that's a real,
        recurring fact (Numbers, Coda, Quip) that's orthogonal to how typed the grid itself is, and
        forcing it into the same pick-one sub-dimension as Free grid/Typed records produces exactly
        this kind of disagreement.
