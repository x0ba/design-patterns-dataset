# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "menu". Edit between batches only — see README "Rules".
id: menu
name: Menu
level: component
parent: navigate
aliases:
  - dropdown menu
  - context menu
  - overflow menu
  - menu bar
  - mega menu
definition: A transient list of choices or commands revealed from a trigger.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - software
  - commerce
  - design
anatomy:
  - name: Trigger
    role: What opens the menu
  - name: Items
    role: Choices and commands
  - name: Structure
    role: Sections and submenus
roles:
  - label
  - icon
  - shortcut
dimensions:
  - name: Opening
    family: invocation
    question: What opens it?
    subdimensions:
      - id: openBy
        name: Opened by
        select: one
        values:
          - id: button-click
            name: Button click
            example: Overflow ⋮ menus
          - id: right-click-or-long-press
            name: Right-click or long-press
            example: Context menus
          - id: menu-bar
            name: Menu bar
            example: macOS menu bar
          - id: hover
            name: Hover
            example: Retail mega menus
          - id: keyboard
            name: Keyboard
            example: Alt to reach Windows menus
  - name: Structure
    family: composition
    question: How are items organized?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: flat
            name: Flat
            example: Overflow menus
          - id: sections
            name: Sections
            example: Google Docs menus
          - id: cascading-submenus
            name: Cascading submenus
            example: Desktop menu bars
          - id: mega-menu
            name: Mega menu
            description: Multi-column panel
            example: Retail department menus
  - name: Item content
    family: content
    question: What does each item show?
    subdimensions:
      - id: item
        name: Item content
        select: many
        values:
          - id: label
            name: Label
            example: All
          - id: icon
            name: Icon
            example: Google Docs
          - id: shortcut-hint
            name: Shortcut hint
            example: macOS menus
          - id: checkmark-state
            name: Checkmark state
            example: View menus
          - id: description
            name: Description
            example: GitHub menus
  - name: Item set
    family: initiative
    question: Who decides which items appear and in what order?
    subdimensions:
      - id: itemSet
        name: Item set
        select: one
        values:
          - id: fixed
            name: Fixed
            example: Most menus
          - id: depends-on-selection
            name: Depends on selection
            example: Context menus
          - id: adaptive
            name: Adaptive
            description: The system reorders by use
            example: Office 2000 personalized menus
          - id: adaptable
            name: Adaptable
            description: The person reorders
            example: Office Quick Access Toolbar
  - name: Form
    family: layout
    question: What shape is it?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: vertical-list
            name: Vertical list
            example: Most menus
          - id: radial
            name: Radial
            example: Blender pie menus
          - id: icon-grid
            name: Icon grid
            example: Google apps launcher
          - id: horizontal-bar
            name: Horizontal bar
            example: Toolbars
wild:
  score: 1
  note: Adaptable menus exist in office suites; adaptive menus were tried and largely withdrawn.
  examples:
    - name: Microsoft Office
      note: Customize the Quick Access Toolbar and ribbon
techniques:
  - name: Adaptable menus
    dimension: Item set
    how: Pin, hide and reorder items in place rather than letting the system reshuffle (adaptable over
      adaptive, after Park et al. 2007, cited by CHI '25).
    ai: false
  - name: Menu to palette
    dimension: Opening
    how: Type while any menu is open to search all of the product’s menus.
    ai: false
signature: Adaptable menus
sample: Desktop suites, web apps and mobile context menus.
unit: One menu.
relations:
  uses: []
  specializes: []
  neighbors:
    - command-palette
    - popover
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Adaptive reordering breaks spatial memory
questions:
  - How should AI suggestions appear in a menu without destroying position memory?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.8393764191753588
  agreementFirstPass: 0.875
  kappaFinal: 0.8393764191753588
  agreementFinal: 0.875
  pass: true
  perSub:
    openBy:
      kappaFirstPass: 1
      agreementFirstPass: 1
      kappaFinal: 1
      agreementFinal: 1
      flag: null
    structure:
      kappaFirstPass: 0.6904557179707653
      agreementFirstPass: 0.7
      kappaFinal: 0.6904557179707653
      agreementFinal: 0.7
      flag: null
    item:
      kappaFirstPass: 0.8659124240519588
      agreementFirstPass: 0.9
      kappaFinal: 0.8659124240519588
      agreementFinal: 0.9
      flag: null
    itemSet:
      kappaFirstPass: 0.6728462377317338
      agreementFirstPass: 0.75
      kappaFinal: 0.6728462377317338
      agreementFinal: 0.75
      flag: null
    form:
      kappaFirstPass: 0.888059701492537
      agreementFirstPass: 0.95
      kappaFinal: 0.888059701492537
      agreementFinal: 0.95
      flag: null
  distribution:
    openBy:
      Button click: 8
      Right-click or long-press: 8
      Menu bar: 2
      Hover: 1
      Keyboard: 1
    structure:
      Flat: 7
      Sections: 1
      Cascading submenus: 11
      Mega menu: 1
    item:
      Label: 20
      Icon: 12
      Shortcut hint: 5
      Checkmark state: 0
      Description: 0
    itemSet:
      Fixed: 10
      Depends on selection: 10
      Adaptive: 0
      Adaptable: 0
    form:
      Vertical list: 17
      Radial: 1
      Icon grid: 1
      Horizontal bar: 1
  exemplars:
    openBy:
      Button click:
        - Google apps launcher — Waffle menu
        - GitHub — Create new (+) menu
        - Adobe Photoshop — Layers panel menu
      Right-click or long-press:
        - Microsoft Word — Right-click on text
        - iOS — App icon long-press
        - iOS Photos — Photo long-press
      Menu bar:
        - macOS Finder — File menu
        - Google Docs — Insert menu
      Hover:
        - Nike — Top navigation hover menu
      Keyboard:
        - Blender — Snap pie menu
    structure:
      Flat:
        - Google apps launcher — Waffle menu
        - GitHub — Create new (+) menu
        - iOS — App icon long-press
      Sections:
        - Gmail — More menu on a message
      Cascading submenus:
        - macOS Finder — File menu
        - Microsoft Word — Right-click on text
        - Google Docs — Insert menu
      Mega menu:
        - Nike — Top navigation hover menu
    item:
      Label:
        - macOS Finder — File menu
        - Microsoft Word — Right-click on text
        - Google Docs — Insert menu
      Icon:
        - Microsoft Word — Right-click on text
        - Google Docs — Insert menu
        - Google apps launcher — Waffle menu
      Shortcut hint:
        - macOS Finder — File menu
        - Google Docs — Insert menu
        - Figma — Layer right-click
      Checkmark state: []
      Description: []
    itemSet:
      Fixed:
        - macOS Finder — File menu
        - Google Docs — Insert menu
        - Google apps launcher — Waffle menu
      Depends on selection:
        - Microsoft Word — Right-click on text
        - iOS — App icon long-press
        - iOS Photos — Photo long-press
      Adaptive: []
      Adaptable: []
    form:
      Vertical list:
        - macOS Finder — File menu
        - Microsoft Word — Right-click on text
        - Google Docs — Insert menu
      Radial:
        - Blender — Snap pie menu
      Icon grid:
        - Google apps launcher — Waffle menu
      Horizontal bar:
        - Android — Text selection toolbar
  unobserved:
    - sub: item
      var: Checkmark state
    - sub: item
      var: Description
    - sub: itemSet
      var: Adaptive
    - sub: itemSet
      var: Adaptable
  unresolved: []
  proposals:
    raised: 1
    adopted: []
    recorded:
      - place: sub:form
        sub: form
        dim: null
        name: Multi-column panel
        gloss: Several vertical columns of items shown side by side in one panel, more than a simple flat
          vertical list — a retail mega menu's shape.
        raters:
          - sonnet
        instances:
          - 5
        status: raised
  raterNotes:
    fable:
      - "Fixed vs Depends on selection: I used Depends on selection only when the item set changes
        with the target, not when items merely grey out."
    opus:
      - "structure is pick-one over menus that are sectioned and cascading at the same time — most
        desktop menus are both — so I took the submenu as the stronger claim and left Sections for
        lists that only have rules. itemSet also conflates two things: a menu whose items are
        rewritten by the selection, and one whose fixed items are merely enabled or disabled; I read
        Depends on selection as the former. Checkmark state went unused because the sample has no
        view or options menu in it."
    sonnet:
      - Structure was often a close call between Sections and Cascading submenus when a menu has
        both dividers and one or two items that open a further list — I coded Cascading submenus
        only where a nested list is explicitly the more prominent feature of the note, Sections
        otherwise.
  codedAt: 2026-09-22
previews:
  - file: menu.svg
sources:
  - note: Seed entry from the original Pattern Atlas (codebook.html)
addedIn: 1.0.0
