# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "timeline-editor". Edit between batches only — see README "Rules".
id: timeline-editor
name: Timeline editor
level: pattern
parent: create
aliases:
  - non-linear editor
  - NLE
  - sequencer
  - arrangement view
definition: Composing time-based media by arranging clips on tracks against a time axis.
data: media
platforms:
  - desktop
  - mobile
  - web
domains:
  - entertainment
  - design
  - education
  - social
anatomy:
  - name: Tracks
    role: Parallel lanes of media
  - name: Clips
    role: Pieces of media
  - name: Playhead
    role: The current time
  - name: Viewer
    role: The rendered result
  - name: Bin
    role: Available media
roles: []
dimensions:
  - name: Track model
    family: layout
    question: How is time laid out?
    subdimensions:
      - id: tracks
        name: Track model
        select: one
        values:
          - id: fixed-tracks
            name: Fixed tracks
            example: Premiere Pro
          - id: magnetic-storyline
            name: Magnetic storyline
            description: Clips close gaps automatically
            example: Final Cut Pro
          - id: one-main-track
            name: One main track
            example: CapCut
          - id: storyboard
            name: Storyboard
            example: iMovie storyboards
  - name: Nesting
    family: composition
    question: How are clips combined?
    subdimensions:
      - id: nesting
        name: Nesting
        select: one
        values:
          - id: flat
            name: Flat
            example: Simple edits
          - id: nested-sequences
            name: Nested sequences
            example: Premiere nested sequences, Final Cut compound clips
          - id: linked-audio-and-video
            name: Linked audio and video
            example: All NLEs
          - id: groups
            name: Groups
            example: DaVinci Resolve
  - name: Clip representation
    family: encoding
    question: How does a clip show its content?
    subdimensions:
      - id: representation
        name: Representation
        select: many
        values:
          - id: name
            name: Name
            example: Compact tracks
          - id: filmstrip-thumbnails
            name: Filmstrip thumbnails
            example: Premiere Pro
          - id: waveforms
            name: Waveforms
            example: Audio tracks
          - id: colour-labels
            name: Colour labels
            example: Final Cut roles
          - id: transcript-text
            name: Transcript text
            example: Descript
          - id: keyframes-on-property-rows
            name: Keyframes on property rows
            description: The lane holds parameter values over time — keyframes, envelopes, automation curves —
              rather than a piece of media, which is how motion and audio tools spend most of their
              timeline rows
            example: Adobe After Effects — Composition timeline
  - name: Edit operations
    family: scope
    question: What edits are possible, and on what?
    subdimensions:
      - id: operations
        name: Operations
        select: many
        values:
          - id: blade-cut
            name: Blade cut
            example: All
          - id: ripple
            name: Ripple
            description: Later clips move with the edit
            example: Premiere Pro
          - id: slip-and-slide
            name: Slip and slide
            example: Professional NLEs
          - id: delete-words
            name: Delete words
            description: Edit video by deleting transcript text
            example: Descript
  - name: Navigation
    family: invocation
    question: How does a person move through time?
    subdimensions:
      - id: navigation
        name: Navigation
        select: many
        values:
          - id: scrub-the-playhead
            name: Scrub the playhead
            example: All
          - id: zoom-the-timeline
            name: Zoom the timeline
            example: All
          - id: j-k-l-shuttle
            name: J, K, L shuttle
            example: Professional NLEs
          - id: markers
            name: Markers
            example: Premiere markers
  - name: Automation
    family: initiative
    question: What does the editor do for you?
    subdimensions:
      - id: automation
        name: Automation
        select: one
        values:
          - id: manual
            name: Manual
            example: Classic NLEs
          - id: auto-captions
            name: Auto-captions
            example: CapCut
          - id: remove-filler-words-and-silences
            name: Remove filler words and silences
            example: Descript
          - id: edit-from-a-script
            name: Edit from a script
            example: Text-to-edit tools
          - id: auto-assemble
            name: Auto-assemble
            description: The editor builds a first cut from chosen media on its own (iMovie Magic Movie,
              template auto-fill), which the person then trims
            example: iMovie — Project
          - id: auto-assemble-from-media
            name: Auto-assemble from media
            description: The tool builds a whole edit from a pile of clips — choosing, ordering, trimming and
              scoring it — and hands back a timeline to adjust (iMovie Magic Movie, highlight-reel
              generators)
            example: iMovie — Project
wild:
  score: 3
  note: Track heights, workspaces and shortcuts are customized routinely by editors.
  examples:
    - name: Premiere Pro
      note: Workspaces and keyboard shortcut editor
    - name: DaVinci Resolve
      note: Custom layouts
techniques:
  - name: Edit through any representation
    dimension: Clip representation
    how: Edit the transcript, the waveform or the thumbnails, and the timeline follows; Descript’s move
      generalized to any representation.
    ai: false
  - name: Track lenses
    dimension: Clip representation
    how: Choose per track which representations show, the timeline form of surfacing attributes.
    ai: false
  - name: Cut to the best minute
    dimension: Automation
    how: A goal produces a proposed edit on a new sequence, never overwriting the original.
    ai: true
signature: Edit through any representation
sample: Desktop NLEs, mobile video editors, DAWs and podcast editors.
unit: One timeline editor.
