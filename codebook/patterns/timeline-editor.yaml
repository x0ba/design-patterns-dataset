  raterNotes:
    fable:
      - Automation is a pick-one over pro NLEs that now ship captions and text-based editing; coded
        Manual for them and the automation only where it is the editor's headline.
      - automation is pick-one but pro NLEs now ship captions, filler removal and text-based
        editing, so the gloss must say whether it means the headline automation or the most the
        editor does; the Manual example (classic NLEs) suggests headline. nesting wants pick any,
        since Linked audio and video is true of every NLE alongside nesting or groups. The
        representation list has no value for keyframe and automation rows, which is most of a motion
        or audio timeline. Phone-editor zoom and marker features are hard to recall reliably.
    opus:
      - "The entry assumes clips of media on tracks, so motion-graphics and DAW timelines fit only
        partly: their rows carry keyframes and automation, which representation cannot name.
        Operations is also a capability list rather than a mode list, which loses what Pro Tools
        makes explicit — that ripple and slip are exclusive edit modes there and simultaneous tools
        elsewhere."
      - "Automation is pick one over values that are no longer exclusive: every NLE in this sample
        now ships speech-to-text captioning, so Manual has quietly emptied out and the code depends
        entirely on whether the sampler named captions on the screen — which is the rule I used,
        here and in the parent entry. Nesting has the same shape: Linked audio and video is glossed
        'All NLEs', so coding it truthfully would swamp every other value; I reserved it for cases
        where two separate objects are actually tied together, which is why the phone editors are
        Flat. Ripple is also underdetermined — a gapless strip ripples by construction without ever
        naming the operation, which is most of the split on the mobile editors."
    sonnet:
      - Operations was often empty because mobile/simple editors expose trim handles rather than the
        professional blade/ripple/slip vocabulary the codebook names.
      - "I systematically under-coded operations and navigation almost everywhere in this entry,
        missing baseline facts like blade/split, timeline zoom and markers, because I picked the
        single most distinctive operation per product instead of checking the whole pick-any list
        against what I actually know. One recurring codebook-adjacent tension: professional NLEs
        (Premiere, Final Cut, Resolve, Canva) now ship real auto-caption/transcription features, but
        they live in a separate panel from the base cut-clips-on-a-track timeline; I've held
        automation at Manual for these to describe the timeline's own default mode, distinct from
        Reels/TikTok-style tools where auto-captioning is squarely part of the one editing surface
        being sampled — automation may want a way to say 'this exists, but elsewhere in the app.'"
  codedAt: 2026-09-22
