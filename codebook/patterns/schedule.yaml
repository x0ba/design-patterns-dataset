# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "schedule". Edit between batches only — see README "Rules".
id: schedule
name: Plan in time
level: archetype
aliases:
  - scheduling
  - time planning
  - calendaring
definition: Arrange things along time and coordinate availability with others — the activity behind
  calendars, booking slots, project plans and personal to-dos.
data: time
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - enterprise
  - health
  - education
  - travel
  - entertainment
anatomy:
  - name: Time axis
    role: How duration and position are represented
  - name: Events or tasks
    role: Things placed on or ordered by time
  - name: Availability
    role: When people or resources are free
  - name: Coordination
    role: How schedules meet across people
roles:
  - title
  - start
  - end
  - attendee
  - status
dimensions:
  - name: Time representation
    family: encoding
    question: How is time made visible, and at what grain?
    subdimensions:
      - id: granularity
        name: Granularity
        select: one
        values:
          - id: day-grid
            name: Day grid
            description: Hours within a day
            example: Google Calendar day view
          - id: week-grid
            name: Week grid
            description: Several days side by side
            example: Outlook week view
          - id: month-mosaic
            name: Month mosaic
            description: Days as cells
            example: Apple Calendar month
          - id: continuous-timeline
            name: Continuous timeline
            description: A scrollable span of any length
            example: Notion timeline
          - id: list-of-moments
            name: List of moments
            description: Time as ordered text, not a grid
            example: Reminders due list
      - id: scale
        name: Scale control
        select: one
        values:
          - id: fixed-views
            name: Fixed views
            description: Switch among preset ranges
            example: Google Calendar Day/Week/Month
          - id: zoomable-span
            name: Zoomable span
            description: Pinch or scroll changes the window
            example: Figma FigJam timeline prototypes
          - id: jump-to-date
            name: Jump to date
            description: Pick a date without changing scale
            example: Outlook Go to date
  - name: Placement and conflict
    family: composition
    question: How do items sit relative to each other on time, and what happens when they overlap?
    subdimensions:
      - id: placement
        name: Placement model
        select: one
        values:
          - id: absolute-on-a-calendar
            name: Absolute on a calendar
            description: Start and end on a clock
            example: Google Calendar events
          - id: relative-among-tasks
            name: Relative among tasks
            description: Order and dependencies, not clock time
            example: Linear issues without due dates
          - id: slots-from-availability
            name: Slots from availability
            description: Choose from offered free windows
            example: Calendly
          - id: duration-on-a-gantt
            name: Duration on a Gantt
            description: Bars spanning dates with dependencies
            example: Microsoft Project
          - id: pinned-to-a-day
            name: Pinned to a day
            description: An item sits on a date (optionally a time) without a duration and without ordering or
              dependencies among items; neither Absolute on a calendar nor Relative among tasks fits
              a dated to-do
            example: Todoist — Upcoming
      - id: conflicts
        name: Conflicts
        select: many
        values:
          - id: allow-overlaps
            name: Allow overlaps
            description: Stacked or side-by-side events
            example: Google Calendar overlapping meetings
          - id: warn-on-clash
            name: Warn on clash
            description: Surface conflict without blocking
            example: Outlook conflict warning
          - id: block-double-booking
            name: Block double-booking
            description: Refuse overlapping holds
            example: Resource booking in Outlook rooms
          - id: find-a-mutual-time
            name: Find a mutual time
            description: Search across calendars
            example: Google Find a time
  - name: Whose time
    family: scope
    question: Whose calendar or availability is in play?
    subdimensions:
      - id: whoseTime
        name: Scope of people and resources
        select: one
        values:
          - id: personal-only
            name: Personal only
            description: One person’s schedule
            example: Apple Calendar personal
          - id: shared-calendar
            name: Shared calendar
            description: A group reads or writes one calendar
            example: Team Google Calendar
          - id: multi-person-overlay
            name: Multi-person overlay
            description: Several calendars shown together
            example: Outlook overlay calendars
          - id: resource-schedules
            name: Resource schedules
            description: Rooms, equipment or seats
            example: Google Calendar rooms
          - id: anonymous-availability
            name: Anonymous availability
            description: Busy/free without event detail
            example: Calendly host availability
  - name: Editing commitment
    family: lifecycle
    question: When does placing something become binding, and how does it change later?
    subdimensions:
      - id: commitment
        name: Commitment
        select: one
        values:
          - id: draft-then-invite
            name: Draft then invite
            description: Create locally, then send
            example: Outlook meeting invite
          - id: immediate-hold
            name: Immediate hold
            description: Blocks time on create
            example: Google Calendar create
          - id: proposal-awaiting-accept
            name: Proposal awaiting accept
            description: Provisional until others confirm
            example: Doodle polls
          - id: recurring-series
            name: Recurring series
            description: One edit may affect many instances
            example: Outlook recurring meeting edit
wild:
  score: 2
  note: View grain and which calendars are overlaid are routinely personal; conflict policy and
    placement model almost never are.
  examples:
    - name: Google Calendar
      note: Day/Week/Month/Schedule and custom working hours
    - name: Outlook
      note: Overlay and overlay colour per calendar
    - name: Notion
      note: Calendar vs timeline vs list views of the same database
techniques:
  - name: Scale as a first-class attribute
    dimension: Time representation
    how: "Treat view grain as a bindable attribute of the schedule: zoom changes which fields appear on
      events, as semantic zoom does for collection attributes."
    ai: false
  - name: Conflict as a surfaced attribute
    dimension: Placement and conflict
    how: Expose clash, free/busy and travel buffers as attributes that can be filtered, sorted and
      colour-encoded rather than only as warnings.
    ai: false
  - name: Propose a mutual window
    dimension: Whose time
    how: Given constraints in words (“after school, under 45 minutes, no Fridays”), propose candidate
      slots with inspectable sources from each calendar.
    ai: true
signature: Scale as a first-class attribute
sample: Calendar, scheduling, project-management and booking products across productivity,
  enterprise, health and travel; code every surface whose main job is placing or finding time.
unit: One schedule surface for one set of people or resources (a screen can hold several).
relations:
  uses:
    - date-picker
    - filter-controls
    - modal-dialog
    - popover
  specializes: []
  neighbors:
