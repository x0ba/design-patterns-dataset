  potential: 5
  spec: 4
evidence: agent-coded
usage:
  - People switch grain mid-task (month to find a free day, then day to place the hour)
  - Busy professionals treat conflict visibility as more important than event aesthetics
questions:
  - Is there one schedule grammar under calendar, Gantt and task list, or do absolute vs relative
    time need separate spaces?
  - How should personal working hours travel across products the way a Meridian spec travels across
    shops?
