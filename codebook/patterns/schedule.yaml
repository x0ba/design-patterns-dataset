  raterNotes:
    fable:
      - scale is n/a for booking and poll surfaces that offer no range control. conflicts is n/a for
        dated to-do lists where items cannot collide. whoseTime for a staff scheduler (one row per
        employee) was coded Multi-person overlay for want of a 'people as resources' variation.
      - conflicts as pick any lets [] and n/a both mean nothing happens; the protocol should say
        which to use when the concept is absent. commitment reads as invite-specific to one rater;
        its gloss should say it covers any placement that binds.
    opus:
      - scale does not apply to booking and poll surfaces at all — Doodle, When2meet and Reminders
        have no view switch, no zoom and no date jump, coded n/a. conflicts is empty for every
        project-planning surface because a Gantt has no concept of two things clashing in clock
        time; that may be worth saying in the codebook rather than leaving raters to guess between
        an empty array and n/a.
      - commitment has no value for surfaces where placing something is simply a save — every
        timeline and to-do got Immediate hold from two of us and n/a from the third, because the
        variation set is written for invitations.
    sonnet:
      - "'commitment' does not really apply to Gantt/task-bar tools (Asana, Project, Notion, Linear,
        Jira) since editing a bar's dates isn't an RSVP-style binding step the way a calendar invite
        is; coded n/a rather than force-fitting one of the four event-oriented values."
      - "Three codebook problems surfaced here: (1) 'commitment' has no value for a surface where
        placing something is simply saved — 'Immediate hold' ('blocks time on create') is
        calendar-specific and reads oddly for a Gantt bar or a due date, and its gloss should be
        widened to 'takes effect on save'; (2) 'Allow overlaps' conflates a display treatment
        (stacked or side-by-side) with a permissive policy, which is what split every rater on the
        Gantt instances; (3) 'Find a mutual time' is named as a behaviour but glossed as 'search
        across calendars', which wrongly excludes poll-based products like Doodle. Also: 'whoseTime'
        has no variation for a project plan, whose time is implied by resource assignment rather
        than owned by a calendar."
