    adopted:
      - sub: acceptFlow
        name: Apply then revert
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Accept flow is a pick-one but every product offers several (Tab-all plus word-wise or
        cycling); coded the primary accept and named the others in notes; Tab to accept all also
        stood in for click-Replace on rewrite cards.
      - Accept flow has no click-to-replace for card rewrites (Notion, Word Editor, Grammarly) so
        Tab to accept all is stretched; Placement has no floating diff at the caret; Initiative's
        Proactive multi-file next edit bundles proactivity with multi-file.
    opus:
      - "Accept flow is pick-one over affordances that always co-exist: Tab, partial accept, cycling
        and Escape ship together in every code completion, so Word-by-word accept and Cycle
        alternatives never win and the column reads as a constant. Feedback is nearly constant too —
        Visual ghost styling for everything except the rewrite tools — and there is no variation for
        the span underline that writing assistants use."
      - "`acceptFlow` assumes a pending proposal that the person takes, so it has nothing for
        rewrite commands that apply straight away and rely on undo (Apple Writing Tools, Figma) —
        both other raters described that behaviour in prose and then coded Tab to accept all anyway.
        `placement` also needs a value for a floating diff preview near the caret: Copilot NES,
        Windsurf and Zed's preview are all squeezed into Beside the line or Floating rewrite card,
        neither of which was written for them."
    sonnet:
      - acceptFlow was often genuinely multi-modal (Tab-all plus word-by-word plus cycling on the
        same product); I coded the primary/headline binding and noted the others.
  codedAt: 2026-09-22
