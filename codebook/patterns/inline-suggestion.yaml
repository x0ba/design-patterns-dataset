# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "inline-suggestion". Edit between batches only — see README "Rules".
id: inline-suggestion
name: Inline suggestion
level: pattern
parent: delegate-ai
aliases:
  - ghost text
  - autocomplete AI
  - copilot inline
definition: Model-proposed continuation or edit shown inside the artifact at the caret or selection,
  accepted, cycled or dismissed without leaving the editor.
data: document
platforms:
  - desktop
  - web
domains:
  - software
  - productivity
  - design
  - ai
anatomy:
  - name: Ghost text
    role: The proposed insertion
  - name: Caret context
    role: What the model conditioned on
  - name: Accept control
    role: Keyboard or click to take it
  - name: Alternative cycle
    role: Other proposals
roles: []
dimensions:
  - name: Suggestion content
    family: content
    question: What form does the proposal take?
    subdimensions:
      - id: content
        name: Content
        select: one
        values:
          - id: ghost-continuation
            name: Ghost continuation
            example: GitHub Copilot
          - id: multi-line-block
            name: Multi-line block
            example: Copilot long suggestions
          - id: replacement-of-a-selection
            name: Replacement of a selection
            example: Cursor inline edit
          - id: structured-patch-hunk
            name: Structured patch hunk
            example: Next-edit suggestions
          - id: non-code-completion
            name: Non-code completion
            example: Smart Compose in Gmail
  - name: Where it appears
    family: layout
    question: How is the suggestion placed relative to the artifact?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: inline-ghost-at-caret
            name: Inline ghost at caret
            example: Copilot
          - id: beside-the-line
            name: Beside the line
            example: Some IDE sidelenses
          - id: diff-overlay-on-selection
            name: Diff overlay on selection
            example: Cursor Cmd-K
          - id: floating-rewrite-card
            name: Floating rewrite card
            example: Notion AI
          - id: status-bar-only
            name: Status-bar only
            example: Low-confidence hints
  - name: Triggering
    family: invocation
    question: What brings a suggestion up?
    subdimensions:
      - id: trigger
        name: Trigger
        select: many
        values:
          - id: as-you-type
            name: As you type
            example: Copilot
          - id: explicit-shortcut
            name: Explicit shortcut
            example: Alt-\ / Cursor
          - id: on-pause
            name: On pause
            example: Debounced suggest
          - id: on-selection-command
            name: On selection command
            example: Edit this
          - id: suppress-in-this-file
            name: Suppress in this file
            example: Copilot ignore
  - name: Acceptance flow
    family: flow
    question: How are proposals taken, varied or refused?
    subdimensions:
      - id: acceptFlow
        name: Accept flow
        select: one
        values:
          - id: tab-to-accept-all
            name: Tab to accept all
            example: Copilot
          - id: word-by-word-accept
            name: Word-by-word accept
            example: Copilot partial accept
          - id: cycle-alternatives
            name: Cycle alternatives
            example: Copilot Alt-[
          - id: edit-before-accept
            name: Edit before accept
            example: Inline edit buffers
          - id: dismiss-and-learn-not
            name: Dismiss and learn-not
            example: Escape
          - id: apply-then-revert
            name: Apply then revert
            description: The proposal is written into the artifact immediately with no accept gate; refusing it
              means undoing — the acceptance model of rewrite commands in design and OS-level
              writing tools
            example: Apple Writing Tools — Proofread and Rewrite
  - name: Suggestion initiative
    family: initiative
    question: How assertive is the model?
    subdimensions:
      - id: initiative
        name: Initiative
        select: one
        values:
          - id: only-when-asked
            name: Only when asked
            example: Manual trigger
          - id: opportunistic-while-typing
            name: Opportunistic while typing
            example: Default Copilot
          - id: proactive-multi-file-next-edit
            name: Proactive multi-file next edit
            example: Cursor next edit
          - id: off-unless-enabled-per-language
            name: Off unless enabled per language
            example: IDE settings
  - name: Confidence feedback
    family: feedback
    question: How is suggestion quality or origin shown?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: visual-ghost-styling
            name: Visual ghost styling
            example: Grey ghost text
          - id: provider-label
            name: Provider label
            example: Copilot mark
          - id: no-cue-until-hover
            name: No cue until hover
            example: Minimal UIs
          - id: why-this-suggestion
            name: Why this suggestion
            example: Telemetry-backed explanations
          - id: blocked-by-policy-banner
            name: Blocked by policy banner
            example: Enterprise filters
wild:
  score: 2
  note: Enablement, languages and keybindings are commonly customized; ghost styling rarely.
  examples:
    - name: VS Code Copilot
      note: Enable per-language; keybindings
    - name: Cursor
      note: Tab modes and models
    - name: Gmail
      note: Smart Compose on/off
techniques:
  - name: Partial accept
    dimension: Acceptance flow
    how: Allow word- or hunk-level acceptance so people keep control when only part of the ghost is
      right.
    ai: false
  - name: Suggest only under caret policy
    dimension: Suggestion initiative
    how: Expose when suggestions fire (always, on pause, on shortcut) as a first-class preference.
    ai: false
  - name: Condition on a selection brief
    dimension: Triggering
    how: For selection edits, show the short brief the model used and let it be edited before
      regenerating.
    ai: true
signature: Partial accept
sample: IDEs, writing editors and design tools with caret-level AI.
unit: One inline proposal episode at a caret or selection.
relations:
  uses:
    - ai-provenance
    - undo
    - autocomplete
  specializes:
    - delegate-ai
  neighbors:
    - autocomplete
    - generative-variations
    - ai-chat
