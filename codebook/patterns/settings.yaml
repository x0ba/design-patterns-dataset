# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "settings". Edit between batches only — see README "Rules".
id: settings
name: Settings
level: pattern
parent: configure
aliases:
  - preferences
  - options
  - system settings
definition: A durable catalog of options that change how an app, account or device behaves, usually
  revisited rarely and in parts.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - software
  - productivity
  - enterprise
  - home
  - communication
anatomy:
  - name: Panes or pages
    role: Groups of related options
  - name: Controls
    role: Toggles, selects and fields
  - name: Search
    role: Finding an option by name
  - name: Reset
    role: Return to defaults
roles:
  - label
  - description
  - value
  - default
  - warning
dimensions:
  - name: Information architecture
    family: composition
    question: How are settings grouped and nested?
    subdimensions:
      - id: ia
        name: IA
        select: one
        values:
          - id: single-long-page
            name: Single long page
            example: Simple web prefs
          - id: sectioned-page
            name: Sectioned page
            example: GitHub profile settings
          - id: drill-down-hierarchy
            name: Drill-down hierarchy
            example: Apple Settings
          - id: tabbed-categories
            name: Tabbed categories
            example: Slack preferences
          - id: command-palette-jump
            name: Command-palette jump
            example: VS Code Open Settings
  - name: Control types
    family: content
    question: What kinds of values can be set?
    subdimensions:
      - id: controls
        name: Controls
        select: many
        values:
          - id: boolean-toggles
            name: Boolean toggles
            example: iOS switches
          - id: single-and-multi-select
            name: Single and multi-select
            example: Notification categories
          - id: numeric-and-ranges
            name: Numeric and ranges
            example: Text size sliders
          - id: text-and-credentials
            name: Text and credentials
            example: API tokens
          - id: complex-nested-objects
            name: Complex nested objects
            example: VS Code JSON settings
          - id: permissions-prompts
            name: Permissions prompts
            example: macOS Privacy
  - name: Discovery
    family: invocation
    question: How does a person find the right setting?
    subdimensions:
      - id: discovery
        name: Discovery
        select: many
        values:
          - id: browse-hierarchy
            name: Browse hierarchy
            example: Apple Settings
          - id: search-by-label
            name: Search by label
            example: macOS System Settings search
          - id: deep-link-from-feature
            name: Deep link from feature
            example: In-context gear icons
          - id: suggested-settings
            name: Suggested settings
            example: Android tips
          - id: natural-language-find
            name: Natural-language find
            example: Assistant “open Wi-Fi settings”
  - name: Application timing
    family: lifecycle
    question: When do changes take effect?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: instant
            name: Instant
            example: Most mobile toggles
          - id: save-button
            name: Save button
            example: Many admin consoles
          - id: restart-required
            name: Restart required
            example: Developer feature flags
          - id: per-profile-switch
            name: Per-profile switch
            example: Chrome profiles
          - id: scheduled
            name: Scheduled
            example: Focus / Do Not Disturb schedules
  - name: Scope and sync
    family: scope
    question: Where does a setting apply?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: device-local
            name: Device-local
            example: On-device only prefs
          - id: account-synced
            name: Account-synced
            example: iCloud settings
          - id: workspace-or-org
            name: Workspace or org
            example: Slack workspace settings
          - id: override-layers
            name: Override layers
            description: User overrides team default
            example: VS Code settings cascade
          - id: guest-without-save
            name: Guest without save
            example: Incognito-like sessions
          - id: paired-device
            name: Paired device
            description: Settings are configured on one device (e.g. a phone) but take effect on a different,
              paired device (e.g. a watch), rather than on the configuring device, the account
              everywhere, or a workspace
            example: Apple Watch app — Watch settings
  - name: Safety and reversibility
    family: feedback
    question: How are risky changes handled?
    subdimensions:
      - id: safety
        name: Safety
        select: many
        values:
          - id: no-confirm
            name: No confirm
            example: Theme toggle
          - id: confirm-destructive
            name: Confirm destructive
            example: Delete account
          - id: show-side-effects
            name: Show side effects
            example: Permission explanations
          - id: reset-to-default
            name: Reset to default
            example: Reset all settings
          - id: change-history
            name: Change history
            example: Google Account activity
wild:
  score: 2
  note: Search is common on desktop OS and IDEs; mobile settings are still mostly browse-only.
  examples:
    - name: Apple Settings
      note: Search and drill-down
    - name: VS Code
      note: Settings UI plus JSON
    - name: Android
      note: Settings search
techniques:
  - name: Settings as a collection
    dimension: Information architecture
    how: Every setting is an item in a searchable overview with facets (recently changed, risky, synced)
      rather than only a fixed tree.
    ai: false
  - name: Why is this on?
    dimension: Discovery
    how: From any behaviour, jump to the governing settings with a short explanation of the current
      values.
    ai: false
  - name: Set it up for me
    dimension: Control types
    how: Describe a desired behaviour; the system proposes a diff of settings with each change
      inspectable before apply.
    ai: true
signature: Settings as a collection
sample: iOS/macOS Settings, Android Settings, VS Code, Slack, GitHub and major SaaS admin.
unit: One settings surface for one product or OS.
