  raterNotes:
    fable:
      - Timing as pick-one hides that OS settings are mostly instant with a few restart-required
        items; I coded the dominant behaviour. Drill-down vs Tabbed categories is a judgement for
        sidebar-plus-pane layouts (macOS, Windows coded Drill-down for their nested panes).
      - "ia's Command-palette jump is a discovery route filed as an information architecture;
        sidebar-and-pane layouts split Tabbed categories, Sectioned page and Drill-down hierarchy
        with no rule for depth. safety's No confirm reads two ways: absence of a confirmation dialog
        (then almost every surface has it) or instant apply (then Save-button surfaces do not).
        scope lacks a value for a setting that lands on a paired device."
    opus:
      - "timing is the sub that most needed a value it does not have: four instances are 'mostly
        instant, a few requiring a restart or sign-out', and pick-one forces the dominant case, so
        Restart required will probably never be coded by anyone even though the behaviour is common.
        ia's Sectioned page and Drill-down hierarchy are hard to separate for web settings with a
        left menu of pages — I followed the codebook's GitHub exemplar for Sectioned page and
        drilled elsewhere, which is my likeliest disagreement. discovery is close to unobservable in
        one respect: whether a product has a settings search is a detail that has changed recently
        for several of these (Discord, Steam, Instagram all added one), so it is a moving target.
        safety's No confirm co-occurs with everything, since it describes most rows in every
        surface; it would be more useful as 'nothing here is guarded'. The sample has no instance of
        Guest without save or Per-profile switch."
      - "Most of this entry's disagreement is a pick-any depth difference rather than a conflict: on
        `controls`, `discovery` and `safety` the three of us named the same things and one rater
        simply stopped at what the sample note stated. The one real codebook gap is in `safety`:
        there is no value for 'a Save button commits it, but nothing warns you', so raters split
        over whether to call that No confirm at all."
    sonnet:
      - "ia is coded using a three-way distinction inferred from the codebook's own examples:
        Sectioned page for single-level web settings reached by separate page navigations (GitHub,
        Chrome, X); Tabbed categories for a persistent dialog or full-screen overlay whose content
        swaps in place without navigating away (Slack, Notion, Zoom, Discord, Steam, MS365, Gmail);
        Drill-down hierarchy reserved for genuinely multi-level navigation (OS settings apps, and
        mobile apps whose sections push their own sub-screens)."
      - Three codebook problems recurred. (1) `ia`'s Sectioned page and Drill-down hierarchy don't
        distinguish a persistent sidebar that swaps an inline pane (GitHub, X/Twitter web settings)
        from true push-navigation between screens — the same ambiguity as the configure archetype's
        organization sub, and worth a shared fix. (2) `scope` has no value for a settings surface
        hosted on one device that configures a different, paired device (Apple Watch via the iPhone
        app) — Device-local is glossed as on-device prefs, and this is neither that nor
        account-wide; I hold +Paired device unresolved since no other rater independently proposed
        it. (3) `safety`'s No confirm is ambiguous for admin surfaces that gate every change behind
        an explicit Save button but never ask 'are you sure' — that is neither instant/no-confirm
        nor a destructive confirmation, and both readings (opus's inclusion, fable's/my exclusion)
        are defensible from the gloss as written.
