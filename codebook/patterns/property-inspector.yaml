  raterNotes:
    fable:
      - Multi-selection behaviour is unobservable from product knowledge for several tools (coded ?
        on four). Apply is Live for every instance, so it does not discriminate in this sample.
      - All properties and Contextual to the selection type overlap because every inspector follows
        the selection's type; the codebook should define All properties as exhaustive. apply wants
        pick any since Figma is live and scrubbable. The Floating palette example is dated for
        Adobe's docked panels. multi is unobservable from product memory for several tools.
    opus:
      - "This entry is the most uniform in my slice: right sidebar, collapsible sections, live apply
        is the answer 14 times out of 20, which is itself the finding — the inspector has converged.
        set conflates two things and I applied a rule to stay consistent: a property search field
        makes it Searchable, even where All properties would also be true (Unreal, Android Studio,
        Godot). apply's Live and Scrub to preview are not alternatives — scrubbing is live editing
        with a drag gesture — so Figma is the only instance where I chose the more specific value,
        and a rater who reads apply as 'when does the edit commit' would code it Live. Pinned
        favourites went unused."
      - "Three codebook faults account for nearly all of this packet. `grouping` offers Flat,
        Collapsible sections and Tabs but has no value for fixed, non-folding named sections, which
        is what Xcode, Sketch and Illustrator actually have — so the same panel is coded Flat by a
        rater reading 'do they collapse?' and Collapsible by one reading 'is it sectioned?'.
        `placement` mixes where the panel sits with what kind of window it is: Adobe's dockable
        palettes sit in a right column by default, so Floating palette and Right sidebar are both
        literally true, and the list has no left side at all (all three of us hit Canva). `multi`
        was a third of the packet and almost none of it is a reading of the product: multi-selection
        behaviour is rarely visible in a screen note, so it is coded from knowledge of the tool, and
        a rater who codes only what the note states will say Single object only every time — the
        sub-dimension needs an explicit 'not observable on this screen' instruction. Smaller: `set`
        mixes the contents (All / Contextual) with the access mechanism (Searchable, Pinned), so a
        searchable inspector always has two true codes, and `apply` has the same problem with Live
        plus Scrub to preview."
    sonnet:
      - placement for IDE/engine inspectors that default to a lower-right dock (Blender) is
        approximated as Bottom panel per the codebook's own game-engine-inspector gloss, even
        outside a literal game engine.
      - "One dominant pattern: I systematically under-coded 'multi' as 'Single object only' across
        roughly half this archetype's instances (Xcode, Framer, Sketch, Keynote, PowerPoint, Godot)
        where both other raters specifically named a concrete 'Mixed'/'shared properties' UI element
        for multi-selection — every one of these tools does support it, and 'Single object only'
        should probably be my default assumption only when a rater specifically denies
        multi-selection support, not whenever I simply don't recall seeing it demonstrated. A
        smaller pattern: 'placement' assumes an inspector opposite the canvas is always a right
        sidebar, which Canva's left-docked panel (and both other raters' identically-named proposal
        for it) shows isn't universal."
  codedAt: 2026-09-22
