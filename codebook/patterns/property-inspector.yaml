# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "property-inspector". Edit between batches only — see README "Rules".
id: property-inspector
name: Property inspector
level: component
parent: browse-collections
aliases:
  - inspector
  - properties panel
  - attributes panel
definition: A panel of key–value properties for the current selection, editable in place.
data: object
platforms:
  - desktop
  - web
domains:
  - design
  - software
  - science
  - productivity
anatomy:
  - name: Property rows
    role: Name and value controls
  - name: Sections
    role: Groups of related properties
  - name: Selection header
    role: What is being inspected
roles: []
dimensions:
  - name: Property set
    family: content
    question: Which properties appear?
    subdimensions:
      - id: set
        name: Property set
        select: one
        values:
          - id: all-properties
            name: All properties
            example: Xcode attributes inspector
          - id: contextual-to-the-selection-type
            name: Contextual to the selection type
            example: Figma design panel
          - id: pinned-favourites
            name: Pinned favourites
            example: Custom inspector panels
          - id: searchable
            name: Searchable
            example: Blender properties search
  - name: Placement
    family: layout
    question: Where does the inspector sit?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: right-sidebar
            name: Right sidebar
            example: Figma, Xcode
          - id: floating-palette
            name: Floating palette
            example: Classic Photoshop panels
          - id: popover-near-the-object
            name: Popover near the object
            example: Keynote format popovers on iPad
          - id: bottom-panel
            name: Bottom panel
            example: Game engine inspectors
          - id: left-sidebar
            name: Left sidebar
            description: The inspector panel opens on the left of the canvas
            example: Canva — Position and Effects panels
  - name: Multi-selection
    family: scope
    question: What happens with several objects selected?
    subdimensions:
      - id: multi
        name: Multi-selection
        select: one
        values:
          - id: single-object-only
            name: Single object only
            example: Simple forms
          - id: common-properties-with-mixed-values
            name: Common properties with Mixed values
            example: Figma
          - id: list-per-object
            name: List per object
            example: Spreadsheet-style inspectors
  - name: Grouping
    family: composition
    question: How are properties organized?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: flat
            name: Flat
            example: Small inspectors
          - id: collapsible-sections
            name: Collapsible sections
            example: Figma
          - id: tabs
            name: Tabs
            example: Blender properties editor
  - name: Applying changes
    family: feedback
    question: When do edits take effect?
    subdimensions:
      - id: apply
        name: Apply
        select: one
        values:
          - id: live
            name: Live
            example: Figma
          - id: apply-button
            name: Apply button
            example: Legacy dialogs
          - id: scrub-to-preview
            name: Scrub to preview
            description: Drag a label to change a number
            example: Figma number scrubbing
wild:
  score: 1
  note: Inspectors rarely let people choose which properties matter to them.
  examples:
    - name: Blender
      note: Search properties
techniques:
  - name: Pin to canvas
    dimension: Property set
    how: "Pin a property from the inspector as an on-canvas label on every object: surfacing, run from
      detail to overview."
    ai: false
  - name: Match this
    dimension: Multi-selection
    how: “Make these match the brand” proposes property changes across the selection as a reviewable
      diff.
    ai: true
signature: Pin to canvas
