# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "communicate". Edit between batches only — see README "Rules".
id: communicate
name: Communicate
level: archetype
aliases:
  - messaging
  - conversation
definition: Exchange messages with people over time, from a live call to an email answered next week.
data: conversation
platforms:
  - web
  - mobile
  - desktop
domains:
  - communication
  - social
  - enterprise
  - health
  - education
anatomy:
  - name: Conversations
    role: The set of exchanges
  - name: Messages
    role: Units of an exchange
  - name: Composer
    role: Where messages are written
  - name: Participants
    role: Who is involved
roles:
  - sender
  - timestamp
  - body
  - attachment
dimensions:
  - name: Conversation structure
    family: composition
    question: How are exchanges divided?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: one-stream-per-contact
            name: One stream per contact
            example: SMS
          - id: channels
            name: Channels
            example: Slack
          - id: threads-inside-channels
            name: Threads inside channels
            example: Slack threads
          - id: topic-per-message
            name: Topic per message
            example: Zulip topics
          - id: email-threads
            name: Email threads
            example: Gmail conversations
          - id: proximity
            name: Proximity
            description: "Exchanges are divided by location in a shared space: you talk to whoever is near your
              avatar, plus room-wide and everyone channels"
            example: Gather — Virtual office
          - id: proximity-based-rooms
            name: Proximity-based rooms
            description: Exchanges are not persistent named streams but form dynamically among people whose
              avatars are spatially near each other on a shared map
            example: Gather — Virtual office
  - name: Tempo
    family: lifecycle
    question: How synchronous is it, and does it last?
    subdimensions:
      - id: tempo
        name: Tempo
        select: one
        values:
          - id: synchronous
            name: Synchronous
            example: Calls
          - id: near-synchronous
            name: Near-synchronous
            example: Chat
          - id: asynchronous
            name: Asynchronous
            example: Email
          - id: ephemeral
            name: Ephemeral
            example: Snapchat disappearing messages
  - name: Arrangement
    family: layout
    question: How are conversations and messages arranged?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: list-beside-thread
            name: List beside thread
            example: Slack, Gmail
          - id: one-thread-full-screen
            name: One thread full screen
            example: WhatsApp on phones
          - id: multiple-threads-side-by-side
            name: Multiple threads side by side
            example: Slack thread panel
          - id: spatial-rooms
            name: Spatial rooms
            example: Gather
          - id: beside-content
            name: Beside content
            description: A single conversation runs in a column alongside the primary content (a live video),
              with no list of other conversations
            example: Twitch — Stream chat
          - id: chat-beside-content
            name: Chat beside content
            description: A single persistent chat column runs beside a media stage (a live stream, a visit)
              rather than beside a navigable list of separate conversations
            example: Twitch — Stream chat
  - name: Assistance
    family: initiative
    question: What does the system write or summarize?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Signal
          - id: smart-replies
            name: Smart replies
            example: Gmail
          - id: unread-summaries
            name: Unread summaries
            example: Slack AI recaps
          - id: drafting
            name: Drafting
            example: Gmail Help me write
          - id: translation
            name: Translation
            example: Teams live translation
  - name: Audience
    family: collaboration
    question: How many people is it for?
    subdimensions:
      - id: audience
        name: Audience
        select: one
        values:
          - id: one-to-one
            name: One-to-one
            example: DMs
          - id: small-group
            name: Small group
            example: Group chats
          - id: community
            name: Community
            example: Discord servers
          - id: broadcast
            name: Broadcast
            example: WhatsApp channels
  - name: Signals
    family: feedback
    question: What does the system say about delivery and presence?
    subdimensions:
      - id: signals
        name: Signals
        select: many
        values:
          - id: read-receipts
            name: Read receipts
            example: WhatsApp ticks
          - id: typing-indicators
            name: Typing indicators
            example: iMessage
          - id: online-presence
            name: Online presence
            example: Slack status dot
          - id: none
            name: None
            example: Email
wild:
  score: 2
  note: Notification rules, mute, read receipts and sidebar organization are often exposed.
  examples:
    - name: Slack
      note: Per-channel notification preferences and sections
    - name: WhatsApp
      note: Read receipts toggle
techniques:
  - name: Attention recipes
    dimension: Tempo
    how: Per conversation, decide what reaches you, when, and in what form (interrupt, badge, digest),
      as an editable rule.
    ai: false
  - name: Thread ↔ channel morph
    dimension: Conversation structure
    how: Promote a thread to its own channel, or fold a quiet channel into a thread, without losing
      history.
    ai: false
  - name: Catch me up
    dimension: Assistance
    how: A summary of what changed, every line linked to the message it came from.
    ai: true
signature: Attention recipes
sample: Messaging, email, team chat, community and telehealth apps.
unit: One product’s conversation experience.
relations:
