        status: raised
  raterNotes:
    fable:
      - "audience is pick-one but nearly every product spans one-to-one, group and broadcast; coded
        the screen the sample locates. Structure/arrangement exemplars cite Slack and Gmail for two
        variations each, so I coded the default state (channel + sidebar; thread replaces list but
        label list stays). Assistance: 'None' used explicitly where the codebook lists it."
      - audience is pick one but messengers hold One-to-one, Small group and Broadcast at once
        (Telegram, WeChat, Messenger, Teams); it wants pick any. tempo's Near-synchronous gloss
        (Chat) names a medium, so live-only chat rooms split raters.
    opus:
      - "audience is the weakest code here: every product supports one-to-one, groups and
        communities, so I took the audience the sampled screen centres and noted the rest.
        arrangement forced a choice between the resting layout and the panel-open layout for
        Slack-likes; I coded the resting layout consistently."
      - "audience is the codebook's weak spot here: every product supports one-to-one, group and
        community audiences at once, so the sub-dimension wants to be pick any; structure names
        Slack for both Channels and Threads inside channels, which is why n=3 split three ways."
    sonnet:
      - Audience was hard to pin to one value for products whose sample screen names both a 1:1 and
        a group context (Telegram, Messenger, WeChat) — marked '?' rather than guess; noted in each
        _note.
      - Two codebook problems surfaced here. (1) `audience` is pick one but almost every messenger
        spans one-to-one, small group and broadcast in the same product — Telegram, WeChat and
        Messenger all forced raters into a dodge or a coin flip; it should be pick any, or its gloss
        should say 'the default audience of the screen's conversation'. (2) `structure`'s Channels
        and Threads inside channels are nested rather than exclusive and the codebook cites Slack
        for both, which is what split n=3; Threads inside channels should be glossed as implying
        channels, so the more specific code wins.
