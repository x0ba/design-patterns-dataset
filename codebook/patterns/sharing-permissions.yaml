  raterNotes:
    fable:
      - Lifecycle is Until revoked nearly everywhere; expiring links are options rather than the
        default. Branch protection is a policy, not a share flow, so openBy is n/a.
      - lifecycle and initiative are pick-one but nearly every product truthfully holds a default
        (until revoked; person chooses) plus an option (expiry; org default) — both want pick-any.
        scope's Time-limited access duplicates lifecycle's Expiring access. Sonnet's lists omit
        Anonymous link access wherever a link exists, which reads roles as a person-role ladder
        only; the gloss should say whether a link audience is a role.
    opus:
      - scope puts Time-limited access beside Whole file and Folder and children, which are answers
        to a different question; I coded expiry under lifecycle throughout and left that variation
        unused, which I think is where the codebook is wrong rather than where the products are. The
        entry also has no way to record a principal that is a group or a room (a Slack channel, a
        GitHub team) rather than a person or a link, and roles cannot say that commenting comes
        bundled with viewing rather than as its own grade (Figma).
      - lifecycle is pick one but several products hold two values at once — a grant that lasts
        until revoked plus an optional expiry on the link (Dropbox, OneDrive, Box) — so I applied
        the codebook's own ordering and coded Until revoked; it wants to be pick any. scope still
        carries Time-limited access, which answers the lifecycle question rather than the scope one,
        and that mis-parking is what split us on OneDrive. roles has no way to say that a right is
        bundled rather than granted (Figma's commenting rides with viewing) and no principal type
        for a group or a room (a Slack channel, a GitHub team), and openBy has no value for a screen
        where nothing is shared at all (branch protection) short of n/a.
    sonnet:
      - None of these 20 instances showed AI-suggested recipients ('people you worked with') as the
        primary mechanism, so that Initiative variation went unused rather than being force-applied
        to ordinary invite-by-email flows that may also have it as a secondary autocomplete feature
        I'm not confident about per-product.
      - "Two codebook overlaps and one convention question: (1) scope's Time-limited access and
        lifecycle's Expiring access share the same exemplar (an expiring link) — the same real
        feature can be legitimately coded under either or, as I initially did, double-coded under
        both; I settled on scope answering what the grant covers and lifecycle answering how it
        ends. (2) openBy's From a parent folder policy is ambiguous between an item's access having
        arrived FROM an ancestor's policy and an item being the SOURCE whose children inherit
        downstream — two raters credited a folder/page's own share screen with this value on
        downstream-inheritance evidence, which I don't think the value is describing. (3) roles'
        Custom fine-grained: whether it stacks additively with the simpler named roles it subsumes
        (GitHub's ladder ticked as View/Edit/Owner too) or stands alone as the codebook's own GitHub
        exemplar suggests — I read it as standing alone."
