# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "sharing-permissions". Edit between batches only — see README "Rules".
id: sharing-permissions
name: Sharing and permissions
level: pattern
parent: collaborate
aliases:
  - access control
  - share dialog
  - ACL UI
definition: Granting, reviewing and revoking who can view, comment on or edit a shared artifact, and
  how they receive access.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - enterprise
  - education
  - design
  - software
anatomy:
  - name: Principal
    role: A person, group or link
  - name: Role
    role: What they may do
  - name: Share surface
    role: Where access is granted
  - name: Inheritance
    role: How parent access flows
roles:
  - viewer
  - commenter
  - editor
  - owner
dimensions:
  - name: Permission model
    family: collaboration
    question: What rights can be granted?
    subdimensions:
      - id: roles
        name: Roles
        select: many
        values:
          - id: view
            name: View
            example: Google Drive Viewer
          - id: comment
            name: Comment
            example: Docs Commenter
          - id: edit
            name: Edit
            example: Editor
          - id: owner-or-admin
            name: Owner or admin
            example: Drive Owner
          - id: custom-fine-grained
            name: Custom fine-grained
            example: GitHub repository roles
          - id: anonymous-link-access
            name: Anonymous link access
            example: Anyone with the link
  - name: Share invocation
    family: invocation
    question: How is sharing started?
    subdimensions:
      - id: openBy
        name: Open by
        select: many
        values:
          - id: share-button
            name: Share button
            example: Google Docs
          - id: copy-link
            name: Copy link
            example: Figma
          - id: invite-by-email
            name: Invite by email
            example: Drive
          - id: request-access-flow
            name: Request access flow
            example: Drive request
          - id: from-a-parent-folder-policy
            name: From a parent folder policy
            example: Inherited Drive permissions
  - name: Permission scope
    family: scope
    question: What does a grant apply to?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: whole-file
            name: Whole file
            example: Most docs
          - id: folder-and-children
            name: Folder and children
            example: Drive folders
          - id: one-section-or-page
            name: One section or page
            example: Notion locks
          - id: one-branch-or-environment
            name: One branch or environment
            example: GitHub environments
          - id: time-limited-access
            name: Time-limited access
            example: Expiring links
  - name: Sharing feedback
    family: feedback
    question: How does the person know who has access and what changed?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: people-list-with-roles
            name: People list with roles
            example: Share dialog
          - id: link-privacy-summary
            name: Link privacy summary
            example: Restricted vs anyone
          - id: access-warnings
            name: Access warnings
            example: External sharing banners
          - id: audit-of-grants
            name: Audit of grants
            example: Enterprise Drive logs
          - id: notify-on-share
            name: Notify on share
            example: Email invites
  - name: Grant lifecycle
    family: lifecycle
    question: How do grants start, change and end?
    subdimensions:
      - id: lifecycle
        name: Lifecycle
        select: one
        values:
          - id: until-revoked
            name: Until revoked
            example: Classic ACLs
          - id: expiring-access
            name: Expiring access
            example: Timed links
          - id: pending-request
            name: Pending request
            example: Request access
          - id: transferred-ownership
            name: Transferred ownership
            example: Drive make owner
          - id: inherited-then-broken
            name: Inherited then broken
            example: Stop inheriting
  - name: Policy initiative
    family: initiative
    question: Who decides the default sharing posture?
    subdimensions:
      - id: initiative
        name: Initiative
        select: one
        values:
          - id: person-chooses-each-time
            name: Person chooses each time
            example: Ad-hoc share dialogs
          - id: org-default-policies
            name: Org default policies
            example: Workspace admin
          - id: suggested-recipients
            name: Suggested recipients
            example: People you worked with
          - id: risk-based-prompts
            name: Risk-based prompts
            example: Warn before external share
wild:
  score: 2
  note: Link access and role menus are routinely changed; inheritance and expiry less often.
  examples:
    - name: Google Drive
      note: Roles, link sharing, expiry
    - name: Figma
      note: Team vs link access
    - name: GitHub
      note: Collaborators, teams, branch protection
techniques:
  - name: Access as a visible list
    dimension: Sharing feedback
    how: Always show principals and roles as an editable collection, including link principals, not only
      a success toast.
    ai: false
  - name: Warn before widening
    dimension: Policy initiative
    how: When a change expands audience (especially external), show who newly gains access before
      confirming.
    ai: false
  - name: Suggest least privilege
    dimension: Permission model
    how: Recommend the narrowest role that matches the stated intent (“collect feedback” → commenter).
    ai: true
signature: Access as a visible list
sample: Cloud drives, design libraries, code hosts and enterprise content platforms.
unit: One share configuration for one artifact or container.
