  raterNotes:
    fable:
      - Arguments is pick-one but most palettes mix commands that run at once with ones that open a
        follow-up list; I coded whichever the palette is known for. Emacs' minibuffer is neither a
        toolbar nor an overlay.
      - arguments is pick one but every real palette mixes commands that run at once with a few that
        open a follow-up list, so it wants a which-dominates rule; detail cannot hold a shortcut and
        a description together (Google Docs); types lacks people and code symbols.
    opus:
      - detail is pick-one over palettes that show two things at once — IntelliJ and Notion give
        both a location and a shortcut — and ranking is genuinely unobservable in several cases,
        since fuzzy scoring and recency weighting are combined behind one ordered list; I coded
        whichever the product is known for and said so. types also blurs Places and Objects wherever
        a page is both.
      - "Two pick-one subs are doing pick-any work, and they account for most of this packet. detail
        asks which of four things a row shows when IntelliJ shows a location and a shortcut and
        Windows shows rows and a panel; arguments asks how a command collects input when every
        general-purpose palette runs most commands immediately and nests a few. I resolved both by
        taking the codebook's first-listed value, but both subs want to be pick any (or to ask about
        the palette's dominant case explicitly). The third fault is types: Places and Objects and
        files overlap wherever a page, a channel or a person is both a thing and a destination,
        which is the whole of the Notion and Slack disagreement — and Sonnet's +People and +Code
        symbols are both symptoms of that list being a list of six examples rather than a
        partition."
    sonnet:
      - Detail was often a judgment call between Name only and Name and description/shortcut when a
        result shows secondary text I can't confirm is always present (e.g. path context, category
        grouping) — I leaned toward the richer value only where I have fairly confident recall.
