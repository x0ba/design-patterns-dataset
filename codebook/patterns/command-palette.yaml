# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "command-palette". Edit between batches only — see README "Rules".
id: command-palette
name: Command palette
level: pattern
parent: navigate
aliases:
  - command bar
  - quick open
  - launcher
  - Cmd+K menu
definition: A keyboard-summoned search box that finds and runs commands, jumps to places and
  objects, and teaches shortcuts along the way.
data: collection
platforms:
  - desktop
  - web
domains:
  - software
  - productivity
  - design
anatomy:
  - name: Trigger
    role: The shortcut or button that summons it
  - name: Query
    role: The typed text
  - name: Results
    role: Ranked commands, places and objects
  - name: Arguments
    role: Follow-up inputs a command needs
roles:
  - title
  - shortcut
  - icon
  - description
dimensions:
  - name: Results
    family: content
    question: What can be found, and what does each result show?
    subdimensions:
      - id: types
        name: Result types
        select: many
        values:
          - id: commands
            name: Commands
            example: VS Code Command Palette
          - id: places
            name: Places
            example: Linear go-to
          - id: objects-and-files
            name: Objects and files
            example: VS Code Quick Open
          - id: settings-toggles
            name: Settings toggles
            example: Chrome omnibox actions
          - id: system-and-web-results
            name: System and web results
            example: Spotlight, Raycast
          - id: ai-answers
            name: AI answers
            example: Raycast AI
          - id: people
            name: People
            description: Finding and jumping to a specific person, distinct from a command, a place, a file, a
              settings toggle, a system/web result, or an AI answer.
            example: Notion — Search and actions
          - id: code-symbols
            name: Code symbols
            description: Classes, symbols and other code-structure results, distinct from commands, places,
              files, settings, web/system results or AI answers — the same gap found in the
              autocomplete entry's IntelliSense instance.
            example: IntelliJ IDEA — Search Everywhere
      - id: detail
        name: Result detail
        select: one
        values:
          - id: name-only
            name: Name only
            example: Minimal palettes
          - id: name-and-shortcut
            name: Name and shortcut
            example: VS Code keybinding hints
          - id: name-and-description
            name: Name and description
            example: Linear
          - id: preview-pane
            name: Preview pane
            example: Raycast detail view
  - name: Summoning
    family: invocation
    question: How is the palette opened and moded?
    subdimensions:
      - id: summon
        name: Summon by
        select: many
        values:
          - id: in-app-shortcut
            name: In-app shortcut
            example: Cmd+K in Linear
          - id: system-wide-hotkey
            name: System-wide hotkey
            example: Spotlight, Raycast, Alfred
          - id: visible-search-button
            name: Visible search button
            example: GitHub command palette button
          - id: prefix-characters
            name: Prefix characters
            description: Typed prefixes switch modes
            example: VS Code > and @
  - name: Arguments
    family: flow
    question: How does a command collect what it needs?
    subdimensions:
      - id: arguments
        name: Argument collection
        select: one
        values:
          - id: runs-immediately
            name: Runs immediately
            example: Toggle sidebar
          - id: nested-pages
            name: Nested pages
            example: Linear Change status submenu
          - id: inline-argument-fields
            name: Inline argument fields
            example: Raycast arguments
          - id: conversational-follow-up
            name: Conversational follow-up
            example: AI command bars
  - name: Ranking
    family: initiative
    question: Who decides which results come first?
    subdimensions:
      - id: ranking
        name: Ranking
        select: one
        values:
          - id: fuzzy-match
            name: Fuzzy match
            example: VS Code
          - id: frequency-and-recency
            name: Frequency and recency
            example: VS Code recently used
          - id: context-of-the-selection
            name: Context of the selection
            example: Linear commands for the selected issue
          - id: predicted-next-action
            name: Predicted next action
            example: Research prototypes
          - id: pinned-by-the-person
            name: Pinned by the person
            description: The person fixes chosen commands to the top of the list; the order is authored rather
              than matched, learned or contextual
            example: Obsidian — Command palette
          - id: manually-pinned
            name: Manually pinned
            description: The person manually pins specific commands to the top of the list, rather than the
              system ranking by fuzzy match, frequency/recency, selection context or predicted next
              action.
            example: Obsidian — Command palette
  - name: Command scope
    family: scope
    question: How far does it reach?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: current-app
            name: Current app
            example: Figma Quick actions
          - id: current-selection
            name: Current selection
            example: Linear
          - id: operating-system
            name: Operating system
            example: Spotlight
          - id: connected-apps
            name: Connected apps
            example: Raycast extensions
  - name: Placement
    family: layout
    question: Where does it appear?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: centered-overlay
            name: Centered overlay
            example: Linear
          - id: top-anchored-dropdown
            name: Top-anchored dropdown
            example: VS Code
          - id: full-screen
            name: Full screen
            example: Mobile palettes
          - id: inline-in-the-toolbar
            name: Inline in the toolbar
            example: Slack search bar
          - id: prompt-line-at-the-bottom-edge
            name: Prompt line at the bottom edge
            description: The palette is a single line docked to the bottom of the window (a minibuffer or status
              line) rather than a floating surface
            example: Emacs — M-x
wild:
  score: 2
  note: Launchers let people add commands and aliases; in-app palettes let people rebind shortcuts
    from results.
  examples:
    - name: Raycast
      note: Extensions, aliases and hotkeys per command
    - name: VS Code
      note: Change a keybinding from the palette
techniques:
  - name: Promote from palette
    dimension: Results
    how: A command run often from the palette can be promoted to a toolbar button or shortcut in place,
      so usage shapes the interface.
    ai: false
  - name: Macro from history
    dimension: Arguments
    how: Chain the last few commands into one named command.
    ai: false
  - name: Say it, see it, run it
    dimension: Arguments
    how: A sentence resolves to a command with arguments filled, shown as an ordinary palette row before
      it runs.
    ai: true
signature: Promote from palette
sample: Developer tools, design tools and SaaS products with a keyboard palette, plus OS launchers.
unit: One palette within one product.
