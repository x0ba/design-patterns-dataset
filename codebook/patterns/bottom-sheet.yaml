# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "bottom-sheet". Edit between batches only — see README "Rules".
id: bottom-sheet
name: Bottom sheet
level: component
parent: navigate
aliases:
  - sheet
  - action sheet
  - drawer from bottom
definition: A surface anchored to the bottom edge that can be dragged between heights, common on phones.
data: object
platforms:
  - mobile
domains:
  - mobility
  - commerce
  - entertainment
  - travel
anatomy:
  - name: Sheet
    role: The surface
  - name: Grabber
    role: The drag handle
  - name: Detents
    role: Its resting heights
roles: []
dimensions:
  - name: Heights
    family: layout
    question: Where can it rest?
    subdimensions:
      - id: detents
        name: Detents
        select: one
        values:
          - id: single-height
            name: Single height
            example: Action sheets
          - id: medium-and-large
            name: Medium and large
            example: iOS sheet detents
          - id: continuous
            name: Continuous
            example: Custom sheets
          - id: peek-bar
            name: Peek bar
            description: A strip that stays visible
            example: Apple Maps place card
  - name: Modality
    family: scope
    question: Can content behind it be used?
    subdimensions:
      - id: modality
        name: Modality
        select: one
        values:
          - id: modal-with-scrim
            name: Modal with scrim
            example: Share sheets
          - id: non-modal
            name: Non-modal
            example: Google Maps place sheet
  - name: Contents
    family: content
    question: What does it hold?
    subdimensions:
      - id: holds
        name: Holds
        select: one
        values:
          - id: actions
            name: Actions
            example: iOS action sheets
          - id: selection-detail
            name: Selection detail
            example: Apple Maps
          - id: filters
            name: Filters
            example: Airbnb on mobile
          - id: player-that-expands
            name: Player that expands
            example: Spotify Now Playing
          - id: form
            name: Form
            description: Fields or option pickers ending in a confirm action (Apple Pay sheet, DoorDash item
              options)
            example: DoorDash — Item options sheet
          - id: a-list-of-results-or-options
            name: A list of results or options
            description: The sheet holds a set of things to choose between — ride types, routes, search results
              — rather than actions on one thing or the detail of one thing
            example: Uber — Choose a ride sheet
          - id: a-form-or-transaction
            name: A form or transaction
            description: The sheet holds fields and a total to review and authorise, such as a payment sheet
            example: Apple Pay — Payment sheet
          - id: comments-or-discussion-thread
            name: Comments or discussion thread
            description: A scrollable list of comments or discussion about the item behind, with a composer to
              add one.
            example: Instagram — Comments sheet
          - id: status-or-tracking-timeline
            name: Status or tracking timeline
            description: A persistent status/progress timeline for an ongoing process (delivery, ride, order)
              shown over live map or content.
            example: Uber Eats — Order tracking sheet
          - id: search-input
            name: Search input
            description: A search field with live suggestions, resting at a peek height and growing as the
              person types.
            example: Apple Maps — Search sheet
  - name: Dismissal
    family: invocation
    question: How does it leave?
    subdimensions:
      - id: dismissBy
        name: Dismissed by
        select: many
        values:
          - id: swipe-down
            name: Swipe down
            example: iOS sheets
          - id: tap-the-scrim
            name: Tap the scrim
            example: Modal sheets
          - id: close-button
            name: Close button
            example: Share sheets
          - id: minimize-to-the-lowest-detent
            name: Minimize to the lowest detent
            example: Maps
wild:
  score: 0
  note: Resting heights are chosen by the product, though people re-drag them constantly.
  examples: []
techniques:
  - name: Detent memory
    dimension: Heights
    how: The height a person leaves a sheet at becomes that sheet’s default.
    ai: false
signature: Detent memory
sample: Map, ride-hailing, delivery and media apps.
unit: One sheet.
