        sub: holds
        dim: null
        name: Search and results
        gloss: A search field, suggestions or a list of results over a map or feed (Apple Maps search sheet,
          Airbnb listings over the map, Google Maps route options)
        raters:
          - fable
        instances:
          - 12
          - 16
          - 17
        status: raised
      - place: sub:holds
        sub: holds
        dim: null
        name: Results list over a map
        gloss: A scrollable list of several result cards (not detail about one already-selected item) shown
          over a live map.
        raters:
          - sonnet
        instances:
          - 12
          - 17
        status: raised
  raterNotes:
    fable:
      - holds lacks the two commonest map-app contents (results lists) and forms; proposed both.
        Ride-option sheets were coded Selection detail as the nearest fit.
      - holds is missing the three commonest map and social contents (lists of options, comment
        threads, payment forms); dismissBy's Swipe down and Minimize overlap on every sheet with a
        floor unless Swipe down means removal; Modal with scrim bundles blocking with dimming, which
        TikTok separates; Peek bar co-occurs with medium and large so detents wants to be pick any
        or Peek bar wants to mean has a floor.
    opus:
      - "holds is the thin sub-dimension: four variations cannot cover the sheets that carry search,
        results, a conversation or a payment, and I had to read comments sheets as selection detail
        to place them at all. detents also conflates two ideas — how many resting heights there are,
        and whether the lowest one is still visible — so Peek bar competes with Medium and large
        rather than sitting beside it."
      - holds is not a closed set — a bottom sheet can hold anything, and the four variations forced
        three raters into five different proposals; it should be reframed as pick any over broad
        content kinds (actions / detail / chooser / thread / form / status / media). detents
        conflates the number of resting heights with whether the lowest one stays visible, so Peek
        bar competes with Medium and large instead of sitting beside it; and dismissBy mixes the
        trigger (swipe, button, outside tap) with the destination (minimize), and 'Tap the scrim'
        cannot express tapping outside a sheet that has no scrim (TikTok comments).
    sonnet:
      - Holds was the dimension with the most genuine coverage gaps — four proposals across the 20
        instances, all for recurring content types (comments, map-result lists, tracking, search)
        rather than one-offs, which suggests the dimension's four variations were drawn mainly from
        action/detail sheets and didn't anticipate map- and feed-app sheets. dismissBy came back '?'
        three times for sheets that are more a persistent mode of the screen than something
        explicitly closed.
