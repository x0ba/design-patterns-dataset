          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Recovery lacks values for no-results pages that offer alternatives rather than a
        clear-filters button, and for access-denied pages.
      - recovery has no value for the commonest no-results page, where the way out is a new query;
        content has no value for suggested real items, so they land under Templates or samples.
        starters and recovery want pick any where a page offers both a template and an AI starter,
        or both new keywords and clearing filters.
    opus:
      - "The entry is written for first-use and retail no-results screens, and the two proposals on
        recovery are where it runs out: a search with no matches usually needs a new query, not a
        filter reset, and a permission wall needs a human. starters is where empty states are
        quietly changing — four instances offer recommended real items rather than templates or
        samples, and 'Generated from a prompt' appears only as one option among four in Notion's new
        page. content's Create action is doing two jobs, since in several instances the only
        'content' of the empty state is a button; cause was the easiest sub in my whole slice, with
        no ambiguity anywhere in the sample."
      - "The entry's real fault is that `starters` and `recovery` were written for first-use
        emptiness and then applied to no-results screens: a nearby-homes strip is neither a template
        nor a recovery button, and 'None' cannot distinguish a page that offers nothing from one
        whose only way out is typing a different query. `content` also needs the gloss to say
        whether a control that is always on the screen (Add task, New Reminder) counts as the empty
        state's create action — that single question split all three of us across four instances."
    sonnet:
      - No-results screens whose only offered path forward is textual advice (check spelling, try
        different keywords) with no Clear-filters/Create/Import button are coded recovery None
        rather than forced into Clear filters, even when a related-search link is present.
      - "The `starters` (pick one) and `recovery` (pick one) subs both lack a value for the single
        most common no-results pattern in the sample: offering real substitute items (nearby homes,
        related titles, other songs) instead of a template/sample/prompt-generated head start, and
        offering a better query instead of a filter to clear. All three raters independently reached
        for new language here across multiple instances, which is a strong signal these are missing
        variations rather than one-off product quirks — I adopted opus's two proposals since they
        were the ones applied consistently across the whole cluster (4/5/13/16 and 10/12/13/17)
        rather than per-instance."
  codedAt: 2026-09-22
