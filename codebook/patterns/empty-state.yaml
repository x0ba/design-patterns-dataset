# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "empty-state". Edit between batches only — see README "Rules".
id: empty-state
name: Empty state
level: component
parent: guide
aliases:
  - blank slate
  - zero state
  - no results
definition: What a view shows when it has nothing in it yet, or when nothing matches.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - software
  - commerce
  - enterprise
anatomy:
  - name: Explanation
    role: Why it is empty
  - name: Action
    role: What to do next
  - name: Starters
    role: Templates or samples
roles: []
dimensions:
  - name: Cause and content
    family: content
    question: Why is it empty, and what is shown?
    subdimensions:
      - id: cause
        name: Cause
        select: one
        values:
          - id: first-use
            name: First use
            example: New project
          - id: no-results
            name: No results
            example: Search with no matches
          - id: cleared
            name: Cleared
            example: Inbox zero
          - id: no-access-or-error
            name: No access or error
            example: Permission pages
      - id: content
        name: Content
        select: many
        values:
          - id: illustration
            name: Illustration
            example: Dropbox empty folders
          - id: explanation
            name: Explanation
            example: Most
          - id: create-action
            name: Create action
            example: New issue button
          - id: templates-or-samples
            name: Templates or samples
            example: Notion templates
          - id: tips
            name: Tips
            example: Keyboard tips
  - name: Starter content
    family: initiative
    question: Does the system offer a head start?
    subdimensions:
      - id: starters
        name: Starters
        select: one
        values:
          - id: none
            name: None
            example: Blank lists
          - id: templates
            name: Templates
            example: Notion
          - id: sample-data
            name: Sample data
            example: Airtable sample bases
          - id: generated-from-a-prompt
            name: Generated from a prompt
            example: AI starters in workspace tools
          - id: recommendations
            name: Recommendations
            description: System-picked items offered to add as a head start
            example: Spotify — Empty playlist
          - id: suggested-items
            name: Suggested items
            description: The head start is a set of real items the system picks — songs for an empty playlist,
              nearby homes when nothing matched — rather than a template, sample data or something
              generated from a prompt
            example: Spotify — Empty playlist
  - name: Recovery
    family: invocation
    question: What gets a person out of emptiness?
    subdimensions:
      - id: recovery
        name: Recovery
        select: one
        values:
          - id: none
            name: None
            example: Empty tables
          - id: clear-filters
            name: Clear filters
            example: Retail no-results pages
          - id: create-the-first-item
            name: Create the first item
            example: Productivity apps
          - id: import
            name: Import
            example: CSV import
          - id: suggested-searches
            name: Suggested searches
            description: Alternative queries or related items offered as the way out of no results
            example: Amazon — No results for a search
          - id: request-access
            name: Request access
            description: A button to ask the owner for permission
            example: Google Docs — You need access
          - id: try-another-query
            name: Try another query
            description: The way out is changing the search itself — spelling advice, broader terms, suggested
              alternative queries — which is the commonest no-results recovery and is not the same
              as clearing filters
            example: Amazon — No results for a search
wild:
  score: 0
  note: Empty states are fixed copy.
  examples: []
techniques:
  - name: Start from the design space
    dimension: Starter content
    how: Offer starting points that span the pattern’s design space (a list, a board, a calendar)
      instead of one blank default.
    ai: false
signature: Start from the design space
sample: First-use and no-results screens across SaaS and retail.
unit: One empty state.
