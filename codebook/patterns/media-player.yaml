  raterNotes:
    fable:
      - "resume: 'Synced across devices' was reserved for live position hand-off (Spotify Connect,
        Whispersync, iCloud podcasts); cross-session resume that also works on another device
        (Netflix, Plex, YouTube) was coded Resume position because the Netflix exemplar sits there.
        Transcripts were coded under 'Lyrics synced to time' as the only synced-text variation."
    opus:
      - The teaching players (Coursera, Panopto, Khan) all pair the video with a synchronised
        transcript or slide list that is the real navigation device, and neither position nor
        overlays has a value for it; I coded Captions and noted the gap each time. mode also
        conflates framing with device state — YouTube's watch page is an inline embed, a theater
        mode and a PiP depending on what you press, so I coded the resting state.
    sonnet:
      - mode was a poor fit for standalone desktop file players (VLC, QuickTime) since 'a resizable
        primary window that can go fullscreen' isn't quite inline-embed, theater,
        fullscreen-as-default, mini/PiP, or lock-screen; marked QuickTime '?' and picked the closest
        (Fullscreen) for VLC given its movie-watching framing in the sample.
      - "Three codebook problems surfaced here: `resume` is pick-one but conflates whether playback
        resumes with where the position is stored, so Resume position and Synced across devices
        overlap and every syncing product forces an arbitrary choice; `mode`'s 'Lock-screen / Now
        Playing' reads as both the system lock-screen surface and any app's full-screen Now Playing
        screen, which split all three raters on Spotify, Apple Podcasts, YouTube Music and Audible;
        and a time-synced transcript (Apple Podcasts, Coursera, Panopto) has no code at all —
        'Lyrics synced to time' under `position` wants generalising to time-synced text."
