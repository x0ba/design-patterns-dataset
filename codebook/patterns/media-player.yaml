# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "media-player". Edit between batches only — see README "Rules".
id: media-player
name: Media player
level: pattern
parent: consume-media
aliases:
  - video player
  - audio player
  - playback controls
definition: A stage and transport for playing video or audio, with position, quality and optional
  overlays under the person’s control.
data: media
platforms:
  - web
  - mobile
  - desktop
  - xr
domains:
  - entertainment
  - education
  - news
  - social
  - communication
anatomy:
  - name: Stage
    role: Where the media renders
  - name: Transport bar
    role: Play, seek, volume
  - name: Chrome
    role: Title, creator and actions
  - name: Overlays
    role: Captions, chapters, ads
roles:
  - title
  - creator
  - duration
  - chapter
  - caption
dimensions:
  - name: Transport controls
    family: flow
    question: Which playback controls are available?
    subdimensions:
      - id: controls
        name: Controls
        select: many
        values:
          - id: play-pause
            name: Play pause
            example: YouTube
          - id: scrubber
            name: Scrubber
            example: Netflix
          - id: skip-forward-back
            name: Skip forward back
            example: Apple Podcasts ±15s
          - id: playback-speed
            name: Playback speed
            example: YouTube speed menu
          - id: volume-and-mute
            name: Volume and mute
            example: Spotify
          - id: fullscreen
            name: Fullscreen
            example: Vimeo
  - name: Position and chapters
    family: content
    question: How is position shown and segmented?
    subdimensions:
      - id: position
        name: Position encoding
        select: many
        values:
          - id: time-scrubber
            name: Time scrubber
            example: YouTube
          - id: chapter-markers
            name: Chapter markers
            example: YouTube chapters
          - id: heatmap-of-rewatches
            name: Heatmap of rewatches
            example: YouTube most-replayed
          - id: lyrics-synced-to-time
            name: Lyrics synced to time
            example: Spotify Lyrics
          - id: thumbnail-previews-on-hover
            name: Thumbnail previews on hover
            example: YouTube scrub previews
  - name: Presentation mode
    family: layout
    question: How is the player framed on screen?
    subdimensions:
      - id: mode
        name: Mode
        select: one
        values:
          - id: inline-embed
            name: Inline embed
            example: YouTube on news sites
          - id: theater-or-immersive
            name: Theater or immersive
            example: YouTube Theater
          - id: fullscreen
            name: Fullscreen
            example: Netflix
          - id: mini-or-pip
            name: Mini or PiP
            example: YouTube PiP
          - id: lock-screen-now-playing
            name: Lock-screen / Now Playing
            example: iOS Now Playing
          - id: standalone-window
            name: Standalone window
            description: A desktop player in its own resizable window, neither embedded in a page nor fullscreen
              by default
            example: VLC — Desktop player
  - name: Adaptation
    family: adaptation
    question: How does playback adapt to device and network?
    subdimensions:
      - id: adaptation
        name: Adaptation
        select: many
        values:
          - id: adaptive-bitrate
            name: Adaptive bitrate
            example: Netflix ABR
          - id: manual-quality
            name: Manual quality
            example: YouTube 1080p
          - id: offline-download
            name: Offline download
            example: Spotify Downloads
          - id: audio-only-fallback
            name: Audio-only fallback
            example: YouTube Music background
          - id: data-saver-mode
            name: Data-saver mode
            example: YouTube data saving
  - name: Overlays and assistance
    family: feedback
    question: What appears on top of the media?
    subdimensions:
      - id: overlays
        name: Overlays
        select: many
        values:
          - id: captions
            name: Captions
            example: Netflix subtitles
          - id: end-cards-and-annotations
            name: End cards and annotations
            example: YouTube end screens
          - id: live-chat-beside-stage
            name: Live chat beside stage
            example: Twitch
          - id: ad-breaks
            name: Ad breaks
            example: YouTube ads
          - id: ambient-lyrics-or-visuals
            name: Ambient lyrics or visuals
            example: Apple Music
          - id: scene-metadata-overlay
            name: Scene metadata overlay
            description: Information about what is on screen at this moment — the actors in this scene, the song
              playing, the product shown — surfaced over or beside the video and updating as it
              plays
            example: Prime Video — Web player with X-Ray
  - name: Session continuity
    family: lifecycle
    question: How does playback resume across sessions?
    subdimensions:
      - id: resume
        name: Resume
        select: one
        values:
          - id: always-from-start
            name: Always from start
            example: Short clips
          - id: resume-position
            name: Resume position
            example: Netflix Continue Watching
          - id: synced-across-devices
            name: Synced across devices
            example: Spotify Connect position
          - id: live-edge-only
            name: Live edge only
            example: Live sports streams
wild:
  score: 2
  note: Speed, captions and quality menus are common; chapter density and overlay layout rarely are.
  examples:
    - name: YouTube
      note: Speed, quality, caption font
    - name: Netflix
      note: Subtitle appearance
    - name: VLC
      note: Nearly every transport and codec option
techniques:
  - name: Chapter as overview
    dimension: Position and chapters
    how: "Treat chapters as an overview–detail of the timeline: surface, hide and reorder chapter
      attributes the way Meridian surfaces card attributes."
    ai: false
  - name: Caption style transfer
    dimension: Overlays and assistance
    how: Copy caption size, colour and position from one app and apply it in another.
    ai: false
  - name: Skip the boring part
    dimension: Transport controls
    how: Ask to jump to the demo, the chorus or the spoiler-free recap; the model proposes timestamps
      with sources.
    ai: true
signature: Chapter as overview
sample: YouTube, Netflix, Spotify, Twitch, Apple Podcasts and course platforms.
unit: One player instance bound to one media object.
relations:
  uses:
    - slider
    - menu
    - toast
    - progress-indicator
  specializes:
