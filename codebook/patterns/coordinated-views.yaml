    adopted:
      - sub: trigger
        name: Pan or zoom
        raters:
          - fable
          - opus
      - sub: trigger
        name: Pan or zoom the view
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Trigger lacks a camera move, which is how every map-plus-list product coordinates; Scope is
        a pick-one over products that mix one-mark clicks with dashboard-wide controls, coded the
        characteristic act.
      - scope mixes the unit selected (one mark, a group, a brushed subset) with the reach of
        propagation (all linked views, one view only), so every click-to-filter dashboard holds two
        values; it wants to be two subs or pick any. trigger lacks a camera move, which every
        map-plus-list product uses (adopted +Pan or zoom the view). authorship depends on whether
        the sample names the editor or the viewer of the same product, and the codebook does not say
        which to code.
    opus:
      - "Scope mixes two questions — how big the selection is (one mark, a brush, a category) and
        how far it propagates (all views, one view) — so an instance where clicking one bar filters
        every view cannot be coded on both counts; I coded the propagation where the product's point
        is reach and the granularity where the product's point is marking. Authorship also depends
        on who is looking rather than on the artifact: the same Kibana or Superset dashboard is
        fixed for a reader and editable for its author."
      - "`scope` is the codebook fault behind a third of this packet: it mixes the extent of a
        selection (one mark, a brushed subset, a categorical group) with how far the action reaches
        (all linked views, one view only), and both are true of every dashboard — it should be two
        sub-dimensions, or pick any. Second, `linkChannel` has no way to say that a control narrows
        a single view rather than linking two, which is what split Flightradar24 and Google Trends."
    sonnet:
      - Map-pan interactions (Zillow, Airbnb, Google Flights) don't map cleanly onto any listed
        trigger — closest is Brush a region, since panning redefines a spatial region of interest.
      - "Scope conflates two axes that don't always point the same way: what was selected (one mark
        / a brushed subset / a categorical group) versus how far the coordination reaches (one view
        only / all linked views) -- Spotfire's free-form lasso needed the first axis named even
        though it also reaches every view, unlike the click-based dashboards where the reach was the
        more informative fact."
  codedAt: 2026-09-22
