# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "coordinated-views". Edit between batches only — see README "Rules".
id: coordinated-views
name: Coordinated views
level: pattern
parent: analyze
aliases:
  - multiple coordinated views
  - brushing and linking
  - linked views
definition: Several views of the same or related data that stay synchronized through shared
  selection, filter or navigation.
data: collection
platforms:
  - web
  - desktop
domains:
  - science
  - finance
  - enterprise
  - health
  - government
anatomy:
  - name: View
    role: One representation
  - name: Link channel
    role: What is shared across views
  - name: Selection
    role: The shared focus set
  - name: Layout frame
    role: How views are arranged
roles: []
dimensions:
  - name: What is linked
    family: composition
    question: What state is shared across views?
    subdimensions:
      - id: linkChannel
        name: Link channel
        select: many
        values:
          - id: selection-highlight
            name: Selection highlight
            example: Tableau dashboard actions
          - id: filter
            name: Filter
            example: Cross-filtering dashboards
          - id: navigation-or-camera
            name: Navigation or camera
            example: Linked map and list
          - id: parameters
            name: Parameters
            example: Shared date range
          - id: derived-aggregates
            name: Derived aggregates
            example: Overview totals update with brush
  - name: View arrangement
    family: layout
    question: How are the views placed?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: tiled-dashboard
            name: Tiled dashboard
            example: Tableau dashboards
          - id: split-panes
            name: Split panes
            example: Observable side-by-side cells
          - id: tabbed-views
            name: Tabbed views
            example: BI report tabs
          - id: overview-detail-split
            name: Overview–detail split
            description: One overview drives a detail view
            example: Map plus table
          - id: floating-layers
            name: Floating layers
            example: Picture-in-picture charts
  - name: Coordination trigger
    family: invocation
    question: What action propagates across views?
    subdimensions:
      - id: trigger
        name: Trigger
        select: many
        values:
          - id: click-a-mark
            name: Click a mark
            example: Tableau filter action
          - id: brush-a-region
            name: Brush a region
            example: Scatterplot brushing
          - id: hover
            name: Hover
            example: Linked highlighting
          - id: change-a-control
            name: Change a control
            example: Shared slicers in Power BI
          - id: follow-a-story-beat
            name: Follow a story beat
            example: Tableau Stories
          - id: pan-or-zoom
            name: Pan or zoom
            description: Moving the camera of one view (panning or zooming a map) re-queries the linked views
            example: Zillow — Map and list
          - id: pan-or-zoom-the-view
            name: Pan or zoom the view
            description: Moving or zooming one view is itself the coordinating action — the viewport becomes the
              query and the linked list, count or chart is recomputed for what is now in frame; the
              standard mechanism of map-plus-list products
            example: Zillow — Map and list
  - name: Selection scope
    family: scope
    question: What does a coordinating action apply to?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: one-mark
            name: One mark
            example: Click a bar
          - id: a-brushed-subset
            name: A brushed subset
            example: Lasso select
          - id: a-categorical-group
            name: A categorical group
            example: Legend click
          - id: all-linked-views
            name: All linked views
            example: Dashboard-wide filter
          - id: one-view-only
            name: One view only
            description: Local selection
            example: Isolate mode
  - name: Coordination feedback
    family: feedback
    question: How does a person see what is linked?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: highlight-in-place
            name: Highlight in place
            example: Linked brushing
          - id: grey-out-non-matches
            name: Grey-out non-matches
            example: Tableau highlight
          - id: count-of-selected-rows
            name: Count of selected rows
            example: Status bars
          - id: empty-state-in-a-linked-view
            name: Empty-state in a linked view
            example: No matching points
          - id: action-breadcrumb
            name: Action breadcrumb
            example: Applied filter chips
  - name: View authorship
    family: initiative
    question: Who assembles and retunes the set of views?
    subdimensions:
      - id: authorship
        name: Authorship
        select: one
        values:
          - id: fixed-published-dashboard
            name: Fixed published dashboard
            example: Embedded BI
          - id: author-arranges-views
            name: Author arranges views
            example: Tableau Desktop
          - id: person-adds-a-linked-view
            name: Person adds a linked view
            example: Exploratory dashboards
          - id: suggested-companion-views
            name: Suggested companion views
            example: Auto-recommended charts beside a selection
wild:
  score: 2
  note: Authors rearrange and rewire actions; viewers mostly filter within a fixed layout.
  examples:
    - name: Tableau
      note: Dashboard actions and layout containers
    - name: Power BI
      note: Edit interactions between visuals
    - name: Observable
      note: Shared reactive cells across views
techniques:
  - name: Wire the brush
    dimension: What is linked
    how: Make the link channel (filter, highlight, navigate) a visible, editable binding between views
      rather than hidden dashboard logic.
    ai: false
  - name: Propose a companion view
    dimension: View authorship
    how: Given the current selection, suggest a second encoding that answers a complementary question
      and link it automatically.
    ai: true
  - name: Show the shared set
    dimension: Coordination feedback
    how: Surface the coordinated selection as a first-class collection a person can name, save and
      reuse.
    ai: false
signature: Wire the brush
sample: BI dashboards, scientific visual analytics systems and multi-view notebook layouts.
unit: One coordinated set of views over shared data.
relations:
  uses:
    - chart
    - split-pane
    - filter-controls
    - tabs
  specializes:
