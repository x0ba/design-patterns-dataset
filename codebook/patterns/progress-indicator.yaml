          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Delay handling is unobservable from product knowledge (whether a spinner waits 300 ms cannot
        be recalled), so every instance is Immediately; Coverage has no value for indicators that
        block nothing but are not in a tray.
      - coverage asks what is blocked but has no value for an indicator that blocks nothing and sits
        outside a tray (a hairline over a feed, a word by a title), so those split three ways;
        determinacy is pick one over bars that show a percentage and a time estimate together; delay
        is unobservable from memory.
    opus:
      - "Coverage reads as what the indicator blocks, so its fourth variation had to absorb
        everything non-blocking: real trays (Chrome, Drive), a menu bar item, an app-icon ring and
        an ambient saving chip all landed in Background task tray. Determinacy also hides a common
        hybrid — a bar that is really a fake curve (YouTube) versus one tracking bytes — which the
        codebook cannot separate."
      - "Coverage is the fault line: its question ('what does it block?') and its variations
        ('background task tray', 'one control') answer two different questions — what is blocked and
        where the indicator lives — so every non-blocking indicator that is not literally a tray has
        nowhere honest to go."
    sonnet:
      - Form and determinacy sometimes both apply (a bar that is also inside a small control);
        picked whichever was the dominant visual described.
      - "Coverage's line between 'A region' and 'Background task tray' is underspecified for
        modeless-but-separate-window cases (Finder/Explorer copy windows): the codebook glosses tray
        with Chrome downloads but doesn't say whether a whole floating window counts as a region or
        a tray. Also for coverage, a blocking modal dialog (Notion/Canva) needs its blocking
        behaviour, not its visual footprint, to decide Whole page vs A region — the gloss doesn't
        say this explicitly."
