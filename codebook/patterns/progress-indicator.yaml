# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "progress-indicator". Edit between batches only — see README "Rules".
id: progress-indicator
name: Progress indicator
level: component
parent: monitor
aliases:
  - spinner
  - progress bar
  - skeleton screen
  - loading state
definition: Showing that work is happening, and how far along it is.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - software
  - productivity
  - commerce
  - entertainment
anatomy:
  - name: Indicator
    role: Spinner, bar or skeleton
  - name: Label
    role: What is happening
  - name: Control
    role: Cancel or pause
roles: []
dimensions:
  - name: Determinacy
    family: feedback
    question: How much does it say about remaining work?
    subdimensions:
      - id: determinacy
        name: Determinacy
        select: one
        values:
          - id: indeterminate
            name: Indeterminate
            example: Spinners
          - id: percentage
            name: Percentage
            example: Download bars
          - id: steps-completed
            name: Steps completed
            description: 3 of 10
            example: Batch jobs
          - id: time-remaining
            name: Time remaining
            example: macOS file copy
  - name: Form
    family: layout
    question: What does it look like?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: spinner
            name: Spinner
            example: iOS activity indicator
          - id: linear-bar
            name: Linear bar
            example: Material linear progress
          - id: circular-determinate
            name: Circular determinate
            example: App Store downloads
          - id: skeleton-placeholders
            name: Skeleton placeholders
            example: LinkedIn feed loading
          - id: inside-a-button
            name: Inside a button
            example: Submit buttons
          - id: text-status
            name: Text status
            description: A word or short phrase (Saving…, Posting…) with at most a small icon and no geometric
              progress indicator
            example: Google Docs — Saving indicator
  - name: Delay handling
    family: lifecycle
    question: When does it appear?
    subdimensions:
      - id: delay
        name: Delay
        select: one
        values:
          - id: immediately
            name: Immediately
            example: Most spinners
          - id: after-a-short-delay
            name: After a short delay
            description: Avoids flashes for quick work
            example: Well-tuned apps
          - id: moves-to-background
            name: Moves to background
            example: Export jobs that notify on completion
  - name: Coverage
    family: scope
    question: What does it block?
    subdimensions:
      - id: coverage
        name: Coverage
        select: one
        values:
          - id: whole-page
            name: Whole page
            example: Page loads
          - id: a-region
            name: A region
            example: Card loading
          - id: one-control
            name: One control
            example: Button spinners
          - id: background-task-tray
            name: Background task tray
            example: Chrome downloads
  - name: Control
    family: invocation
    question: Can the work be stopped?
    subdimensions:
      - id: control
        name: Control
        select: one
        values:
          - id: no-control
            name: No control
            example: Page loads
          - id: cancel
            name: Cancel
            example: File copies
          - id: pause-and-resume
            name: Pause and resume
            example: Downloads
wild:
  score: 0
  note: Indicators are never customizable; reduced-motion settings sometimes affect them.
  examples: []
techniques:
  - name: Send to background
    dimension: Delay handling
    how: Any long wait can be moved to a background tray that notifies on completion.
    ai: false
signature: Send to background
sample: Loading, upload, export and installation flows.
unit: One indicator.
relations:
  uses: []
  specializes: []
  neighbors:
    - stepper
    - status-tracker
scores:
  ubiquity: 5
  potential: 2
  spec: 5
evidence: agent-coded
usage:
  - Indeterminate waits feel longer than determinate ones
questions:
  - How should an AI agent’s progress be shown when its steps are not known in advance?
