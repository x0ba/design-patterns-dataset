# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "wizard". Edit between batches only — see README "Rules".
id: wizard
name: Wizard
level: pattern
parent: enter-data
aliases:
  - multi-step form
  - guided flow
  - setup assistant
definition: A multi-step flow that breaks a complex task into ordered screens, often branching on
  earlier answers.
data: sequence
platforms:
  - web
  - mobile
  - desktop
domains:
  - government
  - finance
  - software
  - health
anatomy:
  - name: Step
    role: One screen of questions
  - name: Progress
    role: How far along
  - name: Navigation
    role: Back, next, skip
  - name: Review
    role: Everything before committing
roles: []
dimensions:
  - name: Sequence
    family: flow
    question: How do steps connect, and can the task be resumed?
    subdimensions:
      - id: sequence
        name: Sequence
        select: one
        values:
          - id: fixed-linear
            name: Fixed linear
            example: Account creation
          - id: branching
            name: Branching
            description: Later steps depend on answers
            example: TurboTax
          - id: task-list
            name: Task list
            description: Sections in any order
            example: GOV.UK task list pattern
          - id: adaptive-skipping
            name: Adaptive skipping
            description: Known answers skip steps
            example: Returning-customer checkouts
      - id: resume
        name: Resumability
        select: one
        values:
          - id: one-sitting
            name: One sitting
            example: Short setups
          - id: save-and-return
            name: Save and return
            example: Government applications
          - id: automatic-resume
            name: Automatic resume
            example: TurboTax
  - name: Progress
    family: feedback
    question: How is progress shown?
    subdimensions:
      - id: progress
        name: Progress
        select: one
        values:
          - id: none
            name: None
            example: Typeform
          - id: stepper-with-titles
            name: Stepper with titles
            example: Checkouts
          - id: percentage-bar
            name: Percentage bar
            example: Surveys
          - id: task-list-with-status
            name: Task list with status
            example: GOV.UK task list
          - id: step-counter
            name: Step counter
            description: Step n of m as a bare count, with no step titles (Slack workspace creation)
            example: Slack — Create a workspace
  - name: Step density
    family: content
    question: How much is asked per step?
    subdimensions:
      - id: density
        name: Density
        select: one
        values:
          - id: one-thing-per-page
            name: One thing per page
            example: GOV.UK guidance
          - id: grouped-questions
            name: Grouped questions
            example: Tax software
          - id: whole-sections
            name: Whole sections
            example: Enterprise onboarding
  - name: Presentation
    family: layout
    question: Where does the wizard live?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: full-page
            name: Full page
            example: Government services
          - id: modal
            name: Modal
            example: SaaS setup dialogs
          - id: inline-accordion
            name: Inline accordion
            example: Single-page checkouts
          - id: conversational
            name: Conversational
            example: Chat-style intake
  - name: Review
    family: scope
    question: Can everything be reviewed before committing?
    subdimensions:
      - id: review
        name: Review
        select: one
        values:
          - id: no-review
            name: No review
            example: Short flows
          - id: summary-page-with-change-links
            name: Summary page with change links
            example: GOV.UK check your answers
          - id: running-summary
            name: Running summary
            example: Checkout order summary
  - name: Assistance
    family: initiative
    question: Does the system help answer?
    subdimensions:
      - id: assistance
        name: Assistance
        select: one
        values:
          - id: none
            name: None
            example: Most wizards
          - id: recommended-answers
            name: Recommended answers
            example: Setup defaults
          - id: interview-that-fills-steps
            name: Interview that fills steps
            description: A conversation completes the flow
            example: AI intake assistants
wild:
  score: 0
  note: Pacing and order are always fixed by the product.
  examples: []
techniques:
  - name: Collapse the wizard
    dimension: Sequence
    how: The same flow spec can render as one long form or as paced steps, and the person chooses, so
      experts are not held to the novice’s pace.
    ai: false
  - name: Ask only what’s missing
    dimension: Assistance
    how: Answers are drawn from documents already given; only unanswerable steps remain.
    ai: true
signature: Collapse the wizard
sample: Government applications, tax and insurance, device setup, SaaS onboarding.
unit: One multi-step flow.
relations:
  uses:
    - stepper
    - progress-indicator
    - text-field
    - choice-control
  specializes:
