        name: Step counter
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - "Fixed linear vs Branching is a matter of degree: almost every setup flow has one branch, so
        I coded Branching whenever an answer changes which screens come next."
      - review wants pick any for checkouts (a running total beside a final summary with change
        links); Grouped questions versus Whole sections has no threshold; Interview that fills steps
        overlaps presentation Conversational when the wizard is itself the conversation;
        presentation has no value for a standalone dialog window.
    opus:
      - "sequence forced a judgment call everywhere: nearly every real flow varies a little on
        earlier answers, so I reserved Branching for flows where a whole section appears or
        disappears and left Fixed linear for ones whose steps are the same every time. presentation
        has no variation for an installer or setup assistant that owns its own window — I coded
        those Full page rather than Modal. review conflates reviewing your answers with previewing
        the result (Airbnb)."
      - "review wants to be pick any: a checkout truthfully has both a running order-total summary
        and a final summary with change links, and nothing in the codebook says which wins. Two
        further gaps: presentation has no variation for a wizard that owns a window of its own
        (installers, OS setup assistants), so they all land on Modal or Full page by force; and
        assistance's Interview that fills steps overlaps presentation's Conversational, so a chat
        intake gets counted twice unless the interview is read as something separate that fills an
        otherwise ordinary form."
    sonnet:
      - "Resume was the hardest to pin down for consumer flows that don't advertise it (auto
        insurance quotes, brokerage signup): absent a known save-and-resume feature I defaulted to
        One sitting rather than guess Automatic/Save-and-return, which may undercount actual
        resumability."
      - "Two codebook findings recurred: (1) 'sequence' Branching vs Task list get confused when a
        product both varies content by answer AND shows a resumable left rail of named parts
        (Stripe) — Task list's gloss is really about order flexibility, not about a named/resumable
        rail, and I'd been conflating the two. (2) 'assistance' Interview that fills steps overlaps
        with 'presentation' Conversational — for a chatbot intake, coding assistance as
        Interview-that-fills-steps just restates the modality rather than answering whether the
        system recommends specific values."
