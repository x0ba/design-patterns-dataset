  unobserved:
    - sub: surface
      var: Picture-in-picture
  unresolved:
    - sub: continuation
      n: 13
    - sub: surface
      n: 14
  proposals:
    raised: 2
    adopted: []
    recorded:
      - place: sub:surface
        sub: surface
        dim: null
        name: Spatial window
        gloss: In XR the media is a floating, resizable window or an immersive environment in the room
          rather than a region of a screen
        raters:
          - fable
        instances:
          - 14
        status: raised
      - place: sub:surface
        sub: surface
        dim: null
        name: Screen placed in space
        gloss: In XR the stage is a window the viewer positions and resizes in their own room, or an
          environment that replaces the room — attention is claimed by placement rather than by
          filling a device's screen
        raters:
          - opus
        instances:
          - 14
        status: raised
  raterNotes:
    fable:
      - surface is pick-one but every audio app is at once a mini player, background audio and a
        full Now Playing screen; I coded Background audio for podcast/audiobook apps (codebook
        exemplar) and Mini player where the sample names the persistent bar.
    opus:
      - "surface is pick-one but audio apps are simultaneously a full Now Playing view, a persistent
        mini bar and screen-off playback; I ruled that the surface is the deepest claim on the
        session — Background audio for podcasts and audiobooks, Mini player for music apps that keep
        a bar while you browse — and noted it each time. continuation for an audiobook is also
        awkward: chapters follow each other inside one object, so I coded Stop for the object's
        end."
    sonnet:
      - Reading apps' page-turn/scroll behavior maps directly onto 'Continuous scroll' since the
        codebook itself cites Kindle for that transport value (the label is about self-paced
        reading, not a literal scroll gesture).
  codedAt: 2026-09-22
