# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "chart". Edit between batches only — see README "Rules".
id: chart
name: Chart
level: pattern
parent: analyze
aliases:
  - plot
  - graph
  - visualization
definition: A visual encoding of data values as marks and channels so a person can see
  distributions, comparisons and trends.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - science
  - finance
  - news
  - enterprise
  - health
  - education
anatomy:
  - name: Marks
    role: The visual elements
  - name: Axes and scales
    role: How values map to space
  - name: Legend
    role: How channels are decoded
  - name: Tooltip
    role: Detail on demand for a mark
  - name: Controls
    role: Encoding and filter affordances
roles:
  - mark
  - axis
  - legend
  - annotation
dimensions:
  - name: Mark encoding
    family: encoding
    question: What marks and channels carry the data?
    subdimensions:
      - id: markType
        name: Mark type
        select: one
        values:
          - id: points
            name: Points
            example: Scatterplots
          - id: bars
            name: Bars
            example: Bar charts
          - id: lines
            name: Lines
            example: Line charts
          - id: areas
            name: Areas
            example: Area charts
          - id: arcs
            name: Arcs
            example: Pie and donut
          - id: cells
            name: Cells
            example: Heatmaps
          - id: glyphs
            name: Glyphs
            example: Radar and parallel coordinates
      - id: channels
        name: Channels used
        select: many
        values:
          - id: position
            name: Position
            example: Cartesian plots
          - id: length
            name: Length
            example: Bars
          - id: colour-hue-or-value
            name: Colour hue or value
            example: Choropleths
          - id: size
            name: Size
            example: Bubble charts
          - id: shape
            name: Shape
            example: Categorical scatters
          - id: opacity
            name: Opacity
            example: Overplotting control
          - id: animation
            name: Animation
            description: A variable — almost always time — is mapped to motion over frames rather than to a
              static visual channel, with a play control and a scrubber; bar chart races, animated
              scatter trails
            example: Flourish — Bar chart race
  - name: Scale and axes
    family: layout
    question: How is the value space laid out?
    subdimensions:
      - id: scale
        name: Scale
        select: one
        values:
          - id: linear
            name: Linear
            example: Most charts
          - id: logarithmic
            name: Logarithmic
            example: Finance log scales
          - id: ordinal-or-band
            name: Ordinal or band
            example: Category axes
          - id: time
            name: Time
            example: Time-series axes
          - id: radial
            name: Radial
            example: Polar charts
      - id: faceting
        name: Facet or small multiples
        select: one
        values:
          - id: single-plot
            name: Single plot
            example: Simple charts
          - id: small-multiples
            name: Small multiples
            example: Tableau trellis
          - id: layered-series
            name: Layered series
            example: Multi-series lines
          - id: dual-axis
            name: Dual axis
            example: Combo charts
  - name: Mark interrogation
    family: invocation
    question: How does a person inspect a mark?
    subdimensions:
      - id: inspectBy
        name: Inspect by
        select: many
        values:
          - id: hover-tooltip
            name: Hover tooltip
            example: Observable Plot
          - id: click-to-select
            name: Click to select
            example: Tableau marks
          - id: brush-a-region
            name: Brush a region
            example: D3 brushing
          - id: cross-filter-linked-views
            name: Cross-filter linked views
            example: Power BI cross-highlight
          - id: click-through-to-source-rows
            name: Click-through to source rows
            example: Tableau View Data
  - name: Encoding authorship
    family: initiative
    question: Who chooses the encoding?
    subdimensions:
      - id: authorship
        name: Authorship
        select: one
        values:
          - id: author-specified
            name: Author-specified
            example: News graphics
          - id: builder-ui
            name: Builder UI
            example: Tableau shelves
          - id: recommended-chart-type
            name: Recommended chart type
            example: Excel Recommended Charts
          - id: generated-from-a-question
            name: Generated from a question
            example: Tableau Ask Data
  - name: Annotation and emphasis
    family: feedback
    question: How are findings called out on the chart?
    subdimensions:
      - id: annotation
        name: Annotation
        select: many
        values:
          - id: none
            name: None
            example: Raw plots
          - id: reference-lines
            name: Reference lines
            example: Tableau analytics pane
          - id: callout-labels
            name: Callout labels
            example: Datawrapper
          - id: story-points
            name: Story points
            example: Tableau Stories
          - id: automated-insight-captions
            name: Automated insight captions
            example: Power BI smart narratives
  - name: Responsive encoding
    family: adaptation
    question: How does the chart change with space and density?
    subdimensions:
      - id: adaptation
        name: Adaptation
        select: one
        values:
          - id: fixed-desktop-chart
            name: Fixed desktop chart
            example: Classic BI
          - id: reflow-for-narrow-screens
            name: Reflow for narrow screens
            example: Responsive Observable notebooks
          - id: aggregate-when-dense
            name: Aggregate when dense
            example: Hexbin overplotting
          - id: switch-mark-type-by-size
            name: Switch mark type by size
            example: Mobile chart simplification
wild:
  score: 2
  note: Authors and analysts rebind encodings freely; consumers of published charts usually cannot.
  examples:
    - name: Tableau
      note: Drag fields to shelves; swap mark types
    - name: Excel
      note: Change chart type and series
    - name: Observable
      note: Edit Plot code live
techniques:
  - name: Shelf rebinding
    dimension: Mark encoding
    how: Treat fields as objects dragged onto visual roles (x, y, colour, size) so encodings are
      reversible without rewriting queries.
    ai: false
  - name: Ask for a chart of…
    dimension: Encoding authorship
    how: A natural-language question proposes an encoding the person can edit on the shelves before
      accepting.
    ai: true
  - name: Explain this mark
    dimension: Mark interrogation
    how: Selecting a mark opens its contributing rows and the transform steps that produced it.
    ai: false
signature: Shelf rebinding
sample: BI tools, spreadsheet charts, news graphics libraries and embedded analytics widgets.
unit: One chart instance bound to one query or table.
relations:
  uses:
    - tooltip
    - filter-controls
    - stat-tile
  specializes:
