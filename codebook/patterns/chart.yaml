    raised: 1
    adopted:
      - sub: channels
        name: Animation
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Scale is a pick-one that conflates the x and value axes (time-series with log toggles coded
        Time); Adaptation's Fixed desktop chart also had to cover fixed mobile encodings.
      - scale is a pick one across two axes, so every bar, line-over-categories and log-toggle chart
        holds two values; it wants to be pick any or one sub per axis. adaptation's Fixed desktop
        chart has to hold every phone-native chart, and has no value for a fixed encoding that
        resizes with its container. annotation needs a rule that value and legend labels are not
        callouts, and a reference-mark value for a dot at a value. faceting's Small multiples and a
        band axis of repeated marks get confused when each category is drawn as its own row.
    opus:
      - "Scale is pick-one over a chart that has two axes and often a log toggle, so the code
        records the axis that defines the chart and loses the other. Fixed desktop chart is also
        doing duty for every chart that simply does not adapt, including five built for phones, and
        Datawrapper (16) shows the limit of the sample: a generic embed does not fix a mark type, so
        mark and scale are honestly unknowable."
      - "Three faults did most of the work here. `scale` and `faceting` each want two codes: a chart
        has a category axis and a value axis (Sheets, GitHub) and the codebook makes you choose one,
        and clustered/grouped series have no variation at all since Layered series means overlay.
        `adaptation`'s first variation is named 'Fixed desktop chart', so every non-adapting phone
        chart in the sample has to be coded as a desktop one. And `annotation` needs the line the
        raters kept drawing by hand: a data label or a direct series label is furniture, a reference
        value or a dated note is an annotation."
    sonnet:
      - markType/channels/scale were genuinely unknowable for the generic Datawrapper instance since
        the sample doesn't name a chart type; coded '?'. Otherwise mark type was usually clear from
        the product description.
      - The adaptation sub's 'Fixed desktop chart' is a misleading name for what's really 'doesn't
        restructure across viewport widths' -- it covers native single-context mobile app charts
        just as much as classic desktop BI, and I initially conflated 'renders on a phone' with
        'reflows for narrow screens' across several cells before correcting it.
