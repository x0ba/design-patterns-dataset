# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "pivot-table". Edit between batches only — see README "Rules".
id: pivot-table
name: Pivot table
level: pattern
parent: analyze
aliases:
  - crosstab
  - pivot
  - OLAP cube view
definition: A matrix that aggregates measures over chosen row and column dimensions, with drill,
  pivot and filter as first-class operations.
data: collection
platforms:
  - web
  - desktop
domains:
  - finance
  - enterprise
  - science
  - commerce
  - government
anatomy:
  - name: Rows
    role: Row dimension hierarchy
  - name: Columns
    role: Column dimension hierarchy
  - name: Values
    role: Aggregated measures
  - name: Filters
    role: What is included
  - name: Grand totals
    role: Rollups
roles:
  - dimension
  - measure
  - total
dimensions:
  - name: Axis binding
    family: composition
    question: What fields sit on rows, columns and values?
    subdimensions:
      - id: binding
        name: Binding
        select: many
        values:
          - id: flat-row-and-column-fields
            name: Flat row and column fields
            example: Excel PivotTable
          - id: hierarchical-nesting
            name: Hierarchical nesting
            example: Tableau nested pills
          - id: multiple-measures
            name: Multiple measures
            example: Value fields side by side
          - id: calculated-measures
            name: Calculated measures
            example: Excel calculated fields
          - id: swap-axes
            name: Swap axes
            example: Pivot / transpose
  - name: Aggregation
    family: encoding
    question: How are cell values computed and shown?
    subdimensions:
      - id: aggregate
        name: Aggregate
        select: one
        values:
          - id: sum
            name: Sum
            example: Sales pivots
          - id: count-or-distinct-count
            name: Count or distinct count
            example: Event pivots
          - id: average
            name: Average
            example: Rating pivots
          - id: percent-of-total
            name: Percent of total
            example: Share analysis
          - id: running-total
            name: Running total
            example: Cumulative finance views
      - id: cellDisplay
        name: Cell display
        select: one
        values:
          - id: number-only
            name: Number only
            example: Classic pivots
          - id: heat-colour-on-cells
            name: Heat colour on cells
            example: Conditional formatting
          - id: inline-mini-bars
            name: Inline mini-bars
            example: Excel data bars
          - id: sparklines-in-cells
            name: Sparklines in cells
            example: Dense finance sheets
  - name: Drill and expand
    family: flow
    question: How does a person move between aggregate and detail?
    subdimensions:
      - id: drill
        name: Drill
        select: many
        values:
          - id: expand-hierarchy
            name: Expand hierarchy
            example: Excel expand/collapse
          - id: drill-down-one-level
            name: Drill down one level
            example: OLAP drill
          - id: drill-through-to-rows
            name: Drill through to rows
            example: Show Details
          - id: slice-by-filter
            name: Slice by filter
            example: Report filters
          - id: keep-only-exclude
            name: Keep only / exclude
            example: Tableau
  - name: Layout density
    family: layout
    question: How is the matrix arranged on screen?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: compact-form
            name: Compact form
            example: Excel compact
          - id: tabular-form
            name: Tabular form
            example: Repeated labels
          - id: outline-form
            name: Outline form
            example: Classic outline
          - id: frozen-headers-with-scroll
            name: Frozen headers with scroll
            example: Large pivots
  - name: Pivot authorship
    family: initiative
    question: Who chooses the pivot configuration?
    subdimensions:
      - id: authorship
        name: Authorship
        select: one
        values:
          - id: person-builds-the-pivot
            name: Person builds the pivot
            example: Excel field list
          - id: saved-pivot-views
            name: Saved pivot views
            example: Named Excel pivots
          - id: recommended-pivot
            name: Recommended pivot
            example: Excel Recommended PivotTables
          - id: ask-for-a-crosstab
            name: Ask for a crosstab
            example: Natural-language pivot builders
  - name: Update lifecycle
    family: lifecycle
    question: When do aggregates refresh?
    subdimensions:
      - id: refresh
        name: Refresh
        select: one
        values:
          - id: manual-refresh
            name: Manual refresh
            example: Excel Pivot refresh
          - id: on-field-change
            name: On field change
            example: Live Tableau crosstabs
          - id: scheduled-extract-refresh
            name: Scheduled extract refresh
            example: Published workbooks
          - id: streaming-partial-updates
            name: Streaming partial updates
            example: Live operational pivots
wild:
  score: 3
  note: Row, column, value and filter bindings are routinely rearranged by end users.
  examples:
    - name: Excel
      note: Drag fields in the PivotTable field list
    - name: Google Sheets
      note: Explore and pivot editor
    - name: Tableau
      note: Rearrange pills on Rows and Columns
techniques:
  - name: Pills as bindings
    dimension: Axis binding
    how: Treat dimensions and measures as movable pills on row, column, filter and value shelves so
      pivots are reversible configurations.
    ai: false
  - name: Pivot that answers…
    dimension: Pivot authorship
    how: A question proposes row, column and aggregate bindings the person can edit before materializing
      the matrix.
    ai: true
  - name: Drill with provenance
    dimension: Drill and expand
    how: Every expand or drill-through keeps a visible path of aggregate decisions back to source rows.
    ai: false
signature: Pills as bindings
sample: Spreadsheets, BI crosstabs and operational reporting tools.
unit: One pivot configuration over one fact table or cube.
relations:
  uses:
    - filter-controls
    - sort-control
    - pagination
    - inline-edit
  specializes:
    - analyze
  neighbors:
