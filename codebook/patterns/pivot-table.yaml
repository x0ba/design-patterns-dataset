  raterNotes:
    fable:
      - Cell display coded as the default rendering (Number only) even where the tool offers heat
        colours, except pandas where the sample names the styling; Authorship is Person builds the
        pivot for all twenty.
      - cellDisplay is a pick one over products that offer plain numbers and conditional colour as
        options; the sampler's naming the colouring is what I now code, and the sub wants pick any.
        binding's Flat row and column fields is true of every pivot with one field per axis, so it
        overlaps Hierarchical nesting and carries no information as a pick-any item. authorship and
        refresh both depend on whether the sample means the builder or a person running the saved
        object.
    opus:
      - Aggregate is pick-one over a pivot that usually carries several measures with different
        functions, so the code records the default or headline one; Ask for a crosstab went unused,
        since natural-language pivot building is not the way any of these twenty are actually
        driven. Authorship also depends on the reader — a Salesforce matrix report or a published
        Superset chart is built by one person and run by another.
      - "`cellDisplay` is the fault behind a fifth of this packet: it is pick one, its first
        variation is named 'Number only', and every BI product in the sample shows numbers with
        optional conditional colour — so a rater who codes the default and a rater who codes the
        sampled screen can never agree. `drill` mixes operations that coexist (expand in place vs
        replace a level) with scoping ones (slice, keep only), which is why Expand hierarchy and
        Drill down one level kept swapping places."
    sonnet:
      - Aggregate defaulted to Sum, the near-universal pivot default, except where the product's own
        semantics point elsewhere (Mixpanel/Amplitude event counts, pandas' mean default).
      - "Binding was systematically under-coded by me the same way notebook's assistance sub was --
        calculated fields, multiple measures and swap-axes were often named in my own instance notes
        but not coded into the pick-any list. One real ambiguity: pill/hierarchy-native tools
        (Tableau, Power BI, SAP) don't have a meaningfully separate 'flat' mode the way Excel/Sheets
        do, since a single pill is still drawn from the same always-nestable mechanism -- both other
        raters consistently dropped 'Flat row and column fields' for those tools and I now think
        that's right rather than an oversight."
  codedAt: 2026-09-22
