# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "notification-center". Edit between batches only — see README "Rules".
id: notification-center
name: Notification center
level: pattern
parent: monitor
aliases:
  - notifications
  - activity inbox
  - bell menu
definition: A collected list of notifications from many sources, reviewed and cleared after the fact.
data: stream
platforms:
  - mobile
  - desktop
  - web
domains:
  - software
  - social
  - enterprise
  - communication
anatomy:
  - name: Notification
    role: One event
  - name: Groups
    role: How events are bundled
  - name: Actions
    role: What can be done from here
  - name: Settings entry
    role: Where to change what arrives
roles:
  - source
  - title
  - preview
  - timestamp
  - reason
dimensions:
  - name: Grouping
    family: composition
    question: How are notifications bundled?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: chronological-list
            name: Chronological list
            example: Android default
          - id: by-app
            name: By app
            example: iOS stacks
          - id: by-object
            name: By object
            example: GitHub notifications by repository
          - id: priority-sections
            name: Priority sections
            example: Android priority conversations
  - name: What arrives
    family: initiative
    question: What decides which notifications get through?
    subdimensions:
      - id: filtering
        name: Filtering
        select: one
        values:
          - id: everything
            name: Everything
            example: Default settings
          - id: per-source-toggles
            name: Per-source toggles
            example: App notification settings
          - id: focus-modes
            name: Focus modes
            example: iOS Focus
          - id: summaries
            name: Summaries
            example: Apple Intelligence notification summaries
  - name: Clearing
    family: lifecycle
    question: How does a notification leave?
    subdimensions:
      - id: clearing
        name: Clearing
        select: one
        values:
          - id: dismiss
            name: Dismiss
            example: Swipe away on mobile
          - id: mark-done
            name: Mark done
            example: GitHub Done
          - id: expire
            name: Expire
            example: Time-sensitive alerts
          - id: snooze
            name: Snooze
            example: Android notification snooze
          - id: mark-read
            name: Mark read
            description: "The item never leaves: viewing it or an explicit Mark as read only clears its unread
              styling (social feeds, Slack Activity, Jira, Teams, Discord)"
            example: Slack — Activity
          - id: read-on-view
            name: Read on view
            description: The notification is never removed — opening the surface or the item only clears its
              unread state, and the entry stays in the list until it ages out; the default in social
              and activity feeds, and distinct from an explicit Dismiss or Done
            example: Slack — Activity
  - name: Item content
    family: content
    question: What does a notification show?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: title-and-source
            name: Title and source
            example: All
          - id: preview-text
            name: Preview text
            example: Messages
          - id: rich-media
            name: Rich media
            example: Photos
          - id: inline-actions
            name: Inline actions
            example: Reply from notification
          - id: reason
            name: Reason
            description: Why you got it
            example: GitHub reason labels
  - name: Surface
    family: layout
    question: Where does the list live?
    subdimensions:
      - id: surface
        name: Surface
        select: one
        values:
          - id: pull-down-shade
            name: Pull-down shade
            example: Android
          - id: side-panel
            name: Side panel
            example: Windows notification center
          - id: dedicated-page
            name: Dedicated page
            example: GitHub notifications
          - id: bell-popover
            name: Bell popover
            example: Web apps
  - name: Bulk handling
    family: scope
    question: How are many handled at once?
    subdimensions:
      - id: bulk
        name: Bulk
        select: many
        values:
          - id: clear-all
            name: Clear all
            example: iOS
          - id: clear-a-group
            name: Clear a group
            example: iOS stacks
          - id: mark-all-read
            name: Mark all read
            example: Web apps
          - id: filter-by-reason
            name: Filter by reason
            description: Mentioned, assigned, review requested
            example: GitHub
wild:
  score: 2
  note: Per-app settings and focus modes exist; conditions and rules rarely do.
  examples:
    - name: iOS
      note: Focus modes and summaries
    - name: GitHub
      note: Filter by reason and custom filters
techniques:
  - name: Reason filters
    dimension: Bulk handling
    how: Filter by why a notification exists, then turn any filter into a rule for what arrives in
      future.
    ai: false
  - name: Summaries with sources
    dimension: What arrives
    how: Stacks collapse into a summary whose every line opens the notification it came from.
    ai: true
signature: Reason filters
sample: Mobile operating systems, developer platforms, social and SaaS products.
unit: One notification surface.
relations:
  uses:
    - badge
    - toast
    - menu
    - bulk-actions
    - popover
  specializes:
    - monitor
  neighbors:
