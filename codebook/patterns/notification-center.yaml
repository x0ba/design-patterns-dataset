      n: 10
  proposals:
    raised: 2
    adopted:
      - sub: clearing
        name: Mark read
        raters:
          - fable
          - opus
          - sonnet
      - sub: clearing
        name: Read on view
        raters:
          - fable
          - opus
    recorded: []
  raterNotes:
    fable:
      - Half the sample never removes a notification at all, which none of the four clearing
        variations covers; Grouping is hard when apps bundle by app inside chronological or priority
        sections.
      - clearing has no value for the commonest lifecycle, an item that never leaves and only loses
        its unread state; two raters proposed it under different names, so it wants to be a
        variation. filtering cannot say whether per-type settings that gate push but not the list
        count, and iOS holds Focus, Summaries and per-app toggles at once. grouping conflates
        ordering with bundling, so an inbox of task or issue rows in time order splits raters. bulk
        lists with Message-only-style contradictions aside, most bulk disagreement is omission.
    opus:
      - Clearing assumes a notification leaves, which half the sample never does (see +Read on
        view). Filtering is nearly degenerate — almost every product has per-type settings somewhere
        — so I coded Per-source toggles only where muting a specific source is a first-class, used
        control, and Everything where the surface shows all activity addressed to you; Snooze went
        unused because it is always a secondary option beside dismissing.
      - Clearing assumes a notification leaves; in half the sample it never does, and fable and I
        proposed the same missing variation under two names (I have taken fable's, Mark read).
        Filtering is close to degenerate — every product has per-type settings somewhere — so it
        only discriminates if Per-source toggles is read strictly as muting a named source (channel,
        repo, page, project) rather than as any notification setting.
    sonnet:
      - "Clearing was the hardest sub-dimension: several consumer feeds (Instagram, LinkedIn) have
        no memorable explicit dismissal action beyond reading, coded '?'."
      - "Two codebook-shaped findings: (1) filtering's Per-source toggles vs Everything split turns
        on whether a rater credits any settings screen that gates notification generation somewhere
        (per-type, per-channel, per-page) or requires proof that the specific SETTING changes THIS
        SPECIFIC surface as opposed to a separate push channel — the stricter reading converges on
        Everything far more often, and the codebook doesn't say which test to apply. (2) clearing
        has no value for the common case where a notification is never removed and merely loses its
        unread styling on view or on Mark all as read — fable's Mark read and opus's Read on view
        are independent proposals for the same real gap; I'm adopting Mark read as the name since
        some instances (Reddit, Facebook) trigger it via an explicit button rather than passive
        viewing."
