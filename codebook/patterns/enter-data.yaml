      agreementFinal: 0.9
      flag: null
    modality:
      kappaFirstPass: 0.9170370370370364
      agreementFirstPass: 0.9416666666666667
      kappaFinal: 0.9767973961522347
      agreementFinal: 0.9833333333333333
      flag: null
    prefill:
