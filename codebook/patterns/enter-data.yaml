  proposals:
    raised: 1
    adopted:
      - sub: timing
        name: None
        raters:
          - fable
          - opus
    recorded: []
  raterNotes:
    fable:
      - Commit for multi-step applications straddles Explicit submit and Draft, then publish; I used
        Draft, then publish whenever progress persists across sessions before a final submit. Voice
        instances have no real prefill or validation timing; coded Empty/On submit by analogy.
      - "commit is the codebook's fault: every save-and-return application (7 cells) is Explicit
        submit by its final button and Draft, then publish by its persistence, and the gloss does
        not say which wins; timing has no value for input that is never checked, so raters split n/a
        / +None / On leaving a field; One question at a time overlaps Multi-step for
        one-thing-per-page flows."
    opus:
      - "commit was the hardest: most of these autosave progress between steps yet only commit the
        data at a terminal Submit/Pay/File, and I coded the terminal action except where nothing but
        continuous saving exists (Notion, Excel, System Settings). Voice instances stretch the
        timing sub-dimension — a spoken readback is confirmation, not validation, so 16 is n/a."
      - commit's Explicit submit and Draft, then publish overlap for every resumable application —
        the sibling form entry naming Job applications under Save draft settles it toward the draft
        reading, but the archetype gloss says publish, which no applicant does; organization
        conflates pacing with structure, so GOV.UK is truthfully both Multi-step and One question at
        a time and that sub-dimension wants to be pick any; timing had no way to say nothing is
        checked until +None.
    sonnet:
      - "Voice instances (15, 16) got timing=n/a: field-based validation timing doesn't map cleanly
        onto turn-based conversational confirmation, which I judged unobservable-by-design rather
        than a knowledge gap."
      - "Several pick-one cases held a product that truthfully spans two values (HealthCare.gov and
        Common App's prefill: Empty for a first pass vs. Autofill from a profile for a renewal/later
        college) — prefill wants to be pick-any, or the codebook needs a rule for 'first use vs.
        returning use'. Separately, several organization disagreements (Shopify, macOS, Salesforce)
        turned on whether headed tabs/section groups on a single page count as Sections or One page
        — the gloss should say explicitly that a headed sub-grouping is Sections even without full
        page breaks."
