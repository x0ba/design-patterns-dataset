# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "enter-data". Edit between batches only — see README "Rules".
id: enter-data
name: Enter and edit data
level: archetype
aliases:
  - data entry
  - input
definition: Give a system structured information, have it checked, and correct it — from a single
  field to a multi-page application.
data: schema
platforms:
  - web
  - mobile
  - desktop
  - voice
domains:
  - government
  - finance
  - health
  - commerce
  - enterprise
anatomy:
  - name: Fields
    role: What is asked
  - name: Structure
    role: How fields are grouped and ordered
  - name: Validation
    role: How answers are checked
  - name: Commit
    role: How answers are saved
roles:
  - label
  - hint
  - error
dimensions:
  - name: Field organization
    family: composition
    question: How are fields grouped and paced?
    subdimensions:
      - id: organization
        name: Organization
        select: one
        values:
          - id: single-field
            name: Single field
            example: Newsletter sign-up
          - id: one-page
            name: One page
            example: Contact forms
          - id: sections
            name: Sections
            example: Account settings
          - id: multi-step
            name: Multi-step
            example: Tax software
          - id: one-question-at-a-time
            name: One question at a time
            example: Typeform
          - id: grid-entry
            name: Grid entry
            example: Spreadsheets
  - name: Input modality
    family: adaptation
    question: How does information get in?
    subdimensions:
      - id: modality
        name: Modality
        select: many
        values:
          - id: typing
            name: Typing
            example: Text fields
          - id: choosing-from-options
            name: Choosing from options
            example: Selects
          - id: direct-manipulation
            name: Direct manipulation
            example: Sliders, map pins
          - id: voice-dictation
            name: Voice dictation
            example: iOS dictation
          - id: camera-scan
            name: Camera scan
            example: Apple Pay card scanning
          - id: import-or-paste
            name: Import or paste
            example: CSV import
  - name: Prefill
    family: initiative
    question: How much does the system fill in?
    subdimensions:
      - id: prefill
        name: Prefill
        select: one
        values:
          - id: empty
            name: Empty
            example: Most forms
          - id: defaults
            name: Defaults
            example: Country from locale
          - id: autofill-from-a-profile
            name: Autofill from a profile
            example: Browser autofill
          - id: extracted-from-a-document
            name: Extracted from a document
            example: Expensify SmartScan receipts
  - name: Validation timing
    family: feedback
    question: When is input checked?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: on-submit
            name: On submit
            example: GOV.UK error summary
          - id: on-leaving-a-field
            name: On leaving a field
            example: Many web forms
          - id: while-typing
            name: While typing
            example: Password rules
          - id: asynchronous
            name: Asynchronous
            example: Username availability
          - id: none
            name: None
            description: Input is never checked; whatever is typed or picked is accepted as-is (Notion
              properties, plain note fields)
            example: Notion — Database page properties
  - name: Commit model
    family: lifecycle
    question: When is input saved?
    subdimensions:
      - id: commit
        name: Commit
        select: one
        values:
          - id: explicit-submit
            name: Explicit submit
            example: Web forms
          - id: autosave
            name: Autosave
            example: Google Docs
          - id: draft-then-publish
            name: Draft, then publish
            example: CMS editors
          - id: undo-window
            name: Undo window
            example: Gmail undo send
wild:
  score: 1
  note: Autofill profiles cross products; the structure of what is asked never changes.
  examples:
    - name: Chrome
      note: Saved addresses and payment autofill
techniques:
  - name: Fold the optional
    dimension: Field organization
    how: People fold away optional fields they never fill and pin the ones they always do, per form and
      remembered.
    ai: false
  - name: Fill from this
    dimension: Prefill
    how: Drop or paste a document and fields fill with highlights marking what was inferred, to be
      confirmed.
    ai: true
signature: Fold the optional
sample: Government services, banking, health intake, checkout and SaaS settings.
unit: One data-entry task.
relations:
  uses:
    - text-field
    - choice-control
    - date-picker
    - file-upload
    - autocomplete
  specializes: []
  neighbors:
    - configure
    - transact
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - People abandon at unexpected required fields
questions:
  - Which parts of a form belong to the organization, which to the person?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
