      Voice dictation: 2
      Camera scan: 6
      Import or paste: 3
    prefill:
      Empty: 9
      Defaults: 4
      Autofill from a profile: 3
      Extracted from a document: 4
    timing:
      On submit: 14
      On leaving a field: 3
      While typing: 0
