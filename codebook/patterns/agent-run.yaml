  raterNotes:
    fable:
      - Structure conflates presentation (trace) with architecture (loop, DAG); coded what the
        person sees, so most IDE agents are Linear trace and plan-first products are Plan then
        execute.
      - Structure mixes what the person sees (a log) with architecture (a loop, a DAG); Single tool
        loop only discriminates if read as one tool looped. Approvals is pick one but Cursor,
        Windsurf and Zapier hold a per-class gate and a review at once, and Policy-based
        auto-approve overlaps Approve only destructive steps whenever the person writes the policy.
        Lifecycle bundles duration with unattendedness. Withdrew +Approve at milestones for opus's
        sharper +Approve the plan.
    opus:
      - Approvals and control overlap (Pause for approval restates whichever approval variation
        applies) and neither can express a milestone check-in where the agent asks whether it is on
        track (Replit). Structure was coded Plan then execute only where the plan exists as its own
        artifact, since almost every agent now keeps some todo list; lifecycle conflates duration
        with attendance, so a Deep Research run that streams a trace for ten minutes but survives
        you leaving had to be called a background job.
      - "Two codebook faults drove most of this entry: `structure` mixes presentation with control
        flow, so Linear trace (a chat-style log) and Single tool loop (one action space) are true of
        the same agent at once and a pick one forces a coin flip; and `lifecycle` mixes duration
        with attendance, so a five-minute unattended run has no home between Minutes with live trace
        and Long-running background job. `approvals` has no variation for a gate that is neither
        per-tool nor final — hence two proposals, which are distinct: Approve the plan is a single
        pre-execution gate, Approve at milestones is a recurring checkpoint."
    sonnet:
      - "Approvals was hardest: several products gate on milestones or an upfront plan rather than
        on destructiveness or a final diff, which the five listed variations don't cleanly cover
        (marked '?' once)."
