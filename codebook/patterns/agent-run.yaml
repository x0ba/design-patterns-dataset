# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "agent-run". Edit between batches only — see README "Rules".
id: agent-run
name: Agent run
level: pattern
parent: delegate-ai
aliases:
  - autonomous agent
  - tool-using agent
  - multi-step AI task
definition: A goal-directed model session that plans and executes multiple steps with tools, while
  the person monitors, interrupts, approves and reviews the resulting changes.
data: sequence
platforms:
  - web
  - desktop
domains:
  - software
  - ai
  - enterprise
  - productivity
  - science
anatomy:
  - name: Goal
    role: The assigned objective
  - name: Plan or trace
    role: Steps the agent takes
  - name: Tools
    role: Actions it may invoke
  - name: Artifacts
    role: Files or states it changes
  - name: Approval gates
    role: Human checkpoints
roles:
  - planner
  - tool
  - reviewer
dimensions:
  - name: Goal briefing
    family: content
    question: What specifies the agent’s job?
    subdimensions:
      - id: brief
        name: Brief
        select: many
        values:
          - id: natural-language-goal
            name: Natural-language goal
            example: Cursor agent
          - id: checklist-of-acceptance-criteria
            name: Checklist of acceptance criteria
            example: Task agents
          - id: repo-or-workspace-context
            name: Repo or workspace context
            example: Coding agents
          - id: tool-allowlist
            name: Tool allowlist
            example: Computer-use permissions
          - id: budget-or-step-limit
            name: Budget or step limit
            example: Max turns
  - name: Step composition
    family: composition
    question: How are steps, tools and artifacts structured?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: linear-trace
            name: Linear trace
            example: Chat-style agent logs
          - id: plan-then-execute
            name: Plan then execute
            example: Planner–worker agents
          - id: dag-of-subagents
            name: DAG of subagents
            example: Parallel tool agents
          - id: single-tool-loop
            name: Single tool loop
            example: ReAct-style loops
          - id: human-in-the-loop-graph
            name: Human-in-the-loop graph
            example: Approval nodes
  - name: Run control
    family: invocation
    question: How is a run started, steered and stopped?
    subdimensions:
      - id: control
        name: Control
        select: many
        values:
          - id: start-from-a-prompt
            name: Start from a prompt
            example: ChatGPT agent mode
          - id: continue-redirect-mid-run
            name: Continue / redirect mid-run
            example: Cursor
          - id: pause-for-approval
            name: Pause for approval
            example: Destructive tool confirms
          - id: stop-immediately
            name: Stop immediately
            example: Cancel run
          - id: schedule-or-retry
            name: Schedule or retry
            example: Background agents
  - name: Autonomy lifecycle
    family: lifecycle
    question: How long does the agent act without a person?
    subdimensions:
      - id: lifecycle
        name: Lifecycle
        select: one
        values:
          - id: seconds-few-tools
            name: Seconds, few tools
            example: Simple assistants
          - id: minutes-with-live-trace
            name: Minutes with live trace
            example: Cursor agent
          - id: long-running-background-job
            name: Long-running background job
            example: Overnight coding agents
          - id: persistent-memory-across-runs
            name: Persistent memory across runs
            example: Project agents
          - id: expires-without-heartbeat
            name: Expires without heartbeat
            example: Timed sessions
  - name: Progress feedback
    family: feedback
    question: How does the person see what the agent is doing?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: streaming-step-log
            name: Streaming step log
            example: Cursor
          - id: file-diffs-as-they-land
            name: File diffs as they land
            example: Coding agents
          - id: screenshots-of-a-computer
            name: Screenshots of a computer
            example: Computer-use agents
          - id: todo-checklist-progress
            name: Todo checklist progress
            example: Plan UIs
          - id: errors-and-retries
            name: Errors and retries
            example: Tool failure traces
          - id: live-preview-of-the-artifact
            name: Live preview of the artifact
            description: The thing being built is rendered and running beside the trace — an app preview, a live
              document — so progress is judged from the artifact rather than from logs or diffs; the
              defining feedback of app-generation agents
            example: Replit Agent — Build an app
          - id: cost-and-usage-meter
            name: Cost and usage meter
            description: Tokens, dollars or context used shown as the run proceeds, so the person can judge
              whether to let it continue; standard in agents where the person pays per call
            example: Cline — VS Code extension agent
  - name: Approval initiative
    family: initiative
    question: When must a person act during the run?
    subdimensions:
      - id: approvals
        name: Approvals
        select: one
        values:
          - id: fully-autonomous-until-done
            name: Fully autonomous until done
            example: Low-risk digests
          - id: approve-each-tool-call
            name: Approve each tool call
            example: Strict modes
          - id: approve-only-destructive-steps
            name: Approve only destructive steps
            example: Common default
          - id: approve-final-diff-only
            name: Approve final diff only
            example: Batch apply
          - id: policy-based-auto-approve
            name: Policy-based auto-approve
            example: Enterprise allowlists
          - id: approve-at-milestones
            name: Approve at milestones
            description: The person approves a plan or a checkpoint (plan, milestone build, final handoff)
              rather than tool calls or the whole result at once
            example: Replit Agent — Build an app
          - id: approve-the-plan
            name: Approve the plan
            description: The person acts once, before any tool runs, by reading and editing the proposed plan;
              after that the run is autonomous — neither a per-tool gate nor a final diff review
            example: Replit Agent — Build an app
wild:
  score: 2
  note: Tool permissions, models and approval strictness are increasingly configurable.
  examples:
    - name: Cursor
      note: Agent mode, rules, apply controls
    - name: ChatGPT
      note: Agent / operator permissions
    - name: GitHub Copilot coding agent
      note: Repo access and PR flow
techniques:
  - name: Trace as a first-class log
    dimension: Progress feedback
    how: Make every tool call, rationale and artifact change a reviewable, filterable event—not only
      chat prose.
    ai: false
  - name: Risk-tiered approvals
    dimension: Approval initiative
    how: Map tool classes to approval policies the person can tighten without stopping harmless reads.
    ai: false
  - name: Redirect without reset
    dimension: Run control
    how: Mid-run natural-language redirects amend the brief and continue with provenance of the change.
    ai: true
signature: Trace as a first-class log
sample: Coding agents, computer-use agents and multi-step enterprise assistants.
unit: One goal-directed run with its trace and approvals.
