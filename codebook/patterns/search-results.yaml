# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "search-results". Edit between batches only — see README "Rules".
id: search-results
name: Search results
level: pattern
parent: search
aliases:
  - results page
  - SERP
definition: A ranked presentation of items matching a query, with the cues needed to judge relevance
  and the tools to refine.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - news
  - science
  - productivity
  - entertainment
anatomy:
  - name: Query bar
    role: The current query
  - name: Result
    role: One candidate
  - name: Modules
    role: Blended special results
  - name: Refinement tools
    role: Filters, tabs, related searches
roles:
  - title
  - url
  - snippet
  - thumbnail
  - date
  - source
dimensions:
  - name: Result representation
    family: content
    question: What does a result show, and how is its snippet made?
    subdimensions:
      - id: representation
        name: Representation
        select: one
        values:
          - id: title-address-and-snippet
            name: Title, address and snippet
            example: Google web results
          - id: rich-result-card
            name: Rich result card
            description: Ratings, prices, availability
            example: Google Shopping results
          - id: thumbnail-grid
            name: Thumbnail grid
            example: Image search
          - id: answer-box
            name: Answer box
            example: Featured snippets
          - id: summary-with-citations
            name: Summary with citations
            example: Google AI Overviews
      - id: snippet
        name: Snippet
        select: one
        values:
          - id: static-description
            name: Static description
            example: App store results
          - id: query-biased-with-highlights
            name: Query-biased with highlights
            description: Matching terms in bold
            example: Google snippets
          - id: generated-per-result
            name: Generated per result
            example: Elicit paper summaries
  - name: Grouping
    family: composition
    question: Is it one list or many?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: single-ranked-list
            name: Single ranked list
            example: DuckDuckGo
          - id: verticals-as-tabs
            name: Verticals as tabs
            description: All, Images, News
            example: Google
          - id: blended-modules
            name: Blended modules
            description: Videos, maps and stories in one list
            example: Google universal search
          - id: clustered-by-topic
            name: Clustered by topic
            example: Research clustering engines
          - id: grouped-by-type
            name: Grouped by type
            description: Results are sectioned by the kind of thing they are (songs, artists, playlists;
              applications, documents, mail) in one scroll, rather than split into tabs, blended
              into a single list or clustered by subject. The archetype entry has this value; this
              entry does not
            example: Spotify — Search results
  - name: Ranking control
    family: initiative
    question: How much say does the person have in the order?
    subdimensions:
      - id: ranking
        name: Ranking
        select: one
        values:
          - id: opaque-relevance
            name: Opaque relevance
            example: Most engines
          - id: sort-by-the-person
            name: Sort by the person
            example: Retail sort by price
          - id: personalized
            name: Personalized
            example: Signed-in search
          - id: source-weighting
            name: Source weighting
            description: Boost or block sources
            example: Kagi personalized results
  - name: Relevance cues
    family: feedback
    question: What helps a person judge a result before opening it?
    subdimensions:
      - id: cues
        name: Cues
        select: many
        values:
          - id: highlighted-matches
            name: Highlighted matches
            example: Google
          - id: result-count
            name: Result count
            example: Retail search
          - id: freshness-date
            name: Freshness date
            example: News results
          - id: source-identity
            name: Source identity
            description: Favicon and site name
            example: Google result headers
          - id: why-this-matched
            name: Why this matched
            example: Enterprise search explanations
          - id: rating-and-popularity
            name: Rating and popularity
            description: The judging signal is a crowd aggregate carried on the result — star rating and review
              count, downloads, citations, views — which in app, product and scholarly search
              decides more clicks than the snippet does
            example: Google Shopping — Shopping results
  - name: Result preview
    family: layout
    question: Where does a result open?
    subdimensions:
      - id: openIn
        name: Opens in
        select: one
        values:
          - id: new-page
            name: New page
            example: Web search
          - id: side-by-side
            name: Side-by-side
            example: Outlook search reading pane
          - id: in-place
            name: In-place
            example: People also ask accordions
          - id: popover
            name: Popover
            example: Hover previews in desktop search
  - name: Updating
    family: lifecycle
    question: When do results change?
    subdimensions:
      - id: updating
        name: Updating
        select: one
        values:
          - id: on-submit
            name: On submit
            example: Web search
          - id: as-you-type
            name: As you type
            example: Spotify search
          - id: saved-search-with-alerts
            name: Saved search with alerts
            example: Google Alerts, Zillow saved searches
wild:
  score: 1
  note: Some engines let people weight sources or set a region; result representation is fixed.
  examples:
    - name: Kagi
      note: Personalized domain ranking
    - name: DuckDuckGo
      note: Region and safe-search settings
techniques:
  - name: Result lens
    dimension: Result representation
    how: "Surface attributes from destination pages (author, date, price, reading time) into every
      result card: Fluid Attributes across sites."
    ai: true
  - name: Personal source weighting
    dimension: Ranking control
    how: Raise, lower or block a source from its result, visible as an editable list.
    ai: false
  - name: Rerank by what I mean
    dimension: Ranking control
    how: “Prefer primary sources” reranks with a stated rationale shown on each result.
    ai: true
signature: Result lens
sample: Web engines, retail, scholarly, app-store and in-app search result pages.
unit: One results page for one query.
relations:
  uses:
    - autocomplete
    - filter-controls
    - sort-control
    - pagination
    - tabs
    - ai-provenance
    - accordion
  specializes:
    - overview-detail
    - search
  neighbors:
    - faceted-search
    - recommendations
    - ai-chat
