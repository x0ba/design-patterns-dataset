    raised: 3
    adopted:
      - sub: grouping
        name: Grouped by type
        raters:
          - fable
          - opus
          - sonnet
      - sub: cues
        name: Rating and popularity
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:grouping
        sub: grouping
        dim: null
        name: Grouped by kind
        gloss: Results sectioned by item type (apps, documents, mail) in one list rather than tabs or
          blended modules
        raters:
          - fable
        instances:
          - 16
        status: raised
  raterNotes:
    fable:
      - "Ranking: Sort by the person coded wherever a sort control exists even if relevance is the
        default. Snippet is n/a for grids and answer engines whose results carry no text excerpt."
      - "cues lacks the crowd-aggregate cue (stars, downloads, citations, views) that eight of
        twenty results pages lead with. grouping lacks the archetype's Grouped by type. ranking
        wants pick any: signed-in engines are both opaque and personalised, and retail pages are
        both sortable and opaque by default. snippet's n/a for image grids and answer engines is
        read differently by each rater."
    opus:
      - "cues needed the bigger of the two proposals: in eight of twenty instances the decisive cue
        is a crowd aggregate (stars, downloads, citations, views) that the codebook has no name for,
        while 'Why this matched' went entirely unused — no shipping product in this sample explains
        its matching. grouping's missing 'grouped by type' is a straight inconsistency with the
        archetype entry, which has exactly that value in resultForm. ranking's Sort by the person
        fires whenever a sort control exists, which makes it a fact about the toolbar rather than
        about the ranking; Opaque relevance and Personalized are almost impossible to tell apart
        from outside, and I coded Personalized only where the product says it personalises.
        representation is pick-one but a page like Google's or Bing's carries three representations
        at once, so I coded the headline one and let the rest fall to grouping."
      - "This entry's low agreement comes from two unstated conventions rather than from the
        products. First, `snippet` has no rule for a result with no text at all: n/a and Static
        description were used interchangeably, and I now read Static description as 'text that
        exists but is not query-built' and n/a as 'no text'. Second, `representation`'s Rich result
        card is glossed with commerce attributes but gets used for any result denser than a link,
        which pulled scholarly and media results into it. Two variations are also missing: a
        grouped-by-kind list (which the archetype already names, so the pattern should inherit it)
        and a crowd-aggregate cue (ratings, citations, views)."
    sonnet:
      - ranking came out Opaque relevance for nearly every instance since none of these sampled
        screens shows an explicit signed-in personalization cue or a person-chosen sort as the
        default view; Kagi (5) was the one clear exception, matching its own named feature.
      - "The clearest, most consistent miss on my part: whenever a screen has an explicit, visible
        sort control (Shopping, Amazon, Scholar, Semantic Scholar, Outlook, Slack, YouTube, Zillow),
        both other raters correctly coded `ranking` as Sort by the person while I defaulted to
        Opaque relevance across eight separate instances — several of my own notes even named the
        sort control without the code reflecting it. Two codebook gaps worth recording: (1) `cues`
        has no value for a crowd-aggregate popularity signal (ratings, downloads, citations, views),
        which both other raters reached for independently and which I now think is real, adopting
        opus's +Rating and popularity; (2) `grouping` has no value for content sectioned by kind
        within one scroll (Spotify's Songs/Artists/Albums/Playlists, Spotlight's Top
        Hit/Applications/Documents/Mail) — the parent archetype has 'Grouped by type' but this
        entry's own four values (list/tabs/blended/clustered) can't say it, which both other raters
        flagged independently with near-identical proposals."
