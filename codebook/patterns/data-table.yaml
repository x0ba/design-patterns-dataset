  raterNotes:
    fable:
      - Small-screen behaviour is largely unobservable from product knowledge for desktop-first
        admin tools (coded ? on five). columnSet as pick-one forces Computed over Show and hide when
        both hold; rowExpansion coded as the prominent capability, not only the default state.
      - aggregation's Flat reads as an exclusive none, so [] and ['Flat'] and Flat-beside-Pivot are
        false disagreements; the codebook should say whether Flat excludes the rest. columnSet as
        pick one forces Computed over Show and hide when both hold. density is MUI's scale and
        products' own density names do not map onto it. frozen and rowExpansion are coded as offered
        mechanisms by two raters and as defaults by one; the codebook should say which. smallScreen
        mixes the web table adapting with a separate mobile app. Tree rows and Grouped rows overlap
        when a parent row is both an item and an aggregate.
    opus:
      - "columnSet is two questions in one pick-one: Fixed and Show and hide answer who decides the
        set, Computed and Generated answer where the values come from. I applied a precedence —
        Generated > Computed > Show and hide > Fixed — so Airtable, Notion, Sheets and Excel read as
        Computed columns even though all four also let you hide columns; a rater who read the sub as
        'who decides' would code those Show and hide, and this is my likeliest disagreement. density
        is close to unobservable from memory: most web admin grids sit in a middle band and I coded
        Compact only for spreadsheet-tight rows. frozen is often a user setting rather than a
        default, and I coded it where the product is known for it. aggregation has a Flat variation
        inside a pick-any, so I wrote ['Flat'] rather than an empty array."
      - "Three codebook faults drove most of this packet. (1) columnSet is two questions in one
        pick-one — Fixed/Show and hide answer who decides the set, Computed/Generated answer where
        the values come from — so a product with both reads either way; it should be split. (2)
        aggregation puts Flat inside a pick-any, so 'no aggregation' can be written ['Flat'] or [],
        and that alone accounts for every aggregation disagreement on the plain admin tables; Flat
        should be the empty array or the sub should be pick one. (3) frozen and columnSet never say
        whether to code the default state or the available capability, which is the whole of the
        Sheets/Excel/Notion split. Two smaller ones: density has no anchor beyond MUI's three names,
        so raters fall back to Standard as a default; and openIn is pick one where Jira and Airtable
        truthfully offer a page, a panel and a dialog at once."
    sonnet:
      - columnSet distinguishes who controls which fields exist/show; several tools (GitHub
        Projects, Notion) blur Show-and-hide with letting the person define brand-new custom fields,
        coded here as Show and hide for lack of a closer fit.
      - Three codebook problems stood out. (1) Empty list versus explicit 'Flat'/'None' drove a
        large share of this entry's disagreements even where all three raters agreed on content —
        the same representation issue as in browse-collections and comparison-table. (2) columnSet
        is pick-one but Airtable, Google Sheets and Excel all genuinely offer both 'Show and hide'
        and 'Computed columns' at once (the codebook even cites Airtable as the exemplar for both
        bullets); I resolved by treating the rarer, more product-defining capability as the
        diagnostic value, but this should be pick-any or the codebook should state a tie-break. (3)
        'frozen' sits ambiguously between a capability list (any available control counts, as I read
        narrowing elsewhere) and a description of current default state (opus's 'freezing is opt-in
        so I left it out' reading for Notion) — I ended up applying the capability reading for
        consistency within this entry, but the two readings produce different codes for Excel,
        Notion and Google Ads and the codebook should say which one 'pick any' means here.
