# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "data-table". Edit between batches only — see README "Rules".
id: data-table
name: Data table
level: pattern
parent: browse-collections
aliases:
  - data grid
  - table view
  - details view
definition: Items as rows against attributes as columns, built for scanning, comparing, sorting,
  filtering and acting on many items at once.
data: collection
platforms:
  - web
  - desktop
domains:
  - enterprise
  - finance
  - productivity
  - software
  - science
anatomy:
  - name: Header
    role: Column names and their controls
  - name: Row
    role: One item
  - name: Cell
    role: One attribute value
  - name: Toolbar
    role: Collection operations
  - name: Footer
    role: Aggregates and paging
roles:
  - key-attribute
  - status
  - owner
  - date
  - amount
  - action
dimensions:
  - name: Columns and cells
    family: content
    question: Which attributes become columns, and how are values rendered?
    subdimensions:
      - id: columnSet
        name: Column set
        select: one
        values:
          - id: fixed
            name: Fixed
            description: The developer decides
            example: Bank transaction lists
          - id: show-and-hide
            name: Show and hide
            description: The person picks columns
            example: Airtable hide fields
          - id: computed-columns
            name: Computed columns
            description: Formulas over other columns
            example: Airtable formula fields
          - id: generated-columns
            name: Generated columns
            description: A model extracts a column per row
            example: Elicit’s paper table
      - id: cellRendering
        name: Cell rendering
        select: many
        values:
          - id: plain-text
            name: Plain text
            example: Spreadsheets
          - id: chips-and-avatars
            name: Chips and avatars
            example: Linear list view
          - id: in-cell-charts
            name: In-cell charts
            description: Sparklines and bars
            example: Excel data bars
          - id: editable-input
            name: Editable input
            example: Airtable
  - name: Density and structure
    family: layout
    question: How tightly are rows packed, what stays put, and how do rows expand?
    subdimensions:
      - id: density
        name: Density
        select: one
        values:
          - id: compact
            name: Compact
            example: MUI DataGrid compact
          - id: standard
            name: Standard
            example: MUI DataGrid standard
          - id: comfortable
            name: Comfortable
            example: MUI DataGrid comfortable
      - id: frozen
        name: Frozen regions
        select: many
        values:
          - id: sticky-header
            name: Sticky header
            example: Most grids
          - id: frozen-first-column
            name: Frozen first column
            example: Google Sheets freeze
          - id: pinned-columns
            name: Pinned columns
            description: Pin left or right
            example: AG Grid column pinning
      - id: rowExpansion
        name: Row expansion
        select: one
        values:
          - id: none
            name: None
            example: Simple tables
          - id: detail-row
            name: Detail row
            description: A panel opens under the row
            example: AG Grid master/detail
          - id: tree-rows
            name: Tree rows
            description: Rows nest under rows
            example: AG Grid tree data
          - id: grouped-rows
            name: Grouped rows
            description: Group headers with aggregates
            example: Airtable group by
  - name: Selection and operations
    family: scope
    question: What can be selected, and what do operations apply to?
    subdimensions:
      - id: selection
        name: Selection
        select: one
        values:
          - id: none
            name: None
            example: Read-only reports
          - id: single-row
            name: Single row
            example: File pickers
          - id: multiple-rows
            name: Multiple rows
            description: Checkbox column
            example: Gmail
          - id: cell-ranges
            name: Cell ranges
            description: Spreadsheet-style ranges
            example: AG Grid range selection
      - id: opScope
        name: Operations apply to
        select: many
        values:
          - id: row
            name: Row
            example: Row menus
          - id: selection
            name: Selection
            example: Bulk actions
          - id: column
            name: Column
            example: Sort, filter and hide from the header
          - id: whole-table
            name: Whole table
            example: Export
  - name: Aggregation
    family: composition
    question: Are rows combined into groups or summaries?
    subdimensions:
      - id: aggregation
        name: Aggregation
        select: many
        values:
          - id: flat
            name: Flat
            example: Simple lists
          - id: group-by-column
            name: Group by column
            example: Airtable
          - id: pivot
            name: Pivot
            description: Rows × columns of aggregates
            example: Google Sheets pivot tables
          - id: footer-aggregates
            name: Footer aggregates
            description: Sum, average or count under a column
            example: Airtable summary bar
  - name: Row detail
    family: invocation
    question: How does one row open into its full record?
    subdimensions:
      - id: openIn
        name: Row opens in
        select: one
        values:
          - id: side-by-side
            name: Side-by-side
            example: Salesforce split view
          - id: modal
            name: Modal
            example: Airtable expanded record
          - id: new-page
            name: New page
            example: Admin consoles
          - id: in-place
            name: In-place
            example: Expandable rows
          - id: bottom-panel
            name: Bottom panel
            description: The selected row's detail opens in a resizable panel docked below the whole table — the
              table stays complete above it, unlike a detail row that splits the rows apart or a
              side panel beside them
            example: AWS Console — EC2 Instances
  - name: Narrow screens
    family: adaptation
    question: What happens when there is no room for the columns?
    subdimensions:
      - id: smallScreen
        name: Small-screen behaviour
        select: one
        values:
          - id: horizontal-scroll
            name: Horizontal scroll
            example: Most responsive tables
          - id: stack-to-cards
            name: Stack to cards
            description: Each row becomes a card
            example: Mobile banking lists
          - id: priority-columns
            name: Priority columns
            description: Low-priority columns hide
            example: Responsive table plugins
          - id: column-chooser
            name: Column chooser
            description: The person picks what fits
            example: Mobile admin apps
wild:
  score: 3
  note: In productivity and admin software, showing, hiding, reordering and resizing columns, sorting,
    filtering and grouping are routine.
  examples:
    - name: Airtable
      note: Hide fields, group, sort, filter and row height per view
    - name: Excel / Google Sheets
      note: Freeze, filter, sort and pivot
    - name: Jira list view
      note: Choose columns
techniques:
  - name: Column surfacing
    dimension: Columns and cells
    how: Pull any attribute from a record’s detail straight into a column, the tabular form of Fluid
      Attributes; hide columns back into the detail.
    ai: false
  - name: Formula by example
    dimension: Columns and cells
    how: Type the value you want in two or three cells and the table proposes the computed column.
    ai: true
  - name: Table ↔ cards morph
    dimension: Narrow screens
    how: The same column set reflows to cards when narrow, with pinned columns becoming the card’s title
      and subtitle roles.
    ai: false
  - name: Ask for a column
    dimension: Columns and cells
    how: “Add a column for whether the paper has a user study” extracts a value per row, with provenance
      and an Unknown value.
    ai: true
signature: Column surfacing
sample: Admin consoles, CRMs, analytics tools, banking and brokerage sites, plus grid libraries’
  showcase apps.
unit: One table over one record set.
