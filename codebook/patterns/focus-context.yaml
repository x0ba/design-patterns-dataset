  raterNotes:
    fable:
      - Spatial arrangement has no value for whole-field semantic zoom (maps, canvases), coded n/a
        for seven instances; Relation has none for attention-based dimming (Vision Pro).
      - arrangement has no value for whole-field semantic zoom, which is a third of the sample
        (adopted +Whole-field zoom), and relation none for focus by contrast (adopted +Salience-only
        focus). interest's Uniform zoom doubles as the no-DOI bucket for minimaps where nothing
        scales, and has no value for a placed lens. focusContent's Geometric magnification only is
        exclusive by its wording and Extra labels and Hidden context declutter describe one
        level-of-detail rule from two sides. Pointer-driven fisheye conflates the driver with the
        warp, so pointer-tracking lenses have no clean value.
    opus:
      - 'Arrangement assumed a lens, an inset or a panel, so the largest family in the sample —
        plain zoomable spaces — had nowhere to go (see +Whole-field zoom). Interest is also nearly
        constant: only Gephi has a real degree-of-interest function, and Uniform zoom ends up
        meaning "no DOI at all", which makes it the default rather than a finding.'
      - Three faults. `arrangement` had no value for the commonest case in the sample — a whole
        viewport that zooms — so a third of the entry went to n/a or a proposal; two raters proposed
        it independently and it should be adopted (I have taken sonnet's name). `focusContent`'s
        first variation is named 'Geometric magnification only', which makes it illegal to combine
        in a pick-any list, and it records only the focus even where the product densifies the
        context instead (Xcode). And `moveBy`'s 'Pointer-driven fisheye' welds a mechanism to a
        distortion, which is why a plain pointer-following lens landed in three different places.
    sonnet:
      - Plain 'zoom the whole view' interactions (Maps, Figma, Miro, Google Earth, Gephi, Prezi) are
        semantic zoom in relation but have no arrangement among the five listed, since all five
        presuppose a lens/inset/fisheye/XR structure distinct from the base view — proposed
        +Whole-view zoom.
      - Arrangement/relation had no value for a screen where the whole field zooms uniformly with
        nothing carved into a separate focus -- filled by +Whole-field zoom and +Salience-only
        focus; separately, focusContent's 'Geometric magnification only' is logically incompatible
        with also picking any other value in the same pick-any list, since 'only' claims exclusivity
        -- a design flaw when the sub allows multiple selections (this drove several of my
        corrections on Premiere/Ableton/ArcGIS).
