# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "focus-context". Edit between batches only — see README "Rules".
id: focus-context
name: Focus + context
level: pattern
parent: analyze
aliases:
  - focus and context
  - fisheye
  - detail-in-context
definition: A detailed focus region shown inside a continuously visible surrounding context in the
  same visual field—unlike overview–detail, which separates an overview of many items from a
  distinct detail view of one selected item.
data: space
platforms:
  - web
  - desktop
  - xr
domains:
  - science
  - design
  - mobility
  - enterprise
  - education
anatomy:
  - name: Focus region
    role: The magnified or detailed area
  - name: Context region
    role: The surrounding situation
  - name: Lens or distortion
    role: How focus is carved from context
  - name: Navigation
    role: How the focus moves
roles: []
dimensions:
  - name: Focus–context relation
    family: composition
    question: How do focus and context share one field without becoming separate overview and detail views?
    subdimensions:
      - id: relation
        name: Relation
        select: one
        values:
          - id: embedded-magnification
            name: Embedded magnification
            description: Focus sits inside context
            example: Magnifying-glass lenses
          - id: distortion-of-one-space
            name: Distortion of one space
            description: Space bends toward the focus
            example: Fisheye menus
          - id: semantic-zoom-levels
            name: Semantic zoom levels
            description: Detail density changes with scale
            example: Pad++ style zoom
          - id: inset-mini-map-with-live-focus
            name: Inset mini-map with live focus
            description: Small context map, large focus—still one navigational act
            example: Maps with locator inset
          - id: salience-only-focus
            name: Salience-only focus
            description: Focus is carved out by contrast rather than geometry — the attended region brightens or
              the rest dims while every element keeps its size and place; the XR and attention-aware
              case
            example: Apple Vision Pro — Focused window
  - name: Spatial arrangement
    family: layout
    question: How are focus and context laid out in the field?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: lens-over-a-base-map
            name: Lens over a base map
            example: ArcGIS magnifier
          - id: fisheye-stretch
            name: Fisheye stretch
            example: Mac Dock magnification
          - id: overview-inset
            name: Overview inset
            example: Photoshop Navigator
          - id: edge-aware-focus-panel
            name: Edge-aware focus panel
            description: Focus dominates; context as a strip
            example: Code minimap plus editor
          - id: xr-egocentric-focus
            name: XR egocentric focus
            example: Headset world focus volumes
          - id: whole-field-zoom
            name: Whole-field zoom
            description: "There is no separate focus region: the entire viewport is the focus and the context is
              whatever remains visible around its edges, reached by zooming the one space; every
              zoomable map, canvas and globe works this way and none of the five arrangements
              describes it"
            example: Google Maps — Zoom levels
          - id: whole-view-zoom
            name: Whole-view zoom
            description: The entire viewport zooms in and out with no separate lens, inset or fisheye distortion
              — a plain zoomable map/canvas/graph
            example: Google Maps — Zoom levels
  - name: Moving the focus
    family: invocation
    question: How does the focus region move or resize?
    subdimensions:
      - id: moveBy
        name: Move by
        select: many
        values:
          - id: drag-the-lens
            name: Drag the lens
            example: Map magnifiers
          - id: pointer-driven-fisheye
            name: Pointer-driven fisheye
            example: Fisheye menus
          - id: pan-and-zoom-the-space
            name: Pan and zoom the space
            example: Zoomable canvases
          - id: search-then-frame
            name: Search then frame
            example: Map search to region
          - id: follow-a-selection
            name: Follow a selection
            example: Focus tracks the selected object
  - name: What densifies in focus
    family: content
    question: What extra information appears inside the focus?
    subdimensions:
      - id: focusContent
        name: Focus content
        select: many
        values:
          - id: geometric-magnification-only
            name: Geometric magnification only
            example: Pixel zoom
          - id: extra-labels-and-attributes
            name: Extra labels and attributes
            example: Semantic zoom
          - id: editable-detail-controls
            name: Editable detail controls
            example: In-place inspectors inside the lens
          - id: hidden-context-declutter
            name: Hidden context declutter
            description: Context shows less while focus shows more
            example: Degree-of-interest calc
  - name: Degree of interest
    family: scope
    question: What determines what stays detailed versus compressed?
    subdimensions:
      - id: interest
        name: Interest scope
        select: one
        values:
          - id: pointer-locus
            name: Pointer locus
            example: Fisheye under cursor
          - id: explicit-selection
            name: Explicit selection
            example: Selected node stays detailed
          - id: search-match-set
            name: Search match set
            example: Matches stay expanded
          - id: task-defined-doi-function
            name: Task-defined DOI function
            example: Furnas degree-of-interest trees
          - id: uniform-zoom
            name: Uniform zoom
            description: No DOI; whole view scales
            example: Simple map zoom
  - name: Orientation feedback
    family: feedback
    question: How does a person stay oriented while focused?
    subdimensions:
      - id: orientation
        name: Orientation
        select: many
        values:
          - id: visible-surrounding-context
            name: Visible surrounding context
            example: True focus+context
          - id: locator-inset
            name: Locator inset
            example: Navigator thumbnails
          - id: breadcrumb-of-scale
            name: Breadcrumb of scale
            example: Zoom percentage
          - id: distortion-cues
            name: Distortion cues
            example: Fisheye warping
          - id: lost-without-leaving
            name: Lost without leaving
            description: Must jump to a separate detail page
            example: Classic overview–detail drill
wild:
  score: 1
  note: Authors set lens behaviour; end users rarely retune distortion or DOI functions.
  examples:
    - name: Photoshop
      note: Navigator panel and loupe
    - name: ArcGIS
      note: Magnifier and overview map
    - name: VS Code
      note: Minimap with viewport highlight
techniques:
  - name: Keep context in frame
    dimension: Focus–context relation
    how: Prefer embedded magnification or distortion over navigating away to a separate detail surface
      when spatial situation matters.
    ai: false
  - name: DOI as a visible lens
    dimension: Degree of interest
    how: Expose the degree-of-interest function (pointer, selection, search) as a controllable lens mode
      rather than a hidden heuristic.
    ai: false
  - name: Focus on what answers…
    dimension: Moving the focus
    how: A question moves and densifies the focus region while context stays visible, instead of opening
      a disconnected detail view.
    ai: true
signature: Keep context in frame
sample: Maps, graph browsers, creative canvases and code editors that keep surroundings visible
  while detailing a region.
unit: One focus region inside one continuous context field.
