  raterNotes:
    fable:
      - responsive names sidebars only; top bars that fold into a hamburger (GitHub, NYT) were coded
        Sidebar becomes drawer. Single-form-factor systems (XR, voice) got n/a.
      - responsive assumes every product starts from a sidebar, so top-bar sites and split views
        each needed a proposal; routes has no value for links inside content, the main route on the
        networked web; architecture is pick one but a flat shell can hold a sequence (Uber), and
        depth's Mixed swallows most products with a sidebar.
    opus:
      - "architecture is pick-one over products that are plainly two structures at once: Uber is
        flat tabs wrapped around a sequential booking flow, GOV.UK a hierarchy wrapped around
        sequential services, Amazon a hierarchy refined by facets. I coded the persistent structure
        and named the other in the note. depth is the weakest sub-dimension here — every large
        product is Mixed, and the three variations do not distinguish a file system from a SaaS app.
        The voice and XR instances also strain placement and responsive, which both presuppose a
        screen."
      - responsive is pick one but holds two values at once for any product with three breakpoints
        (YouTube and Windows 11 Settings are both a rail at medium AND tabs/drawer at narrow) — it
        wants to be pick any; I took the earlier-listed variation and said so. Its four variations
        also all presuppose a sidebar, which is why three instances needed +Top bar collapses to a
        menu button. 'Address' reads as 'this is on the web' unless the gloss's word 'readable' is
        enforced; I enforced it (Amazon's title slugs count, Netflix's numeric ids do not) and that
        is where most of the cues disagreement sat. placement's 'None' glosses as 'content links
        only', so it cannot be used for XR, where the navigation surface exists but is summoned by
        hardware. Finally, sonnet and I proposed the same routes variation under two names — my
        '+Content links' and sonnet's '+In-content links' are one variation and should merge; I kept
        'Content links' because the codebook already uses that phrase in placement's None gloss.
    sonnet:
      - The responsive dimension's four fixed variations are all built around a sidebar
        transforming; every top-bar-based site in this sample (Amazon, Netflix, GitHub, NYT) hit
        that same gap, which is why one proposal covers all four rather than four separate one-off
        guesses. XR instances (10, 11) also stretched 'placement' and got a matching proposal; I
        left cues as '?' there rather than invent specifics I don't confidently know.
