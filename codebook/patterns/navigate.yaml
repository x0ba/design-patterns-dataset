# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "navigate". Edit between batches only — see README "Rules".
id: navigate
name: Navigate and wayfind
level: archetype
aliases:
  - wayfinding
  - information architecture
definition: Know where you are, where you can go, and get there — the structure of places in a
  product and the means of moving between them.
data: hierarchy
platforms:
  - web
  - mobile
  - desktop
  - xr
  - voice
domains:
  - productivity
  - commerce
  - government
  - news
  - software
  - entertainment
anatomy:
  - name: Places
    role: Screens, sections and objects that can be arrived at
  - name: Wayfinding cues
    role: What says where you are
  - name: Routes
    role: The means of moving
roles: []
dimensions:
  - name: Structure
    family: composition
    question: How are places related to each other?
    subdimensions:
      - id: architecture
        name: Information architecture
        select: one
        values:
          - id: flat
            name: Flat
            description: Every place one step away
            example: Instagram tab bar
          - id: hierarchy
            name: Hierarchy
            description: Places nested in places
            example: iOS Settings
          - id: hub-and-spoke
            name: Hub and spoke
            description: Return to a home between tasks
            example: Apple Watch app grid
          - id: sequential
            name: Sequential
            description: Places in a fixed order
            example: Checkout flows
          - id: networked
            name: Networked
            description: Places linked freely
            example: Wikipedia
          - id: faceted
            name: Faceted
            description: Places defined by attribute combinations
            example: Retail category pages
      - id: depth
        name: Depth
        select: one
        values:
          - id: shallow-and-wide
            name: Shallow and wide
            example: Amazon departments
          - id: deep-and-narrow
            name: Deep and narrow
            example: Government service sites
          - id: mixed
            name: Mixed
            example: Most SaaS apps
  - name: Persistent navigation
    family: layout
    question: Where do the always-available routes live?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: top-bar
            name: Top bar
            example: News sites
          - id: sidebar
            name: Sidebar
            example: Slack
          - id: navigation-rail
            name: Navigation rail
            example: Material 3 navigation rail
          - id: bottom-tab-bar
            name: Bottom tab bar
            example: Instagram on iOS
          - id: hidden-drawer
            name: Hidden drawer
            description: Behind a menu button
            example: Gmail on mobile
          - id: none
            name: None
            description: Content links only
            example: Long-form articles
          - id: hardware-summoned-overlay
            name: Hardware-summoned overlay
            description: The persistent navigation surface has no fixed onscreen position at all; it's summoned
              from anywhere by a physical control (a crown, a controller button) and floats over
              whatever app is running.
            example: Apple Vision Pro — visionOS Home View
  - name: Wayfinding cues
    family: feedback
    question: How does a person know where they are?
    subdimensions:
      - id: cues
        name: Location cues
        select: many
        values:
          - id: highlighted-destination
            name: Highlighted destination
            example: Selected sidebar item
          - id: breadcrumbs
            name: Breadcrumbs
            example: Google Drive
          - id: page-title
            name: Page title
            example: Most apps
          - id: progress-through-a-sequence
            name: Progress through a sequence
            example: Checkout steppers
          - id: address
            name: Address
            description: A readable, editable URL or path
            example: Browsers
          - id: where-it-sits-in-the-room
            name: Where it sits in the room
            description: In spatial computing the cue to where you are is the position and persistence of the
              window or panel in the physical space, not a label on a screen
            example: Apple Vision Pro — visionOS Home View
  - name: Routes
    family: invocation
    question: How does a person move?
    subdimensions:
      - id: routes
        name: Ways to move
        select: many
        values:
          - id: menu-selection
            name: Menu selection
            example: Navigation menus
          - id: search
            name: Search
            example: Site search
          - id: command-palette
            name: Command palette
            example: Linear Cmd+K
          - id: back-and-history
            name: Back and history
            example: Browser back
          - id: gestures
            name: Gestures
            example: iOS swipe back
          - id: voice
            name: Voice
            example: “Open settings” to an assistant
          - id: deep-links
            name: Deep links
            example: Links from notifications
          - id: content-links
            name: Content links
            description: Moving by following a link inside the content itself — a word in a sentence, a
              related-article card — rather than through any navigation control; the primary route
              on the networked web and absent from the list
            example: Wikipedia — Desktop site
  - name: Across devices
    family: adaptation
    question: How does navigation change with screen size?
    subdimensions:
      - id: responsive
        name: Responsive navigation
        select: one
        values:
          - id: same-everywhere
            name: Same everywhere
            example: Simple websites
          - id: sidebar-becomes-bottom-tabs
            name: Sidebar becomes bottom tabs
            example: Many cross-platform apps
          - id: sidebar-becomes-drawer
            name: Sidebar becomes drawer
            example: Gmail
          - id: rail-on-medium-screens
            name: Rail on medium screens
            example: Material window size classes
          - id: split-view-becomes-stack
            name: Split view becomes stack
            description: A sidebar-and-detail split on large screens collapses into a single column navigated by
              pushing and back, not a drawer or tabs (iOS Settings, Mail, Notes on iPhone)
            example: iOS Settings — Settings app
          - id: split-view-collapses-to-a-stack
            name: Split view collapses to a stack
            description: A sidebar-plus-detail layout on a large screen becomes a drill-down stack with a back
              button on a small one — the standard iPadOS/iOS behaviour, which is neither a drawer,
              bottom tabs nor a rail
            example: iOS Settings — Settings app
          - id: top-bar-collapses-to-a-menu-button
            name: Top bar collapses to a menu button
            description: A persistent top navigation bar collapses into a hamburger/menu-button-revealed list as
              the screen narrows, rather than a sidebar transforming into tabs, a drawer, or a rail
              — the responsive dimension's four variations all assume a sidebar-based desktop layout
              to start from.
            example: Amazon — Desktop site
wild:
  score: 2
  note: Productivity tools let people pin, reorder and section their navigation; consumer apps rarely do.
  examples:
    - name: Slack
      note: Custom sidebar sections
    - name: Discord
      note: Server folders
    - name: Notion
      note: Favourites in the sidebar
techniques:
  - name: Pin anything as a place
    dimension: Persistent navigation
    how: Any location, saved filter or query can be pinned into persistent navigation, so people build
      their own architecture on top of the designer’s.
    ai: false
  - name: Navigation morph
    dimension: Across devices
    how: One navigation spec renders as sidebar, rail, tabs or palette, and the person chooses per
      device.
    ai: false
  - name: Take me there, show me how
    dimension: Routes
    how: “Where do I change billing?” navigates and draws the route it took, so the next time needs no
      help.
    ai: true
signature: Pin anything as a place
sample: Top 50 apps and sites across categories; record every persistent navigation surface and route type.
unit: One product’s navigation system on one platform.
