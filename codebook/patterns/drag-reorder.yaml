# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "drag-reorder". Edit between batches only — see README "Rules".
id: drag-reorder
name: Drag to reorder
level: component
parent: browse-collections
aliases:
  - drag and drop
  - sortable list
definition: Changing an item’s position, container or nesting by dragging it.
data: sequence
platforms:
  - web
  - desktop
  - mobile
domains:
  - productivity
  - entertainment
  - software
anatomy:
  - name: Handle
    role: What is grabbed
  - name: Ghost
    role: What travels with the pointer
  - name: Drop indicator
    role: Where it will land
roles: []
dimensions:
  - name: Grab
    family: invocation
    question: How is an item picked up?
    subdimensions:
      - id: grab
        name: Grab by
        select: many
        values:
          - id: handle
            name: Handle
            example: Notion block handles
          - id: long-press-anywhere
            name: Long-press anywhere
            example: iOS list reordering
          - id: keyboard-lift-and-move
            name: Keyboard lift and move
            example: Accessible drag-and-drop pattern
          - id: move-up-or-down-commands
            name: Move up or down commands
            example: Menu fallbacks
          - id: drag-anywhere
            name: Drag anywhere
            description: "Any point on the item is a grab point: a plain pointer press-and-drag with no handle
              and no hold delay"
            example: Trello — Moving cards between lists
  - name: Drop feedback
    family: feedback
    question: How does the destination show itself?
    subdimensions:
      - id: indication
        name: Indication
        select: one
        values:
          - id: insertion-line
            name: Insertion line
            example: Notion
          - id: placeholder-gap
            name: Placeholder gap
            example: Trello
          - id: live-reflow
            name: Live reflow
            example: iOS home screen
          - id: ghost-preview
            name: Ghost preview
            example: Finder
  - name: Destinations
    family: scope
    question: Where can it go?
    subdimensions:
      - id: destinations
        name: Destinations
        select: many
        values:
          - id: within-the-list
            name: Within the list
            example: Playlists
          - id: across-lists
            name: Across lists
            example: Trello
          - id: into-nesting
            name: Into nesting
            example: Outliners
          - id: onto-a-target-to-act
            name: Onto a target to act
            example: Drag to a folder
  - name: Long journeys
    family: adaptation
    question: What happens when the destination is off-screen?
    subdimensions:
      - id: edge
        name: Edge behaviour
        select: one
        values:
          - id: auto-scroll
            name: Auto-scroll
            example: Most lists
          - id: spring-loaded-folders
            name: Spring-loaded folders
            example: Finder
          - id: cut-and-paste-instead
            name: Cut and paste instead
            example: Mobile fallbacks
wild:
  score: 2
  note: Manual order is itself a customization and is common in lists that allow it.
  examples:
    - name: Spotify
      note: Reorder a playlist
    - name: Trello
      note: Move cards across lists
techniques:
  - name: Drag as spec edit
    dimension: Destinations
    how: "Dragging maps to a change of the pattern, not only of order: drag an item beside another to
      turn a list into a grid (Meridian D1-4)."
    ai: false
signature: Drag as spec edit
sample: Lists, boards, editors and home screens.
unit: One draggable collection.
relations:
