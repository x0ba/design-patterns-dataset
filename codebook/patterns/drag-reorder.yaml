        sub: grab
        dim: null
        name: Click anywhere
        gloss: Clicking and dragging from anywhere on the item picks it up directly, with no dedicated
          handle affordance and no touch long-press required — common across desktop pointer
          interfaces (Trello cards, browser/editor tabs, Dock icons, slide thumbnails)
        raters:
          - sonnet
        instances:
          - 2
          - 4
          - 6
