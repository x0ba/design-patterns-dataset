        status: raised
      - place: sub:edge
        sub: edge
        dim: null
        name: Detach on drop off
        gloss: Dragging the item off the edge of its strip or container entirely detaches it into its own
          new window, e.g. tearing a browser or editor tab off into a new window
        raters:
