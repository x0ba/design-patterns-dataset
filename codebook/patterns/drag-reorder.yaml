        instances:
          - 6
          - 18
        status: raised
  raterNotes:
    fable:
      - Grab lacks the commonest desktop case, a plain drag from anywhere on the item; twelve of
        twenty needed +Drag anywhere. Indication (line vs gap vs reflow) is a fine detail of motion
        that I could not always recall with certainty (YouTube, VS Code).
      - grab lacks the plain pointer drag, which all three raters proposed. Into nesting and Onto a
        target to act overlap for dropping into a folder, and the codebook's own examples put
        folders under the latter. indication is a motion detail that cannot be settled from product
        memory.
    opus:
      - "grab's Long-press anywhere is written as a touch idiom, so twelve desktop instances that
        simply drag the item had nowhere to go — that is the entry's one real gap. Keyboard lift and
        move was coded nowhere: accessible drag-and-drop exists in some of these products but is
        invisible unless you go looking, which makes the variation unobservable rather than absent.
        indication's Live reflow versus Placeholder gap is a genuinely fine call on a board — I used
        Placeholder gap only where a single empty slot opens and Live reflow where every neighbour
        moves. Into nesting is doing double duty for outline indentation and for dropping into a
        container; edge is n/a for fixed-size strips like the Dock and the taskbar."
      - "Twelve of the twenty-six cells in this packet are the same missing variation, and all three
        of us proposed it independently under three names — `grab` has no value for a plain pointer
        press-and-drag, because Long-press anywhere is written as a touch idiom. Second fault:
        `destinations` and `edge` overlap, so a behaviour that happens at the edge of a container
        (tearing a tab off into a new window) can be coded as either, and `edge` assumes every
        container can be longer than the screen — a fixed strip that shrinks to fit (Chrome tabs,
        the Dock, the taskbar) has no answer but n/a. Third: Into nesting and Onto a target to act
        both describe dropping onto another item, separated only by whether the result is
        containment or an action, which splits the home screens and Finder three ways. The remaining
        cells are not codebook problems at all: they are memory disputes about what a specific
        product draws while dragging (YouTube's playlist), which no amount of reconciliation
        settles."
    sonnet:
      - "grab is the sub-dimension the four variations fit worst for desktop pointer UIs: most of
        this sample's mouse-drag cases (12 of 20) have no dedicated handle and aren't a touch
        long-press either, hence the large +Click anywhere proposal."
      - "One dominant pattern, one retraction. (1) 'grab' has no value for the desktop-pointer
        default — press the item itself and move, no handle, no hold delay — which is how the large
        majority of desktop drag-reorder surfaces in this sample actually work (Trello, Spotify,
        Chrome, the Dock, Finder, Keep, Figma, Slides, PowerPoint, Jira, VS Code, the Taskbar); all
        three raters independently proposed essentially the same missing value, and fable's and
        opus's names matched exactly ('Drag anywhere'), which I'm adopting over my own
        near-identical 'Click anywhere.' (2) I initially proposed a new 'edge' value ('Detach on
        drop off') for tab tear-off into a new window, but on reconsideration this doesn't actually
        answer the edge sub-dimension's own question (what happens when the destination is
        off-screen) — it's a different phenomenon, already reasonably captured by 'destinations:
        Across lists,' and both other raters' specific, corroborated claims that the tab strip
        itself auto-scrolls when crowded is the real, on-topic answer I'd missed by conflating two
        separate behaviours."
  codedAt: 2026-09-22
