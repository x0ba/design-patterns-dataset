# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "text-field". Edit between batches only — see README "Rules".
id: text-field
name: Text field
level: component
parent: enter-data
aliases:
  - input
  - text box
  - text area
definition: A single- or multi-line input for typed text, together with its label, help and validation.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - government
  - commerce
  - communication
  - enterprise
anatomy:
  - name: Label
    role: What is asked
  - name: Input
    role: Where text goes
  - name: Supporting text
    role: Hint, counter or error
roles: []
dimensions:
  - name: Supporting content
    family: content
    question: What surrounds the input?
    subdimensions:
      - id: supporting
        name: Supporting content
        select: many
        values:
          - id: label
            name: Label
            example: All
          - id: placeholder
            name: Placeholder
            example: Search boxes
          - id: hint-text
            name: Hint text
            example: GOV.UK
          - id: character-counter
            name: Character counter
            example: Material text fields
          - id: prefix-or-suffix
            name: Prefix or suffix
            example: Currency and units
          - id: clear-button
            name: Clear button
            example: Search fields
          - id: format-examples
            name: Format examples
            description: A worked example of the expected format (e.g. QQ 12 34 56 C) shown alongside the field
              — the 'form' entry's Help dimension has this exact variation, but this entry's
              Supporting-content options don't.
            example: GOV.UK — National Insurance number field
          - id: reveal-toggle
            name: Reveal toggle
            description: An eye/show icon toggles a sensitive value between masked dots and its plain text,
              distinct from a label, placeholder, hint, counter, prefix/suffix or clear button.
            example: TurboTax — Social Security number
  - name: Validation
    family: feedback
    question: How is input checked?
    subdimensions:
      - id: validation
        name: Validation
        select: one
        values:
          - id: none
            name: None
            example: Free text
          - id: on-leaving-the-field
            name: On leaving the field
            example: Email fields
          - id: while-typing
            name: While typing
            example: Character limits
          - id: strength-meter
            name: Strength meter
            example: Password strength meter (Tidwell)
          - id: on-submit
            name: On submit
            description: The field is checked only when the form or step is submitted (GOV.UK, Google sign-in
              Next, Amazon Apply)
            example: GOV.UK — National Insurance number field
  - name: Style
    family: layout
    question: How is the field drawn?
    subdimensions:
      - id: style
        name: Style
        select: one
        values:
          - id: outlined
            name: Outlined
            example: Material outlined
          - id: filled
            name: Filled
            example: Material filled
          - id: underline-only
            name: Underline only
            example: Material 1
          - id: borderless-inline
            name: Borderless inline
            example: Notion
  - name: Assistance
    family: initiative
    question: What does the system add while typing?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Code fields
          - id: autofill
            name: Autofill
            example: Browser autofill
          - id: suggestions
            name: Suggestions
            example: Autocomplete
          - id: autocorrect-and-prediction
            name: Autocorrect and prediction
            example: iOS keyboard
          - id: rewrite
            name: Rewrite
            example: Writing tools in iOS
  - name: Input type
    family: adaptation
    question: How does the field adapt to what is typed?
    subdimensions:
      - id: inputType
        name: Input type
        select: one
        values:
          - id: plain
            name: Plain
            example: Name fields
          - id: specialized-keyboard
            name: Specialized keyboard
            example: Numeric keypad on mobile
          - id: masked-format
            name: Masked format
            example: Card numbers
          - id: forgiving-format
            name: Forgiving format
            description: Any format accepted and normalized
            example: Forgiving format (Tidwell)
          - id: obscured-entry
            name: Obscured entry
            description: The characters are hidden as they are typed, usually with a reveal toggle — a password
              or secret field
            example: Apple Account — Password with rules
wild:
  score: 1
  note: Assistance is configurable at the operating-system level, not per field.
  examples:
    - name: iOS
      note: Autocorrect and predictive text settings
techniques:
  - name: Forgiving format
    dimension: Input type
    how: Accept any reasonable format and echo the interpretation beneath the field.
    ai: false
signature: Forgiving format
sample: Forms across government, retail and SaaS.
unit: One field.
relations:
  uses: []
  specializes: []
  neighbors:
    - autocomplete
    - inline-edit
scores:
  ubiquity: 5
  potential: 2
  spec: 5
evidence: agent-coded
usage:
  - Masked inputs break paste
questions:
  - Where does input assistance stop being help and start being authorship?
