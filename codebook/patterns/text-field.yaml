        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - validation has no On submit variation although the form entry does; five fields needed it.
      - validation omits On submit, the commonest timing, which two raters proposed with the same
        name; Prefix or suffix needs to say whether a decorative glyph counts or only an affix with
        content or a control; inputType has no value for obscured entry.
    opus:
      - The validation list is missing On submit, which the form entry has and which is what most
        real fields do; that gap alone forced four proposals' worth of codes. supporting treats the
        label as one of several optional parts, which makes Label almost universal and therefore
        uninformative, and it cannot record that a field has no label at all except by its absence.
        style also has no variation for a field drawn as a plain row in a grouped list, which is
        what most mobile settings fields are.
      - "The validation list's missing On submit is the single biggest fault in this entry — all
        three raters hit it, two of us named it identically, and the third recorded that On leaving
        the field was only the nearest available fit. Two smaller ones confirmed by this round:
        supporting has no rule for what counts as a Prefix or suffix, so an icon inside a search box
        is an affix to one rater and nothing to another, while Clear button gets its own name — the
        sub should either name every affix control (clear, reveal, unit, menu) or none. And style's
        Outlined/Filled pair is Material's distinction; it cannot describe a white field on dark
        chrome (Amazon) or a Fluent field with a focus underline (Windows), which is both style
        disagreements here."
    sonnet:
      - This dimension has no 'On submit' validation-timing value, unlike the enter-data/form
        entries; for fields that visibly error only once you try to advance (GOV.UK, Google sign-in,
        Shopify phone, Amazon ZIP) I coded On leaving the field as the nearest of the four available
        options rather than force a mismatched one.
      - "Two real codebook gaps and one systematic miss: (1) 'validation' has no On-submit value at
        the field level even though the sibling 'form' archetype does — a real, recurring omission
        both other raters independently named across five instances. (2) 'inputType' has no way to
        name password-style character obscuring, which is a genuine adaptation-to-content-type
        behaviour like the other three values, just for concealment rather than formatting. (3) I
        was under-crediting 'Label' across plainly labelled fields (passwords, bios, form questions)
        — a milder version of the pick-any under-listing seen in other archetypes, here on a
        dimension I'd treated as needing a visually distinctive label rather than any named prompt
        at all."
  codedAt: 2026-09-22
