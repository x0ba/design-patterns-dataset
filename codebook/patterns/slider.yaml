# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "slider". Edit between batches only — see README "Rules".
id: slider
name: Slider
level: component
parent: enter-data
aliases:
  - range slider
  - scrubber
definition: A control for choosing a value or range by dragging along a track.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - design
  - entertainment
  - finance
anatomy:
  - name: Track
    role: The range
  - name: Thumb
    role: The chosen value
  - name: Labels
    role: Scale and value
roles: []
dimensions:
  - name: Values
    family: scope
    question: What is chosen?
    subdimensions:
      - id: values
        name: Values
        select: one
        values:
          - id: single-value
            name: Single value
            example: Volume
          - id: range
            name: Range
            description: Two thumbs
            example: Price range
          - id: discrete-steps
            name: Discrete steps
            example: Rating scales
  - name: Labels
    family: content
    question: What does the track tell you?
    subdimensions:
      - id: labels
        name: Labels
        select: many
        values:
          - id: none
            name: None
            example: Volume
          - id: minimum-and-maximum
            name: Minimum and maximum
            example: Filters
          - id: current-value
            name: Current value
            example: Material value label
          - id: tick-marks
            name: Tick marks
            example: Stepped sliders
          - id: distribution-behind-the-track
            name: Distribution behind the track
            example: Airbnb price histogram
  - name: Scale
    family: encoding
    question: How are values spread along the track?
    subdimensions:
      - id: scale
        name: Scale
        select: one
        values:
          - id: linear
            name: Linear
            example: Most
          - id: logarithmic
            name: Logarithmic
            example: Audio frequency
          - id: custom-breakpoints
            name: Custom breakpoints
            example: Price sliders with uneven steps
  - name: Precision
    family: adaptation
    question: How can a precise value be reached?
    subdimensions:
      - id: precision
        name: Precision
        select: many
        values:
          - id: drag-only
            name: Drag only
            example: Mobile volume
          - id: paired-number-field
            name: Paired number field
            example: Design tools
          - id: arrow-keys
            name: Arrow keys
            example: WAI-ARIA slider
          - id: slow-scrubbing
            name: Slow scrubbing
            description: Move the finger away to slow down
            example: iOS video scrubbing
          - id: scrub-the-label
            name: Scrub the label
            description: Dragging directly on the numeric value's own label changes it, without needing to open
              or grab a visible track.
            example: Adobe Photoshop — Layer opacity
