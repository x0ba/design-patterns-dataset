        name: Scrub the label
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Instances 14 and 19 bundle several sliders; I coded one of them each and said which. Scale
        is rarely knowable from the outside beyond the obvious (dB, price steps).
      - labels and precision overlap when the paired number boxes are also the value readout; Custom
        breakpoints needs a rule for an open-ended top bucket on an otherwise linear track; the unit
        of analysis is one slider, so a screen with two (Tinder) needs the sampler to say which.
    opus:
      - "scale is close to unobservable: a person cannot see whether a volume or price track is
        linear, so I coded Linear where the mapping looks proportional, Logarithmic only where the
        units say so (dB, Hz) and Custom breakpoints for price filters whose last bucket is an
        and-up. precision also lacks the scrubby-number drag (Photoshop's label) that design tools
        all use, and Drag only I read strictly as no other route in."
      - precision's Drag only is an exclusive claim ('the only way in') sitting in a pick-any list,
        so one rater read it as a value that can be added to others and two of us read it as one
        that cannot — it should be phrased as 'No other route' or the sub should be pick one; the
        list also had no scrubby-number drag until sonnet's Scrub the label, which every design tool
        ships. scale is close to unobservable and cannot say which axis it describes (Spotify's log
        frequency spacing versus each fader's gain). labels does not distinguish an end label
        printed on the track from a number box that reads back the current value, which is where
        three raters split on every price filter.
    sonnet:
      - Two instances (14 Tinder, 19 Spotify) actually bundle more than one physical slider under a
        single sample entry; I picked the more distinguishing control to code and named the other in
        the note rather than inventing a compound value.
      - "Two systematic errors: (1) I was treating 'Drag only' as compatible with other precision
        methods and adding it alongside Arrow keys/Paired number field in nearly every cell, when
        the codebook's own gloss and both other raters read it as exclusive by definition — if any
        other method works, the control isn't drag-only. (2) 'labels' Minimum and maximum conflates
        two different real UI patterns across the four price-range filters in this sample: some
        (Airbnb, Zillow) show only an editable min/max box pair, which belongs under precision's
        Paired number field instead; others (Amazon) show a separate passive printed span alongside
        a distinct editable box-and-Go control, where Minimum and maximum as a label is correct; and
        Booking.com has no editable boxes at all, only a passive Current value span. Treating all
        four as the same shape was the source of most of this archetype's disagreement."
  codedAt: 2026-09-22
