        sub: types
        dim: null
        name: Text continuations
        gloss: The rest of the sentence, line or word the person is writing — a continuation of their own
          text rather than an item drawn from a set
        raters:
          - opus
        instances:
          - 4
          - 12
          - 13
        status: raised
      - place: sub:presentation
        sub: presentation
        dim: null
        name: Suggestion strip above keyboard
        gloss: Word predictions render as a row of tappable chips above the on-screen keyboard — distinct
          from a dropdown list, inline ghost text, grouped sections or a full-screen takeover.
        raters:
          - sonnet
        instances:
          - 13
        status: raised
  raterNotes:
    fable:
      - "source is the hard one: catalogue and place search is neither prefix-on-a-fixed-list nor
        popular queries; I used Prefix match for index lookups, Popular queries for
        popularity-ranked catalogues, Personal history when recents/saved dominate."
      - types has no value for entities without images, which is why places, addresses and code
        symbols each drew a proposal; source conflates matching (prefix) with ranking (popularity)
        so catalogue search splits raters; freedom's Free text allowed and Creates new values
        overlap for recipient fields where free text becomes a chip.
    opus:
      - "types is the sub-dimension that breaks: it was written for pick-a-thing autocompletes and
        cannot express a continuation of the person's own writing (Smart Compose, Copilot,
        QuickType) or a code symbol, which is a third of this sample. source is also coarse — nearly
        every list is a prefix match over a set that is then ranked by popularity or by your
        history, and pick-one forces a choice between the matching and the ranking."
      - "types is the sub-dimension that breaks: it has no type for a continuation of the person's
        own writing, for a code symbol, or for a place/address, and those are half this sample;
        source is pick one but every list is a prefix match over a set ranked by popularity or
        history, so it forces a choice between the matching and the ranking and should be pick any;
        freedom's 'Free text allowed' and 'Creates new values' overlap for chip fields like Gmail
        and Outlook."
    sonnet:
      - The 'types' dimension reads as built for search/communication inputs; generative ghost-text
        tools (Smart Compose, Copilot, fish, QuickType) and code-editor IntelliSense both needed
        proposals because none of the five listed categories describe what they suggest.
      - "Two systematic misses recurred: (1) I was under-crediting 'accept' by Arrow keys wherever a
        suggestion list exists — treating arrow-to-highlight and Enter/Click-to-commit as two
        separate acts rather than crediting the arrow key as part of how a suggestion gets accepted,
        which both other raters counted consistently. (2) 'types' has no variation for geocoded
        places/addresses (map, travel and checkout autocompletes) — Query completions, Entities with
        images and Recent inputs all get stretched to cover it; +Places and addresses, proposed
        independently by a peer across five instances, names the real gap. Separately, 'freedom' for
        recipient-chip fields (email To fields) is ambiguous between Free text allowed and Creates
        new values — the codebook's own Creates new values example (tag inputs) is a better
        mechanistic match than the majority vote landed on."
  codedAt: 2026-09-22
