      Query completions: 4
      Entities with images: 3
      Recent inputs: 10
      Commands: 2
      People: 4
      Text continuation: 3
      Places and addresses: 5
      Records or entities: 0
      Code symbols: 1
      Symbols in scope: 0
    source:
      Prefix match: 7
      Popular queries: 4
      Personal history: 6
      Model prediction: 3
    presentation:
      Dropdown list: 12
      Ghost text inline: 3
      Grouped sections: 1
      Full screen on mobile: 3
      Suggestion bar: 1
    accept:
      Click: 17
      Enter: 13
