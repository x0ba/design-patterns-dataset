    - inline-suggestion
    - command-palette
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Suggestions anchor what people end up asking
questions:
  - How should suggestions disclose that they are personalized?
coding:
