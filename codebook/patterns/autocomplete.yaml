    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.5981966072454865
  agreementFirstPass: 0.8194444444444444
  kappaFinal: 0.8910876918728186
  agreementFinal: 0.94
  pass: true
  perSub:
    types:
      kappaFirstPass: 0.5156337511346315
      agreementFirstPass: 0.8272727272727273
      kappaFinal: 0.8600174978127739
      agreementFinal: 0.93125
      flag: null
    source:
      kappaFirstPass: 0.8613251155624034
      agreementFirstPass: 0.85
      kappaFinal: 0.9536679536679535
      agreementFinal: 0.95
      flag: null
    presentation:
      kappaFirstPass: 0.884169884169884
      agreementFirstPass: 0.9
      kappaFinal: 1
      agreementFinal: 1
      flag: null
    accept:
      kappaFirstPass: 0.6952380952380952
      agreementFirstPass: 0.775
      kappaFinal: 0.9294947121034075
      agreementFinal: 0.95
      flag: null
    freedom:
      kappaFirstPass: 0.5691202872531417
      agreementFirstPass: 0.8
      kappaFinal: 0.8145285935085008
      agreementFinal: 0.9
      flag: null
  distribution:
