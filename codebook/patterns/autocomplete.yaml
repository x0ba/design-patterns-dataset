# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "autocomplete". Edit between batches only — see README "Rules".
id: autocomplete
name: Autocomplete
level: component
parent: enter-data
aliases:
  - typeahead
  - combobox
  - suggestions
definition: Suggestions that appear as a person types, completing or replacing the input.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - communication
  - software
  - travel
anatomy:
  - name: Input
    role: Where typing happens
  - name: Suggestion list
    role: What is proposed
  - name: Highlight
    role: The current suggestion
roles:
  - title
  - thumbnail
  - subtitle
dimensions:
  - name: Suggestion types
    family: content
    question: What is suggested?
    subdimensions:
      - id: types
        name: Types
        select: many
        values:
          - id: query-completions
            name: Query completions
            example: Google
          - id: entities-with-images
            name: Entities with images
            example: Spotify search
          - id: recent-inputs
            name: Recent inputs
            example: Recent searches
          - id: commands
            name: Commands
            example: Command palettes
          - id: people
            name: People
            example: Email recipient fields
          - id: text-continuation
            name: Text continuation
            description: The suggestion continues the prose or code being written (next words, a sentence, a
              code block) rather than completing a query or naming an entity
            example: Gmail — Smart Compose in the body
          - id: places-and-addresses
            name: Places and addresses
            description: Street addresses, cities, regions or venues from a geocoder or place index — the
              codebook's own 'address' frame has no type for them
            example: Google Maps — Search here
          - id: records-or-entities
            name: Records or entities
            description: Objects from a known set — addresses, places, records — listed as plain rows with no
              artwork; the existing entity variation requires images
            example: Google Maps — Search here
          - id: code-symbols
            name: Code symbols
            description: Identifiers, methods and keywords from the code's symbol table, each carrying a type
              icon and documentation.
            example: VS Code — IntelliSense
          - id: symbols-in-scope
            name: Symbols in scope
            description: Identifiers, methods and properties that are legal at the cursor, offered with their
              type and documentation
            example: VS Code — IntelliSense
  - name: Source
    family: initiative
    question: Where do suggestions come from?
    subdimensions:
      - id: source
        name: Source
        select: one
        values:
          - id: prefix-match
            name: Prefix match
            example: Country selectors
          - id: popular-queries
            name: Popular queries
            example: Search engines
          - id: personal-history
            name: Personal history
            example: Browser address bars
          - id: model-prediction
            name: Model prediction
            example: Gmail Smart Compose
  - name: Presentation
    family: layout
    question: How are suggestions shown?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: dropdown-list
            name: Dropdown list
            example: Most comboboxes
          - id: ghost-text-inline
            name: Ghost text inline
            example: Smart Compose, fish shell
          - id: grouped-sections
            name: Grouped sections
            example: Spotlight
          - id: full-screen-on-mobile
            name: Full screen on mobile
            example: Mobile search
          - id: suggestion-bar
            name: Suggestion bar
            description: A horizontal strip of a few candidates above a keyboard or input, not a list and not
              inline (iOS QuickType)
            example: iOS keyboard — QuickType bar
  - name: Acceptance
    family: invocation
    question: How is a suggestion taken?
    subdimensions:
      - id: accept
        name: Accept by
        select: many
        values:
          - id: click
            name: Click
            example: All
          - id: enter
            name: Enter
            example: Search boxes
          - id: tab
            name: Tab
            example: Ghost text
          - id: arrow-keys
            name: Arrow keys
            example: WAI-ARIA combobox
  - name: Freedom
    family: scope
    question: Must the value come from the suggestions?
    subdimensions:
      - id: freedom
        name: Freedom
        select: one
        values:
          - id: must-choose
            name: Must choose
            example: Strict comboboxes
          - id: free-text-allowed
            name: Free text allowed
            example: Search
          - id: creates-new-values
            name: Creates new values
            example: Tag inputs
wild:
  score: 1
  note: People can clear history or turn predictions off, but not choose sources.
  examples:
    - name: Gmail
      note: Smart Compose on or off
techniques:
  - name: Suggestion source control
    dimension: Source
    how: Choose and weight what feeds suggestions (history, popular, a model) from the list itself.
    ai: false
signature: Suggestion source control
sample: Search, address, recipient and product-name inputs.
unit: One autocomplete input.
relations:
