          - sonnet
    recorded: []
  raterNotes:
    fable:
      - onDismiss is n/a for confirmations, which are half the sample; Discard silently vs Already
        saved needed a variation for autosaving dialogs.
      - onDismiss is n/a for half the sample and has no value for autosaving dialogs; Only by
        completing is ambiguous for confirmations, where Cancel is both a dismissal and an answer;
        Centered small vs large has no size rule between an alert and a record view.
    opus:
      - onDismiss is n/a for half this sample, because confirmations, alerts and viewers hold no
        work to lose; that is honest but it means the sub-dimension only bites on the five form
        dialogs. modality is also Blocking almost everywhere — Stacked never appeared and Modeless
        only in Word — so it discriminates little. The entry has no way to record a deliberate
        friction like GitHub's type-the-name-to-enable.
      - "onDismiss is the sub-dimension raters could not share: it never says whose work it means —
        the draft typed inside the dialog, or the work behind it that the dialog is asking about
        (the TextEdit save sheet) — and it has no value for a surface that commits as you type,
        which is now the common case. dismissBy's 'Click the backdrop' is really two affordances:
        clicking a dimmed backdrop, and light-dismissing a dialog that has none (Google Calendar's
        bubble, Zoom's leave popup); the same conflation shows up as 'Tap the scrim' in
        bottom-sheet. form and modality also fail together on anchored, scrimless dialogs."
    sonnet:
      - onDismiss only makes sense where there's actual draft content at risk; for plain
        action-confirmations, permission prompts and consent dialogs (about half the sample) I coded
        n/a rather than force-fit Discard silently, since nothing is being discarded — there was
        never a draft to lose.
