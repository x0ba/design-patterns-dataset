# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "modal-dialog". Edit between batches only — see README "Rules".
id: modal-dialog
name: Modal dialog
level: component
parent: navigate
aliases:
  - modal
  - dialog
  - pop-up
  - lightbox
definition: A window over the page that holds interaction until it is dismissed, used for focused
  tasks, confirmations and quick detail.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - productivity
  - enterprise
  - software
anatomy:
  - name: Backdrop
    role: What dims the page
  - name: Container
    role: The dialog surface
  - name: Actions
    role: How it ends
roles:
  - title
  - body
  - action
dimensions:
  - name: Size and position
    family: layout
    question: How big is it, and where?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: centered-small
            name: Centered small
            example: Alert dialogs
          - id: centered-large
            name: Centered large
            example: Airtable expanded record
          - id: full-screen
            name: Full screen
            example: Material full-screen dialog on mobile
          - id: sheet-from-an-edge
            name: Sheet from an edge
            example: iOS sheets
          - id: lightbox
            name: Lightbox
            description: Media on a dark backdrop
            example: Photo viewers
          - id: anchored-bubble
            name: Anchored bubble
            description: The dialog opens attached to the element that raised it — a time slot, a cell — rather
              than centred, at an edge or full screen, while still holding interaction until it is
              answered
            example: Google Calendar — Event creation box
  - name: Opening and closing
    family: invocation
    question: What opens it, and what closes it?
    subdimensions:
      - id: openBy
        name: Opened by
        select: many
        values:
          - id: user-action
            name: User action
            example: Quick view buttons
          - id: system-initiated
            name: System-initiated
            example: Session timeout warnings
          - id: url
            name: URL
            description: The dialog has its own address
            example: Instagram web posts
          - id: keyboard-shortcut
            name: Keyboard shortcut
            example: Slack Cmd+K
      - id: dismissBy
        name: Dismissed by
        select: many
        values:
          - id: close-button
            name: Close button
            example: Most dialogs
          - id: escape
            name: Escape
            example: Most desktop dialogs
          - id: click-the-backdrop
            name: Click the backdrop
            example: Lightboxes
          - id: swipe-down
            name: Swipe down
            example: iOS sheets
          - id: only-by-completing
            name: Only by completing
            example: Required consent dialogs
  - name: Modality
    family: scope
    question: What does it block?
    subdimensions:
      - id: modality
        name: Modality
        select: one
        values:
          - id: blocking
            name: Blocking
            example: Alerts
          - id: modeless
            name: Modeless
            description: The page stays usable
            example: Word Find and Replace
          - id: stacked
            name: Stacked
            description: Dialogs over dialogs
            example: Settings sub-dialogs
  - name: Contents
    family: content
    question: What is it for?
    subdimensions:
      - id: purpose
        name: Purpose
        select: one
        values:
          - id: confirmation
            name: Confirmation
            example: Delete dialogs
          - id: form
            name: Form
            example: Create issue
          - id: detail-view
            name: Detail view
            example: Retail quick view
          - id: media
            name: Media
            example: Lightbox
          - id: multi-step-task
            name: Multi-step task
            example: Setup wizards
          - id: selection-list
            name: Selection list
            description: A list to choose one option from (which playlist to add to, where to share) — not a
              confirmation, a filled-in form, a detail view, media, or a multi-step task.
            example: Apple Music — Add to a Playlist sheet
  - name: Unsaved work
    family: feedback
    question: What happens to work when it closes?
    subdimensions:
      - id: onDismiss
        name: On dismiss
        select: one
        values:
          - id: discard-silently
            name: Discard silently
            example: Simple forms
          - id: confirm-before-discarding
            name: Confirm before discarding
            example: GitHub new issue
          - id: keep-a-draft
            name: Keep a draft
            example: Slack message drafts
          - id: already-saved
            name: Already saved
            description: Edits made inside the dialog persist as they are made, so closing discards nothing
              (Airtable expanded record)
            example: Airtable — Expanded record
wild:
  score: 0
  note: Where a dialog opens is always fixed by the product, even though it is exactly the openIn
    choice CHI '25 made malleable.
  examples: []
techniques:
  - name: Undock
    dimension: Size and position
    how: Turn any dialog into a side-by-side panel, a new tab or an in-place expansion; the
      overview–detail openIn customization for every modal.
    ai: false
  - name: Keep a draft
    dimension: Unsaved work
    how: A person-level preference that every dismissed form keeps a draft.
    ai: false
signature: Undock
sample: Dialogs encountered in core flows of the top 50 sites and apps.
unit: One dialog in one flow.
relations:
  uses: []
  specializes: []
  neighbors:
    - drawer
    - popover
    - bottom-sheet
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Most people dismiss dialogs without reading them
questions:
  - Which dialogs lose their meaning when undocked?
coding:
