  raterNotes:
    fable:
      - Object structure has no value for source-text editors (coded n/a) and only Flat objects for
        flowing rich text; Authorship coded by where the file lives (desktop file → Solo even where
        cloud co-authoring is possible).
      - generation is pick-one but nearly every office and design tool holds Templates and a prompt
        feature at once; the Canva Magic Design example shows the codebook wants the highest level
        shipped, and the gloss should say so or the sub-dimension should be pick any. authorship has
        the same hybrid problem for desktop apps that co-author through the cloud. structure has no
        value for flowing rich text, and slide tools (groups and z-order, no layers panel) fall
        between Flat objects and Layers and groups. Selection's Text range needs a rule for
        character ranges inside a text object in a canvas tool.
    opus:
      - "Structure has no variation for a flowing text document: paragraphs had to be called Blocks,
        which blurs the line with Notion, and source text had to be n/a. Generation is also a
        pick-one over features that coexist — almost every tool now has templates and a prompt — so
        I coded the strongest thing the product ships in that surface and said so in each note."
      - "generation is a pick-one over rungs that coexist — almost every tool here ships templates
        and a prompt — so I re-coded it with one stated rule: take the affordance the sampler put on
        the screen, and where the screen is silent take the strongest rung that ships to an ordinary
        user without a separate purchase or plugin. It wants to be pick any. structure still has no
        variation for flowing text (paragraphs had to be Blocks) and its Layers and groups compounds
        two independent things: a persistent layer stack and grouping — the split on Keynote and
        PowerPoint was entirely that. Slash commands is named for a character rather than a
        behaviour, which leaves Google Docs' @ menu uncodeable."
    sonnet:
      - Object structure didn't fit raw source-text tools (VS Code, Overleaf) at all — code isn't
        organized as flat/layered/component/block/node parts — coded '?' for those two. 'Blocks' was
        stretched to cover ordinary flowing-paragraph documents (Word/Docs/Obsidian), not just
        literal block editors like Notion.
      - Generation is pick-one but Google Docs and Notion each truthfully hold Templates and
        Generate-from-a-prompt at once (a gallery plus a bolted-on AI writer); I took the codebook's
        first-listed value each time, but the sub-dimension wants to be pick-any. Authorship's
        Real-time multiplayer doesn't distinguish always-on multiplayer (Figma, Notion) from
        collaboration that's conditional on cloud storage (Word, PowerPoint, Keynote), which is why
        raters split product-by-product on whether to code the default solo state or the available
        collaborative one.
