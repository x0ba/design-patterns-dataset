# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "create". Edit between batches only — see README "Rules".
id: create
name: Create and compose
level: archetype
aliases:
  - authoring
  - direct manipulation
  - creative tools
definition: "Make an artifact by directly manipulating its parts: text, shapes, nodes, clips or code."
data: document
platforms:
  - desktop
  - web
  - mobile
domains:
  - design
  - software
  - productivity
  - entertainment
  - education
anatomy:
  - name: Surface
    role: Where the artifact lives
  - name: Objects
    role: Its manipulable parts
  - name: Selection
    role: What is being acted on
  - name: Tools
    role: How parts change
  - name: Properties
    role: Values of the selection
roles: []
dimensions:
  - name: Surface
    family: layout
    question: What kind of space holds the artifact?
    subdimensions:
      - id: surface
        name: Surface model
        select: one
        values:
          - id: flowing-document
            name: Flowing document
            example: Google Docs
          - id: infinite-canvas
            name: Infinite canvas
            example: Miro
          - id: pages-or-artboards
            name: Pages or artboards
            example: Canva designs
          - id: node-graph
            name: Node graph
            example: Blender shader editor
          - id: time-tracks
            name: Time tracks
            example: Premiere Pro
          - id: source-text
            name: Source text
            example: VS Code
          - id: 3d-scene
            name: 3D scene
            description: A navigable three-dimensional space with a camera, where the artifact is objects in
              depth rather than marks on a plane — the surface of every 3D, CAD and XR authoring
              tool
            example: Blender — 3D viewport
  - name: Object structure
    family: composition
    question: How are parts organized?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: flat-objects
            name: Flat objects
            example: Whiteboards
          - id: layers-and-groups
            name: Layers and groups
            example: Photoshop
          - id: components-with-instances
            name: Components with instances
            example: Figma components
          - id: blocks
            name: Blocks
            example: Notion
          - id: nodes-and-edges
            name: Nodes and edges
            example: Node editors
  - name: Selection
    family: scope
    question: What can be acted on at once?
    subdimensions:
      - id: selection
        name: Selection
        select: many
        values:
          - id: single-object
            name: Single object
            example: Click
          - id: multiple-objects
            name: Multiple objects
            example: Shift-click, marquee
          - id: by-similarity
            name: By similarity
            example: Figma Select matching layers
          - id: text-range
            name: Text range
            example: Documents
  - name: Tool access
    family: invocation
    question: How are tools reached?
    subdimensions:
      - id: tools
        name: Tool access
        select: many
        values:
          - id: toolbar
            name: Toolbar
            example: Photoshop tools
          - id: contextual-toolbar
            name: Contextual toolbar
            description: Appears with a selection
            example: Miro
          - id: slash-commands
            name: Slash commands
            example: Notion
          - id: keyboard-shortcuts
            name: Keyboard shortcuts
            example: Figma
          - id: direct-gestures
            name: Direct gestures
            description: Pen and touch
            example: Procreate
          - id: command-palette
            name: Command palette
            description: A searchable launcher for every command in the tool, opened by a shortcut and driven by
              typing the action's name; distinct from a toolbar, a contextual toolbar and from slash
              commands, which insert content into a document
            example: Figma — Design file
  - name: Generation
    family: initiative
    question: How much does the tool make for you?
    subdimensions:
      - id: generation
        name: Generation
        select: one
        values:
          - id: manual
            name: Manual
            example: Classic editors
          - id: templates
            name: Templates
            example: Canva templates
          - id: generate-from-a-prompt
            name: Generate from a prompt
            example: Canva Magic Design
          - id: variations-to-choose-from
            name: Variations to choose from
            example: Luminate (CHI '24)
  - name: Authorship
    family: collaboration
    question: How many people make it, and how?
    subdimensions:
      - id: authorship
        name: Authorship
        select: one
        values:
          - id: solo-file
            name: Solo file
            example: Desktop files
          - id: real-time-multiplayer
            name: Real-time multiplayer
            example: Figma
          - id: branch-and-merge
            name: Branch and merge
            example: Figma branching
wild:
  score: 3
  note: Creative professionals routinely customize workspaces, toolbars, shortcuts and plugins.
  examples:
    - name: Photoshop
      note: Saved workspaces and custom shortcuts
    - name: Figma
      note: Plugins and widgets
    - name: VS Code
      note: Extensions, settings and keybindings
techniques:
  - name: Attributes as objects
    dimension: Object structure
    how: Styles and properties become first-class objects that can be applied, linked and searched,
      after Object-Oriented Drawing (Xia et al. CHI '16), which CHI '25 builds on.
    ai: false
  - name: Select by attribute
    dimension: Selection
    how: Form and operate on aggregate selections by shared attribute values, after Collection Objects
      (Xia et al. CHI '17).
    ai: false
  - name: Variations of this
    dimension: Generation
    how: Generate alternatives for the selection, laid out side by side as a small design space to
      compare and blend.
    ai: true
signature: Attributes as objects
sample: Top creative, design, office and developer tools on desktop and web.
unit: One authoring environment for one artifact type.
