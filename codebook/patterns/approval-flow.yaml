# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "approval-flow". Edit between batches only — see README "Rules".
id: approval-flow
name: Approval flow
level: pattern
parent: transact
aliases:
  - review workflow
  - sign-off
  - pull request review
  - expense approval
definition: Routing a request to people who approve it, reject it or ask for changes.
data: sequence
platforms:
  - web
  - mobile
  - desktop
domains:
  - enterprise
  - software
  - finance
  - government
anatomy:
  - name: Request
    role: What is being asked
  - name: Reviewers
    role: Who decides
  - name: Decision
    role: Approve, reject, request changes
  - name: Trail
    role: What happened
roles:
  - requester
  - amount
  - status
  - reviewer
dimensions:
  - name: Routing
    family: flow
    question: Who reviews, in what order?
    subdimensions:
      - id: routing
        name: Routing
        select: one
        values:
          - id: single-approver
            name: Single approver
            example: Manager approval
          - id: sequential-chain
            name: Sequential chain
            example: Finance chains
          - id: parallel-reviewers
            name: Parallel reviewers
            description: Any or all must approve
            example: GitHub required reviews
          - id: conditional-by-rule
            name: Conditional by rule
            example: Expense rules by amount
  - name: Review surface
    family: content
    question: What does a reviewer see?
    subdimensions:
      - id: surface
        name: Surface
        select: many
        values:
          - id: request-summary
            name: Request summary
            example: Expense reports
          - id: diff-of-changes
            name: Diff of changes
            example: GitHub pull requests
          - id: evidence-attachments
            name: Evidence attachments
            example: Receipts
          - id: policy-checks
            name: Policy checks
            example: GitHub status checks
  - name: Decision actions
    family: invocation
    question: How is a decision made?
    subdimensions:
      - id: actions
        name: Actions
        select: many
        values:
          - id: approve
            name: Approve
            example: All
          - id: reject
            name: Reject
            example: All
          - id: request-changes
            name: Request changes
            example: GitHub
          - id: delegate
            name: Delegate
            example: Out-of-office delegation
          - id: approve-from-a-notification
            name: Approve from a notification
            example: Slack approval messages
  - name: Timing
    family: lifecycle
    question: What if nobody decides?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: no-deadline
            name: No deadline
            example: Pull requests
          - id: reminders
            name: Reminders
            example: Expense tools
          - id: escalation-after-timeout
            name: Escalation after timeout
            example: Service desks
          - id: auto-approve-under-threshold
            name: Auto-approve under threshold
            example: Small expenses
  - name: Visibility
    family: collaboration
    question: Who sees the discussion and history?
    subdimensions:
      - id: visibility
        name: Visibility
        select: one
        values:
          - id: status-only
            name: Status only
            example: Leave requests
          - id: full-audit-trail
            name: Full audit trail
            example: Finance approvals
          - id: comments-on-items
            name: Comments on items
            example: GitHub review comments
  - name: Status to requester
    family: feedback
    question: What does the requester see while waiting?
    subdimensions:
      - id: status
        name: Status
        select: one
        values:
          - id: final-result-only
            name: Final result only
            example: Simple forms
          - id: stage-by-stage
            name: Stage by stage
            example: Procurement portals
          - id: who-is-holding-it
            name: Who is holding it
            example: GitHub reviewers list
wild:
  score: 1
  note: Rules are configured by administrators, not by the people reviewing.
  examples:
    - name: GitHub
      note: Branch protection and required reviewers
techniques:
  - name: Decide where you are
    dimension: Decision actions
    how: Approve from any surface (email, chat, a notification) with the key attributes surfaced into
      that surface, Fluid Attributes into the notification.
    ai: false
  - name: Summarize risk
    dimension: Review surface
    how: A summary of the request’s risks and policy exceptions, each linked to evidence.
    ai: true
signature: Decide where you are
sample: Code review, expense, procurement, HR and content publishing tools.
unit: One approval workflow.
