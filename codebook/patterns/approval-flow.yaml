  raterNotes:
    fable:
      - "timing was hard to code from product knowledge: whether reminders or escalation are default
        versus admin-configured is not visible to a requester, so Reminders/Escalation for
        enterprise tools (Coupa, ServiceNow, Ariba) is moderate confidence."
      - Request summary reads as either the request's own description (every tool) or a
        summary-as-primary-surface (expense tools); the gloss should say. Sequential chain and
        Conditional by rule overlap when rules generate a chain. Who is holding it and Stage by
        stage overlap whenever a chain shows the current holder.
    opus:
      - "actions needed a Hold or Send-back-without-rejecting value for Coupa and Concur — I folded
        send-back into Request changes and left Hold uncoded. routing's Parallel reviewers and
        Conditional by rule overlap badly: GitLab, Azure DevOps and ServiceNow all compute a
        parallel reviewer set from rules, and I split them by whether a human names the reviewers
        (parallel) or a rule does (conditional), which is a judgement another rater could easily
        make the other way."
      - "status is pick one but Expensify, DocuSign, Ariba and Teams all truthfully show both the
        stage and the person holding it — it wants to be pick any. Parallel reviewers conflates two
        things, several reviewers at once and a rule that they must approve, which is what made
        Figma and Azure DevOps split three ways. Delegate and Approve from a notification also sit
        oddly in 'Decision actions': one is an out-of-band configuration, the other a surface, and
        neither is a decision."
    sonnet:
      - timing (deadline/escalation behavior) was often not directly evident from the sample note
        and inferred from general knowledge of each product category (finance/procurement tools
        escalate, lightweight dev/task tools don't); flagged the more confident cases only where the
        note said so explicitly.
      - "Two codebook problems recurred here. (1) visibility's Comments on items and Full audit
        trail are not mutually exclusive in review tools with inline diff/document commenting plus a
        separate history record (GitLab, Gerrit, Google Docs, DocuSign, Figma) — several of my
        round-1 codes picked the wrong one of two things that were both present, which the pick-one
        framing hides; DocuSign and Google Docs genuinely have both, and only their relative
        prominence separates them. (2) status's three variations (Final result only / Stage by stage
        / Who is holding it) collapse toward each other whenever routing is Single approver: naming
        'who is holding it' is trivial when there is exactly one possible holder, which produced
        repeated three-way splits (BambooHR, Asana, Figma) that a scope note tying status readings
        to routing structure would resolve."
