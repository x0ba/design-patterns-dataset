        status: raised
  raterNotes:
    fable:
      - "scaleBehaviour: Google Maps is the exemplar for both Discrete zoom levels and Semantic
        zoom; I coded every vector basemap Semantic zoom (labels and POIs change with scale) and
        raster-tile maps Discrete. Canvas tools' shapes and frames fit no marksLayers variation,
        hence the Authored objects proposal."
    opus:
      - "scaleBehaviour needed a rule: every vector basemap both zooms continuously and changes what
        it draws, so I coded geographic maps Semantic zoom throughout and reserved Continuous zoom
        for canvases and 3D scenes where the representation never changes. moveBy has no value for
        physical movement, which is most of what navigation means in AR and XR."
    sonnet:
      - Corrected an initial instinct to code standard web/mobile maps as 'Semantic zoom' — the
        codebook itself cites Google Maps under 'Discrete zoom levels', so all tile-based consumer
        maps (Google/Apple Maps, Uber, Strava, Zillow, Citymapper, Windy) were coded Discrete zoom
        levels for consistency.
      - "scaleBehaviour wants to be pick any: it conflates the mechanic of zooming (discrete tile
        steps vs continuous pinch) with its effect on representation (semantic), and every modern
        vector map is continuous AND semantic — the codebook names Google Maps as the exemplar of
        Discrete zoom levels and, one line later, of Semantic zoom. Two further ambiguities drove
        most of the rest: 'Live positions' does not say whether the person's own live marker counts
        (I ruled that it does), and 'Annotations by people' has no counterpart for authored canvas
        content or for author-placed hotspots on a model, which is what +Authored objects fixes."
