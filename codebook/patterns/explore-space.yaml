# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "explore-space". Edit between batches only — see README "Rules".
id: explore-space
name: Explore space
level: archetype
aliases:
  - spatial navigation
  - spatial browsing
  - wayfinding in space
definition: Understand, navigate and select within a spatial world — geographic, diagrammatic,
  seating or three-dimensional — where position itself carries meaning.
data: space
platforms:
  - web
  - mobile
  - desktop
  - xr
domains:
  - travel
  - mobility
  - entertainment
  - design
  - science
  - commerce
  - education
anatomy:
  - name: Projection
    role: How the world is drawn onto the screen
  - name: Viewport
    role: The currently visible region
  - name: Located things
    role: Objects or places with positions
  - name: Selection
    role: What the person has focused or picked
roles:
  - position
  - label
  - scale
  - layer
dimensions:
  - name: Projection and scale
    family: encoding
    question: How is the spatial world projected, and at what scale?
    subdimensions:
      - id: projection
        name: Projection
        select: one
        values:
          - id: cartographic-map
            name: Cartographic map
            description: Geographic projection
            example: Google Maps
          - id: schematic-diagram
            name: Schematic diagram
            description: Topology over metric accuracy
            example: Transit maps
          - id: 2d-plan
            name: 2D plan
            description: Floor or seat layout
            example: Ticketmaster venue map
          - id: infinite-canvas
            name: Infinite canvas
            description: Free 2D plane
            example: Miro
          - id: 3d-scene
            name: 3D scene
            description: Perspective or orthographic view
            example: Sketchfab viewer
          - id: xr-situated
            name: XR situated
            description: Space aligned to the room
            example: Apple Immersive maps demos
      - id: scaleBehaviour
        name: Scale behaviour
        select: one
        values:
          - id: discrete-zoom-levels
            name: Discrete zoom levels
            description: Tile or LOD steps
            example: Google Maps
          - id: continuous-zoom
            name: Continuous zoom
            description: Pinch any scale
            example: Figma canvas
          - id: semantic-zoom
            name: Semantic zoom
            description: Representation changes with scale
            example: Maps switching from cities to streets
          - id: fixed-scale
            name: Fixed scale
            description: No zoom, pan only
            example: Some seat charts
  - name: Navigation of the viewport
    family: invocation
    question: How does a person move through space?
    subdimensions:
      - id: moveBy
        name: Move by
        select: many
        values:
          - id: pan-and-drag
            name: Pan and drag
            example: Google Maps
          - id: zoom-gestures
            name: Zoom gestures
            example: Figma
          - id: search-to-a-place
            name: Search to a place
            description: Jump via query
            example: Google Maps search
          - id: orbit-rotate
            name: Orbit / rotate
            description: Change viewpoint in 3D
            example: Google Earth
          - id: follow-a-route
            name: Follow a route
            description: Camera tracks a path
            example: Turn-by-turn navigation
          - id: teleport-jump-cuts
            name: Teleport / jump cuts
            description: Instant relocate
            example: VR locomotion teleport
          - id: locomotion
            name: Locomotion
            description: Continuous first-person movement by joystick or keys through a 3D world, distinct from
              teleporting
            example: Horizon Worlds — A world in VR
          - id: move-your-body
            name: Move your body
            description: "The viewport moves because the person moves: in AR and room-scale XR the camera is the
              device, so walking, leaning and turning are the navigation"
            example: IKEA — View in your room
  - name: Located content
    family: content
    question: What kinds of things appear in space, and how abstracted are they?
    subdimensions:
      - id: marksLayers
        name: Marks and layers
        select: many
        values:
          - id: points-of-interest
            name: Points of interest
            example: Google Maps pins
          - id: paths-and-regions
            name: Paths and regions
            example: Strava routes, zoning
          - id: live-positions
            name: Live positions
            description: Moving entities
            example: Uber driver markers
          - id: selectable-units
            name: Selectable units
            description: Seats, parcels, rooms
            example: Ticketmaster seats
          - id: annotations-by-people
            name: Annotations by people
            example: Miro sticky notes
          - id: imagery-photogrammetry
            name: Imagery / photogrammetry
            example: Google Earth 3D
          - id: authored-objects
            name: Authored objects
            description: Shapes, frames, drawings and content people create as the substance of the space
              itself, as opposed to annotations laid over something else
            example: Figma — Design canvas
          - id: placed-models
            name: Placed models
            description: Virtual objects anchored into the real room at true scale
            example: IKEA — View in your room
          - id: continuous-field
            name: Continuous field
            description: A scalar or vector field rendered across the whole world — wind particles, temperature
              shading, rainfall — rather than discrete located things
            example: Windy — Weather map
  - name: Selection and detail
    family: composition
    question: How does selecting in space open further information?
    subdimensions:
      - id: selectionModel
        name: Selection model
        select: one
        values:
          - id: tap-mark-for-detail
            name: Tap mark for detail
            description: Overview–detail in space
            example: Google Maps place cards
          - id: multi-select-region
            name: Multi-select region
            description: Marquee or lasso
            example: Figma
          - id: hover-inspect
            name: Hover inspect
            description: Transient readout
            example: GIS attribute hover
          - id: enter-immersive-focus
            name: Enter / immersive focus
            description: Dive into a sub-space
            example: Indoor maps entering a building
wild:
  score: 2
  note: Layer toggles and map type (default / satellite) are common; projection choice and selection
    model almost never are end-user controllable.
  examples:
    - name: Google Maps
      note: Layers, map type, and saved lists
    - name: Miro
      note: Frame and zoom-to-fit habits
    - name: Figma
      note: Zoom percentage and multiplayer cursors
techniques:
  - name: Semantic zoom as content policy
    dimension: Projection and scale
    how: Bind which attributes and mark types appear to scale bands, so zooming is not only geometric
      but a content filter the person can edit.
    ai: false
  - name: Space then detail
    dimension: Selection and detail
    how: Treat spatial marks as an overview and the attached card or inspector as detail, with the same
      Fluid Attributes grammar as CHI '25 collections.
    ai: false
  - name: Find a place that fits
    dimension: Located content
    how: “Quiet cafés open now within a ten-minute walk” filters and ranks marks with inspectable
      criteria on the map.
    ai: true
signature: Semantic zoom as content policy
sample: Maps, indoor wayfinding, ticketing seat maps, whiteboards, design canvases, Earth viewers
  and 3D product/model viewers across app stores and the web.
unit: One spatial viewport over one world (a product may host several worlds).
