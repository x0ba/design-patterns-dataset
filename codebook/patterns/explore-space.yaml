        status: raised
      - place: sub:marksLayers
        sub: marksLayers
        dim: Located content
        name: Continuous data field
        gloss: A continuous animated data layer (e.g., wind flow, temperature, precipitation) rendered as a
          field over the whole visible area, rather than discrete points, paths, live positions,
          annotations, or photographic imagery
        raters:
          - sonnet
        instances:
