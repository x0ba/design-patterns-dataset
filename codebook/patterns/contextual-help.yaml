# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "contextual-help". Edit between batches only — see README "Rules".
id: contextual-help
name: Contextual help
level: pattern
parent: guide
aliases:
  - inline help
  - help panel
  - info icons
  - in-app assistant
definition: Explanations available where a question arises, without leaving the task.
data: document
platforms:
  - web
  - desktop
  - mobile
domains:
  - enterprise
  - software
  - finance
  - government
anatomy:
  - name: Access point
    role: Where help is asked for
  - name: Content
    role: The explanation
  - name: Placement
    role: Where it shows
roles: []
dimensions:
  - name: Access
    family: invocation
    question: How is help asked for?
    subdimensions:
      - id: access
        name: Access
        select: many
        values:
          - id: info-icon
            name: Info icon
            example: Form field info popovers
          - id: help-panel-link
            name: Help panel link
            example: AWS console Info links
          - id: shortcut-sheet
            name: Shortcut sheet
            example: "? in GitHub"
          - id: searchable-help-menu
            name: Searchable help menu
            example: macOS Help menu
          - id: assistant-chat
            name: Assistant chat
            example: In-product copilots
          - id: hover
            name: Hover
            description: Hover or a modifier-click on the item itself brings help, with no icon, link or menu
            example: Adobe Photoshop — Rich tool tips
          - id: the-control-itself
            name: The control itself
            description: Help is asked for by pointing at or modifier-clicking the object being explained — a
              rich tooltip on hover, an Option-click on a symbol — rather than by a separate help
              affordance placed next to it
            example: Adobe Photoshop — Rich tool tips
  - name: Content
    family: content
    question: What kind of help is given?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: definitions
            name: Definitions
            example: Tax terms
          - id: step-instructions
            name: Step instructions
            example: Help panels
          - id: video
            name: Video
            example: Creative apps
          - id: links-to-documentation
            name: Links to documentation
            example: Developer consoles
          - id: community-answers
            name: Community answers
            example: Support forums
          - id: shortcut-reference
            name: Shortcut reference
            description: A list of keyboard shortcuts and their actions
            example: GitHub — Keyboard shortcuts overlay
  - name: Placement
    family: layout
    question: Where does help appear?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: popover-at-the-field
            name: Popover at the field
            example: Info icons
          - id: side-panel-beside-the-task
            name: Side panel beside the task
            example: AWS help panel
          - id: overlay
            name: Overlay
            example: Shortcut sheets
          - id: new-tab
            name: New tab
            example: Documentation links
          - id: inline-with-the-field
            name: Inline with the field
            description: The help is printed in the layout beside or beneath the control it explains, taking up
              space and needing no interaction — GOV.UK hint text, form helper text, empty-field
              descriptions
            example: GOV.UK — Hint text under fields
          - id: inline-static-text
            name: Inline static text
            description: Help text sits permanently visible beside or under the field itself, needing no
              popover, panel or overlay to reveal it, e.g. GOV.UK hint text
            example: GOV.UK — Hint text under fields
  - name: Proactivity
    family: initiative
    question: Does help wait to be asked?
    subdimensions:
      - id: proactivity
        name: Proactivity
        select: one
        values:
          - id: on-request
            name: On request
            example: Info icons
          - id: suggested-when-stuck
            name: Suggested when stuck
            example: Error-driven help
          - id: always-visible-hints
            name: Always-visible hints
            example: GOV.UK hint text
  - name: Relevance
    family: scope
    question: How specific is it?
    subdimensions:
      - id: relevance
        name: Relevance
        select: one
        values:
          - id: page
            name: Page
            example: Page help links
          - id: field
            name: Field
            example: Field hints
          - id: the-person-s-current-state
            name: The person’s current state
            description: Sees the data and configuration
            example: Context-aware assistants
          - id: whole-product
            name: Whole product
            description: Help searched or listed for the whole product, not tied to the current page or field
            example: Microsoft Word — Help pane
wild:
  score: 0
  note: Help is authored by the product.
  examples: []
techniques:
  - name: Menu search that points
    dimension: Access
    how: Searching help reveals where the command lives, as macOS Help does for menu items, generalized
      to any control.
    ai: false
  - name: Explain my screen
    dimension: Relevance
    how: Help grounded in what the person is looking at, including their own customizations.
    ai: true
signature: Menu search that points
sample: Cloud consoles, tax and finance software, creative and office suites.
unit: One help system.
