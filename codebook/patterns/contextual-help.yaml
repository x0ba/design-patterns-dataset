  raterNotes:
    fable:
      - Relevance lacks a product-wide value, which help menus and shortcut sheets need (six of
        twenty). Content lacks shortcut lists. GOV.UK hint text has no access point at all.
      - relevance lacks a whole-product value, which every help menu and shortcut sheet needs; the
        other raters put those under Page, so the sub splits on a gap, not a reading. placement has
        no phone form of the popover (a bottom sheet) and no inline value. All three raters proposed
        the inline placement and the hover access under different names.
    opus:
      - "proactivity is On request for 18 of 20, which is the honest finding: shipping products
        almost never volunteer help, and 'Suggested when stuck' — the variation that would matter
        most — went unused across the whole sample. relevance is nearly binary between Field and
        Page; 'The person's current state' only fires where an assistant can read the account, and
        it will be the value that grows as copilots spread. placement's four values cannot tell a
        popover from a bottom sheet, which is the same component on two form factors. The access and
        content subs disagree with each other about shortcut sheets, which is what the second
        proposal fixes."
      - "Four gaps in this entry were found independently by all three raters, which is the
        strongest signal in the packet: help summoned by the control itself, a shortcut list as
        content, permanently inline help text, and help that is scoped to the whole product. The
        placement gap was proposed under three different names, which is the codebook's problem to
        settle. `placement` is also written for desktop — a mobile bottom sheet is field-scoped in
        intent but an overlay in form, and raters split on which to record."
    sonnet:
      - content has no variation for a plain keyboard-shortcut list (12, 13), since Shortcut sheet
        is only named as an access mechanism in this codebook, not as a content type; left empty
        rather than forced into Step instructions.
      - "The `relevance` sub is missing a value between Field and Page on the broad end: a global,
        page-blind help search (macOS Help menu, Word's Help pane, Figma's/Notion's ? menu) returns
        the same thing no matter where you are, which is not what 'Page' names (a page-scoped
        result) — fable's +Whole product across six instances names a real, recurring gap, not a
        one-off. Separately, `access` needs a value for help triggered by interacting with the
        explained object itself (hover or a modifier-click) rather than a distinct help affordance
        beside it — opus's +The control itself is the cleaner statement of this than either fable's
        or my own narrower +Hover, since it also covers modifier-click cases that aren't literally
        hovering."
