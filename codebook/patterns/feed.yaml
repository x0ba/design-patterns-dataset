  raterNotes:
    fable:
      - Position (end state) is hard to know for bounded editorial feeds (Apple News, Google News
        coded ?). Switchable vs Ranked depends on whether a hidden dropdown counts as a tab; I
        counted Instagram's.
      - Switchable and Sort by user overlap whenever the sort keys are exactly ranked and recent,
        and the codebook should say whether the option set, the control form or a buried setting
        decides. Headline versus Card preview is undefined for a headline with a thumbnail and no
        body. Expandable threads needs to say whether always-visible reply previews count. All three
        raters proposed the same story-cluster nesting under three names, and two proposed the same
        global-pool source; both are missing values.
    opus:
      - "ordering forced a call on products whose ranked/chronological switch is a menu rather than
        tabs (Instagram, LinkedIn): I coded Switchable whenever the switch is reachable from the
        feed's own header, and Sort by user only where there are several sort keys rather than a
        pair. nesting is about the feed surface, not the item page, so Reddit's feed is Flat even
        though the codebook cites Reddit comments — I expect disagreement there. heterogeneity's
        Uniform posts and Mixed media types are exclusive in practice, so the sub is really one
        pick-one plus two flags. Whether a given product currently carries ads is the least stable
        thing here."
      - "Two thirds of this packet is the pick-any problem the brief predicts — one rater's list
        missing an item the others saw — and it clusters on the sub-dimensions where the feature is
        intermittent: Injected modules and Ads appear between posts and may not be on screen when
        you look, and Carousel inside post is a property of some posts and not of the feed.
        `heterogeneity`, `sources`, `loading` and `nesting` would all score better if the codebook
        said whether a unit that appears sometimes counts. The codebook faults proper: `ordering`'s
        Switchable is a special case of Sort by user (LinkedIn's Top/Recent is both by definition),
        and neither covers an edited feed — Apple News's Top Stories is chosen by people, which
        Ranked ('an algorithm orders by predicted interest') actively misdescribes. `nesting` has no
        value for a cluster of several sources' posts under one lead, which all three of us proposed
        separately. `sources` has no value for an unselected global pool (Hacker News), and its
        Custom feeds and Lists overlap for a reader like Feedly. `position` has no value for a
        finite list that never announces its end. And `density` is read two ways — as how much of
        the body shows (truncation) or as whether the media is whole; the gloss means the former."
    sonnet:
      - Several products (Google News, Apple News) blur the line between per-item nesting and
        page-level sectioning; only Google News's inline related-coverage cluster was coded as
        nested (+Story cluster), since Apple News's sections are just headers over otherwise
        standalone cards.
      - "Three codebook problems stood out most. (1) 'sources' undercounts real products more than
        once: Hacker News's fully unpersonalized global pool has no matching value (hence Global
        pool), and Apple/Google News's editorial curation isn't 'Ranked' at all (hence Editorially
        curated) — the ordering vocabulary conflates 'an algorithm predicts interest' with 'a person
        edits the order,' which are genuinely different mechanisms. (2) Three raters independently
        invented nearly identical nesting variations (Clustered stories / Clustered coverage / Story
        cluster) for the same lead-story-plus-related-coverage pattern seen on both Apple News and
        Google News — a real, recurring gap in the four nesting values, not a one-off. (3) 'Followed
        accounts' is used inconsistently for topic/community-based sources that aren't personal
        follows (Reddit communities, Tumblr tags, Feedly boards, Strava clubs) — some of these are
        closer to 'Topics' than to a social-follow graph, and the boundary between the two values
        needs a clearer rule than product-by-product judgment calls."
