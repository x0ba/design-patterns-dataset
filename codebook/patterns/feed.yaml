# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "feed". Edit between batches only — see README "Rules".
id: feed
name: Feed
level: pattern
parent: browse-collections
aliases:
  - stream
  - timeline
  - activity stream
  - news feed
definition: An unbounded, continuously arriving stream of heterogeneous items, ordered by time or by
  ranking and consumed by scrolling.
data: stream
platforms:
  - web
  - mobile
domains:
  - social
  - news
  - entertainment
  - software
  - commerce
anatomy:
  - name: Stream
    role: The scrolling container and its loading edge
  - name: Post
    role: "One item: author, body, media, engagement"
  - name: Injected modules
    role: Non-post units placed into the stream
  - name: Ranking
    role: The invisible policy that decides order
roles:
  - author
  - avatar
  - timestamp
  - body
  - media
  - engagement
  - action
dimensions:
  - name: Post content
    family: content
    question: How much of each post appears, and how uniform are the items?
    subdimensions:
      - id: density
        name: Density
        select: one
        values:
          - id: headline
            name: Headline
            description: Title and source only
            example: Hacker News
          - id: card-preview
            name: Card preview
            description: Truncated body with media
            example: LinkedIn
          - id: full-post
            name: Full post
            description: Everything inline
            example: X / Twitter
          - id: full-screen-single-item
            name: Full-screen single item
            description: One post fills the viewport
            example: TikTok For You
      - id: heterogeneity
        name: Heterogeneity
        select: many
        values:
          - id: uniform-posts
            name: Uniform posts
            description: One item type
            example: Hacker News
          - id: mixed-media-types
            name: Mixed media types
            description: Text, image, video, link
            example: Facebook
          - id: injected-modules
            name: Injected modules
            description: Carousels of suggestions or stories inside the stream
            example: Instagram suggested posts
          - id: ads
            name: Ads
            description: Sponsored units in the stream
            example: Most social feeds
  - name: Ordering and sources
    family: initiative
    question: Who decides what appears, and in what order?
    subdimensions:
      - id: ordering
        name: Ordering
        select: one
        values:
          - id: chronological
            name: Chronological
            description: Newest first from followed sources
            example: Mastodon home
          - id: ranked
            name: Ranked
            description: An algorithm orders by predicted interest
            example: TikTok For You
          - id: sort-by-user
            name: Sort by user
            description: The person picks a sort
            example: Reddit Best, Hot, New, Top
          - id: switchable
            name: Switchable
            description: Tabs between ranked and chronological
            example: X For you / Following
          - id: editorially-curated
            name: Editorially curated
            description: People at the publisher choose and order the lead items; the feed is edited rather than
              ranked by predicted interest or sorted by the reader
            example: Apple News — Today
      - id: sources
        name: Sources
        select: many
        values:
          - id: followed-accounts
            name: Followed accounts
            example: Mastodon
          - id: topics
            name: Topics
            example: Reddit communities
          - id: algorithmic-discovery
            name: Algorithmic discovery
            example: Instagram Reels
          - id: custom-feeds
            name: Custom feeds
            description: User- or third-party-defined feed algorithms
            example: Bluesky custom feeds
          - id: lists
            name: Lists
            description: Hand-curated account sets
            example: X Lists
          - id: all-posts
            name: All posts
            description: Every submission on the platform, with no follow, topic or algorithmic selection
            example: Hacker News — Front page
          - id: global-pool
            name: Global pool
            description: Everything submitted to the site, identical for every visitor — no follows, no topic
              selection and no personalisation (Hacker News, a federated public timeline)
            example: Hacker News — Front page
  - name: Arrangement
    family: layout
    question: How is the stream laid out?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: single-column
            name: Single column
            example: X
          - id: multi-column
            name: Multi-column
            description: Several feeds side by side
            example: TweetDeck / X Pro
          - id: masonry-grid
            name: Masonry grid
            description: Variable-height tiles
            example: Pinterest
          - id: vertical-pager
            name: Vertical pager
            description: Snap one item per swipe
            example: TikTok, YouTube Shorts
  - name: Loading and position
    family: lifecycle
    question: How does new content arrive, and does the feed remember where you were?
    subdimensions:
      - id: loading
        name: Loading
        select: many
        values:
          - id: infinite-scroll
            name: Infinite scroll
            example: Instagram
          - id: new-posts-pill
            name: New-posts pill
            description: New items wait behind a button
            example: X “Show new posts”
          - id: pull-to-refresh
            name: Pull to refresh
            example: Mobile social apps
          - id: paged
            name: Paged
            description: An explicit next page
            example: Hacker News More
          - id: live-insertion
            name: Live insertion
            description: New items push into the stream as they arrive, moving the content under you, instead of
              waiting behind a pill or a refresh gesture
            example: Mastodon — Home timeline
      - id: position
        name: End and position
        select: one
        values:
          - id: endless
            name: Endless
            description: No end state
            example: TikTok
          - id: caught-up-marker
            name: Caught-up marker
            description: An explicit end of new items
            example: Instagram “You’re all caught up”
          - id: resume-position
            name: Resume position
            description: Returns to where you left off
            example: Feed readers that keep an unread position
  - name: Nesting
    family: composition
    question: Do posts contain other posts?
    subdimensions:
      - id: nesting
        name: Nesting
        select: many
        values:
          - id: flat
            name: Flat
            example: Pinterest
          - id: expandable-threads
            name: Expandable threads
            description: Replies open under a post
            example: Reddit comments
          - id: embedded-reposts
            name: Embedded reposts
            description: A post inside a post
            example: X quote posts
          - id: carousel-inside-post
            name: Carousel inside post
            description: Several media in one post
            example: Instagram carousel posts
          - id: clustered-stories
            name: Clustered stories
            description: Several posts about one story grouped as a single unit under a lead item
            example: Google News — For you
          - id: clustered-coverage
            name: Clustered coverage
            description: One unit holds several independent posts about the same subject from different sources
              — a lead story with related coverage under it — which is neither a reply thread nor a
              repost of one post inside another
            example: Apple News — Today
wild:
  score: 2
  note: Source and ordering choices are increasingly exposed; representation and density almost never
    are.
  examples:
    - name: Bluesky
      note: Pin and switch between custom feeds
    - name: Reddit
      note: Sort by Best, Hot, New, Top, Rising
    - name: TweetDeck / X Pro
      note: Compose columns from searches and lists
    - name: Instagram
      note: Following and Favorites feed options
techniques:
  - name: Feed recipes
    dimension: Ordering and sources
    how: The ranking policy becomes an editable recipe — sources × filters × weights — that can be read,
      tuned, saved as a column and shared, just as Meridian made an ODI exchangeable.
    ai: false
  - name: Density dial
    dimension: Post content
    how: "Semantic zoom over posts: pinch from headline to card to full post, choosing which attributes
      survive each level."
    ai: false
  - name: Mute by attribute
    dimension: Post content
    how: Surface hidden attributes (is a repost, has a link, is sponsored) and filter by them, making
      every attribute a lever.
    ai: false
  - name: Because-you-said
    dimension: Ordering and sources
    how: “Show me less of this, because it’s rage bait” becomes an explicit, inspectable constraint in
      the recipe rather than an opaque signal.
    ai: true
signature: Feed recipes
sample: Top 20 apps in Social Networking, News and Entertainment charts on both app stores, plus
  their web versions.
unit: One feed surface (home, following, a topic feed) within one app.
