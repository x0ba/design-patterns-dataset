# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "comparison-table". Edit between batches only — see README "Rules".
id: comparison-table
name: Comparison table
level: pattern
parent: browse-collections
aliases:
  - compare view
  - spec comparison
  - side-by-side comparison
definition: A few selected items side by side against shared attributes, so that differences can be
  read and a choice made.
data: collection
platforms:
  - web
  - mobile
domains:
  - commerce
  - finance
  - travel
  - software
anatomy:
  - name: Item columns
    role: The items being compared
  - name: Attribute rows
    role: The criteria
  - name: Difference cues
    role: What stands out
  - name: Add and remove
    role: Changing the set
roles:
  - title
  - thumbnail
  - price
  - spec
  - rating
dimensions:
  - name: Criteria
    family: content
    question: Which attributes become rows, and how are values shown?
    subdimensions:
      - id: criteria
        name: Attribute selection
        select: one
        values:
          - id: fixed-spec-rows
            name: Fixed spec rows
            description: The vendor chooses
            example: Apple Compare iPhone models
          - id: all-attributes
            name: All attributes
            description: Everything in the data
            example: Spec-sheet comparisons
          - id: user-built-criteria
            name: User-built criteria
            description: The person adds rows as they learn
            example: Mesh (UIST '20)
      - id: valueForm
        name: Value form
        select: many
        values:
          - id: raw-values
            name: Raw values
            example: Spec sheets
          - id: normalized-ratings
            name: Normalized ratings
            example: Review-site scores
          - id: bars
            name: Bars
            description: Magnitude drawn in the cell
            example: Benchmark comparisons
          - id: checkmarks
            name: Checkmarks
            description: Presence or absence
            example: SaaS pricing pages
  - name: Item set
    family: composition
    question: Where do the compared items come from?
    subdimensions:
      - id: origin
        name: Origin of items
        select: one
        values:
          - id: curated-by-the-vendor
            name: Curated by the vendor
            example: Apple
          - id: added-from-the-overview
            name: Added from the overview
            description: Compare checkboxes in results
            example: Retail listing compare boxes
          - id: suggested-alternatives
            name: Suggested alternatives
            description: The system picks rivals
            example: Amazon compare with similar items
          - id: picked-on-the-compare-page
            name: Picked on the compare page
            description: The person chooses the items from a search box or dropdown on the comparison itself,
              over a third-party catalogue (not the vendor's own models, not result checkboxes)
            example: NerdWallet — Compare credit cards beside each other
          - id: gathered-while-browsing
            name: Gathered while browsing
            description: The person collects the items from wherever they were found — separate product pages
              across sites, clipped as they browse — rather than from one vendor's list, one results
              page's checkboxes, or a system suggestion
            example: Mesh (UIST '20) — Comparison table built from browsing
  - name: Orientation
    family: layout
    question: Which way do items and criteria run?
    subdimensions:
      - id: orientation
        name: Orientation
        select: one
        values:
          - id: items-as-columns
            name: Items as columns
            example: Apple
          - id: items-as-rows
            name: Items as rows
            example: Flight fare tables
          - id: cards-with-synchronized-scroll
            name: Cards with synchronized scroll
            example: Mobile comparisons
      - id: sticky
        name: Sticky parts
        select: many
        values:
          - id: item-headers
            name: Item headers
            example: Apple
          - id: criteria-labels
            name: Criteria labels
            example: Wide comparisons
  - name: Difference emphasis
    family: feedback
    question: How are differences made to stand out?
    subdimensions:
      - id: emphasis
        name: Emphasis
        select: one
        values:
          - id: none
            name: None
            example: Plain spec tables
          - id: highlight-differences
            name: Highlight differences
            example: Retail compare pages
          - id: highlight-the-best-value
            name: Highlight the best value
            example: Benchmark tables
          - id: hide-identical-rows
            name: Hide identical rows
            example: Differences-only toggles
  - name: Decision support
    family: scope
    question: Does the table help conclude, not only compare?
    subdimensions:
      - id: decision
        name: Decision support
        select: many
        values:
          - id: none
            name: None
            example: Most comparisons
          - id: weighted-scoring
            name: Weighted scoring
            description: Criteria carry weights
            example: Decision-matrix tools
          - id: notes-per-cell
            name: Notes per cell
            example: Mesh
          - id: pick-a-winner
            name: Pick a winner
            example: Shortlists
wild:
  score: 1
  note: Choosing the items is common; choosing the criteria, or weighting them, is rare outside
    research systems.
  examples:
    - name: Amazon
      note: Compare with similar items
    - name: Mesh (UIST '20)
      note: Users build comparison criteria while researching
techniques:
  - name: Criteria weaving
    dimension: Criteria
    how: Drag an attribute from any item’s detail into the table to add a row; weight rows by dragging
      them up; collapse identical rows.
    ai: false
  - name: Fill the gaps
    dimension: Criteria
    how: When an item lacks a row’s value, a model searches its data and fills it with provenance, or
      answers Not Specified (CHI '25 consistent values).
    ai: true
  - name: Ask which is better for…
    dimension: Decision support
    how: “Which is better for a small apartment?” adds the criteria the answer depends on, weighted and
      editable, instead of a bare verdict.
    ai: true
signature: Criteria weaving
sample: Retail compare features, SaaS pricing pages, insurance and finance comparison sites, plus
  research systems for decision-making.
unit: One comparison of two or more items.
relations:
  uses:
    - bulk-actions
    - badge
    - tooltip
  specializes:
    - data-table
  neighbors:
    - plan-picker
scores:
  ubiquity: 3
  potential: 5
  spec: 4
evidence: agent-coded
usage:
  - Criteria emerge during comparison, not before it (Mesh)
questions:
  - When should a comparison table conclude, and when should it stay neutral?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.5930090933274
  agreementFirstPass: 0.7535714285714286
  kappaFinal: 0.9343555647286047
  agreementFinal: 0.9535714285714286
