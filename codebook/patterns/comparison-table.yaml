  unobserved:
    - sub: sticky
      var: Criteria labels
    - sub: emphasis
      var: Highlight differences
    - sub: decision
      var: Weighted scoring
  unresolved: []
  proposals:
    raised: 3
    adopted:
      - sub: origin
        name: Picked on the compare page
        raters:
          - fable
          - opus
      - sub: origin
        name: Gathered while browsing
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:origin
        sub: origin
        dim: null
        name: Direct selection
        gloss: The person builds the comparison by choosing items directly in a dedicated compare tool (e.g.
          entering two model names), not by checking boxes in a browsed results overview
        raters:
          - sonnet
        instances:
          - 11
          - 16
          - 17
        status: raised
  raterNotes:
    fable:
      - Sticky parts is hard to recall from product knowledge for less-visited pages (coded ? on
        four). Origin needed a variation for third-party compare tools with on-page pickers.
      - Fixed spec rows versus All attributes is thin because the vendor chose the data fields too;
        the useful line is hand-curated rows versus the whole schema. Origin's Added from the
        overview names a mechanism (checkboxes) where the dimension is about who picks, so pickers
        on the compare page fall outside it; sonnet's +Direct selection and my +Picked on the
        compare page are one variation. A recommended-plan badge is not any emphasis value.
        decision's explicit None makes [] and ['None'] a false disagreement.
    opus:
      - "decision is ['None'] for 19 of 20: outside research prototypes, shipping comparisons
        compare and stop. emphasis was the hardest sub to apply — the differences control is a small
        toggle I could not recall for several retail sites, and it is ambiguous whether such a
        toggle hides identical rows or highlights differing ones. sticky is unobservable without the
        page in front of you for short tables; I coded [] where the table fits on one screen. A
        vendor's 'Most popular' plan badge is not Pick a winner, which I read as the person
        concluding."
      - "The big one: `criteria` reads two ways. 'Fixed spec rows — the vendor chooses' is true of
        every retail table in a trivial sense (someone defined the schema), so the other two raters
        coded every spec sheet Fixed and left All attributes with no instances; the useful line is
        curated shortlist (Apple) versus the whole record rendered (Best Buy, Dell, versus.com), and
        the gloss should say so. `origin` is really two questions — who assembles the set, and out
        of what catalogue — which is why two of us independently proposed a variation for 'you pick
        the items on the comparison tool itself'. `decision`, like `aggregate` elsewhere, is pick
        any with a None variation, so ['None'] and [] are one code written two ways; and 'Pick a
        winner' is named as if the person picks, with no room for a site that declares the winner.
        Finally `emphasis` has no variation for the badged recommended column that every SaaS
        pricing table ships, which is what pushed sonnet to read those as Highlight the best value."
    sonnet:
      - Emphasis is coded '?' rather than guessed where I could not recall a specific product's
        visual-differentiation behaviour with confidence.
      - Three codebook problems stood out most. (1) Decision's explicit None versus an empty list
        caused most of this entry's disagreements (19 of 62 cells) even where all three raters
        agreed nothing was there — a representation issue, not a coding one. (2) Origin has no value
        for a dedicated single-purpose compare tool (RTINGS, versus.com, NerdWallet) where items are
        picked directly rather than checked from a browsed listing; two raters independently
        invented near-identical variations for it across three instances, which confirms the gap.
        (3) Emphasis's Highlight the best value doesn't distinguish a vendor's marketing/upsell
        badge (a SaaS 'Recommended plan') from a genuinely computed value comparison (a benchmark's
        fastest result or a rate table's lowest APR) — I conflated the two across five pricing-page
        instances before this round.
  codedAt: 2026-09-22
