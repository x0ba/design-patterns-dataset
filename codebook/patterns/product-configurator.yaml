  raterNotes:
    fable:
      - "Commit as pick-one conflates price feedback with the purchase action; I coded the terminal
        action where one exists and Live price update only where there is no cart (Tesla kept as the
        codebook's example). Preview: I code Tesla as 2D composites from product knowledge, against
        the codebook's example."
      - "commit conflates live price feedback with the terminal action — nearly every priced
        configurator holds Live price update plus one of Add to cart or Save configuration, so the
        sub wants pick any. Discrete variants and Materials and finishes overlap on colour (Nike
        colours vs Tesla paint). order's Any-order panel and Start from a base model co-occur in
        every car and laptop configurator. preview's exemplars are misassigned: Tesla shows
        pre-rendered angles, not a manipulable 3D model."
    opus:
      - "The codebook covered this sample without gaps, which is unsurprising since Tesla and Nike
        By You are both exemplars and archetypes of the form. commit is the sub that fights the
        sample: nearly every configurator does several of these at once (live price, save, add to
        cart), and I coded the flow's terminal act, taking Live price update only where the price is
        the running feedback and the purchase is a later step. preview's 2D composite versus
        Realtime 3D is the call most likely to split raters, because several customizers have
        quietly moved from composited flats to rotatable renders (Nike, Xbox). order's Start from a
        base model and Start from a template are nearly the same act — the difference is whether the
        starting point is a product SKU or a designed layout — and I used the template only where
        the starting artefact is itself a design."
      - "Two sub-dimensions carry most of the disagreement because each asks two questions at once:
        `order` mixes where a build starts with what sequence is imposed (a Dell page is both a base
        model and a free panel), and `commit` mixes how price behaves with what act ends the flow
        (live price and add-to-cart are both true of nearly every commerce configurator) — both
        should be pick any. The codebook also contradicts itself on Tesla, naming it under Any-order
        panel while glossing Start-from-a-base-model as 'car trim then options', and its preview
        scale has no slot for the pre-rendered 360 spin set that most car and sneaker configurators
        actually ship."
    sonnet:
      - commit and collaboration sometimes both plausibly apply (e.g. a save code that is also
        shareable); coded to the single most distinctively-described action per instance since both
        subs are pick-one.
      - "Two patterns of miss on my part, not codebook problems: (1) I under-coded `options` as
        pick-one-ish by naming only the most salient variant type per product and missing genuine
        secondary axes (add-on packages, finish choices) that were plainly present once named — a
        pick-any sub-dimension wants the fuller list. (2) For `order`, I initially treated Dell's
        and Lenovo's section-revealed flow as generic Progressive disclosure while defaulting other,
        similarly-structured build flows to Any-order or Start-from-a-base-model somewhat
        inconsistently; the codebook's own Dell exemplar for Progressive disclosure is worth
        restating in the gloss so raters apply it to look-alike laptop configurators (Lenovo) rather
        than defaulting to Start-from-a-base-model."
  codedAt: 2026-09-22
