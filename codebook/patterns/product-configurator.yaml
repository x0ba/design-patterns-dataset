# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "product-configurator". Edit between batches only — see README "Rules".
id: product-configurator
name: Product configurator
level: pattern
parent: configure
aliases:
  - CPQ configurator
  - customizer
  - build and price
definition: Choosing options that compose a specific product instance — often with live preview,
  constraints and price — before purchase or build.
data: object
platforms:
  - web
  - mobile
  - desktop
  - xr
domains:
  - commerce
  - mobility
  - home
  - design
  - enterprise
anatomy:
  - name: Option groups
    role: Categories of choices
  - name: Preview
    role: Visual or summary of the instance
  - name: Constraints
    role: What combinations are allowed
  - name: Price and summary
    role: Cost and selected bill of materials
roles:
  - option
  - variant
  - price
  - swatch
  - preview
dimensions:
  - name: Option model
    family: content
    question: What kinds of choices make up the product?
    subdimensions:
      - id: options
        name: Options
        select: many
        values:
          - id: discrete-variants
            name: Discrete variants
            description: Colour, size, trim
            example: Nike By You colours
          - id: additive-modules
            name: Additive modules
            description: Add or remove parts
            example: PC part pickers
          - id: continuous-parameters
            name: Continuous parameters
            description: Dimensions or fits
            example: Made-to-measure
          - id: materials-and-finishes
            name: Materials and finishes
            example: Tesla paint and wheels
          - id: personalization-marks
            name: Personalization marks
            description: Text, monogram, image
            example: Nike By You text
  - name: Preview
    family: feedback
    question: How is the configured instance shown?
    subdimensions:
      - id: preview
        name: Preview
        select: one
        values:
          - id: static-swatches-only
            name: Static swatches only
            example: Simple apparel pickers
          - id: 2d-composite-image
            name: 2D composite image
            example: Many sneaker customizers
          - id: realtime-3d
            name: Realtime 3D
            example: Tesla configurator
          - id: ar-on-body-or-room
            name: AR on body or room
            example: IKEA Place
          - id: summary-list-without-visual
            name: Summary list without visual
            example: Insurance quote builders
  - name: Constraints and guidance
    family: flow
    question: How are illegal or poor combinations handled?
    subdimensions:
      - id: constraints
        name: Constraints
        select: many
        values:
          - id: free-combination
            name: Free combination
            example: Some print-on-demand
          - id: disable-incompatible-options
            name: Disable incompatible options
            example: Tesla option dependencies
          - id: auto-resolve-conflicts
            name: Auto-resolve conflicts
            example: CPQ rule engines
          - id: warn-but-allow
            name: Warn but allow
            example: Advanced PC builds
          - id: guided-recommendations
            name: Guided recommendations
            example: Good-better-best bundles
  - name: Decision order
    family: composition
    question: In what order are choices presented?
    subdimensions:
      - id: order
        name: Order
        select: one
        values:
          - id: any-order-panel
            name: Any-order panel
            example: Tesla sidebar options
          - id: stepped-wizard
            name: Stepped wizard
            example: Many build-and-price flows
          - id: progressive-disclosure
            name: Progressive disclosure
            description: Advanced options later
            example: Dell commercial configs
          - id: start-from-a-base-model
            name: Start from a base model
            example: Car trim then options
          - id: start-from-a-template
            name: Start from a template
            example: Nike By You presets
  - name: Price and commit
    family: lifecycle
    question: How do cost and purchase enter the flow?
    subdimensions:
      - id: commit
        name: Commit
        select: one
        values:
          - id: live-price-update
            name: Live price update
            example: Tesla total
          - id: price-after-quote
            name: Price after quote
            example: B2B CPQ
          - id: save-configuration
            name: Save configuration
            example: Shareable Tesla link
          - id: add-to-cart
            name: Add to cart
            example: Nike By You
          - id: order-to-manufacture
            name: Order to manufacture
            example: Custom furniture
  - name: Collaboration on a build
    family: collaboration
    question: Can more than one person shape the configuration?
    subdimensions:
      - id: collaboration
        name: Collaboration
        select: one
        values:
          - id: solo
            name: Solo
            example: Most DTC customizers
          - id: shareable-link
            name: Shareable link
            example: Tesla design share
          - id: sales-assisted
            name: Sales-assisted
            example: Rep configures with customer
          - id: team-approval
            name: Team approval
            example: Enterprise procurement
          - id: community-gallery-remix
            name: Community gallery remix
            example: Nike By You inspiration
wild:
  score: 1
  note: Preview angle and unit system sometimes exist; the option tree and constraint logic are almost
    never end-user editable.
  examples:
    - name: Tesla
      note: 3D view, shareable configuration
    - name: Nike By You
      note: Colourways and text
    - name: IKEA
      note: Planning tools with constraints
techniques:
  - name: Constraint explanations
    dimension: Constraints and guidance
    how: When an option greys out, show the rule in plain language and the choices that would unlock it.
    ai: false
  - name: Configure by goal
    dimension: Option model
    how: “Family road trips, max range” proposes a package; every selected option remains editable with
      sources.
    ai: true
  - name: Diff two builds
    dimension: Preview
    how: Compare two saved configurations side by side on options, price and preview, like comparing
      collection items.
    ai: false
signature: Constraint explanations
sample: Tesla, Nike By You, Dell/Apple build-to-order, IKEA planners and CPQ demos.
unit: One configuration session producing one product instance.
relations:
  uses:
    - choice-control
    - slider
    - color-picker
    - stepper
    - stat-tile
  specializes:
    - configure
  neighbors:
