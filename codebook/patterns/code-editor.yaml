# Codebook entry "code-editor". Edit between batches only — see README "Rules".
id: code-editor
name: Code editor
level: pattern
parent: create
aliases:
  - IDE
  - text editor
  - development environment
definition: Reading and writing source code with structure-aware tools around the text.
data: document
platforms:
  - desktop
  - web
domains:
  - software
  - science
  - ai
anatomy:
  - name: Editor
    role: The source
  - name: Gutter
    role: Line information
  - name: Explorer
    role: Files and symbols
  - name: Panels
    role: Terminal, problems, output
  - name: Status bar
    role: State of the workspace
roles: []
dimensions:
  - name: Code representation
    family: content
    question: What is shown alongside the text?
    subdimensions:
      - id: representation
        name: Representation
        select: many
        values:
          - id: syntax-colouring
            name: Syntax colouring
            example: All
          - id: inline-diagnostics
            name: Inline diagnostics
            example: Squiggles
          - id: inlay-hints
            name: Inlay hints
            example: VS Code inlay hints
          - id: reference-lenses
            name: Reference lenses
            example: VS Code CodeLens
          - id: folding
            name: Folding
            example: All
          - id: projections
            name: Projections
            description: Alternative views that edit the same code
            example: Lorgnette (UIST '23)
  - name: Workspace layout
    family: layout
    question: How is the workspace arranged?
    subdimensions:
      - id: layout
        name: Layout
        select: many
        values:
          - id: single-editor
            name: Single editor
            example: Minimal editors
          - id: split-editor-groups
            name: Split editor groups
            example: VS Code
          - id: panels
            name: Panels
            example: Terminal and problems
          - id: zen-mode
            name: Zen mode
            example: VS Code Zen mode
          - id: minimap
            name: Minimap
            example: VS Code
  - name: Commands
    family: invocation
    question: How are actions invoked?
    subdimensions:
      - id: commands
        name: Commands
        select: many
        values:
          - id: menus
            name: Menus
            example: All
          - id: command-palette
            name: Command palette
            example: VS Code
          - id: keybindings
            name: Keybindings
            example: All
          - id: modal-editing
            name: Modal editing
            example: Vim, VS Code Vim extension
          - id: hover-actions
            name: Hover actions
            example: Quick fixes
  - name: Assistance
    family: initiative
    question: How much does the editor write?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Plain editors
          - id: completion-lists
            name: Completion lists
            example: IntelliSense
          - id: ghost-text-completion
            name: Ghost-text completion
            example: GitHub Copilot
          - id: chat-panel
            name: Chat panel
            example: Copilot Chat
          - id: agent-edits-across-files
            name: Agent edits across files
            example: Cursor agent, Copilot agent mode
  - name: Change review
    family: feedback
    question: How are changes reviewed?
    subdimensions:
      - id: review
        name: Review
        select: one
        values:
          - id: save-only
            name: Save only
            example: Plain editors
          - id: diff-in-the-gutter
            name: Diff in the gutter
            example: VS Code git gutter
          - id: accept-or-reject-hunks
            name: Accept or reject hunks
            example: Cursor
          - id: pull-request-review
            name: Pull request review
            example: GitHub
  - name: Collaboration
    family: collaboration
    question: How do people code together?
    subdimensions:
      - id: collab
        name: Collaboration
        select: one
        values:
          - id: solo
            name: Solo
            example: Local editors
          - id: live-shared-session
            name: Live shared session
            example: VS Code Live Share
          - id: review-comments
            name: Review comments
            example: GitHub
  - name: Customization depth
    family: adaptation
    question: How far can the editor be changed?
    subdimensions:
      - id: depth
        name: Depth
        select: one
        values:
          - id: themes
            name: Themes
            example: Simple editors
          - id: settings-and-keybindings
            name: Settings and keybindings
            example: Sublime Text
          - id: extensions
            name: Extensions
            example: VS Code marketplace
          - id: programmable-environment
            name: Programmable environment
            example: Emacs
