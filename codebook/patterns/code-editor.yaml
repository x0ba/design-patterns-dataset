  raterNotes:
    fable:
      - Change review's Diff in the gutter is hard to recall for browser editors (three ?); Depth's
        Extensions vs Settings depends on whether an editor-extension marketplace exists, which is
        fuzzy for notebooks and cloud IDEs.
      - collab is pick-one but the codebook's own example (VS Code Live Share) is an add-on, so the
        sub-dimension must mean capability rather than default mode; it should say so, or become
        pick any with Solo dropped. review's Diff in the gutter conflates where a diff shows with
        reviewing a diff at all (Magit); browser editors without gutter marks all fall to Save only.
        Zen mode and command palette availability in smaller editors (Zed, Arduino IDE 2) are hard
        to recall reliably.
    opus:
      - Assistance and representation were easy; review and depth were not. Review conflates a
        version-control display with a model-change gate, so an autosaving web editor with a
        separate git pane (Replit, RStudio) has to read as Save only. Projections finally earned its
        keep on the IDEs with visual designers (Xcode, Android Studio, Visual Studio), which is
        worth keeping in the codebook.
      - "Most of this entry's disagreement was a pick any coded short rather than a conflict, so the
        packet reads as one rater listing fewer true items. Two glosses caused real trouble: Panels
        is glossed by function (terminal and problems) but read by chrome, which is what split
        Neovim and Emacs; and Change review conflates review inside the editor with an external git
        client, so Magit and RStudio's git pane have to be called Save only while Sublime's gutter
        marks count. Customization depth also has no way to say that a product retired its extension
        system, and collab has no way to say 'bundled' versus 'a marketplace install', which is the
        only thing separating Code With Me from Live Share."
    sonnet:
      - Collab defaulted to Solo whenever the sampled screen didn't specifically show a
        shared/live-editing feature, even for products (Colab, Replit, Zed) where I know real-time
        collaboration exists as a named capability, which I did credit.
      - "I under-coded almost every pick-any sub-dimension in this entry on the first pass —
        representation, layout, commands and assistance are all 'pick any that apply' lists, and I
        consistently picked only the single most salient item per product instead of checking the
        whole variation list against what I actually know of each tool; fable and opus's near-total
        agreement with each other across this entry reflects thoroughness, not a codebook problem.
        The one real codebook-adjacent finding: review's four values (Save only / Diff in the gutter
        / Accept or reject hunks / Pull request review) have no value for 'agent changes reviewed in
        a chat thread with checkpoint rollback' (Replit), which is neither a gutter diff nor a
        hunk-level accept/reject bar — I coded it Save only for lack of a closer fit, but a future
        round might want a value for chat-mediated review."
