techniques:
  - name: Projections
    dimension: Code representation
    how: Show a piece of code as a table, a form or a diagram that edits the same source (Lorgnette,
      UIST '23, cited by Meridian).
    ai: false
  - name: Settings as a shareable spec
    dimension: Customization depth
    how: A workspace’s layout, keybindings and extensions export as one file others can apply.
    ai: false
  - name: Explain this change
    dimension: Change review
    how: Every AI edit arrives as hunks with a rationale per hunk to accept or reject.
    ai: true
