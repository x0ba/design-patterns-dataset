# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "dashboard". Edit between batches only — see README "Rules".
id: dashboard
name: Dashboard
level: pattern
parent: monitor
aliases:
  - KPI board
  - control panel
  - overview dashboard
definition: Several metrics and states on one view, arranged to be scanned at a glance and drilled into.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - enterprise
  - software
  - finance
  - health
  - education
anatomy:
  - name: Widgets
    role: Tiles, charts and tables
  - name: Grid
    role: Their arrangement
  - name: Global controls
    role: Time range and filters
  - name: Drill-down
    role: The detail behind a widget
roles:
  - metric
  - trend
  - target
  - label
dimensions:
  - name: Widgets and purpose
    family: content
    question: What goes on the dashboard, and what is it for?
    subdimensions:
      - id: widgets
        name: Widget types
        select: many
        values:
          - id: kpi-tiles
            name: KPI tiles
            example: Stripe dashboard home
          - id: time-series-charts
            name: Time-series charts
            example: Grafana
          - id: tables
            name: Tables
            example: Looker
          - id: maps
            name: Maps
            example: Fleet dashboards
          - id: status-lists
            name: Status lists
            example: Service health
          - id: narrative-text
            name: Narrative text
            example: Magazine-style reports
          - id: categorical-charts
            name: Categorical charts
            description: Bar, column, pie or scatter comparing categories rather than time — the commonest BI
              widget after the KPI tile, and the list jumps from time-series straight to tables
            example: Tableau — Superstore sample dashboard
          - id: control-widgets
            name: Control widgets
            description: Widgets that act on the thing being monitored — a switch, slider, scene button or
              camera with a talk control — rather than only reporting it; smart-home and admin
              dashboards are built from these
            example: Home Assistant — Overview
          - id: categorical-chart
            name: Categorical chart
            description: A bar/column chart encoding a categorical dimension rather than a time series (e.g.,
              sales by category, top pages) — the codebook's Time-series charts doesn't cover
              non-temporal charts
            example: Tableau — Superstore sample dashboard
      - id: purpose
        name: Purpose
        select: one
        note: After Sarikaya et al. 2019, cited by CHI '25.
        values:
          - id: strategic-decisions
            name: Strategic decisions
            example: Executive dashboards
          - id: operational-decisions
            name: Operational decisions
            example: Operations centres
          - id: organizational-awareness
            name: Organizational awareness
            example: Team metrics screens
          - id: motivation-and-learning
            name: Motivation and learning
            example: Fitness apps’ today view
  - name: Arrangement
    family: layout
    question: How are widgets placed, and how many?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: fixed-grid
            name: Fixed grid
            example: Grafana panels
          - id: free-form-canvas
            name: Free-form canvas
            example: Tableau floating objects
          - id: single-scrolling-column
            name: Single scrolling column
            example: Mobile dashboards
          - id: story-layout
            name: Story layout
            example: Report-style dashboards
      - id: density
        name: Density
        select: one
        values:
          - id: a-few-glanceable-tiles
            name: A few glanceable tiles
            example: Apple Health summary
          - id: dense-wall
            name: Dense wall
            example: Network operations screens
          - id: adaptive
            name: Adaptive
            example: Responsive dashboards
  - name: Linking
    family: composition
    question: How do widgets affect each other?
    subdimensions:
      - id: linking
        name: Linking
        select: one
        values:
          - id: independent
            name: Independent
            example: Simple dashboards
          - id: global-filters
            name: Global filters
            example: Grafana variables
          - id: cross-filtering
            name: Cross-filtering
            description: Clicking a mark filters the rest
            example: Power BI cross-filtering
          - id: drill-through
            name: Drill-through
            example: Power BI drillthrough
  - name: Refresh
    family: lifecycle
    question: How current is it?
    subdimensions:
      - id: refresh
        name: Refresh
        select: one
        values:
          - id: static-snapshot
            name: Static snapshot
            example: Exported reports
          - id: periodic-refresh
            name: Periodic refresh
            example: Grafana auto-refresh
          - id: live-stream
            name: Live stream
            example: Trading dashboards
          - id: on-visit
            name: On visit
            description: Current data is fetched when the page is opened and then sits still until it is
              reloaded — neither a frozen exported snapshot nor an auto-refreshing or streaming
              view; the default for consumer and SaaS web dashboards
            example: Google Analytics 4 — Reports snapshot
  - name: Alerting
    family: feedback
    question: How does it call attention to change?
    subdimensions:
      - id: alerting
        name: Alerting
        select: one
        values:
          - id: none
            name: None
            example: Reports
          - id: threshold-colours
            name: Threshold colours
            example: Conditional tiles
          - id: alerts-on-panels
            name: Alerts on panels
            example: Grafana alerting
          - id: event-annotations-on-charts
            name: Event annotations on charts
            example: Grafana annotations
  - name: Ownership
    family: collaboration
    question: Whose dashboard is it?
    subdimensions:
      - id: ownership
        name: Ownership
        select: one
        values:
          - id: personal
            name: Personal
            example: My dashboards
          - id: shared-read-only
            name: Shared read-only
            example: Executive views
          - id: team-editable
            name: Team-editable
            example: Datadog team dashboards
          - id: forkable-copies
            name: Forkable copies
            example: Grafana save as copy
wild:
  score: 2
  note: Analytics and monitoring tools let people edit panels; most product dashboards are fixed.
  examples:
    - name: Grafana
      note: Edit panels, variables and layout
    - name: Datadog
      note: Custom dashboards
techniques:
  - name: Tile surfacing
    dimension: Widgets and purpose
    how: "Pull any metric from a drill-down page up onto the dashboard as a tile: Fluid Attributes from
      detail to overview."
    ai: false
  - name: Dashboard from a question
    dimension: Widgets and purpose
    how: “How is onboarding going?” proposes widgets with the queries shown, to keep or discard.
    ai: true
  - name: Arrange by glance frequency
    dimension: Arrangement
    how: Tiles a person looks at most drift to where the eye lands first, with the move proposed rather
      than imposed.
    ai: false
signature: Tile surfacing
