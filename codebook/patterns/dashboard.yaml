  raterNotes:
    fable:
      - Purpose applied by product family (analytics/BI → Strategic, monitoring/OS → Operational,
        personal health/finance → Motivation and learning); Density's Adaptive overlaps the other
        two, used for responsive card grids that reflow.
      - purpose is read from the viewer, not the screen, and the codebook dropped Sarikaya's
        Tactical genre, which is where analytics products fall. density's Adaptive is a layout
        property, not a density, and the scale has no middle between a few tiles and a wall. linking
        asks how widgets affect each other, but the entry's Drill-down component has no
        sub-dimension, so tap-for-detail has nowhere to go. refresh's Static snapshot means a frozen
        export and most web dashboards load on visit. ownership is a role on the folder, not a
        property of the dashboard.
    opus:
      - "Refresh needed a fourth variation (see +On visit): most web dashboards are neither exports
        nor auto-refreshing. Purpose follows Sarikaya, which has no slot for personal decision
        support, so finance apps (Monarch, Robinhood, Coinbase) land in Motivation and learning by
        elimination; density conflates widget count with information density, which misfits
        single-table tools like Activity Monitor; I read Drill-through as any widget that opens a
        detail view of its own subject, and reserved Independent for dashboards where widgets
        neither filter each other nor lead anywhere."
      - "Purpose is the worst cell here: the codebook keeps Sarikaya's strategic and operational
        poles but drops the tactical middle, so the analytics home of the person who runs a site
        (GA4, Vercel, Search Console, YouTube Studio) has nowhere honest to sit and the three of us
        spread across all four values. Density has the same missing middle — nothing between Apple
        Health's few tiles and a network operations wall — and Adaptive, read as 'responsive', would
        swallow every web dashboard. Linking was my error: its question is how widgets affect each
        other, and I had been coding plain tap-to-detail navigation as Drill-through."
    sonnet:
      - Alerting was mostly None for consumer/business dashboards; the two infra dashboards
        (Grafana, Datadog) coded as Threshold colours since the sampled panels weren't shown
        actively firing alerts.
      - "Drill-through vs. ordinary tap-to-detail is under-specified: the gloss's own exemplar
        (Power BI drillthrough) is a destination page that inherits another visual's filter context,
        but a tile that just opens its own metric's history page (Health, Fitbit, Garmin, Robinhood,
        Coinbase, Task Manager) does neither that nor truly 'affect' another widget — I held
        Independent throughout rather than call plain navigation a form of linking. On visit and
        Categorical charts (and Control widgets) are real, repeated gaps in Refresh and Widget
        types, not one-off misreads; adopting opus's proposals for all three."
