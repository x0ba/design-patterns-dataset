    raised: 1
    adopted:
      - sub: canvasMode
        name: Guided path
        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - canvasMode is pick-one but FigJam, Miro, Mural and Lucidspark serve both authoring and
        facilitation; I coded by what the sample's screen description emphasises. lod is
        unobservable from memory for the smaller note-canvas tools (Heptabase).
    opus:
      - "lod is hard to observe honestly: Constant detail versus Thumbnailify when small depends on
        a rendering threshold most people never notice, and I coded it from how each product behaves
        on a crowded board rather than from anything stated. canvasStructure also forced a single
        answer where two are true — Miro and FigJam both have frames and free placement — so I coded
        the structure the product enforces rather than the one it offers."
    sonnet:
      - canvasMode split on whether meeting/workshop tools (MS Whiteboard, Zoom Whiteboard) count as
        Facilitation just for being used live in a meeting; coded Authoring for those two since no
        explicit facilitator feature (timer, voting, spotlight) was named in the sample, unlike
        FigJam/Conceptboard/Lucidspark/Canva/Mural where one was.
      - "Two pick-one sub-dimensions are mis-specified. canvasStructure should be pick any: a FigJam
        or Miro board is free placement, frames-as-regions and a connector graph simultaneously, and
        forcing one answer is what split us on FigJam. canvasMode describes a session rather than a
        screen — the same Miro board is authoring on Tuesday and facilitation on Wednesday, and
        Microsoft Whiteboard and Zoom Whiteboard split three ways purely on whether 'it lives in a
        meeting' counts — so it needs either a rule that only in-canvas apparatus (timers, voting)
        makes it facilitation, or to become pick any; opus's +Guided path is a genuine fifth mode
        for Prezi either way. Two smaller ones: canvasNav names desktop input devices (hand tool,
        middle-drag, scroll wheel), so touch-first canvases like Freeform and Muse have no literal
        match and every rater read them generously in a different place; and the Semantic zoom
        variation cites Muse for behaviour that only ever appeared in demos, while the shipped
        product is Frame as portal."
