# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "zoomable-canvas". Edit between batches only — see README "Rules".
id: zoomable-canvas
name: Zoomable canvas
level: pattern
parent: explore-space
aliases:
  - infinite canvas
  - spatial board
  - zoomable UI
  - whiteboard canvas
definition: An unbounded 2D plane of free-placed objects that is navigated by pan and zoom, used to
  organize, present or explore spatial arrangements of content.
data: space
platforms:
  - web
  - desktop
  - mobile
domains:
  - design
  - productivity
  - education
  - enterprise
  - ai
anatomy:
  - name: Canvas
    role: The infinite plane
  - name: Objects
    role: Cards, shapes, frames, media
  - name: Viewport
    role: Current pan and zoom
  - name: Minimap
    role: Optional overview of the whole
  - name: Multiplayer presence
    role: Others’ cursors and views
roles:
  - object
  - frame
  - connector
  - zoom-level
dimensions:
  - name: Object content
    family: content
    question: What lives on the canvas, and how much detail shows at a glance?
    subdimensions:
      - id: objectTypes
        name: Object types
        select: many
        values:
          - id: sticky-notes-and-text
            name: Sticky notes and text
            example: Miro
          - id: shapes-and-connectors
            name: Shapes and connectors
            example: FigJam
          - id: frames-artboards
            name: Frames / artboards
            example: Figma
          - id: embedded-files-and-media
            name: Embedded files and media
            example: Miro embeds
          - id: live-app-regions
            name: Live app regions
            description: Widgets or previews
            example: Notion-style embeds on boards
          - id: ai-generated-clusters
            name: AI-generated clusters
            example: Some FigJam AI layouts
      - id: lod
        name: Level-of-detail
        select: one
        values:
          - id: constant-detail
            name: Constant detail
            description: Same content at every zoom
            example: Many whiteboards
          - id: semantic-zoom
            name: Semantic zoom
            description: Titles at distance, body near
            example: Pad++-style; some Muse demos
          - id: frame-as-portal
            name: Frame as portal
            description: Enter a frame for denser content
            example: Figma prototype fullscreen
          - id: thumbnailify-when-small
            name: Thumbnailify when small
            description: Collapse to icon or title
            example: Miro when zoomed out
  - name: Spatial structure
    family: composition
    question: How are objects related in space?
    subdimensions:
      - id: canvasStructure
        name: Structure
        select: one
        values:
          - id: free-placement
            name: Free placement
            description: No enforced structure
            example: Miro freeform
          - id: frames-as-regions
            name: Frames as regions
            description: Named areas of the plane
            example: Figma frames
          - id: graph-with-edges
            name: Graph with edges
            description: Nodes and links on a plane
            example: Whimsical, FigJam connectors
          - id: aligned-grid-or-columns
            name: Aligned grid or columns
            description: Soft structure
            example: Miro grid
          - id: sections-owned-by-people
            name: Sections owned by people
            description: Spatial ownership
            example: Workshop parking lots
  - name: Viewport navigation
    family: invocation
    question: How does the person move and orient?
    subdimensions:
      - id: canvasNav
        name: Navigate by
        select: many
        values:
          - id: hand-tool-middle-drag-pan
            name: Hand tool / middle-drag pan
            example: Figma
          - id: scroll-wheel-zoom-to-cursor
            name: Scroll-wheel zoom to cursor
            example: Figma
          - id: zoom-to-selection-fit
            name: Zoom to selection / fit
            example: Figma Shift-1/2
          - id: minimap-jump
            name: Minimap jump
            example: Miro minimap
          - id: follow-someone-s-view
            name: Follow someone’s view
            example: Figma multiplayer follow
          - id: deep-link-to-a-region
            name: Deep-link to a region
            description: URL opens a camera
            example: Figma frame links
  - name: Canvas chrome
    family: layout
    question: What UI surrounds the plane?
    subdimensions:
      - id: canvasChrome
        name: Chrome
        select: many
        values:
          - id: floating-toolbars
            name: Floating toolbars
            example: Figma
          - id: side-property-inspector
            name: Side property inspector
            example: Figma right panel
          - id: minimap-corner
            name: Minimap corner
            example: Miro
          - id: presentation-spotlight-mode
            name: Presentation / spotlight mode
            description: Hide chrome, guide attention
            example: Miro Talktrack / presentation
          - id: grid-and-rulers
            name: Grid and rulers
            example: Figma layout grid
  - name: Collaboration on the plane
    family: collaboration
    question: How are other people and their changes shown?
    subdimensions:
      - id: canvasPresence
        name: Presence
        select: many
        values:
          - id: live-cursors
            name: Live cursors
            example: Figma
          - id: viewport-avatars
            name: Viewport avatars
            description: Who sees what region
            example: Miro
          - id: comments-pinned-in-space
            name: Comments pinned in space
            example: Figma comments
          - id: follow-and-present
            name: Follow and present
            example: Figma observation
          - id: async-trails
            name: Async trails
            description: Who moved what earlier
            example: Version / history markers
  - name: Purpose of the canvas
    family: initiative
    question: Is the canvas primarily for making, facilitating or consuming?
    subdimensions:
      - id: canvasMode
        name: Mode
        select: one
        values:
          - id: authoring
            name: Authoring
            description: Create and arrange
            example: Figma design mode
          - id: facilitation
            name: Facilitation
            description: Workshop timers and voting
            example: Miro workshops
          - id: read-only-explore
            name: Read-only explore
            description: Navigate a published board
            example: Miro view-only
          - id: ai-laid-out-then-edit
            name: AI-laid-out then edit
            description: System places; human tunes
            example: FigJam generate
          - id: guided-path
            name: Guided path
            description: The canvas is consumed along an authored camera path — the author lays topics out in
              space and presenting flies between them in a set order — which is neither free
              read-only exploration nor live facilitation
            example: Prezi — Zooming presentation
wild:
  score: 2
  note: Zoom shortcuts and snap settings are common; semantic LOD policies are rare outside research
    systems.
  examples:
    - name: Figma
      note: Zoom, snap, and multiplayer follow
    - name: Miro
      note: Minimap and presentation frames
    - name: Freeform
      note: Apple Freeform boards
techniques:
  - name: Editable semantic zoom
    dimension: Object content
    how: Authors define which fields survive each zoom band; viewers can still personalize density
      without breaking shared layout.
    ai: false
  - name: Camera as a shareable object
    dimension: Viewport navigation
    how: Named cameras (region + zoom) become first-class links and presentation steps, exchangeable
      like Meridian specs.
    ai: false
  - name: Cluster this mess
    dimension: Spatial structure
    how: “Group these sticky notes by theme” proposes frames and labels with undoable placement.
    ai: true
signature: Editable semantic zoom
sample: Figma, FigJam, Miro, Freeform, Whimsical, Conceptboard, tldraw, and infinite-canvas notes apps.
unit: One canvas document’s viewport and object set.
