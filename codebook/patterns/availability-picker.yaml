    recorded:
      - place: sub:slotLayout
        sub: slotLayout
        dim: Slot presentation
        name: Painted availability grid
        gloss: Participants directly paint their own free time across a continuous grid of days and
          half-hours; the aggregate renders as a heat map rather than a list of organizer-proposed
          options
        raters:
          - sonnet
        instances:
          - 11
        status: raised
  raterNotes:
    fable:
      - "holdBehaviour: 'Timed hold then pay' never applied; booking pages that take a card (Acuity,
        Square, Resy) confirm on submit rather than holding. constraints for restaurant/class
        booking is thin because party size, capacity and release windows are not variations."
      - Pick duration then slot should read service or duration, most booking sites fix length
        through a service choice. Host-declared windows and Resource inventory overlap for a
        business whose staff declare hours. Busy blocks visible does not say whose busy blocks.
    opus:
      - "holdBehaviour's Timed hold then pay never fired: none of these twenty start a countdown on
        an unpaid reservation (Acuity and Square take payment at booking, which is not the same
        thing), so that variation may only describe ticketing. availSource blurs for Calendly-likes
        that both declare windows and subtract connected-calendar busy; I coded the declared windows
        as the source and noted the subtraction."
      - constraints is written for host-time rules only, so every inventory booking (tables,
        classes, seats) has to borrow Working hours or come out empty — the capacity constraint that
        actually governs those pages has no variation.
    sonnet:
      - Group-polling tools (Doodle, When2meet) needed two distinct new slotLayout values since
        neither matches the four calendar/booking-oriented options; they differ from each other in
        whether the grid is a fixed set of proposed columns or a freely painted continuum.
      - "Four codebook problems: (1) 'constraints' was read by me in round 1 as what the page
        displays rather than what rules shrink the slot set, which is what the gloss asks — the
        gloss should say 'whether or not the booker can see them'; (2) 'slotDisclosure' is a ladder,
        not a partition — 'Times only' (no host event titles) is true of almost every instance that
        also carries a price or busy shading, so it wants to be pick any or the gloss needs 'beyond
        bare times'; (3) 'selectionPath: Pick duration then slot' is really 'pick a service or visit
        type, which fixes the duration, then a slot' — every clinic, salon and studio booker in this
        sample takes that shape and none of them ask for a duration as such; (4) 'holdBehaviour' is
        per-configuration for MyChart, Booksy and Bookings — some visit types or businesses
        instant-book while others go to a request — so a pick-one forces a false choice. Also:
        'availSource' conflates where free/busy comes from (typed windows vs a connected calendar)
        with what kind of thing is bookable (staff, rooms, seats), which is why Square and Booksy
        split raters between Host-declared windows and Resource inventory."
