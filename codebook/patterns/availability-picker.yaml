# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "availability-picker". Edit between batches only — see README "Rules".
id: availability-picker
name: Availability picker
level: pattern
parent: schedule
aliases:
  - slot picker
  - booking calendar
  - find-a-time
  - scheduler
definition: A surface for choosing a free time from offered or computed availability — for booking
  someone else, polling a group, or finding mutual free slots.
data: time
platforms:
  - web
  - mobile
domains:
  - productivity
  - health
  - education
  - travel
  - enterprise
anatomy:
  - name: Availability window
    role: When booking is allowed
  - name: Slot grid or list
    role: Candidate times
  - name: Duration control
    role: How long the meeting is
  - name: Confirmation
    role: The held or booked time
roles:
  - slot
  - duration
  - timezone
  - host
  - buffer
dimensions:
  - name: How availability is defined
    family: content
    question: What makes a slot free, and what does the booker see?
    subdimensions:
      - id: availSource
        name: Source of free/busy
        select: one
        values:
          - id: host-declared-windows
            name: Host-declared windows
            description: Manual weekly hours
            example: Calendly availability
          - id: live-calendar-free-busy
            name: Live calendar free/busy
            description: Read from connected calendars
            example: Google Appointment schedules
          - id: polled-preferences
            name: Polled preferences
            description: Respondents mark options
            example: Doodle
          - id: resource-inventory
            name: Resource inventory
            description: Rooms or clinicians with capacity
            example: OpenTable, Epic MyChart
          - id: computed-mutual-free
            name: Computed mutual free
            description: Intersection across invitees
            example: Outlook Scheduling Assistant
      - id: slotDisclosure
        name: Slot disclosure
        select: one
        values:
          - id: times-only
            name: Times only
            description: No event titles shown
            example: Calendly public page
          - id: busy-blocks-visible
            name: Busy blocks visible
            description: Opaque busy regions
            example: Google Find a time
          - id: named-conflicts-for-owner
            name: Named conflicts for owner
            description: Owner sees titles; guest does not
            example: Typical host vs guest asymmetry
          - id: price-or-type-per-slot
            name: Price or type per slot
            description: Slot carries service attributes
            example: Mindbody class booking
  - name: Choosing a slot
    family: flow
    question: What is the path from browsing times to a hold?
    subdimensions:
      - id: selectionPath
        name: Selection path
        select: one
        values:
          - id: pick-one-slot
            name: Pick one slot
            example: Calendly
          - id: pick-duration-then-slot
            name: Pick duration then slot
            example: YouCanBook.me
          - id: propose-several-options
            name: Propose several options
            description: Host or guest offers candidates
            example: Doodle
          - id: assist-then-confirm
            name: Assist then confirm
            description: System ranks; person confirms
            example: Outlook suggested times
          - id: recurring-series-pick
            name: Recurring series pick
            description: Choose a pattern, not one slot
            example: Calendly recurring
  - name: Slot presentation
    family: layout
    question: How are candidate times arranged?
    subdimensions:
      - id: slotLayout
        name: Arrangement
        select: one
        values:
          - id: calendar-month-then-list
            name: Calendar month then list
            description: Pick a day, then times
            example: Calendly
          - id: week-strip-of-slots
            name: Week strip of slots
            example: Many clinic booking UIs
          - id: timeline-with-busy-shading
            name: Timeline with busy shading
            example: Google Find a time
          - id: ranked-suggestion-list
            name: Ranked suggestion list
            description: Not a grid
            example: Clockwise, Reclaim
          - id: map-plus-time
            name: Map plus time
            description: Place-constrained booking
            example: OpenTable
          - id: options-table
            name: Options table
            description: Proposed options as columns and respondents as rows, each cell a yes/if-need-be/no mark
            example: Doodle — Group poll
          - id: chips-around-requested-time
            name: Chips around requested time
            description: The guest names a target time and sees the nearest available seatings as a short row of
              chips, not a full day or week of slots
            example: OpenTable — Reservation search
          - id: poll-grid-of-options
            name: Poll grid of options
            description: A small set of specific date/time options proposed by the organizer are laid out as a
              table (one column per option) for participants to mark, rather than a real calendar
              grid, a busy-shaded timeline, a ranked list, or a map
            example: Doodle — Group poll
  - name: Constraints and buffers
    family: scope
    question: What rules shrink the set of bookable times?
    subdimensions:
      - id: constraints
        name: Constraints
        select: many
        values:
          - id: working-hours
            name: Working hours
            example: Calendly schedule
          - id: minimum-notice
            name: Minimum notice
            example: Calendly notice period
          - id: buffers-before-after
            name: Buffers before/after
            example: Calendly buffers
          - id: duration-presets
            name: Duration presets
            example: 15/30/60 meeting types
          - id: timezone-of-guest
            name: Timezone of guest
            description: Show times in guest tz
            example: Calendly timezone
          - id: travel-or-location-rules
            name: Travel or location rules
            example: Housecall booking tools
          - id: party-size-or-capacity
            name: Party size or capacity
            description: The number of people or seats asked for decides which slots exist at all — a table for
              six, a class with two spots left — a constraint on the resource rather than on the
              host's time
            example: OpenTable — Reservation search
  - name: Hold and confirm
    family: lifecycle
    question: When is the slot reserved, and how long does a hold last?
    subdimensions:
      - id: holdBehaviour
        name: Hold behaviour
        select: one
        values:
          - id: instant-book
            name: Instant book
            description: Writes the event immediately
            example: Calendly
          - id: timed-hold-then-pay
            name: Timed hold then pay
            description: Hold expires if unpaid
            example: Ticketmaster-style holds
          - id: request-awaiting-approval
            name: Request awaiting approval
            description: Host must accept
            example: Some clinic request forms
          - id: poll-closes-later
            name: Poll closes later
            description: No hold until a winner is chosen
            example: Doodle
  - name: Who drives
    family: initiative
    question: Who proposes times — host, guest or system?
    subdimensions:
      - id: initiative
        name: Initiative
        select: one
        values:
          - id: guest-picks-from-host-offer
            name: Guest picks from host offer
            example: Calendly
          - id: host-picks-after-seeing-polls
            name: Host picks after seeing polls
            example: Doodle
          - id: system-suggests-mutual-times
            name: System suggests mutual times
            example: Google Find a time
          - id: ai-negotiates-async
            name: AI negotiates async
            description: Bot proposes until agreement
            example: x.ai-style scheduling assistants
wild:
  score: 1
  note: Hosts configure hours and buffers; guests almost never reshape how slots are shown.
  examples:
    - name: Calendly
      note: Host availability rules and meeting types
    - name: Google Calendar Appointment schedules
      note: Booking page settings
techniques:
  - name: Constraint as attributes
    dimension: Constraints and buffers
    how: Expose notice, buffer, duration and timezone as filterable attributes on the slot set so guests
      can narrow (“only after 5pm in my timezone”).
    ai: false
  - name: Explain why unavailable
    dimension: How availability is defined
    how: Grey slots carry a reason code (outside hours, buffer, conflict, capacity) visible on demand
      without leaking private event titles.
    ai: false
  - name: Negotiate in language
    dimension: Who drives
    how: “Sometime next week that doesn’t conflict with school pickup” becomes ranked slots with
      inspectable constraints from both sides.
    ai: true
signature: Constraint as attributes
sample: Calendly, SavvyCal, Doodle, Google Appointment schedules, Outlook Scheduling Assistant,
  OpenTable, Mindbody and clinic patient portals.
unit: One booking or find-a-time session between host(s) and guest(s).
