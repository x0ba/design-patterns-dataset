# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "monitor". Edit between batches only — see README "Rules".
id: monitor
name: Monitor and get notified
level: archetype
aliases:
  - awareness
  - alerting
  - observability
definition: Keep track of changing state, and be interrupted only when it matters.
data: stream
platforms:
  - web
  - mobile
  - desktop
domains:
  - enterprise
  - software
  - finance
  - health
  - mobility
  - home
anatomy:
  - name: Signals
    role: What is watched
  - name: Surfaces
    role: Where change shows
  - name: Thresholds
    role: When it matters
  - name: Responses
    role: What a person can do about it
roles:
  - metric
  - status
  - timestamp
dimensions:
  - name: Signals
    family: content
    question: What is being watched?
    subdimensions:
      - id: signal
        name: Signal type
        select: many
        values:
          - id: metrics
            name: Metrics
            example: Datadog
          - id: events
            name: Events
            example: GitHub notifications
          - id: object-status
            name: Object status
            example: Order tracking
          - id: people-s-activity
            name: People’s activity
            example: Slack mentions
          - id: external-conditions
            name: External conditions
            example: Weather alerts
  - name: Surfaces
    family: layout
    question: Where does change appear?
    subdimensions:
      - id: surface
        name: Surface
        select: many
        values:
          - id: dashboard
            name: Dashboard
            example: Grafana
          - id: notification-list
            name: Notification list
            example: iOS Notification Center
          - id: badge-on-navigation
            name: Badge on navigation
            example: Unread counts
          - id: ambient-indicator
            name: Ambient indicator
            example: iPhone Dynamic Island
          - id: interruptive-alert
            name: Interruptive alert
            example: Critical alerts
          - id: on-the-object
            name: On the object
            description: Change shows inside the watched object's own screen (an order page, a tracking view,
              the city's weather page) rather than on a separate monitoring surface
            example: Amazon — Order updates
          - id: in-app-banner
            name: In-app banner
            description: A persistent coloured strip inside the app's own view carrying the condition — not a
              list, a badge, an ambient chrome indicator or an interruption; the archetype has a
              banner component but Surfaces has no variation for it
            example: Apple Weather — Severe weather and precipitation alerts
  - name: Delivery timing
    family: lifecycle
    question: When does a change reach the person?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: real-time
            name: Real time
            example: Push notifications
          - id: batched-digest
            name: Batched digest
            example: iOS Scheduled Summary
          - id: scheduled
            name: Scheduled
            example: Daily reports
          - id: on-threshold-crossing
            name: On threshold crossing
            example: Grafana alert rules
  - name: What matters
    family: initiative
    question: Who decides what is worth attention?
    subdimensions:
      - id: definition
        name: Definition
        select: one
        values:
          - id: system-defaults
            name: System defaults
            example: Most apps
          - id: person-s-rules-and-thresholds
            name: Person’s rules and thresholds
            example: Budget alerts in banking apps
          - id: learned-importance
            name: Learned importance
            example: Gmail Important
          - id: anomaly-detection
            name: Anomaly detection
            example: Datadog Watchdog
  - name: Severity
    family: feedback
    question: How is urgency expressed?
    subdimensions:
      - id: severity
        name: Severity
        select: one
        values:
          - id: none
            name: None
            example: Social notifications
          - id: status-colour-with-icon-and-label
            name: Status colour with icon and label
            example: Status pages
          - id: levels
            name: Levels
            description: Info, warning, critical
            example: Monitoring tools
          - id: escalation-over-time
            name: Escalation over time
            example: PagerDuty escalation policies
  - name: Granularity
    family: scope
    question: At what level is state reported?
    subdimensions:
      - id: granularity
        name: Granularity
        select: one
        values:
          - id: per-object
            name: Per object
            example: One order
          - id: per-group
            name: Per group
            example: One service
          - id: summary
            name: Summary
            example: Daily digest
          - id: global-health
            name: Global health
            example: Status page
wild:
  score: 2
  note: "Notification settings are common but coarse: per app, rarely per condition."
  examples:
    - name: iOS
      note: Focus modes and Scheduled Summary
    - name: GitHub
      note: Custom notification routing
techniques:
  - name: Attention budget
    dimension: Delivery timing
    how: A person sets how many interruptions a period may hold; the system ranks what spends it and
      batches the rest.
    ai: false
  - name: Tell me when this matters
    dimension: What matters
    how: A sentence becomes a visible rule with a threshold that can be edited.
    ai: true
signature: Attention budget
sample: Monitoring, banking, delivery, smart-home and collaboration apps.
unit: One monitoring experience.
