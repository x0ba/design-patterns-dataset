      - sub: surface
        name: In-app banner
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Trackers of one order or shipment show state on the object's own page, which none of the
        five surfaces names; timing is a pick-one but most products mix real-time events with
        threshold rules.
      - surface cannot say whether an ordinary push notification is an Interruptive alert or a
        Notification list, which is most of the disagreement here; it also has no variation for
        delivery out to another channel (email, Slack, SMS, SNS), so monitoring tools that page get
        Interruptive alert by default. granularity cannot tell a monitor's own scope from the
        objects under it. definition is pick one but banking apps hold a default and a person-set
        threshold at once.
    opus:
      - "Granularity was the hardest: for alerting tools the monitored unit is the rule/series,
        which reads as Per object, while Per group vs Global health only separates cleanly when a
        public status page rolls services up. Severity is None for every consumer instance, so the
        dimension only discriminates among operations tools."
      - Two codebook problems. Surfaces has no line between a push banner and the list it lands in,
        so raters split the same product between Interruptive alert and Notification list; the gloss
        should say that the push is the interruptive surface and Notification list means a list you
        go back to. And 'definition' and 'severity' are pick one over products that truthfully hold
        two values (Monzo defaults plus budgets; Better Stack colour plus escalation).
    sonnet:
      - Signal and surface read as pick-any in practice for most consumer products (a push channel
        plus a persistent list/tile); definition is often blended (system default plus
        person-tunable threshold) and I picked the more distinguishing one per product.
      - Surface's Interruptive alert (glossed only as 'Critical alerts') and Notification list both
        plausibly describe an ordinary push before it settles into a list; that reading split
        fable+me from opus on almost every push-based instance.
