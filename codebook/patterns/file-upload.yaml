    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.7711488565395347
  agreementFirstPass: 0.8666666666666667
  kappaFinal: 0.9324697454854126
  agreementFinal: 0.96
  pass: true
  perSub:
