# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "file-upload". Edit between batches only — see README "Rules".
id: file-upload
name: File upload
level: component
parent: enter-data
aliases:
  - dropzone
  - attachment
  - file picker
definition: "Handing files to a system: choosing them, sending them and seeing that they arrived."
data: media
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - communication
  - government
  - health
anatomy:
  - name: Entry point
    role: Button or drop zone
  - name: File list
    role: What has been added
  - name: Progress
    role: How the upload is going
roles: []
dimensions:
  - name: Entry
    family: invocation
    question: How do files get in?
    subdimensions:
      - id: entry
        name: Entry
        select: many
        values:
          - id: browse-button
            name: Browse button
            example: Most forms
          - id: drag-and-drop-zone
            name: Drag-and-drop zone
            example: Google Drive
          - id: paste
            name: Paste
            example: Slack pasted images
          - id: camera-capture
            name: Camera capture
            example: Mobile document scanning
          - id: cloud-import
            name: Cloud import
            example: Google Picker
          - id: automatic-sync
            name: Automatic sync
            description: "Files enter with no per-file action: a folder or camera roll is watched and uploaded
              on its own (Google Photos backup, Dropbox desktop folder)"
            example: Google Photos — Backup
          - id: automatic-from-the-device
            name: Automatic from the device
            description: Files are handed over with no act of choosing at all — a background service uploads
              what the device produces once it is switched on
            example: Google Photos — Backup
  - name: Progress
    family: feedback
    question: How is the upload shown?
    subdimensions:
      - id: progress
        name: Progress
        select: one
        values:
          - id: none
            name: None
            example: Small attachments
          - id: per-file-progress
            name: Per-file progress
            example: Dropbox
          - id: background-with-notification
            name: Background with notification
            example: Google Photos backup
          - id: resumable
            name: Resumable
            example: Large-file services
          - id: overall-progress
            name: Overall progress
            description: One indicator for the whole batch or send rather than one per file (WeTransfer's ring,
              iMessage's send bar)
            example: iMessage — Send a photo
  - name: Multiplicity
    family: scope
    question: How many files at once?
    subdimensions:
      - id: multiplicity
        name: Multiplicity
        select: one
        values:
          - id: single-file
            name: Single file
            example: Profile photos
          - id: multiple-files
            name: Multiple files
            example: Attachments
          - id: folders
            name: Folders
            example: Google Drive folder upload
  - name: Preview
    family: content
    question: What is shown about each file?
    subdimensions:
      - id: preview
        name: Preview
        select: one
        values:
          - id: filename
            name: Filename
            example: Forms
          - id: thumbnail
            name: Thumbnail
            example: Image uploads
          - id: extracted-contents
            name: Extracted contents
            example: Parsed résumé fields
  - name: Checks
    family: lifecycle
    question: When are files checked?
    subdimensions:
      - id: checks
        name: Checks
        select: one
        values:
          - id: after-upload
            name: After upload
            example: Server-side validation
          - id: before-upload
            name: Before upload
            description: Type and size
            example: Client-side checks
          - id: scanned
            name: Scanned
            example: Malware scanning status
wild:
  score: 0
  note: Entry methods are fixed by the product.
  examples: []
techniques:
  - name: Extract on upload
    dimension: Preview
    how: Uploaded documents fill related fields, each marked as inferred until confirmed.
    ai: true
signature: Extract on upload
sample: Applications, messaging, cloud storage and health portals.
unit: One upload control.
relations:
  uses:
    - progress-indicator
  specializes: []
  neighbors:
    - form
scores:
  ubiquity: 4
  potential: 2
  spec: 4
evidence: agent-coded
usage:
  - Drag-and-drop is invisible to people who do not expect it
questions:
  - How should extraction errors be shown on the original document?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
