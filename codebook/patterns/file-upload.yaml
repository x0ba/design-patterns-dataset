  unobserved:
    - sub: entry
      var: Automatic sync
    - sub: progress
      var: Resumable
    - sub: checks
      var: Scanned
  unresolved: []
  proposals:
    raised: 4
    adopted:
      - sub: entry
        name: Automatic sync
        raters:
          - fable
          - opus
      - sub: progress
        name: Overall progress
        raters:
          - fable
          - opus
          - sonnet
      - sub: entry
        name: Automatic from the device
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:entry
        sub: entry
        dim: null
        name: Automatic background backup
        gloss: Files already on the device sync up on their own, continuously, without the person choosing
          individual files each time.
        raters:
          - sonnet
        instances:
          - 11
        status: raised
  raterNotes:
    fable:
      - "Checks is nearly always Before upload from the outside: type and size are enforced on
        selection everywhere; After upload and Scanned are server behaviours a rater cannot see, so
        the sub-dimension barely discriminates."
      - checks conflates when a file is vetted (before or after) with whether it is scanned, so
        cloud drives split three ways; progress lacks an aggregate indicator, which two raters
        proposed independently; entry lacks the case where nothing is chosen at all.
    opus:
      - "checks is the sub-dimension I trust least: what a service does after an upload (virus
        scanning, transcoding, quota) is invisible, so After upload is really where I could see no
        client-side refusal. preview is also pick-one where products mix — Gmail and ChatGPT show a
        name for a document and a thumbnail for an image in the same control."
      - checks has no value for 'nothing is checked', which split us three ways on iMessage, and it
        is pick one although a cloud drive checks names and size at selection and scans for malware
        afterwards; entry has no value for a stock or web library (Notion's Unsplash tab, embed by
        link) as distinct from importing your own cloud files; progress conflates granularity with
        location — Instagram's post bar is both aggregate and in the background, and only the
        background half has a variation.
    sonnet:
      - For cloud-storage products (Drive, Dropbox, OneDrive) I coded checks as Scanned rather than
        After/Before upload, since their most distinctive, well-known check is backend malware
        scanning rather than a simple client-side gate — this may be under-crediting the size/type
        checks they also do before accepting a file.
      - "Two recurring corrections: (1) 'checks' for cloud-storage uploaders (Drive, Dropbox,
        OneDrive) kept pulling me toward 'Scanned' because these services are known for backend
        malware scanning — but that scanning is a separate, later feature (often only surfaced at
        download time), not the upload flow's own before/after check; the interactive check a person
        actually experiences during upload is a before-upload size/quota/name check in all three
        cases. (2) I was under-crediting 'entry' pick-any options (Paste, Drag-and-drop, Camera
        capture) across chat and composer apps where I'd only credited the primary Browse path — a
        systematic under-listing similar to other archetypes' pick-any sub-dimensions."
  codedAt: 2026-09-22
