    recorded:
      - place: sub:label
        sub: label
        dim: null
        name: Tab colour
        gloss: A tab can be given its own background colour to visually distinguish it, independent of its
          text, icon, badge or close button.
        raters:
          - sonnet
        instances:
          - 16
        status: raised
  raterNotes:
    fable:
      - overflow is n/a for small fixed sets that can never overflow (mobile tab bars); WhatsApp
        Android was coded on its current bottom bar, not the sample's older top tabs.
    opus:
      - "overflow is n/a for every fixed mobile tab bar, which is a quarter of the sample — the
        sub-dimension only applies where the set can grow. origin is pick-one but real tab sets mix:
        X's fixed pair plus the person's pinned lists, Word's fixed ribbon plus contextual tabs.
        background is also largely unobservable — whether a tab is discarded or merely idle is a
        memory-pressure decision, so I coded the product's stated behaviour."
    sonnet:
      - Background was n/a for several instances (ribbon tabs, dialog tabs, GitHub/Google-Search
        filter tabs, DevTools view switches counted as n/a only where truly stateless) where the tab
        is really a view/filter switch rather than a persisted document — I reserved Kept
        alive/Unloaded/Put to sleep for tabs that hold genuinely separate, statefully persisted
        content.
