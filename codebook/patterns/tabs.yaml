# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "tabs". Edit between batches only — see README "Rules".
id: tabs
name: Tabs
level: component
parent: navigate
aliases:
  - tab bar
  - segmented control
  - tab strip
definition: A set of peer views sharing one space, one visible at a time, switched by labelled controls.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - software
  - commerce
  - entertainment
anatomy:
  - name: Tab
    role: One label
  - name: Panel
    role: The view it shows
  - name: Indicator
    role: Which is current
roles:
  - title
  - icon
  - badge
dimensions:
  - name: Placement and overflow
    family: layout
    question: Where are tabs, and what happens when there are too many?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: top
            name: Top
            example: Browser tabs
          - id: bottom
            name: Bottom
            example: iOS tab bars
          - id: vertical
            name: Vertical
            example: Edge vertical tabs
          - id: segmented-control
            name: Segmented control
            example: iOS segmented controls
      - id: overflow
        name: Overflow
        select: one
        values:
          - id: scroll
            name: Scroll
            example: Material scrollable tabs
          - id: shrink
            name: Shrink
            example: Chrome tabs
          - id: more-menu
            name: More menu
            example: Office ribbons
          - id: wrap
            name: Wrap
            example: Old desktop dialogs
  - name: Labels
    family: content
    question: What does a tab say?
    subdimensions:
      - id: label
        name: Label content
        select: many
        values:
          - id: text
            name: Text
            example: GitHub repository tabs
          - id: icon
            name: Icon
            example: Bottom tab bars
          - id: badge-count
            name: Badge count
            example: Unread counts
          - id: favicon-and-title
            name: Favicon and title
            example: Browser tabs
          - id: close-button
            name: Close button
            example: Editor tabs
  - name: Tab origin and grouping
    family: composition
    question: Who makes tabs, and can they be grouped?
    subdimensions:
      - id: origin
        name: Origin
        select: one
        values:
          - id: fixed-by-the-designer
            name: Fixed by the designer
            example: Settings tabs
          - id: created-by-the-person
            name: Created by the person
            example: Browser tabs; CHI '25 probe overviews
          - id: saved-views
            name: Saved views
            example: Notion database views
          - id: pinned-and-preview-tabs
            name: Pinned and preview tabs
            description: A preview tab is replaced unless kept
            example: VS Code preview tabs
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: flat
            name: Flat
            example: Most tab sets
          - id: tab-groups
            name: Tab groups
            example: Chrome tab groups
          - id: nested-tabs
            name: Nested tabs
            example: Tabs inside a tab panel
  - name: Background tabs
    family: lifecycle
    question: What happens to a tab you are not looking at?
    subdimensions:
      - id: background
        name: Background state
        select: one
        values:
          - id: unloaded-on-switch
            name: Unloaded on switch
            example: Simple tab widgets
          - id: kept-alive
            name: Kept alive
            example: Editor tabs
          - id: put-to-sleep
            name: Put to sleep
            example: Edge sleeping tabs
  - name: Switching
    family: invocation
    question: How does a person switch?
    subdimensions:
      - id: switchBy
        name: Switch by
        select: many
        values:
          - id: click
            name: Click
            example: All
          - id: swipe-between-panels
            name: Swipe between panels
            example: Android tab layouts
          - id: keyboard
            name: Keyboard
            example: Ctrl+Tab
          - id: search-tabs
            name: Search tabs
            example: Chrome tab search
wild:
  score: 3
  note: Where people create tabs (browsers, editors), they also reorder, pin, group and close them
    routinely.
  examples:
    - name: Chrome
      note: Pin, group and search tabs
    - name: VS Code
      note: Pin, split and preview tabs
techniques:
  - name: Tabs as workspaces
    dimension: Tab origin and grouping
    how: A set of tabs saved and restored as a named spec, the way CHI '25 participants used multiple
      overviews to hold sub-tasks.
    ai: false
  - name: Group my tabs
    dimension: Tab origin and grouping
    how: Ask to organize open tabs by task; groups arrive named and editable.
    ai: true
signature: Tabs as workspaces
sample: Browsers, editors, settings screens and mobile apps’ tab bars.
unit: One tab set.
relations:
  uses:
    - badge
    - menu
  specializes: []
  neighbors:
    - view-switcher
    - accordion
    - carousel
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Tab hoarding mirrors attribute hoarding (CHI '25 P2 kept many tabs and never hid attributes)
questions:
  - Are user-created tabs a composition customization in every pattern?
coding:
