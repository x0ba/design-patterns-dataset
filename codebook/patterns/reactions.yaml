# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "reactions". Edit between batches only — see README "Rules".
id: reactions
name: Reactions
level: component
parent: communicate
aliases:
  - emoji reactions
  - likes
  - tapbacks
definition: Lightweight responses attached to content without composing a message.
data: collection
platforms:
  - mobile
  - web
  - desktop
domains:
  - social
  - communication
  - enterprise
anatomy:
  - name: Vocabulary
    role: The available reactions
  - name: Aggregate
    role: Counts and who
  - name: Picker
    role: How to add one
roles: []
dimensions:
  - name: Vocabulary
    family: encoding
    question: What reactions exist?
    subdimensions:
      - id: vocabulary
        name: Vocabulary
        select: one
        values:
          - id: single-like
            name: Single like
            example: Instagram heart
          - id: fixed-small-set
            name: Fixed small set
            example: LinkedIn reactions
          - id: any-emoji
            name: Any emoji
            example: Slack
          - id: custom-emoji
            name: Custom emoji
            example: Slack custom emoji
          - id: graded-intensity
            name: Graded intensity
            description: One reaction type whose value accumulates with repeated presses, so the reaction
              carries strength as well as existence (Medium's 1–50 claps)
            example: Medium — Claps
  - name: Aggregate
    family: content
    question: What is shown about reactions?
    subdimensions:
      - id: aggregate
        name: Aggregate
        select: one
        values:
          - id: total-count
            name: Total count
            example: X likes
          - id: count-per-reaction
            name: Count per reaction
            example: Slack
          - id: who-reacted
            name: Who reacted
            example: Slack hover
          - id: hidden-counts
            name: Hidden counts
            example: Instagram hide like counts
  - name: Adding
    family: invocation
    question: How is a reaction added?
    subdimensions:
      - id: add
        name: Add by
        select: many
        values:
          - id: double-tap
            name: Double-tap
            example: Instagram
          - id: long-press-picker
            name: Long-press picker
            example: iMessage tapbacks
          - id: hover-picker
            name: Hover picker
            example: Slack
          - id: typed-shortcut
            name: Typed shortcut
            example: "+:emoji: in Slack"
          - id: single-tap
            name: Single tap
            description: One tap or click on a dedicated always-visible reaction button, with no picker to open
              and no gesture to learn — the heart under a post, the vote arrow
            example: Instagram — Post like
          - id: click-to-open-picker
            name: Click to open picker
            description: Clicking (not hovering) a button reveals a picker of reaction options to choose from
            example: GitHub — Comment reactions
          - id: tap-a-dedicated-button
            name: Tap a dedicated button
            description: A single click or tap on a dedicated reaction icon/button applies the platform's one
              default reaction directly — no gesture on the content itself, no revealed picker, no
              typed shortcut
            example: Instagram — Post like
  - name: Social meaning
    family: collaboration
    question: Who sees a reaction?
    subdimensions:
      - id: visibility
        name: Visibility
        select: one
        values:
          - id: public-with-names
            name: Public with names
            example: Slack
          - id: private-to-the-author
            name: Private to the author
            example: Private likes on X
          - id: anonymous-aggregate
            name: Anonymous aggregate
            example: Poll-style reactions
wild:
  score: 2
  note: Hiding counts and adding custom emoji are both available in major products.
  examples:
    - name: Instagram
      note: Hide like and view counts
    - name: Slack
      note: Add custom emoji
techniques:
  - name: Reactions as attributes
    dimension: Aggregate
    how: Reactions become sortable and filterable attributes of a collection (show messages marked ✅),
      exactly as Fluid Attributes made interactive elements sortable.
    ai: false
signature: Reactions as attributes
sample: Social, messaging and team collaboration products.
unit: One reaction system.
relations:
  uses:
    - popover
  specializes: []
  neighbors:
    - rating
scores:
  ubiquity: 5
  potential: 2
  spec: 5
evidence: agent-coded
usage:
  - Teams invent private meanings for emoji, such as ✅ for done
questions:
  - Should conventional reaction meanings be declared so they can drive views?
