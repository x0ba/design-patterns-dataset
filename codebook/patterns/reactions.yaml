    adopted:
      - sub: add
        name: Single tap
        raters:
          - fable
          - opus
          - sonnet
      - sub: add
        name: Click to open picker
        raters:
          - fable
          - opus
          - sonnet
      - sub: vocabulary
        name: Graded intensity
        raters:
          - fable
          - opus
          - sonnet
      - sub: add
        name: Tap a dedicated button
        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - add is pick-any of gestures, so a plain tap/click on an always-visible button (X, YouTube,
        Reddit, Medium, Zoom, Gmail) codes as an empty array; the codebook may want a 'Tap a button'
        variation. Slack is the exemplar for both Count per reaction and Who reacted; I coded the
        always-visible aggregate.
      - add has no value for the commonest case, a tap on a dedicated button; three raters proposed
        it under two names. aggregate assumes reactions persist and collect, transient call
        reactions do not fit. Total count vs Count per reaction needs to say whether glyphs beside
        one number count as per-reaction.
    opus:
      - add had no variation for the commonest case of all — a plain tap on a visible like button —
        so half the social instances needed +Single tap. aggregate is pick-one but Slack-likes show
        a count per reaction at rest and the names on hover, which are two different variations of
        the same system; I coded the resting display and noted the hover. Zoom's transient reactions
        have no aggregate at all, coded n/a.
      - aggregate has no value for what messaging apps actually draw — the distinct emoji glyphs
        with a single total beside them — so WhatsApp and Messenger split all three of us between
        Total count, Count per reaction and Who reacted.
    sonnet:
      - Vocabulary and aggregate were often close calls between two plausible codebook values for
        the same product (e.g., YouTube's visible like/hidden dislike split, Instagram's optional
        count-hiding); picked the value the codebook itself cites that product for where one exists.
      - "Two codebook problems. (1) aggregate is pick one but its values are layers of the same
        display, not alternatives: WhatsApp and Messenger show a total at rest, per-reaction counts
        and who reacted on tap. It should be pick any, or the gloss should say to code what the
        resting surface shows — I coded the resting state. (2) add mixes two questions, what reveals
        the reaction control (hover, long-press, always visible) and what choosing looks like (one
        default reaction versus a picker); that is why one affordance drew three different codes and
        why both the Single tap and Click to open picker proposals were needed. Also worth noting:
        two raters independently proposed the same missing single-tap variation, so it is
        variation-worthy."
  codedAt: 2026-09-22
