  proposals:
    raised: 1
    adopted: []
    recorded:
      - place: sub:layout
        sub: layout
        dim: null
        name: Labelled stream
        gloss: One left-aligned stream where each run of messages sits under the sender's coloured name
          label, with neither bubbles nor avatars
        raters:
          - fable
        instances:
          - 17
        status: raised
  raterNotes:
    fable:
      - "unread: the Slack/Discord exemplars both scroll to a divider, so I coded 'New messages
        divider' when a line is drawn and 'First unread' when the view lands on it without a line
        (Zulip) or per the Discord exemplar. lifetime is pick-one, so opt-in disappearing (Signal,
        Instagram) and scheduled send (Telegram, Slack) are noted rather than coded."
    opus:
      - "lifetime is pick-one but most products have two answers at once (edit/delete plus scheduled
        send, or edit/delete plus an optional disappearing timer). I ruled that lifetime describes a
        sent message's persistence — Disappearing only when the sampled screen's default or
        signature state is a timer, scheduled send only when nothing can be edited or deleted — and
        noted it per instance. The New messages divider / First unread split is also thin: I read
        divider as a marker you land above and First unread as the scroll position."
    sonnet:
      - Several messengers (Instagram, WeChat, LINE) support delete/unsend but not true message
        editing; coded them as 'Editable and deletable' since the codebook bundles both under one
        variation rather than splitting them.
