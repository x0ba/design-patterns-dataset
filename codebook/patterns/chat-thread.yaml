# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "chat-thread". Edit between batches only — see README "Rules".
id: chat-thread
name: Chat thread
level: pattern
parent: communicate
aliases:
  - messaging view
  - conversation
  - DM
definition: A chronological sequence of messages between participants, with a composer at the edge.
data: conversation
platforms:
  - mobile
  - web
  - desktop
domains:
  - communication
  - social
  - enterprise
  - commerce
anatomy:
  - name: Message list
    role: The history
  - name: Message
    role: One turn
  - name: Composer
    role: Writing the next turn
  - name: Header
    role: Participants and actions
roles:
  - sender
  - avatar
  - timestamp
  - body
  - attachment
  - reaction
dimensions:
  - name: Message layout
    family: layout
    question: How are messages drawn?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: bubbles-by-sender
            name: Bubbles by sender
            example: iMessage
          - id: stream-with-avatars
            name: Stream with avatars
            example: Slack
          - id: compact-lines
            name: Compact lines
            example: Discord compact mode
          - id: cozy
            name: Cozy
            example: Discord cozy mode
  - name: Reply structure
    family: composition
    question: How do replies relate to messages?
    subdimensions:
      - id: replies
        name: Replies
        select: one
        values:
          - id: flat
            name: Flat
            example: SMS
          - id: quoted-inline-replies
            name: Quoted inline replies
            example: WhatsApp replies
          - id: side-threads
            name: Side threads
            example: Slack threads
          - id: topic-threads
            name: Topic threads
            example: Zulip
  - name: Message content
    family: content
    question: What can a message carry, and what metadata shows?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: text
            name: Text
            example: All
          - id: media-and-files
            name: Media and files
            example: All
          - id: link-previews
            name: Link previews
            example: iMessage
          - id: interactive-cards
            name: Interactive cards
            example: Slack Block Kit
          - id: voice-messages
            name: Voice messages
            example: WhatsApp
      - id: metadata
        name: Metadata
        select: many
        values:
          - id: timestamp
            name: Timestamp
            example: All
          - id: read-receipts
            name: Read receipts
            example: WhatsApp
          - id: edited-marker
            name: Edited marker
            example: Slack
          - id: delivery-status
            name: Delivery status
            example: Signal
  - name: Message lifetime
    family: lifecycle
    question: What happens to a message over time?
    subdimensions:
      - id: lifetime
        name: Lifetime
        select: one
        values:
          - id: permanent
            name: Permanent
            example: SMS
          - id: editable-and-deletable
            name: Editable and deletable
            example: Slack
          - id: disappearing
            name: Disappearing
            example: Signal disappearing messages
          - id: scheduled-send
            name: Scheduled send
            example: Slack scheduled messages
  - name: Composer actions
    family: invocation
    question: What can be done from the composer?
    subdimensions:
      - id: composer
        name: Composer
        select: many
        values:
          - id: send-on-enter
            name: Send on Enter
            example: Desktop chat
          - id: slash-commands
            name: Slash commands
            example: Slack
          - id: mentions
            name: Mentions
            example: "@ in Slack"
          - id: attachments
            name: Attachments
            example: All
          - id: formatting-toolbar
            name: Formatting toolbar
            example: Slack
  - name: Unread position
    family: feedback
    question: Where does a returning reader land?
    subdimensions:
      - id: unread
        name: Unread
        select: one
        values:
          - id: latest-message
            name: Latest message
            example: WhatsApp
          - id: new-messages-divider
            name: New messages divider
            example: Slack
          - id: first-unread
            name: First unread
            example: Discord
wild:
  score: 2
  note: Density modes, themes and text size are common options.
  examples:
    - name: Discord
      note: Compact or cozy message display
    - name: Slack
      note: Clean or compact message theme
techniques:
  - name: Promote to structure
    dimension: Message content
    how: Turn any message into a task, a thread, a document or a pinned attribute in the header (a
      deadline found in chat, surfaced like CHI '25’s Response Deadline).
    ai: true
  - name: Density modes
    dimension: Message layout
    how: Switch between bubbles, cozy and compact per conversation.
    ai: false
signature: Promote to structure
sample: Consumer messaging, team chat and customer support chat.
unit: One conversation view.
relations:
  uses:
    - reactions
    - text-field
    - file-upload
    - badge
    - autocomplete
  specializes:
    - communicate
  neighbors:
    - comment-thread
    - ai-chat
    - feed
scores:
  ubiquity: 5
  potential: 4
  spec: 4
evidence: agent-coded
usage:
  - Decisions made in chat are lost because chat has no structure to keep them in
questions:
  - Where is the overview of a conversation, and what are its attributes?
coding:
