# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "map-explorer". Edit between batches only — see README "Rules".
id: map-explorer
name: Map explorer
level: pattern
parent: explore-space
aliases:
  - interactive map
  - web map
  - geo browser
definition: A pannable, zoomable geographic map with layers of places, routes or data, used to find,
  compare and open things in the world.
data: space
platforms:
  - web
  - mobile
  - desktop
domains:
  - travel
  - mobility
  - commerce
  - news
  - government
  - science
anatomy:
  - name: Base map
    role: Tiles or vector basemap
  - name: Viewport controls
    role: Pan, zoom, rotate, tilt
  - name: Overlays
    role: Pins, routes, heat, boundaries
  - name: Place detail
    role: The card or panel for a selection
  - name: Search
    role: Jump to a place or query
roles:
  - pin
  - label
  - route
  - layer
  - user-location
dimensions:
  - name: Base and overlays
    family: content
    question: What is drawn on the map, and how are overlays chosen?
    subdimensions:
      - id: basemap
        name: Basemap
        select: one
        values:
          - id: streets
            name: Streets
            example: Google Maps default
          - id: satellite-aerial
            name: Satellite / aerial
            example: Google Satellite
          - id: terrain
            name: Terrain
            example: Google Terrain
          - id: transit-schematic-emphasis
            name: Transit schematic emphasis
            example: Citymapper map modes
          - id: minimal-light
            name: Minimal / light
            description: Quieter basemap for data
            example: Mapbox light styles
      - id: overlays
        name: Overlay types
        select: many
        values:
          - id: poi-pins
            name: POI pins
            example: Google Maps
          - id: clusters-at-low-zoom
            name: Clusters at low zoom
            example: Airbnb map
          - id: routes-and-polylines
            name: Routes and polylines
            example: Google Directions
          - id: choropleth-heat
            name: Choropleth / heat
            example: COVID case maps
          - id: live-traffic-or-vehicles
            name: Live traffic or vehicles
            example: Uber, Google traffic
          - id: user-generated-marks
            name: User-generated marks
            example: Google Maps saved places
  - name: Viewport controls
    family: invocation
    question: How does the person change what region is shown?
    subdimensions:
      - id: mapNav
        name: Navigation
        select: many
        values:
          - id: drag-pan
            name: Drag pan
            example: All web maps
          - id: pinch-scroll-zoom
            name: Pinch / scroll zoom
            example: Google Maps
          - id: rotate-and-tilt
            name: Rotate and tilt
            description: 2.5D / 3D globe
            example: Google Maps 3D
          - id: recenter-on-me
            name: Recenter on me
            example: Blue-dot recenter
          - id: search-and-fly-to
            name: Search and fly-to
            example: Google Maps search
          - id: bounds-fit-to-results
            name: Bounds fit to results
            description: Zoom to fit a result set
            example: Airbnb search map
  - name: Map and list coupling
    family: composition
    question: How do the map and any list or detail of the same items relate?
    subdimensions:
      - id: coupling
        name: Coupling
        select: one
        values:
          - id: map-only
            name: Map only
            example: Casual browsing
          - id: synchronized-list-plus-map
            name: Synchronized list + map
            description: Hover/select links both
            example: Zillow, Airbnb
          - id: detail-card-over-map
            name: Detail card over map
            description: Bottom sheet or side card
            example: Google Maps place
          - id: split-indoor-plus-outdoor
            name: Split indoor + outdoor
            description: Building plan after enter
            example: Mall indoor maps
          - id: directions-panel-takes-over
            name: Directions panel takes over
            description: Route UI replaces browse
            example: Google Directions
  - name: Mark encoding
    family: encoding
    question: How do attributes become visual marks?
    subdimensions:
      - id: markDesign
        name: Mark design
        select: many
        values:
          - id: category-icon
            name: Category icon
            example: Google Maps restaurant pins
          - id: price-or-value-label
            name: Price or value label
            description: Text on mark
            example: Airbnb price pins
          - id: colour-of-a-metric
            name: Colour of a metric
            example: Zillow estimate heat
          - id: size-by-magnitude
            name: Size by magnitude
            example: Earthquake maps
          - id: selected-elevation
            name: Selected elevation
            description: Chosen mark pops
            example: Most listing maps
          - id: availability-shading
            name: Availability shading
            description: Grey sold-out regions
            example: Ticketing city maps
  - name: Filtering the world
    family: scope
    question: How is the set of visible places narrowed?
    subdimensions:
      - id: mapNarrowing
        name: Narrowing
        select: many
        values:
          - id: category-chips
            name: Category chips
            example: Google Maps Hotels / Food
          - id: faceted-filters
            name: Faceted filters
            example: Airbnb filters
          - id: draw-a-search-area
            name: Draw a search area
            description: Lasso or “search as I move”
            example: Airbnb search-as-move
          - id: time-of-day-live
            name: Time of day / live
            description: Open now, ETA
            example: Google open now
          - id: saved-lists-only
            name: Saved lists only
            example: Google Maps lists
  - name: Context and device
    family: adaptation
    question: How does the map change with mobility, offline and screen size?
    subdimensions:
      - id: mapAdapt
        name: Adaptation
        select: many
        values:
          - id: follow-user-while-navigating
            name: Follow user while navigating
            example: Google Navigation
          - id: offline-packs
            name: Offline packs
            example: Google Offline maps
          - id: compact-mobile-sheet
            name: Compact mobile sheet
            description: List collapses under map
            example: Mobile Google Maps
          - id: desktop-side-panel
            name: Desktop side panel
            example: Desktop Google Maps
          - id: dark-night-style
            name: Dark / night style
            example: Apple Maps night
wild:
  score: 2
  note: Layer and basemap toggles are common; mark encodings and coupling layout are rarely personal.
  examples:
    - name: Google Maps
      note: Layers and map type
    - name: Airbnb
      note: Search as I move and price-on-map
    - name: Strava
      note: Heatmap and activity filters
techniques:
  - name: Fluid map attributes
    dimension: Mark encoding
    how: Surface any place attribute onto pins (price, rating, open-now) and let colour/size/label bind
      to it per person.
    ai: false
  - name: Fit to the filtered set
    dimension: Map and list coupling
    how: Changing filters always offers zoom-to-fit the remaining marks without stealing the user’s
      manual viewport unless asked.
    ai: false
  - name: Describe the area
    dimension: Filtering the world
    how: “Family-friendly spots near the park that are quiet after 8” becomes a filter layer with
      visible criteria chips.
    ai: true
signature: Fluid map attributes
sample: Google Maps, Apple Maps, Airbnb, Zillow, Uber, Citymapper, Strava, news and election maps,
  and government GIS viewers.
unit: One map viewport with its active layers and coupled list/detail, if any.
