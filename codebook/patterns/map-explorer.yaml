  raterNotes:
    fable:
      - basemap 'Minimal / light' was used for every quiet data basemap including dark ones (Strava,
        JHU); the codebook may want the variation renamed 'Quiet data basemap'. Proportional-circle
        maps (JHU, USGS) have no overlay variation and were coded as POI pins with Size by
        magnitude.
    opus:
      - "overlays has no clean home for proportional-symbol data maps (USGS quakes, JHU cases): they
        are neither POI pins nor a choropleth, and I coded them as pins with markDesign carrying
        size and colour — a likely disagreement. basemap is also awkward for stylised map styles
        (Snap Map, Uber, Airbnb), which I put under Minimal / light on the grounds that the style
        exists to get out of the data's way."
    sonnet:
      - Several data-visualization maps (Strava, JHU, USGS, Windy, Flightradar24) use a deliberately
        dark background; coded basemap as Minimal/light anyway since the gloss ('quieter basemap for
        data') is the defining trait, not the literal light color — flagging this as a naming
        tension worth a second look, not a missing variation.
      - "Two glosses did most of the damage here. 'Draw a search area — Lasso or search as I move'
        bundles two different mechanics, and every rater filed Redo search here / Update results
        when map moves / Search this area differently (I had them under bounds-fit in mapNav). 'Live
        traffic or vehicles' has to be stretched to cover people and devices (Find My, Snap Map), so
        it really means live moving entities. Two exemplars are also wrong about their products:
        Choropleth / heat cites COVID case maps, but the Johns Hopkins dashboard is a
        proportional-symbol map, and Choropleth / heat is the only home for an animated continuous
        field like Windy's wind, which is neither shaded regions nor discrete marks."
