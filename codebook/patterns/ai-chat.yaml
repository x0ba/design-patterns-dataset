  raterNotes:
    fable:
      - Scope has no value for personal cross-chat memory (ChatGPT Memory) and IDE chats sit between
        Live page and Project knowledge; coded Project knowledge when @/# reach the workspace.
      - "Plain text and Markdown with code overlap: I read Plain text as the no-markup case, opus
        and sonnet read it literally, and that is most of the turnContent disagreement. Flow is pick
        one but every large chat holds stop-and-regenerate, edit-and-fork and a handoff mode at
        once. Withdrew +Barge-in for opus's +Barge-in duplex."
    opus:
      - Flow is a pick-one over affordances that co-exist (stop, regenerate, edit-and-fork, mode
        handoff), so I coded the strongest recovery each product offers; voice assistants fit this
        entry badly — turn content, feedback and flow all assume a rendered thread, which is why
        feedback is empty for three instances rather than falsely populated.
      - "Most of this entry's disagreement is two codebook faults. `turnContent` lists Plain text
        beside Markdown with code without saying whether they are exclusive, so one rater read them
        as rendering levels and coded only the richest while I read pick-any literally — the split
        runs through fourteen cells and the fix is one sentence in the gloss. `flow` is an ordered
        scale, not a set of alternatives: strict turn-taking, stop, regenerate and edit-and-fork
        accumulate in the same product, so a pick one makes the code mean whichever level the rater
        thought most characteristic; it wants to be pick any. `Citations` in turnContent and
        `Citations inline` in feedback are also the same observation coded twice."
    sonnet:
      - Scope was often ambiguous between 'This thread only' and a broader connected/live scope when
        a product offers both a default mode and an optional connector; I coded the capability the
        sample screen specifically calls out.
