# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "ai-chat". Edit between batches only — see README "Rules".
id: ai-chat
name: AI chat
level: pattern
parent: delegate-ai
aliases:
  - chatbot
  - conversational AI
  - assistant thread
definition: A turn-taking conversation with a model where prompts and replies accumulate, and the
  person steers by following up, editing context or starting anew.
data: conversation
platforms:
  - web
  - desktop
  - mobile
  - voice
domains:
  - ai
  - productivity
  - education
  - software
  - enterprise
  - health
anatomy:
  - name: Thread
    role: The turn history
  - name: Composer
    role: Where the next prompt is written
  - name: Reply
    role: A model turn
  - name: Context sources
    role: Files, tools or retrieval attached
  - name: Controls
    role: Regenerate, stop, branch
roles:
  - user
  - assistant
  - system
  - tool
dimensions:
  - name: Turn content
    family: content
    question: What can a turn contain?
    subdimensions:
      - id: turnContent
        name: Turn content
        select: many
        values:
          - id: plain-text
            name: Plain text
            example: Classic ChatGPT
          - id: markdown-with-code
            name: Markdown with code
            example: ChatGPT / Claude
          - id: citations
            name: Citations
            example: Perplexity
          - id: tool-call-traces
            name: Tool call traces
            example: ChatGPT tools
          - id: generated-media
            name: Generated media
            example: ChatGPT images
          - id: structured-cards
            name: Structured cards
            example: Shopping or flight modules
          - id: spoken-reply
            name: Spoken reply
            description: The turn is synthesised speech, with no text rendered on the surface where it happens
              (a transcript may appear later or in a companion app); the only turn content a
              screenless assistant has
            example: ChatGPT — Advanced Voice Mode
  - name: Thread composition
    family: composition
    question: How do turns and side contexts relate?
    subdimensions:
      - id: composition
        name: Composition
        select: one
        values:
          - id: linear-thread
            name: Linear thread
            example: ChatGPT
          - id: branching-conversation-tree
            name: Branching conversation tree
            example: Claude Projects branching / some UIs
          - id: thread-plus-artifacts-panel
            name: Thread plus artifacts panel
            example: Claude Artifacts, ChatGPT canvas
          - id: multi-agent-transcript
            name: Multi-agent transcript
            example: Swarm-style traces
          - id: ephemeral-single-turn
            name: Ephemeral single-turn
            example: Search-box assistants
  - name: Composer invocation
    family: invocation
    question: How is the next message started?
    subdimensions:
      - id: invokeBy
        name: Invoke by
        select: many
        values:
          - id: text-field-submit
            name: Text field submit
            example: ChatGPT
          - id: voice-input
            name: Voice input
            example: Advanced Voice Mode
          - id: attach-file-or-image
            name: Attach file or image
            example: ChatGPT uploads
          - id: slash-or-mention-tools
            name: Slash or mention tools
            example: Custom GPTs actions
          - id: suggestion-chip
            name: Suggestion chip
            example: Follow-up chips
  - name: Conversation flow
    family: flow
    question: How does the dialogue progress and recover?
    subdimensions:
      - id: flow
        name: Flow
        select: one
        values:
          - id: strict-turn-taking
            name: Strict turn-taking
            example: Classic chat
          - id: stop-and-regenerate
            name: Stop and regenerate
            example: ChatGPT
          - id: edit-prior-prompt-and-fork
            name: Edit prior prompt and fork
            example: ChatGPT edit
          - id: continue-in-background
            name: Continue in background
            example: Long research tasks
          - id: hand-off-to-an-agent-run
            name: Hand off to an agent run
            example: Deep research / operator
          - id: barge-in
            name: Barge-in
            description: Speaking over the model stops its reply and takes the turn, without a stop button or
              regenerate
            example: ChatGPT — Advanced Voice Mode
          - id: barge-in-duplex
            name: Barge-in duplex
            description: "Either party may speak over the other: the person interrupts a reply mid-sentence and
              the model yields and re-plans, so turns overlap instead of alternating"
            example: ChatGPT — Advanced Voice Mode
          - id: hand-off-to-a-person
            name: Hand off to a person
            description: The conversation is escalated out of the model to a human who continues in the same
              thread — the central recovery path in support chat, and the mirror image of handing
              off to an agent run
            example: Intercom Fin — Support chat widget
  - name: Reply feedback
    family: feedback
    question: How is generation and quality communicated?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: streaming-tokens
            name: Streaming tokens
            example: ChatGPT
          - id: stop-button
            name: Stop button
            example: All major chats
          - id: citations-inline
            name: Citations inline
            example: Perplexity
          - id: confidence-or-hedging-cues
            name: Confidence or hedging cues
            example: Some enterprise bots
          - id: thumbs-and-free-text-feedback
            name: Thumbs and free-text feedback
            example: ChatGPT
  - name: Context scope
    family: scope
    question: What does the model condition on?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: this-thread-only
            name: This thread only
            example: Default chats
          - id: project-knowledge
            name: Project knowledge
            example: Claude Projects
          - id: connected-apps
            name: Connected apps
            example: ChatGPT connectors
          - id: live-page-or-selection
            name: Live page or selection
            example: Sidebar copilots
          - id: organization-memory
            name: Organization memory
            example: Enterprise assistants
wild:
  score: 2
  note: Custom instructions, model choice and memory toggles are common; thread layout less so.
  examples:
    - name: ChatGPT
      note: Custom instructions, memory, model picker
    - name: Claude
      note: Projects and artifacts
    - name: Perplexity
      note: Focus modes and source controls
techniques:
  - name: Fork from an edited turn
    dimension: Conversation flow
    how: Editing a past prompt creates a branch rather than silently rewriting history.
    ai: false
  - name: Show what was grounded
    dimension: Reply feedback
    how: Attach retrieval, tool and file provenance to each claim that depends on them.
    ai: false
  - name: Suggest the next ask
    dimension: Composer invocation
    how: Offer follow-up chips that deepen, challenge or operationalize the last reply.
    ai: true
signature: Fork from an edited turn
sample: Consumer and enterprise chat assistants, sidebar copilots and voice assistants.
unit: One chat thread with its composer and context bindings.
