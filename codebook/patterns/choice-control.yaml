# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "choice-control". Edit between batches only — see README "Rules".
id: choice-control
name: Choice control
level: component
parent: enter-data
aliases:
  - radio buttons
  - checkboxes
  - select
  - segmented control
  - switch
definition: A control for picking one or several options from a known set.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - government
  - enterprise
  - productivity
anatomy:
  - name: Options
    role: The set
  - name: Selection
    role: What is chosen
  - name: Label
    role: What is being chosen
roles: []
dimensions:
  - name: Cardinality
    family: scope
    question: How many can be chosen?
    subdimensions:
      - id: cardinality
        name: Cardinality
        select: one
        values:
          - id: single-choice
            name: Single choice
            example: Radio buttons
          - id: multiple-choice
            name: Multiple choice
            example: Checkboxes
          - id: on-or-off
            name: On or off
            example: Switches
          - id: ranked-order
            name: Ranked order
            example: Ranked-choice ballots
  - name: Form
    family: layout
    question: What does the control look like?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: radio-list
            name: Radio list
            example: GOV.UK radios
          - id: checkbox-list
            name: Checkbox list
            example: Filters
          - id: dropdown-select
            name: Dropdown select
            example: Country pickers
          - id: segmented-control
            name: Segmented control
            example: iOS
          - id: switch
            name: Switch
            example: Settings
          - id: chips
            name: Chips
            example: Material filter chips
          - id: option-cards
            name: Option cards
            example: Plan pickers
  - name: Option content
    family: content
    question: What does an option say?
    subdimensions:
      - id: option
        name: Option content
        select: many
        values:
          - id: label-only
            name: Label only
            example: Most
          - id: label-and-description
            name: Label and description
            example: GOV.UK radio hints
          - id: icon-or-image
            name: Icon or image
            example: Colour choices
          - id: price-or-consequence
            name: Price or consequence
            example: Shipping options
          - id: recommended-badge
            name: Recommended badge
            example: Plan cards
  - name: Effect timing
    family: feedback
    question: When does a choice take effect?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: immediately
            name: Immediately
            example: Switches
          - id: on-submit
            name: On submit
            example: Forms
          - id: previewed
            name: Previewed
            example: Theme choosers
  - name: Many options
    family: adaptation
    question: What happens when the set is large?
    subdimensions:
      - id: largeSets
        name: Large sets
        select: one
        values:
          - id: show-all
            name: Show all
            example: Short lists
          - id: scrolling-list
            name: Scrolling list
            example: Listboxes
          - id: searchable-select
            name: Searchable select
            example: Country comboboxes
          - id: show-more
            name: Show more
            example: Facet lists
wild:
  score: 0
  note: The form of a choice control is the designer’s.
  examples: []
techniques:
  - name: Promote or demote
    dimension: Form
    how: A dropdown someone uses constantly becomes visible segmented options; a rarely used radio group
      folds into a dropdown.
    ai: false
signature: Promote or demote
sample: Forms, settings and filters.
unit: One choice control.
relations:
  uses: []
  specializes: []
  neighbors:
    - tag-input
    - filter-controls
scores:
  ubiquity: 5
  potential: 2
  spec: 5
evidence: agent-coded
usage:
  - Hidden options in dropdowns are chosen less
questions:
  - Does promoting a control based on use break consistency across people?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.8609620102123113
  agreementFirstPass: 0.9181818181818182
  kappaFinal: 0.8726661646877178
  agreementFinal: 0.92
  pass: true
  perSub:
    cardinality:
      kappaFirstPass: 1
      agreementFirstPass: 1
      kappaFinal: 1
      agreementFinal: 1
      flag: null
    form:
      kappaFirstPass: 0.9405940594059405
      agreementFirstPass: 0.95
      kappaFinal: 1
      agreementFinal: 1
      flag: null
    option:
      kappaFirstPass: 0.872780280943546
      agreementFirstPass: 0.9428571428571428
      kappaFinal: 0.8843559267587527
      agreementFinal: 0.9416666666666667
      flag: null
    timing:
      kappaFirstPass: 0.6948118006103763
      agreementFirstPass: 0.75
      kappaFinal: 0.6948118006103763
      agreementFinal: 0.75
      flag: null
    largeSets:
      kappaFirstPass: 0.7257142857142856
      agreementFirstPass: 0.8
      kappaFinal: 0.7257142857142856
      agreementFinal: 0.8
      flag: null
  distribution:
    cardinality:
      Single choice: 15
      Multiple choice: 2
      On or off: 2
      Ranked order: 1
    form:
      Radio list: 5
      Checkbox list: 2
      Dropdown select: 3
      Segmented control: 2
      Switch: 2
      Chips: 1
      Option cards: 4
    option:
      Label only: 10
      Label and description: 4
      Icon or image: 6
      Price or consequence: 4
      Recommended badge: 1
    timing:
      Immediately: 9
      On submit: 10
      Previewed: 1
    largeSets:
      Show all: 13
      Scrolling list: 2
      Searchable select: 2
      Show more: 1
      n/a: 2
  exemplars:
    cardinality:
      Single choice:
        - iOS Settings — Appearance Light/Dark
        - macOS System Settings — Appearance
        - GOV.UK — Do you live in the UK? question
      Multiple choice:
        - Zillow — Home type filter
        - Amazon — Brand facet in the left rail
      On or off:
        - iOS Settings — Wi-Fi on/off
        - Android Settings — Dark theme
      Ranked order:
        - Qualtrics — Rank order question
    form:
      Radio list:
        - GOV.UK — Do you live in the UK? question
        - Amazon — Delivery speed options
        - iCloud+ — Upgrade storage plan
      Checkbox list:
        - Zillow — Home type filter
        - Amazon — Brand facet in the left rail
      Dropdown select:
        - Stripe Checkout — Country field
        - Windows 11 Settings — Choose your mode
        - Microsoft Word — Font family box
      Segmented control:
        - Airbnb — Type of place filter
        - Apple Maps — Travel mode in directions
      Switch:
        - iOS Settings — Wi-Fi on/off
        - Android Settings — Dark theme
      Chips:
        - Google Maps — Category buttons under the search bar
      Option cards:
        - iOS Settings — Appearance Light/Dark
        - macOS System Settings — Appearance
        - Netflix — Choose your plan
    option:
      Label only:
        - iOS Settings — Wi-Fi on/off
        - GOV.UK — Do you live in the UK? question
        - Zillow — Home type filter
      Label and description:
        - Amazon — Delivery speed options
        - Netflix — Choose your plan
        - GitHub — Create repository visibility
      Icon or image:
        - iOS Settings — Appearance Light/Dark
        - macOS System Settings — Appearance
        - GitHub — Create repository visibility
      Price or consequence:
        - Amazon — Delivery speed options
        - Netflix — Choose your plan
        - iCloud+ — Upgrade storage plan
      Recommended badge:
        - Netflix — Choose your plan
    timing:
      Immediately:
        - iOS Settings — Wi-Fi on/off
        - iOS Settings — Appearance Light/Dark
        - macOS System Settings — Appearance
      On submit:
        - GOV.UK — Do you live in the UK? question
        - Amazon — Delivery speed options
        - Netflix — Choose your plan
      Previewed:
        - Microsoft Word — Font family box
    largeSets:
      Show all:
        - iOS Settings — Appearance Light/Dark
        - macOS System Settings — Appearance
        - GOV.UK — Do you live in the UK? question
      Scrolling list:
        - Google Maps — Category buttons under the search bar
        - Uber — Choose a ride
      Searchable select:
        - Stripe Checkout — Country field
        - Microsoft Word — Font family box
      Show more:
        - Amazon — Brand facet in the left rail
  unobserved: []
  unresolved:
    - sub: form
      n: 14
    - sub: option
      n: 20
  proposals:
    raised: 5
    adopted: []
    recorded:
      - place: sub:form
        sub: form
        dim: null
        name: Sortable list
        gloss: Options are put into an order by dragging or numbering rather than picked (Qualtrics rank
          order, ranked-choice ballots)
        raters:
          - fable
        instances:
          - 14
        status: raised
      - place: sub:form
        sub: form
        dim: null
        name: Draggable list
        gloss: Options are put into an order by dragging them, or by typing a rank against each — the only
          form that can express the Ranked order cardinality the codebook already lists
        raters:
          - opus
        instances:
          - 14
        status: raised
      - place: sub:option
        sub: option
        dim: null
        name: Option rendered as its effect
        gloss: The option is drawn as the thing it will do — a font name set in its own face, a colour named
          in that colour — so the label and the sample are the same object
        raters:
          - opus
        instances:
          - 20
        status: raised
      - place: sub:form
        sub: form
        dim: null
        name: Rankable list
        gloss: Items are dragged into order, or numbered 1 to N, rather than picked from a static list of
          pre-fixed options.
        raters:
          - sonnet
        instances:
          - 14
        status: raised
      - place: sub:option
        sub: option
        dim: null
        name: Live-styled label
        gloss: The option's own label is rendered in the style it represents (e.g. each font name set in its
          own typeface) rather than plain text, an icon, a description, a price or a badge.
        raters:
          - sonnet
        instances:
          - 20
        status: raised
  raterNotes:
    fable:
      - Ranked order has a cardinality but no form; proposed Sortable list. Timing for selects that
        reshape a form (country) or update a running total was coded by the visible effect, not the
        final submit.
    opus:
      - "I read Label only strictly (nothing but the label) so it never co-occurs with the richer
        variations. Timing needed a rule: Immediately where the choice acts on the product itself
        with no confirm, On submit where it is data waiting on a button, and Previewed only for
        genuine live preview on hover (Word), not for options that merely picture themselves
        (Appearance thumbnails) — that line is the likeliest disagreement. largeSets is n/a for
        switches, which have no set at all."
    sonnet:
      - largeSets marked n/a for the two plain on/off switches (instances 1, 15) — a binary toggle
        has no 'set' for the dimension to describe, which is different from an honest '?'.
  codedAt: 2026-09-22
previews:
  - file: choice-control.svg
sources:
  - note: Seed entry from the original Pattern Atlas (codebook.html)
