# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "transact". Edit between batches only — see README "Rules".
id: transact
name: Transact and commit
level: archetype
aliases:
  - commitment
  - purchase
  - decision
definition: Make a consequential choice, commit to it, and be able to take it back.
data: sequence
platforms:
  - web
  - mobile
domains:
  - commerce
  - finance
  - travel
  - government
  - enterprise
anatomy:
  - name: Options
    role: What can be chosen
  - name: Commitment
    role: The moment of choosing
  - name: Confirmation
    role: Proof it happened
  - name: Reversal
    role: How to undo it
roles:
  - price
  - total
  - deadline
dimensions:
  - name: Commit structure
    family: flow
    question: How many steps stand between choosing and committing?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: one-click
            name: One-click
            example: Amazon 1-Click
          - id: review-then-confirm
            name: Review then confirm
            example: Checkout review pages
          - id: multi-party-approval
            name: Multi-party approval
            example: Expense approvals
          - id: hold-then-commit
            name: Hold, then commit
            example: Ticket holds
  - name: Consequence disclosure
    family: feedback
    question: What is said about consequences before committing?
    subdimensions:
      - id: disclosure
        name: Disclosure
        select: many
        values:
          - id: cost-breakdown
            name: Cost breakdown
            example: Taxes and fees
          - id: irreversibility-warning
            name: Irreversibility warning
            example: Non-refundable fares
          - id: timing-estimate
            name: Timing estimate
            example: Delivery dates
          - id: terms-summary
            name: Terms summary
            example: Subscription renewals
  - name: Reversal
    family: lifecycle
    question: How can it be taken back?
    subdimensions:
      - id: reversal
        name: Reversal
        select: one
        values:
          - id: irreversible
            name: Irreversible
            example: Wire transfers
          - id: undo-window
            name: Undo window
            example: Gmail undo send
          - id: cancel-within-a-period
            name: Cancel within a period
            example: Free cancellation
          - id: return-process
            name: Return process
            example: Retail returns
  - name: Defaults and nudges
    family: initiative
    question: How does the system shape the choice?
    subdimensions:
      - id: nudges
        name: Nudges
        select: one
        values:
          - id: neutral
            name: Neutral
            example: Government forms
          - id: recommended-option
            name: Recommended option
            example: Most popular plan
          - id: pre-selected-add-ons
            name: Pre-selected add-ons
            description: A deceptive pattern
            example: Travel insurance pre-ticked
          - id: personalized-suggestion
            name: Personalized suggestion
            example: Buy again
          - id: scarcity-pressure
            name: Scarcity pressure
            description: The choice is shaped by manufactured urgency rather than by a recommendation — only 2
              left at this price, 12 other people are looking, this deal ends in 9 minutes
            example: Booking.com — Hotel reservation confirm
  - name: Unit
    family: scope
    question: What is being committed to?
    subdimensions:
      - id: unit
        name: Unit
        select: one
        values:
          - id: one-item
            name: One item
            example: Buy now
          - id: a-cart
            name: A cart
            example: Checkout
          - id: a-subscription
            name: A subscription
            example: Streaming plans
          - id: a-group-transaction
            name: A group transaction
            example: Venmo requests
wild:
  score: 1
  note: Saved payment and one-click settings are the only common levers.
  examples:
    - name: Amazon
      note: 1-Click settings
techniques:
  - name: Consequence preview
    dimension: Consequence disclosure
    how: Before committing, a plain list of every effect (charges, notifications, cancellation
      deadline), each an attribute that can be surfaced into the button itself.
    ai: false
  - name: Check this against my rules
    dimension: Defaults and nudges
    how: Compare a transaction with the person’s stated budget and preferences before commit.
    ai: true
signature: Consequence preview
sample: Retail, travel, banking, subscription and government payment flows.
unit: One commit flow.
relations:
  uses:
    - confirmation
    - undo
    - stepper
    - choice-control
  specializes: []
  neighbors:
    - enter-data
    - schedule
scores:
  ubiquity: 5
  potential: 3
  spec: 4
evidence: agent-coded
usage:
  - Cost surprises at the last step drive abandonment
questions:
  - Which parts of a transaction may a person customize without weakening consent?
coding:
