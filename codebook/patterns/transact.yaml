  raterNotes:
    fable:
      - "unit: coded every P2P payment (Venmo Pay, Zelle, Wise) as One item since a single transfer
        has one counterparty; the codebook's 'A group transaction' exemplar (Venmo requests)
        describes splits and requests, which the sample does not locate. Reversal is pick-one, so
        flows with both a cancel period and returns (Amazon) took the later, longer mechanism."
      - unit has no value for a transfer to one person; the Venmo exemplar under A group transaction
        pulls two-party payments into it. nudges lacks scarcity, the commonest travel nudge. Cost
        breakdown needs a line on whether a single price with plus taxes counts.
    opus:
      - "unit has no variation for a peer-to-peer payment: the codebook's A group transaction names
        Venmo, so I used it for Venmo, Zelle and Wise while noting each is two-party. reversal is
        pick-one but eBay's screen holds two flows at once (a binding bid and a returnable
        purchase), and most subscriptions are cancel-before-renewal rather than cancel-for-refund,
        which Cancel within a period only half describes."
      - "unit has no value for a transfer to a person: One item means an item and A group
        transaction means a split, so Venmo, Zelle and Wise all have to be filed under a name that
        misdescribes them. Cost breakdown's gloss ('taxes and fees') does not say whether a single
        stated price counts, which is where most of the disclosure disagreement sits. nudges is pick
        one but Booking.com truthfully holds both a recommendation label and scarcity pressure — it
        wants to be pick any."
    sonnet:
      - Whether an add-on or trial offer counts as a 'nudge' was often a judgment call; coded
        Neutral wherever the sample didn't explicitly flag a highlighted, pre-ticked, or
        personalized option.
      - "Three codebook problems surfaced in reconciliation: (1) disclosure's Cost breakdown gloss
        ('Taxes and fees') is ambiguous between 'a price is shown' and 'the price is broken into
        summed components' — a flat subscription price (Netflix, Spotify) split raters until the
        itemization reading was made explicit; it should be tightened to require multiple
        components. (2) disclosure's Irreversibility warning got conflated with the separate
        reversal characteristic more than once (Robinhood, Uber, Wise) — a warning is something said
        on screen, not an inference from the reversal mechanism, and the gloss should say so
        explicitly. (3) reversal and unit are pick-one but eBay's Bid-or-Buy-It-Now (irreversible
        bid vs. return-process purchase) truthfully spans two variations at once, which is a real
        gap rather than a rater error; nudges also had no variation for manufactured
        scarcity/urgency (Booking.com's 'only 2 left'), which +Scarcity pressure now covers."
  codedAt: 2026-09-22
