# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "inbox". Edit between batches only — see README "Rules".
id: inbox
name: Inbox
level: pattern
parent: communicate
aliases:
  - email client
  - mailbox
  - triage queue
  - shared inbox
definition: A list of messages or requests awaiting attention, each opened, acted on and cleared.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - communication
  - enterprise
  - commerce
anatomy:
  - name: Message list
    role: What is waiting
  - name: Folders or labels
    role: Organization
  - name: Reading view
    role: One message
  - name: Triage actions
    role: Archive, snooze, assign
  - name: Composer
    role: Replies
roles:
  - sender
  - subject
  - snippet
  - date
  - label
  - attachment
dimensions:
  - name: Organization
    family: composition
    question: How are messages sorted into places, and grouped?
    subdimensions:
      - id: organization
        name: Organization
        select: one
        values:
          - id: folders
            name: Folders
            example: Outlook
          - id: labels
            name: Labels
            example: Gmail
          - id: automatic-categories
            name: Automatic categories
            example: Gmail Primary, Social, Promotions
          - id: split-inboxes-by-rule
            name: Split inboxes by rule
            example: Superhuman Split Inbox
      - id: grouping
        name: Message grouping
        select: one
        values:
          - id: individual-messages
            name: Individual messages
            example: Outlook without conversations
          - id: conversation-threads
            name: Conversation threads
            example: Gmail conversation view
          - id: bundles
            name: Bundles
            example: Google Inbox bundles (discontinued)
  - name: Reading arrangement
    family: layout
    question: Where does a message open, and how dense is the list?
    subdimensions:
      - id: openIn
        name: Reading pane
        select: one
        values:
          - id: side-by-side
            name: Side-by-side
            example: Gmail reading pane right
          - id: under-overview
            name: Under overview
            example: Gmail reading pane below
          - id: replace
            name: Replace
            example: Gmail with no split
          - id: new-page
            name: New page
            example: Phone mail apps
      - id: density
        name: Row density
        select: one
        values:
          - id: compact
            name: Compact
            example: Gmail compact
          - id: default
            name: Default
            example: Gmail default
          - id: comfortable
            name: Comfortable
            example: Gmail comfortable
  - name: Triage model
    family: flow
    question: What does clearing a message mean?
    subdimensions:
      - id: triage
        name: Triage
        select: one
        values:
          - id: read-and-file
            name: Read and file
            example: Outlook folders
          - id: archive-to-zero
            name: Archive to zero
            example: Superhuman
          - id: snooze-until-later
            name: Snooze until later
            example: Gmail snooze
          - id: assign-to-a-teammate
            name: Assign to a teammate
            example: Front shared inboxes
          - id: close-or-solve
            name: Close or solve
            description: Clearing means setting the ticket's status to solved/closed; assignment is a step along
              the way, not the clearing act
            example: Zendesk — Agent ticket views
          - id: reading-is-triage
            name: Reading is triage
            description: "Nothing is archived or filed: an item leaves the attention list simply by being read
              (HEY's Previously seen, Slack Activity)"
            example: HEY — Imbox
          - id: mark-as-read
            name: Mark as read
            description: "Clearing means marking read: there is no destination, no archive and no file — the
              item simply stops being unread"
            example: HEY — Imbox
  - name: Row attributes
    family: content
    question: What does each row show?
    subdimensions:
      - id: rowAttributes
        name: Attributes
        select: many
        values:
          - id: sender
            name: Sender
            example: All
          - id: subject
            name: Subject
            example: All
          - id: snippet
            name: Snippet
            example: Gmail
          - id: attachment-chips
            name: Attachment chips
            example: Gmail attachment previews
          - id: labels
            name: Labels
            example: Gmail
          - id: generated-summary-or-deadline
            name: Generated summary or deadline
            example: CHI '25 Response Deadline attribute
          - id: assignee
            name: Assignee
            description: The row shows who owns the item — an avatar or name for the teammate it is assigned to
              — which only exists in shared inboxes
            example: Front — Shared inbox
          - id: status
            name: Status
            description: The row shows a workflow state the item moves through (new, open, pending, solved) and
              often a priority field, distinct from a user-applied label
            example: Zendesk — Agent ticket views
  - name: Prioritization
    family: initiative
    question: Who decides what matters first?
    subdimensions:
      - id: priority
        name: Priority
        select: one
        values:
          - id: chronological
            name: Chronological
            example: Default inboxes
          - id: importance-markers
            name: Importance markers
            example: Gmail Important
          - id: focused-and-other
            name: Focused and Other
            example: Outlook Focused Inbox
          - id: priority-sections
            name: Priority sections
            example: Gmail Priority Inbox
  - name: Deferral
    family: lifecycle
    question: How can a message come back later?
    subdimensions:
      - id: deferral
        name: Deferral
        select: many
        values:
          - id: none
            name: None
            example: Basic clients
          - id: snooze
            name: Snooze
            example: Gmail
          - id: scheduled-send
            name: Scheduled send
            example: Gmail
          - id: follow-up-nudges
            name: Follow-up nudges
            example: Gmail nudges
wild:
  score: 3
  note: Email is one of the few overview–detail interfaces where layout and density are routinely
    offered.
  examples:
    - name: Gmail
      note: Reading pane position, density, inbox type, category tabs on or off
    - name: Outlook
      note: Focused Inbox and conversation view toggles
techniques:
  - name: Surfaced deadlines
    dimension: Row attributes
    how: Generate an attribute such as Response Deadline from message bodies, surface it into rows and
      sort by it (CHI '25 §5.1.3), generalized to any extracted field.
    ai: true
  - name: Rule from example
    dimension: Organization
    how: Select a few messages and file them; the inbox proposes the rule and the split it would create.
    ai: true
  - name: Split by query
    dimension: Organization
    how: Any saved search becomes its own inbox section, reorderable and collapsible.
    ai: false
signature: Surfaced deadlines
sample: Email clients, shared inboxes, support desks and notification triage tools.
unit: One inbox view.
