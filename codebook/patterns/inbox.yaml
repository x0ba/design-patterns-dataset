        sub: triage
        dim: Triage model
        name: Sort into stacks
        gloss: Clearing a message means dragging it into a designated pile (e.g., Set Aside, Reply Later)
          rather than filing, archiving, snoozing on a timer, or assigning it to someone
        raters:
          - sonnet
        instances:
          - 6
        status: raised
  raterNotes:
    fable:
      - "organization is n/a for single-list notification inboxes (Linear, Notion). priority:
        'Importance markers' used whenever rows carry an importance flag though sort stays
        chronological (Gmail, Zendesk, Intercom, Freshdesk). Gmail's Labels vs Automatic categories
        overlap: coded the storage model, not the default view."
      - organization mixes a storage model (Folders, Labels) with a view model (Automatic
        categories, Split inboxes), so Gmail and Apple Mail hold two values at once. Replace and New
        page both mean the list goes away and need a sharper line. density is Gmail-relative with no
        absolute anchor. Bundles overlaps Automatic categories.
    opus:
      - triage is pick-one but mail clients offer archive, file and snooze at once; I coded the
        product's primary clearing gesture and noted the rest. organization does not fit
        notification inboxes (Notion has no organising structure at all, coded n/a; GitHub's repo
        grouping and Slack's filter tabs I read as Automatic categories). rowAttributes had no way
        to say assignee or status, which is most of what a support row carries.
      - organization is pick one but Proton, Gmail and Apple Mail all run two systems at once
        (folders and labels, labels and automatic categories), so it wants to be pick any; and
        organization's Automatic categories overlaps grouping's Bundles for Spark and GitHub, which
        is where those two subs split us.
    sonnet:
      - Ticketing tools (Zendesk, Freshdesk) carry priority/status fields that only loosely map onto
        rowAttributes' vocabulary (built for email, not tickets); coded the closest available values
        rather than proposing a ticket-specific field.
      - "Four codebook problems. (1) organization is pick one but Gmail is the codebook's own
        exemplar for both Labels and Automatic categories, and Proton and Apple Mail genuinely have
        two filing models at once — it should be pick any, or the gloss should say to code the
        storage model and let categories be a view. (2) organization and grouping overlap: bundling
        can be read as either, which is what split GitHub and Spark; I resolved it by a rule
        (organization = how the list is divided into places, grouping = what one row represents) and
        the codebook should state it. (3) density has no absolute anchor — its three values are
        Gmail's own settings, so for every product without a density control raters were judging
        spaciousness by feel, which produced six disagreements. (4) triage is missing two whole
        models that the sample kept hitting, status-close (helpdesks) and nothing-to-file (HEY,
        Slack), and rowAttributes, built for email, has no owner or workflow state; both adopted
        proposals came from that."
