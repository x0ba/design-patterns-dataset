  raterNotes:
    fable:
      - Writing assistance coded for what the editor itself ships (browser spellcheck and paid AI
        add-ons excluded), which leaves many empty arrays; OneNote's free-form containers fit no
        document model.
      - "assistance needs a rule for bundled AI: Gemini, Copilot, Notion AI, Atlassian Intelligence
        and Writing Tools are now included in the plans the editor is sold in, so 'what the editor
        ships' has to count them, and browser spellcheck versus an in-app spellcheck setting needs
        the same rule. page's Pageless versus Fixed reading column should be glossed by whether
        there is a fixed measure. access should say whether hardware-keyboard shortcuts count for a
        mobile instance."
    opus:
      - Tracking is pick-one over mechanisms that coexist — Google Docs has suggestion mode and
        version history, Word has both too — so the code records the stronger one and loses the
        other. Assistance also cannot distinguish help the editor ships from the operating system's
        (Apple Intelligence in Pages and Notes) or the browser's spellcheck, which I counted as
        absent.
      - "Most of this entry's disagreement was about where writing help comes from, so I re-coded
        assistance with one rule: count what the editor itself ships, not a paid AI add-on (Copilot,
        Gemini, Atlassian Intelligence, Craft AI) and not an OS-level service that appears in every
        text field (Apple's Writing Tools). Two glosses caused the rest: Outline sidebar is named
        for a desktop sidebar, so a mobile app that opens the same outline as a panel cannot be
        coded without argument; and Focus mode's gloss says 'dims everything but the sentence',
        which excludes block-granularity spotlights like WordPress's. Reading modes is also pick one
        over values that coexist — Obsidian and Typora each truthfully hold two — so I used the
        earlier-listed value as the tie-break."
    sonnet:
      - Tracking defaulted to None for personal note apps with no named versioning/suggestion
        feature, even where informal undo history exists.
      - "I systematically missed native, non-AI baseline features across this entry — OS-level
        spellcheck (assistance), a product's own keyboard shortcuts, and named version-history
        features (tracking) — because I was looking for the single most distinctive fact about each
        product rather than checking the full pick-any list. Two separate codebook-adjacent
        findings: (1) modes' Focus mode gloss ('dims everything but the sentence') describes iA
        Writer's specific implementation; Scrivener's Composition mode is the same general category
        of full-screen distraction-free writing without doing sentence-level dimming, and the gloss
        should generalise. (2) 'Assistance' and 'generation'-style dimensions keep splitting raters
        on whether a real but paid/opt-in AI feature (Copilot, Notion AI, Atlassian Intelligence,
        Apple Intelligence) counts if it's reached from inside the editor itself — I've resolved
        this round by crediting it whenever it's native to the product's own UI, regardless of
        pricing tier, the same standard I used for code-editor's Copilot-based cells."
