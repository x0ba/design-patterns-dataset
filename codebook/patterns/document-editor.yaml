# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "document-editor". Edit between batches only — see README "Rules".
id: document-editor
name: Document editor
level: pattern
parent: create
aliases:
  - word processor
  - rich-text editor
  - block editor
definition: Composing a flowing, structured document of text and embedded media.
data: document
platforms:
  - web
  - desktop
  - mobile
domains:
  - productivity
  - education
  - enterprise
  - news
  - science
anatomy:
  - name: Body
    role: The document
  - name: Blocks or paragraphs
    role: Units of content
  - name: Formatting tools
    role: How text changes form
  - name: Outline
    role: The document’s structure
  - name: Margin
    role: Comments and suggestions
roles:
  - heading
  - paragraph
  - media
  - table
dimensions:
  - name: Document model
    family: composition
    question: What is the document made of?
    subdimensions:
      - id: model
        name: Model
        select: one
        values:
          - id: flowing-rich-text
            name: Flowing rich text
            example: Microsoft Word
          - id: blocks
            name: Blocks
            example: Notion
          - id: markdown-with-live-preview
            name: Markdown with live preview
            example: Obsidian live preview
          - id: structured-source
            name: Structured source
            example: LaTeX in Overleaf
          - id: free-form-containers
            name: Free-form containers
            description: The page is a plane and the document is independent containers — text boxes, ink,
              images — placed at arbitrary positions; nothing reflows, so the document has no single
              linear order (OneNote, and digital-paper note apps generally)
            example: Microsoft OneNote — Page
          - id: free-form-canvas
            name: Free-form canvas
            description: The document is a page onto which text and ink containers can be dropped and positioned
              freely, rather than flowing text, discrete blocks, markdown or structured source
            example: Microsoft OneNote — Page
  - name: Formatting access
    family: invocation
    question: How is formatting applied?
    subdimensions:
      - id: access
        name: Access
        select: many
        values:
          - id: ribbon-or-toolbar
            name: Ribbon or toolbar
            example: Word ribbon
          - id: floating-selection-toolbar
            name: Floating selection toolbar
            example: Medium
          - id: slash-commands
            name: Slash commands
            example: Notion
          - id: markdown-shortcuts-while-typing
            name: Markdown shortcuts while typing
            example: Google Docs automatic Markdown
          - id: keyboard-shortcuts
            name: Keyboard shortcuts
            example: All
  - name: Page and navigation
    family: layout
    question: How is the document laid out and navigated?
    subdimensions:
      - id: page
        name: Page model
        select: one
        values:
          - id: paginated-print-layout
            name: Paginated print layout
            example: Word Print Layout
          - id: pageless
            name: Pageless
            example: Google Docs pageless
          - id: fixed-reading-column
            name: Fixed reading column
            example: Notion
          - id: source-beside-preview
            name: Source beside preview
            example: Overleaf
      - id: navAids
        name: Navigation aids
        select: many
        values:
          - id: none
            name: None
            example: Short notes
          - id: outline-sidebar
            name: Outline sidebar
            example: Google Docs outline
          - id: minimap
            name: Minimap
            example: Code-style editors
          - id: table-of-contents-block
            name: Table of contents block
            example: Notion
  - name: Change tracking
    family: feedback
    question: How are changes made visible?
    subdimensions:
      - id: tracking
        name: Tracking
        select: one
        values:
          - id: none
            name: None
            example: Personal notes
          - id: track-changes
            name: Track changes
            example: Word
          - id: suggestion-mode
            name: Suggestion mode
            example: Google Docs Suggesting
          - id: version-history
            name: Version history
            example: Google Docs history
  - name: Writing assistance
    family: initiative
    question: What does the editor contribute to the writing?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: spelling-and-grammar
            name: Spelling and grammar
            example: Word Editor
          - id: rewrite-suggestions
            name: Rewrite suggestions
            example: Grammarly
          - id: continue-writing
            name: Continue writing
            example: Notion AI
          - id: summarize-and-restructure
            name: Summarize and restructure
            example: Copilot in Word
  - name: Reading modes
    family: adaptation
    question: How does it adapt to focus and reading?
    subdimensions:
      - id: modes
        name: Modes
        select: one
        values:
          - id: standard
            name: Standard
            example: Default
          - id: focus-mode
            name: Focus mode
            description: Dims everything but the sentence
            example: iA Writer
          - id: read-mode
            name: Read mode
            example: Word Read Mode
          - id: typography-settings
            name: Typography settings
            example: Ulysses
wild:
  score: 3
  note: View modes, ribbons, page models and typography are routinely adjusted.
  examples:
    - name: Word
      note: Customize the ribbon; Read Mode; Focus
    - name: Google Docs
      note: Pageless setting and outline
    - name: iA Writer
      note: Focus mode
techniques:
  - name: Views of one document
    dimension: Page and navigation
    how: Outline, pages, pageless, source and reader mode are lenses over one structure that a person
      switches between mid-task.
    ai: false
  - name: Turn into
    dimension: Document model
    how: Convert a selection into another structure (list to table, paragraphs to board) in place, as in
      Notion’s Turn into.
    ai: false
  - name: Restructure as…
    dimension: Writing assistance
    how: “Restructure as a problem–solution memo” returns a reviewable diff, never a silent rewrite.
    ai: true
signature: Views of one document
sample: Office suites, note apps, publishing and scholarly writing tools.
unit: One editor for one document type.
