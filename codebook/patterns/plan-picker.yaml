        name: Stacked list
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - recommendation ('Most popular' badges) is the least stable thing on a pricing page and
        several codes are moderate confidence (Notion, Dropbox, Verizon). commitment is n/a for a
        calculator that sells nothing.
      - "presentation's Comparison table and disclosure's Full matrix below describe the same table
        from two sides, so raters split on which sub it belongs to. commitment's Upgrade now and
        Change any time are both true of every monthly SaaS plan. Local currency needs a gloss:
        localized regional pricing, or any price in the visitor's currency."
    opus:
      - "presentation and disclosure collapse into each other whenever the tiers are drawn as a
        comparison table (Netflix, Duolingo): the table is both the arrangement and the feature
        comparison, so Full matrix below is technically wrong — the matrix is not below anything.
        framing has no value for an add-on priced separately from the tier (Notion AI, Verizon
        perks, Copilot), which came up repeatedly."
      - "presentation and disclosure overlap: cards with a matrix beneath can be coded as either
        Tier cards side by side or Comparison table, and only reading disclosure's Full matrix below
        settles it — the two sub-dimensions need a sentence saying which one owns the table. Most
        popular highlight has no threshold, so an explicit badge and mere visual prominence get the
        same code. commitment mixes the CTA (Upgrade now, Free trial) with the term (Change any
        time, Contract), so almost every monthly SaaS plan truthfully holds two values. Local
        currency reads as either 'the price is regional' or 'the page offers a currency control',
        which split every consumer instance three ways."
    sonnet:
      - recommendation was 'None' for most enterprise SaaS pricing pages sampled, since the specific
        screen notes didn't call out a most-popular badge even though many such pages do have one in
        reality — coded strictly from what the sample and my recall together support rather than
        assuming every pricing page highlights a tier.
      - "Two codebook problems. (1) commitment's Upgrade now and Change any time collapse together
        for almost any SaaS plan that charges immediately with no trial but is also cancelable month
        to month (Notion, Figma, Zoom, GitHub, iCloud+, Google One) — nearly every instance without
        a trial gate truthfully holds both, and the tie-break (take the first-listed value that
        applies) mechanically favors Upgrade now every time, which may not be what the sub-dimension
        is meant to capture; it would help to scope Upgrade now specifically to app-store-style
        in-app-purchase mechanics rather than any immediate-charge web purchase. (2) presentation's
        Tier cards side by side has no room for a vertical single-column mobile list (YouTube,
        iCloud+, Google One) that is neither side-by-side cards nor a shared-row table — fable's
        proposed +Stacked list fills a real gap, and I adopted it. Separately (not a codebook
        problem, my own round-1 error): I had repeatedly coded presentation as Comparison table for
        any page that also showed a feature matrix somewhere on it, when the primary visual unit was
        actually highlighted cards with a matrix underneath (Slack, Figma, Zoom, GitHub, ChatGPT,
        Adobe) — Comparison table should be reserved for pages where tiers are literally columns of
        one shared table from the start (Netflix), which is a narrower case than I was applying it
        to."
  codedAt: 2026-09-22
