# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "plan-picker". Edit between batches only — see README "Rules".
id: plan-picker
name: Plan picker
level: pattern
parent: transact
aliases:
  - pricing table
  - tier selection
  - plan comparison
definition: Presenting tiers of a product or subscription to choose among.
data: collection
platforms:
  - web
  - mobile
domains:
  - software
  - entertainment
  - finance
  - mobility
anatomy:
  - name: Tiers
    role: The plans
  - name: Features
    role: What each includes
  - name: Price
    role: What each costs
  - name: Call to action
    role: Choosing one
roles:
  - tier
  - price
  - feature
dimensions:
  - name: Presentation
    family: layout
    question: How are tiers arranged?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: tier-cards-side-by-side
            name: Tier cards side by side
            example: SaaS pricing pages
          - id: comparison-table
            name: Comparison table
            example: Streaming plan tables
          - id: usage-slider
            name: Usage slider
            example: Usage-based pricing calculators
          - id: recommendation-quiz
            name: Recommendation quiz
            example: Mobile carrier plan finders
          - id: stacked-list
            name: Stacked list
            description: Tiers as a vertical list of rows with a radio or tap target, one line each, with no
              side-by-side columns or feature table (mobile upgrade sheets)
            example: YouTube — YouTube Premium offer
  - name: Feature disclosure
    family: content
    question: How are features compared?
    subdimensions:
      - id: disclosure
        name: Disclosure
        select: one
        values:
          - id: highlights-per-tier
            name: Highlights per tier
            example: Pricing cards
          - id: full-matrix-below
            name: Full matrix below
            example: SaaS feature tables
          - id: only-differences
            name: Only differences
            description: Everything in Pro, plus…
            example: Tiered SaaS
  - name: Recommendation
    family: initiative
    question: Does the page steer?
    subdimensions:
      - id: recommendation
        name: Recommendation
        select: one
        values:
          - id: none
            name: None
            example: Neutral tables
          - id: most-popular-highlight
            name: Most popular highlight
            example: SaaS pricing
          - id: personalized
            name: Personalized
            example: Upgrade prompts based on usage
          - id: preselected
            name: Preselected
            example: Annual plan preselected
  - name: Price framing
    family: encoding
    question: How is price expressed?
    subdimensions:
      - id: framing
        name: Framing
        select: many
        values:
          - id: monthly-or-annual-toggle
            name: Monthly or annual toggle
            example: SaaS pricing
          - id: per-seat
            name: Per seat
            example: Team plans
          - id: usage-estimate
            name: Usage estimate
            example: Cloud pricing
          - id: local-currency
            name: Local currency
            example: Regional pricing
  - name: Commitment
    family: lifecycle
    question: What does choosing commit to?
    subdimensions:
      - id: commitment
        name: Commitment
        select: one
        values:
          - id: upgrade-now
            name: Upgrade now
            example: In-app upgrades
          - id: free-trial
            name: Free trial
            example: SaaS trials
          - id: change-any-time
            name: Change any time
            example: Monthly plans
          - id: contract
            name: Contract
            example: Enterprise plans
wild:
  score: 0
  note: Pricing pages are fixed marketing surfaces.
  examples: []
techniques:
  - name: Price for my usage
    dimension: Price framing
    how: Enter your actual usage and every tier recomputes a real price and fit.
    ai: false
  - name: Which plan fits me?
    dimension: Recommendation
    how: An answer built from the person’s usage, showing the features it relied on.
    ai: true
signature: Price for my usage
sample: SaaS, streaming, mobile carrier and cloud pricing pages.
unit: One pricing surface.
