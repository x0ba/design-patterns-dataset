    recorded:
      - place: sub:prefill
        sub: prefill
        dim: null
        name: Profile autofill
        gloss: Fields fill from the person's existing account/profile inside the same product — not the
          browser, and not extraction from a freshly uploaded document.
        raters:
          - sonnet
        instances:
          - 9
        status: raised
  raterNotes:
    fable:
      - Prefill lacks the commonest case, the product's own profile, so I proposed it; timing lacks
        a no-validation option, which utility forms need. Single-row field pairs (expiry/CVV,
        first/last) were still coded Single column.
      - "columns: one rater coded every paired row (first/last, expiry/CVC) as Multiple columns, so
        the gloss should say a shared row inside a one-column form is still Single column; timing
        has no None and a live password meter makes While typing true beside On submit for the rest
        of the form, so it wants pick any or a which-check-wins rule; prefill lacks the product's
        own profile, which all three raters proposed under different names; commit is ambiguous
        about whether the unit is one page or the whole application."
    opus:
      - "prefill is the weak sub-dimension: Browser autofill is the only external source named, so
        every product that fills from your own account profile (LinkedIn, MyChart, Zocdoc) or from a
        records lookup (GEICO) has nowhere to go. grouping also collides with the wizard entry — for
        long applications I coded the page-splitting I can see, since Split across pages is offered
        here."
      - "columns caused a seventh of the disagreement on its own: the codebook does not say whether
        two fields sharing a row (first/last, expiry/CVC, city/state/ZIP) make a form multi-column,
        and it should — Multiple columns means a form laid out in columns of fields, not a paired
        row. timing mixes when (submit/blur/typing) with how (Asynchronous check), so a username
        check is both; grouping mixes visual grouping with pagination, so any wizard-shaped form is
        both Sections with headings and Split across pages and that sub-dimension wants to be pick
        any. errors needs a value for a complaint that arrives as the next conversational turn."
    sonnet:
      - Pick-one timing forces a choice between simultaneous checks (e.g. while-typing password
        rules and async username checks in the same account-creation form); I picked the more
        architecturally central one and named the other in the note rather than guessing a second
        sub-dimension.
      - prefill keeps forcing a pick-one choice where a product truly has both a blank baseline and
        a profile/records-based fill for returning users or later steps (instances 8, 9, 16, 20) —
        it wants to be pick-any, or the codebook needs an explicit 'first use vs. returning use'
        convention. Three raters independently proposed the same 'fills from the product's own
        profile' idea (instances 9, 14, 15) under three different names before this round; worth
        promoting to a real variation.
