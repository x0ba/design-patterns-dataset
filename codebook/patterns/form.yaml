# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "form". Edit between batches only — see README "Rules".
id: form
name: Form
level: pattern
parent: enter-data
aliases:
  - input form
  - questionnaire
definition: A set of labelled fields that collects structured data and submits it together.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - government
  - commerce
  - finance
  - health
  - enterprise
anatomy:
  - name: Field
    role: Label, input, hint and error
  - name: Section
    role: A group of fields
  - name: Actions
    role: Submit, cancel, save
  - name: Error summary
    role: All problems in one place
roles:
  - label
  - hint
  - error
  - input
dimensions:
  - name: Field layout
    family: layout
    question: How are labels and fields arranged?
    subdimensions:
      - id: labels
        name: Label placement
        select: one
        values:
          - id: top-aligned
            name: Top-aligned
            example: GOV.UK Design System
          - id: left-aligned
            name: Left-aligned
            example: Desktop preference dialogs
          - id: floating-label
            name: Floating label
            example: Material text fields
          - id: placeholder-as-label
            name: Placeholder as label
            description: Disappears on typing
            example: Common, and an accessibility problem
          - id: conversational-prompt
            name: Conversational prompt
            description: The question is asked as a chat message; there is no persistent field label, only a
              bare input for the reply.
            example: Lemonade — Renters insurance quote
          - id: prompt-bubble
            name: Prompt bubble
            description: The question is a chat message in the conversation above a shared composer; no label is
              attached to the control itself
            example: Lemonade — Renters insurance quote
      - id: columns
        name: Columns
        select: one
        values:
          - id: single-column
            name: Single column
            example: GOV.UK
          - id: multiple-columns
            name: Multiple columns
            example: Enterprise record forms
          - id: sentence-form
            name: Sentence form
            description: Fields inside a sentence
            example: Fill-in-the-blanks (Tidwell)
  - name: Grouping
    family: composition
    question: How are fields grouped?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: flat
            name: Flat
            example: Short forms
          - id: sections-with-headings
            name: Sections with headings
            example: Account settings
          - id: collapsible-optional-sections
            name: Collapsible optional sections
            example: Advanced options
          - id: split-across-pages
            name: Split across pages
            example: Becomes a wizard
  - name: Validation
    family: feedback
    question: When and how are problems shown?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: on-submit
            name: On submit
            example: GOV.UK
          - id: on-leaving-a-field
            name: On leaving a field
            example: Many sign-up forms
          - id: while-typing
            name: While typing
            example: Password rules
          - id: asynchronous-check
            name: Asynchronous check
            example: Username availability
          - id: none
            name: None
            description: Input is never checked; the form accepts whatever is entered (fillable PDFs, contact
              cards, password-manager items)
            example: Adobe Acrobat Reader — IRS W-9 fillable PDF
      - id: errors
        name: Error presentation
        select: many
        values:
          - id: inline-under-the-field
            name: Inline under the field
            example: Most forms
          - id: summary-linking-to-fields
            name: Summary linking to fields
            example: GOV.UK error summary
          - id: field-highlight
            name: Field highlight
            example: Red outlines
          - id: toast
            name: Toast
            example: Some single-page apps
  - name: Prefill
    family: initiative
    question: What arrives already filled?
    subdimensions:
      - id: prefill
        name: Prefill
        select: one
        values:
          - id: blank
            name: Blank
            example: Contact forms
          - id: smart-defaults
            name: Smart defaults
            example: Good defaults (Tidwell)
          - id: browser-autofill
            name: Browser autofill
            example: Checkout addresses
          - id: extracted-from-a-document
            name: Extracted from a document
            example: Résumé parsing on job applications
          - id: from-account-profile
            name: From account profile
            description: Fields arrive filled from the product's own stored profile or record (LinkedIn Easy
              Apply contact info, MyChart chart data, Zocdoc patient details) — neither the browser
              nor a document
            example: LinkedIn — Easy Apply
          - id: autofill-from-a-profile
            name: Autofill from a profile
            description: Fields arrive filled from the person's own stored account profile or record in this
              product, not from the browser — the archetype entry already has this variation and the
              form entry lacks it
            example: LinkedIn — Easy Apply
          - id: looked-up-from-records
            name: Looked up from records
            description: Fields arrive filled from a third-party or public-records lookup keyed on what the
              person has already given (insurance quotes filling in your vehicles and household
              drivers)
            example: GEICO — Auto insurance quote
  - name: Help
    family: content
    question: What helps a person answer?
    subdimensions:
      - id: help
        name: Help
        select: many
        values:
          - id: none
            name: None
            example: Short forms
          - id: hint-text
            name: Hint text
            example: GOV.UK hints
          - id: format-examples
            name: Format examples
            example: Input hints (Tidwell)
          - id: tooltip-help
            name: Tooltip help
            example: Tax forms
          - id: why-we-ask
            name: Why we ask
            example: Privacy-conscious sign-ups
  - name: Commit
    family: lifecycle
    question: How is the form saved?
    subdimensions:
      - id: commit
        name: Commit
        select: one
        values:
          - id: submit-button
            name: Submit button
            example: Most forms
          - id: autosave-per-field
            name: Autosave per field
            example: Notion page properties
          - id: save-draft
            name: Save draft
            example: Job applications
          - id: review-page-before-submit
            name: Review page before submit
            example: GOV.UK check your answers
          - id: save-the-file
            name: Save the file
            description: The filled form is a document the person saves or sends themselves; there is no submit
              to a system at all
            example: Adobe Acrobat Reader — IRS W-9 fillable PDF
wild:
  score: 1
  note: Autofill is the only widespread end-user lever.
  examples:
    - name: Browsers
      note: Autofill profiles
techniques:
  - name: Optional field folding
    dimension: Grouping
    how: Fold away optional fields you never fill, pin the ones you always do, remembered per form.
    ai: false
  - name: Paste to fill
    dimension: Prefill
    how: Paste a block of text or drop a document; fields fill with inferred values highlighted for
      confirmation.
    ai: true
  - name: Forgiving formats
    dimension: Validation
    how: Accept any reasonable format and show the interpretation instead of an error.
    ai: false
signature: Optional field folding
sample: Government services, sign-up and checkout, insurance quotes, health intake.
unit: One form.
