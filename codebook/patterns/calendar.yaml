  raterNotes:
    fable:
      - inviteFlow and rsvpVisibility are n/a for database/LMS calendars with no invite concept
        (Notion, Canvas, Moodle, Asana, Trello, Airtable). detailDepth for Outlook desktop follows
        the single-click peek rather than the codebook's 'Side panel' exemplar.
      - inviteFlow's Send on save and Optional guests are not exclusive, every calendar here does
        both. Edit fields only reads as exclusive with drag, so raters who list both make it
        pick-any-with-a-contradiction. Search events needs to say whether global search counts.
    opus:
      - "The task-database calendars (Notion, Asana, Trello, Airtable, Canvas, Moodle) have no
        invitations, so inviteFlow and rsvpVisibility are n/a for six of twenty — the pattern as
        written assumes a real calendar rather than a date view over records. detailDepth's Inline
        expand never fired: the codebook names Google Schedule view for it, but on the phone that
        view opens a full screen, so raters may split on that cell."
      - moveResize's Edit fields only is glossed 'no direct manipulation', so it is mutually
        exclusive with Drag to new time — coding it as an additional capability (as I did in round
        1) is a trap the pick-any framing invites. inviteFlow's Optional guests is ambiguous between
        marking a guest optional and guests being optional at all.
    sonnet:
      - inviteFlow and rsvpVisibility genuinely don't apply to non-invite calendar surfaces (Notion
        database, Canvas, Moodle, Asana, Trello, Airtable calendar views) since there is no
        guest/RSVP concept on a due-date or course-event card; coded n/a rather than force-fitting a
        value.
      - "Five codebook problems: (1) 'gridFields' mixes two mutually exclusive options ('Title only'
        vs 'Title and time') into a pick-any, so the array can be self-contradictory — they should
        be one pick-one sub-dimension or one should be dropped; (2) 'moveResize: Edit fields only'
        is glossed 'no direct manipulation', which makes it exclusive with Drag and Resize, yet it
        is the natural place to record 'you can also type the dates' — a separate sub-dimension is
        needed; (3) 'inviteFlow' is not a partition: Google Calendar is simultaneously Send on save,
        Optional guests and RSVP required, so this pick-one forces an arbitrary choice and was the
        hardest cell in the entry; (4) 'detailDepth' cross-cuts anchoring (in place vs dedicated)
        with depth (summary vs editor), so Moodle's centred modal summary fits Popover summary and
        Full page or modal equally; (5) the Inline expand exemplar names Google Calendar Schedule
        view, but on phone that surface pushes a full-screen detail — the exemplar needs a platform.
        Separately, most of my round-1 pick-any codes were too thin: I coded what a screenshot shows
        rather than what the surface supports, which the glosses ('pick any that apply') plainly ask
        for."
