# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "calendar". Edit between batches only — see README "Rules".
id: calendar
name: Calendar
level: pattern
parent: schedule
aliases:
  - calendar view
  - agenda
  - date grid
definition: A time-grid or agenda of events with start and end times, browsed by day, week or month
  and edited by creating, dragging or inviting.
data: time
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - enterprise
  - education
  - health
  - social
anatomy:
  - name: Time grid or agenda
    role: The visible span of time
  - name: Event block
    role: One scheduled item’s key attributes
  - name: Event detail
    role: The fuller look at one event
  - name: Calendar list
    role: Which calendars are shown
roles:
  - title
  - time
  - location
  - attendees
  - calendar-colour
dimensions:
  - name: Event content
    family: content
    question: What does each event show on the grid versus in detail?
    subdimensions:
      - id: gridFields
        name: Grid fields
        select: many
        values:
          - id: title-only
            name: Title only
            example: Dense month cells
          - id: title-and-time
            name: Title and time
            example: Google Calendar week
          - id: location-or-meet-link
            name: Location or Meet link
            example: Google Calendar with location
          - id: attendee-avatars
            name: Attendee avatars
            example: Outlook calendar with faces
          - id: calendar-colour
            name: Calendar colour
            description: Hue stands for source calendar
            example: Apple Calendar colour dots
          - id: status-marks
            name: Status marks
            description: Busy, free, out of office
            example: Outlook show-as
      - id: detailDepth
        name: Detail depth
        select: one
        values:
          - id: popover-summary
            name: Popover summary
            description: A few fields in place
            example: Google Calendar event popover
          - id: side-panel
            name: Side panel
            description: Editable detail beside the grid
            example: Outlook event panel
          - id: full-page-or-modal
            name: Full page or modal
            description: Dedicated event editor
            example: Apple Calendar event window
          - id: inline-expand
            name: Inline expand
            description: Agenda row expands
            example: Google Calendar Schedule view
  - name: View structure
    family: layout
    question: How is the span of time laid out?
    subdimensions:
      - id: primaryView
        name: Primary view
        select: one
        values:
          - id: day
            name: Day
            example: Google Calendar Day
          - id: week
            name: Week
            example: Outlook Work week
          - id: month
            name: Month
            example: Apple Calendar month
          - id: agenda-schedule-list
            name: Agenda / schedule list
            description: Chronological list without a grid
            example: Google Calendar Schedule
          - id: multi-day-custom
            name: Multi-day custom
            description: N-day strip
            example: Outlook 3–6 day views
          - id: year
            name: Year
            example: Apple Calendar year
      - id: multiLayout
        name: Multi-calendar layout
        select: one
        values:
          - id: overlay-on-one-grid
            name: Overlay on one grid
            description: Colours distinguish calendars
            example: Google Calendar overlays
          - id: side-by-side-columns
            name: Side-by-side columns
            description: One column per person
            example: Outlook Schedule view
          - id: stacked-agendas
            name: Stacked agendas
            description: Separate lists per calendar
            example: Some team tools
  - name: Creating and moving
    family: invocation
    question: How are events created, opened and repositioned?
    subdimensions:
      - id: createBy
        name: Create by
        select: many
        values:
          - id: click-empty-slot
            name: Click empty slot
            example: Google Calendar
          - id: drag-a-duration
            name: Drag a duration
            example: Outlook drag-to-create
          - id: compose-button
            name: Compose button
            example: New event FAB
          - id: natural-language
            name: Natural language
            description: Type “lunch Friday 1pm”
            example: Fantastical
          - id: from-email-or-chat
            name: From email or chat
            description: Offer to add a detected time
            example: Gmail add to Calendar
      - id: moveResize
        name: Move and resize
        select: many
        values:
          - id: drag-to-new-time
            name: Drag to new time
            example: Google Calendar
          - id: resize-ends
            name: Resize ends
            example: Outlook
          - id: edit-fields-only
            name: Edit fields only
            description: No direct manipulation
            example: Some mobile agendas
          - id: propose-new-time
            name: Propose new time
            description: Suggest without unilaterally moving
            example: Google Calendar propose new time
  - name: Coordination
    family: collaboration
    question: How do invites, responses and shared visibility work?
    subdimensions:
      - id: inviteFlow
        name: Invite flow
        select: one
        values:
          - id: send-on-save
            name: Send on save
            example: Outlook meeting
          - id: optional-guests
            name: Optional guests
            example: Google Calendar guests
          - id: rsvp-required
            name: RSVP required
            example: Most invite systems
          - id: hold-for-rooms-first
            name: Hold for rooms first
            description: Book resource then people
            example: Outlook room finder
      - id: rsvpVisibility
        name: Response visibility
        select: many
        values:
          - id: yes-no-maybe-list
            name: Yes / No / Maybe list
            example: Google Calendar
          - id: free-busy-only-to-others
            name: Free/busy only to others
            example: Exchange free/busy
          - id: hide-event-details
            name: Hide event details
            description: Private or confidential
            example: Outlook private events
          - id: see-guest-calendars-while-scheduling
            name: See guest calendars while scheduling
            example: Google Find a time
  - name: Working context
    family: adaptation
    question: How does the calendar adapt to working hours, timezone and device?
    subdimensions:
      - id: contextAdapt
        name: Context adaptation
        select: many
        values:
          - id: working-hours-shading
            name: Working hours shading
            example: Google Calendar working hours
          - id: timezone-labels
            name: Timezone labels
            example: World clock in Calendar
          - id: dense-mobile-agenda
            name: Dense mobile agenda
            description: List replaces grid
            example: iOS Calendar list
          - id: focus-do-not-disturb-mute
            name: Focus / do-not-disturb mute
            description: Hide or quiet after hours
            example: Focus filters affecting Calendar
  - name: Density and span
    family: scope
    question: Which events are in the current view, and how crowded is it?
    subdimensions:
      - id: filtering
        name: Filtering
        select: many
        values:
          - id: toggle-calendars
            name: Toggle calendars
            example: Google Calendar left rail
          - id: search-events
            name: Search events
            example: Outlook search
          - id: hide-declined
            name: Hide declined
            example: Google Calendar settings
          - id: only-mine-only-invited
            name: Only mine / only invited
            example: Team calendar filters
wild:
  score: 2
  note: View choice, overlays and working hours are common personal settings; grid field density and
    invite policy are rarely end-user malleable.
  examples:
    - name: Google Calendar
      note: View switcher, calendar toggles, working location
    - name: Outlook
      note: Overlay mode and conditional formatting
    - name: Apple Calendar
      note: Delegate and shared calendar toggles
techniques:
  - name: Fluid event fields
    dimension: Event content
    how: Surface or hide attributes from event detail onto every grid block (travel time, video link,
      project tag) per person, as Fluid Attributes does for collections.
    ai: false
  - name: View morph with selection held
    dimension: View structure
    how: Switch day/week/month/agenda while keeping the selected event and scroll anchor, so grain
      changes without losing place.
    ai: false
  - name: Schedule from intent
    dimension: Creating and moving
    how: “Find two hours with Ana next week near campus” proposes ranked slots with sources from each
      calendar and travel estimates.
    ai: true
signature: Fluid event fields
sample: Google Calendar, Outlook, Apple Calendar, Fantastical, Fastmail, and calendar views inside
  Notion, Linear and university LMS products.
unit: One calendar surface (one account’s visible calendars in one view mode).
