# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "status-tracker". Edit between batches only — see README "Rules".
id: status-tracker
name: Status tracker
level: pattern
parent: monitor
aliases:
  - order tracking
  - delivery status
  - progress tracker
definition: Showing where a process, order or journey is in its sequence of stages, and what happens next.
data: sequence
platforms:
  - mobile
  - web
domains:
  - commerce
  - mobility
  - government
  - health
anatomy:
  - name: Stages
    role: The sequence
  - name: Current stage
    role: Where it is now
  - name: Estimate
    role: When the next stage happens
  - name: Exceptions
    role: What went wrong
roles:
  - stage
  - timestamp
  - eta
  - location
dimensions:
  - name: Stage model
    family: flow
    question: How is progress structured?
    subdimensions:
      - id: stages
        name: Stages
        select: one
        values:
          - id: fixed-stages
            name: Fixed stages
            description: Ordered, shipped, delivered
            example: Amazon order tracking
          - id: stages-with-estimates
            name: Stages with estimates
            example: Visa application portals
          - id: live-location
            name: Live location
            example: Uber
          - id: exception-branches
            name: Exception branches
            description: Delayed, returned
            example: Carrier tracking
  - name: Stage detail
    family: content
    question: What does each stage tell you?
    subdimensions:
      - id: detail
        name: Detail
        select: many
        values:
          - id: stage-names
            name: Stage names
            example: All
          - id: timestamps
            name: Timestamps
            example: UPS tracking
          - id: estimated-time
            name: Estimated time
            example: Food delivery
          - id: responsible-party
            name: Responsible party
            example: Government casework
          - id: map
            name: Map
            example: Uber
  - name: Presentation
    family: layout
    question: Where and how is status shown?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: horizontal-progress-bar
            name: Horizontal progress bar
            example: Domino’s Tracker
          - id: vertical-timeline
            name: Vertical timeline
            example: Parcel tracking
          - id: map-with-moving-marker
            name: Map with moving marker
            example: Uber
          - id: lock-screen-live-activity
            name: Lock-screen live activity
            example: iOS Live Activities
          - id: status-statement
            name: Status statement
            description: The current state is written out as a sentence or paragraph with no sequence drawn — no
              bar, timeline or map; the common government casework shape, where the wording carries
              everything
            example: USCIS — Case Status Online
          - id: narrative-status-text
            name: Narrative status text
            description: The current stage is conveyed as a plain-language paragraph rather than a bar, timeline
              or map — typical of government casework portals
            example: USCIS — Case Status Online
  - name: Updates
    family: lifecycle
    question: How does status reach the person?
    subdimensions:
      - id: updates
        name: Updates
        select: one
        values:
          - id: on-visit
            name: On visit
            example: Web tracking pages
          - id: notification-per-stage
            name: Notification per stage
            example: Delivery apps
          - id: continuous-live
            name: Continuous live
            example: Ride-hailing
  - name: Exceptions
    family: feedback
    question: What happens when progress stalls?
    subdimensions:
      - id: exceptions
        name: Exceptions
        select: one
        values:
          - id: silent
            name: Silent
            example: Stale tracking pages
          - id: explaining-banner
            name: Explaining banner
            example: Airline delay banners
          - id: options-offered
            name: Options offered
            example: UPS My Choice reschedule
wild:
  score: 1
  note: People can choose notifications for some carriers; nothing else changes.
  examples:
    - name: UPS My Choice
      note: Delivery alerts and rescheduling
techniques:
  - name: Pick my milestones
    dimension: Updates
    how: "People choose which stage changes notify them, and where: lock screen, email or nothing."
    ai: false
  - name: Why is it late?
    dimension: Exceptions
    how: An explanation drawn from tracking events, with the options that are really available.
    ai: true
signature: Pick my milestones
sample: Retail, delivery, ride-hailing, travel and government casework.
unit: One tracked process.
relations:
  uses:
    - stepper
    - progress-indicator
    - banner
    - map-explorer
  specializes:
    - monitor
  neighbors:
    - stepper
    - agent-run
    - dashboard
scores:
  ubiquity: 4
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - People check trackers compulsively when estimates are vague
questions:
  - How should uncertainty in an estimate be shown?
coding:
