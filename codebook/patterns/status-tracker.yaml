    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.6625762491228647
  agreementFirstPass: 0.7277777777777777
  kappaFinal: 0.9374076146592055
  agreementFinal: 0.95
  pass: true
  perSub:
