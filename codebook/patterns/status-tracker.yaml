    - sub: stages
      n: 16
  proposals:
    raised: 2
    adopted:
      - sub: presentation
        name: Status statement
        raters:
          - opus
          - sonnet
      - sub: presentation
        name: Narrative status text
        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - "Stage model is a pick-one over things that mix: food delivery is fixed stages drawn on a
        live map, flights are stages with estimates plus a moving aircraft; coded the structure
        (stages) not the drawing."
      - stages is a pick one over values that mix structure (fixed stages) with rendering (live
        location) and with a branch (exceptions), so every food tracker with a map and every carrier
        splits three ways; it wants to be structure only, with the map under presentation.
        exceptions cannot separate a status headline that says Delayed from a banner that explains
        why.
    opus:
      - "Stages is the hardest cell: almost every tracker has both a fixed sequence and an estimate,
        so Fixed stages vs Stages with estimates turns on which the screen leads with, and Exception
        branches competes with the Exceptions dimension for the same evidence. Exceptions is also
        largely about a conditional state I am coding from memory of disruption, not from the screen
        the sample names."
      - "Stages is the fault: every tracker has a sequence, most have an estimate, and carriers have
        exception statuses, so three of the four variations are true at once and the code turns on
        which one the screen leads with. Exception branches also competes with the exceptions
        sub-dimension for the same evidence — one of them should be dropped or renamed."
    sonnet:
      - Government casework trackers (USCIS, GOV.UK) don't fit any of the four presentation
        variations; proposed +Narrative status text. Exceptions was often Silent by default with no
        evidence of an explaining path for the everyday case.
      - "I under-credited Stage names across most live/timestamped trackers (Uber, Lyft, UPS, USPS,
        United, Delta, FlightAware, DHL, Shop) — a systematic miss on my part, not a codebook
        problem: I was reading 'has timestamps/a map' as sufficient and forgetting that the
        timestamped events are also named. Separately, stages' Exception branches is glossed only as
        'carrier tracking' with no sharper test for when a delay is a structural fork vs. just an
        exceptions-dimension banner on an otherwise fixed line — FedEx/USPS/DHL only converged once
        I anchored on 'this is literally the named example' rather than judging the structure
        independently."
  codedAt: 2026-09-22
