  proposals:
    raised: 4
    adopted:
      - sub: swimlanes
        name: Manual lanes
        raters:
          - fable
          - opus
          - sonnet
      - sub: cardFields
        name: Amount or value
        raters:
          - fable
          - opus
          - sonnet
