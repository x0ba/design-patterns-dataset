# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "kanban-board". Edit between batches only — see README "Rules".
id: kanban-board
name: Kanban board
level: pattern
parent: browse-collections
aliases:
  - board
  - task board
  - pipeline
definition: Items as cards in columns that stand for states or categories; moving a card between
  columns changes its value.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - software
  - productivity
  - enterprise
  - finance
anatomy:
  - name: Board
    role: The whole set of columns
  - name: Column
    role: A value of the grouping attribute
  - name: Card
    role: One item’s key attributes
  - name: Swimlane
    role: An optional second grouping across columns
roles:
  - title
  - assignee
  - label
  - due-date
  - estimate
  - cover
dimensions:
  - name: Grouping
    family: composition
    question: What do columns and swimlanes stand for?
    subdimensions:
      - id: columns
        name: Column source
        select: one
        values:
          - id: workflow-status
            name: Workflow status
            description: Columns are workflow states
            example: Jira board
          - id: any-single-select-field
            name: Any single-select field
            description: Group by a chosen property
            example: Notion board, GitHub Projects
          - id: assignee
            name: Assignee
            description: One column per person
            example: Linear grouped by assignee
          - id: manual-lists
            name: Manual lists
            description: Columns are free-form lists
            example: Trello
      - id: swimlanes
        name: Swimlanes
        select: one
        values:
          - id: none
            name: None
            example: Trello
          - id: by-assignee
            name: By assignee
            example: Jira
          - id: by-parent-or-epic
            name: By parent or epic
            example: Jira swimlanes by epic
          - id: by-query
            name: By query
            description: Each lane is a saved filter
            example: Jira query swimlanes
          - id: manual-lanes
            name: Manual lanes
            description: Free-named lanes the team defines (e.g. Expedite) into which cards are placed by hand,
              not derived from a field
            example: Azure DevOps — Kanban board
  - name: Card and column content
    family: content
    question: What does each card and column say about its items?
    subdimensions:
      - id: cardFields
        name: Card attributes
        select: many
        values:
          - id: title
            name: Title
            example: All boards
          - id: assignee-avatar
            name: Assignee avatar
            example: Jira
          - id: labels
            name: Labels
            example: Trello labels
          - id: due-date
            name: Due date
            example: Trello
          - id: estimate
            name: Estimate
            example: Jira story points
          - id: cover-image
            name: Cover image
            example: Trello card covers
          - id: sub-task-progress
            name: Sub-task progress
            example: Checklist progress in Trello
          - id: amount-or-value
            name: Amount or value
            description: A monetary or numeric value on the card that is the point of the board — deal size,
              contract value — distinct from an effort Estimate; columnSummary already names its
              total but cardFields has no way to say the card carries it
            example: Pipedrive — Deals pipeline
      - id: columnSummary
        name: Column summaries
        select: many
        values:
          - id: none
            name: None
            example: Trello
          - id: card-count
            name: Card count
            example: Most boards
          - id: wip-limit
            name: WIP limit
            description: A maximum, flagged when exceeded
            example: Jira column constraints
          - id: sum-of-an-attribute
            name: Sum of an attribute
            description: Total estimate or value
            example: Pipedrive deal value per stage
  - name: Transitions
    family: flow
    question: What happens when a card moves?
    subdimensions:
      - id: transitions
        name: Transition rules
        select: many
        values:
          - id: free-movement
            name: Free movement
            description: Any column to any column
            example: Trello
          - id: allowed-transitions-only
            name: Allowed transitions only
            description: The workflow forbids some moves
            example: Jira workflows
          - id: required-fields
            name: Required fields
            description: A screen collects data on transition
            example: Jira transition screens
          - id: automation-on-move
            name: Automation on move
            description: Moves trigger actions
            example: Trello Butler, Jira Automation
  - name: Card size and columns
    family: layout
    question: How are cards and columns sized and arranged?
    subdimensions:
      - id: cardSize
        name: Card size
        select: one
        values:
          - id: compact
            name: Compact
            description: Title only
            example: Linear compact board
          - id: default
            name: Default
            description: Title plus key fields
            example: Jira
          - id: expanded
            name: Expanded
            description: Covers and descriptions
            example: Trello with covers
      - id: columnBehaviour
        name: Column behaviour
        select: many
        values:
          - id: horizontal-scroll
            name: Horizontal scroll
            example: Trello
          - id: collapsible-columns
            name: Collapsible columns
            example: Linear, GitHub Projects
          - id: fit-to-width
            name: Fit to width
            example: Small boards
          - id: one-at-a-time
            name: One at a time
            description: Only one column fills the screen at a time; swiping left or right moves to the adjacent
              column, e.g. Trello's mobile board
            example: Trello — A board in the mobile app
  - name: Card detail
    family: invocation
    question: Where does a card open?
    subdimensions:
      - id: openIn
        name: Card opens in
        select: one
        values:
          - id: modal
            name: Modal
            example: Trello card back
          - id: side-by-side
            name: Side-by-side
            description: A panel beside the board
            example: GitHub Projects item panel
          - id: new-page
            name: New page
            example: Jira issue page
          - id: in-place
            name: In-place
            description: The card expands
            example: Lightweight boards
  - name: Board scope
    family: scope
    question: Which cards are on the board?
    subdimensions:
      - id: filters
        name: Filtering
        select: many
        values:
          - id: quick-filters
            name: Quick filters
            description: One-click saved filters
            example: Jira quick filters
          - id: search
            name: Search
            example: Most boards
          - id: only-my-items
            name: Only my items
            example: Linear “My issues”
          - id: saved-views
            name: Saved views
            description: Named board configurations
            example: GitHub Projects views
wild:
  score: 2
  note: Productivity boards expose grouping, card fields and filters, often as an admin setting rather
    than a personal one.
  examples:
    - name: Jira
      note: Configure columns, swimlanes and card layout fields
    - name: Linear
      note: Display options for grouping, ordering and visible properties
    - name: Notion
      note: Group by any property, choose card preview and properties
techniques:
  - name: Fluid Grouping
    dimension: Grouping
    how: Drag any attribute from a card’s detail onto the column header strip and the board regroups by
      it; drag a second one onto the lane gutter for swimlanes. Fluid Attributes, applied to
      structure.
    ai: false
  - name: Transition preview
    dimension: Transitions
    how: "While dragging, the target column says what the drop will change: the new value, required
      fields and the automations it will fire."
    ai: false
  - name: Surface card fields
    dimension: Card and column content
    how: Surface or hide attributes from the card detail into every card, per board and per person.
    ai: false
  - name: Generated columns
    dimension: Grouping
    how: “Group these by risk” creates an AI-generated attribute with sources and uses it as the column
      source; wrong values can be dragged to correct them.
    ai: true
signature: Fluid Grouping
sample: Project-management, CRM, applicant-tracking and help-desk products (G2 category leaders),
  plus GitHub and GitLab.
unit: One board configuration over one set of items.
relations:
  uses:
    - card
    - drag-reorder
    - filter-controls
    - modal-dialog
    - drawer
    - badge
  specializes:
