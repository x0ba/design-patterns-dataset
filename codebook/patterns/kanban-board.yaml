    recorded:
      - place: sub:filters
        sub: filters
        dim: null
        name: Custom filter builder
        gloss: An open-ended filter builder for arbitrary criteria assembled on the spot, distinct from a
          one-click saved Quick filter, e.g. Asana's board Filter button
        raters:
          - sonnet
        instances:
          - 7
        status: raised
  raterNotes:
    fable:
      - cardFields depends on configuration for most tools; I coded what a typical default card
        shows. Swimlanes and column source are coded as the sampled screen's default, with the
        alternative noted.
      - cardSize's Expanded example names a per-card option, not a board setting. cardFields cannot
        say a card carries money, which is the point of every CRM board in the sample.
        columnBehaviour has no value for a phone board that shows one column per screen. Quick
        filters and Saved views overlap when saved filters sit in a one-click dropdown. Whether
        paid-tier features count is uncoded and splits raters on GitLab. columns as pick one splits
        raters between the instance's default grouping and the regroup capability.
    opus:
      - "columns is ambiguous for products where the grouping attribute is configurable but defaults
        to status (Linear, ClickUp, Planner): I coded the instance as shown rather than the
        capability, and said so per instance. transitions mixes enforcement (Allowed transitions
        only, Required fields) with side effects (Automation on move), and nearly every modern
        product has some automation, so Free movement plus Automation on move is the default shape.
        columnSummary's card count is nearly universal and Trello's being opt-in is the only real
        variation in it. openIn was the most informative sub: modal for database products,
        side-by-side for issue trackers, new page for CRMs."
      - "Two codebook faults account for most of this packet. (1) columnSummary puts None inside a
        pick-any, so 'no summary' can be written ['None'] or [], and that alone is the Trello and
        Basecamp disagreements — None should be the empty array. (2) columns cannot say whether to
        code the board as configured or the product's capability: Linear, ClickUp and Planner all
        ship grouped by status with a group-by-anything control, and the two readings give different
        variations. Smaller: transitions mixes enforcement (Allowed transitions only, Required
        fields) with side effects (Automation on move), and since nearly every product in this
        sample can fire a rule on a move, Automation on move stops discriminating; and Quick
        filters, Saved views and Sonnet's +Custom filter builder overlap badly — Pipedrive's
        saved-filter dropdown is defensibly any of the three."
    sonnet:
      - cardFields and filters are coded from general product capability rather than only what a
        single screenshot would show, per the protocol; swimlane basis for Azure DevOps (11) is a
        best guess, not a confident recall.
      - Three patterns stood out. (1) cardFields has no way to represent a monetary value that is
        the point of a sales-pipeline card (Pipedrive, HubSpot deals, Salesforce Opportunities all
        needed +Amount or value) — I had been forcing this into 'Estimate,' which is specifically an
        effort/points field and reads wrong for a dollar figure. (2) 'openIn' for the same product
        can differ by screen type within one product (Salesforce's Kanban card opens New page even
        though the codebook's own Side-by-side exemplar is Salesforce's list-view split view) — the
        codebook's per-product examples risk being read as per-product defaults when they are really
        per-screen. (3) Several CRM/PM tools (HubSpot, ClickUp, Airtable, monday.com) converge on
        the same four-part filter bar (a keyword search, an assignee-me toggle, one-click presets,
        and named saved configurations), and getting the boundary between 'Quick filters' and 'Only
        my items' right depended on whether a rater's note named a concrete mechanism or just
        asserted the value — worth flagging that this sub-dimension rewards specific product recall
        much more than most others in this entry.
