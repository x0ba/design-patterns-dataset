# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "split-pane". Edit between batches only — see README "Rules".
id: split-pane
name: Split pane
level: component
parent: browse-collections
aliases:
  - split view
  - resizable panels
  - editor groups
definition: Two or more resizable panes sharing one window, each holding its own view.
data: object
platforms:
  - desktop
  - web
domains:
  - software
  - design
  - productivity
  - communication
anatomy:
  - name: Pane
    role: One region
  - name: Divider
    role: The resize handle between panes
roles: []
dimensions:
  - name: Arrangement
    family: layout
    question: How are panes arranged and sized?
    subdimensions:
      - id: orientation
        name: Orientation
        select: one
        values:
          - id: side-by-side
            name: Side by side
            example: Mail apps
          - id: stacked
            name: Stacked
            example: Terminal under an editor
          - id: grid-of-panes
            name: Grid of panes
            example: VS Code editor groups
          - id: nested-splits
            name: Nested splits
            example: tmux
      - id: sizing
        name: Sizing
        select: one
        values:
          - id: fixed
            name: Fixed
            example: Simple layouts
          - id: draggable-divider
            name: Draggable divider
            example: Most IDEs
          - id: snap-presets
            name: Snap presets
            example: Windows Snap layouts
          - id: collapsible-pane
            name: Collapsible pane
            example: Sidebars
          - id: keyboard-resize
            name: Keyboard resize
            description: Panes are resized via keyboard shortcuts rather than dragging a divider with the
              pointer, e.g. tmux's prefix+arrow-key resize
            example: tmux — Nested terminal panes
  - name: Pane relationship
    family: composition
    question: How do the panes relate?
    subdimensions:
      - id: relationship
        name: Relationship
        select: one
        values:
          - id: independent
            name: Independent
            example: Two unrelated files
          - id: linked-selection
            name: Linked selection
            description: Selecting in one drives the other
            example: Mail list and message
          - id: synchronized-scroll
            name: Synchronized scroll
            example: Diff viewers
          - id: two-views-of-one-document
            name: Two views of one document
            example: Word split window
  - name: Creating splits
    family: invocation
    question: How is a split made?
    subdimensions:
      - id: create
        name: Split by
        select: many
        values:
          - id: menu-command
            name: Menu command
            example: Split right in VS Code
          - id: drag-a-tab-to-an-edge
            name: Drag a tab to an edge
            example: VS Code
          - id: keyboard-shortcut
            name: Keyboard shortcut
            example: tmux
  - name: Persistence
    family: lifecycle
    question: Does the layout survive?
    subdimensions:
      - id: persistence
        name: Layout persistence
        select: one
        values:
          - id: per-session
            name: Per session
            example: Browsers’ split view
          - id: saved-layouts
            name: Saved layouts
            example: Photoshop workspaces
          - id: per-workspace
            name: Per workspace
            example: VS Code workspaces
          - id: app-wide
            name: App-wide
            description: One layout remembered for the whole app or account and restored on every launch, not
              per session, per workspace, or as named layouts
            example: Apple Mail — Three-column window
          - id: remembered-as-a-preference
            name: Remembered as a preference
            description: The layout is simply remembered for the application across restarts — no session
              boundary, no named layout to choose and no project to scope it to. The commonest case
              in shipping apps, and the codebook's three variations all imply an explicit container
              for the layout
            example: Apple Mail — Three-column window
wild:
  score: 3
  note: Professional tools let people split, resize and save layouts as a matter of course.
  examples:
    - name: VS Code
      note: Editor groups, drag to split
    - name: Photoshop
      note: Saved workspaces
techniques:
  - name: Drag to dock
    dimension: Creating splits
    how: Drag any view to an edge to split, and drag it back to merge; the layout is a spec that can be
      saved and shared.
    ai: false
  - name: Layout for this task
    dimension: Arrangement
    how: “Set me up to review this PR” opens the diff, tests and the conversation in a proposed split.
    ai: true
signature: Drag to dock
sample: IDEs, creative suites, mail clients and chat apps on desktop.
unit: One window layout.
