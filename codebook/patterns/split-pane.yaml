  raterNotes:
    fable:
      - Persistence lacks the commonest case, a single remembered layout for the app (nine of
        twenty). Create is n/a for fixed layouts where the user never makes a split.
      - persistence lacks the commonest case, one layout remembered for the app, which two raters
        proposed. create needs [] rather than n/a for fixed layouts. sizing wants pick any where a
        fixed layout also collapses a pane or a snap layout also drags. Grid of panes and Nested
        splits are undefined for dock systems.
    opus:
      - "This entry's unit ('one window layout') stretches over two different things: layouts a
        person builds (VS Code, tmux, Snap) and fixed multi-region app chromes (Mail, Slack,
        Discord, Figma). For the latter, create is empty and the interesting sub-dimensions are
        relationship and sizing. persistence needed the one proposal: eight instances remember the
        layout forever as an app setting, which is neither per session, a saved layout nor per
        workspace. sizing is pick-one but collapsible and draggable coexist almost everywhere, so I
        coded the seam behaviour and treated collapse as secondary. Nothing in the entry can express
        the responsive reflow that DevTools and many web layouts do when the window narrows."
      - "Two thirds of this packet is one missing variation in `persistence`: eight of the twenty
        instances simply remember their layout for the application, which is neither Per session,
        Saved layouts nor Per workspace — fable and I proposed it independently (I have taken
        fable's name, +App-wide) and sonnet, having no value for it, coded Per session eight times.
        The rest divides into three smaller faults. `create` is pick any but has no way to say
        'nobody creates this split, it is the app's own layout', so six instances are coded as an
        empty list by two raters and n/a by the third, which scores as disagreement; it also names
        its variations after editor idioms (a *tab* dragged to an edge), which forces a judgement
        call for window tiling. `orientation`'s Grid of panes and Nested splits are not exclusive —
        every dock system that nests arbitrarily also renders as a grid, so Photoshop, JupyterLab
        and Discord split us. And `sizing` lists only pointer mechanisms, so a keyboard-resized
        layout (tmux) has no value."
    sonnet:
      - create is left empty for several fixed, built-in split layouts (Mail's three columns,
        Slack's thread pane, Gmail's reading pane) where the split isn't made through a menu
        command, tab drag or keyboard shortcut the way an IDE split is, but is a toggled built-in
        feature instead.
      - "Two patterns stood out. (1) 'persistence' has no value for the single most common case in
        this sample: a layout simply remembered for the whole app across restarts, with no session
        boundary, no named-layout picker and no per-project scoping (Apple Mail, Outlook, Slack,
        Discord, GitHub, Figma, DevTools, Gmail) — I'd been defaulting to 'Per session' for lack of
        a better fit, but both other raters independently converged on essentially the same missing
        value, which is as strong a signal as this reconciliation produced anywhere. (2) 'create'
        needed a genuine n/a (not an empty array) for fixed, built-in multi-pane layouts that no
        user action constructs (Apple Mail, Slack's thread pane, Discord, Figma, DevTools, Beyond
        Compare) — these aren't cases where the three create mechanisms were checked and found
        absent, but cases where the concept of 'making a split' doesn't apply to a layout the app
        always provides."
