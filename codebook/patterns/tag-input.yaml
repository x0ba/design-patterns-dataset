  unresolved: []
  proposals:
    raised: 3
    adopted:
      - sub: overflow
        name: Stacked list
        raters:
          - fable
          - opus
          - sonnet
      - sub: create
        name: Space
        raters:
          - fable
          - opus
          - sonnet
      - sub: overflow
        name: Stacked list of rows
        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Semicolon (Outlook) and space (GitHub) were coded as Comma since the variation is really 'a
        delimiter key'; the name is narrower than the thing.
      - "token: one rater never codes Text, so the gloss should say whether Text is implied by every
        chip; overflow lacks the stacked-rows case; vocabulary is unclear on a recipient field where
        an unknown email is accepted as an invitation."
    opus:
      - "vocabulary needed a rule: Free creation where typing and committing simply makes the value,
        Create with confirmation where a new value is offered as an explicit Create row to choose,
        Existing values only where a typed string that matches nothing cannot be committed.
        Recipient fields sit awkwardly in that scheme — an unknown email address is both free
        creation and an invitation. The create list also has no variation for space as a separator
        (GitHub topics) and the entry has nowhere to record a cap on the number of tokens, which
        four of these impose."
      - "create mixes the keystroke with the source: when a 'Create X' row is highlighted, Enter and
        Choosing a suggestion are the same action, which is where the three of us split on Linear,
        Notion and Airtable; token's Text reads as mutually exclusive with Avatar and Colour to one
        rater although every token in this sample shows text; overflow is pick one but describes two
        different states of the same field (Gmail and iOS Mail wrap while focused and collapse to a
        count when they are not), and it had no value for tokens that leave the field and become
        rows."
    sonnet:
      - Vocabulary was the hardest pick-one for enterprise label/tag fields that both suggest
        existing values and let you create new ones with a confirm step (Linear, Notion, Airtable,
        Jira, Asana) — I coded Create with confirmation only where a distinct 'Create X' affordance
        is part of the pattern, and Free creation where a new value seems to land without that extra
        step, but I can't fully verify the Jira/Asana distinction from memory.
      - "One systematic miss dominated this archetype: 'token' content is pick-any, but I was coding
        it as if only one kind of content could be true per chip, picking Avatar or Colour alone
        whenever either was present and dropping Text even though nearly every chip in the sample
        also shows the value's name as text. This alone accounted for the bulk of the disagreement
        here. Separately, 'create' pick-any suffered a milder version of the same under-listing —
        I'd often credit only the one or two mechanisms my own note happened to describe rather than
        the fuller set both other raters independently confirmed."
  codedAt: 2026-09-22
