  raterNotes:
    fable:
      - Encapsulation is a pick-one but most editors have both frames and subgraphs; coded the
        reusable form (subgraph) unless the sample named only backdrops/groups.
      - encapsulation is pick-one but most editors have both frames and subgraphs (Substance,
        ComfyUI since 2025); feedback's None competes with an empty array; Inline parameter controls
        needs a rule for control objects that are their own nodes (Max, Pure Data, Grasshopper);
        Drag from a port should say it means adding a node, not drawing an edge; edge style is hard
        to recall reliably for tools with a straight-versus-curved preference.
    opus:
      - "Semantics forced one label onto tools that are two things at once: Node-RED and Make are
        message dataflow in mechanism and automation in purpose, and ComfyUI is dataflow that
        happens to carry models. Encapsulation also makes frames and subgraphs exclusive when most
        professional graphs have both (Nuke backdrops plus groups, Substance frames plus graph
        instances), so the code records whichever the sample's screen leads with."
      - "Edge routing is the weakest sub-dimension here: it asks about a rendering detail that
        raters recall differently, and I changed two cells on the strength of two other
        recollections rather than my own. Arrangement's Free placement and Snap to grid are not
        exclusive — nearly every one of these editors snaps to a grid by default while letting you
        put nodes anywhere — so the pick one forces a false choice. Encapsulation has no member for
        a control-flow container that nests steps without being a frame or a subgraph (Power
        Automate's Scope, Condition and Apply-to-each), and Node content has no member for the
        portless automation step card, which is what my Step summary proposal is for."
    sonnet:
      - Add-by and feedback were often not visible in the one-line sample note; left empty rather
        than guessed where the product doesn't have a well-known, distinguishing behaviour I could
        recall confidently.
      - "Content's Live preview needs its gloss tightened: it should mean an automatic thumbnail
        rendered on the node itself (ComfyUI, ShaderGraph), not a single shared viewer panel that
        can be pointed at any node (Nuke, Fusion) — I conflated the two for three instances in round
        1. Encapsulation's four values don't cleanly cover a workflow tool whose only structure is
        condition/loop containers holding a linear list of steps (Zapier, Power Automate): it's not
        a subgraph-as-node, not a reusable function, and Frames undersells that the containers are
        structural rather than a loose visual annotation — I resolved it to Flat graph by
        elimination, but this is a real gap worth a closer look."
