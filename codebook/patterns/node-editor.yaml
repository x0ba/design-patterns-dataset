# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "node-editor". Edit between batches only — see README "Rules".
id: node-editor
name: Node editor
level: pattern
parent: create
aliases:
  - node graph
  - visual programming
  - flow editor
definition: Building logic or data flow by connecting nodes through typed ports.
data: network
platforms:
  - desktop
  - web
domains:
  - design
  - software
  - entertainment
  - enterprise
  - ai
anatomy:
  - name: Node
    role: One operation
  - name: Port
    role: A typed input or output
  - name: Edge
    role: A connection
  - name: Library
    role: Available nodes
  - name: Inspector
    role: Node parameters
roles: []
dimensions:
  - name: Graph semantics
    family: composition
    question: What does a connection mean, and how are graphs packaged?
    subdimensions:
      - id: semantics
        name: Semantics
        select: one
        values:
          - id: dataflow
            name: Dataflow
            example: Blender shader nodes
          - id: control-flow
            name: Control flow
            example: Unreal Blueprints
          - id: workflow-automation
            name: Workflow automation
            example: n8n
          - id: state-machine
            name: State machine
            example: Rive state machines
          - id: model-pipeline
            name: Model pipeline
            example: ComfyUI
      - id: encapsulation
        name: Encapsulation
        select: one
        values:
          - id: flat-graph
            name: Flat graph
            example: Small workflows
          - id: frames
            name: Frames
            example: Blender frames
          - id: subgraphs-as-nodes
            name: Subgraphs as nodes
            example: Blender node groups
          - id: reusable-functions
            name: Reusable functions
            example: Blueprint functions
  - name: Node content
    family: content
    question: What does a node show?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: title-and-ports
            name: Title and ports
            example: All
          - id: inline-parameter-controls
            name: Inline parameter controls
            example: ComfyUI
          - id: live-preview
            name: Live preview
            example: ComfyUI image previews
          - id: values-on-edges
            name: Values on edges
            description: Data shown while running
            example: Debug overlays
          - id: step-summary
            name: Step summary
            description: The node is a titled card with an app icon and a one-line description of what it is
              configured to do, and has no visible ports — the shape of linear automation builders,
              where connections are implied by order and configuration lives in a side panel
            example: Zapier — Zap editor
  - name: Arrangement
    family: layout
    question: How are nodes placed and edges drawn?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: free-placement
            name: Free placement
            example: Blender
          - id: snap-to-grid
            name: Snap to grid
            example: Many editors
          - id: auto-arranged
            name: Auto-arranged
            example: Graph auto-layout
          - id: linear-steps
            name: Linear steps
            example: Zapier
      - id: edges
        name: Edge routing
        select: one
        values:
          - id: curves
            name: Curves
            example: Blender
          - id: orthogonal
            name: Orthogonal
            example: Diagram tools
          - id: straight
            name: Straight
            example: Simple graphs
  - name: Adding nodes
    family: invocation
    question: How are nodes added?
    subdimensions:
      - id: add
        name: Add by
        select: many
        values:
          - id: library-sidebar
            name: Library sidebar
            example: n8n
          - id: search-at-the-cursor
            name: Search at the cursor
            example: Blender Shift+A
          - id: drag-from-a-port
            name: Drag from a port
            description: Only compatible nodes offered
            example: Unreal Blueprints
          - id: generate-a-subgraph
            name: Generate a subgraph
            example: AI workflow builders
  - name: Execution feedback
    family: feedback
    question: How does the graph report what it did?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: none
            name: None
            example: Static diagrams
          - id: per-node-status
            name: Per-node status
            example: n8n execution view
          - id: values-on-hover
            name: Values on hover
            example: Debuggers
          - id: error-highlighting
            name: Error highlighting
            example: ComfyUI
wild:
  score: 2
  note: The graph is authored by the person; the editor itself is less customizable.
  examples:
    - name: Blender
      note: Node groups exposing inputs
    - name: ComfyUI
      note: Custom node packs
techniques:
  - name: Collapse to controls
    dimension: Graph semantics
    how: Select a subgraph and publish its exposed parameters as a simple panel, so others use the graph
      without reading it.
    ai: false
  - name: Build the graph that…
    dimension: Adding nodes
    how: A described goal becomes a grouped subgraph that can be opened, inspected and edited.
    ai: true
signature: Collapse to controls
sample: 3D and VFX tools, game engines, automation platforms and model-pipeline tools.
unit: One node editor.
