        status: raised
  raterNotes:
    fable:
      - lifecycle is n/a where threads never close (Loom, Kindle, Pages, Hypothesis); marker is
        empty for code review, where the thread itself is the only mark.
      - "lifecycle: Open until resolved and Resolved keeps history overlap — Docs keeps resolved
        threads in its history too, so the split has no criterion. feedback: Unread badges and Email
        or chat notify co-occur almost everywhere once an in-app notifications badge counts, so they
        do not discriminate. anchor has no block value and createBy has no at-the-playhead value;
        two raters each proposed them."
    opus:
      - "lifecycle assumes every annotation is a thread that someone closes; private or public-web
        annotation (Kindle, Pages, Hypothesis) has no resolved state at all and came out n/a. anchor
        also cannot say that a comment belongs to a block rather than a selection (Notion) or that
        one control offers two anchors at once (Dropbox: whole file, or a pin on an image). The
        assignment of a comment to a person — Sheets and Docs both do it — has nowhere to go except
        the Converted to task variation, which overstates it."
      - "lifecycle assumes every annotation is a social thread someone closes — Kindle, Pages,
        Hypothesis and Loom have no close state and all came out n/a — and its first two values are
        not exclusive: Docs, the exemplar for Open until resolved, also keeps resolved threads in a
        history, which is what split Miro and Canva. layout is pick-one over products that have both
        an in-situ thread and an aggregate list (Kindle's Notebook, Pages' Comments pane, Acrobat's
        list), and its Review page list gloss names GitHub Files changed, a screen where the thread
        is literally inline under the block, so two values name one screen. marker has no value for
        the commonest code-review case, where the thread in place is the only mark."
    sonnet:
      - "Kindle (instance 18) is a genuine edge case for this pattern: its highlights/notes are
        personal, not a shared discussion thread, so lifecycle was coded n/a rather than forced into
        a resolve-style value — worth flagging since the sample frame may have intended it as a
        boundary test of the pattern definition."
      - "Two codebook gaps confirmed by independent convergence: marker has no value for a
        video-timeline tick (three instances, two raters proposing the same concept under the same
        name) and createBy has no value for 'typed at the current playhead position with no
        selection or pin act', distinct from Pin tool's deliberate placement. Separately, anchor and
        layout are pick-one but several products genuinely run two modes at once (Dropbox's
        file-comment vs. image-pin anchor; Kindle's in-situ popover vs. its document-wide Notebook
        aggregate, which is a different unit of analysis than this pattern's per-thread layout
        question) — these read as codebook fit issues, not rater error."
