# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "annotation". Edit between batches only — see README "Rules".
id: annotation
name: Annotation
level: pattern
parent: collaborate
aliases:
  - comments
  - pinned notes
  - margin notes
definition: Attaching discussion or marks to a region of a shared artifact so feedback stays
  anchored to what it is about.
data: document
platforms:
  - web
  - desktop
  - mobile
domains:
  - productivity
  - design
  - education
  - software
  - enterprise
anatomy:
  - name: Anchor
    role: The region commented on
  - name: Thread
    role: The discussion
  - name: Marker
    role: The visible pin or highlight
  - name: Resolve
    role: Closing the thread
roles:
  - author
  - reply
  - reaction
dimensions:
  - name: Anchor form
    family: composition
    question: What is an annotation attached to?
    subdimensions:
      - id: anchor
        name: Anchor
        select: one
        values:
          - id: text-range
            name: Text range
            example: Google Docs comments
          - id: canvas-point-or-area
            name: Canvas point or area
            example: Figma comments
          - id: timeline-range
            name: Timeline range
            example: Frame.io
          - id: cell-or-row
            name: Cell or row
            example: Sheets comments
          - id: code-line
            name: Code line
            example: GitHub PR review
          - id: whole-page-floating
            name: Whole page floating
            example: PDF sticky notes
          - id: block
            name: Block
            description: Attached to a whole block or paragraph rather than a text range or cell (Notion block
              comments)
            example: Notion — Block comment
          - id: content-block
            name: Content block
            description: Anchored to one whole structural block of a document (a paragraph, heading, or image),
              not a free text range, a canvas point, a timeline range, a spreadsheet cell/row, a
              code line, or the whole page.
            example: Notion — Block comment
  - name: Marker presentation
    family: content
    question: What does the annotation show in situ?
    subdimensions:
      - id: marker
        name: Marker
        select: many
        values:
          - id: highlight
            name: Highlight
            example: Docs
          - id: avatar-pin
            name: Avatar pin
            example: Figma
          - id: margin-glyph
            name: Margin glyph
            example: Word
          - id: inline-suggestion-mark
            name: Inline suggestion mark
            example: Docs Suggesting
          - id: status-colour
            name: Status colour
            example: Resolved vs open
          - id: timeline-marker
            name: Timeline marker
            description: A tick or dot on a media timeline at the annotated time (Frame.io, Loom, Vimeo review)
            example: Frame.io — Timecoded comment on a video
          - id: drawn-mark
            name: Drawn mark
            description: A freehand shape drawn over the frame or page as the visible mark of the annotation,
              rather than a highlight, pin or glyph
            example: Frame.io — Timecoded comment on a video
  - name: Thread layout
    family: layout
    question: Where does the conversation appear?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: side-margin-panel
            name: Side margin panel
            example: Google Docs
          - id: anchored-popover
            name: Anchored popover
            example: Figma
          - id: bottom-sheet-on-mobile
            name: Bottom sheet on mobile
            example: Docs mobile
          - id: inline-under-the-block
            name: Inline under the block
            example: Notion comments
          - id: review-page-list
            name: Review page list
            example: GitHub Files changed
  - name: Creating an annotation
    family: invocation
    question: How is a new annotation started?
    subdimensions:
      - id: createBy
        name: Create by
        select: many
        values:
          - id: select-then-comment
            name: Select then comment
            example: Docs
          - id: pin-tool
            name: Pin tool
            example: Figma comment mode
          - id: mention-while-editing
            name: "@mention while editing"
            example: Notion
          - id: suggestion-mode-edit
            name: Suggestion mode edit
            example: Docs Suggesting
          - id: from-a-review-checklist
            name: From a review checklist
            example: PR review
          - id: comment-at-the-playhead
            name: Comment at the playhead
            description: The annotation takes the player's current position as its anchor with no selection or
              pin act at all — typing into the comment box is the whole gesture
            example: Frame.io — Timecoded comment on a video
  - name: Thread lifecycle
    family: lifecycle
    question: How do threads open, escalate and close?
    subdimensions:
      - id: lifecycle
        name: Lifecycle
        select: one
        values:
          - id: open-until-resolved
            name: Open until resolved
            example: Docs
          - id: resolved-keeps-history
            name: Resolved keeps history
            example: Figma
          - id: converted-to-task
            name: Converted to task
            example: Jira from comment
          - id: outdated-when-anchor-moves
            name: Outdated when anchor moves
            example: GitHub outdated
          - id: reopened-on-reply
            name: Reopened on reply
            example: Many tools
  - name: Annotation feedback
    family: feedback
    question: How do people know annotations need attention?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: unread-badges
            name: Unread badges
            example: Docs
          - id: email-or-chat-notify
            name: Email or chat notify
            example: Slack integrations
          - id: filter-open-only
            name: Filter open only
            example: Figma
          - id: anchor-missing-warning
            name: Anchor missing warning
            example: Deleted text
          - id: ai-thread-summary
            name: AI thread summary
            example: PR review summaries
wild:
  score: 1
  note: Filter and notification settings exist; anchor and layout modes are mostly fixed.
  examples:
    - name: Figma
      note: Comment vs spot; filter unread
    - name: Google Docs
      note: Notification settings
    - name: GitHub
      note: Pending review comments
techniques:
  - name: Anchor survives edits
    dimension: Anchor form
    how: Keep anchors stable across edits with clear outdated states when the target disappears.
    ai: false
  - name: Resolve with a decision
    dimension: Thread lifecycle
    how: Resolving captures an accepted outcome (done, wontfix, deferred) visible on the marker.
    ai: false
  - name: Cluster related threads
    dimension: Annotation feedback
    how: Group overlapping pins or similar feedback into one reviewable set with a summary.
    ai: true
signature: Anchor survives edits
sample: Documents, design files, video review, spreadsheets and code review.
unit: One anchored thread on one artifact region.
relations:
