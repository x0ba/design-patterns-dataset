# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "comment-thread". Edit between batches only — see README "Rules".
id: comment-thread
name: Comment thread
level: pattern
parent: communicate
aliases:
  - comments
  - discussion
  - review comments
definition: Discussion attached to an artifact or post, where replies nest and threads resolve.
data: conversation
platforms:
  - web
  - mobile
  - desktop
domains:
  - social
  - news
  - productivity
  - software
  - design
anatomy:
  - name: Comment
    role: One contribution
  - name: Replies
    role: Responses to it
  - name: Anchor
    role: What the thread is about
  - name: Resolution
    role: Whether it is settled
roles:
  - author
  - timestamp
  - body
  - votes
dimensions:
  - name: Nesting
    family: composition
    question: How do replies nest, and what are threads attached to?
    subdimensions:
      - id: nesting
        name: Nesting
        select: one
        values:
          - id: flat
            name: Flat
            example: Classic blog comments
          - id: one-level-of-replies
            name: One level of replies
            example: YouTube
          - id: deep-nesting
            name: Deep nesting
            example: Reddit
          - id: anchored-threads
            name: Anchored threads
            description: One thread per location in an artifact
            example: Google Docs comments
  - name: Ordering
    family: initiative
    question: Who decides which comments come first?
    subdimensions:
      - id: ordering
        name: Ordering
        select: one
        values:
          - id: oldest-first
            name: Oldest first
            example: GitHub issues
          - id: newest-first
            name: Newest first
            example: News sites
          - id: top-by-votes
            name: Top by votes
            example: Reddit Best
          - id: pinned-by-author
            name: Pinned by author
            example: YouTube pinned comment
          - id: anchor-order
            name: Anchor order
            description: Threads are listed in the order of their anchors in the artifact (page position,
              timecode), not by time or votes
            example: Google Docs — Document comments
          - id: by-anchor-position
            name: By anchor position
            description: Threads are ordered by where their anchors fall in the artifact — down the document,
              along the timeline, through the pages — not by time or votes
            example: Google Docs — Document comments
  - name: Resolution
    family: lifecycle
    question: Does a thread end?
    subdimensions:
      - id: resolution
        name: Resolution
        select: one
        values:
          - id: never
            name: Never
            example: Social comments
          - id: resolve-and-hide
            name: Resolve and hide
            example: Google Docs
          - id: accepted-answer
            name: Accepted answer
            example: Stack Overflow
          - id: locked
            name: Locked
            example: GitHub locked conversations
          - id: marked-status
            name: Marked status
            description: A thread can be marked completed/accepted/rejected but stays in view rather than being
              hidden
            example: Frame.io — Video review comments
  - name: Placement
    family: layout
    question: Where do threads appear?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: below-the-content
            name: Below the content
            example: YouTube
          - id: margin-beside-the-anchor
            name: Margin beside the anchor
            example: Google Docs
          - id: side-panel
            name: Side panel
            example: Figma comments list
          - id: pins-on-a-canvas
            name: Pins on a canvas
            example: Figma comment pins
          - id: inline-at-the-anchor
            name: Inline at the anchor
            description: The thread is spliced into the artifact itself, pushing it apart — a review thread
              expanding under the diff line it annotates — rather than sitting in a margin or panel
            example: GitHub — Pull request conversation
          - id: bottom-sheet
            name: Bottom sheet
            description: Comments slide up as a sheet over the lower part of the screen while the content stays
              playing or visible above
            example: Instagram — Post comments
          - id: inline-at-anchor
            name: Inline at anchor
            description: The thread renders directly in the content flow at its anchored location (e.g., under a
              diff line) rather than offset to a margin column, a side panel, or as a pin on a
              canvas
            example: GitHub — Pull request conversation
  - name: Long threads
    family: content
    question: How are long threads condensed?
    subdimensions:
      - id: condensing
        name: Condensing
        select: one
        values:
          - id: show-all
            name: Show all
            example: GitHub
          - id: collapse-deep-branches
            name: Collapse deep branches
            example: Reddit Continue this thread
          - id: load-more-replies
            name: Load more replies
            example: YouTube
          - id: hidden-items-summary
            name: Hidden items summary
            example: GitHub hidden items
  - name: Moderation
    family: collaboration
    question: How is the discussion kept healthy?
    subdimensions:
      - id: moderation
        name: Moderation
        select: many
        values:
          - id: none
            name: None
            example: Private documents
          - id: voting
            name: Voting
            example: Reddit
          - id: reporting
            name: Reporting
            example: YouTube
          - id: held-for-review
            name: Held for review
            example: YouTube held comments
wild:
  score: 1
  note: Sort order is often a choice; structure is not.
  examples:
    - name: Reddit
      note: Sort comments by Best, Top, New, Controversial
techniques:
  - name: Thread lenses
    dimension: Long threads
    how: Collapse a discussion by participant, by resolved state or by stance, as lenses rather than
      filters that hide.
    ai: false
  - name: Summarize the disagreement
    dimension: Long threads
    how: A summary of positions, each linked to the comments that hold it.
    ai: true
signature: Thread lenses
