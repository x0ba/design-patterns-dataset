  raterNotes:
    fable:
      - ordering's 'Top by votes' had to stretch to cover engagement/relevance ranking (Instagram,
        Facebook, X, TikTok, Medium) since no 'ranked by relevance' variation exists. 'Pinned by
        author' was never coded as the primary ordering because a pin is an exception to whatever
        sort is default.
      - Resolve and hide bundles two things, marking a thread settled and removing it from view;
        review tools mark without hiding. Voting under moderation is read two ways, as a ranking
        signal (hearts, claps) or as a burying tool; the gloss should say which.
    opus:
      - ordering has no variation for algorithmic relevance (Most relevant, Top comments, ranked
        replies); I coded those Top by votes because a visible like count feeds the rank, but that
        reads more into it than the label says. Anchored products needed the +By anchor position
        proposal because none of the four time/vote orderings describe reading down a document.
      - ordering is pick one but a news or social thread offers newest, top and curated orders side
        by side on the same screen; it wants to be pick any with a marked default. nesting has
        nothing between One level of replies and Reddit-deep.
    sonnet:
      - "Ordering was often a fit-by-analogy: several products (Facebook, Instagram, TikTok, X)
        default to an undisclosed relevance/engagement algorithm that most resembles 'Top by votes'
        without being literal vote counts; two products (Medium, Substack) got '?' where I couldn't
        recall the exact default confidently."
      - Three codebook problems. (1) Moderation's Voting has no gloss on whether a one-directional
        like or clap counts as a vote; that single ambiguity produced six of this entry's nine
        moderation disagreements, and it should say so explicitly. (2) Resolve and hide bundles two
        separate things — marking a thread settled and removing it from view — which is why review
        tools (Frame.io, Acrobat) needed the Marked status proposal. (3) Placement's Pins on a
        canvas and Side panel are both true of most anchored tools at once (a marker on the
        artifact, the thread body in a panel); the gloss needs a rule — I coded where the thread
        body renders — or the sub should be pick any. Nesting also asks two questions at once (how
        deep replies go, and what the thread is attached to), so Anchored threads competes with a
        depth answer rather than excluding it.
