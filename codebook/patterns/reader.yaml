# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "reader". Edit between batches only — see README "Rules".
id: reader
name: Reader
level: pattern
parent: consume-media
aliases:
  - ebook reader
  - reading mode
  - long-form reader
definition: Reading long-form text with control over typography, position, annotations and how much
  of the work is present.
data: document
platforms:
  - mobile
  - desktop
  - web
  - xr
domains:
  - entertainment
  - education
  - news
  - productivity
  - science
anatomy:
  - name: Page or flow
    role: The reading surface
  - name: Typography
    role: Type size, face and theme
  - name: Position
    role: Progress through the work
  - name: Annotations
    role: Highlights, notes and bookmarks
roles:
  - title
  - author
  - chapter
  - progress
  - highlight
dimensions:
  - name: Typography and theme
    family: encoding
    question: How does the text look?
    subdimensions:
      - id: typography
        name: Typography
        select: many
        values:
          - id: typeface-choice
            name: Typeface choice
            example: Kindle fonts
          - id: size-and-spacing
            name: Size and spacing
            example: Apple Books
          - id: light-dark-sepia
            name: Light dark sepia
            example: Kindle themes
          - id: column-width
            name: Column width
            example: Instapaper
          - id: dyslexia-friendly-face
            name: Dyslexia-friendly face
            example: OpenDyslexic in some readers
  - name: Pagination model
    family: layout
    question: How is the text chunked on screen?
    subdimensions:
      - id: pagination
        name: Model
        select: one
        values:
          - id: paginated-pages
            name: Paginated pages
            example: Kindle page turns
          - id: continuous-scroll
            name: Continuous scroll
            example: Web articles
          - id: reflowable-ebook
            name: Reflowable ebook
            example: EPUB in Apple Books
          - id: fixed-layout
            name: Fixed layout
            example: Comics and PDFs
          - id: two-page-spread
            name: Two-page spread
            example: iPad landscape books
  - name: Navigation in the work
    family: flow
    question: How does a person move through chapters and locations?
    subdimensions:
      - id: navigation
        name: Navigation
        select: many
        values:
          - id: table-of-contents
            name: Table of contents
            example: Kindle Go To
          - id: scrubber-by-percentage
            name: Scrubber by percentage
            example: Apple Books progress
          - id: search-in-book
            name: Search in book
            example: Kindle search
          - id: page-flip-gestures
            name: Page flip gestures
            example: iBooks curl
          - id: audiobook-sync
            name: Audiobook sync
            description: Whispersync position
            example: Kindle Immersion Reading
  - name: Annotations
    family: content
    question: What can be attached to passages?
    subdimensions:
      - id: annotations
        name: Annotations
        select: many
        values:
          - id: highlights
            name: Highlights
            example: Kindle highlights
          - id: notes
            name: Notes
            example: Apple Books notes
          - id: bookmarks
            name: Bookmarks
            example: Most readers
          - id: shared-popular-highlights
            name: Shared popular highlights
            example: Kindle Popular Highlights
          - id: export-to-notes-app
            name: Export to notes app
            example: Readwise
          - id: inline-reader-comments
            name: Inline reader comments
            description: Readers attach public comments to a specific paragraph inside the text, visible to
              everyone else reading it — a conversation in the margin rather than a private mark or
              an aggregate of many private marks
            example: Wattpad — Reading a story
  - name: Reading assistance
    family: initiative
    question: What does the reader contribute beyond the text?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: dictionary-lookup
            name: Dictionary lookup
            example: Kindle tap-to-define
          - id: translate-passage
            name: Translate passage
            example: Kindle translation
          - id: summarize-chapter
            name: Summarize chapter
            example: AI reading assistants
          - id: read-aloud
            name: Read aloud
            example: Apple Books Speak Screen
          - id: focus-line-or-rsvp
            name: Focus line or RSVP
            example: Spritz-style modes
  - name: Progress and goals
    family: lifecycle
    question: How is progress through the work tracked?
    subdimensions:
      - id: progress
        name: Progress
        select: one
        values:
          - id: location-only
            name: Location only
            example: Early Kindles
          - id: percent-remaining
            name: Percent remaining
            example: Kindle
          - id: time-left-in-chapter
            name: Time left in chapter
            example: Kindle reading time
          - id: daily-reading-goals
            name: Daily reading goals
            example: Kindle reading insights
          - id: streaks
            name: Streaks
            example: Serial fiction apps
          - id: pages-left-in-chapter
            name: Pages left in chapter
            description: Progress is shown as a count of pages remaining in the current chapter rather than time
              or percent
            example: Apple Books — Reading a book
wild:
  score: 3
  note: Typography and theme are among the most customized surfaces in consumer software.
  examples:
    - name: Kindle
      note: Fonts, spacing, theme, reading progress
    - name: Apple Books
      note: Appearance controls
    - name: Instapaper
      note: Text and theme options
techniques:
  - name: Reading lens
    dimension: Typography and theme
    how: A personal typography-and-theme spec that applies to every article and ebook the way a Meridian
      overview spec travels across shops.
    ai: false
  - name: Highlight then ask
    dimension: Annotations
    how: Select a highlight and ask a question; the answer cites nearby passages and stays attached to
      the highlight.
    ai: true
  - name: Pace-aware pagination
    dimension: Pagination model
    how: Switch between page-turn and scroll without losing location, matching reading context (commute
      vs desk).
    ai: false
signature: Reading lens
sample: Kindle, Apple Books, Google Play Books, Instapaper, Pocket and major news reading modes.
unit: One reading session of one document or ebook.
relations:
  uses:
    - slider
    - menu
    - drawer
    - autocomplete
  specializes:
    - consume-media
  neighbors:
    - document-editor
    - media-player
scores:
  ubiquity: 4
  potential: 4
  spec: 5
evidence: agent-coded
usage:
  - Readers tune type once and keep it for years
  - Annotations become a personal index of the book
questions:
  - Should a reading lens include annotation density and assistance level?
  - How do shared highlights interact with personal ones?
