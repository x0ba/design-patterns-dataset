          - sonnet
      - sub: annotations
        name: Inline reader comments
        raters:
          - opus
          - sonnet
    recorded:
      - place: sub:progress
        sub: progress
        dim: Progress and goals
        name: Estimated total read time
        gloss: A fixed reading-time estimate is shown up front for the whole piece (e.g., '6 min read'),
          rather than a dynamically tracked location, percent remaining, time left in the current
          chapter, a daily goal, or a streak
        raters:
          - sonnet
        instances:
          - 9
        status: raised
  raterNotes:
    fable:
      - progress is n/a for reading modes and article apps that track nothing (Safari, Firefox, NYT,
        Medium, Wikipedia, Substack). Ebook apps mix an in-book indicator with app-level goals; I
        coded the in-book indicator unless the sample named goals (Play Books).
    opus:
      - "progress is n/a for six of twenty: reader modes and news apps show nothing at all about
        where you are, and Location only overstates it. The web and article readers also make
        navigation systematically empty — there is no table of contents, scrubber or in-work search
        in a single article — which is a real finding rather than a coding failure, but it means
        half this entry's cells are empty arrays."
    sonnet:
      - progress defaulted to 'Location only' for most simple article/one-off readers (Safari,
        Firefox, NYT, Wikipedia, Substack, Matter's peers, Vision Pro Safari, Speechify, Wattpad)
        since none of the samples described a percent, chapter-time, goal, or streak mechanism for
        them.
      - "Two structural problems. `pagination` mixes two axes: Reflowable ebook describes how text
        is laid out while Paginated pages and Continuous scroll describe how it is chunked, so an
        EPUB that reflows into page turns is two values at once (this alone split all three raters
        on Apple Books). `progress` is pick one but products report several at once — Kobo shows
        both time left in chapter and a percentage, Libby likewise — and it has no value for pages
        left in a chapter (adopted here as a proposal), for a static 'six minute read' estimate, or
        for a listening progress bar in a text-to-speech reader; it also lacks a clean way to say a
        reading surface tracks nothing at all, which is why Safari and Firefox Reader, the NYT,
        Wikipedia, Substack and Medium all had to be coded n/a."
  codedAt: 2026-09-22
