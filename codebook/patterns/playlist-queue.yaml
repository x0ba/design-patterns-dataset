  raterNotes:
    fable:
      - policy is pick-one but nearly every queue is manual with shuffle/repeat toggles and an
        autoplay tail; I coded Strict manual order unless autoplay-after-end is on by default (Apple
        Music, YouTube, YouTube Music, SoundCloud). persistence conflates session/device sync with
        saving; coded the mechanism the sample names.
    opus:
      - "policy asks who decides the order when the person does not, but most music queues answer
        twice: shuffle while the context lasts, then autoplay-similar when it runs out. I coded the
        toggle the product puts in front of you and noted the tail. surface also has no value for a
        queue that is never shown (Pandora), which I coded n/a rather than forcing it into Voice
        readout only."
    sonnet:
      - surface was a recurring judgment call between 'Full-screen list' and 'Sheet over player' for
        mobile up-next screens reached from Now Playing; leaned Sheet over player only where the
        product frames it as a tab/overlay on the player rather than its own dedicated page.
      - "`policy` is the biggest problem in this entry: it is pick one but asks a question most
        products answer several ways at once — a hand-built queue with a shuffle toggle and an
        autoplay-after-end switch is all three at once, which is why opus read every shuffle toggle
        as Shuffle while fable and I read the same screens as Strict manual order. It wants to be
        pick any. Two smaller ones: `surface`'s Full-screen list and Sheet over player overlap so
        far that the codebook's own Full-screen list exemplar (the Spotify Queue sheet) is a sheet
        over the player, and `surface` has no value for a queue rendered as a section of an ordinary
        page (Netflix's season list); `persistence` has no value for a queue that survives relaunch
        on one device but does not sync (Apple Music Up Next)."
  codedAt: 2026-09-22
