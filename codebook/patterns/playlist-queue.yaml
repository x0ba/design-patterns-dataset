# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "playlist-queue". Edit between batches only — see README "Rules".
id: playlist-queue
name: Playlist and queue
level: pattern
parent: consume-media
aliases:
  - queue
  - up next
  - play queue
  - watchlist continuum
definition: An ordered list of media items that defines what plays now and what comes after,
  editable during consumption.
data: sequence
platforms:
  - web
  - mobile
  - desktop
  - voice
domains:
  - entertainment
  - education
  - social
anatomy:
  - name: Now playing
    role: The current item
  - name: Up next
    role: Immediate successors
  - name: Saved playlist
    role: A reusable ordered collection
  - name: Shuffle and repeat
    role: Order policies
roles:
  - title
  - creator
  - duration
  - artwork
  - added-by
dimensions:
  - name: Queue structure
    family: composition
    question: How is the upcoming sequence structured?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: flat-up-next-list
            name: Flat up-next list
            example: YouTube Up next
          - id: manual-queue-over-a-context
            name: Manual queue over a context
            description: Queue sits on top of an album or playlist
            example: Spotify Queue
          - id: episode-season-order
            name: Episode season order
            example: Netflix episodes
          - id: radio-from-a-seed
            name: Radio from a seed
            example: Apple Music radio
          - id: collaborative-playlist
            name: Collaborative playlist
            example: Spotify collaborative playlists
          - id: rule-built-playlist
            name: Rule-built playlist
            description: The list is generated and maintained by a saved rule — these podcasts, sorted this way,
              this many episodes — and refills itself as new items arrive; neither hand-ordered nor
              algorithmically seeded
            example: Overcast — Playlist
  - name: Editing the order
    family: flow
    question: How does a person change what comes next?
    subdimensions:
      - id: edits
        name: Edits
        select: many
        values:
          - id: play-next
            name: Play next
            example: Spotify Play Next
          - id: add-to-end
            name: Add to end
            example: YouTube Add to queue
          - id: drag-reorder
            name: Drag reorder
            example: Spotify queue reorder
          - id: remove-from-queue
            name: Remove from queue
            example: Most players
          - id: clear-queue
            name: Clear queue
            example: Spotify
  - name: Order policy
    family: initiative
    question: Who decides the order when the person does not?
    subdimensions:
      - id: policy
        name: Policy
        select: one
        values:
          - id: strict-manual-order
            name: Strict manual order
            example: User-built playlist
          - id: shuffle
            name: Shuffle
            example: Spotify Shuffle
          - id: algorithmic-radio
            name: Algorithmic radio
            example: Spotify Radio
          - id: autoplay-similar-after-end
            name: Autoplay similar after end
            example: YouTube Autoplay
          - id: editorial-continuation
            name: Editorial continuation
            example: Netflix next episode
  - name: Item representation
    family: content
    question: What does each queued item show?
    subdimensions:
      - id: representation
        name: Representation
        select: many
        values:
          - id: title-and-creator
            name: Title and creator
            example: Spotify
          - id: artwork
            name: Artwork
            example: Apple Music
          - id: duration
            name: Duration
            example: YouTube
          - id: source-playlist
            name: Source playlist
            example: Spotify queue context
          - id: who-added-it
            name: Who added it
            example: Collaborative playlists
          - id: tempo-and-key
            name: Tempo and key
            description: DJ software shows BPM, musical key and beat-grid state per track, which decide what can
              be mixed next
            example: rekordbox — DJ deck with playlist
  - name: Queue surface
    family: layout
    question: Where is the queue shown?
    subdimensions:
      - id: surface
        name: Surface
        select: one
        values:
          - id: full-screen-list
            name: Full-screen list
            example: Spotify Queue sheet
          - id: side-panel
            name: Side panel
            example: YouTube desktop Up next
          - id: sheet-over-player
            name: Sheet over player
            example: Mobile Spotify
          - id: voice-readout-only
            name: Voice readout only
            example: Alexa queue
          - id: inline-under-now-playing
            name: Inline under Now Playing
            example: Apple Music
  - name: Persistence
    family: lifecycle
    question: Does the queue survive across sessions and devices?
    subdimensions:
      - id: persistence
        name: Persistence
        select: one
        values:
          - id: session-only
            name: Session only
            example: Many web embeds
          - id: saved-as-playlist
            name: Saved as playlist
            example: Convert queue to playlist
          - id: synced-devices
            name: Synced devices
            example: Spotify Connect
          - id: continue-watching-row
            name: Continue watching row
            description: Cross-session resume set
            example: Netflix
wild:
  score: 2
  note: Manual queue edits are common; policies for when autoplay may interrupt a queue are rarely
    exposed.
  examples:
    - name: Spotify
      note: Play Next, Add to Queue, reorder
    - name: YouTube
      note: Up next and Autoplay toggle
    - name: Apple Music
      note: Playing Next list
techniques:
  - name: Queue rules
    dimension: Order policy
    how: Make autoplay and shuffle into editable rules with priority over the manual queue (“finish
      album, then radio”).
    ai: false
  - name: Surface then reorder
    dimension: Item representation
    how: Any surfaced attribute (energy, BPM, duration left) becomes a sort key for the remaining queue.
    ai: false
  - name: Build the night
    dimension: Queue structure
    how: Describe a listening plan in words; the model proposes a queue with inspectable sources and
      swap alternatives.
    ai: true
signature: Queue rules
sample: Spotify, Apple Music, YouTube, Netflix, podcast apps and DJ software.
unit: One active queue or playlist playback context.
