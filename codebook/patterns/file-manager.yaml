  raterNotes:
    fable:
      - Grouping as pick-one hides that most managers offer By kind and By date as options; I coded
        the default state and noted the option. Mobile drill-down has no breadcrumbs strictly, coded
        as the nearest traversal.
      - metadata does not say whether values shown only in a preview pane for the selected file
        count; the codebook's own examples are per-row columns, and I coded that way. preview and
        grouping as pick one need a rule for a toggle that is off by default. A fixed folders-first
        split and category shortcut locations both get read as By kind by some raters. ownership has
        no value for a repository or workspace that is shared by construction.
    opus:
      - "view's List and Details table cannot be told apart from their glosses: the codebook's List
        exemplar (Finder list view) has named sortable columns, which is also the definition of
        Details table. I read List as the platform-neutral row list and reserved Details table for
        the Windows control and its clones, and flagged it. preview conflates 'a rendering of the
        file' with 'a metadata sidebar'; Box and Dropbox have both, and I coded the rendering.
        grouping is off by default nearly everywhere, so it is None for 17 of 20 — the three By kind
        codes are the folders-above-files band in cloud drives, which a rater could reasonably call
        ordering instead. File pickers (11, 12) inherit the host file manager's view settings, so
        their codes describe the common case rather than a fixed design."
      - "This entry's disagreements are mostly about *what counts as the screen*, and the codebook
        is the cause twice over. First, several variations are glossed with a product rather than a
        screen — Search first is 'e.g., Dropbox home' while the sampled Dropbox instance is All
        files, and Tree plus content is 'e.g., Windows Explorer' while Finder's sidebar is a places
        list — so a rater coding the product and a rater coding the screen disagree without either
        misreading anything. Second, `preview` and `metadata` do not say whether an affordance that
        must be summoned or switched on counts: Quick Look in an open panel, Explorer's optional
        preview pane, Total Commander's Ctrl+Q, Nautilus's separately-packaged Sushi, and a
        details-and-activity sheet behind a menu are all real but none is on screen at rest. I now
        code the resting state for `preview` and count a per-item pane for `ownership` only if this
        screen can open it; that rule is mine, not the codebook's. Smaller: `metadata` has no value
        for a change description (all three of us proposed one, two by the same name), and
        `ownership` is pick any but has a Local only value, so an empty list, ['Local only'] and n/a
        all get used for 'none of these'."
    sonnet:
      - grouping and view are coded for each screen's default/typical configuration rather than
        every capability the product exposes; metadata, ownership and other pick-any fields draw on
        full product knowledge, not only the sample note.
      - "Three patterns stood out. (1) A recurring sidebar-versus-navigation confusion: several
        products (Finder, the Photoshop/Word open dialogs, GNOME Files) have a sidebar of bookmarked
        locations that I initially coded as 'Tree plus content,' when the actual traversal mechanism
        is breadcrumb drill-down; Figma's sidebar, by contrast, genuinely nests Projects under Teams
        and is a real tree — the codebook doesn't currently distinguish 'sidebar of shortcuts' from
        'sidebar that is itself a hierarchy.' (2) 'Preview' repeatedly caught tools where opening a
        file IS the application's primary edit surface (VS Code, Figma, Canva) — none of that is a
        file-manager-style preview, and I initially over-coded a 'Viewer page' or 'Preview pane' for
        several of these before recognizing the pattern. (3) Metadata's 'what shows on the row
        itself' versus 'what shows in a separate detail/preview panel' is an easy conflation (Finder
        column view, iOS Files icon grid) that the codebook could make explicit."
