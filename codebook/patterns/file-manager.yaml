# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "file-manager". Edit between batches only — see README "Rules".
id: file-manager
name: File manager
level: pattern
parent: browse-collections
aliases:
  - file browser
  - Finder
  - Explorer
  - drive
definition: Browse, organize, preview and act on files and folders arranged in a hierarchy of locations.
data: hierarchy
platforms:
  - desktop
  - web
  - mobile
domains:
  - productivity
  - enterprise
  - software
anatomy:
  - name: Locations
    role: Sidebar of places and favourites
  - name: Path
    role: Where you are
  - name: Item area
    role: Files and folders here
  - name: Preview
    role: A look at the selected file
  - name: Toolbar
    role: View and file operations
roles:
  - name
  - kind
  - size
  - modified
  - owner
  - thumbnail
  - tags
dimensions:
  - name: Item view
    family: layout
    question: How are files shown, and where does a preview appear?
    subdimensions:
      - id: view
        name: Item view
        select: one
        values:
          - id: icons
            name: Icons
            example: Finder icon view
          - id: list
            name: List
            example: Finder list view
          - id: columns
            name: Columns
            description: Miller columns, one per level
            example: Finder column view
          - id: gallery
            name: Gallery
            description: Large preview with a filmstrip
            example: Finder gallery view
          - id: details-table
            name: Details table
            example: Windows Explorer details
      - id: preview
        name: Preview placement
        select: one
        values:
          - id: none
            name: None
            example: Terminal file lists
          - id: preview-pane
            name: Preview pane
            description: Beside the item area
            example: Windows Explorer preview pane
          - id: overlay-preview
            name: Overlay preview
            description: A transient full preview
            example: macOS Quick Look
          - id: viewer-page
            name: Viewer page
            description: Opens a viewer over the drive
            example: Google Drive preview
  - name: Navigation structure
    family: composition
    question: How are locations traversed, and how many are open at once?
    subdimensions:
      - id: traversal
        name: Traversal
        select: one
        values:
          - id: tree-plus-content
            name: Tree plus content
            example: Windows Explorer
          - id: miller-columns
            name: Miller columns
            example: Finder column view
          - id: drill-down-with-breadcrumbs
            name: Drill-down with breadcrumbs
            example: Google Drive
          - id: search-first
            name: Search first
            description: Recents and search over folders
            example: Dropbox home
      - id: multi
        name: Multiple locations
        select: one
        values:
          - id: single-window
            name: Single window
            example: Mobile file apps
          - id: tabs
            name: Tabs
            example: Finder tabs, Windows 11 Explorer tabs
          - id: dual-pane
            name: Dual pane
            description: Two locations side by side
            example: Total Commander
  - name: Metadata
    family: content
    question: What does each file show about itself?
    subdimensions:
      - id: metadata
        name: Metadata shown
        select: many
        values:
          - id: name
            name: Name
            example: All
          - id: size-and-kind
            name: Size and kind
            example: Finder list view
          - id: dates
            name: Dates
            example: Finder list view
          - id: tags-and-colours
            name: Tags and colours
            example: Finder tags
          - id: owner-and-sharing
            name: Owner and sharing
            example: Google Drive
          - id: thumbnails
            name: Thumbnails
            example: Windows large icons
          - id: last-change
            name: Last change
            description: The last commit or change message shown per file or folder
            example: GitHub — Repository file tree
  - name: Grouping
    family: scope
    question: Are files grouped, and can a folder be a query?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: none
            name: None
            example: Default views
          - id: by-kind
            name: By kind
            example: Finder Use Groups
          - id: by-date
            name: By date
            example: Finder Use Groups
          - id: saved-searches-as-folders
            name: Saved searches as folders
            example: macOS Smart Folders
  - name: Shared ownership
    family: collaboration
    question: How are other people’s files and activity shown?
    subdimensions:
      - id: ownership
        name: Ownership surfaces
        select: many
        values:
          - id: local-only
            name: Local only
            example: Finder on a local disk
          - id: shared-with-me-area
            name: Shared-with-me area
            example: Google Drive
          - id: activity-panel
            name: Activity panel
            description: Who changed what
            example: Google Drive activity
wild:
  score: 3
  note: Desktop file managers have long let people choose views, columns, icon sizes, sorting and
    grouping per folder.
  examples:
    - name: Finder
      note: View options per folder, including columns shown and groups
    - name: Windows Explorer
      note: Layout, details columns and grouping
    - name: macOS
      note: Smart Folders as saved queries
techniques:
  - name: Per-folder lenses
    dimension: Item view
    how: A folder carries its own view spec that can be copied to other folders or promoted to a
      default.
    ai: false
  - name: Surface from Get Info
    dimension: Metadata
    how: Surface any property from a file’s info panel as a column or thumbnail badge across the folder.
    ai: false
  - name: Organize by description
    dimension: Grouping
    how: “Group these by project” proposes generated tags you can accept per file.
    ai: true
signature: Per-folder lenses
sample: Operating-system file managers, cloud drives, and file pickers inside creative and office suites.
unit: One location view within one file manager.
