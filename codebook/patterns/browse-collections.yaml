scores:
  ubiquity: 5
  potential: 5
  spec: 5
evidence: agent-coded
usage:
  - Hoarders keep every attribute visible while minimalists strip the representation down (observed
    for overview–detail; expected to hold for any collection)
  - People reshape a collection mid-task, not only at the start
questions:
  - Is there one collection grammar under list, board, map and timeline, or do some arrangements
    need their own?
  - How should a collection carry its customization across products?
