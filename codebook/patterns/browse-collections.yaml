# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "browse-collections". Edit between batches only — see README "Rules".
id: browse-collections
name: Browse collections
level: archetype
aliases:
  - collection browsing
  - information foraging
definition: Scan many comparable things, narrow to the relevant few, and focus on one — the activity
  behind shopping, inboxes, file systems and search results alike.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - travel
  - communication
  - productivity
  - news
  - entertainment
anatomy:
  - name: Collection
    role: The whole set, in some organizing structure
  - name: Item representation
    role: How one item stands for itself inside the collection
  - name: Focus
    role: The deeper look at one item, wherever it opens
roles:
  - title
  - subtitle
  - thumbnail
  - key-attribute
  - action
dimensions:
  - name: Item representation
    family: content
    question: How much of each item does the collection show, and in what abstracted form?
    subdimensions:
      - id: depth
        name: Depth per item
        select: one
        values:
          - id: name-only
            name: Name only
            description: A label and nothing else
            example: Finder list view
          - id: summary
            name: Summary
            description: A few key attributes
            example: Gmail message rows
          - id: rich-preview
            name: Rich preview
            description: Media plus attributes
            example: Airbnb listing cards
          - id: full-inline
            name: Full inline
            description: The whole item in the collection
            example: Reddit expanded posts
          - id: media-only
            name: Media only
            description: A thumbnail or artwork stands for the item with no text or attributes at all
            example: Instagram — Explore tab
      - id: aggregate
        name: Collection-level abstraction
        select: many
        values:
          - id: none
            name: None
            description: Items only
            example: Plain search results
          - id: counts-and-totals
            name: Counts and totals
            description: Numbers about the whole set
            example: Facet counts on Amazon
          - id: clusters
            name: Clusters
            description: Groups formed from the items
            example: Google Photos people and places
          - id: visual-encoding
            name: Visual encoding
            description: Position or colour stands for values
            example: Zillow price pins
  - name: Organization
    family: composition
    question: What structure holds the items, and how many collections are in play?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: flat
            name: Flat
            description: One undifferentiated set
            example: Search results
          - id: grouped
            name: Grouped
            description: Items bucketed by a value
            example: Trello lists
          - id: hierarchical
            name: Hierarchical
            description: Items inside parents
            example: Folders in Google Drive
          - id: networked
            name: Networked
            description: Items linked to items
            example: Obsidian graph view
          - id: spatial
            name: Spatial
            description: Items at positions
            example: Apple Maps places
          - id: temporal
            name: Temporal
            description: Items along time
            example: Google Photos timeline
      - id: multiplicity
        name: Multiplicity
        select: one
        values:
          - id: single-collection
            name: Single collection
            description: One set at a time
            example: Most shopping results
          - id: coordinated-collections
            name: Coordinated collections
            description: Several views of one set, linked
            example: Zillow list plus map
          - id: nested-collections
            name: Nested collections
            description: Collections inside items
            example: Related items inside a product page
          - id: many-collections
            name: Many collections
            description: One screen stacks several distinct, independently sourced collections (streaming
              shelves, store home rows) that are neither views of one set nor nested inside an item
            example: Netflix — Home
  - name: Arrangement
    family: layout
    question: How are items placed on the screen?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: list
            name: List
            description: One item per row
            example: Gmail
          - id: grid
            name: Grid
            description: Items in rows and columns
            example: Etsy search
          - id: table
            name: Table
            description: Rows against attribute columns
            example: Airtable grid view
          - id: board
            name: Board
            description: Columns of cards by a value
            example: Trello
          - id: map
            name: Map
            description: Items at geographic positions
            example: Airbnb map
          - id: timeline
            name: Timeline
            description: Items along time
            example: Notion timeline view
          - id: canvas
            name: Canvas
            description: Items placed freely
            example: Miro boards
          - id: plot
            name: Plot
            description: Items at value positions
            example: CHI '25 probe scatter plot
          - id: shelves
            name: Shelves
            description: Stacked rows, each a horizontally scrolling strip for one group of items
            example: Netflix — Home
          - id: graph
            name: Graph
            description: Nodes and edges laid out by their links (force-directed), positions carrying no
              attribute value
            example: Obsidian — Graph view
  - name: Narrowing and scale
    family: scope
    question: How does a person get from everything to the few that matter, and how much is present at once?
    subdimensions:
      - id: narrowing
        name: Narrowing mechanisms
        select: many
        values:
          - id: scan
            name: Scan
            description: Scroll and read
            example: Social feeds
          - id: sort
            name: Sort
            description: Reorder by a key
            example: Price low to high
          - id: filter
            name: Filter
            description: Remove by value
            example: Faceted sidebars
          - id: search
            name: Search
            description: Match typed text
            example: Gmail search
          - id: group
            name: Group
            description: Bucket by a value
            example: Notion group by
          - id: zoom
            name: Zoom
            description: Change the level of detail
            example: Semantic zoom on a canvas
      - id: portion
        name: Portion present
        select: one
        values:
          - id: everything
            name: Everything
            description: The whole set is rendered
            example: Small settings lists
          - id: pages
            name: Pages
            description: Fixed-size pages
            example: Google Search
          - id: infinite-scroll
            name: Infinite scroll
            description: More arrives as you scroll
            example: Instagram
          - id: load-more
            name: Load more
            description: More arrives on request
            example: Hacker News More link
          - id: virtualized
            name: Virtualized
            description: Only visible rows exist
            example: Spreadsheet apps
wild:
  score: 2
  note: Productivity tools let people switch arrangement and grouping routinely; consumer products
    rarely do. CHI '25 measured 8.33% for overview–detail on the web.
  examples:
    - name: Notion databases
      note: Table, board, list, gallery, calendar and timeline views of one database
    - name: Craigslist
      note: Several listing layouts from a menu
    - name: Finder
      note: Icon, list, column and gallery views per folder
techniques:
  - name: Arrangement morphing
    dimension: Arrangement
    how: Switch arrangement while keeping the selection, the surfaced attributes and the scroll anchor,
      so a list becomes a board or a map without losing your place.
    ai: false
  - name: Surface, then organize
    dimension: Narrowing and scale
    how: Any attribute surfaced into the item representation becomes a sort key, a filter and a
      grouping, generalizing CHI '25’s surface-then-sort finding to every collection.
    ai: false
  - name: Describe the grouping
    dimension: Organization
    how: Ask for a structure in words (“group by what I’d need for the trip”); the model proposes a
      generated attribute and the grouping that uses it, both inspectable.
    ai: true
signature: Arrangement morphing
sample: App Store and Google Play top charts in every category, plus Similarweb top sites; code
  every screen whose main job is showing many comparable items.
unit: One presentation of one collection (a screen can hold several).
relations:
  uses:
    - card
    - filter-controls
    - sort-control
    - pagination
    - view-switcher
  specializes: []
  neighbors:
