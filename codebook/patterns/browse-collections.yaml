        status: raised
  raterNotes:
    fable:
      - "Three gaps: media-only depth (thumbnail mosaics, poster rows, photo libraries), shelves of
        carousels as an arrangement, and a node-link graph. Portion is only partly observable for
        services that load more silently (Slack coded ?)."
      - aggregate has an explicit None value, so [] and ['None'] read as a disagreement that is not
        one; pick-any lists should not carry a None. depth conflates media presence with attribute
        count, so a thumbnail beside two text lines lands in Summary or Rich preview by taste.
        Spatial structure and Visual encoding both claim position on a map. arrangement wants to be
        pick any when multiplicity is Coordinated.
    opus:
      - aggregate has a None variation inside a pick-any, so I wrote ["None"] rather than an empty
        array. depth needed a rung below Summary for pure thumbnail grids, and arrangement had
        nothing for shelves of horizontal carousels or for node-link graphs. multiplicity assumes
        one collection per screen; shelf home screens break it. I treated a global search bar that
        navigates away as not a narrowing mechanism of the collection on screen.
      - "Three codebook faults drove most of this packet: `aggregate` is pick any yet still lists a
        None variation, so ['None'] and [] are the same code recorded two ways and score as
        disagreement; `depth`'s Rich preview gloss ('media plus attributes') does not say whether a
        row-height icon or cover thumbnail counts as media, which is the whole Spotify/App Store
        split; and `arrangement` is pick one while `multiplicity` admits Coordinated collections, so
        a map-plus-list screen has two legal arrangements and no way to record both. Smaller:
        Grouped does not say whether the buckets must be visible at once (Gmail tabs), and the
        archetype's `arrangement` and the feed entry's `layout` name overlapping things at different
        grain (Masonry)."
    sonnet:
      - aggregate and narrowing are coded from full product knowledge of what the surface supports,
        not only what the sample's one-line note happens to mention.
      - Three codebook problems stood out most. (1) Aggregate's 'None' versus an empty list reads as
        a disagreement to the IRR tooling even when all raters agree nothing aggregates — a
        representation issue, not a coding one, and it drove roughly a third of this entry's cells.
        (2) Arrangement is pick-one but Zillow-style coordinated list+map screens truthfully hold
        two values at once; the codebook's own multiplicity gloss ('Zillow list plus map') already
        names which one to prefer when this happens, which is a usable tie-break rule the
        arrangement section itself should state. (3) Masonry is a named variation in the feed
        archetype's own vocabulary but missing from browse-collections' arrangement list, so the
        same visual pattern (Pinterest) gets a proposal here and a first-class value there — the two
        entries' arrangement vocabularies should be reconciled.
