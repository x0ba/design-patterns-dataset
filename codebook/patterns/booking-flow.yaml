# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "booking-flow". Edit between batches only — see README "Rules".
id: booking-flow
name: Booking flow
level: pattern
parent: transact
aliases:
  - reservation
  - appointment booking
  - ticketing
definition: Choosing a time, place or seat from what is available, then reserving it.
data: time
platforms:
  - web
  - mobile
domains:
  - travel
  - health
  - entertainment
  - mobility
anatomy:
  - name: Availability
    role: What can be booked
  - name: Selection
    role: The chosen slot or seat
  - name: Hold
    role: Keeping it while deciding
  - name: Confirmation
    role: The reservation
roles:
  - time
  - price
  - seat
  - availability
dimensions:
  - name: Selection order
    family: flow
    question: In what order are choices made?
    subdimensions:
      - id: order
        name: Order
        select: one
        values:
          - id: date-first
            name: Date first
            example: Hotel search
          - id: venue-first-then-time
            name: Venue first, then time
            example: OpenTable
          - id: seat-map-first
            name: Seat map first
            example: Ticketmaster
          - id: flexible-across-dates
            name: Flexible across dates
            example: Google Flights date grid
  - name: Availability
    family: content
    question: How is what can be booked shown?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: list-of-slots
            name: List of slots
            example: Doctor appointment slots
          - id: calendar-with-availability
            name: Calendar with availability
            example: Calendly
          - id: price-calendar
            name: Price calendar
            example: Southwest low-fare calendar
          - id: seat-map-with-price-tiers
            name: Seat map with price tiers
            example: Ticketmaster
  - name: Hold
    family: lifecycle
    question: Is the choice held while deciding?
    subdimensions:
      - id: hold
        name: Hold
        select: one
        values:
          - id: no-hold
            name: No hold
            example: First come, first served
          - id: timed-hold-with-countdown
            name: Timed hold with countdown
            example: Ticketmaster
          - id: waitlist
            name: Waitlist
            example: Resy Notify
          - id: request-pending-approval
            name: Request pending approval
            example: Airbnb Request to Book
  - name: Price and scarcity
    family: encoding
    question: How are price and scarcity signalled?
    subdimensions:
      - id: signals
        name: Signals
        select: many
        values:
          - id: price-per-option
            name: Price per option
            example: Airline fares
          - id: few-left
            name: Few left
            example: Hotel booking sites
          - id: demand-level
            name: Demand level
            example: Ride-hailing surge
          - id: price-change-warning
            name: Price change warning
            example: Google Flights price tracking
  - name: Party and extras
    family: scope
    question: What else is booked with it?
    subdimensions:
      - id: extras
        name: Extras
        select: many
        values:
          - id: party-size
            name: Party size
            example: Restaurants
          - id: add-ons
            name: Add-ons
            example: Bags and seats
          - id: several-units
            name: Several units
            example: Multi-room hotel bookings
          - id: group-coordination
            name: Group coordination
            example: Group trip planning
  - name: Confirmation
    family: feedback
    question: How is the booking confirmed?
    subdimensions:
      - id: confirmation
        name: Confirmation
        select: one
        values:
          - id: on-screen
            name: On screen
            example: Most
          - id: email-and-calendar-invite
            name: Email and calendar invite
            example: Calendly
          - id: wallet-pass
            name: Wallet pass
            example: Apple Wallet boarding passes
wild:
  score: 1
  note: Date flexibility and price alerts are the main levers.
  examples:
    - name: Google Flights
      note: Date grid and price tracking
    - name: Airbnb
      note: Flexible dates
techniques:
  - name: Availability as attributes
    dimension: Availability
    how: Choose which per-slot attribute annotates the grid (price, crowding, travel time), generalizing
      Southwest’s cheapest-fares calendar.
    ai: false
  - name: Find a slot that fits
    dimension: Selection order
    how: Cross availability with the person’s calendar and constraints, showing why each candidate fits.
    ai: true
signature: Availability as attributes
sample: Airline, hotel, restaurant, clinic and event ticketing booking flows.
unit: One booking flow.
relations:
  uses:
    - date-picker
    - seat-map
    - calendar
    - progress-indicator
    - confirmation
  specializes:
    - transact
  neighbors:
    - availability-picker
    - checkout
scores:
  ubiquity: 4
  potential: 4
  spec: 5
evidence: agent-coded
usage:
  - Flexible travellers compare across dates before choosing any
questions:
  - Is an availability grid an overview whose items are time slots?
coding:
