  raterNotes:
    fable:
      - "confirmation: 'Email and calendar invite' was used for every emailed confirmation even
        where no .ics is attached, since there is no plain 'Email' variation; ticketing coded Wallet
        pass because the pass is the artifact. Google Flights has no confirmation of its own (n/a)."
      - Party size and Several units are not distinguishable for ticket quantity. Wallet pass names
        a boarding pass, which arrives at check-in, not at booking; the gloss should say which
        moment it codes. Sonnet coded n/a for confirmation on screens before purchase, so the unit
        of analysis needs to say the flow is coded through to its end.
    opus:
      - "confirmation is pick-one but nearly every flow confirms on screen, emails a record and
        offers a pass; I coded the durable artefact the product pushes you toward (wallet pass for
        travel and ticketing, email for hotels and restaurants) rather than the on-screen page,
        which is the choice most likely to split raters. signals and extras are empty for all four
        clinic/health bookings, which is itself a finding: medical booking flows deliberately carry
        no price, scarcity or upsell."
      - confirmation is pick one but every flow here also confirms on screen, so On screen is a
        floor that competes with the artefact that actually matters — it wants to be pick any, or to
        be re-glossed as 'the durable artefact'. order has no value for a flow whose date and venue
        are both fixed by the item (Eventbrite, any single event), which is what sent three raters
        to three different codes. signals lacks a value rating — SeatGeek's Deal Score is a
        judgement about price against market, not a demand level, and I coded it Demand level only
        because nothing else fits. Party size and Several units also overlap wherever a quantity
        picker both counts the party and adds units.
    sonnet:
      - confirmation is n/a for several instances (Google Flights, Southwest, Hopper,
        Ticketmaster/SeatGeek/StubHub seat maps, AMC) because the sampled screen is search/selection
        prior to an actual completed booking, which happens on a later screen not described here.
      - "Two codebook problems recurred here. (1) order has no variation for a booking flow entered
        at a single already-fixed event/venue+time where the remaining choice is only ticket type
        and quantity (Eventbrite) — none of the four variations describe that, and n/a is a real gap
        rather than a rater disagreement. (2) confirmation and the entry's stated 'unit of analysis:
        one booking flow' pulled against the literal 'screen' sample text more than once: several of
        my round-1 n/a codes wrongly stopped coding at the pictured pre-purchase screen (Southwest's
        calendar, Ticketmaster's seat map, Hopper's price-prediction view) instead of coding the
        whole flow's eventual confirmation from product knowledge, the way fable and opus did — the
        codebook could say explicitly whether a sampled screen bounds the instance or merely anchors
        it."
