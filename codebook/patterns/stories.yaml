        dim: null
        name: Permanent page
        gloss: "The frames never expire: the story is a durable page or artefact (a publisher URL, a yearly
          recap, a generated memory) that happens to use the story form"
        raters:
          - opus
        instances:
          - 12
          - 14
          - 20
        status: raised
      - place: sub:presentation
        sub: presentation
        dim: Presentation
        name: Tied to profile picture
        gloss: A single ambient status is shown behind or attached to a person's profile picture itself,
          rather than in a feed tray, a standalone tab, inline in the chat list, or a desktop column
        raters:
          - sonnet
        instances:
          - 16
        status: raised
  raterNotes:
    fable:
      - presentation was read as where the stories live (tray, tab, column, profile) since three of
        its five variations are entry points; 'Full-bleed vertical' was kept for stacks with no home
        surface. ordering is unobservable from memory for VK, Twitch and LINE.
    opus:
      - "The pattern assumes an author tray, an expiry and an audience, and four instances (Web
        Stories, Wrapped, Memories, and Highlights to a lesser degree) borrow the story grammar
        without any of the three — hence two proposals and several n/a in ordering. presentation
        also mixes the playback surface with where stories live in the app: Full-bleed vertical is
        true of every mobile instance, so I used it only where nothing more specific applied and
        coded the tray, tab or chat-list home otherwise."
    sonnet:
      - "presentation required a consistent rule since the codebook cites Instagram for two
        different values (Full-bleed vertical and Tray above feed): coded the product's structural
        home for stories (tray-in-feed vs standalone tab vs inline-in-chat vs desktop split) where
        that distinction was the more informative fact, and Full-bleed vertical only for
        single-author/personal experiences with no such structural placement (Web Stories,
        Highlights, Wrapped, Memories)."
      - "`presentation` is the entry's real problem: it is pick one but its five values sit on two
        axes — Full-bleed vertical describes how a frame plays, while Tray above feed, Standalone
        status tab, Inline in chat list and Desktop column describe where you enter from — and the
        codebook itself cites Instagram for two of them, which is why the three raters split on
        Snapchat, TikTok, Telegram, Signal, Highlights and Memories. It wants to be pick any, or to
        be split into two sub-dimensions. `ordering` has the same shape at a smaller scale:
        unseen-first is a layer over a chronological or ranked base order, so 'Unseen first'
        swallows almost every tray if read strictly. Two smaller findings: `lifetime`'s 24-hour
        expiry hard-codes a duration that Twitch (48h) and Telegram (6/12/24/48h, selectable) do not
        share — one 'fixed expiry window' variation carrying the duration would fix it — and
        `audience` has no value for 'everyone on this platform' short of the open web (Snapchat
        Discover, Telegram's default Everyone), nor for a story with no audience at all until it is
        shared (adopted here as +Just me)."
