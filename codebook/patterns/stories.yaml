# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "stories". Edit between batches only — see README "Rules".
id: stories
name: Stories
level: pattern
parent: consume-media
aliases:
  - status stories
  - ephemeral stories
  - story rings
definition: Full-bleed, timed, ephemeral frames advanced by tap or wait, usually from people you
  follow and gone within a day.
data: sequence
platforms:
  - mobile
  - web
domains:
  - social
  - entertainment
  - commerce
  - news
anatomy:
  - name: Tray
    role: Circles of available story authors
  - name: Frame
    role: One full-screen card
  - name: Progress segments
    role: Per-frame timers
  - name: Reply and react
    role: Lightweight responses
roles:
  - author
  - frame
  - sticker
  - cta
  - timestamp
dimensions:
  - name: Frame content
    family: content
    question: What can a frame hold?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: photo-or-video
            name: Photo or video
            example: Instagram Stories
          - id: text-stickers-and-polls
            name: Text stickers and polls
            example: Instagram stickers
          - id: music-attachment
            name: Music attachment
            example: Instagram music stickers
          - id: link-or-product-sticker
            name: Link or product sticker
            example: Instagram shopping
          - id: boomerang-or-layout
            name: Boomerang or layout
            example: Instagram camera modes
  - name: Advance and pace
    family: flow
    question: How do frames advance?
    subdimensions:
      - id: advance
        name: Advance
        select: many
        values:
          - id: auto-advance-on-timer
            name: Auto-advance on timer
            example: Instagram
          - id: tap-next-previous
            name: Tap next previous
            example: Snapchat
          - id: hold-to-pause
            name: Hold to pause
            example: Instagram
          - id: swipe-up-for-more
            name: Swipe up for more
            example: Link stickers
          - id: skip-unwatched-authors
            name: Skip unwatched authors
            example: Tray navigation
  - name: Tray and order
    family: composition
    question: How are authors ordered in the tray?
    subdimensions:
      - id: ordering
        name: Ordering
        select: one
        values:
          - id: unseen-first
            name: Unseen first
            example: Instagram
          - id: close-friends-priority
            name: Close friends priority
            example: Instagram Close Friends
          - id: chronological-authors
            name: Chronological authors
            example: Some Twitter/X flashes
          - id: algorithmic-ranking
            name: Algorithmic ranking
            example: Facebook Stories
          - id: self-always-first
            name: Self always first
            example: Add-your-story affordance
  - name: Ephemerality
    family: lifecycle
    question: How long do frames last, and can they persist?
    subdimensions:
      - id: lifetime
        name: Lifetime
        select: one
        values:
          - id: 24-hour-expiry
            name: 24-hour expiry
            example: Instagram Stories
          - id: view-once
            name: View-once
            example: Snapchat
          - id: highlights-archive
            name: Highlights archive
            example: Instagram Highlights
          - id: story-saved-to-profile-grid
            name: Story saved to profile grid
            example: Optional keep
          - id: live-story-window
            name: Live story window
            example: Event-duration stories
          - id: no-expiry
            name: No expiry
            description: Frames persist indefinitely at a stable URL or in a library, with no archive step
              needed
            example: Google Web Stories — Publisher web story
          - id: 48-hour-expiry
            name: 48-hour expiry
            description: A fixed expiry longer than a day
            example: Twitch — Stories
  - name: Audience and privacy
    family: scope
    question: Who can see a frame?
    subdimensions:
      - id: audience
        name: Audience
        select: one
        values:
          - id: all-followers
            name: All followers
            example: Default Instagram
          - id: close-friends-list
            name: Close friends list
            example: Instagram Close Friends
          - id: custom-exclude-list
            name: Custom exclude list
            example: Hide story from
          - id: public-web
            name: Public web
            example: News org stories
          - id: contacts-only
            name: Contacts only
            example: WhatsApp Status
          - id: just-me
            name: Just me
            description: The frames are personal and have no audience at all unless their owner explicitly
              shares one out — the story form used for a private artefact
            example: Spotify — Wrapped
  - name: Presentation
    family: layout
    question: How is the story experienced on screen?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: full-bleed-vertical
            name: Full-bleed vertical
            example: Instagram
          - id: tray-above-feed
            name: Tray above feed
            example: Instagram home
          - id: standalone-status-tab
            name: Standalone status tab
            example: WhatsApp Status
          - id: inline-in-chat-list
            name: Inline in chat list
            example: Signal
          - id: desktop-column
            name: Desktop column
            example: Instagram web
          - id: on-a-profile
            name: On a profile
            description: Stories live on a profile page (highlight circles under the bio, a status behind the
              avatar) rather than in a tray, tab or column
            example: Instagram — Highlights on a profile
wild:
  score: 1
  note: Close Friends and hide-from lists exist; timer length and tray ranking are almost never
    user-tunable.
  examples:
    - name: Instagram
      note: Close Friends and hide story from
    - name: Snapchat
      note: Custom story audiences
techniques:
  - name: Pace the timer
    dimension: Advance and pace
    how: Let people set default dwell time and tap-skip size as a personal stories pace, separate from
      feed scroll speed.
    ai: false
  - name: Tray as overview
    dimension: Tray and order
    how: Surface why an author is high in the tray and allow pin, mute and regroup by attribute
      (mutuals, brands, news).
    ai: false
  - name: Catch me up
    dimension: Ephemerality
    how: Summarize unseen stories from selected authors with links back to each frame before they
      expire.
    ai: true
signature: Pace the timer
sample: Instagram, Snapchat, WhatsApp Status, Facebook Stories and TikTok Stories.
unit: One author stack viewed in one session.
relations:
  uses:
    - progress-indicator
    - reactions
    - badge
    - carousel
  specializes:
    - consume-media
  neighbors:
    - feed
    - media-player
