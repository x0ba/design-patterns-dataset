# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "video-call". Edit between batches only — see README "Rules".
id: video-call
name: Video call
level: pattern
parent: communicate
aliases:
  - video meeting
  - conference call
definition: Real-time audio and video among several participants, with shared content and side channels.
data: stream
platforms:
  - desktop
  - web
  - mobile
domains:
  - communication
  - enterprise
  - education
  - health
anatomy:
  - name: Participant tiles
    role: People
  - name: Stage
    role: Shared content
  - name: Controls
    role: Mute, camera, share, leave
  - name: Side panels
    role: Chat, participants, notes
roles:
  - name
  - video
  - status
dimensions:
  - name: Participant layout
    family: layout
    question: How are people and shared content arranged?
    subdimensions:
      - id: people
        name: People
        select: one
        values:
          - id: speaker-view
            name: Speaker view
            example: Zoom
          - id: gallery-grid
            name: Gallery grid
            example: Zoom gallery
          - id: pinned-or-spotlighted
            name: Pinned or spotlighted
            example: Google Meet pin
          - id: shared-scene
            name: Shared scene
            example: Teams Together mode
          - id: floating-mini-window
            name: Floating mini window
            example: Picture-in-picture calls
          - id: spatial-tiles
            name: Spatial tiles
            description: Participant tiles float in the user's physical room and can be placed freely, rather
              than in a grid or speaker layout
            example: FaceTime — Call on Apple Vision Pro
          - id: tiles-placed-in-the-room
            name: Tiles placed in the room
            description: Each participant is a separate window the wearer positions in their own physical space;
              there is no shared arrangement and no self view
            example: FaceTime — Call on Apple Vision Pro
      - id: withContent
        name: With shared content
        select: one
        values:
          - id: content-with-filmstrip
            name: Content with filmstrip
            example: Google Meet
          - id: content-beside-speakers
            name: Content beside speakers
            example: Zoom side-by-side mode
          - id: presenter-over-slides
            name: Presenter over slides
            example: Teams Standout
  - name: Sub-spaces
    family: composition
    question: Can the call split?
    subdimensions:
      - id: subspaces
        name: Sub-spaces
        select: one
        values:
          - id: one-room
            name: One room
            example: Most calls
          - id: breakout-rooms
            name: Breakout rooms
            example: Zoom
          - id: persistent-spatial-rooms
            name: Persistent spatial rooms
            example: Gather
          - id: persistent-named-rooms
            name: Persistent named rooms
            description: A server holds several always-on voice rooms that people move between by name, with no
              map or proximity
            example: Discord — Voice channel with video
  - name: Tile information
    family: content
    question: What does a tile say?
    subdimensions:
      - id: tile
        name: Tile
        select: many
        values:
          - id: name
            name: Name
            example: All
          - id: mute-and-hand-raised
            name: Mute and hand raised
            example: Zoom
          - id: speaking-indicator
            name: Speaking indicator
            example: Google Meet
          - id: live-captions
            name: Live captions
            example: Google Meet captions
          - id: reactions
            name: Reactions
            example: Zoom reactions
  - name: Meeting assistance
    family: initiative
    question: What does the system capture or do?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Basic calls
          - id: transcript
            name: Transcript
            example: Teams transcription
          - id: notes-and-action-items
            name: Notes and action items
            example: Google Meet Take notes for me, Zoom AI Companion
          - id: noise-suppression
            name: Noise suppression
            example: Krisp in Discord
  - name: Attention controls
    family: scope
    question: What can each person hide or pin for themselves?
    subdimensions:
      - id: attention
        name: Attention
        select: many
        values:
          - id: hide-self-view
            name: Hide self view
            example: Zoom
          - id: hide-non-video-participants
            name: Hide non-video participants
            example: Zoom
          - id: pin-a-participant
            name: Pin a participant
            example: Google Meet
          - id: mute-everyone
            name: Mute everyone
            description: Host control
            example: Zoom
  - name: Constraints
    family: adaptation
    question: How does it adapt to bandwidth and device?
    subdimensions:
      - id: constraints
        name: Constraints
        select: one
        values:
          - id: automatic-quality
            name: Automatic quality
            example: All
          - id: audio-only
            name: Audio only
            example: Mobile calls
          - id: low-data-mode
            name: Low-data mode
            example: WhatsApp low data usage
          - id: dial-in
            name: Dial-in
            example: Zoom phone dial-in
wild:
  score: 2
  note: Layout, pinning and self-view are per-person choices in major tools.
  examples:
    - name: Zoom
      note: Speaker or gallery view, hide self view
    - name: Google Meet
      note: Tile count and pinning
techniques:
  - name: Stage composer
    dimension: Participant layout
    how: Each person composes their own stage from the call’s streams (who, which content, captions,
      notes) and saves it for recurring meetings.
    ai: false
  - name: What did I miss?
    dimension: Meeting assistance
    how: Joining late brings a summary with jump points into the recording and transcript.
    ai: true
signature: Stage composer
sample: Meeting, webinar, classroom and telehealth platforms.
unit: One call interface.
