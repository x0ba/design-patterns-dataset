    recorded:
      - place: sub:people
        sub: people
        dim: null
        name: Avatars in a space
        gloss: People are avatars in a shared virtual space rather than tiles; video exists only for whoever
          your avatar is standing near
        raters:
          - opus
        instances:
          - 10
        status: raised
  raterNotes:
    fable:
      - constraints is pick-one but most products offer automatic quality plus something more
        specific; I coded the most specific adaptation the product offers (dial-in, low-data,
        audio-only) and Automatic quality only when nothing more specific exists. attention and tile
        are partly unobservable from memory for the smaller products (Whereby, Messenger, Huddles)
        so some lists are conservative.
      - tile's Live captions exemplar (Meet) is a caption line along the bottom, not on a tile, so
        raters split on whether captions belong to the tile; say where. constraints is pick one but
        products hold dial-in, audio-only and low-data at once; it wants pick any or a most-specific
        rule.
    opus:
      - "constraints is pick-one but nearly every product has several fallbacks, so I ranked them
        Dial-in > Low-data mode > Audio only > Automatic quality and coded the deepest one each
        product offers as an explicit affordance. tile's Live captions never fired: every product I
        know draws captions along the bottom of the stage, not on a person's tile — worth checking
        whether that variation describes anything real."
      - "Two codebook faults drove most of this entry: Live captions sits under Tile information
        although captions are a call-level overlay in every product that has them, and constraints
        is pick one although automatic quality is glossed 'All' and stacks under dial-in, audio-only
        and low-data — it should be pick any, or automatic quality should be dropped as the
        baseline."
    sonnet:
      - attention is unobservable from general product knowledge for most non-flagship tools (only
        Zoom and Google Meet are cited by the codebook itself); coded '?' rather than guess for the
        majority of instances.
      - "Three codebook problems, and this entry's low kappa comes almost entirely from them. (1)
        constraints is unusable as pick one because its first value, Automatic quality, is glossed
        'e.g., All' — it is true of every instance, so a rater who codes it honestly records nothing
        and a rater who codes the distinctive adaptation records something else; it should be pick
        any, or Automatic quality should be dropped as a baseline. (2) withContent came out Content
        with filmstrip for all thirteen disputed cells, because the other two values (Content beside
        speakers, Presenter over slides) are opt-in modes of a single product rather than layouts a
        product chooses — the sub barely discriminates as written. (3) tile's Live captions is
        ambiguous about where the caption renders: most products draw captions at the bottom of the
        window with a speaker name rather than on the tile, which is why one rater coded it
        everywhere and another nowhere; I coded it wherever the call ships live captions and the
        codebook should say which it means. Minor: attention has no explicit 'None' value, so
        'nothing applies' has to be an empty array."
