# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "generative-variations". Edit between batches only — see README "Rules".
id: generative-variations
name: Generative variations
level: pattern
parent: delegate-ai
aliases:
  - option grid
  - image variations
  - design alternatives
definition: A model produces multiple candidate outputs for one brief so a person can compare, pick,
  remix or regenerate along chosen dimensions.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - design
  - entertainment
  - ai
  - productivity
  - commerce
anatomy:
  - name: Brief
    role: The shared prompt or constraints
  - name: Candidate
    role: One generated option
  - name: Grid or strip
    role: How candidates are compared
  - name: Controls
    role: Vary, remix, upscale, apply
roles: []
dimensions:
  - name: Candidate representation
    family: content
    question: What does each variation show?
    subdimensions:
      - id: representation
        name: Representation
        select: one
        values:
          - id: image-thumbnail
            name: Image thumbnail
            example: Midjourney grid
          - id: text-alternative
            name: Text alternative
            example: ChatGPT regenerate options
          - id: layout-or-frame
            name: Layout or frame
            example: Canva Magic Design
          - id: code-or-config-snippet
            name: Code or config snippet
            example: Alternative implementations
          - id: audio-or-video-take
            name: Audio or video take
            example: Generative media tools
  - name: Set composition
    family: composition
    question: How do candidates relate to the brief and each other?
    subdimensions:
      - id: setForm
        name: Set form
        select: one
        values:
          - id: flat-grid-of-n
            name: Flat grid of N
            example: Midjourney 2×2
          - id: ranked-list
            name: Ranked list
            example: Copy alternatives
          - id: dimension-axes
            name: Dimension axes
            description: Vary one factor per axis
            example: Luminate-style spaces
          - id: parent-with-remix-children
            name: Parent with remix children
            example: Midjourney variations
          - id: single-slot-replace
            name: Single slot replace
            example: Regenerate in place
  - name: Comparison layout
    family: layout
    question: How are variations arranged for choice?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: uniform-grid
            name: Uniform grid
            example: Midjourney
          - id: carousel
            name: Carousel
            example: Mobile generators
          - id: side-by-side-pair
            name: Side-by-side pair
            example: A/B rewrite
          - id: scatter-by-attributes
            name: Scatter by attributes
            example: Design-space plots
          - id: stacked-with-expand
            name: Stacked with expand
            example: Text variants
  - name: Generation controls
    family: invocation
    question: How does the person request or steer the set?
    subdimensions:
      - id: controls
        name: Controls
        select: many
        values:
          - id: prompt-and-parameters
            name: Prompt and parameters
            example: Midjourney --stylize
          - id: vary-strong-subtle
            name: Vary strong / subtle
            example: Midjourney V buttons
          - id: lock-some-attributes
            name: Lock some attributes
            example: Seed and character refs
          - id: pick-winners-to-breed
            name: Pick winners to breed
            example: Remix selected
          - id: natural-language-restyle
            name: Natural-language restyle
            example: Describe what to change
  - name: Selection flow
    family: flow
    question: How does choosing proceed after candidates appear?
    subdimensions:
      - id: selection
        name: Selection
        select: one
        values:
          - id: pick-one-to-upscale
            name: Pick one to upscale
            example: Midjourney U
          - id: multi-select-to-keep
            name: Multi-select to keep
            example: Boards of favorites
          - id: blend-selected
            name: Blend selected
            example: Image blend
          - id: apply-to-canvas
            name: Apply to canvas
            example: Figma AI insert
          - id: reject-all-and-rerun
            name: Reject all and rerun
            example: Regenerate
  - name: Provenance feedback
    family: feedback
    question: How are origin and parameters shown on candidates?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: job-id-and-seed
            name: Job id and seed
            example: Midjourney
          - id: parameter-chips
            name: Parameter chips
            example: Generator settings
          - id: parent-linkage
            name: Parent linkage
            example: Variation-of markers
          - id: safety-or-filter-flags
            name: Safety or filter flags
            example: Blocked grids
          - id: none-shown
            name: None shown
            example: Opaque consumer apps
wild:
  score: 2
  note: Parameters, seeds and remix strength are commonly tweaked; grid size less often.
  examples:
    - name: Midjourney
      note: Parameters, remix, vary region
    - name: Canva
      note: Magic Studio regenerate
    - name: ChatGPT
      note: Regenerate / try again
techniques:
  - name: Vary along named dimensions
    dimension: Set composition
    how: Expose axes (style, layout, tone) so the grid is a small design space, not an opaque shuffle.
    ai: false
  - name: Breed from winners
    dimension: Generation controls
    how: Selecting candidates feeds a next generation with locked and free attributes made visible.
    ai: true
  - name: Keep the brief beside the grid
    dimension: Comparison layout
    how: Show the editable brief and parameters while comparing so regeneration does not lose intent.
    ai: false
signature: Vary along named dimensions
sample: Image generators, marketing copy tools, design assistants and alternative-UI generators.
unit: One generation set from one brief.
relations:
  uses:
    - prompt-input
    - ai-provenance
    - card
    - slider
  specializes:
    - delegate-ai
  neighbors:
    - inline-suggestion
    - canvas-editor
    - ai-chat
scores:
  ubiquity: 3
  potential: 5
  spec: 4
evidence: agent-coded
usage:
  - People upscale then still ask for variations of the winner
questions:
  - Which axes should be user-named versus inferred from the brief?
coding:
