  raterNotes:
    fable:
      - Selection's Pick one to upscale was read as pick one to take further (download, extend,
        remix, save) since only Midjourney upscales; single-slot flows (Gmail drafts, v0) have no
        comparison layout, coded n/a.
      - Selection's Pick one to upscale is read by all three as pick one to take further and should
        say so; single-slot products (Gmail, v0) have no set to lay out, so layout and selection
        strain there.
    opus:
      - Layout is n/a whenever the set is one slot (Gmail, v0), which the codebook should perhaps
        say outright; Pick one to upscale had to absorb every take-one-further move — download,
        extend, remix, save — since upscaling as such only exists in a few image tools, and setForm
        vs layout overlap heavily (a flat grid of N is almost always a uniform grid).
      - "The recurring fault here is that three subs describe the same fact from different angles:
        Single slot replace (setForm), Stacked with expand (layout) and Apply to canvas (selection)
        all get used for a one-candidate tool, so raters differ on which sub carries the
        observation. `layout` also needs to say whether it describes one generation set or the feed
        of past sets — that alone split Leonardo and Sora."
    sonnet:
      - Selection was frequently 'pick the one to carry forward,' which I mapped to Pick one to
        upscale even outside literal image upscaling (extend/remix/save/finalize) since it's the
        closest existing variation for that mechanism.
