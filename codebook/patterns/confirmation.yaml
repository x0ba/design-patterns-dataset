# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "confirmation". Edit between batches only — see README "Rules".
id: confirmation
name: Confirmation
level: component
parent: transact
aliases:
  - confirm dialog
  - are you sure
  - destructive confirm
definition: A deliberate pause asking a person to confirm a consequential action.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - software
  - finance
  - productivity
  - enterprise
anatomy:
  - name: Question
    role: What is about to happen
  - name: Consequence
    role: What cannot be undone
  - name: Actions
    role: Confirm or cancel
roles: []
dimensions:
  - name: Friction
    family: feedback
    question: How much effort does confirming take?
    subdimensions:
      - id: friction
        name: Friction
        select: one
        values:
          - id: simple-confirm
            name: Simple confirm
            example: OK and Cancel
          - id: consequence-in-the-button
            name: Consequence in the button
            description: Delete 3 files
            example: Well-written dialogs
          - id: type-to-confirm
            name: Type to confirm
            example: GitHub delete repository
          - id: hold-to-confirm
            name: Hold to confirm
            example: Long-press destructive actions
          - id: swipe-to-confirm
            name: Swipe to confirm
            description: A slider or swipe gesture commits the action, so it cannot be triggered by a stray tap
            example: Robinhood — Swipe up to submit
          - id: physical-button-plus-biometric
            name: Physical button plus biometric
            description: A hardware button press (double-click the side button) combined with Face ID or Touch
              ID authorises the action
            example: Apple Pay — Confirm with side button
          - id: biometric-confirm
            name: Biometric confirm
            description: Confirming means authenticating — Face ID, a fingerprint, a hardware button press —
              rather than pressing a button in the interface; the proof of intent comes from the
              device
            example: Apple Pay — Confirm with side button
          - id: re-authenticate
            name: Re-authenticate
            description: Confirming requires proving who you are again — re-entering the password or a 2FA code
              — rather than typing the object's name
            example: Facebook — Delete account
  - name: Explanation
    family: content
    question: What does it explain?
    subdimensions:
      - id: explanation
        name: Explanation
        select: many
        values:
          - id: what-will-happen
            name: What will happen
            example: Most
          - id: what-cannot-be-undone
            name: What cannot be undone
            example: Permanent deletion
          - id: affected-items
            name: Affected items
            example: Bulk deletes
          - id: an-alternative
            name: An alternative
            description: Archive instead
            example: Account deletion flows
  - name: When to ask
    family: initiative
    question: Under what conditions does it appear?
    subdimensions:
      - id: when
        name: When
        select: one
        values:
          - id: always
            name: Always
            example: Legacy apps
          - id: only-irreversible-actions
            name: Only irreversible actions
            example: Good practice
          - id: above-a-threshold
            name: Above a threshold
            example: Large transfers
          - id: never-rely-on-undo
            name: Never, rely on undo
            example: Gmail archive
          - id: on-a-likely-mistake
            name: On a likely mistake
            description: The dialog appears only when a heuristic suggests a slip (empty subject, 'attached'
              with no attachment), not on every action or only irreversible ones
            example: Gmail — Send without subject
          - id: on-a-detected-condition
            name: On a detected condition
            description: The dialog appears only because the system noticed something specific about this
              particular action (an empty subject line, unsaved changes, a mentioned attachment that
              is missing) — not because the action is always dangerous
            example: Gmail — Send without subject
  - name: Form
    family: layout
    question: Where does it ask?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: modal
            name: Modal
            example: Most
          - id: inline-at-the-control
            name: Inline at the control
            example: Two-step inline buttons
          - id: popover
            name: Popover
            example: Popconfirm components
          - id: full-page
            name: Full page
            example: Account deletion
wild:
  score: 1
  note: Don’t ask again checkboxes let people remove some confirmations.
  examples:
    - name: macOS
      note: Warn before emptying the Trash setting
techniques:
  - name: Undo over asking
    dimension: When to ask
    how: A person chooses an undo window instead of a confirmation for a class of actions.
    ai: false
signature: Undo over asking
sample: Destructive and financial actions across apps.
unit: One confirmation.
