          - sonnet
    recorded:
      - place: sub:friction
        sub: friction
        dim: null
        name: Slide to confirm
        gloss: "The commit requires dragging a control across a track (swipe up to submit, slide to power
          off): deliberate and hard to do by accident, like hold-to-confirm but a different gesture"
        raters:
          - opus
        instances:
          - 11
          - 12
        status: raised
  raterNotes:
    fable:
      - "friction: I read 'Consequence in the button' as any verb-labelled button (Delete, Send
        money, Empty Trash) and 'Simple confirm' as OK/Yes/No; the codebook's 'Delete 3 files'
        example may intend a stricter reading (count in the label), which would move most of these
        to Simple confirm."
      - Consequence in the button needs a line on whether a bare verb (Delete) counts or only a
        button that names the outcome (Delete 3 files, Empty Trash); raters split on exactly that.
        Sheets read as Modal to two raters and Popover to one; say that action sheets are modal.
    opus:
      - friction as written only covers button-shaped confirmations; three of twenty commit through
        a gesture or an identity check instead, hence the proposals. Consequence in the button
        versus Simple confirm also needs a rule — I read the button text alone (Empty Trash and
        Delete forever name the consequence; a bare Delete does not) and noted it, but a rater
        reading the whole dialog would code several of these differently.
      - "friction has no threshold between Simple confirm and Consequence in the button: fable
        counted every verb-labelled button, sonnet and I only buttons that name the object or its
        permanence, and that one reading accounts for most of this entry's disagreement — the
        gloss's own example ('Delete 3 files') should be made the test. friction also has no value
        for confirming by authenticating: Apple Pay's side-button-plus-Face-ID and Facebook's
        password re-entry are the same move and produced three different codes between us.
        explanation's What will happen is glossed 'Most', which makes it either always true or a
        residual category, and raters split on whether a permanence warning replaces it. when cannot
        separate Always from Only irreversible actions for an action that is always irreversible."
    sonnet:
      - Gmail's missing-subject warning is the one case where 'when' didn't fit any of the four
        listed values, since it fires on a specific content condition rather than
        always/irreversible-only/above-a-threshold/never.
      - "Three findings. (1) friction's Simple confirm and Consequence in the button kept splitting
        on how specific a button's label has to be: a bare repeated verb (Delete, Pay, Send money,
        Refund) versus a button that names a scoped outcome (Empty Trash, Delete Photo, Delete
        forever, Save/Don't Save) — the codebook's own gloss example ('Delete 3 files') implies the
        latter, but nothing states the threshold explicitly, and I initially coded almost everything
        as Simple confirm by treating any action-verb button as generic. (2) Two raters
        independently proposed near-identical friction variations under different names for the same
        mechanics — 'Swipe to confirm' (fable, sonnet) vs 'Slide to confirm' (opus) for n11/n12, and
        'Physical button plus biometric' (fable) vs 'Biometric confirm' (opus) for n10 — which is a
        coordination gap worth a codebook line rather than three separate proposals surviving to
        compete. (3) form's Modal and Popover collapsed for any iOS/mobile bottom sheet or action
        sheet across four instances (n3, n6, n10, n14); Popover's own gloss example is a small
        anchored Popconfirm-style callout, a narrower pattern than a full-width blocking sheet, and
        I was applying it too broadly to anything that wasn't a centered desktop dialog box."
