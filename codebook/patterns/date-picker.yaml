# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "date-picker". Edit between batches only — see README "Rules".
id: date-picker
name: Date picker
level: component
parent: enter-data
aliases:
  - calendar picker
  - date range picker
definition: A control for choosing a date, a time or a range of dates.
data: time
platforms:
  - web
  - mobile
  - desktop
domains:
  - travel
  - health
  - finance
  - productivity
anatomy:
  - name: Input
    role: The chosen value
  - name: Calendar
    role: Days to choose from
  - name: Annotations
    role: What each day carries
roles: []
dimensions:
  - name: Presentation
    family: layout
    question: How is time presented for choosing?
    subdimensions:
      - id: presentation
        name: Presentation
        select: one
        values:
          - id: calendar-popover
            name: Calendar popover
            example: Most web pickers
          - id: inline-calendar
            name: Inline calendar
            example: Booking sites
          - id: scroll-wheels
            name: Scroll wheels
            example: iOS wheels
          - id: formatted-text-field
            name: Formatted text field
            example: GOV.UK date input
          - id: natural-language
            name: Natural language
            example: Fantastical, Todoist
          - id: dropdowns-per-part
            name: Dropdowns per part
            description: Each part of the date and time is its own select (month, day, year, hour, minute) — no
              calendar, no free typing (Windows Set the date and time)
            example: Windows 11 — Set the date and time manually
          - id: week-strip-with-paging
            name: Week strip with paging
            description: A row of individual days, often with time slots shown beneath each, that pages forward
              or back by arrows — distinct from a month-grid popover, an always-visible inline
              calendar, scroll wheels, a formatted text field or natural language.
            example: Zocdoc — Appointment availability
  - name: Selection
    family: scope
    question: What is being chosen?
    subdimensions:
      - id: selection
        name: Selection
        select: one
        values:
          - id: single-date
            name: Single date
            example: Birthdays
          - id: range
            name: Range
            example: Airbnb two-month range
          - id: date-and-time
            name: Date and time
            example: Meeting pickers
          - id: several-dates
            name: Several dates
            example: Scheduling polls
          - id: flexible
            name: Flexible
            description: A weekend in October
            example: Airbnb flexible dates
          - id: recurring-rule
            name: Recurring rule
            description: What is chosen is a repetition — every Friday, the first of each month — rather than a
              date, a range or a set of dates
            example: Todoist — Task due date
  - name: Day annotations
    family: content
    question: What does each day say?
    subdimensions:
      - id: annotations
        name: Annotations
        select: many
        values:
          - id: none
            name: None
            example: Birthdays
          - id: unavailable-days-disabled
            name: Unavailable days disabled
            example: Booking
          - id: price-per-day
            name: Price per day
            example: Google Flights
          - id: busy-indicators
            name: Busy indicators
            example: Calendar-aware pickers
          - id: holidays
            name: Holidays
            example: Regional calendars
  - name: Opening
    family: invocation
    question: What opens it?
    subdimensions:
      - id: openBy
        name: Opened by
        select: one
        values:
          - id: focusing-the-field
            name: Focusing the field
            example: Most pickers
          - id: calendar-icon
            name: Calendar icon
            example: Enterprise forms
          - id: always-visible
            name: Always visible
            example: Hotel booking
  - name: Locale
    family: adaptation
    question: How does it adapt to the person’s conventions?
    subdimensions:
      - id: locale
        name: Locale
        select: many
        values:
          - id: week-start
            name: Week start
            example: Monday vs Sunday
          - id: date-format
            name: Date format
            example: Day-month order
          - id: calendar-system
            name: Calendar system
            example: Non-Gregorian calendars
wild:
  score: 1
  note: Week start and format follow system settings.
  examples:
    - name: Google Calendar
      note: Start week on setting
techniques:
  - name: Annotate the days
    dimension: Day annotations
    how: "Surface any per-day attribute into the picker (price, busyness, weather), as Southwest does
      with cheapest fares: Fluid Attributes on a calendar."
    ai: false
signature: Annotate the days
sample: Travel, health booking, finance and scheduling products.
unit: One picker.
relations:
  uses:
    - popover
  specializes: []
  neighbors:
    - calendar
    - availability-picker
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Flexible travellers want prices across days before choosing any
questions:
  - When does an annotated picker become an overview?
coding:
