        - Airbnb — Check in / Check out on search
        - Google Flights — Departure date
        - Booking.com — Check-in and check-out dates
      Date format:
        - Airbnb — Check in / Check out on search
        - Google Flights — Departure date
        - Booking.com — Check-in and check-out dates
