  unobserved:
    - sub: selection
      var: Flexible
    - sub: selection
      var: Recurring rule
    - sub: annotations
      var: Holidays
  unresolved: []
  proposals:
    raised: 3
    adopted:
      - sub: presentation
        name: Dropdowns per part
        raters:
          - fable
          - opus
          - sonnet
      - sub: selection
        name: Recurring rule
        raters:
          - opus
          - sonnet
      - sub: presentation
        name: Week strip with paging
        raters:
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Locale is unobservable from product knowledge for most web products; I coded it only for OS
        pickers and products whose settings I know, and ? otherwise.
      - annotations needs a rule for pickers with no day grid (n/a) versus a grid that marks nothing
        (None); presentation does not say where a large anchored panel (Airbnb) falls between
        popover and inline; selection cannot hold a recurring rule.
    opus:
      - "The line between Calendar popover and Inline calendar had to be drawn by hand: I took
        popover to mean a small overlay anchored to a field and dismissed on pick, and inline to
        mean the calendar is the laid-out content of the sheet, panel or page. Several pickers also
        span two presentations at once (iOS Calendar: a month grid for the date, wheels for the
        time), which pick-one cannot hold. locale is close to unobservable — I coded week start and
        date format for products that ship internationally and left it empty for US-only services,
        which is an inference, not an observation."
      - selection has no value for a repetition — Todoist's 'every friday' produces a rule, not a
        date — and it is pick one although pickers like iOS Calendar and MyChart truthfully hold a
        date and a time chosen on the same surface; presentation mixes two axes (floating vs in the
        page flow, opened vs always visible) so Airbnb-style expanding panels can be coded either
        way; openBy has no honest value for a picker with nothing to open, which split us between
        n/a and Always visible, and annotations splits the same way between None and n/a when there
        is no day surface at all.
    sonnet:
      - Locale was mostly '?' by direct observation — I coded Week start/Date format wherever the
        product is a mainstream, internationally deployed consumer app with a standard grid, since
        that adaptation is real but usually invisible unless your own locale differs from the
        default; for single-locale government or internal-tool contexts I limited it to just Date
        format.
      - "Two recurring corrections: (1) I was conflating 'has a date format at all' with 'adapts to
        the person's own locale' in the locale sub — several US-only or fixed-order services (GOV.UK
        DOB, Zocdoc, MyChart, Chase) got credited with Date format when both other raters correctly
        read them as not adapting to anyone. (2) 'selection' for date+time pickers with visually
        separate date and time controls (Google Calendar Android, Outlook) is ambiguous between
        Single date and Date and time depending on whether you're describing the whole task or just
        the calendar-grid control; I'm now reading it as the control being coded, which argues for
        Single date whenever the time lives in its own separate widget."
  codedAt: 2026-09-22
