    - document-editor
    - agent-run
scores:
  ubiquity: 3
  potential: 5
  spec: 3
evidence: agent-coded
usage:
  - Analysts leave dead cells as history rather than using version control
questions:
  - When should a notebook become a dashboard, and what authorship affordances survive that shift?
