# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "notebook". Edit between batches only — see README "Rules".
id: notebook
name: Notebook
level: pattern
parent: analyze
aliases:
  - computational notebook
  - data notebook
  - literate programming notebook
definition: An interleaved document of prose, code and outputs where analysis is authored as
  executable cells that produce tables, charts and narrative.
data: document
platforms:
  - web
  - desktop
domains:
  - science
  - education
  - software
  - ai
  - finance
anatomy:
  - name: Cell
    role: A unit of code or markdown
  - name: Output
    role: What a cell produces
  - name: Kernel or runtime
    role: Where code runs
  - name: Outline
    role: The notebook structure
  - name: Toolbar
    role: Run and cell controls
roles:
  - markdown
  - code
  - output
  - chart
  - table
dimensions:
  - name: Cell model
    family: composition
    question: What are cells and how do they relate?
    subdimensions:
      - id: cellTypes
        name: Cell types
        select: many
        values:
          - id: code-cells
            name: Code cells
            example: Jupyter
          - id: markdown-cells
            name: Markdown cells
            example: All notebooks
          - id: sql-cells
            name: SQL cells
            example: Hex, Mode
          - id: ui-widget-cells
            name: UI widget cells
            example: Observable Inputs
          - id: chart-builder-cells
            name: Chart-builder cells
            example: Observable Plot cells
      - id: deps
        name: Dependency model
        select: one
        values:
          - id: top-to-bottom-order
            name: Top-to-bottom order
            example: Classic Jupyter
          - id: reactive-graph
            name: Reactive graph
            example: Observable
          - id: explicit-run-selection
            name: Explicit run selection
            example: Run this cell only
          - id: parameterized-notebooks
            name: Parameterized notebooks
            example: Papermill, Databricks jobs
  - name: Execution flow
    family: flow
    question: In what order do cells run, and how is progress resumed?
    subdimensions:
      - id: execution
        name: Execution
        select: one
        values:
          - id: run-all-top-down
            name: Run all top-down
            example: Jupyter Run All
          - id: run-selected
            name: Run selected
            example: Shift-Enter
          - id: reactive-recompute
            name: Reactive recompute
            example: Observable
          - id: scheduled-or-pipeline-run
            name: Scheduled or pipeline run
            example: Databricks workflows
          - id: branching-experiments
            name: Branching experiments
            example: Deepnote environments
  - name: Output presentation
    family: content
    question: What does a cell show after it runs?
    subdimensions:
      - id: output
        name: Output
        select: many
        values:
          - id: text-and-tables
            name: Text and tables
            example: pandas display
          - id: inline-charts
            name: Inline charts
            example: Matplotlib in Jupyter
          - id: interactive-widgets
            name: Interactive widgets
            example: ipywidgets
          - id: errors-and-stack-traces
            name: Errors and stack traces
            example: Kernel errors
          - id: hidden-or-collapsed-output
            name: Hidden or collapsed output
            example: Jupyter collapse
  - name: Authoring layout
    family: layout
    question: How are cells and side surfaces arranged?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: linear-scroll
            name: Linear scroll
            example: JupyterLab
          - id: side-by-side-editor-and-preview
            name: Side-by-side editor and preview
            example: Some markdown notebooks
          - id: outline-sidebar
            name: Outline sidebar
            example: JupyterLab TOC
          - id: app-or-dashboard-mode
            name: App or dashboard mode
            example: Voilà, Observable apps
          - id: collaborative-multiplayer-canvas
            name: Collaborative multiplayer canvas
            example: Hex, Deepnote
  - name: Runtime feedback
    family: feedback
    question: How does the notebook report execution state?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: cell-busy-indicator
            name: Cell busy indicator
            example: Jupyter asterisk
          - id: kernel-status
            name: Kernel status
            example: Connected / idle
          - id: stale-output-badges
            name: Stale output badges
            example: Observable
          - id: progress-for-long-jobs
            name: Progress for long jobs
            example: Databricks
          - id: diff-of-outputs-after-rerun
            name: Diff of outputs after rerun
            example: Review notebooks
  - name: Assistance
    family: initiative
    question: What does the environment contribute to the analysis?
    subdimensions:
      - id: assistance
        name: Assistance
        select: many
        values:
          - id: none
            name: None
            example: Bare kernels
          - id: autocomplete-and-docs
            name: Autocomplete and docs
            example: JupyterLab
          - id: generate-a-cell
            name: Generate a cell
            example: GitHub Copilot in notebooks
          - id: explain-this-output
            name: Explain this output
            example: Colab Gemini
          - id: fix-and-rerun
            name: Fix and rerun
            example: AI error repair
wild:
  score: 3
  note: Cells, order, runtime and presentation modes are authored continuously by the analyst.
  examples:
    - name: JupyterLab
      note: Rearrange cells, change kernel, collapse outputs
    - name: Observable
      note: Fork and edit reactive notebooks
    - name: Colab
      note: Runtime type, forms and hiding code
techniques:
  - name: Cells as reversible steps
    dimension: Cell model
    how: Treat each cell as a named, reorderable step with visible inputs and outputs so analysis
      history is structural, not only chatty prose.
    ai: false
  - name: Generate the next cell
    dimension: Assistance
    how: Propose a cell from the current schema and prior outputs, inserted as a draft the person must
      run and keep.
    ai: true
  - name: Mark stale outputs
    dimension: Runtime feedback
    how: When upstream cells change, badge downstream outputs as stale until recomputed.
    ai: false
signature: Cells as reversible steps
sample: Scientific and data notebooks, SQL notebooks and literate analytics products.
unit: One notebook document bound to one runtime.
relations:
  uses:
    - chart
    - split-pane
    - tabs
    - autocomplete
    - ai-provenance
  specializes:
    - analyze
  neighbors:
