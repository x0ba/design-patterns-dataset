  raterNotes:
    fable:
      - Execution is a pick-one over products that run selected cells interactively and top-down for
        versions/jobs; coded the editing flow except where the sample named the batch run (Kaggle).
      - execution is a pick one over products that run cells singly while editing and top-down or on
        a schedule as a job; where the sampler names the job I now code it, but the sub wants pick
        any. deps files Parameterized notebooks, an input model, beside cell-order models. layout
        cannot hold a notebook that edits linearly and runs as an app, or one with inline chunk
        output and a rendered preview beside it. assistance's None is read by one rater as no AI,
        which makes Autocomplete and docs the swing value in every cell.
    opus:
      - "Deps and execution restate each other for most instances (reactive graph implies reactive
        recompute, top-to-bottom implies run selected), so the two only carry separate information
        for scheduled and parameterized notebooks. Playgrounds and live scripts (20, 12) fit the
        cell vocabulary badly: their unit is a line or a section, not a cell."
      - "The packet here is mostly one rater coding only what the sample note mentioned — assistance
        came back as None for sixteen products that all ship completion — rather than a codebook
        fault. Where the codebook is at fault: `deps` mixes a dependency model (order, reactive)
        with an invocation mode (run selection, parameterized), and `layout` makes an authoring
        layout compete with App or dashboard mode, which most of these products have as well as, not
        instead of, a linear scroll."
    sonnet:
      - Assistance was 'None' for most notebooks — generative help is still the exception rather
        than the default even in 2026's mainstream data-science tools, aside from Colab/VS Code's
        completions.
      - "Most of this entry's disagreement was my own under-coding, not a codebook gap: I marked
        'assistance' None for nearly every product despite my own notes naming autocomplete, AI
        generation or error-fix features (Autocomplete and docs is even the codebook's own named
        JupyterLab example), and I left several pick-any output/feedback lists too short against
        evidence already in my notes. The one real interpretive question: for tools with both an
        interactive 'Notebook' screen and a separate scheduled/parameterized-job feature
        (Databricks, Deepnote, Snowflake), execution/deps/layout should describe what's on the
        literally-sampled screen, not the tool's most distinguishing capability reached elsewhere."
  codedAt: 2026-09-22
