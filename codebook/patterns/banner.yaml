# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "banner". Edit between batches only — see README "Rules".
id: banner
name: Banner
level: component
parent: monitor
aliases:
  - inline alert
  - callout
  - system banner
  - notice
definition: A persistent message across a region or page about a condition that needs attention.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - government
  - finance
  - software
  - enterprise
anatomy:
  - name: Message
    role: The condition
  - name: Severity
    role: How serious
  - name: Action
    role: What to do
  - name: Dismiss
    role: Whether it can go away
roles: []
dimensions:
  - name: Scope
    family: scope
    question: What does the condition apply to?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: whole-app
            name: Whole app
            example: Service outage banners
          - id: page
            name: Page
            example: Account warnings
          - id: section
            name: Section
            example: GOV.UK error summary
          - id: field
            name: Field
            example: Inline field notices
  - name: Severity
    family: feedback
    question: How serious is it?
    subdimensions:
      - id: severity
        name: Severity
        select: one
        values:
          - id: information
            name: Information
            example: Scheduled maintenance
          - id: success
            name: Success
            example: Settings saved
          - id: warning
            name: Warning
            example: Card expiring
          - id: critical
            name: Critical
            example: Payment failed
  - name: Dismissal
    family: lifecycle
    question: Can it go away?
    subdimensions:
      - id: dismissal
        name: Dismissal
        select: one
        values:
          - id: not-until-resolved
            name: Not until resolved
            example: Verification required
          - id: dismissible
            name: Dismissible
            example: Announcements
          - id: returns-later
            name: Returns later
            example: Update reminders
          - id: clears-with-the-condition
            name: Clears with the condition
            example: Connectivity banners
  - name: Action
    family: content
    question: Does it offer a way to fix things?
    subdimensions:
      - id: action
        name: Action
        select: one
        values:
          - id: none
            name: None
            example: Maintenance notices
          - id: link-to-fix
            name: Link to fix
            example: Update payment method
          - id: primary-action
            name: Primary action
            example: Restart to update
          - id: several-actions
            name: Several actions
            example: Cookie consent
  - name: Placement
    family: layout
    question: Where does it sit?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: top-of-the-app
            name: Top of the app
            example: GitHub site-wide banners
          - id: top-of-content
            name: Top of content
            example: Settings pages
          - id: beside-the-problem
            name: Beside the problem
            example: Inline alerts
          - id: bottom-bar
            name: Bottom bar
            example: Consent bars
wild:
  score: 0
  note: Banners are the organization’s voice and are not customizable.
  examples: []
techniques:
  - name: Snooze by kind
    dimension: Dismissal
    how: Snooze a kind of banner (announcements, tips) without silencing critical ones.
    ai: false
signature: Snooze by kind
sample: SaaS, banking and government sites.
unit: One banner instance.
relations:
  uses: []
  specializes: []
  neighbors:
    - toast
    - empty-state
scores:
  ubiquity: 5
  potential: 2
  spec: 5
evidence: agent-coded
usage:
  - Banner blindness grows with every dismissible announcement
questions:
  - Should banner severity be tied to an organization-wide policy the person can read?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.6608107489359911
  agreementFirstPass: 0.7
  kappaFinal: 0.986827661909989
  agreementFinal: 0.99
  pass: true
  perSub:
