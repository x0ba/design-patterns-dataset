    adopted: []
    recorded: []
  raterNotes:
    fable:
      - Severity coded by consequence and colour together (grey informative → Information, cannot
        send/save or yellow → Warning, red blocking → Critical); Link to fix had to stand in for
        links that only inform (status page).
      - action's Link to fix and Primary action are told apart by navigation in the codebook's
        examples but raters read them by button styling; action also has no value for a link that
        only informs. scope's Page example is account warnings, which reads as Whole app when scope
        is taken to mean what the condition concerns rather than what the banner governs.
    opus:
      - Severity had to be read from the condition rather than the styling — offline notices are
        drawn grey or neutral but genuinely impair the product, so I coded them Warning throughout;
        Link to fix vs Primary action I split on whether the control navigates to where the fix
        happens or performs it in place.
      - Two codebook faults. Scope asks what the condition applies to but its Page gloss ('Account
        warnings') pulls account-wide conditions onto the page they are shown on, so scope and
        placement answer the same question twice. And action has no value for a link that informs
        rather than remedies (GitHub's status page), which pushed two raters to code an information
        link as Link to fix.
    sonnet:
      - Scope between Whole app and Page was sometimes a judgment call for account-wide banners that
        only render at the top of whichever page loads; I used Whole app when the same condition
        follows the account across every page.
      - "Action's biggest problem: 'Primary action' sounds like it should mean any prominent single
        CTA button, but its codebook example (Restart to update) is specifically an immediate,
        in-place fix, while 'Link to fix' 's own example (Update payment method) is exactly the kind
        of button — Update payment, Select a plan, Verify, Confirm — that navigates to a separate
        flow instead. I coded five different account-gating banners as Primary action in round 1 by
        pattern-matching 'button' rather than 'does it resolve in place or send you elsewhere', and
        only Windows 11's actual Restart-now button is the real Primary action case in this sample.
        Scope also needs a clearer rule for connectivity/offline banners: the strip's visual
        footprint (over one list, under one bar) undersells that losing the network is a whole-app
        condition."
  codedAt: 2026-09-22
