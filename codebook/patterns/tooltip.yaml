# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "tooltip". Edit between batches only — see README "Rules".
id: tooltip
name: Tooltip
level: component
parent: guide
aliases:
  - hint
  - hover label
definition: A short label or explanation that appears on hover or focus.
data: object
platforms:
  - web
  - desktop
  - mobile
domains:
  - software
  - design
  - productivity
  - enterprise
anatomy:
  - name: Target
    role: What it explains
  - name: Bubble
    role: The text
roles: []
dimensions:
  - name: Shown on
    family: invocation
    question: What brings it up?
    subdimensions:
      - id: trigger
        name: Trigger
        select: many
        values:
          - id: hover
            name: Hover
            example: Toolbar icons
          - id: keyboard-focus
            name: Keyboard focus
            example: Accessible tooltips
          - id: long-press
            name: Long-press
            example: Android tooltips
          - id: info-icon-click
            name: Info icon click
            example: Help tooltips
  - name: Timing
    family: lifecycle
    question: When does it appear and leave?
    subdimensions:
      - id: timing
        name: Timing
        select: one
        values:
          - id: delayed
            name: Delayed
            example: Operating-system tooltips
          - id: instant-after-the-first
            name: Instant after the first
            description: Warm-up across neighbours
            example: macOS toolbars
          - id: until-the-pointer-leaves
            name: Until the pointer leaves
            example: Web tooltips
          - id: timed
            name: Timed
            example: Android tooltips
          - id: until-dismissed
            name: Until dismissed
            description: Opened by a click and stays until closed or clicked away
            example: Airbnb — Price breakdown info icon
  - name: Content
    family: content
    question: What does it say?
    subdimensions:
      - id: content
        name: Content
        select: one
        values:
          - id: label
            name: Label
            example: Icon buttons
          - id: label-and-shortcut
            name: Label and shortcut
            example: Figma, Google Docs
          - id: rich-content
            name: Rich content
            example: Rich tooltips in Material
          - id: why-it-is-disabled
            name: Why it is disabled
            example: Disabled-button explanations
  - name: Placement
    family: layout
    question: Where does it sit?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: above
            name: Above
            example: Most
          - id: auto-flip
            name: Auto-flip
            example: Floating UI
          - id: following-the-pointer
            name: Following the pointer
            example: Chart datatips
          - id: beside
            name: Beside
            example: Sidebar icons
          - id: below
            name: Below
            description: Fixed under the target, as for top toolbars
            example: Figma — Toolbar tool tooltip
wild:
  score: 0
  note: Tooltip delay is sometimes an OS setting; nothing else changes.
  examples:
    - name: Finder
      note: Toolbar can show icon and text instead
techniques:
  - name: Tooltips to labels
    dimension: Content
    how: A person can turn tooltips into persistent visible labels, as Finder’s toolbar Icon and Text
      option does, everywhere.
    ai: false
signature: Tooltips to labels
sample: Toolbars, icon buttons and data charts.
unit: One tooltip.
relations:
  uses: []
  specializes: []
  neighbors:
    - popover
    - contextual-help
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - Touch users never see hover-only information
questions:
  - Should any fact the interface needs ever live only in a tooltip?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.8106697608520939
  agreementFirstPass: 0.85
  kappaFinal: 0.8106697608520939
  agreementFinal: 0.85
  pass: true
  perSub:
    trigger:
      kappaFirstPass: 0.839986665555463
      agreementFirstPass: 0.9
      kappaFinal: 0.839986665555463
      agreementFinal: 0.9
      flag: null
    timing:
      kappaFirstPass: 0.7979797979797979
      agreementFirstPass: 0.8
      kappaFinal: 0.7979797979797979
      agreementFinal: 0.8
      flag: null
    content:
      kappaFirstPass: 0.8084596967278533
      agreementFirstPass: 0.8
      kappaFinal: 0.8084596967278533
      agreementFinal: 0.8
      flag: null
    placement:
      kappaFirstPass: 0.7083021690351534
      agreementFirstPass: 0.75
      kappaFinal: 0.7083021690351534
      agreementFinal: 0.75
      flag: null
  distribution:
    trigger:
      Hover: 17
      Keyboard focus: 3
      Long-press: 2
      Info icon click: 1
    timing:
      Delayed: 9
      Instant after the first: 2
      Until the pointer leaves: 7
      Timed: 1
      Until dismissed: 1
    content:
      Label: 8
