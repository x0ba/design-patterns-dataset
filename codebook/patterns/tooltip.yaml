  proposals:
    raised: 3
    adopted:
      - sub: placement
        name: Below
        raters:
          - fable
          - opus
          - sonnet
      - sub: timing
        name: Until dismissed
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:content
        sub: content
        dim: null
        name: Data readout
        gloss: The bubble states the value of the mark under the pointer — series, category, date, number —
          rather than naming or explaining a control; the entry's own sampling frame includes data
          charts but its content values are all about controls
        raters:
          - opus
        instances:
          - 7
          - 8
          - 9
          - 17
        status: raised
  raterNotes:
    fable:
      - Placement lacks Below, the common case for top toolbars (seven of twenty). Timing mixes
        appearance delay with lifetime; most tooltips are both delayed and until-the-pointer-leaves,
        and I coded whichever the product makes salient.
    opus:
      - "placement needed the largest proposal in my slice: 'Below' is the default for every top
        toolbar and is simply missing, so eight instances had nowhere to go; I used Auto-flip only
        for components that genuinely choose a side. content is written for controls even though the
        sampling frame names data charts, so four chart datatips needed a value of their own. timing
        mixes how long the tooltip waits before appearing with what makes it go, which is why
        Delayed and 'Until the pointer leaves' are not really alternatives — I read Delayed as 'a
        perceptible pause first' and 'Until the pointer leaves' as 'appears promptly and persists'.
        trigger's Keyboard focus is nearly unobservable without testing; I coded it where the
        product is known to implement accessible tooltips and left it off elsewhere, which is the
        least reliable column here."
    sonnet:
      - "placement is the sub-dimension the four variations fit worst: Above is named but its mirror
        case, a tooltip below the target, has no equivalent, and it's at least as common (six of
        twenty instances here), hence the +Below proposal."
  codedAt: 2026-09-22
