      Info icon click:
        - Airbnb — Price breakdown info icon
    timing:
      Delayed:
        - Windows Taskbar — App hover
        - Gmail — Icon buttons
        - Microsoft Excel — Chart data point
      Instant after the first:
        - Figma — Toolbar tool tooltip
        - macOS Finder — Toolbar tooltip
      Until the pointer leaves:
        - Google Docs — Toolbar button tooltip
        - Slack — Message action icons
        - GitHub — Contributions graph
      Timed:
        - Android — Long-press an app bar icon
      Until dismissed:
        - Airbnb — Price breakdown info icon
    content:
      Label:
        - macOS Finder — Toolbar tooltip
        - Windows Taskbar — App hover
        - GitHub — Contributions graph
      Label and shortcut:
        - Figma — Toolbar tool tooltip
        - Google Docs — Toolbar button tooltip
        - Slack — Message action icons
      Rich content:
        - Google Analytics — Chart hover
        - Microsoft Excel — Chart data point
        - Material Design 3 — Rich tooltip demo
      Why it is disabled: []
    placement:
      Above:
        - Windows Taskbar — App hover
        - Slack — Message action icons
