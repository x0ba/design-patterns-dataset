          - sonnet
    recorded:
      - place: sub:resultForm
        sub: resultForm
        dim: null
        name: Highlighted in place
        gloss: Matches are highlighted directly within the existing content being searched, with a count,
          rather than being returned as a separate list of candidate results, e.g. browser Find in
          page
        raters:
          - sonnet
        instances:
          - 20
        status: raised
  raterNotes:
    fable:
      - Initiative as pick-one loses the common pairing of autocomplete with pull; I coded
        Suggestions while typing wherever autocomplete exists. Instant-results search (Spotify) sits
        between suggestions and results.
      - Voice and Natural-language question overlap for every assistant, and Image or camera
        overlaps Query by example for every visual search. initiative as pick one loses that
        autocomplete always sits on a pull, and it does not separate query suggestions from instant
        results. resultForm has no value for a grid of items of one kind (pins, products).
    opus:
      - "resultForm is the entry's most useful sub because modern engines stack three or four forms
        on one page, but it has no value for a grid of homogeneous items (Pinterest's pins, an image
        wall) — I coded those Ranked links, which is a stretch, and no value for in-place matches,
        which I proposed. initiative is pick-one but the four values are not alternatives: a page
        can push recommendations before a query, suggest while typing and be pulled, all at once; I
        coded the behaviour at the moment of searching, which makes 'System pushes' almost
        uncodeable in a search sample. scope forces a single index on assistants that answer from
        the device and the web at once (Siri, Windows Search, Spotlight)."
      - "Two codebook faults account for most of this entry: `queryForm` mixes modality with form,
        so Voice and Natural-language question always co-occur and raters split over whether to say
        both; and `initiative`'s Suggestions-while-typing is glossed with query autocomplete but
        gets applied to any surface that renders results per keystroke (Spotlight, Windows Search),
        which is a rendering choice, not who initiated. The find-in-page gap was found by all three
        raters under three different names."
    sonnet:
      - scope is genuinely ambiguous for single-source vertical search tools (PubMed, Scholar,
        Amazon voice shopping) that are neither the open web nor a general OS/app search; coded as
        This app by treating the searched database/catalogue itself as the bounded 'app'.
      - "I under-coded the pick-any subs (queryForm, resultForm, refinement) across most of this
        entry's most heavily-featured products (Google, Bing, ChatGPT, Perplexity, YouTube, Amazon)
        — naming only the single most distinctive form and missing the several others plainly
        present, the same pattern I found in the configure archetype's product-configurator entry.
        Two smaller codebook findings: (1) `queryForm`'s Keywords vs Natural-language question
        doesn't say whether typing a question into a plain search box counts as the latter, or
        whether that value is reserved for products designed around question-form input (Perplexity,
        Siri) — I resolved it the second way, holding DuckDuckGo and Google Scholar to Keywords
        alone. (2) `resultForm` has no value for 'a grid of homogeneous items that are not links and
        not a single known entity' (Pinterest's pin grid, Amazon's product tiles) — Ranked links and
        Entity cards both get stretched to cover this, and all three raters reached for the nearest
        existing value rather than proposing new ones."
