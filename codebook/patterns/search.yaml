# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "search". Edit between batches only — see README "Rules".
id: search
name: Search and discover
level: archetype
aliases:
  - information retrieval
  - discovery
definition: Express what you want and get candidates back, or be shown what you might want before you ask.
data: collection
platforms:
  - web
  - mobile
  - desktop
  - voice
domains:
  - commerce
  - news
  - entertainment
  - productivity
  - science
  - ai
anatomy:
  - name: Query
    role: The expression of intent
  - name: Candidates
    role: What comes back
  - name: Refinement
    role: How intent changes after seeing results
roles:
  - title
  - snippet
  - source
  - thumbnail
dimensions:
  - name: Query form
    family: invocation
    question: In what form is intent expressed?
    subdimensions:
      - id: queryForm
        name: Query form
        select: many
        values:
          - id: keywords
            name: Keywords
            example: Google Search
          - id: natural-language-question
            name: Natural-language question
            example: Perplexity
          - id: voice
            name: Voice
            example: Siri
          - id: image-or-camera
            name: Image or camera
            example: Google Lens
          - id: query-by-example
            name: Query by example
            description: More like this item
            example: Pinterest visual search
          - id: structured-query-builder
            name: Structured query builder
            example: PubMed advanced search
  - name: Who initiates
    family: initiative
    question: Does the person pull, or does the system push?
    subdimensions:
      - id: initiative
        name: Initiative
        select: one
        values:
          - id: person-pulls
            name: Person pulls
            description: Search on demand
            example: Search boxes
          - id: system-pushes
            name: System pushes
            description: Recommendations before a query
            example: Netflix home
          - id: suggestions-while-typing
            name: Suggestions while typing
            example: Google autocomplete
          - id: clarifying-questions
            name: Clarifying questions
            description: The system asks back
            example: ChatGPT deep research
  - name: Result form
    family: content
    question: In what form do candidates come back?
    subdimensions:
      - id: resultForm
        name: Result form
        select: many
        values:
          - id: ranked-links
            name: Ranked links
            example: Classic web search
          - id: direct-answer
            name: Direct answer
            example: Featured snippets
          - id: generated-synthesis-with-citations
            name: Generated synthesis with citations
            example: Google AI Overviews, Perplexity
          - id: entity-cards
            name: Entity cards
            example: Knowledge panels
          - id: grouped-by-type
            name: Grouped by type
            example: Spotlight results by kind
          - id: in-place-highlights
            name: In-place highlights
            description: Matches are marked where they already sit (on the page) with a count and next/previous
              stepping, rather than returned as a list
            example: Google Chrome — Find in page
          - id: matches-in-place
            name: Matches in place
            description: "There is no result list: the matches are marked in the content itself and navigated
              one at a time, with a count for orientation (find in page, find in a document or code
              editor)"
            example: Google Chrome — Find in page
  - name: Refinement
    family: flow
    question: How does the search move forward after the first results?
    subdimensions:
      - id: refinement
        name: Refinement
        select: many
        values:
          - id: reformulate
            name: Reformulate
            example: Editing the query
          - id: facets
            name: Facets
            example: Retail filters
          - id: follow-up-conversation
            name: Follow-up conversation
            example: Perplexity follow-ups
          - id: related-searches
            name: Related searches
            example: Google related searches
  - name: Index scope
    family: scope
    question: What is searched?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: this-page
            name: This page
            example: Find in page
          - id: this-app
            name: This app
            example: Slack search
          - id: everything-local
            name: Everything local
            example: Spotlight
          - id: the-web
            name: The web
            example: Search engines
          - id: connected-sources
            name: Connected sources
            example: Enterprise search across tools
wild:
  score: 1
  note: Scope and a few filters are adjustable; ranking and result form rarely are.
  examples:
    - name: Kagi
      note: Raise, lower or block domains
    - name: Google
      note: Date and verbatim tools
techniques:
  - name: Query as editable spec
    dimension: Refinement
    how: A query becomes a visible structure (terms, filters, sources, sort) whose parts can be edited,
      saved and shared.
    ai: false
  - name: Clarify, then search
    dimension: Who initiates
    how: Ambiguous requests produce short clarifying choices whose answers become editable query parts.
    ai: true
signature: Query as editable spec
sample: Search engines, in-app search in the top 50 apps, enterprise and scholarly search.
unit: "One search experience: query surface, results and refinement."
relations:
  uses:
    - autocomplete
    - filter-controls
    - sort-control
    - suggestion-chips
  specializes: []
  neighbors:
    - browse-collections
    - navigate
scores:
