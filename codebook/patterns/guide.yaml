# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "guide". Edit between batches only — see README "Rules".
id: guide
name: Guide and onboard
level: archetype
aliases:
  - user assistance
  - onboarding
  - help
definition: "Learn a system while using it: first-run introductions, help at the moment of a
  question, and support when stuck."
data: sequence
platforms:
  - web
  - mobile
  - desktop
domains:
  - software
  - productivity
  - finance
  - education
anatomy:
  - name: Help content
    role: What is explained
  - name: Trigger
    role: What brings help up
  - name: Placement
    role: Where it appears
  - name: Progression
    role: How learning advances
roles: []
dimensions:
  - name: Trigger
    family: invocation
    question: What brings help up?
    subdimensions:
      - id: trigger
        name: Trigger
        select: many
        values:
          - id: first-run
            name: First run
            example: Welcome tours
          - id: reaching-a-feature
            name: Reaching a feature
            example: Feature spotlights
          - id: on-request
            name: On request
            example: Help buttons
          - id: detected-struggle
            name: Detected struggle
            example: Repeated-error prompts
          - id: help-search
            name: Help search
            example: macOS Help menu
  - name: Placement
    family: layout
    question: Where does help appear?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: overlay-tour
            name: Overlay tour
            example: Coach marks
          - id: anchored-tooltip
            name: Anchored tooltip
            example: Info popovers
          - id: side-panel
            name: Side panel
            example: AWS console help panel
          - id: separate-help-site
            name: Separate help site
            example: Knowledge bases
          - id: inside-empty-states
            name: Inside empty states
            example: First-use screens
          - id: live-session
            name: Live session
            description: The guidance is delivered by a person in a scheduled call or screen share rather than
              placed anywhere in the interface — onboarding as a service, common in high-touch and
              enterprise products
            example: Superhuman — Human onboarding
  - name: Progression
    family: flow
    question: How does learning advance?
    subdimensions:
      - id: progression
        name: Progression
        select: one
        values:
          - id: linear-tour
            name: Linear tour
            example: Welcome carousels
          - id: checklist-of-tasks
            name: Checklist of tasks
            example: Notion Getting Started
          - id: disclosure-over-time
            name: Disclosure over time
            example: Features introduced over days
          - id: just-in-time-only
            name: Just in time only
            example: Contextual tips
  - name: Guide
    family: initiative
    question: Who or what guides?
    subdimensions:
      - id: guide
        name: Guide
        select: one
        values:
          - id: static-content
            name: Static content
            example: Help articles
          - id: interactive-walkthrough
            name: Interactive walkthrough
            description: The real action advances it
            example: In-app guides
          - id: human-support
            name: Human support
            example: Intercom chat
          - id: ai-assistant
            name: AI assistant
            example: In-product copilots
  - name: Experience level
    family: adaptation
    question: Does guidance change with expertise?
    subdimensions:
      - id: adaptation
        name: Adaptation
        select: one
        values:
          - id: same-for-everyone
            name: Same for everyone
            example: Most tours
          - id: skippable-for-experts
            name: Skippable for experts
            example: Skip tour
          - id: adapts-to-demonstrated-skill
            name: Adapts to demonstrated skill
            example: Research systems
          - id: by-role
            name: By role
            example: Role questions at sign-up
wild:
  score: 1
  note: Guidance can be skipped or dismissed; its form is fixed.
  examples:
    - name: Notion
      note: Getting Started checklist can be removed
techniques:
  - name: Show me in my interface
    dimension: Placement
    how: Help highlights and demonstrates on the person’s actual, possibly customized, interface, never
      on a stock screenshot.
    ai: false
  - name: Answer with a pointer
    dimension: Guide
    how: An assistant’s answer points at the control in the live interface and offers to do it.
    ai: true
signature: Show me in my interface
sample: SaaS products, mobile apps and consumer finance with first-run and help experiences.
unit: One guidance system.
