  raterNotes:
    fable:
      - Placement and Guide as pick-one strain on systems that combine a checklist, coach marks and
        a help menu (Notion, Slack, Asana); I coded the dominant surface. Adapts to demonstrated
        skill is only knowable for products that visibly test (Duolingo).
      - "The entry does not say whether a guided flow (TurboTax's interview, Cash App's sign-up) is
        itself the guidance or only the help around it, and the three raters split on that unit.
        placement has no value for a full-screen card or a live call. guide and adaptation want pick
        any: Intercom is human and AI, Figma is by role and skippable."
    opus:
      - "guide is pick-one but the four values stack in every serious product: a checklist (static)
        sits beside an assistant (AI) beside a chat (human), and I coded whoever does the actual
        teaching. The Static content versus Interactive walkthrough line is the one I expect raters
        to split on — I reserved Interactive walkthrough for systems where the real action advances
        the guidance (Slack's checklist, Photoshop's Discover, Duolingo) and coded pointer tours
        with Next buttons as static, which puts Canva on the other side of a line Miro-like tours
        usually sit on. adaptation is mostly Same for everyone because role questions are rare
        outside SaaS sign-up; 'Adapts to demonstrated skill' only fired for Duolingo and for a human
        doing the adapting. placement is pick-one over systems that use three surfaces at once, so
        it records the spine of the system rather than the whole of it."
      - "`adaptation` is pick one but products routinely hold two of its values at once (Figma is
        both skippable and role-branched), and it has no value for a path that branches on the
        person's data rather than their expertise, which is what TurboTax actually does. The
        `progression` boundary between Disclosure over time and Just in time only also needs the
        gloss to say that disclosure means a paced plan, not merely tips arriving at intervals."
    sonnet:
      - "placement is the hardest sub to apply when a guidance system spans several channels at once
        (a live call plus in-app hints in Superhuman; a checklist widget plus overlay pointers in
        Slack): coded to the most distinctive single mechanism per instance rather than left blank,
        with the tension noted."
      - "Two codebook problems. (1) I repeatedly conflated `trigger` (what brings help up) with
        `progression` (how it proceeds once started) and with `placement` (where it sits) for the
        same instance — TurboTax and Photoshop both show this: coding a tutorial's internal linear
        steps under trigger and its on-demand invocation under progression. The three subs would
        benefit from a worked example that separates all three for one instance. (2) `adaptation`'s
        By role doesn't name situational branching driven by the person's own data (TurboTax's tax
        facts) as opposed to a self-reported category (a role question at sign-up); both are 'not
        the same for everyone' but only one is really a role."
  codedAt: 2026-09-22
