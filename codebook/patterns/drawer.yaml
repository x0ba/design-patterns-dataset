        status: raised
  raterNotes:
    fable:
      - "Push content vs Docked was the hard line: I used Push for panels that temporarily narrow
        content and Docked for panels that are part of the layout."
      - relationship has no value for an overlay that does not dim, and the gap between Push content
        and Docked (temporary versus part of the layout) is not stated, which is why the record
        panels split three ways; responsive reuses 'modal' for what relationship calls overlay, so a
        no-scrim overlay has to be coded 'Always modal'.
    opus:
      - relationship has no room for an overlay without a scrim, which is what several right-hand
        detail panels actually are; I coded those Overlay with scrim and said so. The line between
        Push content and Docked also has to be drawn by hand — I took Docked to mean the panel is
        part of the layout and Push to mean it arrives and shoves content over. responsive is an
        inference for the desktop-only panels, which simply have no narrow form.
      - "relationship had no overlay-without-a-scrim value, which is what most right-hand detail
        panels actually are — three raters' disagreement on GitHub, Notion and the OS panels is
        entirely that missing value. responsive then repeats the same axis in different words: its
        variations name modality (Always modal) rather than adaptation, so a no-scrim overlay that
        never docks has to be filed as 'modal', and OS panels tempt a rater to n/a. responsive is
        also ambiguous about what counts as the same drawer at another size (one responsive site, as
        with Nike, versus a separate mobile skin, as with Wikipedia)."
    sonnet:
      - Relationship was a frequent judgment call for record/detail panels that neither dim the
        background nor visibly resize the main content (GitHub Projects, Jira, Linear, Notion,
        Asana) — I coded these Docked since nothing pushes or scrims, though I can't rule out a
        light scrim I'm not recalling precisely. The two OS-level panels (Windows Widgets, macOS
        Notification Center) got responsive=n/a since they aren't a single app's own responsive
        layout.
