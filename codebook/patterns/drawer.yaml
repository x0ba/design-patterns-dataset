# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "drawer". Edit between batches only — see README "Rules".
id: drawer
name: Drawer
level: component
parent: navigate
aliases:
  - side sheet
  - flyout panel
  - slide-over
definition: A panel that slides in from a screen edge, holding navigation, detail, filters or an
  assistant beside the main content.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - enterprise
  - commerce
  - ai
anatomy:
  - name: Panel
    role: The drawer surface
  - name: Scrim
    role: What covers content when modal
  - name: Handle or trigger
    role: What opens it
roles: []
dimensions:
  - name: Edge and relationship
    family: layout
    question: Which edge, and does it cover, push or sit beside content?
    subdimensions:
      - id: edge
        name: Edge
        select: one
        values:
          - id: left
            name: Left
            example: Navigation drawers
          - id: right
            name: Right
            example: Detail panels
          - id: top
            name: Top
            example: Notification shades
      - id: relationship
        name: Relationship to content
        select: one
        values:
          - id: overlay-with-scrim
            name: Overlay with scrim
            example: Material modal navigation drawer
          - id: push-content
            name: Push content
            example: Standard drawers
          - id: docked
            name: Docked
            example: Material standard side sheet
          - id: overlay-no-scrim
            name: Overlay, no scrim
            description: The panel lies over the content without dimming or disabling it visually (GitHub
              Projects item panel, Notion side peek, OS panels)
            example: GitHub Projects — Item side panel
  - name: Contents
    family: content
    question: What is it for?
    subdimensions:
      - id: holds
        name: Holds
        select: one
        values:
          - id: navigation
            name: Navigation
            example: Gmail on Android
          - id: item-detail
            name: Item detail
            example: GitHub Projects item panel
          - id: filters
            name: Filters
            example: Mobile retail
          - id: settings
            name: Settings
            example: Admin consoles
          - id: assistant
            name: Assistant
            example: Microsoft Edge Copilot sidebar
          - id: system-status-and-controls
            name: System status and controls
            description: Notifications, quick toggles and widgets belonging to the OS rather than the app
              (Android shade, iOS Control Center, Windows Widgets, macOS Notification Center)
            example: Android — Notification shade
          - id: companion-apps
            name: Companion apps
            description: Small versions of other products beside the main one (Gmail's Calendar/Keep/Tasks side
              panel)
            example: Gmail — Right side panel
          - id: notifications-and-system-controls
            name: Notifications and system controls
            description: Alerts, quick toggles and glanceable widgets belonging to the system rather than to the
              application underneath — notification shades, control centres, widget panels
            example: Android — Notification shade
          - id: a-companion-app
            name: A companion app
            description: The panel runs a different application beside the current one (a calendar or notes app
              inside a mail client) rather than any part of the host
            example: Gmail — Right side panel
  - name: Opening
    family: invocation
    question: How does it open?
    subdimensions:
      - id: openBy
        name: Opened by
        select: many
        values:
          - id: menu-button
            name: Menu button
            example: Hamburger menus
          - id: edge-swipe
            name: Edge swipe
            example: Android navigation drawers
          - id: selecting-an-item
            name: Selecting an item
            example: Record panels
          - id: keyboard-shortcut
            name: Keyboard shortcut
            example: Developer tools
  - name: Across sizes
    family: adaptation
    question: Does it change with the screen?
    subdimensions:
      - id: responsive
        name: Responsive
        select: one
        values:
          - id: modal-when-small-docked-when-large
            name: Modal when small, docked when large
            example: Material adaptive layouts
          - id: always-modal
            name: Always modal
            example: Mobile-first sites
          - id: always-docked
            name: Always docked
            example: Desktop IDE panels
wild:
  score: 1
  note: Some tools let people resize or pin a drawer open.
  examples:
    - name: Microsoft Edge
      note: Pin the sidebar
techniques:
  - name: Dock or float
    dimension: Edge and relationship
    how: Pin a drawer to become a split pane, float it, or send it to the other edge.
    ai: false
signature: Dock or float
sample: Mobile and web apps with edge panels.
unit: One drawer.
