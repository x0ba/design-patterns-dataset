    recorded:
      - place: sub:holds
        sub: holds
        dim: null
        name: Companion content (notifications, widgets or mini-apps)
        gloss: A feed of system notifications, an embedded companion mini-app (Calendar, Keep, Tasks), or a
          widget feed (weather, news) — distinct from navigation, item detail, filters, settings or
          a conversational assistant.
        raters:
          - sonnet
        instances:
          - 2
          - 16
          - 19
          - 20
        status: raised
      - place: sub:holds
        sub: holds
        dim: null
        name: Discussion thread
        gloss: A conversation thread anchored to a specific message or item, distinct from navigation, item
          detail, filters, settings or an assistant.
        raters:
