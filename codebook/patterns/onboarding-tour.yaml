# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "onboarding-tour". Edit between batches only — see README "Rules".
id: onboarding-tour
name: Onboarding tour
level: pattern
parent: guide
aliases:
  - product tour
  - coach marks
  - walkthrough
  - welcome screens
definition: A sequence of screens or coach marks that introduces a product’s key features on first use.
data: sequence
platforms:
  - mobile
  - web
  - desktop
domains:
  - software
  - productivity
  - finance
  - social
anatomy:
  - name: Steps
    role: Each introduction
  - name: Anchor
    role: The feature being shown
  - name: Progress
    role: How many remain
  - name: Exit
    role: Skip or finish
roles: []
dimensions:
  - name: Form
    family: layout
    question: What does the tour look like?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: welcome-screens
            name: Welcome screens
            example: Mobile intro carousels
          - id: coach-marks
            name: Coach marks
            description: Spotlight on real UI
            example: Material tap targets
          - id: hotspots
            name: Hotspots
            description: Pulsing beacons to open
            example: Appcues hotspots
          - id: checklist-panel
            name: Checklist panel
            example: Notion Getting Started
          - id: sample-content
            name: Sample content
            description: A pre-filled sample document, board or base whose own contents explain the product
            example: Airtable — Sample base
          - id: live-session
            name: Live session
            description: A scheduled call with a person who walks through the product
            example: Superhuman — Human onboarding
  - name: Progression
    family: flow
    question: How does a person move through it?
    subdimensions:
      - id: progression
        name: Progression
        select: one
        values:
          - id: linear-forced
            name: Linear, forced
            example: Some bank apps
          - id: linear-skippable
            name: Linear, skippable
            example: Most tours
          - id: self-paced-checklist
            name: Self-paced checklist
            example: Asana onboarding
          - id: spread-over-days
            name: Spread over days
            example: Feature spotlights
  - name: Action required
    family: initiative
    question: Does the person do or just read?
    subdimensions:
      - id: action
        name: Action
        select: one
        values:
          - id: read-and-continue
            name: Read and continue
            example: Welcome carousels
          - id: do-the-real-action
            name: Do the real action
            example: Interactive walkthroughs
          - id: sandbox-with-sample-data
            name: Sandbox with sample data
            example: Airtable sample bases
  - name: Personalization
    family: content
    question: Is the tour the same for everyone?
    subdimensions:
      - id: personalization
        name: Personalization
        select: one
        values:
          - id: same-for-all
            name: Same for all
            example: Most tours
          - id: branch-by-a-role-question
            name: Branch by a role question
            example: Notion’s What will you use Notion for?
          - id: adapts-to-what-was-already-done
            name: Adapts to what was already done
            example: Checklists that tick themselves
  - name: Re-access
    family: lifecycle
    question: Can it be revisited?
    subdimensions:
      - id: reaccess
        name: Re-access
        select: one
        values:
          - id: once-only
            name: Once only
            example: Most tours
          - id: replay-from-help
            name: Replay from help
            example: Help menu tours
          - id: resume-where-left
            name: Resume where left
            example: Checklists
wild:
  score: 1
  note: Skipping is the only lever.
  examples: []
techniques:
  - name: Tour from my goal
    dimension: Personalization
    how: A stated goal assembles only the relevant steps, on the actual interface.
    ai: true
  - name: Replay any step
    dimension: Re-access
    how: Every step stays reachable from the feature it explains.
    ai: false
signature: Tour from my goal
sample: SaaS and mobile first-run experiences.
unit: One tour.
relations:
  uses:
    - tooltip
    - popover
    - stepper
    - modal-dialog
  specializes:
    - guide
  neighbors:
    - wizard
    - contextual-help
    - empty-state
scores:
  ubiquity: 4
  potential: 3
  spec: 4
evidence: agent-coded
usage:
  - Tours are dismissed within the first two steps
questions:
  - Should a malleable interface tour its own customizations?
coding:
  tier: agent-coded
  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.8068832759759463
  agreementFirstPass: 0.84
  kappaFinal: 0.8330648847554397
  agreementFinal: 0.87
  pass: true
  perSub:
    form:
      kappaFirstPass: 0.7568165070007369
      agreementFirstPass: 0.75
      kappaFinal: 0.8877245508982037
      agreementFinal: 0.9
      flag: null
    progression:
      kappaFirstPass: 0.8289902280130292
      agreementFirstPass: 0.85
      kappaFinal: 0.8289902280130292
      agreementFinal: 0.85
      flag: null
    action:
      kappaFirstPass: 0.8398576512455516
      agreementFirstPass: 0.85
      kappaFinal: 0.8398576512455516
      agreementFinal: 0.85
      flag: null
    personalization:
      kappaFirstPass: 0.8958333333333333
      agreementFirstPass: 0.95
      kappaFinal: 0.8958333333333333
      agreementFinal: 0.95
      flag: null
    reaccess:
      kappaFirstPass: 0.7129186602870812
      agreementFirstPass: 0.8
      kappaFinal: 0.7129186602870812
      agreementFinal: 0.8
      flag: null
  distribution:
    form:
      Welcome screens: 7
      Coach marks: 4
      Hotspots: 0
      Checklist panel: 4
      Sample content: 3
      Live session: 1
    progression:
      Linear, forced: 5
      Linear, skippable: 8
      Self-paced checklist: 6
      Spread over days: 0
    action:
      Read and continue: 8
      Do the real action: 9
      Sandbox with sample data: 3
    personalization:
      Same for all: 13
      Branch by a role question: 5
      Adapts to what was already done: 1
    reaccess:
      Once only: 12
      Replay from help: 0
      Resume where left: 8
  exemplars:
    form:
      Welcome screens:
        - Duolingo — Sign-up screens
        - Headspace — Sign-up goals
        - Instagram — First-run
      Coach marks:
        - Slack — New workspace walkthrough
        - Canva — First design tutorial
        - Miro — Welcome tour
      Hotspots: []
      Checklist panel:
        - Notion — Getting Started checklist
        - Asana — Onboarding checklist
        - Linear — Onboarding steps
      Sample content:
        - Airtable — Sample base
        - Trello — Sample board
        - Grammarly — Demo document
      Live session:
        - Superhuman — Human onboarding
    progression:
      Linear, forced:
        - Duolingo — Sign-up screens
        - Headspace — Sign-up goals
        - Google Photos — First-run screens
      Linear, skippable:
        - Slack — New workspace walkthrough
        - Instagram — First-run
        - TikTok — Interest picker
      Self-paced checklist:
        - Notion — Getting Started checklist
        - Asana — Onboarding checklist
        - Airtable — Sample base
      Spread over days: []
    action:
      Read and continue:
        - Duolingo — Sign-up screens
        - Headspace — Sign-up goals
        - TikTok — Interest picker
      Do the real action:
        - Notion — Getting Started checklist
        - Slack — New workspace walkthrough
        - Asana — Onboarding checklist
      Sandbox with sample data:
        - Airtable — Sample base
        - Trello — Sample board
        - Grammarly — Demo document
    personalization:
      Same for all:
        - Slack — New workspace walkthrough
        - Airtable — Sample base
        - Instagram — First-run
      Branch by a role question:
        - Notion — Getting Started checklist
        - Duolingo — Sign-up screens
        - Headspace — Sign-up goals
      Adapts to what was already done:
        - Asana — Onboarding checklist
    reaccess:
      Once only:
        - Slack — New workspace walkthrough
        - Duolingo — Sign-up screens
        - Headspace — Sign-up goals
      Replay from help: []
      Resume where left:
        - Notion — Getting Started checklist
        - Asana — Onboarding checklist
        - Airtable — Sample base
  unobserved:
    - sub: form
      var: Hotspots
    - sub: progression
      var: Spread over days
    - sub: reaccess
      var: Replay from help
  unresolved:
    - sub: form
      n: 10
    - sub: personalization
      n: 18
    - sub: progression
      n: 20
  proposals:
    raised: 4
    adopted:
      - sub: form
        name: Sample content
        raters:
          - fable
          - sonnet
      - sub: form
        name: Live session
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:progression
        sub: progression
        dim: null
        name: Free exploration
        gloss: "No sequence: the person explores the sample in any order"
        raters:
          - fable
        instances:
          - 12
          - 20
        status: raised
      - place: sub:form
        sub: form
        dim: null
        name: Sandbox artefact
        gloss: "The tour is an object rather than a layer: a sample base, a demo board, a planted document
          that teaches by being worked on. The action sub already names 'Sandbox with sample data'
          but the form sub has no value for it, so these instances have to borrow Checklist panel"
        raters:
          - opus
        instances:
          - 4
          - 12
          - 20
        status: raised
  raterNotes:
    fable:
      - Form and progression have no place for sample-content tours (four of twenty) or a human
        session. Forced vs skippable is a judgement about whether sign-up questions can be bypassed.
    opus:
      - "form and action overlap: 'Sandbox with sample data' exists as an action but not as a form,
        which is why three instances needed a proposal — the sandbox is the whole design, not just
        what you do in it. progression's Linear, forced versus skippable is clear in principle but
        turns on whether a Skip link exists, which is easy to miss; I coded forced where the product
        cannot be reached without finishing. personalization is about whether the tour branches, not
        whether its answers change the product, and I applied that strictly — TikTok's interest
        picker shapes the feed but not the tour. Hotspots and 'Spread over days' were coded nowhere
        in this sample: pulsing beacons have fallen out of fashion, and feature spotlights over days
        belong to the guide archetype's disclosure-over-time rather than to a tour."
    sonnet:
      - "form is the sub-dimension the four variations fit worst: sample-content onboarding
        (Airtable, Trello, Grammarly) and human-led onboarding (Superhuman) are both real, recurring
        patterns with no existing variation, hence the two proposals."
