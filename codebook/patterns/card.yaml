          - 14
          - 15
        status: raised
  raterNotes:
    fable:
      - Container style has no variation for the borderless card that most consumer grids use; nine
        of twenty needed +Flat. Style for bordered-vs-shadowed cards (Zillow, Amazon) is a fine
        visual distinction hard to recall exactly.
      - style has no value for the borderless card that most consumer grids use, and all three
        raters proposed one. Outlined versus Borderless is a one-pixel detail hard to recall for
        Amazon and Zillow. target has no value for a card whose several links all open one place
        while the card body is inert (Booking), and Separate targets is read differently when a
        nested link goes elsewhere (YouTube).
    opus:
      - "style is the one real gap and it is a big one: half the sample uses no container at all,
        which Material's elevated/filled/outlined triad cannot say. shape reads as a layout question
        but its variations mix stacking direction (Vertical, Horizontal) with size (Compact tile); I
        used Compact tile only for Netflix's bare art tile. actions is pick-one and hover-only
        actions made it awkward — I counted an action that appears on hover (Pinterest's Save,
        Netflix's row) because it is on the card, and did not count context menus or edit
        affordances. target's Separate targets per attribute never applied cleanly: several cards
        have a nested secondary link (YouTube's channel, Amazon's ratings) without that being a
        design choice about where the item opens."
      - "Most of this packet is one codebook fault: `style` borrows Material's
        elevated/filled/outlined triad, which has no value for the containerless card that half the
        sample uses (all three of us proposed one, two of us by the same name) and no rule for a
        card that is both filled and outlined (Linear, Apple News, Zillow) — it should be pick any,
        or its variations should be ordered as cues to read at rest. Second: `target` has no value
        for 'the content region but not the container', which is what YouTube, Amazon and Booking
        actually do, and its Separate targets per attribute gloss conflates several distinct targets
        with several distinct destinations. Third: `shape` mixes stacking direction with size, so a
        small vertical card (Google Play) has two defensible codes."
    sonnet:
      - "style is the sub-dimension the Material-3-derived vocabulary (Elevated/Filled/Outlined)
        fits worst: most real browse/shopping/media tiles in this sample are borderless flat tiles
        rather than any of the three, hence the +Borderless proposal covering well over half the
        instances."
      - "One dominant pattern: 'style' has no value for the no-container-at-all look that most
        modern consumer overview cards actually use (Airbnb, Amazon, Etsy, Pinterest, Netflix, Uber
        Eats, Facebook Marketplace, Spotify, YouTube, Google Play) — all three raters independently
        proposed essentially the same missing variation (my and opus's names matched exactly as
        'Borderless,' fable's 'Flat' names the same thing), which is as strong a convergence signal
        as this reconciliation produced anywhere; the three existing values
        (Elevated/Filled/Outlined) assume every card has some kind of visible container, which
        turned out to be the minority case in this sample. A second, smaller pattern: 'target'
        undercounts cards where multiple elements link to genuinely different destinations (Amazon:
        image/title to the product, stars to reviews) versus cards where multiple clickable elements
        all lead to the same place (Booking.com) — the latter isn't really 'separate targets per
        attribute' the way the gloss's own example implies, and I initially conflated the two."
