# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "card". Edit between batches only — see README "Rules".
id: card
name: Card
level: component
parent: browse-collections
aliases:
  - tile
  - item card
definition: A bounded container that summarizes one item; the most common item view inside overviews.
data: object
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - social
  - news
  - productivity
anatomy:
  - name: Media
    role: Image or video
  - name: Header
    role: Title and subtitle
  - name: Body
    role: Key attributes
  - name: Actions
    role: What can be done to the item
roles:
  - title
  - subtitle
  - thumbnail
  - key-attribute
  - action
dimensions:
  - name: Card content
    family: content
    question: What goes on the card?
    subdimensions:
      - id: media
        name: Media
        select: one
        values:
          - id: none
            name: None
            example: Linear issue cards
          - id: top-image
            name: Top image
            example: Airbnb listings
          - id: side-thumbnail
            name: Side thumbnail
            example: Spotify search results
          - id: full-bleed-background
            name: Full-bleed background
            example: App Store Today cards
      - id: actions
        name: Actions
        select: one
        values:
          - id: none
            name: None
            description: The card only opens
            example: News cards
          - id: one-primary-action
            name: One primary action
            example: Add to cart on a product card
          - id: action-row
            name: Action row
            example: Social post actions
          - id: overflow-menu
            name: Overflow menu
            example: Google Drive file cards
  - name: Form
    family: layout
    question: What shape and weight does the card take?
    subdimensions:
      - id: shape
        name: Shape
        select: one
        values:
          - id: vertical
            name: Vertical
            example: Product grids
          - id: horizontal
            name: Horizontal
            example: Search result rows
          - id: compact-tile
            name: Compact tile
            example: Home screen widgets
      - id: style
        name: Container style
        select: one
        values:
          - id: elevated
            name: Elevated
            example: Material 3 elevated card
          - id: filled
            name: Filled
            example: Material 3 filled card
          - id: outlined
            name: Outlined
            example: Material 3 outlined card
          - id: borderless
            name: Borderless
            description: "No container at all: no fill, no border and no shadow — the media and text sit
              directly on the page background and the card is defined only by its grouping and
              spacing. The default for most modern consumer overviews, and not expressible with
              Material's three container styles"
            example: Airbnb — Listing card in search results
  - name: Target
    family: invocation
    question: Which part of the card opens the item?
    subdimensions:
      - id: target
        name: Tap target
        select: one
        values:
          - id: whole-card
            name: Whole card
            example: Airbnb
          - id: title-only
            name: Title only
            example: Search results
          - id: separate-targets-per-attribute
            name: Separate targets per attribute
            description: Thumbnail opens a gallery, title opens the page
            example: Meridian openFrom
wild:
  score: 0
  note: Cards are almost never customizable directly; people only change them indirectly by switching
    layouts.
  examples:
    - name: Craigslist
      note: Grid layout adds thumbnails that the list omits
techniques:
  - name: Role slots
    dimension: Card content
    how: The card declares slots by role (Meridian roles); surfacing an attribute places it by role, so
      the same card accepts any attribute set.
    ai: false
  - name: Card zoom
    dimension: Form
    how: Pinch a card to trade media for attributes, or the reverse, and apply it to every card.
    ai: false
signature: Role slots
sample: Component usage inside the top 100 web and app overviews.
unit: One card design used in one overview.
relations:
  uses:
    - badge
    - menu
  specializes: []
  neighbors:
    - stat-tile
scores:
  ubiquity: 5
  potential: 3
  spec: 5
evidence: agent-coded
usage:
  - People rely on image-first cards for taste goods and attribute-first cards for specification
    goods
questions:
  - Is a card a component, or simply a value of the item-view dimension?
coding:
