    adopted:
      - sub: style
        name: Borderless
        raters:
          - fable
          - opus
          - sonnet
    recorded:
      - place: sub:style
        sub: style
        dim: null
        name: Flat
        gloss: "No container at all: the card is only its media and text with spacing, no border, fill or
          shadow"
        raters:
          - fable
        instances:
          - 1
          - 3
          - 4
          - 10
          - 11
