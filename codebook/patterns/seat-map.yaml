  proposals:
    raised: 2
    adopted:
      - sub: sectionSummary
        name: Value score per section
        raters:
          - opus
          - sonnet
    recorded:
      - place: sub:sectionSummary
        sub: sectionSummary
        dim: null
        name: Deal score shading
        gloss: Sections are coloured by a computed value rating (price relative to quality) rather than by
          lowest price, count or sold-out state
        raters:
          - fable
        instances:
          - 2
        status: raised
  raterNotes:
    fable:
      - seatHold for airline, rail and cruise maps is 'Release on navigate away' because a seat pick
        outside a timed checkout is simply dropped; the codebook's exemplar (club sites) reads
        narrower than that. Resale marketplaces (SeatGeek, StubHub, Vivid) sell listings by section
        and row, so 'Click seats to toggle' does not apply to them.
    opus:
      - "seatConstraints is mostly invisible: anti-orphan and contiguity rules only announce
        themselves when you break them, so outside Ticketmaster and Broadway houses I coded only
        what the interface states and left the rest off rather than guessing. Airline and rail maps
        also stretch seatHold — nothing is held and nothing is released either; the seat is simply
        assigned when you confirm, which Release on navigate away only half describes."
    sonnet:
      - sectionSummary was a frequent judgment call for airline seat maps, which mostly show
        per-seat prices rather than a single section-level figure; coded No section aggregate in
        those cases rather than force-fitting one of the other three.
      - "Four findings. (1) 'Max quantity' is true of all twenty instances — every ticketing flow
        caps the order — so it discriminates nothing and is really a property of the archetype
        rather than a variation. (2) seatHold conflates two questions: whether the seats are held
        with a countdown and whether checkout has a timer. Airline and rail flows have neither (I
        had wrongly coded them all as timed holds), and 'Queue before map' is a different axis
        again, since a waiting room precedes the map rather than describing what happens to a pick.
        (3) sectionSummary is pick one but real maps do two of these at once — Ticketmaster and MLB
        both grey sold-out sections and print a lowest price — and neither covers a computed value
        score, which two raters independently proposed. (4) 'Grey unavailable' names a visual rather
        than a concept: American crosses seats out and Emirates dims them, and both are the same
        idea; 'Tier colours' and 'Heat of remaining' likewise blur on resale maps, where one colour
        ramp carries both price and scarcity."
