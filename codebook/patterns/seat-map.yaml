# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "seat-map". Edit between batches only — see README "Rules".
id: seat-map
name: Seat map
level: pattern
parent: explore-space
aliases:
  - venue map
  - seating chart
  - seat picker
  - auditorium map
definition: A diagram of a venue’s seats or sections where people browse availability and price,
  then select one or more seats to book.
data: space
platforms:
  - web
  - mobile
domains:
  - entertainment
  - travel
  - mobility
  - education
anatomy:
  - name: Venue diagram
    role: Sections and seats in plan
  - name: Availability encoding
    role: What is free, held or sold
  - name: Seat selection
    role: The current picks
  - name: Legend and filters
    role: Price tiers and categories
  - name: Checkout handoff
    role: Pass selection into purchase
roles:
  - section
  - seat
  - price-tier
  - availability
  - view-preview
dimensions:
  - name: Seat content
    family: content
    question: What does each seat or section reveal before selection?
    subdimensions:
      - id: perSeatInfo
        name: Per-seat info
        select: many
        values:
          - id: available-vs-taken
            name: Available vs taken
            example: Ticketmaster
          - id: price-tier-colour
            name: Price tier colour
            example: SeatGeek
          - id: seat-identifier
            name: Seat identifier
            description: Row and number
            example: Most ticketing maps
          - id: view-from-seat-photo
            name: View-from-seat photo
            example: Ticketmaster view from seat
          - id: accessibility-markers
            name: Accessibility markers
            example: Accessible seat icons
          - id: bundle-or-package-badge
            name: Bundle or package badge
            example: Season packages
      - id: sectionSummary
        name: Section summary
        select: one
        values:
          - id: lowest-price-in-section
            name: Lowest price in section
            example: Many NBA team sites
          - id: availability-count
            name: Availability count
            example: StubHub heat sections
          - id: sold-out-grey
            name: Sold-out grey
            example: Ticketmaster
          - id: no-section-aggregate
            name: No section aggregate
            description: Only seat-level
            example: Small theatre charts
          - id: value-score-per-section
            name: Value score per section
            description: The section is summarised by a computed quality or value rating (SeatGeek's Deal Score)
              rather than by its lowest price, its remaining count or whether it is sold out
            example: SeatGeek — Event map
  - name: Diagram structure
    family: composition
    question: How is the venue decomposed, and how does selection nest?
    subdimensions:
      - id: seatHierarchy
        name: Hierarchy
        select: one
        values:
          - id: flat-all-seats
            name: Flat all seats
            description: Every seat visible at once
            example: Small clubs
          - id: section-then-seats
            name: Section then seats
            description: Drill into a section
            example: Ticketmaster
          - id: deck-level-tabs
            name: Deck / level tabs
            description: Balcony vs orchestra
            example: Broadway ticketing
          - id: ship-or-plane-deck-plans
            name: Ship or plane deck plans
            description: Cabins or seats by deck
            example: Cruise and airline seat maps
          - id: general-admission-regions
            name: General admission regions
            description: Areas not seats
            example: GA festival pits
  - name: Map interaction
    family: invocation
    question: How do people navigate the diagram and pick seats?
    subdimensions:
      - id: seatInteract
        name: Interact by
        select: many
        values:
          - id: pan-and-zoom-the-svg
            name: Pan and zoom the SVG
            example: Ticketmaster
          - id: tap-section-to-zoom-in
            name: Tap section to zoom in
            example: SeatGeek
          - id: click-seats-to-toggle
            name: Click seats to toggle
            example: Most maps
          - id: best-available-button
            name: Best-available button
            description: System picks seats
            example: Ticketmaster best available
          - id: filter-then-highlight
            name: Filter then highlight
            description: Price filter lights seats
            example: SeatGeek deals
          - id: pinch-on-mobile
            name: Pinch on mobile
            example: Mobile seat maps
  - name: Availability encoding
    family: encoding
    question: How are price and status shown visually?
    subdimensions:
      - id: seatEncoding
        name: Visual encoding
        select: many
        values:
          - id: tier-colours
            name: Tier colours
            example: Ticketmaster legend
          - id: grey-unavailable
            name: Grey unavailable
            example: All major sellers
          - id: heat-of-remaining
            name: Heat of remaining
            example: Some StubHub views
          - id: selected-outline
            name: Selected outline
            example: Selected seat glow
          - id: hold-countdown-styling
            name: Hold countdown styling
            description: Seats reserved briefly
            example: Ticketmaster holds
  - name: Selection rules
    family: scope
    question: What constraints apply to the set of chosen seats?
    subdimensions:
      - id: seatConstraints
        name: Constraints
        select: many
        values:
          - id: max-quantity
            name: Max quantity
            example: Four-seat caps
          - id: must-be-contiguous
            name: Must be contiguous
            example: Group seating rules
          - id: leave-no-single-seats
            name: Leave no single seats
            description: Anti-orphan rules
            example: Many venues
          - id: accessible-only-filter
            name: Accessible-only filter
            example: Wheelchair spaces
          - id: resale-vs-primary-inventory
            name: Resale vs primary inventory
            example: SeatGeek mixed inventory
  - name: Hold and purchase timing
    family: lifecycle
    question: How long are seats kept while the person decides?
    subdimensions:
      - id: seatHold
        name: Hold
        select: one
        values:
          - id: timed-hold-into-checkout
            name: Timed hold into checkout
            example: Ticketmaster timer
          - id: release-on-navigate-away
            name: Release on navigate away
            example: Some club sites
          - id: queue-before-map
            name: Queue before map
            description: Waiting room then seats
            example: Ticketmaster verified fan
          - id: request-without-hold
            name: Request without hold
            description: Lottery or draw
            example: Some school seat draws
wild:
  score: 0
  note: Seat maps are merchant-controlled; shoppers do not customize encodings or hierarchy.
  examples: []
techniques:
  - name: Surface view and price together
    dimension: Seat content
    how: Make view-from-seat, price and accessibility attributes co-visible on hover/focus so comparison
      does not require opening each seat.
    ai: false
  - name: Explain blocked seats
    dimension: Selection rules
    how: When a tap is refused, say which rule fired (orphan, max, contiguous) instead of silent
      failure.
    ai: false
  - name: Seats that match us
    dimension: Map interaction
    how: “Two together under $80 with aisle and not behind a pillar” highlights a shortlist with
      inspectable filters.
    ai: true
signature: Surface view and price together
sample: Ticketmaster, SeatGeek, StubHub, airline seat maps (United, Delta), theatre and campus
  ticketing, cruise cabin plans.
unit: One venue inventory map for one event or voyage leg.
relations:
