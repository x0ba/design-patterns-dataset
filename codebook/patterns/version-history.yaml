        status: raised
  raterNotes:
    fable:
      - Time Machine and Pages' versions browser are neither list nor filmstrip exactly; coded
        Filmstrip. git log is a command with no compare, restore or entry point of its own.
      - layout's Filmstrip exemplar (Figma) is a list without thumbnails; Canva is the real
        filmstrip. compare is pick-one but every git UI offers inline and split — the codebook
        should name a default rule. feedback's Author and timestamp conjoins two things personal
        histories only half have. Three raters proposed the same field-change-log capture under
        three names.
    opus:
      - "layout and compare pull apart badly: a history that shows commits in a list and a diff in a
        pane is one layout or two depending on how you read it, and Side-by-side compare sits in
        layout while the diff variations sit in compare. Branch from here and Cherry-pick a change
        went unused even though four git instances support both, because pick-one made me take the
        restore each product leads with. Warning that restore is undoable also never appeared — none
        of these twenty warns before restoring."
      - Author and timestamp bundles two signals into one value, so a personal backup that is
        nothing but dated snapshots (Time Machine, Windows, Pages) cannot be coded truthfully either
        way — that bundling drove most of the feedback splits. layout cites Google Docs version
        history under both Chronological list and Calendar of days, so one screen satisfies two
        values; compare's Split diff cites GitHub, which actually opens a unified diff by default,
        and that wrong exemplar split all four git clients; and openBy mixes entry routes with
        destination surfaces and has no value for a typed command.
    sonnet:
      - GitLab's repository-graph screen (14) and the raw git log --graph command (18) are both
        read-only overview views that don't themselves expose compare/restore actions (those live on
        other screens of the same product) — I coded those honestly as '?' or n/a rather than
        importing behaviour from a screen not actually sampled.
      - "Three findings: (1) capture's values aren't mutually exclusive the way I treated them in
        round 1 — a named checkpoint or an autosave generation is still also a Full document
        snapshot, and I'd been picking only the more 'interesting' value instead of all that apply,
        which accounts for most of my changes here. (2) compare's Split diff vs Inline diff split
        across the git-family instances (GitHub, GitHub Desktop, Sourcetree, GitLab, VS Code) is a
        real, verifiable platform default in each case, not a matter of taste, but the codebook's
        'pick one' doesn't flag that several of these tools offer both as a user toggle. (3) All
        three raters independently proposed near-identical new capture values for Airtable's
        field-level change log (my Field-level change log, fable's Field change log, opus's
        Per-field change events) — strong, convergent evidence this is a real gap regardless of
        which name is adopted."
