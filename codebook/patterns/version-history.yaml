# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "version-history". Edit between batches only — see README "Rules".
id: version-history
name: Version history
level: pattern
parent: collaborate
aliases:
  - revision history
  - timeline of changes
  - checkpoints
definition: A browsable record of past states of an artifact, with authorship, so a person can
  compare, restore or branch from an earlier version.
data: sequence
platforms:
  - web
  - desktop
domains:
  - productivity
  - software
  - design
  - enterprise
  - education
anatomy:
  - name: Timeline
    role: Ordered versions
  - name: Snapshot
    role: One past state
  - name: Diff
    role: What changed
  - name: Restore
    role: Bring a past state forward
  - name: Author stamp
    role: Who made it
roles:
  - version
  - author
  - message
dimensions:
  - name: What a version captures
    family: content
    question: What is stored and shown for each version?
    subdimensions:
      - id: capture
        name: Capture
        select: many
        values:
          - id: full-document-snapshot
            name: Full document snapshot
            example: Google Docs history
          - id: named-checkpoint
            name: Named checkpoint
            example: Figma version history
          - id: commit-with-message
            name: Commit with message
            example: GitHub
          - id: autosave-generations
            name: Autosave generations
            example: Office AutoRecover
          - id: branch-tip
            name: Branch tip
            example: Git branches
          - id: field-change-log
            name: Field change log
            description: Each version is one field's old and new value rather than a document state (Airtable
              record revisions)
            example: Airtable — Record revision history
          - id: field-level-change-log
            name: Field-level change log
            description: A record of individual field-by-field changes (old value to new value, who and when),
              rather than a snapshot of the whole document, a named checkpoint, a commit, an
              autosave generation, or a branch tip.
            example: Airtable — Record revision history
  - name: History layout
    family: layout
    question: How is the history presented?
    subdimensions:
      - id: layout
        name: Layout
        select: one
        values:
          - id: chronological-list
            name: Chronological list
            example: Google Docs
          - id: graph-of-commits
            name: Graph of commits
            example: GitHub network / git log --graph
          - id: calendar-of-days
            name: Calendar of days
            example: Docs grouped by day
          - id: side-by-side-compare
            name: Side-by-side compare
            example: Diff views
          - id: filmstrip-of-canvases
            name: Filmstrip of canvases
            example: Figma version previews
          - id: receding-stack-in-3d-space
            name: Receding stack in 3D space
            description: Past states are shown as a stack of documents/windows receding visually into the
              distance, navigated by a timeline, rather than a flat chronological list, a calendar
              grouping, a filmstrip of thumbnails, a commit graph, or a diff view.
            example: macOS Time Machine — Browse backups
  - name: Comparing versions
    family: composition
    question: How do versions relate when inspected?
    subdimensions:
      - id: compare
        name: Compare
        select: one
        values:
          - id: single-snapshot-preview
            name: Single snapshot preview
            example: Docs preview
          - id: inline-diff
            name: Inline diff
            example: Google Docs show changes
          - id: split-diff
            name: Split diff
            example: GitHub Files changed
          - id: three-way-merge
            name: Three-way merge
            example: Git merge
          - id: blame-or-annotate-view
            name: Blame or annotate view
            example: GitHub blame
  - name: Restore flow
    family: flow
    question: How does a person return to or reuse a past state?
    subdimensions:
      - id: restore
        name: Restore
        select: one
        values:
          - id: restore-in-place
            name: Restore in place
            example: Docs Restore this version
          - id: copy-forward-as-new-version
            name: Copy forward as new version
            example: Make a copy
          - id: branch-from-here
            name: Branch from here
            example: Git branch / Figma branch
          - id: cherry-pick-a-change
            name: Cherry-pick a change
            example: Partial revert
          - id: revert-commit
            name: Revert commit
            example: GitHub revert
  - name: Opening history
    family: invocation
    question: How is history entered and left?
    subdimensions:
      - id: openBy
        name: Open by
        select: many
        values:
          - id: history-panel
            name: History panel
            example: Google Docs
          - id: commit-list-page
            name: Commit list page
            example: GitHub
          - id: named-version-menu
            name: Named version menu
            example: Figma
          - id: from-a-conflict
            name: From a conflict
            example: Merge UI
          - id: from-an-activity-item
            name: From an activity item
            example: Slack file versions
  - name: History feedback
    family: feedback
    question: How does the person know what will happen on restore?
    subdimensions:
      - id: feedback
        name: Feedback
        select: many
        values:
          - id: preview-before-restore
            name: Preview before restore
            example: Docs
          - id: diff-summary-counts
            name: Diff summary counts
            example: +/− lines
          - id: author-and-timestamp
            name: Author and timestamp
            example: All
          - id: warning-that-restore-is-undoable
            name: Warning that restore is undoable
            example: Confirm dialogs
          - id: ai-change-summary
            name: AI change summary
            example: GitHub Copilot summaries
wild:
  score: 2
  note: Naming versions and filtering by author are common; diff granularity less so.
  examples:
    - name: Google Docs
      note: Name current version; browse by person
    - name: Figma
      note: Name and restore versions
    - name: GitHub
      note: Interactive rebase and file history
techniques:
  - name: Named checkpoints
    dimension: What a version captures
    how: Let people pin meaningful versions with titles so the timeline is a story, not only autosaves.
    ai: false
  - name: Summarize this span
    dimension: History feedback
    how: Generate a readable summary of changes between two versions, linked to the underlying diff.
    ai: true
  - name: Restore as a branch
    dimension: Restore flow
    how: Default restore creates a branch or named copy so the current tip is never silently destroyed.
    ai: false
signature: Named checkpoints
sample: Documents, design files, wikis and source control UIs.
unit: One history timeline for one artifact.
