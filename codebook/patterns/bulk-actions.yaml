  score: 1
  note: The selection model and the actions are fixed by the product.
  examples: []
techniques:
  - name: Query-scoped actions
    dimension: Selection model
    how: Act on a saved filter rather than a hand selection, so the action also applies to items that
      arrive later.
    ai: false
  - name: Everything like these
    dimension: Selection model
    how: Select three examples and the system proposes the rule that selects the rest, shown as a filter
      before acting.
    ai: true
signature: Query-scoped actions
sample: Inboxes, admin consoles, photo libraries and file managers.
unit: One bulk-action flow.
