  raterNotes:
    fable:
      - Surface as pick-one strains when a product offers both a context menu and a drop target
        (Finder, Explorer); I coded the one the sample's flow names.
      - Three variations were proposed by all three raters under different names (the wizard page,
        the gather-while-dragging selection, the keyboard-only surface), so they are missing values.
        surface as pick one strains wherever two surfaces coexist (Finder, Dropbox). A phone's
        swapped bottom toolbar is neither 'replaces the header' nor a floating bar. Preview of
        affected items and Confirm first overlap. execution depends on set size for Shopify, HubSpot
        and Mailchimp.
    opus:
      - "surface needed three proposals, which says the sub assumes the action lives on the
        collection screen; a wizard page, a command palette and a bare keyboard shortcut are all
        common and none is expressible. consequence is pick-one but products stack them — Gmail
        confirms nothing and offers undo, AWS previews and confirms, Photos confirms with a
        recoverable trash — so I coded the strongest guard the flow puts in the way. execution is
        hard to observe: whether a bulk edit runs inline or as a job usually only shows at large N,
        and I coded the product's behaviour at scale."
      - "The clearest finding here is not a fault but a fact about proposals: three raters found the
        same four gaps (a wizard surface, a side-panel surface, a keyboard-only surface, and a touch
        pick-up-and-gather selection) and named each of them differently, so the packet reports
        disagreement where there is none. The codebook faults proper: `surface` is pick one but
        Finder, Dropbox and Linear each show two surfaces at once, and worse, the codebook glosses
        two different surface variations with the same Finder instance (Context menu 'e.g., Finder'
        and Drop onto a target 'e.g., Drag to trash'). `consequence` mixes exclusive and
        non-exclusive values — Count only means 'the count and nothing more', so it cannot be tied
        against Confirm first or Undo afterwards the way the other variations can, and Spotify shows
        neither a count nor an undo. `selection`'s variations are named by desktop input
        (Shift-click range, Marquee), leaving every touch range gesture homeless. And `execution` is
        not a property of the design at all: the same Shopify or Mailchimp flow is immediate for
        three items and a background job for thirty thousand, so without a stated selection size
        raters will keep splitting."
    sonnet:
      - Several bulk-action surfaces (a dedicated wizard, a persistent side panel, keyboard-only
        application) don't fit the four listed surface variations, all of which assume some visible
        toolbar/menu/bar; consequence for AWS terminate (17) genuinely has both a preview and a
        confirmation, coded as Confirm first since the action is irreversible.
      - Two patterns stood out. (1) 'surface' converged on three separate new variations (Wizard,
        Command palette, Keyboard shortcut) across only 18 instances — this pick-one dimension's
        four enumerated values (Contextual toolbar, Floating action bar, Context menu, Drop onto a
        target) all assume the action surface appears ON the collection screen, which misses an
        entire family of patterns where the action is invoked elsewhere (a separate wizard page, a
        typed command, or no surface at all). (2) A touch-drag gesture that selects a contiguous run
        (Apple Photos, Apple Mail) is functionally the same selection outcome as Shift-click range
        even though the input mechanics differ (finger-drag vs click-shift-click) — I initially
        proposed a new value for this before recognizing both other raters treat it as the same
        existing concept, which I now think is the better reading of what the dimension is actually
        asking.
