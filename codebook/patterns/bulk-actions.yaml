# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "bulk-actions". Edit between batches only — see README "Rules".
id: bulk-actions
name: Bulk actions
level: component
parent: browse-collections
aliases:
  - batch operations
  - multi-select actions
definition: Selecting many items and applying one action to all of them.
data: collection
platforms:
  - web
  - desktop
  - mobile
domains:
  - communication
  - productivity
  - enterprise
  - commerce
anatomy:
  - name: Selection
    role: Which items
  - name: Action surface
    role: What can be done
  - name: Consequence
    role: What will and did happen
roles: []
dimensions:
  - name: Selection model
    family: scope
    question: How are many items selected?
    subdimensions:
      - id: selection
        name: Selection
        select: many
        values:
          - id: checkbox-per-row
            name: Checkbox per row
            example: Gmail
          - id: shift-click-range
            name: Shift-click range
            example: Finder
          - id: all-matching-not-just-this-page
            name: All matching, not just this page
            example: Gmail “Select all conversations that match this search”
          - id: marquee
            name: Marquee
            example: Desktop icons
          - id: pick-up-and-gather
            name: Pick up and gather
            description: The set is built by holding one item and tapping others to add them to the stack
              travelling with the finger or pointer; the selection exists only for the duration of
              the drag
            example: iOS Home Screen — Drag several apps at once
          - id: drag-across
            name: Drag across
            description: Dragging a finger continuously across several items toggles each one it passes over,
              without an explicit checkbox tap per item, e.g. Apple Photos multi-select on mobile
            example: Apple Photos — Select and delete photos
          - id: pick-up-and-tap-to-add
            name: Pick up and tap to add
            description: Grab one item, then tap additional items while still holding to add them to a stack
              under your finger, e.g. iOS Home Screen app stacking
            example: iOS Home Screen — Drag several apps at once
  - name: Action surface
    family: layout
    question: Where do bulk actions appear?
    subdimensions:
      - id: surface
        name: Surface
        select: one
        values:
          - id: contextual-toolbar
            name: Contextual toolbar
            description: Replaces the header while selected
            example: Gmail
          - id: floating-action-bar
            name: Floating action bar
            example: Google Photos
          - id: context-menu
            name: Context menu
            example: Finder
          - id: drop-onto-a-target
            name: Drop onto a target
            example: Drag to trash
          - id: wizard
            name: Wizard
            description: A separate multistep flow (choose items, choose operation, confirm) launched from a
              menu command
            example: Jira — Bulk change wizard
          - id: side-panel
            name: Side panel
            description: Bulk actions listed in a panel beside the collection while items are selected
            example: Dropbox — Select files and move or delete
          - id: wizard-page
            name: Wizard page
            description: The bulk operation leaves the collection for a dedicated multi-step page that chooses
              the items, the operation and its details before committing
            example: Jira — Bulk change wizard
          - id: keyboard-shortcut
            name: Keyboard shortcut
            description: No action surface appears at all — a key applies the action to everything selected, the
              norm in professional media tools where speed beats discoverability
            example: Lightroom Classic — Select photos and flag or rate
          - id: command-palette
            name: Command palette
            description: The action is typed into a searchable command surface (Cmd+K) that applies to the
              current selection, instead of appearing as a toolbar or a menu at the pointer
            example: Linear — Multi-select issues and apply
          - id: keyboard-only
            name: Keyboard only
            description: Actions apply to the current selection via keyboard shortcuts directly, with no
              toolbar, menu or floating bar shown at all, e.g. Lightroom Classic flagging/rating
              shortcuts
            example: Lightroom Classic — Select photos and flag or rate
  - name: Consequence
    family: feedback
    question: How is the consequence shown and reversed?
    subdimensions:
      - id: consequence
        name: Consequence
        select: one
        values:
          - id: count-only
            name: Count only
            example: 3 selected
          - id: preview-of-affected-items
            name: Preview of affected items
            example: Migration tools
          - id: undo-afterwards
            name: Undo afterwards
            example: Gmail undo
          - id: confirm-first
            name: Confirm first
            example: Permanent delete
          - id: toast-only
            name: Toast only
            description: A transient toast confirms the action; no count beforehand and no undo
            example: Spotify — Select tracks and add to playlist
  - name: Execution
    family: flow
    question: When does it run?
    subdimensions:
      - id: execution
        name: Execution
        select: one
        values:
          - id: immediate
            name: Immediate
            example: Archive
          - id: background-job-with-progress
            name: Background job with progress
            example: Bulk imports
          - id: scheduled
            name: Scheduled
            example: Email campaigns
