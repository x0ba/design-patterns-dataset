# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "checkout". Edit between batches only — see README "Rules".
id: checkout
name: Checkout
level: pattern
parent: transact
aliases:
  - purchase flow
  - payment flow
definition: "The flow that turns a cart into a paid order: contact, delivery, payment and review."
data: schema
platforms:
  - web
  - mobile
domains:
  - commerce
  - travel
  - entertainment
anatomy:
  - name: Contact and delivery
    role: Who and where
  - name: Payment
    role: How to pay
  - name: Order summary
    role: What and how much
  - name: Place order
    role: The commitment
roles:
  - item
  - price
  - total
  - address
dimensions:
  - name: Structure
    family: flow
    question: How is the flow divided?
    subdimensions:
      - id: structure
        name: Structure
        select: one
        values:
          - id: multi-page-steps
            name: Multi-page steps
            example: Classic checkouts
          - id: one-page
            name: One page
            example: Shopify one-page checkout
          - id: express-wallet
            name: Express wallet
            example: Apple Pay, Shop Pay
          - id: guest-or-account
            name: Guest or account
            example: Retail checkouts
  - name: Order summary
    family: content
    question: How visible is what is being bought?
    subdimensions:
      - id: summary
        name: Summary
        select: one
        values:
          - id: only-at-review
            name: Only at review
            example: Older checkouts
          - id: collapsible-on-mobile
            name: Collapsible on mobile
            example: Shopify
          - id: persistent-side-summary
            name: Persistent side summary
            example: Desktop checkouts
          - id: editable-in-place
            name: Editable in place
            example: Change quantity in the summary
  - name: Prefill
    family: initiative
    question: What arrives filled in?
    subdimensions:
      - id: prefill
        name: Prefill
        select: one
        values:
          - id: blank
            name: Blank
            example: Guest checkout
          - id: saved-details
            name: Saved details
            example: Amazon
          - id: wallet-autofill
            name: Wallet autofill
            example: Apple Pay
          - id: address-autocomplete
            name: Address autocomplete
            example: Google Places autocomplete
  - name: Cost disclosure
    family: feedback
    question: When is the full cost known?
    subdimensions:
      - id: disclosure
        name: Disclosure
        select: one
        values:
          - id: only-at-the-end
            name: Only at the end
            example: Fees revealed late
          - id: running-total-with-estimates
            name: Running total with estimates
            example: Shopify
          - id: everything-up-front
            name: Everything up front
            example: Total-price displays
  - name: Payment options
    family: layout
    question: How are ways to pay offered?
    subdimensions:
      - id: payment
        name: Payment
        select: many
        values:
          - id: card-form
            name: Card form
            example: Stripe Checkout
          - id: wallet-buttons
            name: Wallet buttons
            example: Apple Pay
          - id: pay-later
            name: Pay later
            example: Klarna
          - id: saved-methods
            name: Saved methods
            example: Amazon
  - name: Abandonment
    family: lifecycle
    question: What happens when a person leaves?
    subdimensions:
      - id: abandonment
        name: Abandonment
        select: one
        values:
          - id: nothing-kept
            name: Nothing kept
            example: Guest sessions
          - id: saved-cart
            name: Saved cart
            example: Amazon
          - id: reminder
            name: Reminder
            example: Cart reminder emails
          - id: synced-across-devices
            name: Synced across devices
            example: Signed-in carts
