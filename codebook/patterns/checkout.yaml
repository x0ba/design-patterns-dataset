  raterNotes:
    fable:
      - "structure's 'Guest or account' and 'Express wallet' are orthogonal to page shape, so I
        coded page shape and noted the gate/express buttons. abandonment: 'Synced across devices'
        whenever the cart lives on an account, 'Saved cart' for cookie carts, 'Reminder' where
        recovery emails are the product's known behaviour."
      - structure mixes how pages divide with the guest-or-account entry fork, which nearly every
        retail checkout has; Guest or account should be its own sub. Everything up front vs Running
        total needs a rule for totals that move with shipping and tips. abandonment is pick one but
        signed-in carts are saved, synced and reminded at once.
      - "Three sub-dimensions cannot be applied consistently as written. abandonment: Saved cart and
        Synced across devices nest rather than exclude each other (every synced cart is a saved
        cart; the codebook's Saved cart exemplar is Amazon while Synced's gloss 'signed-in carts'
        describes Amazon), and Reminder is orthogonal to both, so a signed-in cart with recovery
        emails holds three values of a pick-one sub; the remaining disagreement there (Zara, and
        sonnet's Saved cart on the delivery apps) is raters choosing how strong a claim to make, not
        different readings of the product, and it will not converge until Synced is either folded
        into Saved cart or the sub becomes pick any. prefill: Address autocomplete is a typing aid,
        not something that arrives filled in, so it nests inside Blank rather than being an
        alternative to it; the sub conflates initial state with entry assistance. disclosure:
        Everything up front versus Running total with estimates has no rule for totals that move
        with in-flow choices (delivery speed, tip, fulfilment), so the boundary sits wherever each
        rater draws it and Everything up front collapses to option-free pages. payment: Pay later is
        glossed by Klarna but its name also covers pay-at-property timing and store-card financing,
        and Wallet buttons conflates a wallet as a tender in a list with a wallet as an express
        button; tenders (miles, EBT, gift cards) have no code."
    opus:
      - "structure is pick-one but Guest or account is a different axis from Multi-page / One page /
        Express wallet — almost every checkout here is both (guest choice and a page count), so I
        coded Guest or account only where the first screen is literally that fork, and raters could
        easily code Amazon or Etsy the other way. prefill is similarly layered: a signed-in Shopify
        checkout is wallet autofill, saved details and address autocomplete at once."
      - "structure mixes two axes and a special case: Multi-page steps and One page answer 'how is
        the flow divided', while Guest or account is an identity question true of nearly every
        instance and Express wallet is a path through the flow rather than a division of it — that
        is most of this entry's disagreement. abandonment is a nesting, not a partition: Nothing
        kept is inside Saved cart is inside Synced across devices, Reminder is orthogonal to all
        three, and the codebook names Amazon under Saved cart while glossing Synced as 'signed-in
        carts'. Pay later covers BNPL, pay-at-property and store-card financing at once, and the
        payment sub-dimension names payment surfaces so alternative tenders (EBT, miles, points,
        store credit) cannot be coded at all."
      - "Three defects account for all 17 cells, and two of them are the kind that cannot be
        reconciled by re-reading the product. (1) abandonment is a nesting plus an orthogonal, not a
        partition: Nothing kept ⊂ Saved cart ⊂ Synced across devices are the same claim at
        increasing strength, so a rater's confidence — not the product — decides the code, while
        Reminder answers a separate question (outreach, not persistence) and Etsy, Amazon and SHEIN
        are truthfully both; 6 of the 17 cells are this, and I regard the sub-dimension as
        unreliable as written rather than mis-applied. It needs splitting into a persistence scale
        (nothing / this device / the account) and a separate yes-no for reminders, and its own gloss
        contradicts itself by naming Amazon under Saved cart while glossing Synced as 'signed-in
        carts'. (2) prefill conflates what arrives filled with what helps you fill: Address
        autocomplete is not an alternative to Blank, it nests inside it, so n20 has two true codes
        under pick one — it wants pick any, or Address autocomplete moved to an input-assist
        sub-dimension. (3) disclosure conflates timing with finality: Everything up front vs Running
        total with estimates asks both 'is the total there from the start' and 'is it final', and
        Amazon is yes to the first and no to the second (n1). Two further notes that are naming, not
        structure: Pay later is named for deferred payment and glossed for BNPL financing, and the
        two sets differ (n16); and payment names surfaces only, so EBT, miles, points and store
        credit — on screen at Instacart and Delta — cannot be coded at all. Finally, a process
        observation: at least 5 of these cells (n4, n5, n15, n9, n16) are raters swapping positions
        between rounds and citing each other's abandoned codes as support, which inflates the
        apparent disagreement on structure."
    sonnet:
      - "abandonment behavior for on-demand food delivery apps (DoorDash, Uber Eats, Instacart) was
        marked '?': restaurant/shopper availability is time-sensitive so I'm not confident whether
        an abandoned cart is saved, reminded, or simply dropped."
      - "Two codebook problems, one of them large. (1) structure's four values conflate two
        different axes: three of them (Multi-page steps / One page / Express wallet) describe how
        many pages the flow spans, while the fourth (Guest or account) describes who must sign in —
        a question most real checkouts answer independently of their page count (Amazon is both One
        page and lets you check out as guest-or-account). My round-1 codes defaulted to Guest or
        account almost everywhere the choice was visible on screen, which is a real miss, but the
        deeper issue is that this pick-one sub-dimension is answering two different questions with
        one value; per the reconciliation rule I took the step-shape value since the codebook lists
        it first and it's what 'How is the flow divided?' is actually asking, but nearly every
        instance here also truthfully has a guest-or-account choice that the codebook currently has
        no room to also record. (2) disclosure's Running total with estimates and Everything up
        front collapsed into each other constantly: almost any checkout that shows a total early but
        lets one more input (a delivery slot, a coupon, a tip) still adjust it got split three ways,
        because the codebook doesn't say how much a total needs to move for 'running' to apply
        versus 'up front' meaning the number is right the first time. Ticketmaster (n14) was the
        interesting exception — a specific, dated regulatory fact (the FTC's 2025 all-in-pricing
        rule) changed which value is actually correct now, which is a case worth flagging as a place
        where a codebook exemplar can go stale rather than being wrong."
      - "The abandonment sub-dimension cannot be applied consistently as pick-one, and I agree with
        both other raters' diagnosis: Nothing kept, Saved cart and Synced across devices are not
        parallel alternatives but three strengths of a single underlying claim (a synced cart is
        definitionally also a saved cart, which is definitionally not 'nothing kept'), while
        Reminder names an unrelated axis - an outbound notification - that coexists with any of the
        other three (Etsy does both, per fable's own n7 note; Amazon is the codebook's own Saved
        cart exemplar while also matching its Synced gloss, 'signed-in carts', a clash opus named at
        n1 in round 2). Every abandonment disagreement in this packet (n7, n9, n11, n12, n13, n18)
        reduces to raters choosing a different confidence level on the same underlying fact, not
        seeing different products - exactly the failure mode described going into this round. I'm
        holding my codes at n7/n11/n12/n13 (weaker, more defensible tier), and at n9/n18 I already
        sit with the majority (also worth noting neither of those was a case of me converging to
        reach that agreement - n9 and n18 already matched fable and opus respectively going into
        this round). Two smaller findings from the other recoded cells: (1) structure's 'how many
        steps' question is ambiguous about whether a modal/sheet used to edit one field counts as a
        step; I now read the codebook's own One page exemplar (Shopify, which itself has edit
        sheets) as settling this toward 'no', and moved Walmart/Target/Expedia (n4, n5, n15) to One
        page on that basis rather than by deferring to the other raters' count. (2) payment's Pay
        later is glossed only by Klarna-style BNPL financing, but real products use the phrase 'pay
        later' for plain charge-timing choices too (Booking.com's pay-at-property, n16); I held
        these apart since the underlying UI mechanism differs even where the marketing word matches,
        but the gloss doesn't say so explicitly."
