# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "task-list". Edit between batches only — see README "Rules".
id: task-list
name: Task list
level: pattern
parent: schedule
aliases:
  - to-do list
  - checklist
  - task manager
  - action list
definition: Ordered or grouped actionable items with completion state, often carrying due dates,
  assignees and priority without requiring a full time grid.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - productivity
  - software
  - education
  - home
  - enterprise
anatomy:
  - name: List
    role: The ordered or grouped set of tasks
  - name: Task row
    role: Title plus key attributes
  - name: Completion control
    role: Check, done or status
  - name: Detail
    role: Fuller fields for one task
roles:
  - title
  - due-date
  - assignee
  - priority
  - project
dimensions:
  - name: Task representation
    family: content
    question: What does each row show, and how rich is the item?
    subdimensions:
      - id: rowFields
        name: Row fields
        select: many
        values:
          - id: title-only
            name: Title only
            example: Classic paper-like lists
          - id: due-date
            name: Due date
            example: Apple Reminders
          - id: assignee
            name: Assignee
            example: Asana list
          - id: priority-or-score
            name: Priority or score
            example: Todoist priority flags
          - id: project-or-tags
            name: Project or tags
            example: Todoist labels
          - id: sub-task-progress
            name: Sub-task progress
            example: Things checklist progress
          - id: estimate
            name: Estimate
            example: Linear estimate
      - id: itemRichness
        name: Item richness
        select: one
        values:
          - id: checkbox-item
            name: Checkbox item
            description: Little more than done + title
            example: Apple Reminders
          - id: issue-like-task
            name: Issue-like task
            description: Description, comments, fields
            example: Linear
          - id: checklist-inside-a-doc
            name: Checklist inside a doc
            description: Tasks embedded in prose
            example: Notion to-do blocks
          - id: recurring-template
            name: Recurring template
            description: Repeats on a rule
            example: Todoist recurring
  - name: Ordering and grouping
    family: composition
    question: What structure holds the tasks?
    subdimensions:
      - id: taskStructure
        name: Structure
        select: one
        values:
          - id: manual-order
            name: Manual order
            description: Drag to prioritize
            example: Things Today
          - id: grouped-by-date
            name: Grouped by date
            description: Overdue / Today / Upcoming
            example: Todoist
          - id: grouped-by-project-or-list
            name: Grouped by project or list
            example: Apple Reminders lists
          - id: grouped-by-assignee-or-status
            name: Grouped by assignee or status
            example: Asana
          - id: hierarchical-outline
            name: Hierarchical outline
            description: Indent for sub-tasks
            example: Workflowy, Dynalist
          - id: filter-defined-smart-list
            name: Filter-defined smart list
            description: Saved query as a list
            example: Todoist filters
  - name: Scheduling link
    family: encoding
    question: How does the list connect to clock time?
    subdimensions:
      - id: timeBinding
        name: Time binding
        select: one
        values:
          - id: no-dates
            name: No dates
            description: Pure ordered work
            example: Simple checklists
          - id: due-date-only
            name: Due date only
            description: Day without time
            example: Many to-do apps
          - id: due-date-and-time
            name: Due date and time
            example: Google Tasks with time
          - id: time-block-on-calendar
            name: Time block on calendar
            description: Task appears as a calendar event
            example: Motion, Reclaim
          - id: deadline-plus-soft-plan-date
            name: Deadline plus soft plan date
            description: Separate plan vs due
            example: Things deadlines vs when
  - name: Completing and triaging
    family: flow
    question: How do tasks move toward done or deferral?
    subdimensions:
      - id: completionPath
        name: Completion path
        select: many
        values:
          - id: check-off
            name: Check off
            example: Reminders
          - id: status-workflow
            name: Status workflow
            description: Todo → In progress → Done
            example: Linear
          - id: snooze-defer
            name: Snooze / defer
            description: Leave incomplete but hide until later
            example: Things Tonight / Anytime
          - id: migrate-to-another-day
            name: Migrate to another day
            description: Roll unfinished forward
            example: Bullet journal digital apps
          - id: convert-to-event-or-issue
            name: Convert to event or issue
            example: Slack save for later → reminders
  - name: Creation and detail
    family: invocation
    question: How are tasks added and opened?
    subdimensions:
      - id: createOpen
        name: Create and open
        select: many
        values:
          - id: inline-add-row
            name: Inline add row
            example: Todoist
          - id: quick-add-shortcut
            name: Quick-add shortcut
            example: Todoist q
          - id: natural-language-parse
            name: Natural language parse
            description: “Email Sam tomorrow 5pm”
            example: Todoist quick add
          - id: open-detail-pane
            name: Open detail pane
            example: Asana task pane
          - id: open-full-page
            name: Open full page
            example: Notion task pages
          - id: save-from-elsewhere
            name: Save from elsewhere
            description: Items enter the list by being captured from another surface — starring an email, saving
              a message, syncing an issue from another tool — rather than being typed into the list
              at all
            example: Google Tasks — Side panel in Gmail
  - name: Personal vs shared
    family: collaboration
    question: Whose list is it, and how is assignment shared?
    subdimensions:
      - id: sharingModel
        name: Sharing model
        select: one
        values:
          - id: private-list
            name: Private list
            example: Personal Reminders
          - id: shared-list
            name: Shared list
            description: Several people on one list
            example: Shared Apple Reminders
          - id: assigned-from-a-team-backlog
            name: Assigned from a team backlog
            example: Asana, Linear
          - id: delegated-with-visibility
            name: Delegated with visibility
            description: Assign and watch
            example: Microsoft To Do assigned
wild:
  score: 3
  note: List apps routinely let people choose grouping, visible fields and smart filters; that
    malleability is the product.
  examples:
    - name: Todoist
      note: Filters, labels and grouping
    - name: Things
      note: Today / Anytime / Someday structure
    - name: Linear
      note: Display options and custom views
    - name: Notion
      note: Any database layout over tasks
techniques:
  - name: Surface then sort the work
    dimension: Task representation
    how: Any field surfaced on the row becomes a sort, group and filter key — the collection finding
      applied to tasks.
    ai: false
  - name: Plan date vs due date
    dimension: Scheduling link
    how: Keep deadline and intended work time as separate attributes so lists and calendars can bind
      differently without fighting.
    ai: false
  - name: Break this down
    dimension: Ordering and grouping
    how: “Make this shippable by Friday” proposes sub-tasks with estimates and due dates, each editable
      before accept.
    ai: true
signature: Surface then sort the work
sample: Todoist, Things, Apple Reminders, Microsoft To Do, Google Tasks, Asana list views, Linear,
  Notion task databases, TickTick.
unit: One list or smart view over a set of tasks.
