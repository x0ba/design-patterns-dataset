  unobserved:
    - sub: itemRichness
      var: Recurring template
  unresolved: []
  proposals:
    raised: 1
    adopted:
      - sub: createOpen
        name: Save from elsewhere
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - "itemRichness: coded personal to-do apps as Checkbox item even where descriptions and
        comments exist (Todoist), and work-management tools as Issue-like; the boundary is by
        product genre. 'Recurring template' was never picked because it describes a task's rule, not
        the item's richness."
      - Title only in rowFields is exclusive with every other value and should be dropped or glossed
        as such. timeBinding is pick one but daily planners hold a plan date, a due date and a
        calendar block at once. Migrate vs Snooze needs a line on postponing overdue items.
    opus:
      - "itemRichness is the hardest column: most consumer to-do apps sit between Checkbox item and
        Issue-like task (Todoist and OmniFocus have notes, sub-tasks and comments but still read as
        checkboxes), so I reserved Issue-like for items with a status workflow and a comment thread
        and noted it each time. taskStructure also double-fires — Todoist Today is both grouped by
        date and a saved filter — and I coded the grouping you see rather than the mechanism behind
        it."
    sonnet:
      - Sunsama and Slack Later both populate their lists by importing/saving from elsewhere rather
        than through any listed createOpen action; coded an empty array rather than force-fitting
        one.
      - "Codebook problems in this entry: (1) 'rowFields' puts 'Title only' in a pick-any alongside
        six field names, so any row with a due date makes it self-contradictory — it should be the
        empty array, or a separate pick-one; (2) 'completionPath: Snooze / defer' and 'Migrate to
        another day' overlap almost completely — pushing a task to tomorrow is both, and raters
        split on which name to use for the same gesture; (3) 'timeBinding' is pick-one but Sunsama
        is genuinely both Time block on calendar and Deadline plus soft plan date, and Things is
        both Due date only and Deadline plus soft plan date; (4) 'taskStructure' has no value for
        'grouped by section within one list', which is Asana's default and Notion's board default;
        (5) opus's +Save from elsewhere is a real gap — Slack's Later, Google Tasks in Gmail and
        Sunsama are all populated by capture from another surface rather than by any of the five
        creation gestures, and I have adopted it for all three."
