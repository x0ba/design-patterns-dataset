# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "tree-view". Edit between batches only — see README "Rules".
id: tree-view
name: Tree view
level: component
parent: navigate
aliases:
  - outline
  - hierarchy list
  - folder tree
definition: A hierarchical list whose nodes expand to reveal their children.
data: hierarchy
platforms:
  - desktop
  - web
domains:
  - software
  - productivity
  - enterprise
  - science
anatomy:
  - name: Node
    role: One item
  - name: Disclosure
    role: Expand and collapse
  - name: Indentation
    role: Depth
roles:
  - label
  - icon
  - badge
dimensions:
  - name: Node content
    family: content
    question: What does a node show?
    subdimensions:
      - id: content
        name: Content
        select: many
        values:
          - id: label
            name: Label
            example: All
          - id: type-icon
            name: Type icon
            example: VS Code file icons
          - id: count-badge
            name: Count badge
            example: Mail folder unread counts
          - id: status-decoration
            name: Status decoration
            example: VS Code git decorations
          - id: hover-actions
            name: Hover actions
            example: Notion sidebar page actions
  - name: Expansion
    family: invocation
    question: How do nodes open?
    subdimensions:
      - id: expandBy
        name: Expand by
        select: many
        values:
          - id: disclosure-triangle
            name: Disclosure triangle
            example: Finder list view
          - id: double-click
            name: Double-click
            example: Windows Explorer tree
          - id: arrow-keys
            name: Arrow keys
            example: WAI-ARIA tree pattern
          - id: hover-while-dragging
            name: Hover while dragging
            example: Spring-loaded folders
          - id: expand-all
            name: Expand all
            example: Outliners
  - name: Selection
    family: scope
    question: What can be selected?
    subdimensions:
      - id: selection
        name: Selection
        select: one
        values:
          - id: single-node
            name: Single node
            example: File trees
          - id: multiple-nodes
            name: Multiple nodes
            example: VS Code explorer
          - id: tri-state-checkboxes
            name: Tri-state checkboxes
            description: Parents reflect partial child selection
            example: Installer component pickers
  - name: Hierarchy source
    family: composition
    question: What makes one node the parent of another?
    subdimensions:
      - id: source
        name: Source
        select: one
        values:
          - id: containment
            name: Containment
            example: Folders
          - id: grouped-by-attribute
            name: Grouped by attribute
            example: Grouped tree tables
          - id: authored-outline
            name: Authored outline
            example: Workflowy
          - id: multiple-parents
            name: Multiple parents
            example: Tags shown as folders
  - name: Density
    family: adaptation
    question: How tight is the tree?
    subdimensions:
      - id: density
        name: Density
        select: one
        values:
          - id: compact
            name: Compact
            example: IDEs
          - id: with-indent-guides
            name: With indent guides
            example: VS Code tree indent guides
          - id: comfortable
            name: Comfortable
            example: Mobile outline apps
wild:
  score: 1
  note: IDEs expose indentation and decoration options; hierarchy source is fixed.
  examples:
    - name: VS Code
      note: Tree indent and render indent guides settings
techniques:
  - name: Regroup the hierarchy
    dimension: Hierarchy source
    how: Switch which attribute makes the parent (folder, tag, owner) while keeping the same nodes.
    ai: false
signature: Regroup the hierarchy
sample: IDEs, mail clients, file managers and outliners.
unit: One tree.
