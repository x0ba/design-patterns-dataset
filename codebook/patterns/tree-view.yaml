  raterNotes:
    fable:
      - Density is a judgement between Compact and Comfortable for app sidebars; I used Comfortable
        for roomier sidebars (mail, notes, Notion, Confluence) and Compact for file managers and
        IDEs.
      - Arrow keys is a platform fact that raters either know or do not, so it splits every desktop
        tree; source has no value for groups a person defines (Slack sections) and its Multiple
        parents gloss reads as being about the items in a node rather than the nodes; Compact vs
        Comfortable has no measurable line.
    opus:
      - "source is the sub-dimension that needed the most judgment: I read Authored outline as a
        hierarchy that exists only in this view (Slack sections, Workflowy bullets, Xcode groups)
        and Containment as one the tree is reporting from somewhere else. expandBy is also mostly
        unobservable in the negative — arrow-key expansion exists in nearly every desktop tree
        whether or not anyone uses it, so those codes describe capability rather than what a person
        is likely to do."
      - "source is the entry's weak point and it split us on five of twenty instances: Containment,
        Grouped by attribute and Authored outline are not exclusive in products where the person
        builds the containment themselves (Notion pages, Confluence pages, Slack custom sections),
        and the sub-dimension asks what makes one node the parent of another without saying whether
        the answer is the mechanism or the authorship. Slack in particular is attribute-grouped by
        default and authored where the person makes a section, so this pick one holds two values.
        expandBy is the opposite problem: arrow-key expansion exists in nearly every desktop tree
        whether or not anyone uses it, so a rater who codes capability and a rater who codes
        observed affordances disagree on almost every instance without disagreeing about the product
        — it produced sixteen of this entry's thirty-nine cells."
    sonnet:
      - "Source was the closest call throughout: trees that are literally backed by a filesystem or
        DOM (Finder, Explorer, Xcode, IntelliJ, GitHub, Obsidian, Figma, registry) got Containment,
        while trees the person freely drags into an arbitrary parent/child shape without an
        underlying filesystem (Notion, Confluence, Gmail labels, Workflowy) got Authored outline,
        even where the codebook's own example (Workflowy) is the only one it names directly."
  codedAt: 2026-09-22
