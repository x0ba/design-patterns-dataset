# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "co-editing-presence". Edit between batches only — see README "Rules".
id: co-editing-presence
name: Co-editing presence
level: pattern
parent: collaborate
aliases:
  - live presence
  - multiplayer cursors
  - awareness
definition: Showing who else is in a shared artifact right now, where they are looking or editing,
  and how to follow or avoid colliding with them.
data: document
platforms:
  - web
  - desktop
domains:
  - design
  - productivity
  - education
  - software
  - enterprise
anatomy:
  - name: Avatar stack
    role: Who is here
  - name: Cursor or selection
    role: Where each person is
  - name: Viewport or follow
    role: Seeing through another’s eyes
  - name: Awareness label
    role: Name and colour binding
roles:
  - viewer
  - editor
  - follower
dimensions:
  - name: Presence cues
    family: content
    question: What awareness information is shown for each person?
    subdimensions:
      - id: cues
        name: Cues
        select: many
        values:
          - id: avatar-and-colour
            name: Avatar and colour
            example: Figma
          - id: named-cursor
            name: Named cursor
            example: Google Docs cursors
          - id: active-selection-highlight
            name: Active selection highlight
            example: Figma selection
          - id: current-tool-or-mode
            name: Current tool or mode
            example: Miro tool indicators
          - id: idle-or-away-state
            name: Idle or away state
            example: Docs idle avatars
          - id: ephemeral-reactions-or-cursor-chat
            name: Ephemeral reactions or cursor chat
            description: Momentary expressive cues anchored at a person's cursor — a typed chat bubble, an emoji
              stamp, a high-five — beyond a static avatar, a named cursor, a selection highlight, a
              tool indicator, or an idle state.
            example: FigJam — Shared whiteboard
  - name: Where presence sits
    family: layout
    question: Where are presence cues placed?
    subdimensions:
      - id: placement
        name: Placement
        select: many
        values:
          - id: in-canvas-cursors
            name: In-canvas cursors
            example: Figma
          - id: top-avatar-stack
            name: Top avatar stack
            example: Google Docs
          - id: sidebar-people-list
            name: Sidebar people list
            example: Notion presence
          - id: minimap-dots
            name: Minimap dots
            example: Large canvas locators
          - id: follow-viewport-frame
            name: Follow viewport frame
            example: Figma observation mode
  - name: Awareness invocation
    family: invocation
    question: How does a person engage another’s presence?
    subdimensions:
      - id: engageBy
        name: Engage by
        select: many
        values:
          - id: click-avatar-to-find-them
            name: Click avatar to find them
            example: Figma
          - id: follow-mode
            name: Follow mode
            example: Figma follow
          - id: summon-or-call-in-file
            name: Summon or call in-file
            example: "@mentions"
          - id: watching-badge-only
            name: Watching badge only
            example: View-only presence
          - id: hide-my-cursor
            name: Hide my cursor
            example: Privacy toggles
  - name: Presence scope
    family: scope
    question: Whose activity is shown, and over what?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: this-file
            name: This file
            example: Docs
          - id: this-page-or-frame
            name: This page or frame
            example: Figma pages
          - id: this-selection-only
            name: This selection only
            example: Shared plugin sessions
          - id: organization-wide-activity
            name: Organization-wide activity
            example: Enterprise dashboards
          - id: anonymous-viewers-counted
            name: Anonymous viewers counted
            example: Link-view counts
  - name: Presence lifecycle
    family: lifecycle
    question: When do presence cues appear and fade?
    subdimensions:
      - id: lifecycle
        name: Lifecycle
        select: one
        values:
          - id: while-connected
            name: While connected
            example: WebSocket presence
          - id: linger-after-idle
            name: Linger after idle
            example: Away after timeout
          - id: ephemeral-flash-on-edit
            name: Ephemeral flash on edit
            example: Momentary highlights
          - id: persistent-last-seen
            name: Persistent last-seen
            example: Async presence stamps
  - name: Density adaptation
    family: adaptation
    question: How does presence behave when many people join?
    subdimensions:
      - id: density
        name: Density
        select: one
        values:
          - id: show-everyone
            name: Show everyone
            example: Small teams
          - id: collapse-to-count
            name: Collapse to count
            example: +12 in avatar stack
          - id: show-editors-only
            name: Show editors only
            example: Hide pure viewers
          - id: cluster-distant-cursors
            name: Cluster distant cursors
            example: Crowded canvases
wild:
  score: 1
  note: Follow mode and occasional hide-cursor options exist; cue density is rarely configurable.
  examples:
    - name: Figma
      note: Follow and multiplayer cursor colours
    - name: Google Docs
      note: Anonymous animal names when signed out
    - name: Miro
      note: Hide collaborator cursors
techniques:
  - name: Presence density control
    dimension: Density adaptation
    how: Let people choose editors-only, collapse thresholds or hide cursors without leaving the file.
    ai: false
  - name: Find who is editing…
    dimension: Awareness invocation
    how: A query jumps to people or regions matching a description (“who is in the pricing frame?”).
    ai: true
  - name: Follow as a lens
    dimension: Where presence sits
    how: Observation mode is a reversible lens over another viewport, not a hard navigation replace.
    ai: false
signature: Presence density control
sample: Multiplayer design tools, documents, whiteboards and IDEs.
unit: One shared session’s presence layer on one artifact.
