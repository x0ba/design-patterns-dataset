      n: 15
  proposals:
    raised: 1
    adopted:
      - sub: cues
        name: Ephemeral reactions or cursor chat
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - Density is Collapse to count almost everywhere because every avatar stack overflows to +N;
        lifecycle beyond While connected is only visible in Google's idle greying.
      - "density cannot be coded from memory of a normal session — Show everyone vs Collapse to
        count depends on an overflow threshold nobody sees, so one rater defaulted to each; the
        codebook should say what to code when the crowded case is unobserved. placement: the Sidebar
        people list exemplar (Notion) is a top stack, and there is no value for a list behind a
        button (Pages). scope: file-wide avatars with per-page cursors (Figma, FigJam, Slides) fit
        neither This file nor This page or frame cleanly."
    opus:
      - "density is close to unobservable: how a product behaves with forty people in a file is
        something almost nobody sees, so those codes are inferences from the avatar stack's design
        rather than observations. Hide my cursor also went unused — no instance in this sample
        offers a privacy toggle, which is itself worth reporting. scope is pick-one but a
        session-based tool (Live Share) has presence that follows people across files, which none of
        the variations describes."
      - "density stayed the hardest sub-dimension to apply honestly — nobody watches a file with
        forty people in it, so most density codes are inferences from how the avatar stack is built,
        and I moved two to ? rather than keep inferring. scope is pick one but wants pick any: a
        board with pages (FigJam) is scoped both to the file and to the page, and Live Share's
        presence follows a person across files, which no variation says. cues has no slot for
        expressive, momentary cues (cursor chat, stamps), hence the adopted proposal, and
        placement's Sidebar people list has to absorb popover lists (Pages) that are not sidebars."
    sonnet:
      - Density came back Show everyone for almost every instance since none of these sample screens
        describe a crowded session; Collapse to count only showed up where the note explicitly
        mentions a count (Docs, Coda), so this dimension is likely undercounted relative to what
        these products actually do at higher participant counts, which I have no direct evidence of
        in the sample.
      - "My own round-1 density codes had a systematic bias: I answered 'Show everyone' as a
        small-team default across nearly the whole sample instead of checking each product's own
        overflow behaviour, when most mainstream tools here (Figma, the Workspace and Office
        families, Canva, Airtable, Slides, Linear, Whiteboard) are well known to collapse a crowded
        avatar stack to a '+N' count; I've corrected those and held Show everyone only where a rater
        gave a specific small-scale reason (Replit, tldraw, Pages, Overleaf). Separately, cues is
        pick-any but I was treating Avatar and colour and Named cursor as if picking one excluded
        the other, undercounting Avatar and colour across most of the entry even where the sample
        note names avatars directly."
