      - place: sub:logic
        sub: logic
        dim: null
        name: Flat AND/OR chain
        gloss: A single ordered list of conditions joined throughout by one chosen AND or OR operator, more
          flexible than per-attribute facets (AND across, OR within) but without the nested groups
          of a full boolean builder, e.g. Airtable's classic view filter
        raters:
          - sonnet
        instances:
          - 6
        status: raised
  raterNotes:
    fable:
      - Logic as pick-one loses information where a product ANDs by default but also supports
        negation or a boolean mode (Gmail, GitHub, Jira); I coded the surface's primary behaviour
        and noted the rest.
      - Per query and In the URL overlap on every retail site. logic as pick one loses the
        AND-by-default surface whose query language also negates (Gmail, GitHub) or has a boolean
        mode (Jira). Preset brackets for price and date are read as Range or Date range by some
        raters and as values by others. Counts per value and Live results co-occur on facet rails.
    opus:
      - "logic is effectively a constant: sixteen of twenty are AND across, OR within, because that
        is what a facet rail means, and the other four are database query builders. The sub would
        say more if it separated 'can values be excluded' from 'how do filters combine'. origin's
        Any attribute only fires for products where the data is the user's own (spreadsheets,
        databases, JQL); Natural language went unused in this sample, which is the honest finding —
        no shipping filter rail in the frame takes a sentence. preview and placement interact
        strongly: a rail filters live, a sheet commits with a count, and the one thing that breaks
        the pattern is LinkedIn committing from a dropdown. I coded the desktop behaviour where a
        product's mobile width adds an Apply button."
      - "Fourteen of these forty-one cells are one codebook fault: `persistence` mixes durability
        with mechanism, and glosses two of its three variations with the same instances — Per query
        is 'e.g., Retail search' and In the URL is 'e.g., Most e-commerce', which are the same
        twelve sites. I code In the URL whenever the state is in the address and can be reloaded or
        shared, keeping Per query for the phone instances (Yelp, Google Maps) where there is no
        address to put it in; that partition is coherent but the codebook does not state it. Second
        fault: `types` mixes the widget with the predicate, so a preset relative date choice
        (LinkedIn's Date posted), a tier of price checkboxes (Nike) and a slider (Airbnb) are all
        arguably Range or Date range — and because `placement` names a chip bar, a chip that merely
        opens a panel gets coded as a Toggle chip type (I made that error on Google Flights). Third:
        `preview` is pick one but Booking.com genuinely shows counts per value *and* reloads live,
        and its None gloss ('Apply-then-see forms') reads as 'no feedback at all', which tempts a
        rater into coding None for a live-filtering page. Smaller: `logic`'s Exclusions is not on
        the same axis as the other two — negation can be added to either AND-across-OR-within facets
        or a boolean builder."
    sonnet:
      - preview mixes a live/default surface with a separate apply-gated panel in several products
        (Zillow, Yelp, LinkedIn); coded for the dominant/primary surface with the exception noted
        per instance, since preview is pick-one.
      - "One dominant pattern: I systematically under-coded 'persistence' as the generic 'Per query'
        across roughly a dozen instances (Amazon, Airbnb, Google Shopping, Zillow, Booking.com,
        eBay, Google Flights, Etsy, LinkedIn, Indeed, Nike, Kayak) where both other raters
        specifically identified a URL parameter or fragment encoding the filter state — 'In the URL'
        should probably be treated as the default assumption for any web results page unless there's
        specific evidence otherwise, since it's cheap to implement and extremely common; 'Per query'
        should be reserved for cases with actual evidence the state resets and isn't shareable. A
        second, smaller pattern: 'preview' has three closely related values (Counts per value, Live
        results, Count on the apply button) that can all plausibly describe the same screen
        depending on which mechanism you emphasize (Booking.com and LinkedIn both genuinely have two
        of these at once) — the codebook could use a rule for which one wins when several apply, the
        way it does for arrangement's Zillow list-plus-map case elsewhere in this study."
