# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "filter-controls". Edit between batches only — see README "Rules".
id: filter-controls
name: Filter controls
level: component
parent: browse-collections
aliases:
  - facets
  - filter bar
  - refinements
definition: Controls that narrow a collection to items whose attributes match chosen values.
data: collection
platforms:
  - web
  - mobile
  - desktop
domains:
  - commerce
  - travel
  - productivity
  - enterprise
anatomy:
  - name: Filter
    role: One attribute and its chosen values
  - name: Filter surface
    role: Where filters live
  - name: Result count
    role: What the filters leave
roles: []
dimensions:
  - name: Placement
    family: layout
    question: Where do filters live?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: sidebar-facets
            name: Sidebar facets
            example: Amazon results
          - id: filter-bar-with-chips
            name: Filter bar with chips
            example: Google Shopping
          - id: modal-or-sheet
            name: Modal or sheet
            example: Airbnb Filters
          - id: column-header-filters
            name: Column header filters
            example: Excel AutoFilter
          - id: toolbar-popover
            name: Toolbar popover
            description: Filter conditions live in a popover opened from a toolbar button, with no chips,
              sidebar, sheet or header controls
            example: Airtable — View filter
  - name: Filter types
    family: content
    question: What kinds of filter are offered?
    subdimensions:
      - id: types
        name: Types
        select: many
        values:
          - id: checkbox-values
            name: Checkbox values
            example: Brand facets
          - id: range
            name: Range
            example: Price sliders
          - id: toggle-chips
            name: Toggle chips
            example: Free cancellation
          - id: text-match
            name: Text match
            example: Contains…
          - id: date-range
            name: Date range
            example: Travel sites
          - id: map-area
            name: Map area
            description: Filter to what is in view
            example: Airbnb search as I move the map
  - name: Result preview
    family: feedback
    question: Does a person see the effect before committing?
    subdimensions:
      - id: preview
        name: Preview
        select: one
        values:
          - id: none
            name: None
            example: Apply-then-see forms
          - id: counts-per-value
            name: Counts per value
            example: Facet counts
          - id: live-results
            name: Live results
            example: Instant filtering
          - id: count-on-the-apply-button
            name: Count on the apply button
            example: Airbnb “Show N places”
  - name: Filter origin
    family: initiative
    question: Who decides what can be filtered?
    subdimensions:
      - id: origin
        name: Origin
        select: one
        values:
          - id: developer-defined
            name: Developer-defined
            example: Most sites
          - id: any-attribute
            name: Any attribute
            description: Filter by anything surfaced
            example: CHI '25 Fluid Attributes
          - id: natural-language
            name: Natural language
            description: A sentence becomes filters
            example: CHI '25 “only couches with a linen texture”
  - name: Combination
    family: scope
    question: How do filters combine and persist?
    subdimensions:
      - id: logic
        name: Logic
        select: one
        values:
          - id: and-across-or-within
            name: AND across, OR within
            example: Facets
          - id: boolean-builder
            name: Boolean builder
            example: Notion advanced filters
          - id: exclusions
            name: Exclusions
            example: Negated filters in Gmail search
      - id: persistence
        name: Persistence
        select: one
        values:
          - id: per-query
            name: Per query
            example: Retail search
          - id: saved-filters
            name: Saved filters
            example: Jira saved filters
          - id: in-the-url
            name: In the URL
            example: Most e-commerce
wild:
  score: 1
  note: People choose values, not which attributes are filterable; saved filters appear in work tools.
  examples:
    - name: Jira
      note: Saved and shared filters
    - name: Notion
      note: Advanced filter groups
techniques:
  - name: Filter from any attribute
    dimension: Filter origin
    how: Select any surfaced value and choose Filter; the filter appears as an editable chip (CHI '25
      surface-then-filter).
    ai: false
  - name: Sentence to chips
    dimension: Filter origin
    how: A typed request becomes ordinary chips that can be inspected and removed, never a hidden query.
    ai: true
signature: Filter from any attribute
sample: Results pages across the Semrush categories plus productivity databases.
unit: One filter surface over one collection.
