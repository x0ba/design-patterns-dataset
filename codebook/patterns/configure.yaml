# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "configure". Edit between batches only — see README "Rules".
id: configure
name: Configure and personalize
level: archetype
aliases:
  - personalization
  - preferences
  - options
definition: Change how a system or a product behaves or looks.
data: schema
platforms:
  - web
  - mobile
  - desktop
domains:
  - software
  - productivity
  - commerce
  - home
  - enterprise
anatomy:
  - name: Option space
    role: What can be changed
  - name: Controls
    role: How values are set
  - name: Preview
    role: What the change will look like
  - name: Application
    role: When and where it takes effect
roles:
  - label
  - value
  - default
  - scope
dimensions:
  - name: What is configured
    family: content
    question: What kind of thing do the options describe?
    subdimensions:
      - id: target
        name: Target
        select: one
        values:
          - id: account-and-app-behaviour
            name: Account and app behaviour
            example: Apple Settings
          - id: a-product-being-bought
            name: A product being bought
            example: Tesla configurator
          - id: a-workspace-or-document
            name: A workspace or document
            example: Notion settings
          - id: a-device-in-the-environment
            name: A device in the environment
            example: Philips Hue
          - id: appearance-of-the-ui
            name: Appearance of the UI
            example: Theme pickers
          - id: a-resource-being-provisioned
            name: A resource being provisioned
            description: A cloud or service resource composed and priced before it is created (an instance, a
              database), neither a bought product nor an existing workspace
            example: AWS Console — Launch an instance
  - name: Organization of options
    family: composition
    question: How are options grouped and found?
    subdimensions:
      - id: organization
        name: Organization
        select: one
        values:
          - id: flat-list
            name: Flat list
            example: Simple preference panes
          - id: grouped-sections
            name: Grouped sections
            example: macOS System Settings
          - id: hierarchical-panes
            name: Hierarchical panes
            example: Apple Settings drill-down
          - id: searchable-index
            name: Searchable index
            example: VS Code settings search
          - id: wizard-of-decisions
            name: Wizard of decisions
            example: Guided setup
  - name: Preview and apply
    family: feedback
    question: When does a change become real, and can it be seen first?
    subdimensions:
      - id: application
        name: Application
        select: one
        values:
          - id: immediate
            name: Immediate
            example: iOS toggles
          - id: explicit-save
            name: Explicit save
            example: Many web admin forms
          - id: live-preview-then-commit
            name: Live preview then commit
            example: Tesla 3D configurator
          - id: deferred-until-restart
            name: Deferred until restart
            example: Some developer flags
          - id: scheduled
            name: Scheduled
            example: Focus mode schedules
  - name: Scope of effect
    family: scope
    question: Who and what does a change affect?
    subdimensions:
      - id: scope
        name: Scope
        select: one
        values:
          - id: this-device
            name: This device
            example: Local app preferences
          - id: this-account-everywhere
            name: This account everywhere
            example: iCloud settings sync
          - id: this-document-or-project
            name: This document or project
            example: Repo settings
          - id: shared-with-a-team
            name: Shared with a team
            example: Admin policies
          - id: one-configured-instance
            name: One configured instance
            description: A built product or profile
            example: Saved car configuration
wild:
  score: 2
  note: Search and sync exist in mature settings; most product configurators fix the option tree.
  examples:
    - name: VS Code
      note: Searchable settings and profiles
    - name: Apple Settings
      note: Search across panes
    - name: Figma
      note: User and team preference layers
techniques:
  - name: Option as attribute
    dimension: What is configured
    how: Treat every setting as a surfaced attribute of the system object, sortable and filterable like
      Fluid Attributes.
    ai: false
  - name: Describe the preference
    dimension: Organization of options
    how: “Make it quieter at night” finds or creates the right toggles and shows what will change before
      applying.
    ai: true
signature: Option as attribute
sample: OS settings, SaaS admin, commerce configurators and smart-home apps.
unit: One configuration surface over one target object.
relations:
  uses: []
  specializes: []
  neighbors:
    - enter-data
    - guide
scores:
  ubiquity: 5
  potential: 4
  spec: 4
evidence: agent-coded
usage:
  - People only open settings when something hurts
  - Defaults do most of the work
questions:
  - Is a product configurator the same grammar as app settings?
  - How should personal and admin scopes layer?
coding:
