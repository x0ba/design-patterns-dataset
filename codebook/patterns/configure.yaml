        name: A resource being provisioned
        raters:
          - fable
          - opus
          - sonnet
    recorded: []
  raterNotes:
    fable:
      - "Scope for home devices is awkward: the device in the environment is neither 'this device'
        (the phone) nor an account; I used This device to mean the target device and noted household
        sharing."
      - "scope has no value for a device in the environment (Hue, thermostat, Sonos, Ring): This
        device reads as the client and One configured instance as a built product, so home-device
        scope splits raters. organization's Grouped sections (macOS System Settings) and
        Hierarchical panes (Apple Settings) examples are the same sidebar-and-pane design, so
        sidebar layouts split raters. application wants pick any: Notion mixes Save forms with
        instant toggles."
    opus:
      - organization has no variation for configuration by direct manipulation of a model rather
        than by a catalogue of options — Google Home's schedule timeline (9) and Ring's drawn motion
        zones (19) are both edited on a picture of the thing, and I had to force them into Flat list
        and Grouped sections. scope conflates who a change affects with where it is stored, which
        makes 'This device' the fallback for OS settings that partly sync; VS Code's user/workspace
        cascade also has no home here (the settings entry has Override layers for exactly this, but
        the archetype does not). application is pick-one and several surfaces mix immediate fields
        with saved ones (Notion), so I coded the dominant behaviour.
      - "Two codebook faults drove most of this entry: Grouped sections and Hierarchical panes
        cannot be told apart because the Grouped exemplar (macOS System Settings) is itself a
        sidebar-and-pane, and Flat list vs Grouped sections flips depending on whether the unit is
        the pane named in the sample or the whole settings app. `application` should be pick any —
        Notion and most SaaS admin surfaces genuinely mix instant toggles with saved forms."
    sonnet:
      - Smart-home device settings (4, 9, 15, 19) are coded scope One configured instance
        throughout, on the reasoning that the setting reaches exactly that one physical device/room
        rather than an account-wide or team-wide surface; target for the AWS EC2 launch flow (16) is
        coded '?' since none of the five options describes provisioning a cloud resource.
      - "Two codebook problems surfaced. (1) `organization`'s Grouped sections and Hierarchical
        panes don't say whether a persistent sidebar that swaps an inline pane (Notion, GitHub,
        Word) counts as one level (Grouped) or two (Hierarchical) — I resolved it by whether the
        list itself is ever left behind (push-navigation) versus staying visible beside the swapped
        pane, but the gloss doesn't say this and the codebook's own macOS System Settings example is
        structurally identical to the Notion/GitHub cases raters split on. (2) `scope`'s This device
        / This account everywhere / One configured instance doesn't name smart-home hardware: 'This
        device' is glossed as the app's own local install, not the physical unit being controlled,
        and 'One configured instance' is glossed as a saved, portable build (a car configuration)
        rather than live control of a fixed piece of hardware — both readings are stretches for
        Hue/Nest/Sonos/Ring."
