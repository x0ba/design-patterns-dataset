  protocol: Shared sample of recalled instances; three model raters coded independently; Fleiss’ κ per
    sub-dimension, item-weighted per entry; disagreements sent back for reconciliation; majority
    consensus.
  instances: 20
  raters:
    - fable
    - opus
    - sonnet
  rounds: 3
  kappaFirstPass: 0.7854036026766874
  agreementFirstPass: 0.7875
  kappaFinal: 0.9568989717260271
  agreementFinal: 0.9625
  pass: true
  perSub:
    target:
      kappaFirstPass: 0.9586492074431429
      agreementFirstPass: 0.95
      kappaFinal: 1
      agreementFinal: 1
      flag: null
    organization:
      kappaFirstPass: 0.5117540687160943
      agreementFirstPass: 0.55
      kappaFinal: 0.8764160659114316
      agreementFinal: 0.9
      flag: null
    application:
