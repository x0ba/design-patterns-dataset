  raterNotes:
    fable:
      - Hierarchy for slide tools (grouping and z-order without a layers panel) falls between Flat
        objects and Layers and groups, coded Flat; Multiplayer includes Solo as a value inside a
        pick-any, used alone.
      - generation is pick-one but most tools hold Templates and a prompt feature; the create
        entry's gloss asks how much (ordinal, highest wins) while this one asks what kind, so I
        coded the codebook-named value where the product is named and the front door otherwise, and
        the two entries should say which they mean. hierarchy conflates nesting (auto-layout) and
        reuse (components), and slide tools with groups but no layers panel sit between Flat objects
        and Layers and groups. Live cursors should cover live selections (Sketch).
    opus:
      - "Hierarchy and responsiveness are pick-one over things that coexist: Figma has constraints
        and auto layout, Sketch has constraints and Smart Layout, so the code records which one the
        file is actually built with. Generation also forced a choice between a template library and
        a prompt in tools that ship both (Miro, FigJam, Canva); I followed the codebook's own
        examples where it named one."
      - generation is pick one over rungs that coexist, and this entry's list is also missing the
        parent entry's Variations to choose from, which is the only honest code for PowerPoint's
        Designer; I re-coded these with the tie-break of taking the first truthfully-held value,
        which collapses most modern tools onto Templates — the sub-dimension wants to be pick any.
        hierarchy has the same problem for Framer (stacks and components are both true) and its
        Layers and groups compounds a persistent layer stack with plain grouping, which is what
        split the three slide editors. multiplayer lists Solo inside a pick any alongside values it
        excludes, so an unshared document and a shared one cannot be told apart cleanly.
    sonnet:
      - Multiplayer/collaboration is often a capability the sampled screen doesn't show directly; I
        coded from general product knowledge of each tool's collaboration model rather than only the
        note.
      - Hierarchy and generation are pick-one but Framer truthfully holds two values at once on both
        (Auto-layout containers and Components with overrides; Templates and Layouts from a prompt)
        — I took the codebook's first-listed value each time. Generation's list is shorter than the
        parent create archetype's and has no equivalent to create's own 'Variations to choose from',
        which is what PowerPoint Designer actually does; +Variations to choose from proposes closing
        that gap rather than stretching Templates, Layouts from a prompt or Tidying assistance to
        fit.
