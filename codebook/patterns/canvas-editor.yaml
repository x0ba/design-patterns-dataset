# Codebook entry "canvas-editor". Edit between batches only — see README "Rules".
id: canvas-editor
name: Canvas editor
level: pattern
parent: create
aliases:
  - design tool
  - whiteboard
  - vector editor
definition: Arranging visual objects freely on a two-dimensional canvas, frames or artboards.
data: space
platforms:
  - desktop
  - web
  - mobile
domains:
  - design
  - education
  - enterprise
  - software
anatomy:
  - name: Canvas
    role: The space
  - name: Objects
    role: Shapes, text, images, frames
  - name: Layers panel
    role: The object hierarchy
  - name: Toolbar
    role: Creation tools
  - name: Inspector
    role: Properties of the selection
roles: []
dimensions:
  - name: Canvas model
    family: layout
    question: What kind of space is it?
    subdimensions:
      - id: canvas
        name: Canvas
        select: one
        values:
          - id: infinite-canvas
            name: Infinite canvas
            example: Miro
          - id: frames-on-a-canvas
            name: Frames on a canvas
            example: Figma frames
          - id: fixed-page-size
            name: Fixed page size
            example: Canva
          - id: slides
            name: Slides
            example: Keynote
  - name: Object hierarchy
    family: composition
    question: How are objects nested and reused?
    subdimensions:
      - id: hierarchy
        name: Hierarchy
        select: one
        values:
          - id: flat-objects
            name: Flat objects
            example: Whiteboards
          - id: layers-and-groups
            name: Layers and groups
            example: Illustrator
          - id: auto-layout-containers
            name: Auto-layout containers
            example: Figma auto layout
          - id: components-with-overrides
            name: Components with overrides
            example: Figma instances
  - name: Selection
    family: scope
    question: How are objects selected?
    subdimensions:
      - id: selection
        name: Selection
        select: many
        values:
          - id: click
            name: Click
            example: All
          - id: marquee
            name: Marquee
            example: All
          - id: select-matching
            name: Select matching
            example: Figma Select matching layers
          - id: deep-select-into-groups
            name: Deep select into groups
            example: Cmd-click in Figma
  - name: Tools
    family: invocation
    question: How are tools reached?
    subdimensions:
      - id: tools
        name: Tools
        select: many
        values:
          - id: persistent-toolbar
            name: Persistent toolbar
            example: Figma
          - id: contextual-toolbar
            name: Contextual toolbar
            example: Miro
          - id: quick-actions-search
            name: Quick actions search
            example: Figma Quick actions
          - id: pen-and-touch
            name: Pen and touch
            example: Apple Freeform
  - name: Generation
    family: initiative
    question: What does the tool make for you?
    subdimensions:
      - id: generation
        name: Generation
        select: one
        values:
          - id: manual
            name: Manual
            example: Illustrator
          - id: templates
            name: Templates
            example: Canva
          - id: layouts-from-a-prompt
            name: Layouts from a prompt
            example: Canva Magic Design
          - id: tidying-assistance
            name: Tidying assistance
            example: Figma AI layer renaming
  - name: Multiplayer
    family: collaboration
    question: How is working together shown?
    subdimensions:
      - id: multiplayer
        name: Multiplayer
        select: many
        values:
          - id: solo
            name: Solo
            example: Illustrator
          - id: live-cursors
            name: Live cursors
            example: Figma
          - id: comments-pinned-to-the-canvas
            name: Comments pinned to the canvas
            example: Figma comments
          - id: branches
            name: Branches
            example: Figma branching
          - id: follow-a-collaborator
            name: Follow a collaborator
            example: Figma observation mode
  - name: Responsiveness
    family: adaptation
    question: How do designs respond to size?
    subdimensions:
      - id: responsiveness
        name: Responsiveness
        select: one
        values:
          - id: absolute-positions
            name: Absolute positions
            example: Whiteboards
          - id: constraints
            name: Constraints
            example: Figma constraints
          - id: auto-layout
            name: Auto-layout
            example: Figma auto layout
          - id: breakpoint-variants
            name: Breakpoint variants
            example: Framer breakpoints
wild:
  score: 3
  note: Designers customize panels, plugins, shortcuts and libraries routinely.
  examples:
    - name: Figma
      note: Plugins, libraries, UI3 panel layout
    - name: Illustrator
      note: Custom workspaces
techniques:
  - name: Attributes as objects
    dimension: Object hierarchy
    how: Fills, strokes and effects become objects that can be dragged onto shapes, linked and edited in
      one place (Object-Oriented Drawing, CHI '16).
    ai: false
  - name: Select by attribute
    dimension: Selection
    how: Gather everything sharing a value into a live collection and operate on it (Collection Objects,
      CHI '17).
    ai: false
  - name: Variations side by side
    dimension: Generation
    how: Generate alternatives of a selected frame along chosen dimensions, spread as a grid like
      Meridian’s Design Space view.
    ai: true
signature: Attributes as objects
sample: Design, whiteboard, presentation and diagramming tools.
unit: One canvas editor.
