        status: raised
  raterNotes:
    fable:
      - Model is pick-one but most pickers show several models at once; I coded the one shown first.
        Target does not apply to palette generators (Adobe Color, Coolors).
      - model conflates the selector's colour model with the readout format, so Figma (HSB square,
        hex box) splits raters; target has no value for paint programs that colour the brush rather
        than an object; Named tokens is read as design-system variables by two raters and as any
        theme-bound name by me.
    opus:
      - "model is the sub-dimension that does not survive contact: several pickers express a colour
        in four models at once behind a toggle (Photoshop, the macOS panel, DevTools, GIMP), so
        pick-one records the default rather than the design, and palettes that never show a value
        (Reminders) have no model at all. I followed the codebook's exemplars where it names a
        product (Figma HSB, DevTools OKLCH) even when the default on screen is hex, and said so per
        instance. target also has no room for a tool colour or for a tool that colours nothing
        (Adobe Color, Coolors)."
      - model is pick one but the serious pickers (Photoshop, GIMP, macOS, PowerPoint) show three or
        four models at once, so the code records the codebook's list order rather than the product;
        it also has no subtractive space (all three of us proposed CMYK) and its OKLCH variation is
        really the name of one product's format toggle, which drags DevTools' code. target has no
        value for a colour that is loaded into a tool (four instances here) and none for a picker
        whose output is applied to nothing at all, which pushed two of us to n/a. helpers is a list
        of choosing aids and cannot hold an import affordance like Slack's paste-a-theme line.
    sonnet:
      - Multi-tab/multi-model pickers (macOS Colors panel, Photoshop, GIMP, Adobe Color) force a
        pick-one choice among several simultaneously offered forms or models; I coded the most
        prominent/first-listed one each time rather than the full set, which likely undercounts real
        variety.
      - "Codebook findings: (1) 'target' has no value for paint-style tools that load a colour into
        a brush/tool for future strokes rather than recolouring an existing object or selection —
        this recurred identically across four raster tools (Photoshop, Procreate, Paint, GIMP),
        which the adopted proposal now names. (2) 'helpers' Recent colours doesn't distinguish an
        auto-tracked recency list from manually-saved custom swatches (MS Paint) — both get forced
        into the same value. (3) 'helpers' has no room for a bulk paste-a-whole-theme mechanism
        (Slack); I now think that's rightly out of scope for a per-colour-choice helper list rather
        than a missing variation."
  codedAt: 2026-09-22
