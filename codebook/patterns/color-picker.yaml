    recorded:
      - place: sub:helpers
        sub: helpers
        dim: null
        name: Paste a theme string
        gloss: An entire theme or colour-set can be pasted in as one string to set every colour at once,
          rather than picked field by field.
        raters:
          - sonnet
        instances:
