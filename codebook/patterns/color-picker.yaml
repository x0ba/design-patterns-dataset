# yaml-language-server: $schema=../schema/pattern.schema.json
# Codebook entry "color-picker". Edit between batches only — see README "Rules".
id: color-picker
name: Colour picker
level: component
parent: enter-data
aliases:
  - color picker
  - swatches
  - eyedropper
definition: A control for choosing a colour, by sight, by value or by name.
data: schema
platforms:
  - desktop
  - web
  - mobile
domains:
  - design
  - productivity
  - software
anatomy:
  - name: Selector
    role: Area, wheel or swatches
  - name: Value
    role: The chosen colour in some model
  - name: Helpers
    role: Eyedropper, recents, document colours
roles: []
dimensions:
  - name: Form
    family: layout
    question: How is colour space presented?
    subdimensions:
      - id: form
        name: Form
        select: one
        values:
          - id: swatch-palette
            name: Swatch palette
            example: Google Docs text colour
          - id: area-and-hue-strip
            name: Area and hue strip
            example: Figma
          - id: colour-wheel
            name: Colour wheel
            example: Procreate colour disc
          - id: channel-sliders
            name: Channel sliders
            example: Photoshop
          - id: value-field
            name: Value field
            example: Hex inputs
          - id: palette-bars-with-regenerate
            name: Palette bars with regenerate
            description: Several colours (a whole palette) are randomized together by a single action, rather
              than one colour picked at a time via a field, wheel, sliders or swatches.
            example: Coolors — Palette generator
  - name: Colour model
    family: encoding
    question: In what model is colour expressed?
    subdimensions:
      - id: model
        name: Model
        select: one
        values:
          - id: rgb-or-hex
            name: RGB or hex
            example: Most tools
          - id: hsl-or-hsb
            name: HSL or HSB
            example: Figma
          - id: oklch
            name: OKLCH
            description: Perceptually uniform
            example: Chrome DevTools
          - id: named-tokens
            name: Named tokens
            example: Figma variables
          - id: cmyk
            name: CMYK
            description: Colour expressed as cyan, magenta, yellow, black for print (Illustrator Color panel in
              a print document, GIMP and macOS Colors CMYK tabs)
            example: Adobe Illustrator — Color panel
  - name: Helpers
    family: content
    question: What helps a person choose?
    subdimensions:
      - id: helpers
        name: Helpers
        select: many
        values:
          - id: recent-colours
            name: Recent colours
            example: Office
          - id: document-colours
            name: Document colours
            example: Figma
          - id: eyedropper
            name: Eyedropper
            example: Figma
          - id: contrast-check
            name: Contrast check
            example: Chrome DevTools contrast ratio
          - id: harmonies
            name: Harmonies
            example: Adobe Color
  - name: Target
    family: scope
    question: What does the colour apply to?
    subdimensions:
      - id: target
        name: Target
        select: one
        values:
          - id: one-object
            name: One object
            example: Slides
          - id: selection-with-mixed-values
            name: Selection with mixed values
            example: Figma
          - id: a-token-used-everywhere
            name: A token used everywhere
            example: Design-system variables
          - id: the-active-tool-or-brush
            name: The active tool or brush
            description: The colour is loaded into the tool and applies to whatever is painted next, rather than
              to an object that already exists or to a token
            example: Adobe Photoshop — Color Picker dialog
