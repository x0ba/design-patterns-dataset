stages:
  - n: 1
    id: scope
    name: Scope the pattern
    goal: Say what the pattern is made of, what it is also called, and what it is not.
    needsPeople: false
  - n: 2
    id: questions
    name: Frame analysis questions
    goal: Fix what the content analysis is looking for before looking.
    needsPeople: false
  - n: 3
    id: sample
    name: Sample instances
    goal: Collect a diverse, representative set of real instances, with a unit of analysis defined so
      that one instance is one countable thing.
    needsPeople: true
  - n: 4
    id: code
    name: Code to saturation
    goal: Turn instances into a codebook that more than one person applies the same way, and stop when
      new instances stop teaching anything.
    needsPeople: true
  - n: 5
    id: space
    name: Construct the design space
    goal: Organize the codebook into dimensions, sub-dimensions and variations, each variation anchored
      to a real exemplar.
    needsPeople: false
  - n: 6
    id: audit
    name: Audit existing customizability
    goal: Measure how much of the space end users can already reach, dimension by dimension.
    needsPeople: partly
  - n: 7
    id: techniques
    name: Design malleability techniques
    goal: Give end users a way to move along each dimension. The richest dimension gets a new technique;
      the others get familiar controls.
    needsPeople: false
  - n: 8
    id: spec
    name: Formalize a specification
    goal: Express any point in the design space, and any customization, as a declarative document shared
      by designers, developers, end users and models.
    needsPeople: false
  - n: 9
    id: demonstrate
    name: Demonstrate across domains and stakeholders
    goal: Show the space generalizes beyond the context it was found in, and that each stakeholder can
      act on it with familiar tools.
    needsPeople: false
  - n: 10
    id: compose
    name: Compose real screens, and count what cannot be said
    goal: Test the grammar rather than the codebook. Freeze it, write eight real interfaces in it, make
      each screen declare the things it must be able to state, and treat every statement with no
      construct as a hole. Fill the holes, rewrite the screens that opened them, and go again.
    needsPeople: false
  - n: 11
    id: evaluate
    name: Evaluate and iterate
    goal: Watch people use the malleable pattern, then feed what they did, and failed to do, back into
      the space and the spec.
    needsPeople: true
