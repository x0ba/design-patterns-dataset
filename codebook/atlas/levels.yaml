- id: archetype
  name: Archetype
  glyph: ◆
  def: "A user activity broad enough that its design space is abstract: the choices any interface for
    that activity must make, before it is any particular pattern."
- id: pattern
  name: Pattern
  glyph: ●
  def: A screen- or flow-level arrangement of components that recurs across products and domains.
    Overview–detail is the anchor pattern.
- id: component
  name: Component
  glyph: ■
  def: A widget-level unit reused inside many patterns. Its design space is narrow, and its variations
    often appear as the values of a pattern’s dimension.
