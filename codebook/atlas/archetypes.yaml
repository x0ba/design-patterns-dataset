# Archetype lanes. Order here is the lane order in the atlas.
- id: browse-collections
  name: Browse collections
  def: Scan many things, narrow to the relevant few, and focus on one.
  q: How is a collection organized, narrowed and focused?
- id: navigate
  name: Navigate and wayfind
  def: Know where you are, where you can go, and get there.
  q: How are places structured, shown and traversed?
- id: search
  name: Search and discover
  def: Express what you want, or be shown what you might want.
  q: How is intent expressed and how are candidates returned?
- id: enter-data
  name: Enter and edit data
  def: Give a system structured information and correct it.
  q: How is input structured, constrained and validated?
- id: create
  name: Create and compose
  def: Make an artifact by directly manipulating its parts.
  q: How are objects represented, selected and transformed?
- id: communicate
  name: Communicate
  def: Exchange messages with people over time.
  q: How are messages organized, composed and threaded?
- id: monitor
  name: Monitor and get notified
  def: Keep track of changing state and be interrupted only when it matters.
  q: What is watched, how is change surfaced, and when?
- id: guide
  name: Guide and onboard
  def: Learn a system while using it.
  q: When, where and how does help appear?
- id: transact
  name: Transact and commit
  def: Make a consequential choice, commit to it, and be able to take it back.
  q: How are options compared, confirmed and reversed?
- id: schedule
  name: Plan in time
  def: Arrange things along time and coordinate availability with others.
  q: How is time represented, and how are things placed in it?
- id: explore-space
  name: Explore space
  def: Understand, navigate and select within a spatial world.
  q: How is space projected, navigated and annotated?
- id: consume-media
  name: Consume media
  def: Watch, listen or read with control over pace, position and what comes next.
  q: How are playback, position and queue controlled?
- id: configure
  name: Configure and personalize
  def: Change how a system or a product behaves or looks.
  q: How are options organized, previewed and applied?
- id: analyze
  name: Analyze and visualize
  def: Find structure in data through representations of it.
  q: How is data encoded, linked and interrogated?
- id: collaborate
  name: Collaborate
  def: Work on shared artifacts with others, at the same time or over time.
  q: How are other people, their changes and their permissions made visible?
- id: delegate-ai
  name: Delegate to AI
  def: Hand a model a goal, then steer, verify and accept its work.
  q: How is intent handed off, progress shown and output verified?
