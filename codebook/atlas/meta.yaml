about: 'Design space of UI design-pattern design spaces. Seed from corpus; Pattern Atlas.mrbl is the
  live inspector. Metrics: malleabilityGap = scores.potential − wildNorm, where wildNorm maps
  wild.score 0→1, 1→2, 2→3, 3→4. configSpace is the product of (sel=one ? |vars| : 2^|vars|) across
  sub-dimensions; values above Number.MAX_SAFE_INTEGER are stored as "1eN" strings.'
thesis: The design space of a pattern is simultaneously (a) its codebook for analysis, (b) its
  customization surface for end users, and (c) its generation target for GenUI. One artifact, three
  readings. Meridian made (b) and (c) literal for overview–detail by formalizing the space as a
  specification; the atlas extends that to every pattern.
papers:
  - key: chi25
    cite: Bryan Min, Allen Chen, Yining Cao, Haijun Xia. 2025. Malleable Overview-Detail Interfaces. CHI
      '25.
    doi: 10.1145/3706598.3714164
  - key: uist25
    cite: "Bryan Min, Haijun Xia. 2025. Meridian: A Design Framework for Malleable Overview-Detail
      Interfaces. UIST '25."
    doi: 10.1145/3746059.3747654
taxonomy:
  about: "The vocabulary every design space in the atlas is written against: the three levels of
    abstraction, the sixteen archetypes, the twelve dimension families, and the rubrics behind every
    score. Content, Composition and Layout come from Min et al. CHI '25; the other nine generalize
    what that paper and Meridian (UIST '25) imply."
  evidence:
    coded: "The design space comes from a real content analysis: sampled instances, iterative open
      coding, an agreement check and saturation. Only overview–detail (CHI '25) is coded."
    synthesized: An expert-synthesis design space with real product exemplars. It is a seed codebook
      ready for stages 3–4 of the method, not a validated result.
    agent-coded: Three independent model raters (Fable, Opus, Sonnet) applied the seed codebook to a
      shared sample of 20 recalled real instances per entry; Fleiss’ κ is reported at first pass and
      after reconciliation, and proposals two raters shared became variations. Instances are
      well-known products as the raters know them, not freshly sampled screens — the human procedure
      remains `coded`.
