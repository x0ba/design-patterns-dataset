# The twelve dimension families. Order here is the order used everywhere (profiles, matrix).
- id: content
  name: Content
  def: "What information each component shows, and how it is abstracted from the underlying item:
    visually, semantically or computationally."
  q: What is shown where, and in what form?
  origin: CHI '25 content analysis (dimension 1 of 3)
- id: composition
  name: Composition
  def: "How multiple instances and components relate: cardinality, nesting, recursion, linking and
    synchronization."
  q: How do the parts connect?
  origin: CHI '25 content analysis (dimension 2 of 3)
- id: layout
  name: Layout
  def: The spatial arrangement of components, and of items inside them.
  q: Where do the parts sit?
  origin: CHI '25 content analysis (dimension 3 of 3)
- id: invocation
  name: Invocation
  def: "How a component is summoned and dismissed: the trigger, the entry point, and the way back."
  q: What brings it up, and from where?
  origin: Meridian openBy / openFrom; the Click, Hover and Back annotations in CHI '25 Fig. 3; study
    participant P6
- id: flow
  name: Flow
  def: "Progression through steps or states: linear, branching, free or resumable, and the rules for
    moving between them."
  q: In what order, and under what rules?
  origin: Generalized
- id: lifecycle
  name: Lifecycle
  def: "Time-bound behaviour: when something appears, how long it persists, how it expires and how it
    updates live."
  q: When does it appear, change and go away?
  origin: Generalized
- id: initiative
  name: Initiative
  def: "Who acts: the person, the system or an AI, and how control is handed between them."
  q: Who decides, and who does the work?
  origin: Generalized; anticipated by AI-assisted Fluid Attributes (CHI '25 §4.1.3)
- id: feedback
  name: Feedback
  def: How state, progress, validation, consequence and error are expressed back to the person.
  q: How does the person know what happened?
  origin: Generalized
- id: scope
  name: Scope
  def: "The unit an operation or attribute applies to: an item, a selection, a group, a whole
    collection, or everything."
  q: What does it apply to?
  origin: "CHI '25 study: participants P6, P10 and P12 wanted attributes about the whole collection,
    not only each item"
- id: encoding
  name: Encoding
  def: "How values map to visual variables and marks: position, size, colour, shape, motion."
  q: How do values become visuals?
  origin: Generalized from CHI '25 Fig. 11, where attributes invoke a representation (scatter plot,
    colour space)
- id: collaboration
  name: Collaboration
  def: Presence, authorship, permission and concurrency when more than one person touches the same
    thing.
  q: Who else is here, and what may they do?
  origin: Generalized; anticipated by shared abstractions (CHI '25 §8.3)
- id: adaptation
  name: Adaptation
  def: How the pattern changes with density, screen size, platform, input modality or the person’s
    ability.
  q: How does it change with context?
  origin: Generalized from the CHI '25 mobile application (§5.1.5) and Meridian’s responsive-spec
    discussion (§7)
