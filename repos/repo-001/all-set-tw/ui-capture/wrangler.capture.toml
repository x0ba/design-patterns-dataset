# Local-only Wrangler config for UI capture (derived from apps/worker/wrangler.local.toml.example).
# Everything runs inside local workerd: local D1 (SQLite), local queue, local DOs.
# Cloudflare Browser Rendering and Workers AI are not bound (no network).
name = "taiwan-fin-hub"
main = "../apps/worker/src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "../apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
CONFIG_ENCRYPTION_KEY = "local-capture-key-0123456789abcdef0123456789abcdef"
TEAM_DOMAIN = "https://placeholder.invalid"
POLICY_AUD = "temporary-placeholder"
LOCAL_DEV_MODE = "true"
EXCHANGE_RATE_API_URL = "http://127.0.0.1:4421/v6/latest/TWD"

[[durable_objects.bindings]]
name = "MEGABANK_EGRESS"
class_name = "MegabankEgress"

[[durable_objects.bindings]]
name = "FUBON_EGRESS"
class_name = "FubonEgress"

[[durable_objects.bindings]]
name = "CRYPTO_BROWSER_EGRESS"
class_name = "CryptoBrowserEgress"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MegabankEgress"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FubonEgress"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CryptoBrowserEgress"]

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "taiwan-fin-hub-sync"

[[queues.consumers]]
queue = "taiwan-fin-hub-sync"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1

[[d1_databases]]
binding = "DB"
database_name = "taiwan-fin-hub"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../apps/worker/migrations"
