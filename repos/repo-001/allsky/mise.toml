# Tooling for running the Allsky WebUI locally (see .ui-capture/).
# Allsky's WebUI is plain PHP (lighttpd + php-fpm on the Pi). We use a prebuilt
# static PHP CLI (has session, gd, curl, sqlite3, intl ...) and its built-in web server.
[tools]
"http:php" = { version = "8.3.31", url = "https://github.com/NativePHP/php-bin/raw/c4d0b4ad6df1f0fef196c22b2cac0d26b4658b38/bin/mac/arm64/php-8.3.zip", bin_path = "." }
# Static ffmpeg, used only by the seed scripts to build timelapse videos from the generated frames.
"http:ffmpeg" = { version = "6.0.0", url = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64", bin = "ffmpeg" }
