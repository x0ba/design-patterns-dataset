; PHP settings for running the Allsky WebUI with php's built-in server.
opcache.enable=0
opcache.enable_cli=0
memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=120
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
date.timezone=America/Denver
session.save_path=${ALLSKY_SESSIONS}
variables_order=EGPCS
