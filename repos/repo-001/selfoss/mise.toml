[settings]
# sigstore's TUF CDN is unreachable from the sandbox, so skip attestation checks
github_attestations = false
slsa = false

[tools]
node = "24.22.3"
# Static PHP 8.x build (php-cli + web server) for macOS arm64
"github:php/frankenphp" = { version = "1.13.5", asset_pattern = "frankenphp-mac-arm64", bin = "frankenphp" }
# composer.phar, run through FrankenPHP's bundled PHP CLI
"github:composer/composer" = { version = "2.11.2", asset_pattern = "composer.phar" }
