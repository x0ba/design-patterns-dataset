# Overlay config used only for the local UI capture build (passed after _config.yml).
# Site identity is what a city deploying JKAN would set; layout/theme are untouched.
title: Westbrook Open Data
greeting: Welcome to Westbrook Open Data
description: Find, download and reuse public data published by City of Westbrook departments — budgets, permits, transit, 311 requests and more.
# Serve from the root of the local static server (github-metadata would otherwise
# guess a GitHub Pages project baseurl).
baseurl: ""
url: "https://data.westbrook.gov"
branch: gh-pages
exclude:
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts/src
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - netlify
  - netlify.toml
  - .parcel-cache
  - docs
  - mise.toml
  - cspell.json
  - _config.ui-capture.yml
schema: westbrook
