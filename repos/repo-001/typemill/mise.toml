[tools]
# Static FrankenPHP binary: bundles PHP (CLI + built-in web server) with gd, mbstring, fileinfo, session, iconv, openssl, zip, ...
"http:frankenphp" = { version = "1.13.5", url = "https://github.com/php/frankenphp/releases/download/v{{version}}/frankenphp-linux-x86_64", bin = "frankenphp" }
"http:composer" = { version = "2.11.2", url = "https://github.com/composer/composer/releases/download/{{version}}/composer.phar", bin = "composer.phar" }
