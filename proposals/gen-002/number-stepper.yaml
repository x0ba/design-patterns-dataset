codebookVersion: 1.0.0
name: Number stepper
level: component
parent: enter-data
definition: A numeric input flanked by decrement/increment buttons for adjusting a quantity by fixed
  steps, often with live consequence (price, count) shown beside it.
aliases:
  - spin button
  - quantity selector
  - +/- stepper
relations:
  neighbors:
    - text-field
    - slider
dimensions:
  - name: Consequence feedback
    family: feedback
    question: What does the control show as the value changes?
    subdimensions:
      - id: feedback
        name: Feedback
        select: one
        values:
          - id: value-only
            name: Value only
          - id: live-price-or-total
            name: Live price or total
            example: Cart quantity updating line price
          - id: visual-preview
            name: Visual preview
            example: Sheet grid adding/removing spare tiles
rationale:
  - rater: rater-1
    site: fab-lab-material-commit
    text: text-field covers typed text and slider covers dragged values; the − / value / + quantity
      control (cart quantities, sheet counts) has no entry and is distinct from the navigational
      'stepper'.
