# Codebook proposal (new-values) — review with: node scripts/proposals.ts show gen-002 playlist-queue
id: playlist-queue
kind: new-values
status: open
batch: gen-002
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: edits
        values:
          - id: move-up-down-buttons
            name: Move up/down buttons
            description: Each queued item has arrow buttons to move it one place earlier or later
            example: Stopwise Up next popover
          - id: fill-to-time-budget
            name: Fill to time budget
            description: One action auto-adds items until the queue covers a target duration (e.g. trip
              remaining), shown against a coverage bar
  - subdimensions:
      - id: representation
        values:
          - id: scheduled-start-offset
            name: Scheduled start offset
            description: Each item shows when it will start relative to now, or as a clock time
          - id: intended-listener
            name: Intended listener
            description: Each item names the person it is queued for
rationale:
  - rater: rater-2
    site: tour-guide-narration-review
    text: Queue items are reordered with per-item up/down arrow buttons, not by dragging; existing edits
      values only cover drag-reorder.
  - rater: rater-3
    site: family-road-trip-audiobooks
    text: Here the queue is reordered by per-item ↑/↓ "Move up"/"Move down" buttons, not by dragging.
      drag-reorder and play-next don't describe stepwise button reordering, which is the accessible
      alternative many queues offer.
  - rater: rater-1
    site: family-road-trip-audiobooks
    text: The queue is reordered with ↑/↓ step buttons rather than by dragging, and each item shows its
      scheduled start offset from now (+10:40, +1:34:10) plus who it is for (the listener), and the
      queue also holds non-media "quiet stretch" blocks. No current values cover button-step
      reordering, start-time offsets, or the intended listener.
  - rater: rater-2
    site: family-road-trip-audiobooks
    text: Edits sub-dimension only has drag-reorder for reordering and no value for auto-filling a queue
      to a time budget.
