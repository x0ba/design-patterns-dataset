# Codebook proposal (new-values) — review with: node scripts/proposals.ts show gen-002 view-switcher
id: view-switcher
kind: new-values
status: open
batch: gen-002
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: views
        values:
          - id: source-split-preview
            name: Source / split / preview
            description: Switches between raw source, side-by-side source and rendered output, and rendered
              preview of the same document
            example: Quillstack, GitHub markdown editors, Typora
          - id: delta-vs-baseline
            name: Delta vs baseline
            description: Same layout, but the cells show the change against a chosen baseline or version instead
              of absolute values
            example: Cashweek — Values / Change vs v11
  - subdimensions:
      - id: form
        values:
          - id: text-segmented-control
            name: Text segmented control
            description: A pill-shaped segmented control with text labels
rationale:
  - rater: rater-3
    site: hobby-project-docs-setup
    text: Editors offer Source / Split / Preview modes for one document. None of the existing
      collection-layout views (list, grid, table…) describes this.
  - rater: rater-1
    site: hobby-project-docs-setup
    text: Editors often switch one document between source, split and rendered views. None of the
      current view values (list, grid, table, and so on) describe that.
  - rater: rater-2
    site: shared-cash-forecast-workbook
    text: "The view-switcher's Views values all describe different layouts (list, grid, board...). Here
      the switch keeps the same grid but changes what the cells show: absolute values or the change
      against a baseline version. There is also no value for a text segmented control as the control
      form."
