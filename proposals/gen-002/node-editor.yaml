# Codebook proposal (new-values) — review with: node scripts/proposals.ts show gen-002 node-editor
id: node-editor
kind: new-values
status: open
batch: gen-002
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: semantics
        values:
          - id: causal-logic-model
            name: Causal logic model
            description: Edges mean 'contributes to / leads to' between stages of a theory of change or logic
              model; links carry assumptions and evidence strength rather than data.
            example: Throughline theory-of-change builder
  - subdimensions:
      - id: arrangement
        values:
          - id: stage-columns-and-lanes
            name: Stage columns and lanes
            description: Nodes are placed in fixed typed columns (stages) crossed with horizontal swimlanes;
              only order within a cell is free.
            example: Logic-model builders
          - id: column-and-swimlane-slots
            name: Column and swimlane slots
            description: Nodes sit in fixed stage columns and category rows; position within a cell is reordered
              rather than placed freely.
            example: Logic model builders
  - subdimensions:
      - id: add
        values:
          - id: per-column-add-button
            name: Per-column add button
            description: A '+' button in each typed column header creates a node of that type.
            example: Throughline column headers
          - id: column-add-button
            name: Column add button
            description: A '+' button in each stage column header creates a new node of that type.
            example: Theory of change builders
rationale:
  - rater: rater-2
    site: theory-of-change-builder
    text: Theory-of-change / logic-model builders connect nodes to express causal contribution (inputs →
      activities → outputs → outcomes) rather than dataflow, control flow, automation, state or
      model pipelines. Nodes sit in fixed stage columns × program swimlanes and are added per column
      with '+' buttons, which none of the add values describe.
  - rater: rater-1
    site: theory-of-change-builder
    text: A theory-of-change / logic-model builder connects nodes (inputs → activities → outputs →
      outcomes) where an edge means a hypothesised causal contribution, not data, control, workflow
      or state transitions. Nodes are constrained to fixed stage columns and program swimlane rows,
      and are added with a '+' button in each column header — none of the existing semantics,
      arrangement or add values describe this.
  - rater: rater-3
    site: theory-of-change-builder
    text: A theory-of-change builder shows a node graph whose edges mean causal 'leads to' links between
      fixed typed columns, and whose nodes are added with a '+' button in each column header. No
      existing semantics or add value describes either of these.
