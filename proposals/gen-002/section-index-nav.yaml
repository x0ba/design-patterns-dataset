# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show gen-002 section-index-nav
id: section-index-nav
kind: new-entry
status: open
batch: gen-002
codebookVersion: 1.0.0
name: Section index (in-page navigation)
level: component
parent: navigate
definition: A sticky list of the sections of one long page or document that jumps to each section
  and often shows each section's status (completion, errors) — distinct from tabs (all sections stay
  rendered) and app-shell secondary nav (it stays within one page).
aliases:
  - table of contents
  - on-this-page nav
  - scrollspy
  - jump links
relations:
  neighbors:
    - tabs
    - stepper
    - app-shell
dimensions:
  - name: Item status
    family: content
    question: What does each entry show besides its title?
    subdimensions:
      - id: itemStatus
        name: Item status
        select: one
        values:
          - id: title-only
            name: Title only
          - id: completion-status
            name: Completion status
            description: Counts or done/to-fix state per section
          - id: active-highlight
            name: Active highlight (scrollspy)
  - name: Placement
    family: layout
    question: Where does the index sit?
    subdimensions:
      - id: placement
        name: Placement
        select: one
        values:
          - id: sticky-left-rail
            name: Sticky left rail
          - id: sticky-right-rail
            name: Sticky right rail
          - id: inline-top
            name: Inline at top
rationale:
  - rater: rater-2
    site: family-health-records-forms
    text: No entry covers in-page anchor/jump navigation; tabs, tree-view, stepper and breadcrumbs don't
      fit a non-sequential, always-rendered section index with per-section status like 'All 7
      filled' / '1 to fix of 2'.
sources:
