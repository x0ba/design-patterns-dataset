# Codebook proposal (new-values) — review with: node scripts/proposals.ts show gen-002 media-player
id: media-player
kind: new-values
status: open
batch: gen-002
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: position
        values:
          - id: synced-transcript
            name: Synced transcript
            description: A timestamped, speaker-labelled transcript beside the player. The current line is
              highlighted as playback moves, and clicking a line seeks there.
            example: Descript / Apple Podcasts transcripts / YouTube transcript panel
  - subdimensions:
      - id: overlays
        values:
          - id: transcript-diff-beside-stage
            name: Transcript diff beside stage
            description: Reference transcript and one or more model/annotator hypotheses shown under the
              waveform with word-level difference highlighting and error scores, for auditing speech
              data or ASR output.
            example: ASR evaluation tools showing reference vs hypothesis under the clip
rationale:
  - rater: rater-2
    site: earnings-call-course-library
    text: "'lyrics-synced-to-time' covers a lyrics overlay, but not a full speaker-labelled transcript
      next to the player. That kind of transcript follows playback, lets you seek by clicking any
      line, can be searched, and lets you save segments. It is common in podcast, lecture and
      earnings-call tools."
  - rater: rater-1
    site: speech-dataset-review-space
    text: Audio clip player shows a reference transcript stacked with two model hypotheses, with
      word-level diff highlights (substitutions/insertions/deletions) and per-line WER. This is a
      review/QA overlay, not captions or synced lyrics.
