    text: Each meter-reading input is checked for plausibility against that record's history (previous
      reading, 12-month average). It returns a soft flag ("Looks normal", "Much higher than usual",
      "Lower than previous") in an adjacent column. This is not a format or required-field error,
      and none of the existing validation values describe a check against historical data.
