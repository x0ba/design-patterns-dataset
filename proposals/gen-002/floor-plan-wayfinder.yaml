id: floor-plan-wayfinder
kind: new-entry
status: open
batch: gen-002
codebookVersion: 1.0.0
name: Floor plan wayfinder
level: pattern
parent: explore-space
definition: An indoor building or room diagram, not a geographic map, that shows where things are.
  It has clickable rooms, a 'you are here' marker and pins for objects or fixtures, and is used to
  find a place inside a building.
relations:
  neighbors:
    - map-explorer
    - seat-map
    - zoomable-canvas
dimensions:
  - name: Location setting
    family: invocation
    question: How is the person's current location established?
    subdimensions:
      - id: locationSource
        name: Location source
        select: one
        values:
          - id: click-room-to-set
            name: Click room to set
            example: Cabinbook floor plan
          - id: indoor-positioning
            name: Indoor positioning
            example: Mall beacon maps
          - id: none
            name: None
rationale:
  - rater: rater-2
    site: shared-cabin-house-guide
    text: map-explorer requires a geographic pannable/zoomable map; seat-map is for selecting seats.
      Indoor floor plans with room selection and fixture pins (house guides, office maps, mall
      directories) have no fitting entry.
