# Codebook proposal (new-values) — review with: node scripts/proposals.ts show gen-002 comparison-table
id: comparison-table
kind: new-values
status: open
batch: gen-002
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: criteria
        values:
          - id: from-personal-record
            name: From the person's record
            description: The system generates the criteria rows from the person's stored data (their providers,
              medications, needs) and evaluates each item against them.
            example: "Medicaid plan selection: 'Is it covered?' rows for your doctors and inhaler"
          - id: personalized-from-user-record
            name: Personalized from the person's record
            description: Rows are generated from the person's own data on file (their providers, prescriptions,
              usage), so each person sees a different set of criteria checked against each item.
            example: Medicaid plan chooser checking your doctors and drugs against each plan
          - id: personal-needs-from-record
            name: Personal needs from record
            description: Rows are the person's own items (providers, prescriptions, etc.) pulled from their
              account or case, and each is checked against every compared item
            example: Medicaid/ACA plan choosers checking your doctors and drugs
rationale:
  - rater: rater-2
    site: public-health-plan-selection
    text: "Rows are neither vendor-fixed specs nor added by the person: the system builds them from the
      person's stored record (their doctors, prescriptions and pharmacy) and checks each against
      every item. No existing criteria value covers personalised rows taken from a record."
  - rater: rater-3
    site: public-health-plan-selection
    text: Criteria rows here are the person's own needs pulled from their record (their doctors, child's
      inhaler, pharmacy), not vendor spec rows nor rows the person adds manually. None of
      fixed-spec-rows / all-attributes / user-built-criteria describe system-personalized criteria.
  - rater: rater-1
    site: public-health-plan-selection
    text: The rows here are the person's own needs taken from their case record (named doctors, a
      medication, a pharmacy), checked against each plan. The vendor did not choose generic spec
      rows, and the user did not build the criteria.
