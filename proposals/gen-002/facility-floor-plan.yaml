id: facility-floor-plan
kind: new-entry
status: open
batch: gen-002
codebookVersion: 1.0.0
name: Facility floor plan
level: pattern
parent: explore-space
definition: A schematic plan of a building or storage space (warehouse bins, office desks, store
  shelves) where slots are shaded by an operational metric and selected or assigned, without
  ticketing or geographic semantics.
relations:
  neighbors:
    - seat-map
    - map-explorer
    - chart
dimensions:
  - name: Slot encoding
    family: encoding
    question: How is each slot's state shown?
    subdimensions:
      - id: slotEncoding
        name: Slot encoding
        select: many
        values:
          - id: metric-heat
            name: Metric heat
            description: Slots shaded by a chosen metric (fill, activity, distance)
          - id: fit-outline
            name: Fit outline
            description: Slots that can take the current item are outlined
          - id: assigned-colour
            name: Assigned colour
            description: Slots already assigned are coloured by item
rationale:
  - rater: rater-1
    site: stockroom-slotting-planner
    text: seat-map is tied to venue tickets/booking; map-explorer is geographic. Warehouse slotting,
      desk booking and planogram tools show a non-geographic facility diagram with per-slot capacity
      encoding, fit outlines and linked lists that neither entry describes.
