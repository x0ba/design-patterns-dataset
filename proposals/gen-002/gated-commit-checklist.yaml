id: gated-commit-checklist
kind: new-entry
status: open
batch: gen-002
codebookVersion: 1.0.0
name: Gated commit checklist
level: component
parent: transact
definition: A consequential commit action (lock, publish, submit) shown disabled beside a live
  checklist of the preconditions that must be met before it becomes available. Each item ticks off
  as the system detects that it is satisfied.
relations:
  neighbors:
    - confirmation
    - task-list
    - progress-indicator
dimensions:
  - name: Precondition display
    family: feedback
    question: How are unmet preconditions shown?
    subdimensions:
      - id: conditions
        name: Conditions
        select: one
        values:
          - id: counted-items
            name: Counted items
            description: Each precondition states how much remains (15 readings still to enter)
          - id: binary-checks
            name: Binary checks
            description: Each precondition is just done or not done
rationale:
  - rater: rater-3
    site: water-association-meter-readings
    text: Confirmation asks for a pause after the person acts. Task-list items are completed by the
      person. Here the system computes the preconditions, keeps the button disabled until they are
      all met, and says so ('Available once both items above are done'). No existing entry covers
      this kind of readiness gating.
