dimensions:
  - subdimensions:
      - id: logic
        values:
          - id: and-within-facet
            name: AND within facet
            description: Selecting several values in one facet requires items to have all of them, usually
              signalled by a 'match all' label
            example: Lanternloft story archive — Recurring characters 'match all'
rationale:
  - rater: rater-2
    site: family-ai-story-archive
    text: Facet groups labelled 'match all' combine checked values with AND within the facet (stories
      containing all selected characters), which none of the existing logic values describe.
  - rater: rater-3
    site: freelance-pitch-lead-search
    text: This page has a checkbox facet where ticked values combine with AND inside the facet ("Every
      box you tick must apply"). The other facets are radio buttons that allow one value each. No
      current logic value covers AND within a facet or a mix of logics across facets.
