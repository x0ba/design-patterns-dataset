id: what-if-scenario
kind: new-entry
status: open
batch: gen-002
codebookVersion: 1.0.0
name: What-if scenario
level: pattern
parent: analyze
definition: A proposed change to the current plan, shown with its projected effect next to the
  status quo. The person can preview it in the live plan, then adopt it or drop it.
relations:
  neighbors:
    - chart
    - coordinated-views
    - comparison-table
dimensions:
  - name: Scenario origin
    family: initiative
    question: Who proposes the scenario?
    subdimensions:
      - id: origin
        name: Origin
        select: one
        values:
          - id: system-suggested
            name: System-suggested
            description: The system proposes the scenario
          - id: person-authored
            name: Person-authored
            description: The person sets up the scenario's parameters
  - name: Preview
    family: feedback
    question: How does a person see the scenario's effect?
    subdimensions:
      - id: preview
        name: Preview
        select: one
        values:
          - id: side-by-side-numbers
            name: Side-by-side numbers only
          - id: toggle-into-live-plan
            name: Toggle into live plan
            description: Scenario is applied provisionally across all views
rationale:
  - rater: rater-3
    site: stockroom-slotting-planner
    text: This planner has a 'What-if' card that suggests moving fertilizer to the back wall. It
      compares the baseline with the proposal (9.8 mi vs 5.6 mi), lists the payoff (4.3 mi saved, 8
      wks to pay back) and has a 'Preview in plan' toggle that redraws the map, the list and the
      totals. No existing entry fits. Chart covers only the encoding, coordinated-views covers only
      the linking, and undo and confirmation do not cover trying out a hypothetical.
