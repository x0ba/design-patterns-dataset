# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 desktop-window-manager
id: desktop-window-manager
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Desktop window manager
level: pattern
parent: navigate
definition: A desktop metaphor in which several applications open as overlapping, movable windows
  with title bars and close/minimize/maximize controls, launched from a dock or taskbar, over a
  wallpaper with desktop file icons.
relations:
  neighbors:
    - app-shell
    - split-pane
dimensions:
  - name: Window arrangement
    family: layout
    question: How are app windows arranged?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: overlapping-floating
            name: Overlapping floating windows
            example: macOS
          - id: tiling
            name: Tiling
            example: i3
          - id: single-fullscreen
            name: One full-screen app at a time
            example: iPadOS
      - id: launcher
        name: Launcher
        select: one
        values:
          - id: dock
            name: Dock
            example: macOS Dock
          - id: taskbar-start-menu
            name: Taskbar with start menu
            example: Windows
          - id: desktop-icons-only
            name: Desktop icons only
            example: Windows 93
rationale:
  - rater: rater-3
    site: aurora-os-js--mail-reading
    text: app-shell describes the frame around one app's content; it has no values for overlapping
      multi-app windows, window chrome (traffic lights), z-order/focus, or desktop icons. Web-based
      OS simulations (Aurora OS.js, daedalOS, Windows 93) and VDI clients use this pattern.
