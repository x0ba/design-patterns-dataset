dimensions:
  - subdimensions:
      - id: position
        values:
          - id: top-centre
            name: Top centre
            description: Toast drops in at the top centre edge of the viewport
            example: MiroTalk — 'Priya Raman started a poll'
rationale:
  - rater: rater-2
    site: mirotalk--room-settings
    text: Toast anchored at top centre of the viewport (event notification) — no top-centre value
      exists; only top-right stack, bottom-centre, centre overlay.
  - rater: rater-1
    site: mirotalk--room-settings
    text: Toast appears pinned to the top centre of the viewport (SweetAlert2 'top' toast), overlapping
      the top edge of an open modal. Existing position values cover bottom/top-right/centre only;
      there is no top-centre option.
  - rater: rater-3
    site: mirotalk--room-settings
    text: Toast drops in at the top centre of the viewport. Existing position values cover the bottom,
      top-right, near-control and centre positions, but not top centre.
  - rater: rater-2
    site: mirotalk--meeting-grid
    text: "The toast is pinned at the top centre of the viewport. None of the position values cover
      top-centre: they are bottom, top-right stack, near-control and centre overlay."
  - rater: rater-3
    site: mirotalk--meeting-grid
    text: Toast is anchored at the top centre of the viewport, which none of the position values
      describe (top-right stack, bottom-*, centre-overlay).
  - rater: rater-1
    site: mirotalk--meeting-grid
    text: "The toast here slides in at the top centre of the viewport, the way SweetAlert2 toasts do.
      None of the existing position values cover that spot: bottom-centre, top-right-stack and the
      centre overlays are all somewhere else."
  - rater: rater-3
    site: mirotalk--polls-panel
    text: Toast is anchored to the top edge, horizontally centred over the content
      (MiroTalk/SweetAlert-style toast). None of the existing position values covers top-centre.
  - rater: rater-1
    site: mirotalk--polls-panel
    text: Toast is pinned to the top edge at horizontal centre (SweetAlert2 'top' toast in MiroTalk). No
      existing position value covers top-centre.
