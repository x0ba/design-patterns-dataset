# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 poll
id: poll
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Poll
level: component
parent: communicate
definition: A question posed to a group with a fixed set of options, where participants vote and
  live tallies (percent, counts, voter names) are shown inline per option, often inside a chat, call
  or post.
aliases:
  - survey question
  - quick poll
  - vote
relations:
  uses:
    - choice-control
    - chart
    - card
  neighbors:
    - reactions
    - availability-picker
dimensions:
  - name: Results visibility
    family: feedback
    question: When and how are tallies shown?
    subdimensions:
      - id: results
        name: Results
        select: one
        values:
          - id: inline-bars-always
            name: Inline bars always
            description: Fill bars and percentages shown on each option before and after voting
            example: MiroTalk polls
          - id: after-voting
            name: After voting
            example: Twitter/X polls
          - id: after-close
            name: After poll closes
  - name: Voter identity
    family: scope
    question: Are voters visible?
    subdimensions:
      - id: identity
        name: Identity
        select: one
        values:
          - id: anonymous
            name: Anonymous
          - id: named-voters
            name: Named voters
            description: Names listed under each option
            example: Slack Polly, MiroTalk
rationale:
  - rater: rater-2
    site: mirotalk--meeting-grid
    text: Choice-control covers picking an option but not the social tally layer (aggregate result bars,
      vote counts, anonymous vs named voters, author, poll creation). availability-picker mentions
      polling only for time slots. Polls are a common side channel in video calls, chats and social
      posts.
