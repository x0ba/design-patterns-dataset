# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 empty-state
id: empty-state
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: cause
        values:
          - id: no-selection
            name: No selection
            description: A detail or reading pane is empty until an item in the list is selected
            example: "Outlook: 'Select an item to read'"
          - id: nothing-selected
            name: Nothing selected
            description: A detail pane is empty until the person picks an item from the overview beside it
            example: MailDev — 'Select an email to view'
rationale:
  - rater: rater-2
    site: aurora-os-js--finder-documents
    text: The detail pane of a master–detail view is empty because nothing is selected yet. That isn't
      first-use, no-results, cleared or an error.
  - rater: rater-1
    site: maildev--command-palette
    text: The detail pane of a list–detail app (mail clients, MailDev, Outlook) is empty because nothing
      is selected yet. It is not first use, there are no failed results, nothing has been cleared,
      and there is no error.
