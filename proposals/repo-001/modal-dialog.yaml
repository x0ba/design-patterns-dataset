# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 modal-dialog
id: modal-dialog
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: purpose
        values:
          - id: help-or-instructions
            name: Help or instructions
            description: The dialog holds static guidance — a quick-start summary, keyboard shortcuts or a
              how-to — that the person reads and then dismisses; no input or decision is required.
            example: Motion Previs Studio — Quick Start dialog; Gmail keyboard shortcuts overlay
          - id: collection-management
            name: Collection management
            description: A list or grid of items each with its own action (remove, unfollow, revoke) managed in
              place inside the dialog
            example: Instagram — Following list with Unfollow buttons
rationale:
  - rater: rater-1
    site: motion-previs-studio--quick-start-help
    text: "This Quick Start dialog only holds help content: six numbered how-to step cards, with no
      form, choice, confirmation, media or multi-step progression. None of the existing purpose
      values (confirmation, form, detail-view, media, multi-step-task, selection-list) describe a
      modal whose job is to explain how to use the product. It opens on first load and can be
      reopened from the Help button."
  - rater: rater-3
    site: igdm--not-following-back
    text: Full-screen overlay listing all followed accounts with a per-item Unfollow button; it is
      neither a confirmation, form, detail view, media, multi-step task nor a pick-one selection
      list — it is a list for managing relationships item by item.
