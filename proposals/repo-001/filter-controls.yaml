# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 filter-controls
id: filter-controls
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: placement
        values:
          - id: floating-overlay-panel
            name: Floating overlay panel
            description: A persistent, collapsible filter panel floating over the canvas/map it filters
            example: Map layer panels in GIS/ops consoles
          - id: on-summary-tiles
            name: On summary tiles
            description: Filter toggles live on the KPI/summary tiles above the collection; activating a tile
              filters the list to that segment
            example: DumbBudget Income/Expenses filter icons
          - id: embedded-in-summary-tiles
            name: Embedded in summary tiles
            description: Filter toggles live inside KPI/summary tiles above the collection; activating one
              narrows the list to that category
            example: DumbBudget — Income/Expenses tiles with funnel toggles
          - id: inline-select-bar
            name: Inline select bar
            description: A row of labelled dropdown selects (plus Apply) sitting above the collection, without
              chips
            example: Shopify-style small admin order lists
          - id: inline-dropdown-bar
            name: Inline dropdown bar
            description: A row of labelled select dropdowns (one per attribute) placed above the collection,
              usually submitted with an Apply button
            example: Shopify-style admin order list filters
          - id: toolbar-dropdown
            name: Toolbar dropdown
            description: A single select/dropdown above the collection picks one filter value directly
            example: Podgrab — tag filter select
rationale:
  - rater: rater-2
    site: palantir-for-family-trips--command-center
    text: Filter chip groups live in a persistent, collapsible panel floating over a map canvas — not a
      sidebar, chip bar, modal, column header or toolbar popover.
  - rater: rater-1
    site: dumbbudget--dashboard
    text: Filter toggles are built into summary stat tiles (a funnel icon next to 'Income'/'Expenses'
      narrows the list to that type), so the filter lives on the KPI rather than in a sidebar, bar,
      sheet, header or popover.
  - rater: rater-2
    site: dumbbudget--dashboard
    text: The type filters are funnel toggle buttons built into the summary stat tiles (Income /
      Expenses), so the tile you read is also the filter you click. None of sidebar, chip bar,
      modal, column header or toolbar popover describes this.
  - rater: rater-1
    site: dumbbudget--edit-transaction
    text: The type filter is a funnel toggle inside each summary stat tile (Income / Expenses), so the
      metric tile is also the filter. None of the existing placement values (sidebar, chip bar,
      modal, column header, toolbar popover) describes this.
  - rater: rater-3
    site: minshop--orders-list
    text: Admin list pages often put a row of labelled native dropdown selects with an Apply button
      above the table. This has no chips, sidebar, popover or column-header filters, so none of the
      existing placement values fits.
  - rater: rater-2
    site: minshop--orders-list
    text: Admin list pages often put a row of labelled native dropdown selects plus an Apply button
      above the table. There are no chips, sidebar, sheet, header filters or popover, so none of the
      existing placement values fit.
  - rater: rater-3
    site: podgrab--podcasts-home
    text: Many simple apps filter a collection with one native dropdown select in a toolbar above the
      list (e.g. Podgrab tag filter 'All / Tech (4) / ...'); none of the placement values (sidebar,
      chips, modal, column header, toolbar popover) describe it.
  - rater: rater-2
    site: podgrab--podcasts-home
    text: This filter is one native single-select dropdown sitting in a toolbar row above the list. It
      has no chips, sidebar, modal or popover, so none of the existing placement values fit.
  - rater: rater-1
    site: podgrab--all-episodes
    text: Filters are an always-inline bar of dropdown selects above the list (no chips, sidebar, sheet
      or popover), shown/hidden by a full-width toggle button. filter-bar-with-chips is the closest
      fit, but it implies chips.
