codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: inputType
        values:
          - id: segmented-code
            name: Segmented code
            description: A short code entered across a row of single-character boxes, each accepting one
              constrained character (e.g., digits only); filling one moves focus to the next.
            example: ZestSend 4-digit connection code; SMS OTP inputs
rationale:
  - rater: rater-1
    site: zestsend--home
    text: One-time-code / PIN entry is often drawn as a row of single-character boxes. Each box takes
      one digit and rejects letters. None of the inputType values (masked-format,
      specialized-keyboard) describes a code split into separate per-character fields.
