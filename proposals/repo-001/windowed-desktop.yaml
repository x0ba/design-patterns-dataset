# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 windowed-desktop
id: windowed-desktop
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Windowed desktop
level: pattern
parent: navigate
definition: A desktop metaphor in which several applications open as movable, overlapping windows
  with title bars and window controls, over a wallpaper that holds file icons. A dock or taskbar
  launches and switches apps, and a global menu bar or tray sits at the edge.
aliases:
  - web desktop
  - window manager
  - browser OS
  - desktop environment
relations:
  neighbors:
    - app-shell
    - zoomable-canvas
  uses:
    - menu
    - badge
    - notification-center
    - file-manager
dimensions:
  - name: Window arrangement
    family: layout
    question: How do app windows share the screen?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: overlapping-free
            name: Overlapping free windows
            example: macOS, Aurora OS.js
          - id: tiling
            name: Tiling
            example: i3, Windows Snap layouts
          - id: single-maximized
            name: Single maximized
            example: iPadOS full-screen apps
  - name: Launcher
    family: invocation
    question: How are apps launched and switched?
    subdimensions:
      - id: launcher
        name: Launcher
        select: one
        values:
          - id: dock
            name: Dock
            example: macOS Dock
          - id: taskbar
            name: Taskbar
            example: Windows taskbar
          - id: start-menu
            name: Start menu
            example: Windows Start
rationale:
  - rater: rater-2
    site: aurora-os-js--finder-documents
    text: app-shell describes one app's persistent frame. It doesn't cover several overlapping app
      windows with z-order, close/minimise/zoom controls, desktop file icons and a dock with
      running-app indicators, which is the defining structure of web OS simulations (Aurora OS.js,
      daedalOS, Puter).
