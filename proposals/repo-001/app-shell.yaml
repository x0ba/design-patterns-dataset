# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 app-shell
id: app-shell
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: structure
        values:
          - id: windowed-desktop
            name: Windowed desktop
            description: Several apps open at once in overlapping, movable/closable windows over a desktop, with
              a global menu bar that follows the focused window and a dock/taskbar launcher.
            example: macOS Finder + Dock; Aurora OS.js; Windows taskbar
  - subdimensions:
      - id: primary
        values:
          - id: dock
            name: Dock / taskbar launcher
            description: A strip of app icons that launches or focuses apps, with running indicators, rather
              than navigating destinations of one app.
            example: macOS Dock
rationale:
  - rater: rater-3
    site: aurora-os-js--finder-documents
    text: Web-based desktop OS simulations (and real desktop environments) hold several independent apps
      in overlapping, movable windows, with a global menu bar and an app dock. None of the structure
      values (single-app, multi-workspace-rail, mini-apps-inside-an-app, document-tabs) describes
      overlapping windowed multitasking. The primary nav is also a launcher dock, not quite a
      navigation rail.
  - rater: rater-1
    site: aurora-os-js--finder-documents
    text: "A web-based desktop OS simulation: global menu bar, a dock that launches several apps,
      desktop file icons, and overlapping draggable app windows (Finder, Mail) with traffic-light
      controls. None of single-app / multi-workspace-rail / mini-apps / document-tabs describes a
      windowed desktop with many overlapping app windows."
