# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 game-hud
id: game-hud
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Game HUD / turn-order queue
level: pattern
parent: monitor
definition: "The heads-up display around a live game stage: a turn-order queue of unit portraits,
  the active unit's ability bar, resource meters, player stat panel, and floating combat text over
  the play field."
dimensions:
  - name: Turn order
    family: layout
    question: How is upcoming action order shown?
    subdimensions:
      - id: turn-order
        name: Turn order
        select: one
        values:
          - id: portrait-queue
            name: Portrait queue
            description: Row of unit portraits in initiative order with round separators
            example: Ancient Beast
          - id: none
            name: None
            description: Real-time, no queue
  - name: Combat feedback
    family: feedback
    question: How are action outcomes shown?
    subdimensions:
      - id: feedback
        name: Combat feedback
        select: many
        values:
          - id: floating-text
            name: Floating text
            description: Damage numbers and effect names float over units
          - id: log-line
            name: Log line
            description: Latest event printed in a collapsed combat log
rationale:
  - rater: rater-1
    site: ancientbeast--battlefield
    text: There is no codebook entry for game interfaces. The turn-order portrait queue with status
      captions, the floating combat text and the resource meters don't fit dashboard, status-tracker
      or toast.
sources:
