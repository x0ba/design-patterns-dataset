id: ribbon-toolbar
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Ribbon / command toolbar
level: component
parent: navigate
definition: A persistent strip of command buttons, often large icon-over-label, sorted into
  captioned groups and paged by tabs (Office-style ribbon), used to run commands on the current
  document.
aliases:
  - ribbon
  - toolbar
  - command bar
relations:
  uses:
    - tabs
    - menu
  neighbors:
    - command-palette
    - app-shell
dimensions:
  - name: Layout
    family: layout
    question: How are commands arranged?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: single-row-toolbar
            name: Single-row toolbar
            example: Google Docs toolbar
          - id: tabbed-ribbon-with-groups
            name: Tabbed ribbon with captioned groups
            example: Microsoft Office ribbon
          - id: floating-toolbar
            name: Floating toolbar
            example: Medium selection toolbar
rationale:
  - rater: rater-3
    site: dbdesigner-id--erd-canvas
    text: The codebook has tabs and app-shell but no entry for a command toolbar or ribbon. Here the
      ribbon's command groups (Table, Export, Page, Feedback, each with a caption label) can't be
      coded with any existing entry. The command palette is keyboard-summoned and menus are
      transient, so neither fits.
