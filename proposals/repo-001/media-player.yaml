# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 media-player
id: media-player
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: mode
        values:
          - id: docked-persistent-bar
            name: Docked persistent bar
            description: A full-width transport bar pinned to the bottom (or top) edge of the app shell,
              persisting across views while the person browses the library.
            example: Spotify desktop now-playing bar; LRCGET bottom player
          - id: persistent-docked-bar
            name: Persistent docked bar
            description: A now-playing transport bar docked to an edge of the app shell that stays in place
              across navigation
            example: Spotify desktop bottom player bar
          - id: docked-bar
            name: Docked persistent bar
            description: Full-width transport bar pinned to the bottom (or top) edge of the app shell that
              persists across navigation, with no stage of its own.
            example: Spotify desktop now-playing bar; LRCGET bottom player
rationale:
  - rater: rater-1
    site: lrcget--tracks
    text: Audio-only library apps (LRCGET, Spotify web, Apple Music) dock a full-width transport bar to
      the bottom of the app window. It stays there while the person browses the library. It has no
      stage, and it isn't an inline embed, a PiP or a standalone window.
  - rater: rater-3
    site: splayer-next--home
    text: Music apps (Spotify desktop, Apple Music, SPlayer) dock a persistent now-playing transport bar
      at the bottom of the app shell that stays put while content navigates. It isn't inline,
      mini/PiP or a standalone window.
  - rater: rater-3
    site: lrcget--album-detail
    text: A full-width transport bar fixed to the bottom of an app window that stays put while the
      person browses library views above it. It isn't an inline embed, a mini/PiP window floating
      over content, or a fullscreen/theater player. It's a docked "now playing" bar that is part of
      the app shell.
