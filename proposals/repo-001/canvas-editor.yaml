# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 canvas-editor
id: canvas-editor
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: canvas
        values:
          - id: 3d-scene
            name: 3D scene
            description: Objects placed in a 3D scene viewport with a grid floor, camera orbit and transform
              gizmos
            example: Blockbench, Spline
          - id: 3d-scene-stage
            name: 3D scene stage
            description: Objects are arranged on a perspective 3D ground plane and moved or rotated with gizmos
            example: Previs/blocking tools (Blockout, Cinetracer)
rationale:
  - rater: rater-3
    site: blockbench--edit-mode
    text: 3D modelling editors (Blockbench, Blender, Spline) arrange objects in a 3D scene with gizmos
      and an outliner; no canvas value describes a 3D scene.
  - rater: rater-1
    site: blockout--stage
    text: This canvas is a 3D stage, not a 2D plane. People place library objects such as people, cars
      and props on a floor grid in perspective, move and rotate them with gizmo tools, and frame the
      view with camera marks. The existing canvas values (infinite, frames, fixed page, slides) only
      describe 2D spaces.
