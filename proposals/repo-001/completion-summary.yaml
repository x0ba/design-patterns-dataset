# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 completion-summary
id: completion-summary
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Completion summary / results screen
level: pattern
parent: guide
definition: "A post-task screen that declares an activity finished and reports how it went: an
  earned performance tier or score (read-only stars, grade, XP), qualitative feedback, and next-step
  actions (return, retry, continue)."
aliases:
  - results screen
  - level complete
  - score summary
  - achievement screen
dimensions:
  - name: Score
    family: encoding
    question: How is performance shown?
    subdimensions:
      - id: score-encoding
        name: Score encoding
        select: one
        values:
          - id: tier-ladder
            name: Tier ladder
            description: All tiers shown, achieved one highlighted
          - id: numeric-score
            name: Numeric score
          - id: stars-earned
            name: Stars earned only
  - name: Next step
    family: invocation
    question: What can the person do next?
    subdimensions:
      - id: next-actions
        name: Next actions
        select: many
        values:
          - id: return-to-list
            name: Return to list
          - id: retry
            name: Retry
          - id: continue
            name: Continue to next
  - name: Outcome
    family: content
    question: How is the result and feedback expressed?
    subdimensions:
      - id: outcome
        name: Outcome
        select: one
        values:
          - id: tier-stars
            name: Tiered stars/levels
            example: 1-3 stars with named levels
          - id: numeric-score
            name: Numeric score
            example: Quiz 8/10
          - id: pass-fail
            name: Pass/fail
            example: Exam result
      - id: feedback
        name: Feedback
        select: one
        values:
          - id: none
            name: None
          - id: bullet-coaching
            name: Bulleted coaching notes
          - id: item-review
            name: Per-item review
          - id: bullet-list
            name: Bullet list of comments
          - id: per-item-review
            name: Per-item review
      - id: score-form
        name: Score form
        select: one
        values:
          - id: tier-stars
            name: Tier with stars
            description: Named tiers shown side by side, earned one highlighted
          - id: numeric-score
            name: Numeric score
          - id: pass-fail
            name: Pass/fail
rationale:
  - rater: rater-2
    site: immersive-language-learning-with-live-ap--mission-summary
    text: Rating is an input; stat-tile is a dashboard metric. Neither captures a read-only earned tier
      display plus coaching feedback after a lesson/game mission.
  - rater: rater-3
    site: immersive-language-learning-with-live-ap--mission-summary
    text: Rating is an input; stat-tile is a dashboard KPI; status-tracker is about an ongoing process.
      None describes a post-completion outcome screen with an awarded tier (1–3 stars with named
      levels) plus coaching feedback, common in learning apps and games (Duolingo lesson complete,
      game level-clear).
  - rater: rater-1
    site: immersive-language-learning-with-live-ap--mission-summary
    text: Rating is an input for user preference; stat-tile is a KPI number. A system-awarded tier
      display (Tiro/Proficiens/Peritus with 1-3 stars, current one highlighted) plus a feedback list
      and a return CTA has no entry. Common in language-learning (Duolingo lesson complete), games,
      quizzes.
