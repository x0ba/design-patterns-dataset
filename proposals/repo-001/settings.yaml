# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 settings
id: settings
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: discovery
        values:
          - id: user-pinned-settings
            name: User-pinned settings
            description: Each setting row can be pinned to the top by the person so frequently used options are
              found first
            example: Poznote settings — Pin to top on each row
  - subdimensions:
      - id: controls
        values:
          - id: key-binding-capture
            name: Key binding capture
            description: A list of commands with their current key chord and a Rebind control that records a new
              shortcut
            example: VS Code Keyboard Shortcuts; ApiArk settings
rationale:
  - rater: rater-2
    site: poznote--settings
    text: Every settings row has a 'Pin to top' button, so a person can promote the settings they use
      most. None of the existing discovery values (browse, search, deep link, suggested, natural
      language) describes settings the person pins themselves.
  - rater: rater-1
    site: apiark--settings
    text: Settings catalogs in developer tools often include a keyboard-shortcut binding table (action,
      current key chord shown as kbd keys, Rebind button, Unbound state, Reset to Defaults). None of
      the controls values (toggles, selects, numeric, text, nested objects, permissions) describe
      key-chord capture.
