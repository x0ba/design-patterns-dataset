# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 quantity-stepper
id: quantity-stepper
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Quantity stepper
level: component
parent: enter-data
definition: A compact numeric control with − and + buttons around a current value, used to adjust a
  small integer such as item quantity in a cart.
aliases:
  - number stepper
  - spin button
  - increment/decrement control
relations:
  neighbors:
    - slider
    - choice-control
    - text-field
dimensions:
  - name: Value entry
    family: invocation
    question: How is the value changed?
    subdimensions:
      - id: entry
        name: Entry
        select: one
        values:
          - id: buttons-only
            name: Buttons only
            example: Shop.co cart quantity
          - id: buttons-and-typing
            name: Buttons and typing
            example: HTML number input
  - name: Zero behavior
    family: lifecycle
    question: What happens at the minimum?
    subdimensions:
      - id: minimum
        name: Minimum
        select: one
        values:
          - id: disabled-at-min
            name: Disabled at minimum
          - id: removes-item
            name: Removes item at zero
          - id: becomes-remove
            name: Minus becomes remove/trash
          - id: disabled-decrement
            name: Decrement disabled
          - id: no-limit-feedback
            name: No feedback
rationale:
  - rater: rater-2
    site: next-ecommerce-shopco--cart
    text: Cart line items use a pill-shaped "− 2 +" control. slider, choice-control and text-field don't
      describe a discrete increment/decrement control, and stepper is a navigation trail.
  - rater: rater-1
    site: next-ecommerce-shopco--cart
    text: Choice-control, slider and text-field don't describe a −/value/+ increment control. In this
      cart, each line item uses one to edit its quantity in place.
  - rater: rater-3
    site: next-ecommerce-shopco--cart
    text: Cart line items use a pill with − value + buttons. Slider (drag along a track), choice-control
      (pick from a set of options), text-field and inline-edit (click to edit a displayed value) all
      fail to describe a discrete increment/decrement spinner, and this control is very common in
      commerce and booking UIs.
