# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 simulation-time-control
id: simulation-time-control
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Simulation time control
level: component
parent: explore-space
definition: "A transport dock that drives the clock of a live or simulated data view (map, model,
  dashboard): play/pause, speed multipliers, jump-to-now, and a scrubber over the day or period,
  often with a data-density histogram behind the track. Unlike media-player, it isn't playing a
  recorded audio or video file; it animates the state of the data view over time."
relations:
  neighbors:
    - media-player
    - slider
    - chart
  uses:
    - slider
    - choice-control
    - chart
dimensions:
  - name: Transport
    family: invocation
    question: Which time controls are offered?
    subdimensions:
      - id: controls
        name: Controls
        select: many
        values:
          - id: play-pause
            name: Play/pause
          - id: speed-multipliers
            name: Speed multipliers
          - id: jump-to-now
            name: Jump to now / live
          - id: scrubber
            name: Scrubber over period
          - id: density-histogram
            name: Density histogram behind scrubber
rationale:
  - rater: rater-3
    site: mini-macau--transit-map
    text: media-player is defined around video/audio stages; chart+slider together describe the parts
      but not the transport role. Transit simulators, weather radar loops, and historical replay
      maps all share this dock.
