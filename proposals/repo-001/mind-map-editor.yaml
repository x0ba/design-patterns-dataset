id: mind-map-editor
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Mind map / outline diagram editor
level: pattern
parent: create
definition: Authoring a radial or tree-shaped diagram whose layout comes automatically from
  parent-child structure, edited with keyboard (Tab = child, Enter = sibling). It often switches
  into an outline view of the same tree.
relations:
  neighbors:
    - canvas-editor
    - node-editor
    - tree-view
    - zoomable-canvas
dimensions:
  - name: Layout shape
    family: layout
    question: How is the tree drawn?
    subdimensions:
      - id: layoutShape
        name: Layout shape
        select: one
        values:
          - id: radial
            name: Radial
          - id: right-branching
            name: Right-branching (logic chart)
            example: EdgeEver Map shape
          - id: org-chart
            name: Org chart / top-down
rationale:
  - rater: rater-2
    site: edgeever--mind-map-editor
    text: canvas-editor assumes objects are placed freely, and node-editor assumes typed ports and
      dataflow. A mind map is an authored hierarchy that is laid out automatically, which neither
      entry describes well.
