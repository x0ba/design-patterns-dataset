# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 layer-stack-panel
id: layer-stack-panel
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Layer stack panel
level: component
parent: explore-space
definition: A list of the data layers drawn on a spatial view (base imagery and overlays), each row
  with a legend swatch, a visibility toggle, a style/settings button and a remove button, plus
  add-layer controls.
aliases:
  - layer list
  - layers panel
  - table of contents (GIS)
  - stack
relations:
  neighbors:
    - filter-controls
    - property-inspector
  uses:
    - choice-control
dimensions:
  - name: Row controls
    family: content
    question: What can be done per layer?
    subdimensions:
      - id: rowActions
        name: Row actions
        select: many
        values:
          - id: visibility-toggle
            name: Visibility toggle
          - id: style-settings
            name: Style settings
          - id: remove
            name: Remove
          - id: opacity-blend
            name: Opacity / blend
          - id: source-swap-select
            name: Source swap select
          - id: download-export
            name: Download / export
  - name: Grouping
    family: composition
    question: How are layers organized?
    subdimensions:
      - id: grouping
        name: Grouping
        select: one
        values:
          - id: flat
            name: Flat list
          - id: by-layer-kind
            name: Grouped by kind (imagery vs overlays)
          - id: nested-tree
            name: Nested tree
rationale:
  - rater: rater-1
    site: aladin-lite--layer-stack
    text: GIS and sky viewers (QGIS, ArcGIS, Mapbox Studio, Aladin) all have a layer manager. The
      codebook only has map-explorer overlay dims and the generic popover/drawer entries, and none
      of them cover per-layer visibility, style, removal and ordering of imagery plus overlay
      layers.
