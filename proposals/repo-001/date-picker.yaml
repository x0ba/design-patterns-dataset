# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 date-picker
id: date-picker
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: selection
        values:
          - id: month-or-period
            name: Month or period
            description: The unit chosen is a whole month (or quarter/year) from a grid of months, used to scope
              reports or budgets.
            example: MyFin Budget dashboard month picker; MUI DatePicker views=['month','year']
          - id: month
            name: Month
            description: Chooses a month and year rather than a specific day, typically from a 3x4 month grid
            example: MyFin Budget dashboard month filter
  - subdimensions:
      - id: annotations
        values:
          - id: per-day-metric-or-progress
            name: Per-day metric or progress
            description: Each day shows a logged value or goal progress (calories, steps, completion bar)
              summarising that day's data
            example: MyFitnessPal / NutriTrace week strip with daily kcal and progress bars
          - id: per-day-metric-value
            name: Per-day metric value
            description: Each day shows a logged quantity (e.g. kcal total) and/or a mini progress bar toward a
              daily goal
            example: NutriTrace / MyFitnessPal week strip
          - id: metric-per-day
            name: Metric per day
            description: Each day shows a logged value or goal progress (kcal total, steps, mini progress bar)
            example: NutriTrace / MyFitnessPal diary week strip
          - id: per-day-metric
            name: Per-day metric
            description: Each day shows a logged value or goal progress for that day (e.g. kcal total with a
              mini bar)
            example: NutriTrace diary week strip
          - id: per-day-totals
            name: Per-day totals or progress
            description: Each day shows a logged metric total and/or goal progress bar
            example: MyFitnessPal-style diary week strip
          - id: per-day-metric-summary
            name: Per-day metric summary
            description: Each day carries a summary of the person's own logged data for it — a total and/or a
              mini progress bar toward a daily goal.
            example: Nutrition diary week strip showing kcal and goal bar under each day
rationale:
  - rater: rater-1
    site: myfin--dashboard
    text: The picker chooses a whole month (month grid Jan–Dec with year dropdown), not a single day,
      range or date-time. None of the selection values describes month/period granularity.
  - rater: rater-3
    site: myfin--dashboard
    text: Month-granularity pickers (pick a month+year from a month grid) are common in
      finance/reporting dashboards; single-date/range don't capture coarser granularity.
  - rater: rater-2
    site: nutritrace--diary
    text: Week-strip day picker shows each day's logged total (kcal) and a mini goal-progress bar under
      the date. That's a per-day summary metric, not busy, price, holiday or unavailability.
  - rater: rater-1
    site: nutritrace--diary
    text: Tracker apps annotate each day in a week strip with that day's logged metric and progress
      toward a goal; none of none/unavailable/price/busy/holidays fit.
  - rater: rater-3
    site: nutritrace--diary
    text: Week strips in tracking apps annotate each day with a logged metric (calorie total) and a
      goal-progress bar. This is not price, busy, holiday or unavailable.
  - rater: rater-2
    site: nutritrace--statistics
    text: Tracker apps show the day's logged metric (kcal, steps) and a goal-progress bar on each day in
      a week strip; none of the existing annotation values (price, busy, holidays, unavailable)
      describe that.
  - rater: rater-1
    site: nutritrace--statistics
    text: Week strip days in tracking apps carry a per-day logged total and goal progress bar; none of
      the existing annotation values (busy, price, holidays, unavailable) cover it.
  - rater: rater-3
    site: nutritrace--statistics
    text: Each day in the week strip shows the user's own logged total for that day (kcal number plus a
      goal-progress bar coloured by status). None of the listed annotations (price, busy, holidays,
      unavailable) describes per-day personal metric summaries.
