# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 bulk-actions
id: bulk-actions
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: surface
        values:
          - id: detail-panel-swap
            name: Detail panel swap
            description: The detail panel docked below or beside the collection changes into a multi-selection
              panel that lists the bulk actions.
            example: Fluent Reader — Sources settings, 'Selected multiple sources' with Delete source
          - id: below-collection-panel
            name: Below-collection panel
            description: The detail panel stacked under the list/table switches to bulk actions when multiple
              items are selected
            example: Fluent Reader — Settings > Sources multi-select delete
rationale:
  - rater: rater-1
    site: fluent-reader--settings-sources
    text: In Fluent Reader, selecting several rows swaps the single-item detail panel under the table
      for a "Selected multiple sources" panel that holds the bulk action. It is not a toolbar that
      replaces the header, a floating bar, a context menu or a side panel.
  - rater: rater-2
    site: fluent-reader--settings-sources
    text: "Bulk actions appear in the detail area stacked below the collection, which replaces the
      single-item detail when several items are selected. None of the existing surfaces fit: it
      isn't a side panel, a toolbar or a floating bar."
