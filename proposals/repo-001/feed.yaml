# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 feed
id: feed
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: arrangement
        values:
          - id: uniform-grid
            name: Uniform grid
            description: One feed flowed into a grid of equal-size tiles across several columns, read row by row
            example: YouTube — Subscriptions
rationale:
  - rater: rater-2
    site: vidbee--subscriptions
    text: Feed arrangement only offers single-column, multi-column (several feeds side by side), masonry
      and vertical pager. A single chronological feed laid out as an equal-size multi-column card
      grid (YouTube Subscriptions style) fits none of them.
  - rater: rater-1
    site: fluent-reader--all-articles-cards
    text: Feed items laid out in a fixed-size uniform grid (equal-height cards in rows) — not masonry
      (variable heights), not single column, not multiple feeds side by side.
  - rater: rater-2
    site: fluent-reader--all-articles-cards
    text: Feed arrangement has no value for a feed laid out as a grid of equal, fixed-size tiles.
      Masonry means tiles of different heights, and multi-column means several separate feeds side
      by side.
