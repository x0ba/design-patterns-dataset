batch: repo-001
codebookVersion: 1.0.0
name: Streak and milestone badges
level: component
parent: monitor
definition: A gamified record of consecutive activity (a streak count, best streak, freezes) shown
  with a ladder of milestone badges marked reached or locked, plus progress toward the next one.
aliases:
  - streak counter
  - achievements
  - milestone badges
  - levels
relations:
  neighbors:
    - badge
    - progress-indicator
    - stat-tile
dimensions:
  - name: Forgiveness
    family: lifecycle
    question: How are missed periods handled?
    subdimensions:
      - id: forgiveness
        name: Forgiveness
        select: one
        values:
          - id: strict-reset
            name: Strict reset
          - id: freezes
            name: Freezes / repair tokens
            example: Duolingo streak freeze
          - id: excused-periods
            name: Excused periods (sick, travel)
  - name: Milestones
    family: content
    question: How are milestones shown?
    subdimensions:
      - id: milestones
        name: Milestones
        select: many
        values:
          - id: badge-ladder
            name: Badge ladder reached/locked
          - id: next-milestone-bar
            name: Progress bar to next milestone
          - id: levels-xp
            name: Levels and points
rationale:
  - rater: rater-2
    site: opengym--stats-lifts
    text: The codebook's badge means a count/status indicator on a host element, and status-tracker
      means a process's stages. Neither covers motivational streaks with earned/locked milestone
      medals, streak freezes and XP levels.
