# Codebook proposal (new-values) — review with: node scripts/proposals.ts show repo-001 view-switcher
id: view-switcher
kind: new-values
status: open
batch: repo-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: form
        values:
          - id: cycle-button
            name: Cycle button
            description: A single icon button that steps to the next view on each click; its icon and tooltip
              show the current view
            example: Feishin album library toolbar
  - subdimensions:
      - id: views
        values:
          - id: raw-text
            name: Raw text / source
            description: The same collection shown as editable plain text (e.g. key=value lines, JSON, markdown
              source)
            example: Rapid / iD editor — Tags list vs text view
rationale:
  - rater: rater-1
    site: feishin--albums
    text: Feishin uses one icon button that cycles through Grid -> Detail -> Table views on each click,
      with a tooltip naming the current view. This is neither an icon toggle group (all options
      visible at once) nor a dropdown.
  - rater: rater-2
    site: rapid--feature-inspector
    text: Rapid/iD tag editor lets you switch between a structured key–value list and a raw plain-text
      view (key=value per line) of the same tags. None of the listed views covers a raw text/source
      view.
  - rater: rater-3
    site: rapid--feature-inspector
    text: The OSM tag editor switches the same key/value collection between a row list and a raw
      plain-text view (key=value per line). No value describes a raw text/source view.
  - rater: rater-1
    site: rapid--feature-inspector
    text: Rapid/iD tag editor toggles between a key/value row list and a raw plain-text textarea
      (key=value per line); no existing view value covers a raw text representation.
