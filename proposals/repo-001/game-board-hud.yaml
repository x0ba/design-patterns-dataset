# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 game-board-hud
id: game-board-hud
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Game board with HUD
level: pattern
parent: explore-space
definition: "A playable board/battlefield (often a hex or square grid) in which units are placed,
  selected and acted on turn by turn, framed by a heads-up display: turn-order queue, active unit
  portrait and abilities, player resources, and combat feedback (floating damage numbers and status
  names)."
aliases:
  - battlefield
  - tactics grid
  - turn-order queue
  - game HUD
dimensions:
  - name: Board geometry
    family: layout
    question: How is the play space divided?
    subdimensions:
      - id: grid
        name: Grid
        select: one
        values:
          - id: hex-grid
            name: Hex grid
            example: Ancient Beast
          - id: square-grid
            name: Square grid
            example: Chess.com
          - id: free-space
            name: Free space
            example: RTS maps
  - name: Turn model
    family: flow
    question: How is turn order communicated?
    subdimensions:
      - id: turn-order
        name: Turn order
        select: one
        values:
          - id: initiative-queue
            name: Initiative queue of portraits
            example: Ancient Beast
          - id: player-indicator
            name: Whose-turn indicator only
            example: Chess.com
          - id: real-time
            name: Real-time, no turns
            example: RTS
rationale:
  - rater: rater-3
    site: ancientbeast--battlefield
    text: The codebook has no entry for game play surfaces. Seat-map, zoomable-canvas and canvas-editor
      all involve spatial objects but none cover turn-based units, initiative queues, floating
      combat text or ability bars.
