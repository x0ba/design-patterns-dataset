# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 space-simulator
id: space-simulator
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Space / sky simulator
level: pattern
parent: explore-space
definition: A navigable 3D scene of an astronomical world — solar system, sky, galaxy — explored by
  flying a camera between bodies, with a simulation-time control, a catalog of bodies to fly to, and
  a detail panel for the selected body.
aliases:
  - planetarium
  - solar system explorer
  - orrery
  - sky map
relations:
  neighbors:
    - map-explorer
    - object-viewer-3d
    - zoomable-canvas
dimensions:
  - name: Time control
    family: lifecycle
    question: How does the person control simulated time?
    subdimensions:
      - id: timeControl
        name: Time control
        select: many
        values:
          - id: real-time-now
            name: Real-time / now
          - id: warp-faster-slower
            name: Warp faster / slower
          - id: pause
            name: Pause
          - id: date-scrubber
            name: Date scrubber
  - name: Navigation
    family: invocation
    question: How does the camera move between bodies?
    subdimensions:
      - id: spaceNav
        name: Navigation
        select: many
        values:
          - id: fly-to-from-catalog
            name: Fly-to from catalog
          - id: free-flight
            name: Free flight
          - id: orbit-selected
            name: Orbit selected body
          - id: authored-tours
            name: Authored tours
rationale:
  - rater: rater-1
    site: solar-wanderer--guided-tour
    text: map-explorer is geographic; object-viewer-3d inspects a single model; zoomable-canvas is a 2D
      plane. Fly-through 3D universes with time warp, body catalog and fly-to (NASA Eyes, Celestia,
      Stellarium web) fit none cleanly.
sources:
