# Codebook proposal (new-entry) — review with: node scripts/proposals.ts show repo-001 map-editor
id: map-editor
kind: new-entry
status: open
batch: repo-001
codebookVersion: 1.0.0
name: Map editor
level: pattern
parent: create
definition: Creating and changing geographic features (points, lines, areas) and their tags directly
  on a pannable, zoomable map, with a feature inspector, validation and changeset upload.
relations:
  neighbors:
    - map-explorer
    - canvas-editor
  uses:
    - property-inspector
    - undo
    - contextual-help
dimensions:
  - name: Geometry tools
    family: invocation
    question: How are features created?
    subdimensions:
      - id: geometryTools
        name: Geometry tools
        select: many
        values:
          - id: point-line-area-toolbar
            name: Point / line / area toolbar
            example: iD, Rapid
          - id: trace-from-imagery
            name: Trace from imagery
            example: JOSM
          - id: accept-ai-suggestions
            name: Accept AI-detected features
            example: Rapid
  - name: Commit
    family: lifecycle
    question: How do edits reach the shared map?
    subdimensions:
      - id: commit
        name: Commit
        select: one
        values:
          - id: changeset-upload
            name: Batched changeset upload
            example: iD Save
          - id: live-sync
            name: Live sync
            example: Collaborative GIS
rationale:
  - rater: rater-3
    site: rapid--feature-inspector
    text: "map-explorer covers browsing a map to find places; canvas-editor covers free 2D design
      canvases. A GIS/OSM editor (iD, Rapid, JOSM) mixes both: geometry tools (Point/Line/Area),
      vertex snapping, a tag inspector, an issues panel and a batch Save of a changeset. Neither
      entry describes this."
