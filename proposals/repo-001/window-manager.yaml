    family: layout
    question: How are windows placed?
    subdimensions:
      - id: arrangement
        name: Arrangement
        select: one
        values:
          - id: free-floating-overlapping
            name: Free-floating overlapping
            example: macOS, Aurora OS.js
          - id: tiling
            name: Tiling
            example: i3, Windows Snap
          - id: single-fullscreen
            name: Single fullscreen
            example: iPadOS full-screen apps
      - id: launcher
        name: Launcher
        select: one
        values:
          - id: dock
            name: Dock
            example: macOS dock
          - id: taskbar
            name: Taskbar
            example: Windows taskbar
          - id: desktop-icons
            name: Desktop icons
            example: Desktop shortcuts
rationale:
  - rater: rater-1
    site: aurora-os-js--mail-reading
    text: app-shell covers one app's frame; split-pane covers tiled panes in one window; modal-dialog is
      blocking. None describes free-floating, overlapping, stackable app windows with traffic-light
      controls, z-order focus and a dock launcher.
