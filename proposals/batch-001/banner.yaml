# Codebook proposal (new-values) — review with: node scripts/proposals.ts show batch-001 banner
id: banner
kind: new-values
status: open
batch: batch-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: placement
        values:
          - id: floating-corner-card
            name: Floating corner card
            description: A fixed card pinned to a viewport corner (usually bottom-right) that doesn't span the
              full width and doesn't block the page
            example: Notion.com cookie consent card
          - id: floating-corner-panel
            name: Floating corner panel
            description: A fixed card floating in a viewport corner over content, not spanning the width
            example: Notion.com cookie consent bottom-right
rationale:
  - rater: rater-2
    site: notion-com
    text: Cookie-consent notices are often floating cards pinned to a viewport corner rather than
      full-width bottom bars. None of the existing placement values describes a corner card that
      doesn't span the page.
  - rater: rater-3
    site: notion-com
    text: Cookie consent shown as a floating, non-blocking corner panel (bottom-right, ~400px wide)
      rather than a full-width bottom bar or top-of-content strip; no placement value describes a
      corner-anchored floating card.
  - rater: rater-1
    site: notion-com
    text: Cookie consent notices are often a fixed floating card in a bottom corner, not a full-width
      bottom bar or top banner. It doesn't block the page, so modal-dialog doesn't fit either.
  - rater: rater-2
    site: todoist-com
    text: Cookie consent shown as a floating card pinned to the bottom-right corner of the viewport, not
      a full-width bottom bar or top banner.
  - rater: rater-3
    site: todoist-com
    text: Cookie consent shown as a compact floating card pinned to a viewport corner (bottom-right),
      non-blocking. Not a full-width bottom bar, top-of-app, or inline placement.
