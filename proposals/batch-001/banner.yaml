# Codebook proposal (new-values) — review with: node scripts/proposals.ts show batch-001 banner
id: banner
kind: new-values
status: open
batch: batch-001
codebookVersion: 1.0.0
dimensions:
  - subdimensions:
      - id: placement
        values:
          - id: floating-corner-panel
            name: Floating corner panel
            description: A fixed card anchored to a viewport corner, overlaying content without a backdrop
            example: Notion.com cookie consent (bottom-right)
          - id: floating-corner-card
            name: Floating corner card
            description: A fixed card floating in a viewport corner over content, not spanning the width.
            example: Notion.com cookie consent panel bottom-right
          - id: floating-corner
            name: Floating corner card
            description: A fixed card anchored to a viewport corner, overlapping content without blocking it
            example: Notion cookie consent card (bottom-right)
rationale:
  - rater: rater-1
    site: notion-com
    text: Cookie consent shown as a floating card pinned to the bottom-right corner of the viewport, not
      a full-width bar or inline message; no placement value describes a corner-anchored floating
      panel.
  - rater: rater-3
    site: notion-com
    text: Cookie consent shown as a floating card pinned to the bottom-right corner of the viewport (not
      a full-width bottom bar, not modal). Existing placement values only describe full-width bars
      or inline positions.
  - rater: rater-2
    site: notion-com
    text: Cookie consent notices are often a floating card pinned to a viewport corner, not a full-width
      bottom bar or top banner; none of the placement values describe this.
  - rater: rater-1
    site: todoist-com
    text: Cookie-consent and announcement banners are often a floating card pinned to a viewport corner,
      not a full-width bar or inline notice; no placement value covers this.
