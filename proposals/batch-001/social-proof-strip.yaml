codebookVersion: 1.0.0
name: Social proof strip
level: component
parent: browse-collections
definition: A marketing band of press quotes, customer logos, ratings or testimonials placed near a
  hero or CTA to build trust; not interactive collection browsing.
aliases:
  - press quotes
  - logo wall
  - testimonial strip
  - trust bar
dimensions:
  - name: Proof type
    family: content
    question: What kind of proof is shown?
    subdimensions:
      - id: proofType
        name: Proof type
        select: many
        values:
          - id: press-quotes
            name: Press quotes
            example: Todoist The Verge/PCMag quotes
          - id: customer-logos
            name: Customer logos
            example: Stripe logo wall
          - id: rating-summary
            name: Rating summary
            example: 347K+ five-star reviews
          - id: user-testimonials
            name: User testimonials
            example: Quote cards with avatars
  - name: Motion
    family: lifecycle
    question: Does the strip move?
    subdimensions:
      - id: motion
        name: Motion
        select: one
        values:
          - id: static
            name: Static
          - id: marquee
            name: Marquee
rationale:
  - rater: rater-2
    site: todoist-com
    text: Marketing landing pages very commonly have press-quote / logo / review-count strips; nothing
      in the codebook covers them (search for testimonial/social proof/logo returns nothing
      relevant).
