batch: batch-001
codebookVersion: 1.0.0
name: Social proof (logo wall / testimonials)
level: component
parent: browse-collections
definition: A marketing block of customer logos, quotes or attributed testimonials (often a grid or
  auto-scrolling marquee) meant to build trust, not to be browsed or acted on.
relations:
  neighbors:
    - card
    - carousel
dimensions:
  - name: Proof content
    family: content
    question: What is the proof?
    subdimensions:
      - id: proof
        name: Proof type
        select: many
        values:
          - id: logo-wall
            name: Logo wall
            description: Grid or strip of customer logos
          - id: quote-cards
            name: Quote cards
            description: Attributed testimonial quotes
          - id: metric-case-study
            name: Metric case study
            description: A customer with a headline outcome number
      - id: motion
        name: Motion
        select: one
        values:
          - id: static-grid
            name: Static grid
          - id: marquee
            name: Marquee
rationale:
  - rater: rater-3
    site: ramp-com
    text: Marketing pages almost always have logo walls and testimonial marquees. Today the only way to
      code them is as card or carousel, which captures the form but not the purpose. Nothing in the
      codebook covers trust-building social proof.
