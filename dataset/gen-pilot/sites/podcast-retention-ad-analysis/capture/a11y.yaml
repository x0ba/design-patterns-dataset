- main:
  - heading "Did completion change after the ad move?" [level=1]
  - paragraph: Narrative episodes before and after 4 Aug 2026. The mid-roll moved from about minute 18 to about minute 25 on this date. Non-narrative shows, which kept their ad positions, are the comparison.
  - text: Completion before 59.0% 210 episodes before 4 Aug Completion after 55.1% −3.9 pts raw · 54 episodes after Change, adjusted for comparison shows −3.6 pts 95% CI −4.5 to −2.7 pts · comparison +0.2 pts Listeners lost at the mid-roll 11%→14% minute 18 before · minute 25 after
  - heading "Share still listening, by minute" [level=2]
  - text: Starts-weighted. Each line stops where fewer than five episodes reach the minute.
  - img "Retention by minute, before and after the move": "30% 40% 50% 60% 70% 80% 90% 100% 0m 10m 20m 30m 40m 50m 60m 70m before: min 18 after: min 25"
  - text: Before After Dashed lines mark the median mid-roll minute for each side.
  - heading "Change at each minute (after minus before)" [level=2]
  - text: Negative bars mean fewer listeners remain.
  - img "Change in retention at each minute": +14 −14 0m 10m 20m 30m 40m 50m 60m 70m
  - heading "What the data says" [level=2]
  - text: Generated from the current filters
  - heading "Completion fell after the move" [level=3]
  - paragraph: Each narrative show's own completion changed by −3.4 pts on average. Adjusted for the comparison shows, the change is −3.6 pts, 95% CI −4.5 to −2.7 pts.
  - text: Pooled across episodes, completion went from 59.0% to 55.1% (−3.9 pts), but larger shows weigh more in that figure. The headline gives each show equal weight. 264 narrative episodes; interval from a bootstrap over episodes.
  - heading "Comparison shows did not move much" [level=3]
  - paragraph: Non-narrative shows, which kept their ad positions, moved +0.2 pts over the same window (785 episodes before, 128 after). Background drift is small, so the raw and adjusted figures are close.
  - 'heading "Outliers: The Salt Road and Cold Harbor" [level=3]'
  - paragraph: "Clear drops: Cold Harbor (−11.6 pts), The Salt Road (−8.2 pts), Second Shift (−4.5 pts). Clear rises: The Quiet Gauge (+1.9 pts). No clear change: Hollow Verdict, Lantern Street."
  - text: Outlier = at least 3 pts below the median narrative show and 2 standard errors below it. Only 8 to 10 episodes per show sit after the move, so per-show intervals are wide.
  - heading "Listeners are not leaving earlier" [level=3]
  - paragraph: At minute 18, the old slot, retention is 78.7% before the move and 83.9% after. At minute 24, just before the new slot, it is 72.3% before and 76.8% after. Retention before the new slot is not lower after the move, so the data do not show an earlier exit.
  - text: "The main change is at the new slot: 14.2% of listeners drop at minute 25, against 10.7% at minute 18 before."
  - heading "Length and platform" [level=3]
  - paragraph: "By length: Under 45 min −2.4 pts, 45–60 min −2.3 pts, Over 60 min −11.8 pts. By majority platform: Apple −2.1 pts, Spotify −11.0 pts (raw, few comparison episodes), Network app too few episodes, Other too few episodes."
  - text: Each segment compares narrative and comparison episodes within that segment. Sample sizes are on the Segments tab.
  - heading "Production-note episodes are excluded" [level=3]
  - paragraph: 2 before and 4 after the move carry production notes (see Method & data) and are left out of the figures above. Including them, the adjusted change is −3.9 pts (95% CI −4.8 to −3.1 pts).
  - heading "Read with the sample size in mind" [level=3]
  - paragraph: "54 narrative episodes fall after the move, over about 14 weeks, against 210 before. The comparison is observational: the move is the only ad change we see, but it is not a randomised test."
