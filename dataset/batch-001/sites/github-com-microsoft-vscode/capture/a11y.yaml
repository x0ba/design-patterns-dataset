  - button "Outline"
  - article:
    - heading "Visual Studio Code - Open Source (\"Code - OSS\")" [level=1]
    - 'link "Permalink: Visual Studio Code - Open Source (\"Code - OSS\")"':
      - /url: "#visual-studio-code---open-source-code---oss"
    - paragraph:
      - link "Feature Requests":
        - /url: https://github.com/microsoft/vscode/issues?q=is%3Aopen+is%3Aissue+label%3Afeature-request+sort%3Areactions-%2B1-desc
        - img "Feature Requests"
      - link "Bugs":
        - /url: https://github.com/microsoft/vscode/issues?utf8=%E2%9C%93&q=is%3Aissue+is%3Aopen+label%3Abug
        - img "Bugs"
    - heading "The Repository" [level=2]
    - 'link "Permalink: The Repository"':
      - /url: "#the-repository"
    - paragraph:
      - text: This repository ("
      - code: Code - OSS
      - text: "\") is where we (Microsoft) develop the"
      - link "Visual Studio Code":
        - /url: https://code.visualstudio.com
      - text: product together with the community. Not only do we work on code and issues here, but we also publish our
      - link "roadmap":
        - /url: https://github.com/microsoft/vscode/wiki/Roadmap
      - text: ","
      - link "monthly iteration plans":
        - /url: https://github.com/microsoft/vscode/wiki/Iteration-Plans
      - text: ", and our"
      - link "endgame plans":
        - /url: https://github.com/microsoft/vscode/wiki/Running-the-Endgame
      - text: . This source code is available to everyone under the standard
      - link "MIT license":
        - /url: https://github.com/microsoft/vscode/blob/main/LICENSE.txt
      - text: .
    - heading "Visual Studio Code" [level=2]
    - 'link "Permalink: Visual Studio Code"':
      - /url: "#visual-studio-code"
    - paragraph:
      - link "VS Code in action":
        - /url: https://private-user-images.githubusercontent.com/1908215/595962420-56af271c-949d-454c-a3ea-16188c063414.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..whGXItP-lCD20x1DBo-RNDUOnNqLYem74t5O3sB3OdM
        - img "VS Code in action"
    - paragraph:
      - link "Visual Studio Code":
        - /url: https://code.visualstudio.com
      - text: is a distribution of the
      - code: Code - OSS
      - text: repository with Microsoft-specific customizations released under a traditional
      - link "Microsoft product license":
        - /url: https://code.visualstudio.com/License/
      - text: .
    - paragraph:
      - link "Visual Studio Code":
        - /url: https://code.visualstudio.com
      - text: combines the simplicity of a code editor with what developers need for their core edit-build-debug cycle. It provides comprehensive code editing, navigation, and understanding support along with lightweight debugging, a rich extensibility model, and lightweight integration with existing tools.
    - paragraph:
      - text: Visual Studio Code is updated monthly with new features and bug fixes. You can download it for Windows, macOS, and Linux on the
      - link "Visual Studio Code website":
        - /url: https://code.visualstudio.com/Download
      - text: . To get the latest releases every day, install the
      - link "Insiders build":
        - /url: https://code.visualstudio.com/insiders
      - text: .
    - heading "Contributing" [level=2]
    - 'link "Permalink: Contributing"':
      - /url: "#contributing"
    - paragraph: "There are many ways in which you can participate in this project, for example:"
    - list:
      - listitem:
        - link "Submit bugs and feature requests":
          - /url: https://github.com/microsoft/vscode/issues
        - text: ", and help us verify them as they are checked in"
      - listitem:
        - text: Review
        - link "source code changes":
          - /url: https://github.com/microsoft/vscode/pulls
      - listitem:
        - text: Review the
        - link "documentation":
          - /url: https://github.com/microsoft/vscode-docs
        - text: and make pull requests for anything from typos to new content.
    - paragraph:
      - text: If you are interested in fixing issues and contributing directly to the codebase, please see the document
      - link "How to Contribute":
        - /url: https://github.com/microsoft/vscode/wiki/How-to-Contribute
      - text: ", which covers the following:"
    - list:
      - listitem:
        - link "How to build and run from source":
          - /url: https://github.com/microsoft/vscode/wiki/How-to-Contribute
      - listitem:
        - link "The development workflow, including debugging and running tests":
          - /url: https://github.com/microsoft/vscode/wiki/How-to-Contribute#debugging
      - listitem:
        - link "Coding guidelines":
          - /url: https://github.com/microsoft/vscode/wiki/Coding-Guidelines
      - listitem:
        - link "Submitting pull requests":
          - /url: https://github.com/microsoft/vscode/wiki/How-to-Contribute#pull-requests
      - listitem:
        - link "Finding an issue to work on":
          - /url: https://github.com/microsoft/vscode/wiki/How-to-Contribute#where-to-contribute
      - listitem:
        - link "Contributing to translations":
          - /url: https://aka.ms/vscodeloc
    - heading "Feedback" [level=2]
    - 'link "Permalink: Feedback"':
      - /url: "#feedback"
    - list:
      - listitem:
        - text: Ask a question on
        - link "Stack Overflow":
          - /url: https://stackoverflow.com/questions/tagged/vscode
      - listitem:
        - link "Request a new feature":
          - /url: /microsoft/vscode/blob/main/CONTRIBUTING.md
      - listitem:
        - text: Upvote
        - link "popular feature requests":
          - /url: https://github.com/microsoft/vscode/issues?q=is%3Aopen+is%3Aissue+label%3Afeature-request+sort%3Areactions-%2B1-desc
      - listitem:
        - link "File an issue":
          - /url: https://github.com/microsoft/vscode/issues
      - listitem:
        - text: Connect with the extension author community on
        - link "GitHub Discussions":
          - /url: https://github.com/microsoft/vscode-discussions/discussions
        - text: or
        - link "Slack":
          - /url: https://aka.ms/vscode-dev-community
      - listitem:
        - text: Follow
        - link "@code":
          - /url: https://x.com/code
        - text: and let us know what you think!
    - paragraph:
      - text: See our
      - link "wiki":
        - /url: https://github.com/microsoft/vscode/wiki/Feedback-Channels
      - text: for a description of each of these channels and information on some other available community-driven channels.
    - heading "Related Projects" [level=2]
    - 'link "Permalink: Related Projects"':
      - /url: "#related-projects"
    - paragraph:
      - text: Many of the core components and extensions to VS Code live in their own repositories on GitHub. For example, the
      - link "node debug adapter":
        - /url: https://github.com/microsoft/vscode-node-debug
      - text: and the
      - link "mono debug adapter":
        - /url: https://github.com/microsoft/vscode-mono-debug
      - text: repositories are separate from each other. For a complete list, please visit the
      - link "Related Projects":
        - /url: https://github.com/microsoft/vscode/wiki/Related-Projects
      - text: page on our
      - link "wiki":
        - /url: https://github.com/microsoft/vscode/wiki
      - text: .
    - heading "Bundled Extensions" [level=2]
    - 'link "Permalink: Bundled Extensions"':
      - /url: "#bundled-extensions"
    - paragraph:
      - text: VS Code includes a set of built-in extensions located in the
      - link "extensions":
        - /url: /microsoft/vscode/blob/main/extensions
      - text: folder, including grammars and snippets for many languages. Extensions that provide rich language support (inline suggestions, Go to Definition) for a language have the suffix
      - code: language-features
      - text: . For example, the
      - code: json
      - text: extension provides coloring for
      - code: JSON
      - text: and the
      - code: json-language-features
      - text: extension provides rich language support for
      - code: JSON
      - text: .
    - heading "Development Container" [level=2]
    - 'link "Permalink: Development Container"':
      - /url: "#development-container"
    - paragraph: This repository includes a Visual Studio Code Dev Containers / GitHub Codespaces development container.
    - list:
      - listitem:
        - paragraph:
          - text: For
          - link "Dev Containers":
            - /url: https://aka.ms/vscode-remote/download/containers
          - text: ", use the"
          - strong: "Dev Containers: Clone Repository in Container Volume..."
          - text: command, which creates a Docker volume for better disk I/O on macOS and Windows.
        - list:
          - listitem:
            - text: If you already have VS Code and Docker installed, you can also click
            - link "here":
              - /url: https://vscode.dev/redirect?url=vscode://ms-vscode-remote.remote-containers/cloneInVolume?url=https://github.com/microsoft/vscode
            - text: to get started. This will cause VS Code to automatically install the Dev Containers extension if needed, clone the source code into a container volume, and spin up a dev container for use.
      - listitem:
        - paragraph:
          - text: For Codespaces, install the
          - link "GitHub Codespaces":
            - /url: https://marketplace.visualstudio.com/items?itemName=GitHub.codespaces
          - text: extension in VS Code, and use the
          - strong: "Codespaces: Create New Codespace"
          - text: command.
    - paragraph:
      - text: Docker / the Codespace should have at least
      - strong: 4 cores and 6 GB of RAM (8 GB recommended)
      - text: to run a full build. See the
      - link "development container README":
        - /url: /microsoft/vscode/blob/main/.devcontainer/README.md
      - text: for more information.
    - heading "Code of Conduct" [level=2]
    - 'link "Permalink: Code of Conduct"':
      - /url: "#code-of-conduct"
    - paragraph:
      - text: This project has adopted the
      - link "Microsoft Open Source Code of Conduct":
        - /url: https://opensource.microsoft.com/codeofconduct/
      - text: . For more information, see the
      - link "Code of Conduct FAQ":
        - /url: https://opensource.microsoft.com/codeofconduct/faq/
      - text: or contact
      - link "opencode@microsoft.com":
        - /url: mailto:opencode@microsoft.com
      - text: with any additional questions or comments.
