- banner:
  - button "Back":
    - img
  - text: "Weekly digest: databases"
- text: Give me a quick digest of the database posts from this week.
- paragraph:
  - text: Here's what landed in your
  - strong: Databases
  - text: "category this week:"
- list:
  - listitem:
    - 'link "Postgres 18: asynchronous I/O in practice"':
      - /url: /www.crunchydata.com/blog/postgres-18-asynchronous-i-o-in-practice/
    - text: —
    - emphasis: Crunchy Data Blog
    - text: Benchmarks of
    - code: io_method=worker
    - text: vs
    - code: io_uring
    - text: ; sequential scans got roughly 2.4× faster on NVMe.
  - listitem:
    - link "Introducing concurrent writes in Turso":
      - /url: /turso.tech/blog/introducing-concurrent-writes-in-turso/
    - text: —
    - emphasis: Turso Blog
    - text: MVCC-based concurrent writes for the SQLite rewrite, now in beta.
- paragraph: Both are unread. Since you've been reading a lot about SQLite WAL mode lately, the Turso post is probably the more relevant one.
- text: Does the Turso one say anything about how it compares to WAL2 or BEGIN CONCURRENT?
- paragraph:
  - text: It does briefly. The post positions MVCC as a replacement for the page-level locking that
  - code: BEGIN CONCURRENT
  - text: still relies on, so two writers touching different rows on the
  - strong: same page
  - text: no longer conflict. It doesn't mention WAL2 at all.
- paragraph:
  - text: Want me to search your archive for anything else on
  - code: BEGIN CONCURRENT
  - text: "?"
