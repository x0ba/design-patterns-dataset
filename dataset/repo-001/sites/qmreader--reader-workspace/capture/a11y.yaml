- button "线性Attention的长度外推：一个更一般的刻画":
  - text: 科 科学空间
  - time: 2 天前
  - text: 线性Attention的长度外推：一个更一般的刻画 本文继续讨论线性 Attention 的长度外推问题。上一篇我们证明了在某些衰减假设下，线性 Attention 的有效感受野是有界的，这一篇尝试给出一个更一般的刻画。 核心思路是把状态矩阵的演化看成一个随机过程，然后考察其谱半径随序列长度的变化。结果表明，只要遗忘门的期望小于 1 且方差有界，外推误差就随长度对数增长。 这个结论和实验观察是吻合的：在 4K 训练、32K 测试的设置下，带门控的变体困惑度只上升约 3%，而不带门控的版本则明显发散。
