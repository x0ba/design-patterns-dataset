- button "半年用自己写的 RSS 阅读器，我留下了什么":
  - text: 乔 乔木博客
  - time: 1 天前
  - text: 半年用自己写的 RSS 阅读器，我留下了什么 这半年我把每天的信息输入几乎全搬进了自己写的 RSS 阅读器。最大的变化不是读得更多，而是读完之后能留下东西。 以前在推特和公众号里刷到好文章，收藏夹越堆越多，回头一看全忘了。现在每篇值得读的文章，要么有一份中文改写，要么有我写的一两句点评，过几周再搜还能找到当时的判断。 另一个意外收获是“先快后慢”的刷新机制。RSS 先抓回来，AI 翻译和改写在后台慢慢补，早上打开时列表已经是中文标题了，挑着读就行。 如果你也被信息流淹没，我的建议是：少订阅、多沉淀。订阅源控制在五十个以内，每天只精读三篇，读完一定写一句话。
