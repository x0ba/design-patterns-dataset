  - link "打开原文：Management is the new prompting":
    - /url: https://www.oneusefulthing.org/management-is-the-new-prompting
    - text: Management is the new prompting
  - paragraph: Every few months I run the same informal experiment with my MBA students. I give half the class access to the current frontier model and ask everyone to produce a market-entry memo in ninety minutes.
  - paragraph: This semester the gap between the two groups was the largest I have seen. The AI group did not just write faster; their memos considered more alternatives, cited more specific numbers, and were rated higher by an outside panel that did not know who had used AI.
  - paragraph: But the most interesting finding was inside the AI group. Students who treated the model as a coworker, arguing with it and asking it to critique their draft, outperformed students who used it as a vending machine for finished paragraphs.
  - paragraph:
    - mark: The lesson I keep coming back to is that the skill is not prompting. It is management
    - text: ": knowing what good looks like, delegating the parts that can be delegated, and checking the work."
