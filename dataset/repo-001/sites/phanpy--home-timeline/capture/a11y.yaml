        - link "1h More":
          - /url: "#/localhost:4440/s/117635710728273923"
          - time: 1h
          - img "More"
        - paragraph: Today I learned that our "stateless" service has been writing a 40MB temp file to disk on every request since 2021. Nobody noticed because the disk was big. The disk is no longer big.
  - listitem:
    - link:
      - /url: "#/localhost:4440/s/117635616356433924"
      - article:
        - img "Liked"
        - img "Saved"
        - link "@marcusbell":
          - /url: http://localhost:4440/@marcusbell
        - link "Marcus Bell":
          - /url: http://localhost:4440/@marcusbell
        - text: 1/X
        - link "1h More":
          - /url: "#/localhost:4440/s/117635616356433924"
          - time: 1h
          - img "More"
        - paragraph: Bus stop consolidation is one of the least glamorous, highest-impact things a transit agency can do. Fewer stops = faster, more reliable buses = more riders. The trick is doing it without cutting off people who can't walk the extra 300m.
        - paragraph: We spent eight months on Line 14 alone. Thread on what we learned 🧵
        - paragraph:
          - link "#transit":
            - /url: http://localhost:4440/tags/transit
  - listitem:
    - link:
      - /url: "#/localhost:4440/s/117635628152913925"
      - article: "2/X 1/ First: the data. We overlaid boardings per stop with sidewalk quality, slope, and proximity to clinics and senior housing. Some \"low ridership\" stops were low because the sidewalk to them was broken, not because nobody needed them."
  - listitem:
    - link:
      - /url: "#/localhost:4440/s/117635639949393926"
      - article: "3/X 2/ Second: talk to drivers. Operators knew exactly which stops caused the worst bunching, and which ones had regulars who would be stranded. None of that was in the spreadsheet."
  - listitem:
    - link:
      - /url: "#/localhost:4440/s/117635651745873927"
      - article:
        - img "Saved"
        - link "@marcusbell":
          - /url: http://localhost:4440/@marcusbell
        - link "Marcus Bell":
          - /url: http://localhost:4440/@marcusbell
        - link "1h More":
          - /url: "#/localhost:4440/s/117635651745873927"
          - time: 1h
          - img "More"
        - text: Thread 4/X
        - paragraph: "3/ End result: 11 stops removed, 3 moved, 2 *added*. Average trip time down 4 minutes, ridership up 9% in six months. And zero angry letters from the senior center, which honestly felt like the bigger win."
