- text: ". if it fails again just restart the worker and ping me, don't try to replay the batch manually Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm noted. will not touch the batch 🙏 Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Also reminder that Thursday is the Harbour Point follow-up call at 10:30 PT, same link as this one Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Can someone forward me the invite? I only have the old one from October Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Sent! Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm btw the office wifi on the 3rd floor is down again so if anyone is coming in tomorrow, grab a desk on 2 Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm classic Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Okay I think that's everything. Thanks everyone, great sprint. Notes will be in #tidewater-team in 10 min Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm"
