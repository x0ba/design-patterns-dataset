- text: "CHAT Morning all! Giving it 2 min for people to trickle in Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm here, just grabbing coffee ☕ Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm hi hi Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Joining from the train so my video might cut out, sorry in advance Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Agenda for today: 1) Sprint 42 recap 2) Harbour Point pilot feedback 3) Waitlist flow designs 4) On-call handoff Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Board is here if you want to follow along"
- link "https://tidewater.atlassian.net/jira/software/projects/TW/boards/3":
  - /url: https://tidewater.atlassian.net/jira/software/projects/TW/boards/3
- text: "Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Quick heads up before we start: the nightly availability sync failed again at 02:14 UTC. Same Postgres lock timeout as last Tuesday. I restarted the worker and it caught up by 03:40, no double bookings as far as I can tell, but we need a proper fix this sprint Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm ugh again? Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm yeah. I think it is the slip_holds cleanup job overlapping with the sync. Writing it up in TW-1184 Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Thanks Marcus. Let's make TW-1184 a P1 then Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm +1 Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Sprint recap from mobile side: iOS 3.8.0 is in TestFlight, 31 testers so far. Crash-free sessions at 99.4%. The one remaining crash is the map view on iPad when you rotate mid-pan Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Android build is blocked on the Stripe SDK bump, should be unblocked tmrw Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Nice. Are we still on track to submit 3.8 to the App Store on the 21st? Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm If the iPad thing is fixed by Wed yes. otherwise I'd rather slip it a few days than ship a crash Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Agreed, quality over date Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Pilot feedback summary from Harbour Point Marina is in the doc:"
- link "https://docs.google.com/document/d/1qH7v0-HarbourPoint-pilot-notes/edit":
  - /url: https://docs.google.com/document/d/1qH7v0-HarbourPoint-pilot-notes/edit
- text: "Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm TL;DR — the dockmasters love the tide-aware arrival windows, but they hate that cancelling a reservation takes 4 taps and a confirmation modal. Two of them said they just call the boater instead 😅 Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm lol that tracks Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Also they asked for a printable daily arrivals sheet. Apparently the fuel dock has no wifi and they literally tape a paper list to the wall Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Printable sheet seems cheap to do. Marcus, could the existing arrivals endpoint just render a PDF? Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Probably. We already have the HTML template for the confirmation emails, could reuse that and run it through the pdf service. Half a day maybe Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Let's add it to next sprint then Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm wait is the pdf service the one that kept OOMing in March Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm that was the old one, we moved to the queue-based worker in April. it's been fine Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm ok cool 👍 Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Moving on to waitlist designs, Figma link:"
- link "https://www.figma.com/file/Tw8x2Qp/Tidewater-Waitlist-v3?node-id=214%3A1902":
  - /url: https://www.figma.com/file/Tw8x2Qp/Tidewater-Waitlist-v3?node-id=214%3A1902
- text: Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Three options on the first page. A is the minimal one (just a "notify me" toggle on full dates), B adds a ranked list of alternative slips nearby, C lets the boater set a max price and auto-book if something opens up Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm C is really interesting but auto-booking with someone's card on file feels like a legal question. Can we ship B first and keep C as a follow-up? Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm B is also much less work on the backend. C needs a hold + capture flow we don't have yet Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm B for sure. also on mobile the C settings screen gets really long Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm Okay B it is. I'll clean up the edge cases (what if a slip opens for only part of the stay?) and share by Thursday Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm perfect Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Sam can you take a look at the PR for the availability cache when you get a sec?
- link "https://github.com/tidewater-app/api/pull/1312":
  - /url: https://github.com/tidewater-app/api/pull/1312
- text: "— it's the one that cuts the search endpoint p95 from ~900ms to ~180ms Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm there's one thing I'm not sure about: I'm invalidating the whole marina key when any slip changes. it's simple but it means busy marinas basically never hit the cache on Saturday mornings Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm could we key it per dock instead of per marina? Diego Fuentes (__712250981__2564173309__) - 17th November, 2026 10:34 pm yeah that's plan B, it just makes the invalidation fan-out uglier Marcus Oyelaran (__3640092177__408815230__) - 17th November, 2026 10:34 pm Let's not block on perfect. Ship per-marina, add a metric for hit rate, revisit if Saturdays look bad Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm sorry my connection dropped for a sec, did I miss anything about the waitlist? Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Nope, we went with B 🙂 Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm yay Hannah Kowalczyk (__1987456320__3329018744__) - 17th November, 2026 10:34 pm Last thing: on-call handoff. Diego is on this week, Marcus from Monday the 23rd Priya Raman (__2903318841__1175502963__) - 17th November, 2026 10:34 pm Diego the runbook for the sync job is here"
