    - text: Markdown
    - code: "[w2mWord to Markdown](http://word-to-markdown-js.localhost:4319/) Free · Open source · 100% in your browser # Word to Markdown Convert Word (`.docx`) files to clean Markdown, entirely in your browser. Your files are never uploaded. .docx.md Converting docs since 2014 Drop your .docx hereor click to choose a fileUp to 20 MB · Converted on this device, never uploaded Google Doc? File → Download → Microsoft Word (.docx) 1. 01 Drop Drag in a .docx file, or click to choose one. 2. 02 Convert It converts in your browser: no server, no waiting. 3. 03 Copy or save Copy the Markdown, download a .md file, or grab a .zip with your images. [![Open and Async book cover](http://word-to-markdown-js.localhost:4319/open-and-async-cover.png)From the makerI built this free tool — and I wrote the book on working in the open. **Open & Async** is a playbook for remote and distributed teams, drawing on more than a decade of remote-first lessons from GitHub.Buy now →](https://open-and-async.com/?utm_source=word2md&utm_medium=referral&utm_campaign=card) ## What gets converted | Word element | Markdown output | | ----------------------- | ------------------- | | Headings | `# Heading` | | Bold & italic | `**bold** *italic*` | | Ordered & nested lists | `1. item · - item` | | Tables | `\\| a \\| b \\|` | | Links | `[text](url)` | | Code | `` `code` `` | | Images | `![alt](image)` | | Strikethrough | `~~text~~` | | Superscript & subscript | `x<sup>2</sup>` | | Footnotes | `text[^1]` | ## Going the other way? To turn Markdown into a formatted Word document, use md2word.app. Same maker, same promise: it all happens in your browser. [Convert Markdown to Word](https://md2word.app/?utm_source=word2md&utm_medium=referral&utm_campaign=reverse) ## Prefer the command line? Word to Markdown is free and open source. Run it as a command-line tool for scripted or batch conversions. Same converter, no browser needed. [Get the CLI](http://word-to-markdown-js.localhost:4319/developers/) ## Frequently asked questions How do I convert a Word document to Markdown?Is Word to Markdown free?Are my documents uploaded to a server?How do I convert a Google Doc to Markdown?Can I convert a .doc file to Markdown?What formatting is preserved?How is this different from Pandoc?Can I use this to prepare documents for ChatGPT, Claude, or other AI tools? English[Bahasa Indonesia](http://word-to-markdown-js.localhost:4319/id/)[Tiếng Việt](http://word-to-markdown-js.localhost:4319/vi/)[Português](http://word-to-markdown-js.localhost:4319/pt/)[Español](http://word-to-markdown-js.localhost:4319/es/)[العربية](http://word-to-markdown-js.localhost:4319/ar/)[Deutsch](http://word-to-markdown-js.localhost:4319/de/)[Français](http://word-to-markdown-js.localhost:4319/fr/)[简体中文](http://word-to-markdown-js.localhost:4319/zh/)[繁體中文](http://word-to-markdown-js.localhost:4319/zh-hant/)[日本語](http://word-to-markdown-js.localhost:4319/ja/)[한국어](http://word-to-markdown-js.localhost:4319/ko/)[Русский](http://word-to-markdown-js.localhost:4319/ru/)[Italiano](http://word-to-markdown-js.localhost:4319/it/)[Nederlands](http://word-to-markdown-js.localhost:4319/nl/)[Polski](http://word-to-markdown-js.localhost:4319/pl/)[Türkçe](http://word-to-markdown-js.localhost:4319/tr/)[हिन्दी](http://word-to-markdown-js.localhost:4319/hi/)[ไทย](http://word-to-markdown-js.localhost:4319/th/)[Українська](http://word-to-markdown-js.localhost:4319/uk/)[Svenska](http://word-to-markdown-js.localhost:4319/sv/) [Feedback](https://github.com/benbalter/word-to-markdown-js/blob/main/CONTRIBUTING.md)[Source](https://github.com/benbalter/word-to-markdown-js)[Markdown to Word](https://md2word.app/)[Google Docs to Markdown](http://word-to-markdown-js.localhost:4319/google-docs-to-markdown/)[Markdown for AI](http://word-to-markdown-js.localhost:4319/docx-to-markdown-for-llms/)[Developers](http://word-to-markdown-js.localhost:4319/developers/)[Donate](https://www.patreon.com/benbalter)[Terms](http://word-to-markdown-js.localhost