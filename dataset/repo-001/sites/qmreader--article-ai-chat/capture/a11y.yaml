- article:
  - heading "打开原文：让代码库对编程 Agent 可读" [level=1]:
    - link "打开原文：让代码库对编程 Agent 可读":
      - /url: https://simonwillison.net/making-your-codebase-legible-to-coding-agents
      - text: 让代码库对编程 Agent 可读
  - link "打开原文：Making your codebase legible to coding agents":
    - /url: https://simonwillison.net/making-your-codebase-legible-to-coding-agents
    - text: Making your codebase legible to coding agents
  - heading "让 Agent 写好代码的秘诀，是让项目“对机器可读”" [level=1]
  - paragraph:
    - text: Simon Willison 用编程 Agent 跑了三个月自己的项目，总结出一句话：
    - strong: Agent 有多强，取决于环境给它的反馈有多好。
  - heading "反馈越快，Agent 越聪明" [level=2]
  - paragraph: 测试快、报错准，Claude Code 和 Codex 能连续迭代二十轮直到跑通；测试慢、报错是一整屏堆栈，它们就开始乱猜。
  - paragraph: 这其实和人一样，只是 Agent 对反馈质量更敏感。
  - heading "工作重心变了" [level=2]
  - paragraph: 现在他写代码的时间少了，更多时间在做“项目可读性”：
  - list:
    - listitem: 一条命令跑相关测试
    - listitem: README 用大白话讲架构
    - listitem: 测试夹具覆盖边界情况
  - paragraph: 这些都是给新同事准备的老建议。区别是，Agent 一天来五十次，而且永远不嫌你的文档长。
  - heading "一份能直接抄的清单" [level=2]
  - list:
    - listitem: 测试十秒内跑完
    - listitem: lint 只有一个 make 目标
    - listitem: 模块边界都有类型
    - listitem: 写一个 AGENTS.md，列出最容易踩的三个坑
  - paragraph: 我的看法：这份清单比任何“提示词技巧”都值钱。项目本身越干净，换哪个模型都好用。
  - button "下一篇 · Hugging Face Papers 为 Agent 编程扩展测试时计算 J"
- separator "调整文章和右侧栏宽度"
- complementary:
  - button "AI 对话" [pressed]
  - button "AI 设置"
  - button "收起右侧栏"
  - text: 本文 436 字
  - paragraph: 帮我总结三个要点
  - paragraph: 这篇文章的三个要点：
  - list:
    - listitem:
      - strong: 反馈质量决定 Agent 表现
      - text: ：测试快、报错具体时，Agent 能连续迭代直到成功；测试慢或报错模糊时，它会开始猜。
    - listitem:
      - strong: 工作重心转移
      - text: ：作者写代码的时间变少，更多时间花在让项目“对机器可读”——一条命令跑测试、README 讲清架构、补齐边界测试。
    - listitem:
      - strong: 一份可执行清单
      - text: ：测试 10 秒内、单一 lint 目标、模块边界有类型、写 AGENTS.md 列出三个易错点。
  - button "复制这条消息": 复制
  - button "撤回这条对话"
  - paragraph: 这些建议适合小团队吗？
  - paragraph: 适合，而且小团队收益更明显：
  - list:
    - listitem:
      - text: 小团队通常没有专职 QA，
      - strong: 快速测试
      - text: 本身就是最划算的投资；
    - listitem: AGENTS.md 对新加入的人类同事同样有用，一份文档两种读者；
    - listitem: 文章没有讨论大型单体仓库的情况，那种场景下“只跑相关测试”需要额外的工具支持，这一点文中没有依据，需要你自己评估。
  - button "复制这条消息": 复制
  - button "撤回这条对话"
  - list:
    - listitem "用 5 条 bullet 总结这篇文章最值得关注的观点。": 总结要点
    - listitem "把这篇文章的论证结构拆成：问题、证据、结论、隐含假设。": 结构拆解
    - listitem "把文章里的关键事实、数据、案例列出来，并逐条说明它们分别证明了什么。": 事实清单
  - button "管理常用提示词"
  - textbox "在设置里填好 API Key，就能提问" [disabled]
  - button "选择模型"
  - button "发送" [disabled]