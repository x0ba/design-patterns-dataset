- heading "16 datasets" [level=3]
- textbox "Search..."
- heading "Code Violations" [level=3]:
  - link "Code Violations":
    - /url: /datasets/code-violations/
- paragraph: Violations of the Property Maintenance Code and Fire Code found during inspections, with status (open, complied, referred to court).
- heading "Civilian Complaints Against Police" [level=3]:
  - link "Civilian Complaints Against Police":
    - /url: /datasets/complaints-against-police/
- paragraph: Complaints filed with the Police Advisory Commission or Internal Affairs, the allegation(s), and the investigation outcome. Officer names are withheld until a finding is sustained.
- heading "Crime Incidents" [level=3]:
  - link "Crime Incidents":
    - /url: /datasets/crime-incidents/
- paragraph:
  - text: Part I and Part II crime incidents reported to the Westbrook Police Department, classified using
  - strong: NIBRS
  - text: offense codes since January 1, 2021 (UCR summary codes before that). Locations are generalized to the hundred block; incidents involving sexual offenses or juveniles have their location removed entirely.
- paragraph:
  - text: Note that these are
  - emphasis: reported
  - text: incidents and are subject to change as investigations proceed — an incident may be reclassified or unfounded weeks later. Data is published with a 7-day delay.
- list:
  - listitem:
    - text: Records before 2021 use
    - code: ucr_general
    - text: ; after, use
    - code: nibrs_code
  - listitem:
    - code: dispatch_date_time
    - text: is in local time (America/New_York)
  - listitem: About 2% of records cannot be geocoded and have empty coordinates
- heading "Fire & EMS Incidents" [level=3]:
  - link "Fire & EMS Incidents":
    - /url: /datasets/fire-ems-incidents/
- paragraph: Incidents dispatched to Westbrook Fire Department units, including medical calls, structure fires, vehicle fires, alarms and hazmat. Response time is measured from dispatch to first unit on scene.
- heading "Fire Hydrants" [level=3]:
  - link "Fire Hydrants":
    - /url: /datasets/fire-hydrants/
- paragraph: Hydrant locations, flow-test color class (NFPA 291) and last inspection date. Maintained jointly with the Water Department.
- heading "Fire Stations" [level=3]:
  - link "Fire Stations":
    - /url: /datasets/fire-stations/
- paragraph: Engine, ladder, and medic companies by station.
- heading "Unintentional Overdose Deaths" [level=3]:
  - link "Unintentional Overdose Deaths":
    - /url: /datasets/overdose-deaths/
- paragraph: Unintentional drug overdose deaths by year, substance involved, age group, sex and race/ethnicity, from Medical Examiner data. Most recent year is provisional.
- heading "Police Districts" [level=3]:
  - link "Police Districts":
    - /url: /datasets/police-districts/
- paragraph: Boundaries of the four police districts and 22 police service areas (PSAs), effective after the 2023 redistricting.
- heading "Shooting Victims" [level=3]:
  - link "Shooting Victims":
    - /url: /datasets/shooting-victims/
- paragraph: Every person struck by gunfire in Westbrook since 2015, whether fatal or non-fatal, with age group, sex, race and police district. Self-inflicted wounds are excluded.
- heading "Smoke Alarm Installations" [level=3]:
  - link "Smoke Alarm Installations":
    - /url: /datasets/smoke-alarm-installs/
- paragraph:
  - text: Free smoke alarms installed in homes through the
  - emphasis: Sound the Alarm
  - text: program, aggregated by census tract.
- heading "Snow Emergency Routes" [level=3]:
  - link "Snow Emergency Routes":
    - /url: /datasets/snow-emergency-routes/
- paragraph: Streets where parking is prohibited when a Snow Emergency is declared.
- heading "Street Light Outages" [level=3]:
  - link "Street Light Outages":
    - /url: /datasets/street-lights/
- paragraph: Street light outage reports and repair dates. Since the 2024 LED conversion, outages are also detected automatically by networked photocells.
- heading "Traffic Crashes" [level=3]:
  - link "Traffic Crashes":
    - /url: /datasets/traffic-crashes/
- paragraph:
  - text: Reportable crashes on City streets from PennDOT-style crash reports, including the number of people killed or seriously injured (KSI). Used to track progress on
  - emphasis: Vision Zero Westbrook
  - text: .
- paragraph: Crash data for the most recent year is preliminary until the state finalizes it, usually in June of the following year.
- heading "Vehicle and Pedestrian Stops" [level=3]:
  - link "Vehicle and Pedestrian Stops":
    - /url: /datasets/traffic-stops/
- paragraph: Investigative vehicle and pedestrian stops, with demographics of the person stopped, reason for stop, and whether a frisk, search, or arrest followed. Published under the 2019 settlement agreement.
- heading "Unsafe & Imminently Dangerous Buildings" [level=3]:
  - link "Unsafe & Imminently Dangerous Buildings":
    - /url: /datasets/unsafe-imminently-dangerous/
- paragraph: Structures declared Unsafe or Imminently Dangerous and the date of any demolition.
- heading "Use of Force Incidents" [level=3]:
  - link "Use of Force Incidents":
    - /url: /datasets/use-of-force/
- paragraph: Reportable use of force incidents.
