    - paragraph: "✨New features:"
    - list:
      - listitem:
        - strong: Lens OCR engine is functional again.
      - listitem:
        - strong: Added image preprocessing options (OCR Templates).
      - listitem:
        - strong: Now supports VOICEVOX TTS natively on Windows, Linux, and macOS (OCR Templates).
      - listitem:
        - strong: Added On-Demand Recognition Mode for MangaOCR, reducing processing time by recognizing text only when needed.
      - listitem:
        - strong: MangaOCR can now be accelerated using GPU runtimes like CUDA and ROCm, installable from the settings screen.
      - listitem:
        - strong: Furigana filtering is now more accurate and can be fine-tuned by adjusting its threshold.
      - listitem:
        - strong: New screen capture method for up to 10x faster screenshots.
      - listitem:
        - strong: Improved screenshot quality, potentially boosting OCR accuracy.
      - listitem:
        - strong: Browser extensions can now access screenshots, fixing the Yomitan mining issue.
      - listitem:
        - strong: Initial support for the Wayland window system (tested on Nobara KDE and Ubuntu).
      - listitem:
        - strong: Added a button next to each hotkey setting to copy the equivalent CLI command.
      - listitem:
        - strong: Added a button to refresh the capture sources list.
      - listitem:
        - strong: Experimental API for controlling the app from third-party applications.
      - listitem:
        - strong: Enhanced multi-monitor support for macOS and Linux.
      - listitem:
        - strong: The hotkey for moving and resizing the overlay is now customizable.
      - listitem:
        - strong: Updated the built-in Yomitan extension to version 24.10.7.1.
      - listitem:
        - strong: Updated the built-in 10ten Reader extension to version 1.22.0.
      - listitem:
        - strong: Improved text rendering with language-specific fonts for Japanese and Chinese.
      - listitem:
        - strong: Improved compatibility with the Migaku extension when using the web overlay.
      - listitem:
        - strong: Improved overall stability, including fixes for hanging processes and first-run freezes.
