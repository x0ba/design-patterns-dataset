      - button "GitHub code review An agent reviews the open pull requests that need it and posts the review on GitHub.":
        - heading "GitHub code review" [level=3]
        - paragraph: An agent reviews the open pull requests that need it and posts the review on GitHub.
    - listitem:
      - button "Custom automation Create a custom automation from a prompt, plugin-powered prompt, or uploaded script tarball.":
        - heading "Custom automation" [level=3]
        - paragraph: Create a custom automation from a prompt, plugin-powered prompt, or uploaded script tarball.
    - listitem:
      - button "GitHub issue to PR Implement ready GitHub issues, address pull request feedback, and publish tested changes for review.":
        - heading "GitHub issue to PR" [level=3]
        - paragraph: Implement ready GitHub issues, address pull request feedback, and publish tested changes for review.
    - listitem:
      - button "Slack channel monitor Watch Slack channels for @openhands mentions, open a conversation with the message context, reply when the agent finishes, and continue the same conversation from triggered Slack thread follow-ups.":
        - heading "Slack channel monitor" [level=3]
        - paragraph: Watch Slack channels for @openhands mentions, open a conversation with the message context, reply when the agent finishes, and continue the same conversation from triggered Slack thread follow-ups.
    - listitem:
      - button "AGENTS.md Maintainer Keep AGENTS.md current in your repositories. On a schedule, an agent reads the repository, creates or updates AGENTS.md, and opens a pull request - and stays quiet while one of its pull requests is still open.":
        - heading "AGENTS.md Maintainer" [level=3]
        - paragraph: Keep AGENTS.md current in your repositories. On a schedule, an agent reads the repository, creates or updates AGENTS.md, and opens a pull request - and stays quiet while one of its pull requests is still open.
    - listitem:
      - button "Daily news digest Read a list of public RSS and Atom feeds on a schedule, hand an agent everything new, and have it pick out what matters for your topics and write a short digest. Connects to nothing and needs no credentials.":
        - heading "Daily news digest" [level=3]
        - paragraph: Read a list of public RSS and Atom feeds on a schedule, hand an agent everything new, and have it pick out what matters for your topics and write a short digest. Connects to nothing and needs no credentials.
    - listitem:
      - button "Slack standup digest Summarize yesterday’s Slack activity into an async standup note with blockers, decisions, and owners.":
        - heading "Slack standup digest" [level=3]
        - paragraph: Summarize yesterday’s Slack activity into an async standup note with blockers, decisions, and owners.
    - listitem:
      - button "Linear issue triage assistant Classify new Linear issues, suggest labels, find duplicates, and ask clarifying questions.":
        - heading "Linear issue triage assistant" [level=3]
        - paragraph: Classify new Linear issues, suggest labels, find duplicates, and ask clarifying questions.
    - listitem:
      - button "Linear issue to GitHub PR Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a GitHub pull request.":
        - heading "Linear issue to GitHub PR" [level=3]
        - paragraph: Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a GitHub pull request.
    - listitem:
      - button "Linear issue to GitLab MR Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a GitLab merge request.":
        - heading "Linear issue to GitLab MR" [level=3]
        - paragraph: Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a GitLab merge request.
    - listitem:
      - button "Linear issue to Bitbucket PR Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a Bitbucket pull request.":
        - heading "Linear issue to Bitbucket PR" [level=3]
        - paragraph: Watch Linear for implementation-ready issues, start an agent to make the requested code change, and open a Bitbucket pull request.
    - listitem:
      - button "Jira issue to GitHub PR Watch a Jira Cloud project for issues with a configurable label and automatically open a GitHub pull request for each new issue found. The target GitHub repo is read from the ticket body - no repo parameter required at deploy time.":
        - heading "Jira issue to GitHub PR" [level=3]
        - paragraph: Watch a Jira Cloud project for issues with a configurable label and automatically open a GitHub pull request for each new issue found. The target GitHub repo is read from the ticket body - no repo parameter required at deploy time.
    - listitem:
      - button "Jira issue to GitLab MR Watch a Jira Cloud project for issues with a configurable label and automatically open a GitLab merge request for each new issue found. The target GitLab project is read from the ticket body - no repo parameter required at deploy time.":
        - heading "Jira issue to GitLab MR" [level=3]
        - paragraph: Watch a Jira Cloud project for issues with a configurable label and automatically open a GitLab merge request for each new issue found. The target GitLab project is read from the ticket body - no repo parameter required at deploy time.
    - listitem:
      - button "Research brief writer Monitor a topic, gather sources from the web, and publish a short brief for your team.":
        - heading "Research brief writer" [level=3]
        - paragraph: Monitor a topic, gather sources from the web, and publish a short brief for your team.
