  - paragraph: why does my useEffect run twice in dev?
  - img "Catai"
  - button "Hide thinking":
    - img
    - text: Hide thinking
  - text: React 18 StrictMode double-invokes effects in development to surface missing cleanups. Explain and show an abortable fetch.
  - paragraph:
    - text: That's
    - strong: React 18 StrictMode
    - text: . In development it mounts → unmounts → re-mounts every component once, so effects run twice. It doesn't happen in production builds.
  - paragraph: "It's there to catch effects that don't clean up after themselves. Make sure yours returns a cleanup:"
  - text: tsx
  - button "Copy code":
    - img
    - text: Copy
  - code: "useEffect(() => { const ctrl = new AbortController(); fetch(`/api/orders/${id}`, {signal: ctrl.signal}) .then(r => r.json()) .then(setOrder) .catch(err => { if (err.name !== 'AbortError') setError(err); }); return () => ctrl.abort(); }, [id]);"
  - paragraph: With the abort in place, the first request is cancelled and you only get one state update.
  - button "Copy message":
    - img
  - img "User"
  - paragraph: ok and if I use react-query instead?
  - img "Catai"
  - button "Show thinking":
    - img
    - text: Show thinking
  - paragraph: "Then you mostly stop caring. TanStack Query dedupes by query key, so the second mount just subscribes to the in-flight request:"
  - text: tsx
  - button "Copy code":
    - img
    - text: Copy
  - code: "const {data: order, error} = useQuery({ queryKey: ['order', id], queryFn: ({signal}) => fetch(`/api/orders/${id}`, {signal}).then(r => r.json()), });"
  - paragraph:
    - text: Passing
    - code: signal
    - text: through means it's also cancelled if the component unmounts for real.
