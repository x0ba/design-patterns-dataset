- heading "Westbrook Police Department" [level=3]:
  - link "Westbrook Police Department":
    - /url: /organizations/westbrook-police-department/
- paragraph:
  - text: The Westbrook Police Department serves roughly 240,000 residents across four districts. Incident data is published with a
  - strong: 7-day delay
  - text: and addresses are generalized to the hundred block to protect victim privacy.
- link " Open in GitHub":
  - /url: https://github.com/timwis/jkan/blob/main/_datasets/crime-incidents.md?plain=1
- heading "Crime Incidents Edit" [level=1]:
  - text: Crime Incidents
  - link "Edit":
    - /url: /editor/#/collections/datasets/entries/crime-incidents
- paragraph
- paragraph:
  - text: Part I and Part II crime incidents reported to the Westbrook Police Department, classified using
  - strong: NIBRS
  - text: offense codes since January 1, 2021 (UCR summary codes before that). Locations are generalized to the hundred block; incidents involving sexual offenses or juveniles have their location removed entirely.
- paragraph:
  - text: Note that these are
  - emphasis: reported
  - text: incidents and are subject to change as investigations proceed — an incident may be reclassified or unfounded weeks later. Data is published with a 7-day delay.
- list:
  - listitem:
    - text: Records before 2021 use
    - code: ucr_general
    - text: ; after, use
    - code: nibrs_code
  - listitem:
    - code: dispatch_date_time
    - text: is in local time (America/New_York)
  - listitem: About 2% of records cannot be geocoded and have empty coordinates
