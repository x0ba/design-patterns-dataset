  - textbox:
    - paragraph: Affinity mapping in FigJam with Hana + Sofia, 2 hrs. 12 interviews, ~240 stickies.
    - heading "Themes (ranked by frequency)" [level=2]
    - list:
      - listitem:
        - paragraph:
          - strong: "\"I can't find billing\""
          - text: — 9/12. Finance-adjacent users feel second-class.
      - listitem:
        - paragraph:
          - strong: Too many projects, no way to focus
          - text: — 7/12. Pinning / favorites requested by name 5 times.
      - listitem:
        - paragraph:
          - strong: Alert fatigue
          - text: — 6/12. Thresholds are workspace-wide; people want per-project.
      - listitem:
        - paragraph:
          - strong: Vocabulary
          - text: — workspace / project / environment confuses 5/12.
      - listitem:
        - paragraph:
          - strong: Exports are the real product
          - text: for 4/12.
    - heading "Opportunities" [level=2]
    - list:
      - listitem:
        - paragraph: Role-aware navigation (billing users see billing first)
      - listitem:
        - paragraph: Pins + recent projects in the rail
      - listitem:
        - paragraph: Per-project alert thresholds (needs eng spike, Priya)
      - listitem:
        - paragraph: Glossary tooltips? Cheap win.
    - paragraph: "Shared with #proj-dashboard-v3 on Aug 14."
