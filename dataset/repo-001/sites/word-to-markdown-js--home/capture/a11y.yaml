- banner:
  - link "Word to Markdown — home":
    - /url: /
    - text: w2m Word to Markdown
- main:
  - paragraph: Free · Open source · 100% in your browser
  - heading "Word to Markdown" [level=1]
  - paragraph:
    - text: Convert Word (
    - code: .docx
    - text: ) files to clean Markdown, entirely in your browser. Your files are never uploaded.
  - img "Word document → Markdown file": .docx .md
  - paragraph: Converting docs since 2014
  - region "Convert a document":
    - status
    - text: Drop your .docx here or click to choose a file Up to 20 MB · Converted on this device, never uploaded
    - button "Choose a .docx file"
    - paragraph: Google Doc? File → Download → Microsoft Word (.docx)
  - list:
    - listitem:
      - paragraph: Drop
      - paragraph: Drag in a .docx file, or click to choose one.
    - listitem:
      - paragraph: Convert
      - paragraph: "It converts in your browser: no server, no waiting."
    - listitem:
      - paragraph: Copy or save
      - paragraph: Copy the Markdown, download a .md file, or grab a .zip with your images.
  - link "Open and Async book cover From the maker I built this free tool — and I wrote the book on working in the open. Open & Async is a playbook for remote and distributed teams, drawing on more than a decade of remote-first lessons from GitHub. Buy now":
    - /url: https://open-and-async.com/?utm_source=word2md&utm_medium=referral&utm_campaign=card
    - img "Open and Async book cover"
    - text: From the maker I built this free tool — and I wrote the book on working in the open.
    - strong: Open & Async
    - text: is a playbook for remote and distributed teams, drawing on more than a decade of remote-first lessons from GitHub. Buy now
  - heading "What gets converted" [level=2]
  - table:
    - rowgroup:
      - row "Word element Markdown output":
        - columnheader "Word element"
        - columnheader "Markdown output"
    - rowgroup:
      - 'row "Headings # Heading"':
        - cell "Headings"
        - cell "# Heading":
          - code: "# Heading"
      - row "Bold & italic **bold** *italic*":
        - cell "Bold & italic"
        - cell "**bold** *italic*":
          - code: "**bold** *italic*"
      - row "Ordered & nested lists 1. item · - item":
        - cell "Ordered & nested lists"
        - cell "1. item · - item":
          - code: 1. item · - item
      - row "Tables | a | b |":
        - cell "Tables"
        - cell "| a | b |":
          - code: "| a | b |"
      - row "Links [text](url)":
        - cell "Links"
        - cell "[text](url)":
          - code: "[text](url)"
      - 'row "Code `code`"':
        - cell "Code"
        - 'cell "`code`"':
          - code: "`code`"
      - row "Images ![alt](image)":
        - cell "Images"
        - cell "![alt](image)":
          - code: "![alt](image)"
      - row "Strikethrough ~~text~~":
        - cell "Strikethrough"
        - cell "~~text~~":
          - code: ~~text~~
      - row "Superscript & subscript x<sup>2</sup>":
        - cell "Superscript & subscript"
        - cell "x<sup>2</sup>":
          - code: x<sup>2</sup>
      - row "Footnotes text[^1]":
        - cell "Footnotes"
        - cell "text[^1]":
          - code: text[^1]
  - heading "Going the other way?" [level=2]
  - paragraph: "To turn Markdown into a formatted Word document, use md2word.app. Same maker, same promise: it all happens in your browser."
  - link "Convert Markdown to Word":
    - /url: https://md2word.app/?utm_source=word2md&utm_medium=referral&utm_campaign=reverse
  - heading "Prefer the command line?" [level=2]
  - paragraph: Word to Markdown is free and open source. Run it as a command-line tool for scripted or batch conversions. Same converter, no browser needed.
  - link "Get the CLI":
    - /url: /developers/
  - heading "Frequently asked questions" [level=2]
  - group:
    - text: How do I convert a Word document to Markdown?
    - paragraph: Drag a .docx file onto the page (or click to browse). Word to Markdown converts it in your browser and shows the Markdown instantly. Copy it or download a .md file.
  - group: Is Word to Markdown free?
  - group: Are my documents uploaded to a server?
  - group: How do I convert a Google Doc to Markdown?
  - group: Can I convert a .doc file to Markdown?
  - group: What formatting is preserved?
  - group: How is this different from Pandoc?
  - group: Can I use this to prepare documents for ChatGPT, Claude, or other AI tools?
