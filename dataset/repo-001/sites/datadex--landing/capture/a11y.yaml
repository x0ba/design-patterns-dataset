    - link "Request Dataset":
      - /url: https://github.com/datonic/datadex/issues/new
  - paragraph:
    - text: Datadex is a
    - strong: fully open-source, serverless, and local-first Data Platform
    - text: that improves how communities collaborate on Open Data. Datadex is not a new tool, it is a pattern showing an opinionated bridge between existing ones.
  - heading "Principles" [level=3]
  - term: Open
  - definition:
    - text: Code, standards, infrastructure, and data, all public and open source. Rely on open source tools, standards, public infrastructure, and
    - link "accessible data formats":
      - /url: https://voltrondata.com/codex/a-new-frontier
    - text: .
  - term: Modular and Interoperable
  - definition: Easy to replace, extend or remove components of the pattern. Environment flexibility (laptop, cluster, browser) when running and when deploying (S3 + GH Pages, IPFS, Hugging Face).
  - term: Permissionless
  - definition: Any improvement is one Pull Request away. Update pipelines, add datasets, or improve documentation. No API limits, just plain open files.
  - term: Simple
  - definition: Static assets, batch jobs.
  - term: Data as Code
  - definition:
    - text: Reproducible datasets with declarative stateless transformations tracked in
    - code: git
    - text: . Data is versioned alongside the code. Models are reusable, packaged, and versioned.
  - term: Glue
  - definition: Be a bridge between tools and approaches. Follow UNIX philosophy.
