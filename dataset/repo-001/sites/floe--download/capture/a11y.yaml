- main:
  - paragraph: Download
  - heading "Floe Desktop" [level=1]
  - paragraph: The same encrypted, peer-to-peer transfer as floe.one, running as a native Windows app.
  - link "Get Floe Desktop from the Microsoft Store":
    - /url: https://apps.microsoft.com/detail/9NBQ8ZQ1065L
    - img "Get Floe Desktop from the Microsoft Store"
  - paragraph:
    - text: v1.1.1 · Nov 13, 2026 ·
    - link "Release notes":
      - /url: https://www.floe.one/docs/changelog
  - paragraph: From the Microsoft Store it installs with no warnings, and updates arrive automatically.
  - paragraph: Built for Windows 10 or later on 64-bit Intel and AMD processors (x64).
  - paragraph: It needs Microsoft WebView2, which most PCs already have; the Store build needs Windows 10 version 2004 or later.
  - text: floe desktop · 1.1.1
  - paragraph: "Demo of the Floe desktop app: three files are staged, then a share panel opens a live room with the code quiet-fetch-sled and a share link, waiting for the receiver."
  - heading "Other ways to run Floe" [level=2]
  - list:
    - listitem:
      - text: "GitHub release For machines without Store access: the installer and a portable zip (unzip and run floe-desktop.exe). These builds are not signed, so the first time you run one, Windows SmartScreen shows a warning: choose \"More info\", then \"Run anyway\"."
      - link "Installer .exe":
        - /url: https://github.com/jannskiee/floe/releases/download/desktop-v1.1.1/floe-desktop-setup-1.1.1.exe
      - link "Portable .zip":
        - /url: https://github.com/jannskiee/floe/releases/download/desktop-v1.1.1/floe-desktop-1.1.1-windows-amd64.zip
    - listitem:
      - text: Command line One file with nothing else to install, for servers, scripts, and machines with no screen.
      - link "Install the CLI":
        - /url: https://www.floe.one/docs/cli/installation
    - listitem:
      - text: Checksums SHA-256 sums for every asset, this release on GitHub, and the full release history.
      - link "SHA256SUMS.txt":
        - /url: https://github.com/jannskiee/floe/releases/download/desktop-v1.1.1/SHA256SUMS.txt
      - link "This release":
        - /url: https://github.com/jannskiee/floe/releases/tag/desktop-v1.1.1
      - link "All releases":
        - /url: https://github.com/jannskiee/floe/releases
    - listitem:
      - text: Feedback Found a bug? A report is the most useful thing you can send.
      - link "Open an issue":
        - /url: https://github.com/jannskiee/floe/issues
