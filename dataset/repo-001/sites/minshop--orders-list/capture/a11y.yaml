- complementary:
  - link "Fernwood Supply Co.":
    - /url: /
  - checkbox "Toggle admin sections"
  - navigation:
    - link "Dashboard":
      - /url: /admin
    - link "Products":
      - /url: /admin/products
    - link "Orders":
      - /url: /admin/orders
    - link "Customers":
      - /url: /admin/customers
    - link "Categories":
      - /url: /admin/categories
    - link "Pages":
      - /url: /admin/pages
    - link "Navigation":
      - /url: /admin/navigation
    - link "Shipping":
      - /url: /admin/shipping
    - link "Media":
      - /url: /admin/media
    - link "Settings":
      - /url: /admin/settings
  - link "← View store":
    - /url: /
  - link "Log out":
    - /url: /admin/logout
- main:
  - heading "Orders" [level=1]
  - searchbox "Find an order by number or ID"
  - button "Find"
  - link "Export CSV":
    - /url: /admin/orders/export.csv
  - text: Payment
  - combobox "Payment":
    - option "All payments" [selected]
    - option "Paid"
    - option "Partially refunded"
    - option "Refunded"
    - option "Unpaid"
  - text: Fulfillment
  - combobox "Fulfillment":
    - option "Any fulfillment" [selected]
    - option "Unfulfilled"
    - option "Fulfilled"
  - text: Method
  - combobox "Method":
    - option "All methods" [selected]
    - option "Card (Stripe)"
    - option "Lightning"
    - option "Bitcoin (OpenNode)"
    - option "Demo"
  - button "Apply"
  - table:
    - rowgroup:
      - 'row "Order # Public ID Email Total Status Fulfillment When"':
        - 'columnheader "Order #"':
          - 'link "Order #"':
            - /url: /admin/orders?sort=order&dir=desc
        - columnheader "Public ID"
        - columnheader "Email":
          - link "Email":
            - /url: /admin/orders?sort=email&dir=desc
        - columnheader "Total":
          - link "Total":
            - /url: /admin/orders?sort=total&dir=desc
        - columnheader "Status":
          - link "Status":
            - /url: /admin/orders?sort=status&dir=desc
        - columnheader "Fulfillment":
          - link "Fulfillment":
            - /url: /admin/orders?sort=fulfillment&dir=desc
        - columnheader "When":
          - link "When":
            - /url: /admin/orders?sort=when&dir=desc
