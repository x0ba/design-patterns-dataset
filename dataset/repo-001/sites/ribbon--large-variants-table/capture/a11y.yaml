    - link "close":
      - /url: "#"
      - text: ×
    - paragraph:
      - strong: "Info:"
      - text: Loading data from permalink
  - heading "Ribbon Settings" [level=4]
  - list:
    - listitem:
      - link "Input alignments":
        - /url: "#tab_input_alignments"
    - listitem:
      - link "Information" [expanded]:
        - /url: "#tab_data_description"
    - listitem:
      - link "Multi-read settings" [expanded]:
        - /url: "#tab_region_settings"
    - listitem:
      - link "Single-read settings" [expanded]:
        - /url: "#tab_settings"
    - listitem:
      - link "Large variants" [expanded]:
        - /url: "#tab_bedpe_table_panel"
    - listitem:
      - link "Small variants" [expanded]:
        - /url: "#tab_variant_input_panel"
    - listitem:
      - link "Features" [expanded]:
        - /url: "#tab_feature_input_panel"
    - listitem:
      - link "Automation" [expanded]:
        - /url: "#tab_automation"
  - paragraph: Please load large variants through SplitThreader, then they will appear here.
  - paragraph: Large variants are those that split reads into multiple alignments, e.g. translocations and other variants between positions more than around 1kb apart. These are shown as connections. The smaller variants can be loaded under the "Small variants" tab.
  - paragraph: Showing only the first 1000 variants. Sort by clicking column names, and filter by typing into the text boxes for each column. For instance, type >20 or =chr2. Separate multiple filters in a single column using spaces. For bam files, click on a row in the table to fetch reads around that feature.
