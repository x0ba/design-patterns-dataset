- text: "What is the Initial Value? In variables, the Initial value is a variable's value which will be cloud-synced and shared with your team. The variable with `initial value` can be set in collection, environment, and Globals What is Current Value ? The `current value` is used while sending the request in Firecamp. This value is never synced to the cloud. If left untouched, the current value automatically assumes the `Initial Value`"
