      - list:
        - listitem: Key pointsGood overview of methods for carbon stock estimates — use Table 2 for comparison with our Kiel Bight cores.They use a 1 m reference depth; we use 25 cm. Need to convert before comparing.Discussion of allochthonous carbon is weak.
