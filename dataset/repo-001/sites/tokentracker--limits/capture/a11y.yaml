  - text: ZCode Not connected OpenCode Go Not connected Connect OpenCode Go Reads your OpenCode Go usage from the official API (opencode.ai/zen/go/v1/usage).
  - list:
    - listitem:
      - text: 1 Sign in at opencode.ai and subscribe to Go.
      - link "Open opencode.ai":
        - /url: https://opencode.ai
    - listitem: 2 Create and copy an API key in the console.
    - listitem:
      - text: 3 Paste your API key below. TokenTracker stores it on this device and uses it only to read your Go usage.
      - textbox "Paste API key"
      - button "Save key" [disabled]
      - text: Stored only on this device (owner-only permissions). TokenTracker sends it only to the provider's usage API.
  - text: Command Code Not connected Connect Command Code Reads your subscription usage from the official Command Code API with the same login as the cmd CLI.
  - list:
    - listitem: "1 Option 1 — sign in with the Command Code CLI (recommended): run the login command below. TokenTracker reuses that login with no restart. cmd login"
    - listitem:
      - text: 2 Or save an API key here — TokenTracker uses it only for usage requests.
      - textbox "Paste API key"
      - button "Save key" [disabled]
      - text: Stored only on this device (owner-only permissions). TokenTracker sends it only to the provider's usage API.
  - text: Qoder Not connected Qoder CN Not connected Ark Coding Plan Not connected Connect Ark Coding Plan Quota is read from the official Ark CLI (arkcli) on this machine.
  - list:
    - listitem:
      - text: 1 Install the Ark CLI from npm.
      - link "View install guide":
        - /url: https://www.volcengine.com/docs/82379/2536875
    - listitem: "2 Sign in with your Volcengine account (browser SSO recommended). Headless / remote terminals: arkcli auth login --no-browser"
    - listitem:
      - text: "3 Run these, then refresh this page:"
      - button "Copy"
      - text: "npm install -g @volcengine/ark-cli arkcli auth login volc-sso # browser SSO (recommended) arkcli auth status # verify the session Refresh after signing in — no app restart needed."
