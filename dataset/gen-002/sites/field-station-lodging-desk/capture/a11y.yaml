- heading "Your list for today" [level=2]
- text: 0 of 6 done
- list:
  - listitem:
    - text: "1 Settle 4 tentative bookings Confirm a name only after the course has confirmed it in writing. Anything still tentative at 17:00 returns to free stock. Due: Before 17:00 today"
    - link "Open People":
      - /url: "#/people"
  - listitem:
    - text: "2 Name or release 2 unnamed hold bunks Name a person (they start as tentative), or release the bunk. A released bunk drops out of the kitchen count. Due: Before 17:00 today"
    - link "Open People":
      - /url: "#/people"
  - listitem:
    - text: "3 Move 2 course members out of Manglar Manglar is \"Restricted – permit housing\" for MINAE permit inspectors, 25–27 Nov. A course stay covers those nights, so the cabin cannot be used. Due: Today"
    - link "Open Bunks":
      - /url: "#/bunks/MAN-1"
  - listitem:
    - text: "4 Get 4 waivers on file Check-in and boat boarding are blocked until each signed waiver is on file. Their bunk assignments are not affected. Due: Before the boat, Wed 13:30"
    - link "Open People":
      - /url: "#/people"
  - listitem:
    - text: "5 Send the kitchen the corrected count for Wed 18 Nov The kitchen sheet still says 27 for dinner. Send breakfast and lunch as residents only, and dinner at the confirmed number, then update it after 17:00. Due: Today"
    - link "Open Meals":
      - /url: "#/meals"
  - listitem:
    - text: "6 Send the boat manifest to the captain Trip 1 at 13:30 is 14 of 14 seats. Trip 2 is listed for 15:00, and that time still needs confirming. Due: Today"
    - link "Open Transfers":
      - /url: "#/transfers"
