  - button "Following playback"
  - text: 1 Praça da Ribeira — meeting point
  - button "0:00:00"
  - button "0:00:00"
  - paragraph: "[Recording starts — street noise, Praça da Ribeira]"
  - button "0:00:14"
  - text: Inês
  - paragraph: Bom dia, good morning everyone! Okay, I think we are all here — eight of you, perfect. My name is Inês, I'm a licensed guide here in Porto, and I was born about fifteen minutes up that hill, so I'm a little biased about this city.
  - button "0:00:52"
  - text: Inês
  - paragraph: Today is a new walk for me, so you are my first group on this route — which means if something is boring, you tell me. Honestly. That's the deal.
  - button "0:01:20"
  - text: Guest
  - paragraph: Do we get a discount for being the guinea pigs?
  - button "0:01:24"
  - text: Inês
  - paragraph: (laughs) You get extra bolinhos de bacalhau. That's better than a discount.
  - button "0:01:40"
  - text: Inês
  - paragraph: So, the plan. Two hours, nine stops, all of it within maybe one kilometre of where we're standing. We'll eat twice, we'll drink a little port at the end, and in between I want to show you how this riverbank made Porto rich — the boats, the merchants, the tiles, all of it.
  - button "0:02:35"
  - text: Inês
  - paragraph: Before we start — the weather. They said rain this morning and look, nothing. In Porto we say if you don't like the weather, wait ten minutes. Last week I had a group with sun, then hail, then sun again, inside one hour…
  - button "0:04:05"
  - text: Inês
  - paragraph: …anyway. Okay, the square. Praça da Ribeira. What you're standing on was the heart of the river trade for about six hundred years. Fish, salt, wine, cloth — everything came up the Douro or in from the sea and was sold right here.
  - button "0:05:20"
  - text: Inês
  - paragraph: See the fountain with the cube on top? That's modern, from 2000, by the sculptor João Cutileiro — São João, our saint, as a boy. People either love it or hate it. I'll let you decide.
  - button "0:06:10"
  - text: Inês
  - paragraph: And the houses behind — tall and thin, painted every colour. They're thin because you paid tax on how much street front you had. So everyone built up, not wide.
  - button "0:07:15"
  - text: Inês 0:07:15 weather bit again — say it once, cut this
  - paragraph: Right — one more thing about the weather, sorry, because you will need this — if you want an umbrella, the shop by the arches sells them for five euros, don't pay more…
  - button "0:08:20"
  - text: Inês
  - paragraph: Okay! Let's go down to the water. Two minutes. Watch the tram rails, they're slippery when wet.
  - button "0:08:45"
  - paragraph: "[Walking — group moves toward the quay]"
  - text: 2 Cais da Ribeira & the rabelo boats
  - button "0:09:40"
  - button "0:09:40"
  - text: Inês
  - paragraph: "So — the boats. These wooden ones with the big square sail: barcos rabelos. For centuries this was the only way to bring wine down from the Douro valley, about a hundred kilometres upriver."
  - button "0:10:35"
  - text: Inês
  - paragraph: The river was wild then — rapids, rocks, no dams. The man steering stood on that high platform at the back, with that long oar, the espadela. It needed four, five men just to hold it.
  - button "0:11:40"
  - text: Guest
  - paragraph: How many barrels would one carry?
  - button "0:11:44"
  - text: Inês
  - paragraph: Good question — the big ones, around sixty pipes. A pipe is about 550 litres. So you do the maths, that's a lot of wine on a flat boat with no keel.
  - button "0:12:30"
  - text: Inês
  - paragraph: And many sank. Many. There are families in the valley who still talk about the grandfather who didn't come home.
  - button "0:13:20"
  - text: Inês
  - paragraph: Today the wine comes by road, of course, and the rabelos you see are for the regatta every 24th of June, São João, and for photos. The port houses across the river each have one with their name on the sail.
  - button "0:14:40"
  - text: Inês
  - paragraph: Across there — Vila Nova de Gaia. Technically a different city. Don't say that to anyone from Gaia; they get very… Gaia.
  - button "0:15:30"
  - text: Inês
  - paragraph: The lodges are on that side because it faces north — cooler, more stable for ageing wine. And the merchants liked that they could keep the wine out of Porto's tax.
  - button "0:16:45"
  - text: Inês
  - paragraph: Up there, the Dom Luís I bridge. 1886. Two decks. People will tell you Eiffel built it — he didn't. It was his former partner, Théophile Seyrig. Eiffel did the other one, the Maria Pia, upriver.
  - button "0:18:05"
  - text: Guest 2
  - paragraph: Can we walk across it?
  - button "0:18:08"
  - text: Inês
  - paragraph: The top deck, yes — with the metro going past your elbow. Do it at sunset, after the tour. Tonight, ideally.
  - button "0:18:40"
  - text: Inês
  - paragraph: Okay, I'm going to take you into the back streets now — where the people who did the actual work lived. And we're going to eat. Follow me, it's steep for thirty seconds.
  - button "0:19:10"
  - paragraph: "[Walking — Rua de São João, uphill]"
  - button "0:21:30"
  - text: Inês
  - paragraph: Here, slow down, the door on the left with the green frame.
  - text: 3 Adelino's — bolinhos de bacalhau
  - button "0:22:05"
  - button "0:22:05"
  - text: Inês
  - paragraph: Okay, this is Adelino's. Everyone in? Squeeze, squeeze. He's been frying here for thirty-one years.
  - button "0:23:00"
  - text: Inês
  - paragraph: "So the plate coming now: bolinhos de bacalhau. Codfish cakes. Salt cod, potato, egg, parsley, a bit of onion. Fried in that pan you can see, which I promise is cleaner than it looks."
  - button "0:24:20"
  - text: Inês
  - paragraph: Funny thing — the cod is not Portuguese. Not one of these fish swam in our waters. It's from Norway, from Newfoundland. We've been sailing up there to catch it since the 1500s, and salting it on the boats so it survived the trip home.
  - button "0:25:45"
  - text: Guest
  - paragraph: So why is it the national dish if it isn't from here?
  - button "0:25:50"
  - text: Inês
  - paragraph: Because it kept. No fridges. A salted cod lasts for months. And the Church had many fasting days with no meat — more than a hundred a year — so cod became the food of everyone. Rich, poor, everyone.
  - button "0:27:30"
  - text: Inês
  - paragraph: We say there are three hundred and sixty-five recipes for bacalhau, one for every day of the year. My mother says it's more like a thousand, and hers is the only correct one.
  - button "0:28:40"
  - paragraph: "[Plates arrive — eating, background chatter]"
  - button "0:31:40"
  - text: Inês
  - paragraph: Adelino — Senhor Adelino, here — he learned from his mother, who had a stall at the Bolhão market. Say obrigado to him, he loves it.
  - button "0:32:15"
  - text: Guest
  - paragraph: Obrigado!
  - button "0:32:20"
  - text: Inês
  - paragraph: Perfect, very good accent. Now — the drink. This is vinho verde. Green wine, but it's not green, it's young. Light, a little sparkle, cold. Perfect with fried things.
  - button "0:33:45"
  - text: Inês
  - paragraph: It comes from the Minho, north of here. Rainy, green country — that's where the name comes from, people say, though the winemakers will tell you it's about the young age of the wine.
  - button "0:35:10"
  - text: Inês
  - paragraph: Who wants another one? There's a second plate. Don't be shy, it's included.
  - button "0:36:24"
  - text: Inês
  - paragraph: While you finish — look at the photo on the wall above the till. That's this street in 1952. Same doorways. Same washing on the line. The only thing missing is the cars.
  - button "0:37:30"
  - text: Inês
  - paragraph: This neighbourhood almost disappeared. In the seventies and eighties it was poor, very poor, buildings falling down. Then in 1996 UNESCO listed the historic centre, and money came for restoration.
  - button "0:39:05"
  - text: Guest
  - paragraph: Is it mostly tourist flats now?
  - button "0:39:10"
  - text: Inês
  - paragraph: Honestly? A lot of it, yes. It's a real problem. Many of the families who lived here for generations have moved out to Gondomar, to Valongo, because rents went crazy. Adelino lives upstairs, he owns it — that's why he's still here.
  - button "0:41:15"
  - text: Inês
  - paragraph: I don't want to be the guide who only tells you nice things. This is a beautiful place and also a complicated one.
  - button "0:42:30"
  - text: Inês
  - paragraph: Okay. Five more minutes, finish your wine, use the bathroom if you need — it's through the kitchen, Adelino doesn't mind.
  - button "0:43:00"
  - paragraph: "[Break — background chatter]"
  - button "0:46:20"
  - text: Inês
  - paragraph: Right, everybody ready? Our next stop is two minutes up, and it's my favourite on this route. Bring your cameras.
  - button "0:46:40"
  - paragraph: "[Walking — Rua de São Nicolau]"
  - text: 4 São Nicolau church — the tile façade
  - button "0:48:10"
  - button "0:48:10"
  - text: Inês
  - paragraph: Okay, stop here, here, on this side, so you can see the whole front. Look up.
  - button "0:48:30"
  - text: Inês
  - paragraph: This is the church of São Nicolau. Saint Nicholas — patron of sailors, which makes sense, right? We are two hundred metres from the river.
  - button "0:49:15"
  - text: Inês
  - paragraph: And the front — the tiles. Azulejos. Blue and white, from the doorway almost to the roof. This is the thing people come to Porto to photograph, and most of them don't know what they're looking at.
  - button "0:50:20"
  - text: Inês
  - paragraph: The word azulejo — people think it comes from azul, blue. It doesn't. It's from Arabic, al-zulayj, a little polished stone. The blue came later.
  - button "0:51:20"
  - text: Inês
  - paragraph: The church itself is older than the tiles. There was a fire, the church was rebuilt in the eighteenth century, and the tiles…
  - button "0:52:30"
  - text: Inês 0:52:30 wrong year — 1739?
  - paragraph: …the tiles you see were put up in 1739, during the great period of blue-and-white, when every church in Portugal wanted to be covered.
  - button "0:53:25"
  - text: Inês
  - paragraph: Look at how they're painted — each tile is one piece of a bigger picture. The painter worked on the whole wall laid out flat on the floor of the workshop, then they numbered every tile on the back and carried them here.
  - button "0:54:40"
  - text: Inês
  - paragraph: If you get close — not now, later — you can see some tiles are a slightly different blue. Those are replacements. Some from the fifties, some from much later.
  - button "0:55:30"
  - text: Inês
  - paragraph: The scene in the middle panel is Saint Nicholas himself. You can see the three bags of gold — the story where he throws gold through a window so three poor girls could marry.
  - button "0:56:40"
  - text: Inês
  - paragraph: And on the sides, the patterns — those geometric ones, they're repeated, like a wallpaper. That's a much older style, a carpet style, and actually it's the oldest idea in Portuguese tiles…
  - button "0:57:48"
  - text: Guest
  - paragraph: Sorry — were these made here in Porto, or did they come from Lisbon?
  - button "0:58:05"
  - text: Inês
  - paragraph: Oh! Good question. Okay, so — this is something I love. Porto had its own factories. The most famous was Massarelos, right down the river, just past the Alfândega — founded in 1766, I think, the oldest one in the city.
  - button "0:59:20"
  - text: Inês
  - paragraph: And my grandmother — sorry, I have to tell you this — my grandmother's house in Ovar, which is south of here, the whole front is tiles. Green ones, with a little raised pattern, so when the sun moves the colour changes. Ovar is full of these houses, they call it the city-museum of the azulejo.
  - button "1:00:40"
  - text: Inês 1:00:40 cut here?
  - paragraph: When I was small I used to count them. Four hundred and twelve tiles on the front. I counted many times because I always lost my place at the window.
  - button "1:01:30"
  - text: Guest
  - paragraph: (laughs) Is the house still in the family?
  - button "1:01:35"
  - text: Inês
  - paragraph: It is! My uncle lives there. But — and this is the sad part — two years ago someone came in the night and took eleven tiles off the front. With a chisel. Just gone.
  - button "1:02:40"
  - text: Inês
  - paragraph: Because there's a whole black market. Old tiles from Porto and Lisbon, sold to collectors, in antique shops, online. Some go to Brazil, to the States.
  - button "1:03:10"
  - text: Inês
  - paragraph: There's a project in Lisbon — SOS Azulejo, it started with the Judiciary Police and the museums — and they keep a database of stolen tiles so the police can identify them. My uncle registered ours. They never came back.
  - button "1:04:30"
  - text: Guest 2
  - paragraph: Is it legal to buy them at all? I saw some at a market.
  - button "1:04:35"
  - text: Inês
  - paragraph: Ah — the Vandoma? The Saturday flea market? Okay. So, it's complicated. Modern copies, totally fine. Old ones, if they have mortar on the back — that's the sign it came off a wall. Then you have to ask where.
  - button "1:06:05"
  - text: Inês
  - paragraph: And the sellers will tell you, oh, it's from a demolition. Sometimes true. A lot of buildings were demolished in the sixties, seventies. Sometimes not true.
  - button "1:07:00"
  - text: Inês
  - paragraph: My cousin is a restorer, she works for the city, and she says the worst thing is the gaps — once one tile is gone, water gets behind, and in five years you lose twenty more.
  - button "1:08:15"
  - text: Guest
  - paragraph: Is that why the station is so famous? São Bento — all the tiles?
  - button "1:08:20"
  - text: Inês
  - paragraph: São Bento! Oh, you have to go. Twenty thousand tiles, Jorge Colaço, the battles, the history of transport — finished around 1916. And it's free, it's a working station, you just walk in.
  - button "1:09:40"
  - text: Inês
  - paragraph: Colaço also did the side of the Santo Ildefonso church, up at Batalha. And the Capela das Almas, on Santa Catarina — that's Eduardo Leite, 1929, I think — that one is the whole outside covered, sixteen thousand tiles.
  - button "1:11:00"
  - text: Inês
  - paragraph: If you only have time for one, Capela das Almas at about five in the afternoon, when the light comes along the street. I take my nieces there. They're bored after four minutes, but four minutes is enough.
  - button "1:12:10"
  - text: Inês
  - paragraph: And then there's the Fábrica Sant'Anna in Lisbon, still making them by hand, you can buy one there that's not stolen —
  - button "1:12:45"
  - text: Guest
  - paragraph: (laughs) Good to know.
  - button "1:12:50"
  - text: Inês
  - paragraph: "— and my grandmother would want me to say: buy the new ones. Leave the old ones on the walls."
  - button "1:13:52"
  - text: Inês
  - paragraph: Okay — I have completely lost track of time. Sorry! Back to this church. Where was I?
  - button "1:14:10"
  - text: Guest 2
  - paragraph: Saint Nicholas, the gold.
  - button "1:14:13"
  - text: Inês
  - paragraph: Thank you. Yes. So the three bags of gold — that's why he becomes Santa Claus, eventually. Saint Nicholas, Sinterklaas, Santa Claus. The gift through the window.
  - button "1:15:20"
  - text: Inês
  - paragraph: Inside, normally I'd take you in — there's gilded woodwork, talha dourada, the gold carving Porto is famous for. But there's a mass right now, so we'll respect that.
  - button "1:16:30"
  - text: Inês
  - paragraph: "What I want you to take from here: when you walk around Porto today, look at the walls. Every tile you see was painted by a person. And many of them are on houses, not churches — that's the Porto thing. We'll see some in a minute."
  - button "1:17:40"
  - text: Guest
  - paragraph: Can we go inside after the mass?
  - button "1:17:44"
  - text: Inês
  - paragraph: Mass ends at eleven-thirty, so — yes, after the tour, absolutely. It's free. Just be quiet and no flash photos.
  - button "1:18:30"
  - text: Inês
  - paragraph: Okay. Photos now, two minutes, then we walk. Take one with the doorway — the light is good right now.
  - button "1:18:50"
  - paragraph: "[Photos — group chatter]"
  - button "1:20:40"
  - text: Inês
  - paragraph: Right, let's go. Up the steps on the left, Rua da Reboleira. Hold the rail.
  - button "1:21:00"
  - paragraph: "[Walking]"
  - text: 5 Rua da Reboleira — medieval houses
  - button "1:21:55"
  - button "1:21:55"
  - text: Inês
  - paragraph: This street is one of the oldest in Porto. Rua da Reboleira. Look at the house with the tower — number 59 — that's a medieval merchant house, fourteenth century, one of very few left.
  - button "1:23:10"
  - text: Inês
  - paragraph: The ground floor was the warehouse — goods from the river came straight in. The family lived upstairs, away from the damp and the smell.
  - button "1:24:30"
  - text: Inês
  - paragraph: And look at the next houses along — narrow, iron balconies, and the tiles on the front. You see? Now you know how to look.
  - button "1:25:30"
  - text: Inês
  - paragraph: These are a different style from the church. Small, patterned, repeating — sometimes in relief, so they catch the light. Like my grandmother's house, which I already told you about. (laughs)
  - button "1:26:40"
  - text: Inês 1:26:40 said 'from the 1850s' — check lecture
  - paragraph: "Tiles on the outside of houses became fashionable from the 1850s. Before that, tiles were for inside — churches, palaces, kitchens. Outside it was practical: it protects from the rain, and it's easy to wash."
  - button "1:28:00"
  - text: Guest
  - paragraph: So the church front came later than the inside?
  - button "1:28:04"
  - text: Inês
  - paragraph: Hm. Good question. I… I'll check that for you, actually. I don't want to tell you something wrong.
  - button "1:28:40"
  - text: Inês
  - paragraph: Okay, the doorways — look at the stone. Granite. Everything in Porto is granite, it's why the city looks grey when it rains and gold when it's sunny.
  - button "1:30:10"
  - text: Inês
  - paragraph: And the little shrine on the corner, with the candle — that's still looked after by a lady who lives here. Dona Fernanda. She's ninety-one. She changes the flowers every Thursday.
  - button "1:31:20"
  - text: Inês
  - paragraph: Next stop — lunch, part two. It's very traditional, and I'm going to ask you to be brave.
  - button "1:31:45"
  - paragraph: "[Walking — Rua dos Mercadores]"
  - text: 6 Dona Rosa's — tripas à moda do Porto
  - button "1:33:20"
  - button "1:33:20"
  - text: Inês
  - paragraph: This is Dona Rosa's. Sit, sit, the long table at the back is ours.
  - button "1:34:05"
  - text: Inês
  - paragraph: So. Why are people from Porto called tripeiros — tripe eaters? The story is 1415. The fleet leaving for Ceuta, in North Africa. Porto gave all its meat to the sailors, and kept only the tripe for itself.
  - button "1:35:40"
  - text: Inês
  - paragraph: Is it true? Historians argue. But we're proud of it. And this dish — tripas à moda do Porto — tripe with white beans, chouriço, carrot, cumin. It's Sunday food.
  - button "1:37:00"
  - text: Guest 2
  - paragraph: I'll try it, but I'm not promising anything.
  - button "1:37:04"
  - text: Inês
  - paragraph: That's all I ask. Half the group usually loves it. The other half loves the bread.
  - button "1:37:40"
  - paragraph: "[Food arrives — eating, chatter]"
  - button "1:41:05"
  - text: Inês 1:41:05 slow food line — keep
  - paragraph: The trick with tripas is it cooks for hours. Dona Rosa starts at six in the morning. It's not fast food. It's the opposite of fast food. It's slow food that somehow became the city's whole personality.
  - button "1:42:30"
  - text: Guest
  - paragraph: Okay, I'll admit, the beans are amazing.
  - button "1:42:35"
  - text: Inês
  - paragraph: See? Converted.
  - button "1:43:10"
  - text: Inês
  - paragraph: Dona Rosa's daughter, Paula, is the one who'll run it next — say hello, she's at the counter. Third generation.
  - button "1:45:00"
  - text: Inês
  - paragraph: While you eat — let me tell you about the merchants who lived on this street. Rua dos Mercadores, literally merchants' street. Cloth, mostly. Flemish cloth, English wool coming in, wine going out.
  - button "1:47:20"
  - text: Inês
  - paragraph: The English connection is very old — the Treaty of Windsor, 1386, the oldest alliance in the world still in force. Porto and England have been doing business for more than six hundred years.
  - button "1:49:30"
  - text: Guest
  - paragraph: Is that why the port houses have English names?
  - button "1:49:34"
  - text: Inês
  - paragraph: Exactly. Taylor's, Croft, Graham's, Sandeman — Sandeman was Scottish, but don't tell him. The English came for the wine, stayed for the money.
  - button "1:51:00"
  - paragraph: "[Eating — background chatter]"
  - button "1:55:10"
  - text: Inês
  - paragraph: Okay, coffee for those who want — a cimbalino, that's what we call an espresso here in Porto. In Lisbon they say bica. Don't mix them up.
  - button "1:57:40"
  - text: Inês
  - paragraph: Right. Let's walk off this lunch. Down to the square with the statue.
  - button "1:58:00"
  - paragraph: "[Walking]"
  - text: 7 Praça do Infante & Palácio da Bolsa
  - button "1:58:40"
  - button "1:58:40"
  - text: Inês
  - paragraph: "Okay — the man on the column: Infante Dom Henrique. Henry the Navigator. Born in Porto, 1394, a few metres from here, in the house that's now a museum."
  - button "1:59:50"
  - text: Inês
  - paragraph: He didn't navigate anything himself, by the way. He paid for others to do it. The first great sponsor.
  - button "2:00:50"
  - text: Inês
  - paragraph: Behind you, the Palácio da Bolsa — the old stock exchange. Built by the merchants' association from 1842. The Arab Room inside is unbelievable — all gold and patterns. Book a visit, it's guided only.
  - button "2:02:30"
  - text: Guest
  - paragraph: Is it worth the ticket?
  - button "2:02:33"
  - text: Inês
  - paragraph: For the Arab Room alone, yes. Twenty minutes, in and out.
  - button "2:03:20"
  - text: Inês
  - paragraph: The Bolsa was built on the ruins of the São Francisco convent — which burned during the siege, in 1832. Which brings us to the church right next door.
  - button "2:05:30"
  - paragraph: "[Walking — a few metres]"
  - text: 8 São Francisco church (outside)
  - button "2:06:15"
  - button "2:06:15"
  - text: Inês
  - paragraph: "From outside it looks simple — Gothic, grey, a bit severe. Inside, it's the opposite: most of the walls are covered in gilded carving. Something like three hundred kilos of gold, people say."
  - button "2:07:40"
  - text: Inês
  - paragraph: In the nineteenth century the bishop said it was too much — people weren't praying, they were staring. So it was closed for worship. It's a museum now.
  - button "2:09:00"
  - text: Inês
  - paragraph: There are catacombs underneath — the merchant families were buried there. You can still see the numbered tombs.
  - button "2:09:50"
  - text: "Inês 2:09:50 siege fire: said 1832 AND 1833"
  - paragraph: The fire I mentioned, at the convent — it was the siege, 1833, when the liberals were defending the city…
  - button "2:11:00"
  - text: Guest 2
  - paragraph: How long was the siege?
  - button "2:11:03"
  - text: Inês
  - paragraph: About a year. Hunger, cholera. Porto got the title "Invicta" — the unconquered — from that time. You'll see it on the city crest.
  - button "2:12:20"
  - text: Inês
  - paragraph: Okay! Last stop, and it's the one you've been waiting for.
  - button "2:12:40"
  - paragraph: "[Walking — Cais da Estiva]"
  - text: 9 Cais da Estiva — port tasting & wrap-up
  - button "2:13:30"
  - button "2:13:30"
  - text: Inês
  - paragraph: Here we are. Sit, there's a glass for everyone. This one is a ten-year-old tawny. Smell it first.
  - button "2:14:40"
  - text: Inês
  - paragraph: Port is wine where they stop the fermentation with grape spirit — brandy, basically. That keeps the sugar and makes it strong, about twenty percent.
  - button "2:16:00"
  - text: Inês
  - paragraph: Tawny ages in small barrels, so it touches the wood a lot — nutty, caramel. Ruby ages in big vats, stays fruity, red. Both are good, both are Porto.
  - button "2:17:30"
  - text: Guest
  - paragraph: This is dangerous. It tastes like dessert.
  - button "2:17:34"
  - text: Inês
  - paragraph: That's why we drink it slowly. (laughs)
  - button "2:18:20"
  - text: Inês
  - paragraph: So — that's the walk. Thank you for being my first group on this one. I'll send you all a map tonight with the places we went, and the São Bento and Capela das Almas tips.
  - button "2:19:30"
  - text: Inês
  - paragraph: And please — tell me honestly — what was too long? What would you cut?
  - button "2:19:45"
  - text: Guest
  - paragraph: Honestly? Maybe the church was a bit long. But I loved the grandmother story.
  - button "2:19:55"
  - text: Inês
  - paragraph: (laughs) Everyone loves the grandmother. Okay. Noted. Obrigada, everyone!
  - button "2:20:30"
  - paragraph: "[Goodbyes — group disperses]"
  - button "2:21:50"
  - paragraph: "[Recording ends]"
  - text: End of recording · 2:22:14
