  - region "Transcript":
    - heading "Transcript" [level=2]
    - text: click a line to jump there
    - heading "1 The smoke arrives" [level=3]
    - list:
      - listitem:
        - 'button "0:04 Good morning, Eastbank. It''s just after midnight on Friday, September eleventh, and this is what clean air looks like: forty-six backyard sensors and the regional monitor, all reading under nine. Fri 1:00 a.m."'
      - listitem:
        - button "0:47 Friday afternoon. Nothing yet. The smoke has been forecast for days, but the map is still green. Fri 1:00 p.m."
      - listitem:
        - button "1:07 Around seven the whole map turns yellow, nearly at once. That tells us it's a front moving through, not one backyard fire. Fri 6:40 p.m."
      - listitem:
        - button "1:19 By ten p.m. readings are climbing toward thirty. Remember these numbers; by Tuesday they will look small. Fri 10:00 p.m."
      - listitem:
        - button "1:30 Saturday, one a.m. The typical sensor reads thirty-five. Linden is right in the pack. Sat 1:00 a.m."
      - listitem:
        - 'button "1:48 Saturday dawn. Most sensors are in the low forties, orange on the map. That''s the level for sensitive groups: children, older neighbors, anyone with asthma. Sat 6:00 a.m."'
      - listitem:
        - button "2:03 It did not arrive with a bang. It crept in over about a day. Sat 10:10 a.m."
    - heading "2 Three days of haze" [level=3]
    - list:
      - listitem:
        - button "2:11 Saturday afternoon to Monday evening is what I call the long haze. Nothing dramatic here. The regional monitor and our backyard sensors agree, mostly in the forties. Sat 12:30 p.m."
      - listitem:
        - button "2:28 Notice that evenings run higher than afternoons. Smoke settles as the air cools, and low spots like Millrace and Linden collect it first. Sat 7:00 p.m."
      - listitem:
        - button "2:56 Sunday, 6:20 a.m. The sensor on the 100 block of 12th Street in Millrace stops reporting, and never comes back. A hollow circle means offline. We don't know what the air is doing there; it does not mean clean. Sun 6:20 a.m."
      - listitem:
        - button "3:35 Sunday night a second sensor, in Alder Terrace, goes dark. It will be back Monday morning. Sun 9:50 p.m."
      - listitem:
        - button "4:16 Monday, 2:30 p.m. Sycamore Hill's sensor on the 1400 block of Ridge Road drops out too. Now we are listening with forty-four ears, not forty-six. Mon 2:30 p.m."
    - heading "3 Night of the 14th at Linden Elementary" [level=3]
    - list:
      - listitem:
        - button "4:30 It's eight o'clock Monday night, September fourteenth. Look at the five sensors around Linden Elementary. They read in the high thirties, same as everywhere else in Eastbank. Mon 8:00 p.m."
      - listitem:
        - button "4:50 The school sits at the bottom of a shallow bowl. On calm, cool nights, smoke drains downhill and pools there, like water in a basin. Mon 8:50 p.m."
      - listitem:
        - button "5:41 Eleven p.m. Watch the sensor on the 1200 block of Linden Avenue, across the street from the school. It's at forty-six, and climbing. Mon 11:00 p.m."
      - listitem:
        - button "6:05 Midnight. That same sensor reads 107. The school area averages 88. The regional monitor, the official one, says 36. Tue 12:00 a.m."
      - listitem:
        - 'button "6:29 One a.m. The school area is at 147. The regional monitor: 39. Nobody relying on the official number would know anything was wrong. Tue 1:00 a.m."'
      - listitem:
        - button "7:08 Two-forty a.m. Two hundred and eighty-seven micrograms per cubic meter, hazardous, across the street from the school. The regional monitor reads 43. This is the highest reading anywhere in Eastbank all week. Tue 2:40 a.m."
      - listitem:
        - button "7:24 By twenty past three it is easing, but the sensor on Mill Street, a few doors away, goes offline at that moment. It will not report again until two in the afternoon. Tue 3:20 a.m."
    - heading "4 When the regional alert came" [level=3]
    - list:
      - listitem:
        - button "7:40 Four a.m. The pool over the school is thinning, but the school area still averages 131. The regional monitor reads 50. Tue 4:00 a.m."
      - listitem:
        - button "7:59 Five o'clock. The regional monitor crosses 55 for the first time, officially unhealthy. The school area crossed that line five and a half hours earlier, at 11:30 the night before. Tue 5:00 a.m."
      - listitem:
        - button "8:30 Six-forty. The regional monitor passes 100. Tue 6:40 a.m."
      - listitem:
        - button "8:39 Seven-ten a.m. The regional alert goes out. By now the school area has been above 100 for nearly seven hours. Tue 7:10 a.m."
      - listitem:
        - 'button "9:08 Twenty to nine. Now the whole town has caught up with the school: 132 here, 138 at the regional monitor. The disagreement is over, but the hours when a warning mattered most are gone. Tue 8:40 a.m."'
      - listitem:
        - button "9:48 That gap, about seven hours, is what this chapter is about. Tue 10:50 a.m."
    - heading "5 A day indoors" [level=3]
    - list:
      - listitem:
        - button "10:13 Tuesday afternoon is the worst stretch of the week for everyone, not just Linden. The typical sensor reads about 150, which the scale calls very unhealthy, and the regional monitor agrees. Tue 12:40 p.m."
      - listitem:
        - button "10:39 By evening the school area is within about ten points of the regional monitor. When smoke covers the whole region, the official number is a fair stand-in for our block. The trouble is the night before, when it wasn't. Tue 7:00 p.m."
      - listitem:
        - button "11:04 Midnight into Wednesday. Readings ease off slowly, still above 100 almost everywhere. Wed 1:00 a.m."
      - listitem:
        - button "11:35 Wednesday, 8:30 a.m. The Cooper's Ferry sensor on 18th Street, quiet since Tuesday afternoon, reports again. Wed 8:30 a.m."
    - heading "6 The wind turns" [level=3]
    - list:
      - listitem:
        - button "11:52 Wednesday afternoon the wind finally turns, and you can watch it work. First the school area, then the rest of the map, slips below 100. Wed 12:40 p.m."
      - listitem:
        - 'button "12:14 Six-forty p.m. The typical sensor is at 90 and falling. Good news, with a caveat: falling is not safe. Anything above 55 is still unhealthy. Wed 6:40 p.m."'
      - listitem:
        - button "12:35 Midnight into Thursday. Sixty-five, and heading back toward where we started the week. Thu 12:20 a.m."
      - listitem:
        - button "12:55 Thursday morning. Low forties again, orange on the map, the same level as that first hazy Saturday. Thu 6:00 a.m."
      - listitem:
        - button "13:26 Thursday, twenty past two in the afternoon. The typical sensor reads about 19. Yellow. Moderate. Thu 2:20 p.m."
      - listitem:
        - button "13:45 And that's the week. Forty-four of our forty-six sensors are still reporting. The two that went quiet, in Millrace and Sycamore Hill, are on my list for a visit. Thank you for watching. Thu 7:40 p.m."
