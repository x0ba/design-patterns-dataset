  - paragraph: Step 5 of 9 · Check the noise filter
  - heading "41% of your files are labeled noise. 54% of those came from HR-03, the pond." [level=1]
  - paragraph: Here is what explains it. Sample rate is not one of them. HR-03 is 66% noise, 64% of it insect or broadband, and it drags the project average up (without HR-03 the rate is 28%). Separately, 626 files (54% of the noise) were rejected by one of your own sensitivity settings. Those are the ones to look at before you bill.
  - text: Sample rate ruled out 626 files failed a setting 468 insect rejections 1,154 of 2,814 files are noise
  - img "Share of files by label"
  - list:
    - listitem: Myotis spp. 812
    - listitem: Eastern red bat 403
    - listitem: Hoary bat 227
    - listitem: Big brown / silver-haired 141
    - listitem: Unclassified 77
