- heading "Overview" [level=2]
- paragraph: "Bike traffic in San Diego changed a lot between 2019 and 2025: commuting collapsed in spring 2020, the beach routes boomed, and protected lanes opened on 30th St in August 2022. In this problem set you’ll design three different charts that compare monthly ridership at four counters, then argue which comparison each chart makes easiest."
- paragraph:
  - text: This is the last problem set in the Encoding module. It applies the three comparison strategies from
  - link "Lecture 5 Week 5 · Lecture 5 at 11:25":
    - /url: "#/lecture/5?t=685"
  - text: — juxtapose, superimpose, explicitly encode — to a real, slightly messy dataset.
- heading "Tasks" [level=2]
- list:
  - listitem:
    - text: Get the data. Load
    - link "San Diego bike counts v3 Week 5 · Datasets · version 3 of 6":
      - /url: "#/datasets/sd-bike-counts?v=3"
    - text: and sum
    - code: count
    - text: "to monthly totals for the four core counters, Jan 2019 – Sep 2025:"
    - code: HBR-01 Harbor Dr
    - code: UNV-02 University Ave
    - code: 30T-03 30th St
    - code: PBB-04 Pacific Beach Boardwalk
  - listitem: "Make three charts of the same monthly totals: one that juxtaposes the counters, one that superimposes them, and one that explicitly encodes the comparison (e.g. index each counter to its 2019 average = 100). You choose which is which."
  - listitem: Handle the outage honestly. University Ave was offline Mar–May 2021, and v3 leaves those days empty on purpose. Show the gap as missing — don’t interpolate — and label it on every chart.
  - listitem:
    - text: Write 300–400 words. For each chart, name the comparison task it serves best (e.g. “which counter was busiest in July 2023?” vs “whose trend recovered fastest?”). Cite
    - link "Javed et al. (2010) Week 5 · Readings · required":
      - /url: "#/readings/r13"
    - text: and Lecture 5.
