    - heading "Haworth" [level=1]
    - paragraph: 87.5° S, 5.0° W
    - tablist:
      - tab "About" [selected]
      - tab "Why it’s dark"
      - tab "Compare"
    - tabpanel:
      - text: Latest finding · 28 October 2026
      - heading "Water ice, right next to Haworth" [level=2]
      - paragraph:
        - text: The robotic lander
        - button "Polar Scout"
        - text: touched down just 2.8 km (1.7 mi) outside Haworth’s rim. It reports ice making up an estimated 3–5% of the lunar soil by weight.
      - img "3 to 5 percent of the soil by weight is water ice": 3–5% ice by weight 95–97% rock and dust
      - paragraph: That is roughly 2–3 tablespoons of water in every kilogram (2.2 lb) of soil. Haworth’s floor is one of the places that stays dark all the time, which is where ice is expected to survive.
      - heading "How close did it land?" [level=3]
      - paragraph: "The gap is about 1/18 of the crater’s width: 2.8 km (1.7 mi) from the rim, or 28 km (18 mi) from the crater’s center. That is about a 35-minute walk on Earth."
      - button "Zoom to the landing spot"
      - heading "About Haworth" [level=3]
      - term: Width
      - definition: 51 km (32 mi)
      - term: Depth
      - definition: 3.8 km (2.4 mi)
      - term: Distance to the pole
      - definition: 76 km (47 mi)
      - text: The Moon’s south pole
      - term: Age
      - definition: about 3.9 billion years
      - paragraph: Named after Sir Walter Norman Haworth, British chemist and Nobel laureate (1883–1950).
      - button "Why is it always dark? See how the crater walls shade the floor"
      - button "How far is Apollo 11? Compare with the 1969 landing site"
      - paragraph: Polar Scout has been on the surface for 20 days.
