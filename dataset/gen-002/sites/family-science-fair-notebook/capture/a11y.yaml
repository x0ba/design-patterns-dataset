    - paragraph: I think mealworms can eat polystyrene foam, so the foam will get lighter over time. I think the worms with oats will eat less foam because they will eat the oats instead.
    - text: Now
    - paragraph: If mealworms are fed only polystyrene foam, then the foam will lose mass over 28 days, because bacteria in their gut can break polystyrene down. I predict the worms fed foam and oats will eat more foam than the worms fed only foam, because the oats give them energy to keep eating.
