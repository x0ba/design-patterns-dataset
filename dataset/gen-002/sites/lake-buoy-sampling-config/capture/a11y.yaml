  - heading "Sensors & sampling" [level=1]
  - paragraph: 31 sensors on 4 deployments. Highlighted values differ from Winter 2025–26; the grey column is what loggers run today under Open Water 2026.
  - checkbox "Show live values" [checked]
  - text: Show live values
  - strong: Two DO sondes are past their 180-day calibration.
  - text: miniDOT 7450-188206 (13 m, North) and miniDOT 7450-188211 (8 m, South) were last calibrated Apr 18, 2026, 213 days ago. They sit at depth on the moorings, so there's no access once ice is on — the QA rule will mark their data C all winter.
