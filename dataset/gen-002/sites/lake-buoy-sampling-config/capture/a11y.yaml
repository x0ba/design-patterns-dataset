- complementary:
  - heading "Winter 2026–27" [level=2]
  - text: Draft
  - paragraph: Copied from Winter 2025–26 today, 07:58 · changes below are against that profile
  - heading "Switch-over" [level=3]
  - text: Main Buoy retrieval
  - textbox "Main Buoy retrieval": 2026-12-02
  - textbox "Switch-over time": 09:00
  - paragraph:
    - text: Open Water 2026 stays live until
    - strong: Wed Dec 2, 09:00 CST
    - text: . Nothing in this draft reaches a logger before then.
  - checkbox "If the buoy pull slips, hold until retrieval is logged in the field log" [checked]
  - text: If the buoy pull slips, hold until retrieval is logged in the field log
  - paragraph: 2 days before the earliest full ice-cover estimate (Dec 4). Skim ice likely Nov 25–28.
  - heading "Changes 1" [level=3]
  - list:
    - listitem:
      - button "Sampling interval"
      - button "Revert"
      - text: 10 min → 30 min 4 × North DO 3 m, North DO 13 m, South DO 2 m, South DO 8 m
      - textbox "Reason — goes into the change history": Under-ice O₂ drawdown is slow; 30 min resolves it and saves ~18% logger power through March.
  - heading "Before you schedule" [level=3]
  - list:
    - listitem:
      - button "Ana Lucía Reyes asked for conductivity in µS/cm"
      - text: — station-wide or her export only? Not decided. Doesn't block scheduling.
    - listitem:
      - text: 2 active DO sondes past calibration interval (North DO 13 m, South DO 8 m). Every sample will carry flag C until they can be serviced after ice-out.
      - button "Accept, keep them running"
  - button "Schedule for Wed Dec 2, 09:00"