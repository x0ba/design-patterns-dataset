  - button "Fix Friday’s late-closed checks $214.00 unassigned from Fri Nov 13 · 1 warning Needs you" [expanded]
  - alert:
    - paragraph: What the warning means
    - paragraph: Kittyline’s automatic suggestion for late checks is to give the tip to whoever is still clocked in when the check closes. On Friday that was only Marco and Tomás. Marco’s shift-lead role is manager-designated, so he can’t receive tips. That would leave Tomás Herrera, the dishwasher, with all $214.00 on top of his regular share.
    - paragraph: Back-of-house would end up with $2,800.92, which is 21.3% of the pool. Your rule caps it at 20% ($2,629.72), so it would be $171.20 over. Nothing has been paid or changed; this is a suggestion you haven’t accepted.
    - button "Read “Late-closed checks”"
  - heading "What happened Friday" [level=4]
  - paragraph: These three checks were closed after your last server clocked out, so Kittyline couldn’t match them to a shift. They’re in the $11,842.60 from your POS, but not in anyone’s share yet.
