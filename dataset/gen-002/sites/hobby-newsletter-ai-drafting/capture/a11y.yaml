  - 'article "Press release: leaf collection schedule, page 1"':
    - text: CITY OF BRANNOCK · OFFICE OF THE CITY MANAGER · NEWS RELEASE
    - paragraph: FOR IMMEDIATE RELEASE · November 9, 2026
    - heading "Leaf collection moves to a two-zone schedule this year" [level=3]
    - paragraph:
      - text: BRANNOCK —
      - mark: Beginning Monday, Nov. 23, the Department of Public Works will collect leaves on a two-zone rotation
      - text: instead of a single citywide route. Last year's single route took five weeks to complete.
    - paragraph: Zone A, the part of the city north of Fenwick Avenue, will be collected the weeks of Nov. 23 and Dec. 7. Zone B, south of Fenwick Avenue, will be collected the weeks of Nov. 30 and Dec. 14.
    - paragraph: Leaves must be at the curb by 6:30 a.m. on Monday of the assigned week, either in paper yard-waste bags or raked loose. Plastic bags will not be collected. Leaves should not be pushed into the street or onto storm drains.
    - paragraph: The program ends Friday, Dec. 18. Residents with questions may call the Public Works information line at (607) 555-0142.
    - button "Previous page" [disabled]
    - text: Page 1 of 1
    - button "Next page" [disabled]
