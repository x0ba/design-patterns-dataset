- button "2"
- text: 0:00 2:41 Automatic transcript. Click a word to jump there, drag across words to select them. Struck-out words are cut from your story; select them and choose Put back to restore. 0:01 Sofía Abuela, ¿cómo era La Loma cuando llegaste?
- button "✂ Cut line"
- text: 0:05 Abuela Rosa Uy, mija. Pues mira… déjame pensar.
- button "✂ Cut line"
- text: 0:11 Abuela Rosa Nosotros vivíamos en Michoacán, en un rancho, y tu abuelo consiguió trabajo aquí en la construcción,
- button "✂ Cut line"
- text: 0:20 Abuela Rosa y cuando llegamos en el setenta y dos, todo era campo.
- button "✂ Cut line"
- text: 0:27 Abuela Rosa Donde ahora está el supermercado había milpas, y un señor tenía vacas. ¡Vacas, imagínate!
- button "✂ Cut line"
- text: 0:37 Sofía ¿En serio? ¿Vacas?
- button "✂ Cut line"
- text: 0:40 Abuela Rosa Sí, sí. Y no había calles de cemento, todo era tierra. Cuando llovía, era puro lodo.
- button "✂ Cut line"
- text: 0:48 Abuela Rosa Tu abuelo construyó la casa poco a poco, los fines de semana. Primero un cuarto, luego la cocina…
- button "✂ Cut line"
- text: 0:59 Abuela Rosa Tardamos como diez años. Bueno, en realidad nunca la terminamos, siempre faltaba algo.
- button "✂ Cut line"
- text: 1:07 Abuela Rosa Y luego,
- button "2"
- text: ¿qué más? Ah, mi comadre Lupe vivía enfrente, y ella tenía la única tele de la cuadra.
- button "✂ Cut line"
- text: 1:16 Abuela Rosa Todos los niños iban a su casa a ver las caricaturas. Tu tío Beto también.
- button "✂ Cut line"
- text: 1:25 Abuela Rosa Bueno, eso no importa. ¿Qué me preguntaste?
- button "✂ Cut line"
- text: 1:33 Sofía ¿Cómo empezó el mercado de los domingos?
- button "✂ Cut line"
- text: 1:38 Abuela Rosa Ah, el mercado. Eso lo empezamos las mujeres, ¿sabes? En el setenta y nueve.
- button "✂ Cut line"
- text: "1:49 Abuela Rosa No había tienda cerca, entonces cada una traía lo que tenía: nopales, tamales, ropa de los niños."
- button "✂ Cut line"
- text: 1:59 Abuela Rosa El primer domingo fuimos seis. Al año siguiente ya éramos más de cuarenta.
- button "✂ Cut line"
- text: 2:07 Abuela Rosa Y ahí conocí a la mamá de Don Arturo, fíjate.
- button "✂ Cut line"
- text: 2:15 Sofía ¿Y ahora? ¿Qué piensas del barrio?
- button "✂ Cut line"
- text: 2:19 Abuela Rosa Ahora hay edificios nuevos y gente que no conozco. Algunos ni saludan.
- button "✂ Cut line"
- text: 2:29 Abuela Rosa Pero los domingos, cuando huelo los elotes en la avenida, me siento otra vez como en el setenta y nueve.
- button "✂ Cut line"
