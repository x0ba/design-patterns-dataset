- 'main "Conversation: Dana Whitcombe"':
  - heading "Dana Whitcombe" [level=1]
  - paragraph: Industry mentor · Level designer, Foxglove Interactive
  - text: 9 messages Tuesday, September 8
  - article:
    - text: Dana Whitcombe Mentor
    - time: 11:02 AM
    - paragraph: Hi Priya and team! I'm Dana. I design levels at Foxglove Interactive, mostly puzzle and exploration spaces. Prof. Halvorsen matched us for the semester. I can usually reply within a couple of days. Tell me about Tether?
    - button "Quote Dana's message in your reply"
  - text: Wednesday, September 9
  - article:
    - text: You
    - time: 8:30 AM
    - paragraph: "Thank you Dana, we're really excited. Tether is a two-player co-op puzzle game: two characters joined by a physical tether, each seeing a different part of the room. There are five of us and I'll be your main contact so you only get one thread to read."
    - button "Quote Priya's message in your reply"
  - text: Wednesday, September 23
  - article:
    - text: You
    - time: 5:20 PM
    - paragraph: Our first playable (v0.3) is on the shared drive. We'd love a gut reaction to how the tether feels before we build rooms around it.
    - button "Quote Priya's message in your reply"
  - text: Friday, September 25
  - article:
    - text: Dana Whitcombe Mentor
    - time: 1:40 PM
    - paragraph: Played it for twenty minutes. The tether feel is the strongest thing you have, and it's hard to get right, so protect it. The rooms are too forgiving for now but that's easy to fix later.
    - button "Quote Dana's message in your reply"
  - text: Wednesday, October 14
  - article:
    - text: You
    - time: 4:05 PM
    - paragraph: "v0.5 is up. World 1 is complete: five rooms, with a teaching room (1-3) we rebuilt after your note."
    - button "Quote Priya's message in your reply"
  - text: Friday, October 16
  - article:
    - text: Dana Whitcombe Mentor
    - time: 12:15 PM
    - paragraph: "World 1 is a delight. 1-3 is the best teaching room I've seen in a student build. One question to chew on while you build world 2: what will it ask of the player that world 1 doesn't?"
    - button "Quote Dana's message in your reply"
  - text: Monday, November 9
  - article:
    - text: You
    - time: 9:12 AM
    - paragraph: Hi Dana! v0.7 is on the shared drive. World 2 is in, though the cave art is still partly placeholder. I've attached the build notes and our playtest summary from Nov 8 (11 testers). We'd love your honest read, especially on world 2.
    - button "Tether build v0.7 notes PDF · 212 KB"
    - button "Playtest summary, Nov 8 PDF · 1.4 MB"
    - button "Quote Priya's message in your reply"
  - text: Wednesday, November 11
  - article:
    - text: Dana Whitcombe Mentor
    - time: 10:20 AM
    - paragraph: Got it, thanks! I'll play it this week and send proper notes by the weekend.
    - button "Quote Dana's message in your reply"
  - text: Friday, November 13 New message
  - article:
    - text: Dana Whitcombe Mentor
    - time: 4:12 PM
    - text: 1,100 words · 5 min read
    - paragraph: Hi Priya and team,
    - paragraph: "Thank you for sending v0.7 and for the playtest write-up. The numbers made it much easier to separate what I felt from what is actually happening to your players. I played through twice: once on my own, switching between both controllers so I could see each side, and once with my partner on the couch, who had never seen the game. The second run told me far more than the first. My notes are below, in three points, in the order I think they matter. Please read all three before reacting to any of them, because they are connected."
    - heading "1 World 2 doesn't teach anything new Quote" [level=3]:
      - text: 1 World 2 doesn't teach anything new
      - button "Quote"
    - paragraph: "I'll say this plainly because I suspect you already feel it: rooms 2-1 through 2-4 are world 1 with a new coat of paint. The cave tileset is lovely and the lighting sells the mood, but mechanically every puzzle in world 2 asks for the same two skills the player learned in 1-2 and 1-3. Swap the tether anchor, then use the slack to reach across a gap. Difficulty rises because you add more gaps and more pressure plates, not because the player is asked to think differently. That is the difference between a harder level and a new level."
    - paragraph:
      - text: A rule of thumb I use with my own team is
      - emphasis: teach, test, twist
      - text: . A room introduces a verb somewhere safe (teach). The next room asks the player to use it under mild pressure (test). A later room breaks the assumption they just formed about it (twist). World 1 does the first two beautifully. Room 1-3 is the best teaching room I have seen in a student build, because there is only one thing you can possibly do. World 2 starts at "test" and never reaches "twist". Players walk into the cave expecting to be surprised and get a harder spreadsheet.
    - paragraph: "I would rather you pick one new rule than three. Candidates, all things you already have in the build:"
    - list:
      - listitem: Anchors that only hold one player's weight, so the tether has to be re-threaded in a particular order.
      - listitem: A tether that shortens under tension. You have this half-implemented in the physics; I saw it in the debug overlay.
      - listitem: A room where the two players' roles flip halfway through the puzzle.
    - paragraph: "Any one of these could carry four rooms. I would not attempt all of them. That also gives you a clean story to tell in your beta write-up: what you noticed, what you changed, and what happened when new players met it."
    - heading "2 Puzzle 2-3 is a communication puzzle with no communication tools Quote" [level=3]:
      - text: 2 Puzzle 2-3 is a communication puzzle with no communication tools
      - button "Quote"
    - paragraph:
      - text: Your summary says 7 of 11 testers got stuck on 2-3. My partner and I got stuck there too, and it was instructive to watch
      - emphasis: why
      - text: . The solution needs one player to stand on the pressure plate while the other, who cannot see the plate's timer, crosses the bridge. The player on the far side has no way to know when it is safe. We ended up shouting "now? now?" at each other, and because the timer is silent we got it wrong six times in a row. By attempt four we were no longer solving a puzzle. We were having an argument.
    - paragraph:
      - text: Co-op puzzle games live or die on this. Asymmetric information is the best tool a two-player game has, and Portal 2's co-op chapters and
      - emphasis: Keep Talking and Nobody Explodes
      - text: "both prove it, but it only works when the information can actually travel between the players. Right now it can't. There is no ping, no emote and no shared audio cue. Failure is also silent: when the tether snaps, the room resets with no explanation, so the players cannot tell whether they mistimed something or the puzzle is impossible."
    - paragraph: Two small changes would help a great deal. Give the plate timer an audible tick that both players can hear, and show a one-line reason when a room resets, something like "Anchor released too early". Both are cheap and neither needs new art.
    - paragraph: One related observation. An 18-minute average completion time looks healthy on paper, but I suspect a big share of those minutes is spent in 2-3. If that room were fixed I would expect the average to drop toward 12. That is fine. A short build that flows beats a longer one that stalls.
    - heading "3 For beta, cut before you add Quote" [level=3]:
      - text: 3 For beta, cut before you add
      - button "Quote"
    - paragraph: "You are in week 12, and I know it is tempting to read a critique like this and decide that world 2 must be torn down and rebuilt. Please don't. With beta due December 1, treat this as a prioritization exercise. A beta exists to give you evidence that the design works, not to hold final content. My suggestions, roughly in order:"
    - list:
      - listitem: Fix the communication problem in 2-3 first. It is blocking most of your players and it is the cheapest fix on this list.
      - listitem: Choose a single twist for world 2 and apply it to two rooms, 2-2 and 2-4, rather than all four. Leave 2-1 as a gentle on-ramp and 2-3 as your communication room.
      - listitem: Cut anything in the plan that is not needed to test those changes. Cosmetic variants and extra polish passes go first. I noticed the build notes mention a bonus room for world 3. I would drop it for now.
      - listitem: Then run another playtest with at least eight people, including several who have never seen the game, and write up what changed because of it. Your instructors will care more about that evidence than about a longer build.
    - paragraph: I know that is a lot, and there are things I cannot see from outside the team, such as how much capacity you really have left for art and code over the next two and a half weeks. You know that better than I do, so push back on anything that does not fit.
    - heading "On the call" [level=3]
    - paragraph: I am happy to do 30 minutes this week. I'm free Tuesday 4 to 6 pm, Wednesday 12 to 1 pm and Thursday 5 to 7 pm, all Pacific. Any of those works. To make the time count, please send me one specific question you would like us to spend it on. "What would you do about world 2?" is too broad. Something like "Given our schedule, which of these twists would you choose, and why?" is exactly the kind of thing I can actually help with. If someone else on the team has a question about their own area, feel free to bring them along.
    - paragraph: Thanks again for letting me play this. I am looking forward to the next version.
    - paragraph: Dana
