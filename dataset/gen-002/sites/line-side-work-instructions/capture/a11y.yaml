    - listitem:
      - button "Drag step 5 to reorder"
      - text: "5"
      - textbox "Step 5":
        - /placeholder: Write the step as a short instruction
        - text: Tighten the lock nut to 4.5 N·m with the 13 mm spanner.
    - listitem:
      - button "Drag step 6 to reorder"
      - text: "6"
      - textbox "Step 6":
        - /placeholder: Write the step as a short instruction
        - text: Re-read the gauge at chucks 9 and 18. All must read 142.5 mm.
