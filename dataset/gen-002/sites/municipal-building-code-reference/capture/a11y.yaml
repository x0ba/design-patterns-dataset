    - article:
      - text: Chapter 1 · Administration · 2021 edition
      - heading "§105.2 Work exempt from permit" [level=3]
      - text: Revised in the 2024 edition, effective Jan 1, 2027. This text governs applications filed before that date.
      - paragraph: "A permit is not required for the following work, provided it does not violate this code or the Lindenwood Zoning Code:"
      - paragraph: 1. One-story detached accessory structures used as tool and storage sheds or playhouses, where the floor area is 120 square feet or less.
      - paragraph: 2. Fences not over 7 feet high.
      - paragraph: 3. Retaining walls not over 4 feet high, measured from the bottom of the footing to the top of the wall, unless they support a surcharge.
      - paragraph: 4. Water tanks supported directly on grade, with a capacity of 5,000 gallons or less and a height-to-diameter ratio of 2 to 1 or less.
      - text: Local amendment LA-21-02
      - paragraph: "Item 2 is amended to read: Fences not over 6 feet high. A fence in a front setback shall not exceed 4 feet."
      - heading "Interpretation memos" [level=4]
      - list:
        - listitem: IM-2016-002 Measuring fence height on sloped lots Mar 8, 2016
        - listitem: IM-2017-001 Storage sheds on utility easements Jan 19, 2017
        - listitem: IM-2023-007 Shed exemption near property lines May 2, 2023
        - listitem: IM-2023-009 Retaining wall height at stepped terraces Jun 20, 2023
        - listitem: IM-2024-013 Corner-lot fences and sight triangles Sep 3, 2024
    - paragraph: "1 change vs live: Opens to."