  - region "Your recall dropped from 89% to 71% this week":
    - text: Recall · AP Biology (both units)
    - heading "Your recall dropped from 89% to 71% this week" [level=2]
    - text: Oct 6–26 (first three weeks) Nov 10–16 (last 7 days)
    - paragraph: "Over the last three weeks, recall went from 89% to 75%. About 9 points of that comes from the mix of cards you studied: 31% of your reviews were cards under 3 weeks old, up from 7%, and those are recalled 49% of the time. Cards over 3 weeks old account for the other 5 points, mostly in Unit 3."
    - img "Six weeks of reviews by card age, with recall as a line": 0% 25% 50% 75% 100% Oct 6–12 Oct 13–19 Oct 20–26 Oct 27–Nov 2 Nov 3–9 Nov 10–16 90% 86% 90% 78% 76% 71%
    - text: Under 1 week old 1–3 weeks old 3–8 weeks old Over 8 weeks old Recall (share answered Hard, Good or Easy)
    - paragraph: Recall means you answered Hard, Good or Easy. Again means you missed the card. Bars show the share of each week's reviews by how old the card was.
    - complementary "What changed":
      - heading "What changed" [level=3]
      - text: Study sessions that started after 10:30pm 12%42% Late sessions were mostly for new cards. New cards added 11186 Most arrived in four big batches. Reviews on cards under 3 weeks old 7%31% These are the cards you miss most at first. Recall on cards over 3 weeks old 90%86% Unit 3 89% → 83%; Units 1–2 91% → 89%
  - region "Three explanations, checked against your history":
    - heading "Three explanations, checked against your history" [level=2]
    - paragraph: Each guess is compared with the same kind of card, so an older card isn't judged against a brand-new one. The last three weeks are used throughout.
    - article:
      - text: “I’ve been studying late at night.” Mixed signal
      - paragraph:
        - text: Once you compare cards of the same age, the picture is mixed. Newer cards are about
        - strong: 9 points
        - text: lower late at night, while older cards are about
        - strong: 5 points
        - text: higher.
      - text: Cards 3+ weeks old After 10:30pm 91% n=217 Earlier in the day 85% n=925 Cards under 3 weeks old After 10:30pm 45% n=283 Earlier in the day 54% n=222
      - strong: "Why late looks worse:"
      - text: 57% of late-session reviews were new cards, compared with 19% of daytime reviews. Late sessions are where new cards get studied, and new cards are the hard part.
      - paragraph: This is a pattern, not proof. Being tired late may still cost you a little, which is why the gap is not zero.
    - article:
      - text: “I added too many new cards at once.” Strong effect
      - paragraph:
        - text: Same kind of card (Krebs or electron transport), recalled
        - strong: 35%
        - text: of the time after a day with 25+ new cards, and
        - strong: 52%
        - text: after a day with fewer than 10.
      - text: New Biology cards added per day Oct 27 Nov 6 Nov 16 25+ in one day (4 of the last 21 days) Under 25
      - strong: "Sample:"
      - text: 95 small-batch and 234 big-batch reviews. Few reviews, so treat as a hint.
      - paragraph: "Batch size and card difficulty overlap: most big-batch days were Krebs and ETC material. The comparison above keeps the card type fixed, so the batch effect is the part that is left over."
    - article:
      - text: “The new cards are just harder.” Strong for new cards
      - paragraph:
        - text: Krebs and ETC cards under 3 weeks old are recalled
        - strong: 40%
        - text: "of the time. Other new Biology cards:"
        - strong: 67%
        - text: . Once they are older than 3 weeks, the gap shrinks to
        - strong: 8 points
        - text: .
      - text: Cards under 3 weeks old Krebs & electron transport 40% n=334 Other Biology 67% n=171 Cards 3+ weeks old Krebs & electron transport 80% n=201 Other Biology 88% n=941
      - strong: "Reading it:"
      - text: these cards are hard for the first few reviews, which is normal for new material. They get easier with repetition, but Krebs and ETC cards still trail the rest once they are older.
      - paragraph: Harder is real, and big batches make these new cards worse on top of it (see the middle card).
  - region "What the data supports":
    - heading "What the data supports" [level=2]
    - list:
      - listitem:
        - strong: The biggest factor is the new material.
        - text: Krebs and ETC cards under 3 weeks old are recalled 40% of the time, against 67% for other new Biology cards. Once they are older, the gap shrinks to 8 points.
      - listitem:
        - strong: Big batches made it worse.
        - text: Among Krebs and ETC cards, the ones added on days with 25+ new cards were recalled 35% of the time, against 52% from days with fewer than 10.
      - listitem:
        - strong: Late nights are a mixed signal.
        - text: For newer cards, late sessions were about 9 points lower; for older cards, about 5 points higher. Late sessions look worse overall because 57% of their reviews were new cards.
      - listitem:
        - strong: Older material is slipping a little, mostly in Unit 3.
        - text: Unit 3 cards over 3 weeks old went from 89% to 83%; Units 1–2 went from 91% to 89%.
    - paragraph: This is three weeks of data from one student. It shows which patterns fit, not what caused them for certain. The plan below is a short test of the batch idea.
