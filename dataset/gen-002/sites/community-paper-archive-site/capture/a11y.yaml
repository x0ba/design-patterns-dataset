- contentinfo:
  - paragraph:
    - strong: The Millrace Gazette Online
    - text: is produced by volunteers and published on the second Thursday of each month. Stories from 1988 to 2009 were scanned from print, so some words in their text may be garbled.
  - paragraph: Volunteers are at the Millrace Library on Saturday mornings to help you find and print old stories.