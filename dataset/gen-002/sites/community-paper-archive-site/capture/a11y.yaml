  - heading "The Millrace Gazette" [level=1]
  - paragraph: published Thursday, November 12, 2026 · 22 pages · 22 stories
  - article:
    - paragraph: Front Page · page 1
    - heading "Council Approves $1.2 Million to Repair Millrace Levee" [level=2]:
      - link "Council Approves $1.2 Million to Repair Millrace Levee":
        - /url: "#/article/2026-11-council-approves-1-2-million-to-repair-millrace-levee"
    - paragraph: Crews will rebuild the earthen levee behind Tannery Street and start on the Mill Road footbridge in March, the first major repair since the 1994 flood.
    - paragraph: By Helen Rusakova
    - figure "Survey stakes mark the section of levee behind Tannery Street where settling was found in September. Photo by Gil Amador":
      - 'button "Enlarge photo: Survey stakes mark the section of levee behind Tannery Street where settling was found in September."':
        - img "Survey stakes mark the section of levee behind Tannery Street where settling was found in September."
        - text: Enlarge
      - text: Survey stakes mark the section of levee behind Tannery Street where settling was found in September. Photo by Gil Amador
    - paragraph: The Millrace Town Council voted 5–2 on Tuesday night to spend $1.2 million on repairs to the levee that runs behind Tannery Street and the Mill Road footbridge. Work is scheduled to start in March and should take about five months, weather permitting.
    - paragraph:
      - link "Read the full story":
        - /url: "#/article/2026-11-council-approves-1-2-million-to-repair-millrace-levee"
  - region "More front-page stories":
    - article:
      - paragraph: Front Page · page 1
      - heading "New Gazette Website Opens With 38 Years of Back Issues" [level=3]:
        - link "New Gazette Website Opens With 38 Years of Back Issues":
          - /url: "#/article/2026-11-new-gazette-website-opens-with-38-years-of-back-issues"
      - paragraph: Every issue from March 1988 forward is now online, and the search tool can find names, streets and phrases in the scanned text.
  - region "Inside this issue":
    - heading "Inside this issue" [level=2]
    - heading "Neighborhood News 6" [level=3]
    - list:
      - listitem:
        - text: p. 2
        - link "Holiday Lights Go Up on Kettle Hill":
          - /url: "#/article/2026-11-holiday-lights-go-up-on-kettle-hill"
        - paragraph: Forty-two households on Orchard Lane and Kettle Hill Road have signed up for the lighting tour, which runs December 6 through January 1.
        - paragraph: By Thomas Quill
      - listitem:
        - text: p. 4
        - link "Canal Park Food Pantry Moves to Larger Hall":
          - /url: "#/article/2026-11-canal-park-food-pantry-moves-to-larger-hall"
        - paragraph: The pantry will serve Tuesday and Thursday shoppers from the St. Brendan’s Parish hall starting December 1.
        - paragraph: By Sana Whitcomb
      - listitem:
        - text: p. 6
        - link "Foxglove Heights Block Party Plans Set for Spring":
          - /url: "#/article/2026-11-foxglove-heights-block-party-plans-set-for-spring"
        - paragraph: Residents will vote in January on a new date and a shared-cost budget for the June street fair.
        - paragraph: By Thomas Quill
      - listitem:
        - text: p. 7
        - link "Scout Troop 14 Repaints Millrace Green Benches":
          - /url: "#/article/2026-11-scout-troop-14-repaints-millrace-green-benches"
        - paragraph: Eleven benches around the green were sanded and repainted over two Saturdays, using paint donated by the hardware store on Mill Road.
        - paragraph: By Dale Pruitt
      - listitem:
        - text: p. 9
        - link "Bellwood Chapel Seeks Drivers for Winter Meal Route":
          - /url: "#/article/2026-11-bellwood-chapel-seeks-drivers-for-winter-meal-route"
        - paragraph: Volunteers deliver 60 hot meals each weekday to homebound residents. The route needs four more drivers by January.
        - paragraph: By Carmen Lopes
      - listitem:
        - text: p. 10
        - link "Stonebridge Trail Closed for Culvert Work Through December":
          - /url: "#/article/2026-11-stonebridge-trail-closed-for-culvert-work-through-december"
        - paragraph: The city will replace a stone culvert under the trail near Hickory Ridge Road. Use the Eastgate detour until the work is done.
        - paragraph: By Oren Bell
    - heading "Council Watch 3" [level=3]
    - list:
      - listitem:
        - text: p. 3
        - link "Parking Permit Rules Revised for Foundry Row":
          - /url: "#/article/2026-11-parking-permit-rules-revised-for-foundry-row"
        - paragraph: Residents who park on the street overnight will need a sticker starting in February, and guest passes will be capped at 30 a year.
        - paragraph: By Helen Rusakova
      - listitem:
        - text: p. 5
        - link "Budget Hearing Draws Record Crowd of 212":
          - /url: "#/article/2026-11-budget-hearing-draws-record-crowd-of-212"
        - paragraph: Most speakers asked the council to keep the library open on Sundays and to avoid cutting the bus shelter program.
        - paragraph: By Helen Rusakova
      - listitem:
        - text: p. 12
        - link "Council Okays Speed Bumps on Hickory Ridge Road":
          - /url: "#/article/2026-11-council-okays-speed-bumps-on-hickory-ridge-road"
        - paragraph: Two raised crosswalks will go in near the elementary school after a summer of complaints from parents.
        - paragraph: By Jonah Peltier
    - heading "Schools 3" [level=3]
    - list:
      - listitem:
        - text: p. 8
        - link "Eastgate Elementary Wins State Reading Grant":
          - /url: "#/article/2026-11-eastgate-elementary-wins-state-reading-grant"
        - paragraph: The $25,000 grant will pay for a part-time library aide and new books for grades K through 2.
        - paragraph: By Priya Raman
      - listitem:
        - text: p. 13
        - link "Winter Concert Schedule Announced for Middle and High School":
          - /url: "#/article/2026-11-winter-concert-schedule-announced-for-middle-and-high-school"
        - paragraph: Concerts run from December 10 to December 18 in the Millrace Middle School gym. Tickets are free at the door.
        - paragraph: By Priya Raman
      - listitem:
        - text: p. 14
        - link "Millrace Middle School Robotics Team Heads to State Finals":
          - /url: "#/article/2026-11-millrace-middle-school-robotics-team-heads-to-state-finals"
        - paragraph: Six students built a robot that sorts recycling. The team will compete at the state finals in February.
        - paragraph: By Tobias Greer
    - heading "Letters 2" [level=3]
    - list:
      - listitem:
        - text: p. 15
        - 'link "Letter: The Levee Coverage Was Long Overdue"':
          - /url: "#/article/2026-11-letter-the-levee-coverage-was-long-overdue"
        - paragraph: By Bernard Kowal
      - listitem:
        - text: p. 15
        - 'link "Letter: The Lantern Walk Brought Us Back Together"':
          - /url: "#/article/2026-11-letter-the-lantern-walk-brought-us-back-together"
        - paragraph: By Maureen Doyle
    - heading "Obituaries 2" [level=3]
    - list:
      - listitem:
        - text: p. 16
        - link "Ellen M. Sadowski, 84, Longtime Canal Park Librarian":
          - /url: "#/article/2026-11-ellen-m-sadowski-84-longtime-canal-park-librarian"
        - paragraph: She ran the Canal Park branch reading room for 31 years and started the first summer story hour in the neighborhood.
        - paragraph: By Marguerite Shaw
      - listitem:
        - text: p. 17
        - link "Frank Dwyer, 91, Eastgate Volunteer Firefighter":
          - /url: "#/article/2026-11-frank-dwyer-91-eastgate-volunteer-firefighter"
        - paragraph: He answered alarms for the Eastgate company for 47 years and rarely missed a Thursday drill.
        - paragraph: By Marguerite Shaw
    - heading "Events 2" [level=3]
    - list:
      - listitem:
        - text: p. 18
        - 'link "Holiday Events Roundup: 17 Things to Do Between Thanksgiving and New Year’s"':
          - /url: "#/article/2026-11-holiday-events-roundup-17-things-to-do-between-thanksgiving-and"
        - paragraph: Tree lightings, lantern walks, a teen dance, skating on Marsh Landing Pond and a New Year’s countdown on Millrace Green.
        - paragraph: By Ines Ferreira
      - listitem:
        - text: p. 19
        - link "Winter Market Returns to Cedar Hollow Pavilion":
          - /url: "#/article/2026-11-winter-market-returns-to-cedar-hollow-pavilion"
        - paragraph: Vendors will sell from 9 a.m. to noon on Saturdays, December 5, 12 and 19, under the pavilion roof.
        - paragraph: By Ines Ferreira
    - heading "Then & Now 2" [level=3]
    - list:
      - listitem:
        - text: p. 11
        - 'link "Then & Now: The Mill Road Footbridge, 1971 and 2026"':
          - /url: "#/article/2026-11-then-and-now-the-mill-road-footbridge-1971-and-2026"
        - paragraph: The footbridge that will get new piers in March has carried foot traffic across the millrace for more than 50 years.
        - paragraph: By Dorothy Kessler
      - listitem:
        - text: p. 20
        - 'link "Then & Now: Tannery Street’s Flood Garage, 1994 and 2026"':
          - /url: "#/article/2026-11-then-and-now-tannery-streets-flood-garage-1994-and-2026"
        - paragraph: Thirty-two years after the spring flood, the garage at 318 Tannery Street has a new roof and no visible water line. Here is the spot.
        - paragraph: By Dorothy Kessler
