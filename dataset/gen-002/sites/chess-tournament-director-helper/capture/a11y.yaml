  - complementary "Club rules that apply today":
    - text: Club rules for today Results and disputes
    - paragraph: The signed scoresheet is the record of the game. If players tell the director a different result from the one entered, check the scoresheet and ask both players.
    - paragraph: Correct the result in the software before the next round is posted and write a short reason. Once a round is posted, changing a result does not re-pair anyone.
    - text: Late entries
    - paragraph: A player who arrives after the event has started may join at the next round to be posted.
    - paragraph: A late entry may be given a half-point bye for each of rounds 1 and 2 they missed. Byes are not given for later rounds.
    - paragraph: A late entry who is not playing is marked "not joining" so the record is complete.
    - text: Withdrawals
    - paragraph: A player who has to leave is withdrawn before the next round is posted. They are not paired again.
    - paragraph: Their points stay in the standings and still count for their opponents’ tiebreaks.
    - text: Byes
    - paragraph: A bye is only needed when an odd number of players is eligible for a round. The bye is a full point.
    - paragraph: The bye goes to the lowest-rated player in the lowest score group who has not had a bye yet. Nobody gets a second bye while someone in their group has not had one.
