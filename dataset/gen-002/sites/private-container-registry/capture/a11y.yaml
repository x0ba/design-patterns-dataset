- main:
  - text: Critical · CVSS 9.8
  - heading "CVE-2026-41187" [level=1]
  - text: Published Nov 16, 2026, 6:40 AM · 2 hours ago
  - paragraph:
    - strong: libssl3
    - text: in debian:12 base images pushed before Nov 14, 2026, 12:00 AM. Matched on base family and push date.
  - paragraph: Out-of-bounds read in OpenSSL's TLS handshake parser, shipped in the libssl3 package of Debian 12 (bookworm). A remote peer can trigger it during the handshake, which can crash the process or expose adjacent heap memory. Any TLS listener that accepts untrusted clients is exposed. Fixed in debian:12 base images rebuilt on or after Nov 14, 2026. Images built earlier still ship the vulnerable libssl3 until they are rebuilt on the new base.
  - text: 17 Affected tags across 9 repositories 4 Labelled prod Rebuild before anything else 8 Deployed or pulled in 7 days 4 prod, 3 staging, 1 pulled in 7 days 9 Cold No deploy label, no recent pulls
  - note:
    - strong: 3 tags on node:20-bookworm were built before Nov 14 and are not counted above.
    - text: Bookworm is Debian 12 underneath. Check their libssl3 version before you call the list complete.
