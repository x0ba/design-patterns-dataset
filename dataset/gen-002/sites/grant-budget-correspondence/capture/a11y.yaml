  - button "Reply"
  - text: Also about this charge
  - button "Dr. Beatriz Amaral last reply Nov 8 · via satellite"
  - button "Wes Haldane last reply Oct 31"
  - text: Response due Fri, Nov 20 4 business days after today Dr. Amaral is at sea until the same day and only gets satellite mail around 6 AM and 6 PM. Send the PI question first so it goes out with tonight’s sync.
  - button "Ask Dr. Amaral"
  - article: GT Greg TanakaSenior Grants Accountant · Sponsored Projects Accounting Tue, Nov 10 · 2:14 PM to you Hi Teodora, In the October ledger review for OCE-2291 I'm seeing a $4,312.60 charge from Pacific Marine Fuel (invoice PMF-88213, dated Oct 9) posted to Field supplies (53110). Fuel at that amount doesn't look like a field supply to me. Can you tell me what it was for? Thanks, Greg
  - article: TI YouLab & Finance Manager · Larkin Cove Marine Station Tue, Nov 10 · 4:52 PM to Greg Tanaka Hi Greg, That's diesel for the R/V Sea Lark during Dr. Amaral's kelp survey cruise in early October. I think it was keyed to field supplies by mistake when AP entered the invoice. Let me pull the vessel log and the cruise plan and get back to you. Teodora
  - article: "GT Greg TanakaSenior Grants Accountant · Sponsored Projects Accounting Thu, Nov 12 · 10:05 AM to you Thanks. Two things came up when I looked closer: 1. The station recharge center already billed OCE-2291 for Sea Lark day rates — five days at $2,850, posted Oct 31. If fuel is included in that rate, this would be a duplicate charge. 2. The invoice we have on file is a one-line summary (\"Fuel delivery – Dock B\"). It doesn't show gallons, unit price, or which vessel was fueled. I'll need to take this to our post-award review on Friday. Greg"
  - article: "GT Greg TanakaSenior Grants Accountant · Sponsored Projects Accounting Fri, Nov 13 · 3:30 PM to you Flagged: possibly unallowable Teodora, Our post-award review today flagged PMF-88213 ($4,312.60) as potentially unallowable on OCE-2291 as currently documented. To keep it on the award, please send the following by end of day Friday, Nov 20 (5 business days): • A written justification of how the fuel benefited OCE-2291 and why it isn't already covered by the Sea Lark day rate • An itemized invoice from Pacific Marine Fuel (gallons, unit price, fees, vessel fueled) • The vessel log for the cruise • PI confirmation of the cruise dates, and that the vessel time was for this award only • A cost transfer moving the charge from Field supplies (53110) to Vessel operations (54620) If we can't document it by the 20th, we'll have to move the charge to the station's unrestricted account and the department would absorb it. Happy to talk by phone if that's easier — x4-7716. Greg Tanaka Senior Grants Accountant, Sponsored Projects Accounting"
