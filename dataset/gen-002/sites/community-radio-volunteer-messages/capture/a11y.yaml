  - listitem:
    - button "Margit Halvorsen Fri Dead air Thursday night?? To whoever reads this, I had KRVT on in the shop Thursday evening for the world music program and around a quarter to ten it just went silent. Nothing for ten minutes or more. I thought my radio had died, then I checked another station and it was fine. I give $10 a month to this station because I like having something local on. I'd like to know somebody is minding the store. Is this going to keep happening? Margit Halvorsen Halvorsen Upholstery, 214 Front St. Waiting 3d Dead air 11/12"
  - listitem:
    - button "Abel Nguyen Thu Hi Dev! I filled out the volunteer form at the open house in October and Carol said you're the person to ask about board-op training. I'm free most evenings and Saturdays. Is there a session coming up? Thanks, Abel Waiting 4d"
