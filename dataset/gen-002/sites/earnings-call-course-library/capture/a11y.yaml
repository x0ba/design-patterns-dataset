    - text: Prepared remarks · CEO
    - button "Play from 0:00": 0:00
    - text: Priya Shah Harrowgate Outdoor
    - paragraph: Good afternoon, and welcome to Harrowgate Outdoor's third-quarter fiscal 2026 earnings call. I'm Priya Shah, Vice President of Investor Relations. With me are Caroline Vance, our Chief Executive Officer, and Nathan Okoro, our Chief Financial Officer. Today's remarks include forward-looking statements that are subject to the risks in our filings, and we will refer to adjusted measures reconciled in today's release. Caroline, please go ahead.
    - button "Save this segment as a quote from 0:00": Save
    - button "Play from 0:58": 0:58
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: Thank you, Priya, and good afternoon, everyone. Third-quarter comparable sales rose 3.2%, ahead of our plan, and adjusted operating margin came in at 9.4%. The quarter was driven by a stronger back-to-school and a better-than-expected response to our fall product drops, especially layering and cold-weather footwear.
    - button "Save this segment as a quote from 0:58": Save
    - button "Play from 3:20": 3:20
    - paragraph: Comparable-store traffic was positive for the first time since the second quarter of last year. Average ticket was flat, which tells us the customer is coming back more often rather than trading up. I'll come back to how we measure that in our loyalty data.
    - button "Save this segment as a quote from 3:20": Save
    - button "Play from 6:10": 6:10
    - paragraph: We opened 11 stores and closed 4 underperforming locations, ending the quarter at 412. The Harrowgate Trailhead format, a smaller-footprint store we piloted in Denver and Boise, is running about 18% ahead of our legacy box on sales per square foot after two quarters.
    - button "Save this segment as a quote from 6:10": Save
    - button "Play from 9:35": 9:35
    - paragraph: Digital sales grew 6%. Members of Harrowgate Summit, our loyalty program, now account for 58% of online sales. Member visit frequency is up, and the redemption rate on outerwear rewards is the highest we have recorded.
    - button "Save this segment as a quote from 9:35": Save
    - button "Play from 12:05": 12:05
    - paragraph: Before Nathan takes you through the numbers, a word on the holiday setup. We are investing in inventory discipline, not in volume. We would rather end the year with clean shelves than with a warehouse full of last season's shell jackets. Nathan?
    - button "Save this segment as a quote from 12:05": Save
    - text: Prepared remarks · CFO
    - button "Play from 14:10": 14:10
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Thank you, Caroline, and good afternoon. Net sales were $1.36 billion, up 4.1% year over year. Gross margin was 40.1%, up 30 basis points, driven by lower air freight and fewer clearance units in the back half of the quarter. SG&A leveraged modestly.
    - button "Save this segment as a quote from 14:10": Save
    - button "Play from 16:45": 16:45
    - paragraph: Adjusted diluted earnings per share were $1.42, compared with $1.31 a year ago and above the $1.30 to $1.36 range we gave in August.
    - button "Save this segment as a quote from 16:45": Save
    - button "Play from 19:30": 19:30
    - paragraph: Turning to the full year. We are reaffirming our fiscal 2026 adjusted gross margin outlook of approximately 39.5%. That reflects the path we laid out in August, with ocean freight stable and promotional depth in line with the plan we built this summer. Our adjusted operating margin outlook is unchanged at 8.6% to 8.9%.
    - button "Save this segment as a quote from 19:30": Save
    - complementary "Course note at 19:42":
      - text: Course note · 19:42
      - paragraph:
        - strong: "Professor Chen:"
        - text: Reaffirmed full-year guide. Note the exact wording ("approximately 39.5%"). You will need it to compare with the Q2 call.
    - button "Play from 21:40": 21:40
    - paragraph: On the balance sheet, liquidity is $740 million, including undrawn revolver capacity. Our capital allocation priorities have not changed.
    - button "Save this segment as a quote from 21:40": Save
    - button "Play from 22:04": 22:04
    - paragraph: Inventory ended the quarter at $612 million, up 6% year over year, against store growth of 4%. About 70% of our holiday receipts are already in our distribution centers, and in-transit goods are the smallest share of the balance we have carried in three years.
    - button "Save this segment as a quote from 22:04": Save
    - button "Play from 24:10": 24:10
    - paragraph: On capital returns, we repurchased $45 million of stock in the quarter and have $180 million remaining under the current authorization. Capital expenditures were $38 million, mostly new-format build-outs and the distribution center automation pilot.
    - button "Save this segment as a quote from 24:10": Save
    - button "Play from 25:20": 25:20
    - paragraph: For the fourth quarter, we expect comparable sales growth of 1% to 3% and adjusted operating margin of about 8.0%, reflecting holiday mix. That concludes our prepared remarks. Operator, please open the line for questions.
    - button "Save this segment as a quote from 25:20": Save
    - text: Analyst Q&A
    - button "Play from 26:30": 26:30
    - text: Operator Harrowgate Outdoor
    - paragraph: Thank you. We will now begin the question-and-answer session. Please limit yourself to one question and one follow-up. Our first question comes from Ben Lindqvist of Northgate Partners.
    - button "Save this segment as a quote from 26:30": Save
    - button "Play from 26:40": 26:40
    - text: Ben Lindqvist Northgate Partners Question
    - paragraph: Thanks, and congratulations on the traffic turn. Caroline, you said ticket was flat. How are you thinking about promotional versus full-price units into December, and are you seeing trade-down in the core tiers?
    - button "Save this segment as a quote from 26:40": Save
    - button "Play from 27:50": 27:50
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: We're not seeing trade-down in the core, Ben. The customer buying a $180 shell is buying the $180 shell. Where we see price sensitivity is in entry-level fleece, where about 9% of units have moved to promotional pricing since October.
    - button "Save this segment as a quote from 27:50": Save
    - button "Play from 29:10": 29:10
    - paragraph: Summit data helps here. Members who received a personalized offer in September came back about 1.4 times as often in October as members who did not. That is a better read on demand than the aggregate comp.
    - button "Save this segment as a quote from 29:10": Save
    - button "Play from 30:05": 30:05
    - text: Maya Castellano Brightwater Research Question
    - paragraph: Maya Castellano, Brightwater Research. Nathan, inventory was up 6% against store growth of 4%. How much of that sits in outerwear, and how much markdown exposure are you carrying into January?
    - button "Save this segment as a quote from 30:05": Save
    - button "Play from 31:10": 31:10
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Outerwear is roughly 45% of the increase. We bought deeper into the cold-weather shell program in July because lead times from our supplier base stretched. We have reserved for 2 to 3 points of potential markdown on fourth-quarter outerwear receipts, and we would rather carry that than be short in November.
    - button "Save this segment as a quote from 31:10": Save
    - button "Play from 32:40": 32:40
    - text: Maya Castellano Brightwater Research Question
    - paragraph: So that reserve is already in the gross margin outlook?
    - button "Save this segment as a quote from 32:40": Save
    - button "Play from 32:50": 32:50
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: It is, which is part of why we are comfortable reaffirming the 39.5% for the year. I can come back to the margin in more detail if you want it.
    - button "Save this segment as a quote from 32:50": Save
    - button "Play from 33:30": 33:30
    - text: Maya Castellano Brightwater Research
    - paragraph: Thanks, that's helpful.
    - button "Save this segment as a quote from 33:30": Save
    - button "Play from 33:45": 33:45
    - text: Samuel Doherty Fairhaven Capital Question
    - paragraph: Samuel Doherty, Fairhaven Capital. On e-commerce, digital grew 6%, a clear slowdown from the high single digits in the first half. Is that a deliberate choice around shipping thresholds, or is it demand?
    - button "Save this segment as a quote from 33:45": Save
    - button "Play from 34:40": 34:40
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: It's deliberate, Samuel. We raised the free-shipping threshold to $75 in September because our margin on sub-threshold orders was too thin, and we gave up some low-basket orders. Average order value is up, and contribution margin per order is up about 40 basis points.
    - button "Save this segment as a quote from 34:40": Save
    - button "Play from 36:00": 36:00
    - text: Samuel Doherty Fairhaven Capital Question
    - paragraph: So you would accept slower digital growth for better unit economics?
    - button "Save this segment as a quote from 36:00": Save
    - button "Play from 36:10": 36:10
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: Yes. Growth at any cost is how you end up with a clearance problem in January.
    - button "Save this segment as a quote from 36:10": Save
    - button "Play from 37:15": 37:15
    - text: Jun Park Cordell & Vine Question
    - paragraph: Jun Park, Cordell and Vine. Caroline, you opened 11 stores and closed 4. Is the Trailhead format still on track for the 60 locations you outlined in August?
    - button "Save this segment as a quote from 37:15": Save
    - button "Play from 38:10": 38:10
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: We're on track for 60 by the end of fiscal 2027, but the mix is shifting. Next year we will open fewer large-box formats and more Trailheads in suburban markets, where we have the clearest evidence of demand.
    - button "Save this segment as a quote from 38:10": Save
    - button "Play from 39:30": 39:30
    - text: Jun Park Cordell & Vine Question
    - paragraph: What is the capex implication? Is the build-out lower per store?
    - button "Save this segment as a quote from 39:30": Save
    - button "Play from 39:45": 39:45
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: About 25% lower per store, mostly because we are reusing existing fixtures and leasing smaller footprints. We will give you the full capex bridge in February.
    - button "Save this segment as a quote from 39:45": Save
    - button "Play from 40:30": 40:30
    - text: Alexandra Frost Meridian Equity Research Question
    - paragraph: Alexandra Frost, Meridian Equity Research. Nathan, in your prepared remarks you reaffirmed approximately 39.5% for the full year. Given the freight and promotional cadence you described for the holiday, does 39.5% still feel like the right anchor?
    - button "Save this segment as a quote from 40:30": Save
    - button "Play from 40:58": 40:58
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: Nathan will take that one directly, Alexandra.
    - button "Save this segment as a quote from 40:58": Save
    - button "Play from 41:15": 41:15
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Alexandra, I'll be direct, because the question deserves it. When we spoke about 39.5% in prepared remarks, that was our best view as of late October. Since then two things have moved. Ocean freight for the holiday window came in roughly 90 basis points above our plan, and we are running deeper promotional depth in outerwear clearance than we budgeted.
    - button "Save this segment as a quote from 41:15": Save
    - complementary "Course note at 41:15":
      - text: Course note · 41:15
      - paragraph:
        - strong: "Professor Chen:"
        - text: margin guidance revision — listen carefully
    - button "Play from 41:52": 41:52
    - paragraph: So I would be doing you a disservice if I kept 39.5% as the anchor. Our working plan for the full year is now 38.8% to 39.0% adjusted gross margin, and I would put us closer to the bottom of that range than the top.
    - button "Save this segment as a quote from 41:52": Save
    - button "Play from 42:31": 42:31
    - text: Alexandra Frost Meridian Equity Research Question
    - paragraph: So that's a revision of roughly 50 to 70 basis points from the 39.5% you reaffirmed earlier on this call?
    - button "Save this segment as a quote from 42:31": Save
    - button "Play from 42:40": 42:40
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: That is the right way to frame it. The 39.5% assumed a promotional cadence we no longer expect to hold, and I would rather reset the number now than in February.
    - button "Save this segment as a quote from 42:40": Save
    - button "Play from 43:10": 43:10
    - text: Alexandra Frost Meridian Equity Research Question
    - paragraph: And the fourth quarter specifically?
    - button "Save this segment as a quote from 43:10": Save
    - button "Play from 43:18": 43:18
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Fourth-quarter gross margin should be down year over year by roughly 60 basis points, primarily from freight and clearance. We are not planning for that to reverse before spring receipts arrive.
    - button "Save this segment as a quote from 43:18": Save
    - button "Play from 43:55": 43:55
    - text: Alexandra Frost Meridian Equity Research
    - paragraph: Thank you. That's clear.
    - button "Save this segment as a quote from 43:55": Save
    - button "Play from 44:20": 44:20
    - text: Tom Weller Pelham Street Research Question
    - paragraph: Tom Weller, Pelham Street Research. I want to push on the framing. Caroline, is this timing, as the first part of Nathan's answer suggests, or is it structural to the margin model?
    - button "Save this segment as a quote from 44:20": Save
    - button "Play from 44:50": 44:50
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: "Mostly timing, Tom. Freight normalizes in the spring, and the clearance we are running now cleans up outerwear receipts. It is not a change in how we price. The structural story has not changed: private label and the Trailhead format still add about 150 basis points of gross margin over three years."
    - button "Save this segment as a quote from 44:50": Save
    - complementary "Course note at 44:50":
      - text: Course note · 44:50
      - paragraph:
        - strong: "Professor Chen:"
        - text: The CEO calls this "mostly timing." Test that framing against the CFO's answer at 41:15.
    - button "Play from 45:50": 45:50
    - text: Tom Weller Pelham Street Research Question
    - paragraph: You said mostly timing, but Nathan revised the full-year number in the same breath. Which is it?
    - button "Save this segment as a quote from 45:50": Save
    - button "Play from 46:25": 46:25
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Both can be true. The full-year number reflects timing, and the three-year model is structural. We will refresh the three-year framework in February with the new store formats.
    - button "Save this segment as a quote from 46:25": Save
    - button "Play from 47:20": 47:20
    - text: Tom Weller Pelham Street Research
    - paragraph: Fair enough. Thank you.
    - button "Save this segment as a quote from 47:20": Save
    - button "Play from 47:50": 47:50
    - text: Rafi Haddad Ironbark Securities Question
    - paragraph: Rafi Haddad, Ironbark Securities. Quick one on capital returns. With $180 million left on the authorization and the margin revision, are you still planning to repurchase at the same pace in the fourth quarter?
    - button "Save this segment as a quote from 47:50": Save
    - button "Play from 48:35": 48:35
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: We'll be more measured. We bought $45 million this quarter. Given the revised margin outlook, I would expect fourth-quarter repurchases closer to $25 million, and we will revisit with February results.
    - button "Save this segment as a quote from 48:35": Save
    - button "Play from 49:30": 49:30
    - text: Rafi Haddad Ironbark Securities Question
    - paragraph: Got it. Did the Summit membership count change its enrollment criteria?
    - button "Save this segment as a quote from 49:30": Save
    - button "Play from 49:45": 49:45
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: No change. We have 4.1 million active members, on the same definition we have used since fiscal 2024.
    - button "Save this segment as a quote from 49:45": Save
    - button "Play from 51:20": 51:20
    - text: Keisha Monroe Stonebridge Asset Management Question
    - paragraph: Keisha Monroe, Stonebridge Asset Management. Two questions on costs. Are distribution center wage rates running above plan after the automation pilot, and what does that mean for SG&A leverage in fiscal 2027?
    - button "Save this segment as a quote from 51:20": Save
    - button "Play from 52:10": 52:10
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: Wages are about 3% above plan in the two pilot DCs, and automation offsets roughly half of that. We expect modest SG&A leverage in fiscal 2027, around 10 to 20 basis points.
    - button "Save this segment as a quote from 52:10": Save
    - button "Play from 53:20": 53:20
    - text: Keisha Monroe Stonebridge Asset Management Question
    - paragraph: And the store count for next year? Are you still planning 20 to 25 net new?
    - button "Save this segment as a quote from 53:20": Save
    - button "Play from 53:35": 53:35
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: Closer to 15 to 20 net new, given the format shift. We will give you the detailed plan in February.
    - button "Save this segment as a quote from 53:35": Save
    - button "Play from 54:40": 54:40
    - text: Keisha Monroe Stonebridge Asset Management
    - paragraph: Thanks, that helps.
    - button "Save this segment as a quote from 54:40": Save
    - button "Play from 54:50": 54:50
    - text: Lucia Ferreira Ashgrove Capital Question
    - paragraph: Lucia Ferreira, Ashgrove Capital. Back to the holiday guide. Your fourth-quarter comp range is 1% to 3%. Does that already include the clearance you are describing, or is it a separate line?
    - button "Save this segment as a quote from 54:50": Save
    - button "Play from 55:35": 55:35
    - text: Nathan Okoro Harrowgate Outdoor
    - paragraph: It is included. The comp range is on sales, so clearance supports units but does not change the comp math. Fourth-quarter sales guidance is unchanged. The change is in margin.
    - button "Save this segment as a quote from 55:35": Save
    - button "Play from 56:20": 56:20
    - text: Lucia Ferreira Ashgrove Capital Question
    - paragraph: "Clear. Last one: any change to the digital target?"
    - button "Save this segment as a quote from 56:20": Save
    - button "Play from 56:35": 56:35
    - text: Caroline Vance Harrowgate Outdoor
    - paragraph: No change. We still target digital at 22% of sales by fiscal 2028. The threshold change is about profitable growth, not the target.
    - button "Save this segment as a quote from 56:35": Save
    - button "Play from 57:50": 57:50
    - paragraph: Thank you, all. Traffic and member engagement were good this quarter. Our full-year margin view has changed, and we said so plainly today. We would rather reset expectations once, carefully, than have to do it again in February. Thank you for joining us.
    - button "Save this segment as a quote from 57:50": Save
    - button "Play from 60:10": 60:10
    - text: Operator Harrowgate Outdoor
    - paragraph: This concludes today's conference call. A replay will be available on the Harrowgate Outdoor investor relations website.
    - button "Save this segment as a quote from 60:10": Save
    - text: End of recording
