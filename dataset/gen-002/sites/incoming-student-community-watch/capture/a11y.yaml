  - text: TO Taylor Okonkwo Hartwell Hall 2030 · 10:47
  - paragraph:
    - text: honestly does anyone else feel like they're faking being excited? everyone in here is posting dorm hauls and i haven't really left my room in like a week. my parents keep fighting about whether we can even pay for this and it's my fault for picking here. i'm so tired.
    - mark: not sure there's a point in me showing up on the 25th
  - text: Maya Lindgren 10:52 you're not alone fr, i'm lowkey terrified too. we can get lunch move-in week if you want 🫶 Ben Ashworth 11:05 dm me if you want to talk, i'm first gen too and the money stuff is so stressful. financial aid office actually helped my sister a lot Kezia Morales 11:40 hey are you okay? that last line kinda worried me
