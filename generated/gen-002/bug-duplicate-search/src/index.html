<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dupehound · Find existing reports</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">DH</span>
          <div>
            <div class="brand-name">Dupehound</div>
            <div class="brand-sub">Find existing reports before you file</div>
          </div>
        </div>
        <div class="topbar-right">
          <span id="dbstats" class="dbstats"></span>
          <span class="who"><span class="avatar" aria-hidden="true">AB</span><span id="who"></span></span>
        </div>
      </header>

      <section class="session" id="session" aria-label="Current session"></section>

      <main class="layout">
        <aside class="panel filters" id="filters" aria-label="Filters"></aside>

        <section class="panel results" aria-label="Search results">
          <div class="searchbar">
            <label class="sr-only" for="q">Describe what you saw</label>
            <div class="searchbox">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="q" type="search" autocomplete="off" spellcheck="false" />
              <kbd class="kbd" aria-hidden="true">/</kbd>
            </div>
            <div class="search-sub">
              <label class="check inline">
                <input type="checkbox" id="incsig" />
                <span>Match on dump signature <code id="sigchip"></code></span>
              </label>
              <span class="hint">↑ ↓ move between results</span>
            </div>
          </div>
          <div id="banner"></div>
          <div id="resultsHead"></div>
          <div class="list-wrap" id="listWrap">
            <ol id="list" class="list" aria-label="Matching reports"></ol>
            <div id="more"></div>
          </div>
        </section>

        <aside class="panel detail" id="detail" aria-live="polite"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
