# Batch 001 — seed sampling frame.
#
# Variety first (README "Choosing Websites"): at least two sites from every
# domain in schema/label.schema.json, mixing marketing pages with working app
# surfaces that need no login. `domain` here is the curated sampling stratum;
# raters assign their own `site.domain` independently.
#
# Check the frame before running:  node scripts/site-variety.ts sites/batch-001.yaml
# Some sites block headless browsers; those captures fail and show as "failed".

batch: batch-001
sites:
  # productivity
  - { url: https://linear.app, domain: productivity }
  - { url: https://www.notion.com, domain: productivity }
  - { url: https://todoist.com, domain: productivity }
