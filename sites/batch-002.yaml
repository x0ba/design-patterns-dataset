# Batch 002 — gap-fill sampling frame.
#
# Fills what batch-001 under-covers: working app surfaces reachable without
# login (playgrounds, public dashboards, search results, demos, docs), the
# domains batch-001 sampled only lightly, non-English sites (ja, de, fr, pt-BR)
# and older or dated designs. No host from batch-001 is repeated. `domain` is
# the curated sampling stratum from schema/label.schema.json; raters assign
# their own `site.domain` independently. Each note opens with where the site
# came from: [popular] widely used site, [demo] public product or open-source
# demo, [long-tail] niche, institutional or dated site.
#
# Every URL loaded with HTTP 200 in headless Chromium (same launch flags and
# context as src/pipeline/capture.ts) on 2026-11-09. Sites that served a
# Cloudflare, Akamai or other bot wall to headless Chromium were dropped.
#
# Check the frame before running:  node scripts/site-variety.ts sites/batch-002.yaml

batch: batch-002
sites:
  # productivity (kanban, spreadsheet, admin dashboard)
  - { url: https://trello.com/b/nC8QJJoZ/trello-development-roadmap, domain: productivity, note: "[popular] Public Trello board: kanban columns and cards." }
  - { url: https://bossanova.uk/jspreadsheet/, domain: productivity, note: "[demo] Live spreadsheet / data-grid demo embedded in the page." }
  - { url: https://preview.tabler.io/, domain: productivity, note: "[demo] Open-source admin dashboard template: internal-tool layout, tables, KPI cards." }
  # developer tools
  - { url: https://regex101.com/, domain: developer-tools, note: "[popular] Dense multi-pane tool UI." }
  - { url: https://www.typescriptlang.org/play, domain: developer-tools, note: "[popular] Code playground: editor, output panes, settings menus." }
  # reference & docs (dated / dense)
  - { url: https://pkg.go.dev/net/http, domain: reference-docs, note: "[popular] Package API reference: long page with sidebar TOC, code blocks and an index." }
  - { url: https://man7.org/linux/man-pages/man1/ls.1.html, domain: reference-docs, note: "[long-tail] Linux man page; 1990s-style monospace layout." }
  # AI tools
  - { url: https://huggingface.co/models, domain: ai-tools, note: "[popular] Model search results with facet filters." }
  - { url: https://openrouter.ai/models, domain: ai-tools, note: "[popular] Model catalog with filters, pricing columns." }
  # finance
  - { url: https://finance.yahoo.com/quote/AAPL/, domain: finance, note: "[popular] Quote page: charts, data tables, ad slots. A consent or sign-in prompt may appear." }
  - { url: https://www.tradingview.com/chart/, domain: finance, note: "[popular] Full-screen charting app with toolbars and drawing tools." }
  - { url: https://www.bankrate.com/mortgages/mortgage-calculator/, domain: finance, note: "[popular] Calculator form with live results and amortization table." }
  # commerce
  - { url: https://demo.saleor.io/, domain: commerce, note: "[demo] Open-source storefront demo; product grid, product page and cart are reachable." }
  - { url: https://www.rakuten.co.jp/, domain: commerce, note: "[popular] Japanese marketplace; very dense, banner-heavy layout." }
  - { url: https://sfbay.craigslist.org/, domain: commerce, note: "[popular] Classifieds; dated, text-only link directory. Redirects to craigslist.org/area/sfbay." }
  # media & entertainment (music / audio)
  - { url: https://www.last.fm/music, domain: media-entertainment, note: "[popular] Music discovery: charts, artist cards, tag lists." }
  - { url: https://musicbrainz.org/, domain: media-entertainment, note: "[long-tail] Open music database; dated wiki-style design." }
  - { url: https://radio.garden/, domain: media-entertainment, note: "[long-tail] 3D globe of live radio stations; map-first audio app." }
  # news & publishing (non-English, text-only)
  - { url: https://www.asahi.com/, domain: news-publishing, note: "[popular] Japanese newspaper; dense, CJK typography." }
  - { url: https://text.npr.org/, domain: news-publishing, note: "[long-tail] Text-only lite site; almost no styling." }
  # social & community
