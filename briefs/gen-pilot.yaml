    generator: sonnet
    product: Wayfarer's Ledger
    summary: Campaign-keeping tool for tabletop role-playing game masters who run open-world hex-crawl campaigns with rotating groups of players.
    user: Darnell Okafor, a hobbyist game master who has run a West Marches-style fantasy campaign for 14 months with a pool of 11 players who sign up for sessions ad hoc. He preps on weeknights and knows his region intimately but relies on his notes for what each group has actually seen.
    moment: "It is Wednesday evening and Saturday's group of four just posted their plan in the campaign chat: leave the frontier town of Greyhollow, cross the Mirefen, and reach a ruined watchtower another group glimpsed from a distance two sessions ago. Darnell needs to trace the likely route hex by hex, see which hexes have been explored by any party versus only rumored, how terrain changes travel days, where his prepared encounters and lairs sit along or near the path, and pick the two or three hexes where he'll spend his remaining prep time. He also wants to note a shorter but riskier alternate path the party might choose instead."
    data: "Region 'The Ashen March': 24×18 grid of 6-mile hexes (432 hexes), coordinates like 0712. Terrain types: plains, forest, marsh, hills, mountains, river, road; travel cost 1 day for plains/road, 2 for forest/hills, 3 for marsh. Exploration state: 63 hexes explored, 29 rumored, 340 unknown to players. Greyhollow is at hex 1004; the watchtower is at 1409, sighted but unvisited. 41 keyed locations (e.g. 'Drowned Chapel' 1206, 'Bogwife's Hut' 1307, 'Wyvern roost' 1510), 7 lairs with threat level 1–5, 3 faction camps (Ashen Pilgrims, River Wardens, a bandit crew called the Lantern Men). Session log of 22 past expeditions with which players went and which hexes they entered. Saturday party: Priya (ranger, lvl 4), Sam (cleric, lvl 3), Kofi (rogue, lvl 4), Lena (wizard, lvl 2); 6 days of rations. Weather for the in-game week: rain on days 2–3, raising marsh travel by one day."
