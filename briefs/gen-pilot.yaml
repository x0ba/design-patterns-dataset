  - slug: podcast-retention-ad-analysis
    domain: media-entertainment
    archetype: analyze
    generator: haiku
    product: Earshot Analytics
    summary: Internal listening-analytics tool for an independent podcast network to study how audiences listen through episodes and how ad placement affects drop-off.
    user: Maya Lindqvist, audience insights lead at a 40-person podcast network. She is comfortable with data and spreadsheets but not a programmer, and she reports to the head of sales and the show producers.
    moment: In August the network moved the mid-roll ad slot in its narrative shows from around minute 18 to around minute 25, at sales' request. Producers of two shows now claim listeners are bailing earlier. Maya has a Friday meeting and needs to find out whether completion rates and per-minute retention actually changed after the move, whether the effect differs by show, episode length or listening platform, and whether any shows are outliers. She is comparing retention patterns before and after August 4, grouping shows, and drilling into individual episodes that look unusual so she can bring a defensible recommendation.
    data: "14 shows (6 narrative, 5 interview, 3 daily news), 1,186 episodes from January 2025 to November 2026. Per-episode metrics: downloads (range 3,200–410,000), starts, average listen-through percentage, completion rate, episode length (9–92 minutes), mid-roll position in minutes, number of ad breaks (1–4), and platform split (Apple, Spotify, network app, other). Per-minute retention values for each episode (share of starting listeners still listening at each minute). Ad-change date: 4 August 2026; 212 narrative episodes before, 58 after. Example shows: 'The Salt Road' (narrative, ~48 min, completion fell from 61% to 52%), 'Hollow Verdict' (narrative true crime, ~55 min, roughly unchanged at 58%), 'Morning Ledger' (daily news, ~14 min, no mid-roll). Notes from producers on 9 episodes, e.g. 'host illness, guest host' and 'released during platform outage 3 Sept'."
    echo:
