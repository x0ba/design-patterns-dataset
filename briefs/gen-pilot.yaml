  - slug: type-foundry-glyph-review
    domain: design-creative
    archetype: collaborate
    generator: opus
    product: Serifhouse
    summary: Shared workspace where a small independent type foundry and its contractors draw, review and sign off on glyphs for a typeface family in progress.
    user: Ines Varga, co-founder and lead type designer at a three-person foundry in Lisbon. She draws the Latin glyphs herself and coordinates two outside contractors; she is very experienced and particular about curve quality.
    moment: It is Thursday morning and the foundry's new text family, 'Calloway', is due to the client, a Dutch newspaper, in nine days. Overnight, the Greek contractor in Athens revised 31 Greek glyphs, and the kerning contractor is online right now adjusting pairs in the Bold weight. Ines needs to see who is working in the family at the moment and on what, check what changed since her last review on Tuesday, approve or send back the Greek revisions with comments, and make sure the kerning contractor can only touch spacing and kerning, not outlines. She also has to decide whether to lock the Regular weight's Latin set as final before handing it to the newspaper's art director for a read-only look.
    data: "Family 'Calloway' with 4 weights (Light, Regular, Semibold, Bold) and 2 italics; 612 glyphs per style covering Latin Extended-A and Greek. Collaborators: Ines Varga (owner, full edit), Tomás Reis (co-founder, full edit, last active 2 days ago), Eleni Markou (Greek contractor, may edit outlines only in the Greek range, last active 6 hours ago), Jonas Brandt (kerning contractor, spacing/kerning only, active now in Bold), Marieke de Wit (client art director, view and comment only, invited but not yet joined). Change history since Tuesday 16:40: 31 Greek glyphs revised by Eleni (e.g. alpha, lambda, xi, final sigma) across Regular and Bold; 214 kerning pairs changed by Jonas in Bold, 18 of them flagged by him as 'unsure'; Tomás adjusted the ampersand and 'g' in Light. Glyph statuses: Regular Latin 402 approved, 6 in review, 0 draft; Greek 87 in review, 12 draft. 9 open comment threads, 3 addressed to Ines, oldest from 4 days ago about the italic 'f' descender. Delivery deadline 22 November."
    echo:
      - 'annotation: "comments"'
      - 'comment-thread: "comment thread"'
      - 'activity-log: "history"'
      - 'tree-view: "outline"'
      - 'undo: "history"'
  - slug: hexcrawl-campaign-travel-planner
